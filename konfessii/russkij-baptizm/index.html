        <h2>Три истока русского баптизма</h2>
        <p>ЕХБ-движение в России сложилось из трёх независимых источников, объединившихся только в 1944 году при создании ВСЕХБ. Интерактивная 3D-карта показывает 23 узла, 27 связей и 5 маршрутов от 1867 года до наших дней.</p>
        <div class="seo-fallback__grid">
          <div class="seo-fallback__card"><strong>Тифлис, 1867</strong> — 20 августа Мартин Кальвейт крестил молоканина Никиту Воронина в реке Куре. Первое крещение русского баптиста по вере. Тифлисская (онкенская) модель: немецкое баптистское влияние, строгая вероучительная дисциплина.</div>
          <div class="seo-fallback__card"><strong>Южная Украина, 1864–1869</strong> — Штундизм: домашние часы чтения Библии среди немецких колонистов и украинских крестьян. Унгер, Цимбал, Рябошапка, Ратушный, Прицкау. Путь к I съезду в Ново-Васильевке 1884 года.</div>
          <div class="seo-fallback__card"><strong>Петербург, 1874</strong> — Лорд Редсток проповедует в аристократических салонах. Пашков, Корф, Каргель, Проханов. 1909 — Всероссийский союз евангельских христиан (ВСЕХ).</div>

/* FIX: wheel/zoom глитч в Three.js OrbitControls внутри iframe.
   Проблема: браузер регистрирует wheel на документе как passive, не давая
   OrbitControls вызвать preventDefault(). Решение: форвардим wheel events
   в iframe с non-passive listener, предотвращая scroll страницы. */
(function(){
  var stage = document.querySelector('.stage');
  if(!stage) return;
  
  // Блокируем scroll страницы пока курсор над 3D-сценой
  var isOver = false;
  stage.addEventListener('mouseenter', function(){ isOver = true; }, {passive:true});
  stage.addEventListener('mouseleave', function(){ isOver = false; }, {passive:true});
  stage.addEventListener('touchstart', function(){ isOver = true; }, {passive:true});
  stage.addEventListener('touchend', function(){ isOver = false; }, {passive:true});
  
  // Non-passive wheel handler — позволяет preventDefault()
  // Three.js OrbitControls сам обрабатывает зум внутри iframe
  // Нам нужно только предотвратить скролл страницы
  document.addEventListener('wheel', function(e){
    if(isOver && e.target && e.target.closest && e.target.closest('.stage')){
      e.preventDefault();
    }
  }, {passive: false});
  
  // Touch-pinch passthrough: предотвращаем bounce/zoom страницы
  stage.addEventListener('touchmove', function(e){
    if(e.touches.length >= 2){
      e.preventDefault(); // Предотвращаем page zoom, Three.js обрабатывает pinch
    }
  }, {passive: false});
  
})();
</script>
