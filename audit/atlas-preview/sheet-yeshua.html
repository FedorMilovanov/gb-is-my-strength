<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Жизнь Иисуса Христа — лист Атласа (светлый, awaiting G9)</title>
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#f6f1e7;stroke-width:5.4;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
  .route{fill:none;stroke:#a25d33;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 7.4;opacity:.95}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:1.2;filter:url(#dotShadow)}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.6;stroke-dasharray:3 2.2}
  .pl{cursor:pointer}
  .glyph path,.glyph circle{fill:rgba(94,74,30,.34);stroke:#6b5216;stroke-width:.9;stroke-linejoin:round}
  .glyph .glyph-line{fill:none;stroke:#6b5216;stroke-width:.9;stroke-linecap:round}
  .glyph .glyph-flame{fill:#a25d33;stroke:none}
  .glyph .glyph-smoke{fill:none;stroke:#8a7a58;stroke-width:.8;opacity:.75;stroke-linecap:round}
  .ruin-halo{fill:rgba(120,100,80,.14);stroke:rgba(120,100,80,.3);stroke-width:.6;stroke-dasharray:2 3}
  .wp-dot{fill:#4a7a52;stroke:#f6f1e7;stroke-width:.9;opacity:.85}
  .leader{stroke:#5c4d33;stroke-width:.9;opacity:.55}
  .mile-c{fill:#f6f1e7;stroke-width:1.6;filter:url(#dotShadow)}
  .mile-cand{stroke-dasharray:3 2.2}
  .mile-t{font:700 1em Georgia,serif}
  text.lab-place{font-family:Georgia,'Times New Roman',serif;font-weight:600;fill:#2b2418;paint-order:stroke;stroke:#f5edd8;stroke-width:.22em;stroke-linejoin:round}
  text.lab-cand{font-style:italic;fill:#5c4a1e}
  text.lab-region{font-family:Georgia,serif;font-weight:600;letter-spacing:.3em;fill:#7a6a48;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:.82;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.3);stroke-width:.8}
  .cart-over{font-family:Georgia,serif;fill:#8a6a1f;letter-spacing:.22em;font-weight:600}
  .cart-title{font-family:Georgia,serif;font-weight:700;fill:#1e3a63}
  .cart-sub{font-family:Georgia,serif;fill:#5c4d33;opacity:.85}
  .leg-t{font-family:Georgia,serif;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  .g9{position:fixed;right:10px;bottom:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}
  .spine-it:hover{background:rgba(138,106,31,.08)}
  .spine-it--on{background:rgba(138,106,31,.14);box-shadow:inset 3px 0 0 #8a6a1f}
  .spine-head{padding:12px 12px 8px;font:700 10px/1 Georgia,serif;letter-spacing:.28em;color:#8a6a1f;border-bottom:1px solid rgba(138,106,31,.25)}
  .spine-cover{position:relative;display:block}
  .spine-cover b{position:absolute;left:6px;top:6px;background:rgba(246,241,231,.92);color:#8a6a1f;font:700 10px/1 Georgia,serif;border-radius:6px;padding:3px 6px;border:1px solid rgba(138,106,31,.4)}
  /* ── Ховер-карточка места: фото раскопок + факт ── */
  .place-card{position:fixed;z-index:30;width:300px;background:#f6f1e7;border:1px solid rgba(138,106,31,.45);border-radius:12px;box-shadow:0 14px 40px rgba(60,45,15,.35);overflow:hidden;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none}
  .place-card.pc--on{opacity:1;transform:none}
  .pc-ph{position:relative;height:130px;background:#e8dcbc}
  .pc-ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pc-ph i{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font:600 9px/1 system-ui;letter-spacing:.12em;color:#fff;background:linear-gradient(transparent,rgba(20,14,4,.72))}
  .pc-body{padding:10px 12px 12px}
  .pc-body b{display:block;font:700 15px/1.2 Georgia,serif;color:#1e3a63}
  .pc-body u{display:block;text-decoration:none;font:600 10.5px/1.3 Georgia,serif;color:#8a6a1f;letter-spacing:.06em;margin-top:2px}
  .pc-body p{margin:7px 0 0;font:400 12px/1.5 Georgia,serif;color:#3a3020}
  /* ── Панель-досье (клик по месту) ── */
  .dossier{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);z-index:26;background:#f6f1e7;border-left:1px solid rgba(138,106,31,.4);box-shadow:-16px 0 44px rgba(60,45,15,.3);transform:translateX(103%);transition:transform .28s ease;display:flex;flex-direction:column}
  .dossier.do--on{transform:none}
  .do-x{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:9px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.95);color:#7a5c26;font-size:19px;cursor:pointer}
  .do-head{padding:16px 54px 12px 18px;border-bottom:1px solid rgba(138,106,31,.25);background:rgba(240,232,210,.6)}
  .do-head b{display:block;font:700 20px/1.2 Georgia,serif;color:#1e3a63}
  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}
  .do-scroll{overflow-y:auto;padding:14px 18px 22px;flex:1}
  .do-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .do-ph{margin:0}
  .do-ph img{width:100%;height:96px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(90,70,30,.3);display:block;background:#e8dcbc}
  .do-ph figcaption{font:600 8.5px/1.3 system-ui;letter-spacing:.08em;color:#7a6a48;margin-top:3px}
  .do-ph figcaption i{display:block;font:400 8px/1.2 system-ui;color:#9a8a68;letter-spacing:0}
  .do-sec{margin:0 0 14px}
  .do-sec h4{margin:0 0 5px;font:700 10.5px/1 Georgia,serif;letter-spacing:.22em;color:#8a6a1f;text-transform:uppercase}
  .do-sec p{margin:0 0 8px;font:400 13.5px/1.6 Georgia,serif;color:#2b2418}
  .do-bible .verse{display:block;padding:10px 12px;background:rgba(30,58,99,.06);border-left:3px solid #1e3a63;border-radius:6px;font:italic 400 13.5px/1.55 Georgia,serif;color:#1e3a63;margin-bottom:8px}
  .do-bible .verse span{display:block;font:700 9.5px/1 system-ui;letter-spacing:.16em;color:#8a6a1f;margin-top:6px;font-style:normal}
  .do-sec .dispute-block{border:1px solid rgba(138,106,31,.35);border-radius:10px;padding:10px 12px;background:rgba(240,232,210,.5)}
  .do-sec .dispute-title{font:700 11px/1.2 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:7px}
  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}
  .do-sec .conf-med,.do-sec .conf-lo,.do-sec .conf-hi{display:inline-block;font:600 9px/1 system-ui;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(138,106,31,.15);color:#7a5c26}
  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  .dive-btn{position:fixed;right:10px;top:10px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}
  .dive-btn:hover{background:#f6f1e7}
  body.dive .spine,body.dive .stage-strip,body.dive .g9{display:none}
  body.dive .wrap{max-width:none;border-radius:0;box-shadow:none}
  body.dive{padding:0}
</style>
</head>
<body>
<div class="wrap"><svg id="sheet-svg" viewBox="430.0 590.0 420 280.0" data-vb="430.0 590.0 420 280.0" xmlns="http://www.w3.org/2000/svg" class="sheet" role="img" aria-label="Жизнь Иисуса Христа — лист Атласа">
<defs>
  <linearGradient id="landG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0e7cf"/><stop offset=".45" stop-color="#e8dcbc"/><stop offset="1" stop-color="#dfd1a9"/>
  </linearGradient>
  <linearGradient id="richLandG" x1="0" y1="0" x2=".5" y2="1">
    <stop offset="0" stop-color="#ece1c2"/><stop offset=".5" stop-color="#e5d8b4"/><stop offset="1" stop-color="#decfa6"/>
  </linearGradient>
  <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe0e9"/><stop offset="1" stop-color="#b4cedd"/>
  </linearGradient>
  <pattern id="seaPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M0,10 Q5,6 10,10 Q15,14 20,10" fill="none" stroke="#7fa7c4" stroke-width=".6" opacity=".38"/>
    <path d="M0,20 Q5,16 10,20 Q15,24 20,20" fill="none" stroke="#7fa7c4" stroke-width=".5" opacity=".26"/>
  </pattern>
  <radialGradient id="fertileG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6b8f4a" stop-opacity=".26"/><stop offset="1" stop-color="#6b8f4a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="jordanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4f7a3f" stop-opacity=".3"/><stop offset="1" stop-color="#4f7a3f" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="desertG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#c09a55" stop-opacity=".2"/><stop offset="1" stop-color="#c09a55" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="negevG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#b08050" stop-opacity=".16"/><stop offset="1" stop-color="#b08050" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sinaiG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a07040" stop-opacity=".18"/><stop offset="1" stop-color="#a07040" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mtG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b7d5a" stop-opacity=".4"/><stop offset="1" stop-color="#8b7d5a" stop-opacity="0"/>
  </linearGradient>
  <pattern id="mountainHatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8b7d5a" stroke-width=".6" opacity=".45"/>
  </pattern>
  <pattern id="desertStipple" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r=".7" fill="#9c7c43" opacity=".4"/>
    <circle cx="9" cy="9" r=".5" fill="#9c7c43" opacity=".3"/>
    <circle cx="6" cy="1" r=".4" fill="#b08050" opacity=".25"/>
  </pattern>
  <filter id="waterRipple" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".8"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="dotShadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy=".7" stdDeviation=".8" flood-color="#3a2c10" flood-opacity=".45"/>
  </filter>
  <radialGradient id="sunGlow" cx=".22" cy=".14" r=".9">
    <stop offset="0" stop-color="#ffdf9a" stop-opacity=".22"/>
    <stop offset=".4" stop-color="#f5d489" stop-opacity=".08"/>
    <stop offset="1" stop-color="#f5d489" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="edgeFog" cx=".5" cy=".5" r=".72">
    <stop offset="0" stop-color="#7a5c26" stop-opacity="0"/>
    <stop offset=".8" stop-color="#7a5c26" stop-opacity="0"/>
    <stop offset="1" stop-color="#6b4f1e" stop-opacity=".18"/>
  </radialGradient>
  <filter id="parchmentGrain">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .2  0 0 0 .05 0"/>
  </filter>
</defs>
<rect x="430" y="590" width="420" height="280" fill="url(#seaG)"/>
<g class="base"><?xml version="1.0" encoding="UTF-8"?>
<!-- base-geo.svg — базовая география Ближнего Востока
     Общая для всех карт: Авраам, Исход, Павел, Давид
     Координаты: viewBox 0 0 1900 1430 (W0×H0)
     Масштаб: 1 SVG-единица ≈ 0.92 км
     НЕ МЕНЯТЬ координатную систему!
     Обновление: при добавлении новых географических объектов
-->

<defs>
  <!-- Все фильтры и градиенты из основного файла -->
  <!-- Импортируются в конкретную карту через <use> или inline -->
</defs>
<!-- ============ TERRAIN ============ -->
<g id="terrain" data-layer="base-geo">
  <rect x="-400" y="-400" width="2700" height="2230" fill="url(#landG)"/>
  <!-- Terrain texture overlay для глубины рельефа -->
  <rect x="-400" y="-400" width="2700" height="2230" fill="url(#richLandG)" opacity=".3" filter="url(#terrainTex)"/>

  <!-- deserts / fertile tints -->
  <ellipse cx="1240" cy="1010" rx="520" ry="330" fill="url(#desertG)"/>
  <ellipse cx="470" cy="1130" rx="260" ry="220" fill="url(#desertG)"/>
  <ellipse cx="560" cy="930" rx="170" ry="110" fill="url(#desertG)"/>
  <ellipse cx="1280" cy="520" rx="430" ry="200" fill="url(#fertileG)" transform="rotate(28 1280 520)"/>
  <ellipse cx="640" cy="700" rx="110" ry="240" fill="url(#fertileG)"/>
  <ellipse cx="220" cy="930" rx="120" ry="120" fill="url(#fertileG)"/>
  <path fill="url(#fertileG)" d="M226,1014 C196,964 168,916 142,868 L304,860 C280,912 252,964 226,1014 Z"/>

  <!-- mountain ridges (decorative) -->
  <g stroke="#6b6248" stroke-width="2" fill="none" opacity=".14" filter="url(#soft)">
    <path d="M120,160 Q300,110 470,150 Q620,180 760,150 Q900,118 1060,160"/>
    <path d="M180,205 Q330,165 480,195 Q640,225 800,196"/>
    <path d="M1430,110 Q1530,210 1610,310 Q1700,430 1790,560 Q1840,640 1880,720"/>
    <path d="M1500,90 Q1600,190 1680,300 Q1770,430 1860,560"/>
    <path d="M668,520 Q676,560 670,600"/>
    <path d="M652,758 Q646,800 640,845"/>
  </g>

  <!-- Ливанские горы / Антиливан (северный Ханаан) -->
  <g opacity=".22" filter="url(#soft)">
    <path fill="url(#mtG)" d="M590,500 C610,480 630,460 655,448 C670,440 690,435 710,432 C730,429 750,430 760,435 C748,450 730,460 710,468 C688,478 660,488 635,500 C618,508 602,515 590,520 Z"/>
    <path stroke="#8b7d5a" stroke-width="1.5" fill="none" opacity=".7" d="M600,502 Q618,492 636,484 Q660,474 685,468 Q710,462 730,458"/>
    <!-- Отдельные пики (снег на вершинах) -->
    <path d="M640,462 L644,453 L648,462 Z" fill="rgba(230,225,215,.15)" stroke="#a09070" stroke-width=".8"/>
    <path d="M670,446 L675,435 L680,446 Z" fill="rgba(230,225,215,.18)" stroke="#a09070" stroke-width=".8"/>
    <path d="M700,437 L705,425 L710,437 Z" fill="rgba(240,235,225,.2)" stroke="#b0a080" stroke-width=".9"/>
  </g>
  <!-- Ливан label -->
  <text class="region-label lbl-z1" x="665" y="428" font-size="5.5" fill="#a09070" opacity=".5" letter-spacing=".2em" transform="rotate(-5 665 428)">ЛИВАН · לְבָנוֹן</text>
  <!-- Иудейские горы / Самария — хребтовая полоса -->
  <g opacity=".12" filter="url(#soft)">
    <path fill="url(#mtG)" d="M597,690 C608,670 618,650 625,630 C630,618 632,608 630,598 C622,606 614,618 607,632 C600,648 596,668 597,690 Z"/>
    <path fill="url(#mtG)" d="M598,780 C606,760 612,740 615,722 C610,730 604,744 599,760 C596,772 595,784 598,780 Z"/>
  </g>
  <!-- Синайский полуостров — тёплый силуэт + хребты -->
  <!-- Треугольный контур п-ова Синай -->
  <path fill="url(#sinaiG)" opacity=".9"
    d="M424,1012 C450,1015 475,1020 490,1032 C510,1048 520,1075 530,1110 C540,1145 548,1175 555,1200 C562,1175 570,1145 580,1112 C590,1078 600,1050 618,1035 C630,1025 648,1015 665,1012"/>
  <!-- Гранитные горы Синая (юг) — более детальные -->
  <g opacity=".22" filter="url(#soft)">
    <!-- Хребет Ум-Шаумер (высший пик 2587м) -->
    <path d="M510,1205 L528,1162 L546,1205 Z" fill="rgba(110,82,44,.45)" stroke="#9a7845" stroke-width="1.1"/>
    <!-- Хорив/Синай (Моисей) -->
    <path d="M550,1195 L572,1148 L594,1195 Z" fill="rgba(125,92,50,.5)" stroke="#a08040" stroke-width="1.2"/>
    <!-- Снежная шапка Синая -->
    <path d="M562,1155 L572,1148 L582,1155 Z" fill="rgba(240,235,225,.2)" stroke="rgba(240,235,225,.3)" stroke-width=".7"/>
    <!-- Боковой хребет -->
    <path d="M535,1215 L550,1180 L565,1215 Z" fill="rgba(100,78,40,.35)" stroke="#9a7845" stroke-width=".9"/>
    <path d="M578,1208 L594,1175 L610,1208 Z" fill="rgba(105,80,42,.35)" stroke="#9a7845" stroke-width=".9"/>

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":"../../images/atlas-avraam-scene-600w.webp"},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":"../../images/atlas-ishod-scene-600w.webp"},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":"../../images/atlas-shvatim-scene-600w.webp"},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":"../../images/atlas-shoftim-scene-600w.webp"},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":"../../images/atlas-melachim-scene-600w.webp"},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":true,"cover":"../../images/atlas-yeshua-scene-600w.webp"},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":"../../images/atlas-early-church-scene-600w.webp"},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":"../../images/atlas-pavel-scene-600w.webp"},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":"../../images/atlas-revelation-scene-600w.webp"},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":"../../images/atlas-maccabim-scene-600w.webp"}];window.ATLAS_PLACES={"bethlehem":{"n":"Вифлеем","k":"Рождение Христа · город Давида","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg/200px-Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg","tl":"Базилика Рождества — Вифлеем","f":"Базилика Рождества (IV в., Юстиниан VI в.) — одна из старейших непрерывно действующих церквей. Под базиликой — пещера с серебряной звездой, отмечающая традиционное место рождения.","dossier":{"story":"<p>Вифлеем — «дом хлеба» (בֵּית לֶחֶם), город Давида и место рождения Мессии. Пророк Михей (5:2): «И ты, Вифлеем-Ефрафа, мал ли ты между тысячами Иудиными? из тебя произойдёт Мне Тот, Который должен быть Владыкою в Израиле». Иисус родился здесь в пещере, положен в ясли, посещён пастухами и волхвами.</p>","bible":"<div class=\"verse\">«И родила Сына своего Первенца, и спеленала Его, и положила Его в ясли, потому что не было им места в гостинице».<span>ЛУКИ 2:7</span></div>","arch":"<p>Базилика Рождества (IV в., Юстиниан VI в.) — одна из старейших непрерывно действующих церквей. Под базиликой — пещера с серебряной звездой, отмечающая традиционное место рождения.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Исполнение пророчества:</b> Михей пророчествовал за 700 лет. Первосвященники указали Ироду именно на это место (Мф 2:5-6). Христос рождается не в столице, а в малом городе — Божий путь всегда через малое и смиренное.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg/640px-Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg/200px-Church_of_the_Nativity_%28Bethlehem%2C_2008%29.jpg","label":"Базилика Рождества — Вифлеем","credit":"Wikimedia Commons"}]}},"nazareth":{"n":"Назарет","k":"Детство · «Назарянин»","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Nazareth_Basilica_of_the_Annunciation.jpg/200px-Nazareth_Basilica_of_the_Annunciation.jpg","tl":"Базилика Благовещения — Назарет","f":"Деревня римского периода: дома, прессы для масла, гробницы. Церковь Благовещения (современная) — над традиционным домом Марии. Синагогальная церковь — на месте синагоги I в.","dossier":{"story":"<p>Назарет — «Назарет! из Назарета может ли быть что доброе?» (Ин 1:46). Здесь Иисус провёл 30 лет — детство, отрочество, работа плотником. В синагоге Назарета Он прочитал Исайю 61 и объявил: «Ныне исполнилось писание сие» — и был изгнан из города.</p>","bible":"<div class=\"verse\">«И, встав, выгнали Его вон из города и повели на вершину горы… чтобы свергнуть Его; но Он, пройдя посреди них, удалился».<span>ЛУКИ 4:29-30</span></div>","arch":"<p>Деревня римского периода: дома, прессы для масла, гробницы. Церковь Благовещения (современная) — над традиционным домом Марии. Синагогальная церковь — на месте синагоги I в.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Скрытые годы:</b> 30 лет жизни Христа в Назарете покрыты молчанием, кроме одного эпизода в 12 лет (Лк 2:41-52). Это не «потерянные годы», а приготовление: «Иисус же преуспевал в премудрости и возрасте».</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Nazareth_Basilica_of_the_Annunciation.jpg/640px-Nazareth_Basilica_of_the_Annunciation.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d0/Nazareth_Basilica_of_the_Annunciation.jpg/200px-Nazareth_Basilica_of_the_Annunciation.jpg","label":"Базилика Благовещения — Назарет","credit":"Wikimedia Commons"}]}},"jerusalem_temple":{"n":"Иерусалим · Храм","k":"12-летний Иисус в Храме","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/200px-Western_Wall_at_night.jpg","tl":"Стена Плача — Храмовая гора","f":"Второй храм (Храм Ирода) — центр иудейского поклонения, «дом Отца Моего» (Ин 2:16). Раскопки Храмовой горы: южная стена, ступени Хульдских ворот, фрагменты платформы Ирода.","dossier":{"story":"<p>В 12 лет Иисус пришёл в Храм с родителями на Пасху. Он остался в Храме, «сидящего посреди учителей, слушающего их и спрашивающего их». Марии: «Зачем было вам искать Меня? или вы не знали, что Мне должно быть в том, что принадлежит Отцу Моему?»</p>","bible":"<div class=\"verse\">«Иисус же преуспевал в премудрости и возрасте и в любви у Бога и человеков».<span>ЛУКИ 2:52</span></div>","arch":"<p>Второй храм (Храм Ирода) — центр иудейского поклонения, «дом Отца Моего» (Ин 2:16). Раскопки Храмовой горы: южная стена, ступени Хульдских ворот, фрагменты платформы Ирода.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Первое записанное слово Иисуса:</b> «Или вы не знали, что Мне должно быть в том, что принадлежит Отцу Моему?» (Лк 2:49). В 12 лет Иисус уже осознавал Своё божественное сыновство и миссию. Это единственный эпизод из детства Иисуса, записанный в Евангелиях.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/640px-Western_Wall_at_night.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/200px-Western_Wall_at_night.jpg","label":"Стена Плача — Храмовая гора","credit":"Wikimedia Commons"}]}},"jordan_baptism":{"n":"Вифавара · Крещение","k":"Крещение · Троица","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jordan_river_baptism_site.jpg/200px-Jordan_river_baptism_site.jpg","tl":"Место крещения на реке Иордан","f":"Вифавара (Бетания за Иорданом) — место крещения Иисуса Иоанном Крестителем (Ин 1:28). Al-Maghtas на восточном берегу Иордана — объект Всемирного наследия ЮНЕСКО (2015): раскопки от…","dossier":{"story":"<p>Иоанн Креститель крестил Иисуса в водах Иордана у Вифавары. Когда Иисус вышел из воды, «отверзлись Ему небеса, и увидел Духа Божия, Который сходил как голубь… И голос с небес: Сей есть Сын Мой Возлюбленный». Откровение Троицы: Отец, Сын и Дух Святой. Здесь Иисус начал публичное служение.</p>","bible":"<div class=\"verse\">«Сей есть Сын Мой Возлюбленный, в Котором Моё благоволение».<span>МАТФЕЯ 3:17</span></div>","arch":"<p>Вифавара (Бетания за Иорданом) — место крещения Иисуса Иоанном Крестителем (Ин 1:28). Al-Maghtas на восточном берегу Иордана — объект Всемирного наследия ЮНЕСКО (2015): раскопки открыли церкви V–VI вв., монастырь, мраморные ступени к реке, бассейны для крещения.</p>","dispute":"⚖ Спор о месте крещения. Al-Maghtas (Вифавара, восточный берег, ЮНЕСКО) против Qasr el-Yahud (западный берег) против Ainon near Salim (Ин 3:23). Источники: Ин 1:28; ЮНЕСКО; раскопки Al-Maghtas.","bible_extra":"<p class=\"bib-note\"><b>Зачем крестился безгрешный?:</b> Иисус крестился не для покаяния, а чтобы «исполнить всякую правду» (Мф 3:15) — отождествиться с грешниками, которых Он пришёл спасти, и быть явленным Израилю как Мессия.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jordan_river_baptism_site.jpg/640px-Jordan_river_baptism_site.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e2/Jordan_river_baptism_site.jpg/200px-Jordan_river_baptism_site.jpg","label":"Место крещения на реке Иордан","credit":"Wikimedia Commons"}]}},"capernaum":{"n":"Капернаум","k":"База служения · город Иисуса","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Capernaum_synagogue.jpg/200px-Capernaum_synagogue.jpg","tl":"Синагога в Капернауме","f":"Раскопан дом Петра (октагональная церковь V в. над ним). Синагога из белого известняка (IV–V вв.) стоит на базальтовом фундаменте I в. — той самой синагоги, где проповедовал Иисус.…","dossier":{"story":"<p>«Свой город» Иисуса (Мф 9:1). Здесь Он жил в доме Петра, учил в синагоге, исцелил тёщу Петра, слугу сотника, расслабленного через крышу. Здесь призвал Матфея-мытаря. «И ты, Капернаум, до неба вознёсшийся, до ада низвергнешься» (Мф 11:23).</p>","bible":"<div class=\"verse\">«И, оставив Назарет, пришёл и поселился в Капернауме приморском».<span>МАТФЕЯ 4:13</span></div>","arch":"<p>Раскопан дом Петра (октагональная церковь V в. над ним). Синагога из белого известняка (IV–V вв.) стоит на базальтовом фундаменте I в. — той самой синагоги, где проповедовал Иисус. Улицы и дома рыбацкой деревни.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Город, видевший больше всех чудес:</b> 9 из 36 записанных чудес произошли в Капернауме. Но Иисус произнёс над ним горе: «И ты, Капернаум, до неба вознёсшийся, до ада низвергнешься» (Мф 11:23). Привилегия умножает ответственность.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Capernaum_synagogue.jpg/640px-Capernaum_synagogue.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/34/Capernaum_synagogue.jpg/200px-Capernaum_synagogue.jpg","label":"Синагога в Капернауме","credit":"Wikimedia Commons"}]}},"sea_galilee":{"n":"Галилейское море","k":"Буря · хождение по водам","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/200px-Sea_of_Galilee_%28panoramic%29.jpg","tl":"Галилейское море (Кинерет)","f":"Галилейское море (Киннерет) — центр служения Иисуса. Археология: «Лодка Иисуса» (Гиносар, 1986) — рыболовное судно I в. до н.э./I в. н.э., тип лодки эпохи Иисуса.","dossier":{"story":"<p>Озеро, где Иисус усмирил бурю, ходил по водам, умножал хлебы и рыбу, учил из лодки, призвал рыбаков — Петра, Андрея, Иакова и Иоанна. После Воскресения здесь приготовил завтрак ученикам и трижды спросил Петра: «Любишь ли ты Меня?»</p>","bible":"<div class=\"verse\">«И Он, встав, запретил ветру и сказал морю: умолкни, перестань. И ветер утих, и сделалась великая тишина».<span>МАРКА 4:39</span></div>","arch":"<p>Галилейское море (Киннерет) — центр служения Иисуса. Археология: «Лодка Иисуса» (Гиносар, 1986) — рыболовное судно I в. до н.э./I в. н.э., тип лодки эпохи Иисуса.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Море, ставшее кафедрой:</b> Большинство чудес Христа произошло вокруг Галилейского моря. Здесь Он призвал рыбаков, усмирил бурю, ходил по воде и приготовил завтрак после Воскресения. Простой рыбацкий водоём стал географическим центром Евангелия.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/640px-Sea_of_Galilee_%28panoramic%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/200px-Sea_of_Galilee_%28panoramic%29.jpg","label":"Галилейское море (Кинерет)","credit":"Wikimedia Commons"}]}},"mount_beatitudes":{"n":"Гора Блаженств","k":"Нагорная проповедь","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Mount_of_Beatitudes_Church.jpg/200px-Mount_of_Beatitudes_Church.jpg","tl":"Церковь на горе Блаженств","f":"Гора Блаженств — традиционное место Нагорной проповеди (Мф 5–7). Католическая церковь Блаженств (1938, А. Барлуцци) на холме над Галилейским морем; холм образует естественный амфит…","dossier":{"story":"<p>На склонах над Галилейским морем Иисус произнёс Нагорную проповедь — «конституцию Царства». «Блаженны нищие духом… Блаженны чистые сердцем… Вы — соль земли… Вы — свет мира». Молитва «Отче наш». Правило: «Во всём как хотите чтобы с вами поступали люди, так поступайте и вы с ними».</p>","bible":"<div class=\"verse\">«Увидев народ, Он взошёл на гору; и, когда сел, приступили к Нему ученики Его. И Он, отверзши уста Свои, учил их».<span>МАТФЕЯ 5:1-2</span></div>","arch":"<p>Гора Блаженств — традиционное место Нагорной проповеди (Мф 5–7). Католическая церковь Блаженств (1938, А. Барлуцци) на холме над Галилейским морем; холм образует естественный амфитеатр с хорошей акустикой.</p>","dispute":"⚖ Спор о месте Нагорной проповеди. Традиционный холм Блаженств у Капернаума против других возвышенностей. Евангелие: «на горе» (Мф 5:1) и «на ровном месте» (Лк 6:17). Источники: Мф 5:1; Лк 6:17.","bible_extra":"<p class=\"bib-note\"><b>«Конституция Царства»:</b> Нагорная проповедь (Мф 5–7) — не набор правил, а описание гражданина Царства. «Блаженны нищие духом» переворачивает все человеческие представления о счастье. Это не «как спастись», а «как живёт спасённый».</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Mount_of_Beatitudes_Church.jpg/640px-Mount_of_Beatitudes_Church.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Mount_of_Beatitudes_Church.jpg/200px-Mount_of_Beatitudes_Church.jpg","label":"Церковь на горе Блаженств","credit":"Wikimedia Commons"}]}},"nain":{"n":"Наин","k":"Воскрешение сына вдовы","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Moreh.jpg/200px-Mount_Moreh.jpg","tl":"Гора Море — регион Наина","f":"Наин — деревня, где Иисус воскресил сына вдовы (Лк 7:11–17). Современный Неин на склоне Изреельской долины; у подножия древние скальные гробницы, подходящие к библейскому описанию.","dossier":{"story":"<p>У ворот Наина Иисус встретил похоронную процессию: вдова хоронила единственного сына. «Юноша! тебе говорю, встань!» — и мёртвый сел и стал говорить. «Бог посетил народ Свой» — эта весть разнеслась по всей Иудее.</p>","bible":"<div class=\"verse\">«И, подойдя, прикоснулся к одру; нёсшие остановились, и Он сказал: юноша! тебе говорю, встань!»<span>ЛУКИ 7:14</span></div>","arch":"<p>Наин — деревня, где Иисус воскресил сына вдовы (Лк 7:11–17). Современный Неин на склоне Изреельской долины; у подножия древние скальные гробницы, подходящие к библейскому описанию.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Первое воскрешение:</b> Иисус воскресил сына вдовы у ворот Наина. Толпа сказала: «Бог посетил народ Свой» (Лк 7:16). Это напоминает воскрешение Илией сына вдовы в Сарепте (3Цар 17:17-24) — Иисус больше пророка.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Moreh.jpg/640px-Mount_Moreh.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Moreh.jpg/200px-Mount_Moreh.jpg","label":"Гора Море — регион Наина","credit":"Wikimedia Commons"}]}},"caesarea_philippi":{"n":"Кесария Филиппова","k":"Исповедание Петра","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Banias_-_Pan_Grotto.jpg/200px-Banias_-_Pan_Grotto.jpg","tl":"Кесария Филиппова — грот Пана","f":"Кесария Филиппова (Баниас) — место исповедания Петра (Мф 16:13–20). Священная пещера Пана с нишами, храмы Ирода и Агриппы II — раскопки открыли крупный языческий центр.","dossier":{"story":"<p>У подножия горы Ермон, в языческом городе с храмом Пана, Иисус спросил учеников: «За кого люди почитают Меня?» Пётр ответил: «Ты — Христос, Сын Бога Живого». Здесь Иисус впервые объявил о создании Церкви и Своей грядущей смерти.</p>","bible":"<div class=\"verse\">«Ты — Пётр, и на сем камне Я создам Церковь Мою, и врата ада не одолеют её».<span>МАТФЕЯ 16:18</span></div>","arch":"<p>Кесария Филиппова (Баниас) — место исповедания Петра (Мф 16:13–20). Священная пещера Пана с нишами, храмы Ирода и Агриппы II — раскопки открыли крупный языческий центр.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Исповедание Петра — поворотный момент:</b> До этого момента ученики видели чудеса и слышали учение. Теперь Иисус спрашивает прямо: «За кого вы почитаете Меня?» Ответ Петра — «Ты — Христос, Сын Бога Живого» — становится фундаментом Церкви. С этого момента Иисус начинает говорить о Своей смерти и воскресении.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Banias_-_Pan_Grotto.jpg/640px-Banias_-_Pan_Grotto.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/63/Banias_-_Pan_Grotto.jpg/200px-Banias_-_Pan_Grotto.jpg","label":"Кесария Филиппова — грот Пана","credit":"Wikimedia Commons"}]}},"jericho":{"n":"Иерихон","k":"Закхей · Вартимей","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/200px-Tell_es-Sultan_%28Jericho%29.jpg","tl":"Тель эс-Султан — древний Иерихон","f":"Иерихон — один из древнейших городов мира, который Иисус посетил (Закхей, Лк 19; Вартимей, Мк 10). Иродово-хасмонейские дворцы задают контекст города I в. н.э.","dossier":{"story":"<p>Последний город перед Иерусалимом на пути Иисуса. Здесь Он исцелил слепого Вартимея, а Закхей-мытарь залез на смоковницу, чтобы увидеть Его. «Закхей! сойди скорее, ибо сегодня надобно Мне быть у тебя в доме» — и Закхей раздал половину имения нищим.</p>","bible":"<div class=\"verse\">«Ныне пришло спасение дому сему, потому что и он сын Авраама, ибо Сын Человеческий пришёл взыскать и спасти погибшее».<span>ЛУКИ 19:9-10</span></div>","arch":"<p>Иерихон — один из древнейших городов мира, который Иисус посетил (Закхей, Лк 19; Вартимей, Мк 10). Иродово-хасмонейские дворцы задают контекст города I в. н.э.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Иерихон — последний город перед Иерусалимом:</b> Здесь Иисус исцелил слепого Вартимея, который кричал: «Иисус, Сын Давидов! помилуй меня». Здесь Закхей-мытарь залез на смоковницу. «Ныне пришло спасение дому сему» — последние слова Иисуса перед входом в Иерусалим.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/640px-Tell_es-Sultan_%28Jericho%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/200px-Tell_es-Sultan_%28Jericho%29.jpg","label":"Тель эс-Султан — древний Иерихон","credit":"Wikimedia Commons"}]}},"bethany":{"n":"Вифания","k":"Лазарь · Мария и Марфа","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Lazarus_tomb_Bethany.jpg/200px-Lazarus_tomb_Bethany.jpg","tl":"Гробница Лазаря — Вифания","f":"Вифания — селение у Елеонской горы, дом Марии, Марфы и Лазаря (Ин 11). Традиционная гробница Лазаря — скальная гробница, почитаемая с византийской эпохи.","dossier":{"story":"<p>Дом Марфы, Марии и Лазаря — место, где Иисус часто останавливался. Здесь Он воскресил Лазаря: «Лазарь! иди вон». Мария помазала Иисуса миром и отёрла ноги волосами. Сюда Иисус возвращался каждый вечер Страстной недели.</p>","bible":"<div class=\"verse\">«Я есмь воскресение и жизнь; верующий в Меня, если и умрёт, оживёт».<span>ИОАННА 11:25</span></div>","arch":"<p>Вифания — селение у Елеонской горы, дом Марии, Марфы и Лазаря (Ин 11). Традиционная гробница Лазаря — скальная гробница, почитаемая с византийской эпохи.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Дом, где Его любили:</b> В Вифании Иисус находил отдых перед последними днями. Здесь Он воскресил Лазаря — самое великое чудо перед Своей смертью. Мария помазала Его миром — единственный человек, понявший, что Он идёт на смерть.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Lazarus_tomb_Bethany.jpg/640px-Lazarus_tomb_Bethany.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1f/Lazarus_tomb_Bethany.jpg/200px-Lazarus_tomb_Bethany.jpg","label":"Гробница Лазаря — Вифания","credit":"Wikimedia Commons"}]}},"jerusalem_passion":{"n":"Иерусалим · Горница","k":"Тайная Вечеря · суд","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/200px-Last_Supper_Room_Mount_Zion.jpg","tl":"Горница Тайной Вечери — гора Сион","f":"Горница Тайной Вечери (Cenaculum) на Сионской горе — традиционное место последней вечери. Нынешнее здание позднесредневековое, ниже — слои древней церкви.","dossier":{"story":"<p>В горнице Иисус установил Вечерю Господню: «Сие есть Тело Моё… Сие есть Кровь Моя». Умыл ноги ученикам. Затем Гефсимания, предательство Иуды, суд у Анны и Каиафы, отречение Петра, суд у Пилата, бичевание, терновый венец.</p>","bible":"<div class=\"verse\">«Сие творите в Моё воспоминание».<span>ЛУКИ 22:19</span></div>","arch":"<p>Горница Тайной Вечери (Cenaculum) на Сионской горе — традиционное место последней вечери. Нынешнее здание позднесредневековое, ниже — слои древней церкви.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Иерусалим — город контрастов:</b> «Осанна!» (Ин 12:13) и «Распни!» (Мф 27:22) прозвучали в одном городе с разницей в несколько дней. Сердце человека переменчиво — но Божий план неизменен.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/640px-Last_Supper_Room_Mount_Zion.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/200px-Last_Supper_Room_Mount_Zion.jpg","label":"Горница Тайной Вечери — гора Сион","credit":"Wikimedia Commons"}]}},"gethsemane":{"n":"Гефсимания","k":"Моление о чаше","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Garden_of_Gethsemane_Jerusalem.jpg/200px-Garden_of_Gethsemane_Jerusalem.jpg","tl":"Гефсиманский сад","f":"Древние оливковые деревья в Гефсиманском саду — некоторые возрастом до 900 лет. Церковь Всех Наций (1924) на скале, традиционно связываемой с местом моления.","dossier":{"story":"<p>«Душа Моя скорбит смертельно». Здесь Иисус молился: «Отче Мой! если возможно, да минует Меня чаша сия; впрочем, не как Я хочу, но как Ты». Пот Его был как капли крови. Иуда предал Его поцелуем. Пётр отсёк ухо Малху.</p>","bible":"<div class=\"verse\">«Отче Мой! если возможно, да минует Меня чаша сия; впрочем, не как Я хочу, но как Ты».<span>МАТФЕЯ 26:39</span></div>","arch":"<p>Древние оливковые деревья в Гефсиманском саду — некоторые возрастом до 900 лет. Церковь Всех Наций (1924) на скале, традиционно связываемой с местом моления.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Да минует Меня чаша сия»:</b> Христос не боялся физической смерти — мученики шли на неё с песнями. Чаша, которой Он страшился — гнев Божий за грех мира, разрыв общения с Отцом. Именно это делало Его жертву уникальной.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Garden_of_Gethsemane_Jerusalem.jpg/640px-Garden_of_Gethsemane_Jerusalem.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/53/Garden_of_Gethsemane_Jerusalem.jpg/200px-Garden_of_Gethsemane_Jerusalem.jpg","label":"Гефсиманский сад","credit":"Wikimedia Commons"}]}},"golgotha":{"n":"Голгофа","k":"Распятие · «Совершилось!»","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Church_of_the_Holy_Sepulchre.jpg/200px-Church_of_the_Holy_Sepulchre.jpg","tl":"Храм Гроба Господня — Голгофа","f":"Храм Гроба Господня (IV в., крестоносцы XII в.) — общепринятое место Голгофы и гробницы. Альтернатива: «Садовая гробница» (Гордон, 1883) — популярна у протестантов.","dossier":{"story":"<p>«Лобное место». Иисус распят между двумя разбойниками. «Отче! прости им, ибо не знают, что делают». Тьма с шестого до девятого часа. «Боже Мой! для чего Ты Меня оставил?» — «Совершилось!» — «Отче! в руки Твои предаю дух Мой». Завеса в храме разодралась надвое.</p>","bible":"<div class=\"verse\">«Ибо так возлюбил Бог мир, что отдал Сына Своего Единородного, дабы всякий, верующий в Него, не погиб, но имел жизнь вечную».<span>ИОАННА 3:16</span></div>","arch":"<p>Храм Гроба Господня (IV в., крестоносцы XII в.) — общепринятое место Голгофы и гробницы. Альтернатива: «Садовая гробница» (Гордон, 1883) — популярна у протестантов.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Голгофа — место, где справедливость и милость встретились:</b> «Отче! прости им, ибо не знают, что делают» (Лк 23:34). «Истинно говорю тебе: ныне же будешь со Мною в раю» (Лк 23:43). «Совершилось!» (Ин 19:30). Три фразы с креста — прощение грешника, спасение разбойника, завершение искупления.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Church_of_the_Holy_Sepulchre.jpg/640px-Church_of_the_Holy_Sepulchre.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Church_of_the_Holy_Sepulchre.jpg/200px-Church_of_the_Holy_Sepulchre.jpg","label":"Храм Гроба Господня — Голгофа","credit":"Wikimedia Commons"}]}},"tomb":{"n":"Гробница · Воскресение","k":"«Его нет здесь — Он воскрес!»","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Garden_Tomb_Jerusalem.jpg/200px-Garden_Tomb_Jerusalem.jpg","tl":"Садовая гробница — Иерусалим","f":"Гробница и Воскресение. Традиционно — Храм Гроба Господня (IV в., Елена), где сохранены скала Голгофы и гробница.","dossier":{"story":"<p>На третий день женщины пришли ко гробу и нашли камень отваленным. Ангел: «Его нет здесь — Он воскрес!» Мария Магдалина встретила Воскресшего в саду. Вечером Иисус явился ученикам в горнице. Фома: «Если не увижу… не поверю». Иисус: «Блаженны не видевшие и уверовавшие». 40 дней явлений, Вознесение с Елеонской горы.</p>","bible":"<div class=\"verse\">«Что вы ищете живого между мёртвыми? Его нет здесь: Он воскрес!»<span>ЛУКИ 24:5-6</span></div>","arch":"<p>Гробница и Воскресение. Традиционно — Храм Гроба Господня (IV в., Елена), где сохранены скала Голгофы и гробница.</p>","dispute":"⚖ Спор о месте гробницы. Храм Гроба Господня (традиция IV в., Елена) против Садовой гробницы (XIX в., Гордон). Большинство историков признают Храм Гроба Господня. Источники: Евсевий, Жизнь Константина.","bible_extra":"<p class=\"bib-note\"><b>Главный факт христианства:</b> Если бы тело Иисуса осталось в гробнице, враги немедленно предъявили бы его. Вместо этого они распространили слух о краже (Мф 28:13). Пустая гробница — историческая реальность, не богословская метафора.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Garden_Tomb_Jerusalem.jpg/640px-Garden_Tomb_Jerusalem.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Garden_Tomb_Jerusalem.jpg/200px-Garden_Tomb_Jerusalem.jpg","label":"Садовая гробница — Иерусалим","credit":"Wikimedia Commons"}]}}};</script>
