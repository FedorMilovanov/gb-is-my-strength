<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Эпоха Судей — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#e3d4ac}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#ecdcb4}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  /* иконки живут мелко; при наведении — плавно вырастают из своего основания
     (transform-origin у «земли»), штрихи non-scaling держат тонкость */
  #sheet-svg .glyph{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
  #sheet-svg .glyph-hit:hover .glyph,
  #sheet-svg .glyph-hit:focus-visible .glyph{transform:scale(1.7);transform-box:fill-box;transform-origin:50% 90%}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#6a5028;stroke-width:.62px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#6a5028;stroke-width:.68px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.2;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.32;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.6);stroke-width:.55px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#ecdcb4;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#ecdcb4;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#ecdcb4;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}

  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}

  .do-ph{margin:0}
  .do-ph img{width:100%;height:96px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(90,70,30,.3);display:block;background:#e8dcbc}

  .do-ph figcaption i{display:block;font:400 8px/1.2 system-ui;color:#9a8a68;letter-spacing:0}

  .do-bible .verse span{display:block;font:700 9.5px/1 system-ui;letter-spacing:.16em;color:#8a6a1f;margin-top:6px;font-style:normal}

  .do-sec .dispute-title{font:700 11px/1.2 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:7px}
  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}
  .do-sec .conf-med,.do-sec .conf-lo,.do-sec .conf-hi{display:inline-block;font:600 9px/1 system-ui;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(138,106,31,.15);color:#7a5c26}
  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  /* position:absolute относительно .wrap (не viewport) — иначе на широких
     экранах кнопки съезжают за реальный правый край листа (обрезаются
     тенью контейнера); top сдвинут ниже розы ветров (компас в SVG кончается

  .dive-btn{position:absolute;right:10px;top:120px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}

  .legend-pop b{display:block;font:700 11px/1 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:8px}
  .legend-pop i{display:flex;align-items:center;gap:8px;font-style:normal}
  .legend-pop span{flex:0 0 20px;height:10px;display:inline-block}

  .legend-pop .lg-dot{flex-basis:9px;width:9px;height:9px;border-radius:50%;background:#1e3a63;border:1.5px solid #f6f1e7}
  .legend-pop .lg-cand{flex-basis:9px;width:9px;height:9px;border-radius:50%;border:1.4px dashed #8a6a1f}
  .legend-pop .lg-arch{flex-basis:9px;width:8px;height:8px;background:#4e7a52;transform:rotate(45deg)}

  .dive-btn:hover{background:#f6f1e7}

  body.dive .wrap{max-width:none;border-radius:0;box-shadow:none}
  body.dive{padding:0}

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":null},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":null},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":null},{"slug":"shoftim","title":"Эпоха Судей","current":true,"cover":null},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":null},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":null},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":null},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":null},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":null},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":null}];window.ATLAS_LAYERS=[{"id":"main","label":"Места Судей","pathLabel":"путь Места Судей"},{"id":"wp","label":"Археология","pathLabel":"путь Археология"}];window.ATLAS_PLACES={"shiloh":{"n":"Силом","k":"Скиния · 369 лет центр поклонения","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/200px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","tl":"Тель Шило — древний Силом","f":"Хирбет Сейлун — Нав 18:1; Суд 21:19; 1Цар 1–4","lex":null,"glyphs":[],"dossier":{"story":"<p>Силом — духовный центр Израиля в эпоху Судей. Здесь находилась Скиния и Ковчег Завета на протяжении 369 лет (от Иисуса Навина до Илии). Сюда приходили колена на ежегодные праздники (Суд 21:19). Здесь Анна молилась о сыне, и здесь началось призвание Самуила (1Цар 3). Филистимляне разрушили Силом после битвы при Авен-Езере (1Цар 4).</p>","bible":"<div class=\"verse\">«И собралось всё общество сынов Израилевых в Силом, и поставили там скинию собрания».<span>ИИСУС НАВИН 18:1</span></div><div class=\"verse\">«И сказал Господь Самуилу: вот, Я сделаю дело в Израиле, о котором кто услышит, у того зазвенит в обоих ушах».<span>1ЦАРСТВ 3:11</span></div>","arch":"<p>Раскопки в Хирбет Сейлун (датская экспедиция 1926–1932, Финкельштейн 1981–1984, ABR 2017–2025). Железный век I (~1200–1050 гг.): поселение 1–1.2 га, остатки домов с колоннами, огромные керамические сосуды и кости животных у стен (следы жертвоприношений — культовый комплекс Скинии?). Сезон 2025: раскопки ворот, возможное место получения вести о поражении (1Цар 4:12-18).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Силом — урок Иерусалиму:</b> Бог оставил Силом из-за греха сыновей Илия. Иеремия использовал этот пример как предупреждение Иерусалиму (Иер 7:12-14). Присутствие Бога не гарантировано — оно зависит от послушания.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/640px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/200px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","label":"Тель Шило — древний Силом","credit":"Wikimedia Commons"}]}},"hazor":{"n":"Асор","k":"Столица Ханаана · Иавин и Сисара","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","tl":"Тель Хацор — ворота Соломона","f":"Тель Хацор — Нав 11:10-11; Суд 4–5","lex":null,"glyphs":[],"dossier":{"story":"<p>Асор — «глава всех царств тех» (Нав 11:10). Крупнейший ханаанский город-государство Верхней Галилеи. В эпоху Судей царь Иавин с военачальником Сисарой угнетал Израиль 20 лет, имея 900 железных колесниц. Девора и Варак разбили Сисару у вод Мегиддонских (Суд 4–5).</p>","bible":"<div class=\"verse\">«И продал Господь их в руки Иавина, царя Ханаанского, который царствовал в Асоре».<span>СУДЕЙ 4:2</span></div>","arch":"<p>Тель Хацор — крупнейший телль Израиля (80 га). Раскопки Игаля Ядина (1955–1958, 1968) и Амнона Бен-Тора (1990–2012). Верхний город (акрополь) и нижний город. Бронзовый век: дворец, храмы, клинописные таблички. Железный век I: следы разрушения, согласующиеся с библейским повествованием о Деворе. Ворота Соломона (X в. до н.э.), водная система.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Асор — «глава всех царств»:</b> Иисус Навин сжёг Асор, но хананеи восстановили его. В эпоху Судей царь Иавин с 900 колесницами угнетал Израиль 20 лет. Девора и Варак разбили его. Позже Соломон восстановил Асор как административный центр. Город, трижды разрушенный и трижды восстановленный.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/640px-Hatzor-Israelite-4.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","label":"Тель Хацор — ворота Соломона","credit":"Wikimedia Commons"}]}},"megiddo":{"n":"Мегиддо","k":"Воды Мегиддонские · битва Деворы","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/200px-Tel_Megiddo_%282%29.jpg","tl":"Тель Мегиддо — вид с воздуха","f":"Тель Мегиддо — Суд 5:19; 4Цар 23:29; Откр 16:16","lex":null,"glyphs":[],"dossier":{"story":"<p>Мегиддо господствует над Изреельской долиной — стратегическим перекрёстком древнего Ближнего Востока. Здесь Девора и Варак разбили Сисару с его 900 колесницами: «у вод Мегиддонских» (Суд 5:19). Песнь Деворы (Суд 5) — один из древнейших поэтических текстов Библии — воспевает эту победу.</p>","bible":"<div class=\"verse\">«С неба сражались, звёзды с путей своих сражались с Сисарою. Поток Киссон увлёк их».<span>СУДЕЙ 5:20-21</span></div>","arch":"<p>20+ слоёв обитания от неолита до персидского периода. Раскопки Чикагского университета (1925–1939), Ядина (1960-е), Финкельштейна и Уссишкина (1990-е–). Ханаанский храм, дворец, водный тоннель, конюшни. Железный век I: следы разрушения. «Армагеддон» (Хар-Мегиддо) — Откр 16:16.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Мегиддо: датировка слоёв X–IX вв.</div><div class=\"dispute-pos cons\"><b>Традиционная (Ядин):</b> Слой VA-IVB = Соломон (X в.), конюшни и ворота — его строительство. <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-pos alt\"><b>Низкая хронология (Финкельштейн):</b> Слой VA-IVB = IX в. (Амврий/Ахав). <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-note\">Обе стороны признают значимость Мегиддо. Спор о датировке конкретных слоёв не затрагивает библейское повествование эпохи Судей.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Мегиддо — самое кровавое место в истории:</b> 20+ слоёв разрушения. Девора, Гедеон, Саул, Соломон, Иосия — все сражались здесь. Иоанн в Откровении помещает здесь Армагеддон — финальную битву. Место, где человеческая война встретится с Божьим судом.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/640px-Tel_Megiddo_%282%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/200px-Tel_Megiddo_%282%29.jpg","label":"Тель Мегиддо — вид с воздуха","credit":"Wikimedia Commons"}]}},"tabor":{"n":"Фавор","k":"Гора Преображения · сбор Варака","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Tabor_israel.jpg/200px-Mount_Tabor_israel.jpg","tl":"Гора Фавор — место Преображения","f":"Хар Тавор, 588 м — Суд 4:6,12; Мф 17:1-9","lex":null,"glyphs":[],"dossier":{"story":"<p>Гора Фавор — место сбора войск Варака по слову Деворы. Отсюда 10 000 израильтян сошли в долину и разбили колесницы Сисары у потока Киссон. В Новом Завете — традиционное место Преображения Господня, хотя Евангелия не называют гору по имени.</p>","bible":"<div class=\"verse\">«И послала Девора, и призвала Варака… и сказала: пойди, взойди на гору Фавор».<span>СУДЕЙ 4:6</span></div><div class=\"verse\">«И преобразился пред ними: и просияло лицо Его, как солнце».<span>МАТФЕЯ 17:2</span></div>","arch":"<p>Фавор (Джебель-эт-Тур, 588 м) — гора в Нижней Галилее. Традиционно место битвы Деворы и Варака с Сисарой (Суд 4–5). Равнина Изреель у подножия — место сражения. На вершине — византийский монастырь.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Гора Преображения:</b> На Фаворе Моисей (Закон) и Илия (Пророки) явились с Христом. Это не случайно: Закон и Пророки свидетельствуют о Христе. Слова Отца: «Сей есть Сын Мой Возлюбленный; Его слушайте» — теперь Он, а не Моисей и Илия, является высшим авторитетом.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Tabor_israel.jpg/640px-Mount_Tabor_israel.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Mount_Tabor_israel.jpg/200px-Mount_Tabor_israel.jpg","label":"Гора Фавор — место Преображения","credit":"Wikimedia Commons"}]}},"ophrah":{"n":"Офра","k":"Жертвенник Гедеона · явление Ангела","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Samaria_mountains.jpg/200px-Samaria_mountains.jpg","tl":"Самарийские горы — регион Офры","f":"Точная локализация спорна — Суд 6:11-24","lex":null,"glyphs":[],"dossier":{"story":"<p>В Офре Ангел Господень явился Гедеону под дубом и сказал: «Господь с тобою, муж сильный!» Здесь Гедеон разрушил жертвенник Ваала и поставил жертвенник Господу — «Иегова-Шалом» (Господь — мир). Здесь же Гедеон положил руно: сначала роса на руне, потом роса на земле.</p>","bible":"<div class=\"verse\">«И сказал ему Господь: мир тебе, не бойся, не умрёшь. И устроил там Гедеон жертвенник Господу и назвал его: Иегова Шалом».<span>СУДЕЙ 6:23-24</span></div>","arch":"<p>Офра (Суд 6:11) — родина Гедеона, где ангел явился ему под дубом и где Гедеон уничтожил жертвенник Ваала. Отождествляется с Khirbet Affuleh или el-Farah в уделе Манассии.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Гедеон — от страха к вере:</b> Гедеон молотил пшеницу в точиле, скрываясь от мадианитян. Ангел назвал его «муж сильный» — ирония или пророчество? Гедеон прошёл путь от «Господи! как я спасу Израиля?» до «Меч Господа и Гедеона!». Бог видит в нас не то, что мы есть, а то, кем мы станем.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Samaria_mountains.jpg/640px-Samaria_mountains.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e7/Samaria_mountains.jpg/200px-Samaria_mountains.jpg","label":"Самарийские горы — регион Офры","credit":"Wikimedia Commons"}]}},"harod":{"n":"Эйн-Харод","k":"300 воинов Гедеона","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Maayan_Harod_021.jpg/200px-Maayan_Harod_021.jpg","tl":"Источник Харод (Эйн Харод)","f":"Эйн Харод — Суд 7:1-8","lex":null,"glyphs":[],"dossier":{"story":"<p>У источника Харод Гедеон отобрал 300 воинов из 32 000. Бог сказал: «Народа с тобою слишком много». Сначала ушли 22 000 боязливых. Из оставшихся Гедеон отобрал тех, кто лакал воду с ладони, а не пил с колен — 300 человек. С ними Бог дал победу над мадианитянами.</p>","bible":"<div class=\"verse\">«И сказал Господь Гедеону: тремя стами лакавших Я спасу вас и предам Мадианитян в руки твои».<span>СУДЕЙ 7:7</span></div>","arch":"<p>Эйн Харод (Эйн Джалуд) — мощный источник у подножия горы Гелвуй, упоминается в битве Саула (1Цар 29:1) и Саладина (1187 г.). Естественный стратегический пункт на входе в Изреельскую долину.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>300 против 135 000:</b> Бог сократил армию Гедеона с 32 000 до 300. Причина: «чтобы не возгордился Израиль предо Мною и не сказал: моя рука спасла меня» (Суд 7:2). Бог часто уменьшает наши ресурсы, чтобы показать, что победа — от Него.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Maayan_Harod_021.jpg/640px-Maayan_Harod_021.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/Maayan_Harod_021.jpg/200px-Maayan_Harod_021.jpg","label":"Источник Харод (Эйн Харод)","credit":"Wikimedia Commons"}]}},"kishon":{"n":"Поток Киссон","k":"Река битвы Деворы и Илии","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Kishon_River.jpg/200px-Kishon_River.jpg","tl":"Поток Киссон (Нахаль Кишон)","f":"Нахаль Кишон — Суд 4:7; 5:21; 3Цар 18:40","lex":null,"glyphs":[],"dossier":{"story":"<p>Поток Киссон — дважды свидетель Божьего суда. Здесь воды увлекли колесницы Сисары (Суд 5:21). Здесь же Илия заколол 450 пророков Вааловых после состязания на горе Кармил (3Цар 18:40). Одна река — две величайшие победы Бога над языческими культами.</p>","bible":"<div class=\"verse\">«Поток Киссон увлёк их, поток древний, поток Киссон. Попирай, душа моя, силу!»<span>СУДЕЙ 5:21</span></div>","arch":"<p>Поток Киссон (Нахаль-Кишон) — река в Изреельской долине, у которой войска Деворы и Варака разбили Сисару (Суд 4:7, 5:21). «Поток Киссон исторг их». Разлив реки играл военную роль.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Одна река — два суда:</b> Киссон утопил колесницы Сисары (Суд 5) и кровь пророков Ваала (3Цар 18). Бог использует одно и то же место для повторяющихся уроков. История циклична — Бог верен.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Kishon_River.jpg/640px-Kishon_River.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/79/Kishon_River.jpg/200px-Kishon_River.jpg","label":"Поток Киссон (Нахаль Кишон)","credit":"Wikimedia Commons"}]}},"timnah":{"n":"Фимнафа","k":"Самсон · загадка и львы","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tel_Batash.jpg/200px-Tel_Batash.jpg","tl":"Тель Баташ — Фимнафа","f":"Тель Баташ — Суд 14:1-19","lex":null,"glyphs":[],"dossier":{"story":"<p>Фимнафа — место первой истории о Самсоне. Здесь он увидел филистимлянку и решил жениться на ней. По дороге растерзал льва, а позже в львином трупе обнаружил рой пчёл. На свадебном пиру загадал загадку: «Из ядущего вышло ядомое, и из сильного вышло сладкое». Тридцать филистимлян были убиты Самсоном в Аскалоне, когда те выведали ответ у его жены.</p>","bible":"<div class=\"verse\">«И пошёл Самсон с отцом своим и с матерью своею в Фимнафу… и вот, молодой лев рыкая идёт навстречу ему».<span>СУДЕЙ 14:5</span></div>","arch":"<p>Фимнафа (Телль-эль-Баташи) — город на границе удела Дана, где Самсон взял филистимлянку в жёны (Суд 14). Раскопки открыли ханаанейский/израильский город у границы с филистимской равниной.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Самсон — сила без святости:</b> Самсон обладал сверхъестественной силой, но не контролировал свои страсти. Он нарушил все три обета назорейства: прикоснулся к мёртвому (лев), пил вино (пир), и остриг волосы. Трагедия Самсона — предупреждение: дары без характера ведут к падению.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tel_Batash.jpg/640px-Tel_Batash.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c5/Tel_Batash.jpg/200px-Tel_Batash.jpg","label":"Тель Баташ — Фимнафа","credit":"Wikimedia Commons"}]}},"gaza":{"n":"Газа","k":"Самсон · ворота на гору","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg/200px-Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg","tl":"Старый город Газы","f":"Газа, сектор Газа — Суд 16:1-30","lex":null,"glyphs":[],"dossier":{"story":"<p>Газа — южный филистимский город, где Самсон совершил свой последний подвиг. Здесь он вырвал городские ворота с косяками и унёс их на гору близ Хеврона (Суд 16:3). Позже, ослеплённый и закованный, он обрушил храм Дагона на филистимлян: «И было умерших, которых умертвил Самсон при смерти своей, более, нежели сколько умертвил он в жизни своей» (Суд 16:30).</p>","bible":"<div class=\"verse\">«И сдвинул Самсон с места два средних столба, на которых утверждён был дом… И погибло при смерти его более, нежели сколько умертвил он в жизни своей».<span>СУДЕЙ 16:29-30</span></div>","arch":"<p>Газа — один из древнейших городов мира, заселённый непрерывно с бронзового века. Филистимский слой содержит характерную керамику (филистимский бихром). Храм Дагона археологически не обнаружен (вероятно, уничтожен при обрушении). Раскопки ограничены современной застройкой.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Газа — город, где сила встретила слабость:</b> Самсон, сильнейший человек, ослеплённый и закованный, обрушил храм Дагона. «И было умерших, которых умертвил Самсон при смерти своей, более, нежели сколько умертвил он в жизни своей» (Суд 16:30). Смерть стала его величайшей победой — прообраз Христа.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg/640px-Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg/200px-Old_town_of_Gaza_%28Al-Zaytoun_Quarter%29.jpg","label":"Старый город Газы","credit":"Wikimedia Commons"}]}},"sorek":{"n":"Долина Сорек","k":"Самсон и Далида","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Sorek_valley.jpg/200px-Sorek_valley.jpg","tl":"Долина Сорек","f":"Нахаль Сорек — Суд 16:4-22","lex":null,"glyphs":[],"dossier":{"story":"<p>В долине Сорек Самсон полюбил Далиду. Она трижды пыталась выведать секрет его силы — и трижды он обманывал её. На четвёртый раз он открыл тайну назорейства — и лишился силы. Филистимляне взяли его, ослепили и отвели в Газу.</p>","bible":"<div class=\"verse\">«И сказала Далида Самсону: скажи мне, в чём великая сила твоя и чем связать тебя?»<span>СУДЕЙ 16:6</span></div>","arch":"<p>Долина Сорек (Нахаль-Сорек) — где жила Далида (Суд 16:4), предавшая Самсона. Долина ведёт от Иерусалимских гор к филистимскому побережью (Экрон, Беф-Самис). Зона контакта израильтян и филистимлян.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Долина предательства:</b> В долине Сорек Самсон открыл Далиде тайну своей силы. Трижды он обманывал её — и трижды она испытывала его. На четвёртый раз он сказал правду — и потерял всё. Близость без мудрости разрушает.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Sorek_valley.jpg/640px-Sorek_valley.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Sorek_valley.jpg/200px-Sorek_valley.jpg","label":"Долина Сорек","credit":"Wikimedia Commons"}]}},"mizpah_gilead":{"n":"Массифа Галаадская","k":"Иеффай · обет и победа","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","tl":"Галаадские горы — регион Массифы","f":"Район Рамофа Галаадского — Суд 11:11-40","lex":null,"glyphs":[],"dossier":{"story":"<p>В Массифе Галаадской старейшины поставили Иеффая начальником над Галаадом. Здесь он дал трагический обет: «Что выйдет из ворот дома моего навстречу мне… будет Господу, и вознесу сие во всесожжение». Первой вышла его единственная дочь. Иеффай победил аммонитян, но обет стал одной из самых тяжёлых историй Писания.</p>","bible":"<div class=\"verse\">«И дал Иеффай обет Господу и сказал: если Ты предашь Аммонитян в руки мои, то что выйдет из ворот дома моего навстречу мне… будет Господу».<span>СУДЕЙ 11:30-31</span></div>","arch":"<p>Массифа Галаадская (Джебель-Джилад / Телль-Масфа) — где Иеффай собирал войско (Суд 11) и где был собран Израиль против колена Вениаминова (Суд 20–21). Восточный Иордан, Галаад.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Обет Иеффая:</b> Одна из самых обсуждаемых историй Ветхого Завета. Буквальное ли всесожжение или посвящение дочери на служение при Скинии (как Анна посвятила Самуила)? Текст (Суд 11:39) говорит: «она не познала мужа» — что может указывать на пожизненное девство, а не смерть. Евр 11:32 упоминает Иеффая в ряду героев веры.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/640px-Gilead_region_Jordan.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","label":"Галаадские горы — регион Массифы","credit":"Wikimedia Commons"}]}},"hebron":{"n":"Хеврон","k":"Гофониил · город-убежище","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","tl":"Хеврон — пещера Махпела","f":"Эль-Халиль — Суд 1:10-15; 3:9-11","lex":null,"glyphs":[],"dossier":{"story":"<p>Хеврон — один из древнейших городов мира, связанный с Авраамом (пещера Махпела). В эпоху Судей — удел Халева, взят им в наследие (Нав 14:13-14). Гофониил, первый судья Израиля, был из Хеврона. Он взял Кириаф-Сефер (Давир) и получил в жёны Ахсу, дочь Халева (Суд 1:12-13). Позже Гофониил освободил Израиль от Хусарсафема, царя Месопотамского.</p>","bible":"<div class=\"verse\">«И возопили сыны Израилевы к Господу, и воздвигнул Господь спасителя… Гофониила, сына Кеназа, младшего брата Халевова».<span>СУДЕЙ 3:9</span></div>","arch":"<p>Хеврон (эль-Халиль) — древнейший город в горах Иудеи (около 3800 до н.э.). Пещера Махпела — гробница патриархов (Быт 23). Город-убежище (Нав 21). Давид правил здесь 7,5 лет (2Цар 2). Раскопки — ханаанейская стена, израильский телль.</p><p>Позже, до покорения Иерусалима, Хеврон стал первой резиденцией царя Давида (2 Цар 2:11) — семь с половиной лет столица Иудеи.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Гофониил — первый судья:</b> Племянник Халева, взявший Кириаф-Сефер. Его имя означает «лев Божий». Он освободил Израиль от Хусарсафема Месопотамского — первый в цикле: отступление, угнетение, покаяние, освобождение.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/640px-Hebron_Cave_of_the_Patriarchs.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","label":"Хеврон — пещера Махпела","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Ранние судьи","d":"","age":"ГОФОНИИЛ · АОД · САМЕГАР","km":"~1380–1200","r":"Суд 1–3"},{"n":"II","t":"Девора и Варак","d":"","age":"ПЕСНЬ ДЕВОРЫ · АСОР · КИССОН","km":"~1200–1140","r":"Суд 4–5"},{"n":"III","t":"Гедеон","d":"","age":"300 ВОИНОВ · МАДИАНИТЯНЕ","km":"~1190–1140","r":"Суд 6–9"},{"n":"IV","t":"Иеффай","d":"","age":"ГАЛААД · АММОНИТЯНЕ","km":"~1118–1094","r":"Суд 10–12"},{"n":"V","t":"Самсон","d":"","age":"ФИЛИСТИМЛЯНЕ · ДАЛИДА","km":"~1118–1078","r":"Суд 13–16"},{"n":"VI","t":"Крах Силоа","d":"","age":"ИЛИЙ · САМУИЛ · КОВЧЕГ","km":"~1078–1050","r":"1Цар 1–7"}];window.ATLAS_WPS=[{"n":"Силом (арх. комплекс)","role":"","note":""},{"n":"Тель Хацор (раскопки)","role":"","note":""},{"n":"Тель Мегиддо","role":"","note":""},{"n":"Газа (филистимская)","role":"","note":""}];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
