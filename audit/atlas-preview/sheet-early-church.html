<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Ранняя Церковь · Деяния 1–12 — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#f3ecdc;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#5a4114;stroke-width:.85px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#5a4114;stroke-width:.9px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.3;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.5;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.7);stroke-width:.7px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#f5edd8;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#f5edd8;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}
  .spine-it:hover{background:rgba(138,106,31,.08)}
  .spine-it--on{background:rgba(138,106,31,.14);box-shadow:inset 3px 0 0 #8a6a1f}
  .spine-head{padding:12px 12px 8px;font:700 10px/1 Georgia,serif;letter-spacing:.28em;color:#8a6a1f;border-bottom:1px solid rgba(138,106,31,.25)}
  .spine-cover{position:relative;display:block}

  .place-card{position:fixed;z-index:30;width:300px;background:#f6f1e7;border:1px solid rgba(138,106,31,.45);border-radius:12px;box-shadow:0 14px 40px rgba(60,45,15,.35);overflow:hidden;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none;font-family:Lora,Georgia,serif}
  .place-card.pc--on{opacity:1;transform:none}
  .pc-ph{position:relative;height:130px;background:#e8dcbc}
  .pc-ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pc-ph i{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font:600 9px/1 system-ui;letter-spacing:.12em;color:#fff;background:linear-gradient(transparent,rgba(20,14,4,.72))}
  .pc-body{padding:10px 12px 12px}
  .pc-body b{display:block;font:700 15px/1.2 Georgia,serif;color:#1e3a63}
  .pc-body u{display:block;text-decoration:none;font:600 10.5px/1.3 Georgia,serif;color:#8a6a1f;letter-spacing:.06em;margin-top:2px}
  .pc-body p{margin:7px 0 0;font:400 12px/1.5 Georgia,serif;color:#3a3020}
  /* ── Панель-досье (клик по месту) ── */
  .dossier{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);z-index:26;background:#f6f1e7;border-left:1px solid rgba(138,106,31,.4);box-shadow:-16px 0 44px rgba(60,45,15,.3);transform:translateX(103%);transition:transform .28s ease;display:flex;flex-direction:column;font-family:Lora,Georgia,serif}
  .dossier.do--on{transform:none}
  .do-x{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:9px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.95);color:#7a5c26;font-size:19px;cursor:pointer}
  .do-head{padding:16px 54px 12px 18px;border-bottom:1px solid rgba(138,106,31,.25);background:rgba(240,232,210,.6)}
  .do-head b{display:block;font:700 20px/1.2 Georgia,serif;color:#1e3a63}
  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}
  .do-scroll{overflow-y:auto;padding:14px 18px 22px;flex:1}
  .do-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .do-ph{margin:0}
  .do-ph img{width:100%;height:96px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(90,70,30,.3);display:block;background:#e8dcbc}
  .do-ph figcaption{font:600 8.5px/1.3 system-ui;letter-spacing:.08em;color:#7a6a48;margin-top:3px}
  .do-ph figcaption i{display:block;font:400 8px/1.2 system-ui;color:#9a8a68;letter-spacing:0}
  .do-sec{margin:0 0 14px}
  .do-sec h4{margin:0 0 5px;font:700 10.5px/1 Georgia,serif;letter-spacing:.22em;color:#8a6a1f;text-transform:uppercase}

  .do-lex .lex-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}

  .do-lex .lex-tr{font-family:Lora,Georgia,serif;color:#8a6a30;font-size:.95em}
  .do-lex .lex-ru{font-family:Lora,Georgia,serif;font-weight:600;margin:.2em 0 .35em}
  .do-lex .lex-note{margin:.25em 0;line-height:1.55}
  .do-lex .lex-refs{margin:.35em 0 0;font-style:italic;color:#6b5a35;font-size:.92em}
  .do-lex .lex-glyph{display:flex;flex-direction:column;gap:2px;margin-top:.7em;padding-top:.6em;border-top:1px dashed rgba(138,106,31,.25)}
  .do-lex .lex-glyph b{font-family:Lora,Georgia,serif}
  .do-lex .lex-glyph span{line-height:1.5;font-size:.94em}
  .do-sec p{margin:0 0 8px;font:400 13.5px/1.6 Georgia,serif;color:#2b2418}
  .do-bible .verse{display:block;padding:10px 12px;background:rgba(30,58,99,.06);border-left:3px solid #1e3a63;border-radius:6px;font:italic 400 13.5px/1.55 Georgia,serif;color:#1e3a63;margin-bottom:8px}
  .do-bible .verse span{display:block;font:700 9.5px/1 system-ui;letter-spacing:.16em;color:#8a6a1f;margin-top:6px;font-style:normal}
  .do-sec .dispute-block{border:1px solid rgba(138,106,31,.35);border-radius:10px;padding:10px 12px;background:rgba(240,232,210,.5)}
  .do-sec .dispute-title{font:700 11px/1.2 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:7px}
  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}
  .do-sec .conf-med,.do-sec .conf-lo,.do-sec .conf-hi{display:inline-block;font:600 9px/1 system-ui;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(138,106,31,.15);color:#7a5c26}
  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  /* position:absolute относительно .wrap (не viewport) — иначе на широких
     экранах кнопки съезжают за реальный правый край листа (обрезаются
     тенью контейнера); top сдвинут ниже розы ветров (компас в SVG кончается
     на ~108px при ширине листа 1500px) — иначе кнопка "Домой" ложится
     поверх компаса */
  .dive-btn{position:absolute;right:10px;top:120px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}
  .home-btn{right:64px}
  .legend-btn{top:166px}
  .legend-pop{position:absolute;right:10px;top:210px;z-index:22;background:rgba(246,241,231,.96);border:1px solid rgba(138,106,31,.4);border-radius:10px;padding:10px 13px;box-shadow:0 4px 14px rgba(90,70,30,.28);font:400 12px/1.5 Georgia,serif;color:#3a3020;max-width:220px}
  .legend-pop b{display:block;font:700 11px/1 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:8px}
  .legend-pop i{display:flex;align-items:center;gap:8px;font-style:normal}
  .legend-pop span{flex:0 0 20px;height:10px;display:inline-block}
  .legend-pop .lg-route{border-top:2.2px dotted #b0472e}
  .legend-pop .lg-dot{flex-basis:9px;width:9px;height:9px;border-radius:50%;background:#1e3a63;border:1.5px solid #f6f1e7}
  .legend-pop .lg-cand{flex-basis:9px;width:9px;height:9px;border-radius:50%;border:1.4px dashed #8a6a1f}
  .legend-pop .lg-arch{flex-basis:9px;width:8px;height:8px;background:#4e7a52;transform:rotate(45deg)}
  .legend-pop .lg-war{border-top:0;color:#8a6668;font-weight:700}

  .legend-pop .lg-lot{border-top:1.5px dashed #7c93a8}
  .dive-btn:hover{background:#f6f1e7}
  body.dive .spine,body.dive .stage-strip,body.dive .g9{display:none}
  body.dive .wrap{max-width:none;border-radius:0;box-shadow:none}
  body.dive{padding:0}
</style>

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":null},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":null},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":null},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":null},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":null},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":null},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":true,"cover":null},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":null},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":null},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":null}];window.ATLAS_LAYERS=[{"id":"main","label":"Ранняя Церковь","pathLabel":"путь Ранняя Церковь"}];window.ATLAS_PLACES={"jerusalem_upper":{"n":"Иерусалим · Горница","k":"Пятидесятница · рождение Церкви","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/200px-Last_Supper_Room_Mount_Zion.jpg","tl":"Горница — гора Сион","f":"Горница на Сионской горе — место Тайной Вечери и сошествия Духа (Пятидесятница, Деян 2). Cenaculum — традиционная локализация; раннехристианская община Иерусалима собиралась здесь.","lex":null,"glyphs":[],"dossier":{"story":"<p>В горнице на горе Сион 120 учеников ожидали обещанного Утешителя. В день Пятидесятницы «внезапно сделался шум с неба» — и Дух Святой сошёл на них. Пётр произнёс проповедь, и 3000 душ присоединились к Церкви. Здесь началась история христианства.</p>","bible":"<div class=\"verse\">«И внезапно сделался шум с неба… И явились им разделяющиеся языки, как бы огненные, и почили по одному на каждом из них».<span>ДЕЯНИЯ 2:2-3</span></div>","arch":"<p>Горница на Сионской горе — место Тайной Вечери и сошествия Духа (Пятидесятница, Деян 2). Cenaculum — традиционная локализация; раннехристианская община Иерусалима собиралась здесь.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Рождение Церкви:</b> Пятидесятница — не просто историческое событие, а рождение нового народа Божьего. 3000 человек из разных народов услышали Евангелие на своих языках. Это была отмена Вавилонского рассеяния: если там Бог смешал языки для суда, то здесь Он дал языки для спасения.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/640px-Last_Supper_Room_Mount_Zion.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Last_Supper_Room_Mount_Zion.jpg/200px-Last_Supper_Room_Mount_Zion.jpg","label":"Горница — гора Сион","credit":"Wikimedia Commons"}]}},"temple_early":{"n":"Храм · Красные ворота","k":"Пётр и Иоанн · исцеление хромого","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Southern_Steps_of_the_Temple_Mount.jpg/200px-Southern_Steps_of_the_Temple_Mount.jpg","tl":"Южные ступени Храмовой горы","f":"Храм — первые христиане «пребывали в храме» (Деян 2:46). Красные (Прекрасные) ворота, у которых исцелился хромой (Деян 3), — восточные ворота двора женщин. Раскопки открыли фрагмен…","lex":null,"glyphs":[],"dossier":{"story":"<p>У Красных ворот Храма Пётр и Иоанн встретили хромого от рождения. «Серебра и золота нет у меня; а что имею, то даю тебе: во имя Иисуса Христа Назорея встань и ходи». Исцелённый «вошёл с ними в храм, ходя и скача и хваля Бога».</p>","bible":"<div class=\"verse\">«И, взяв его за правую руку, поднял; и вдруг укрепились его ступни и колени».<span>ДЕЯНИЯ 3:7</span></div>","arch":"<p>Храм — первые христиане «пребывали в храме» (Деян 2:46). Красные (Прекрасные) ворота, у которых исцелился хромой (Деян 3), — восточные ворота двора женщин. Раскопки открыли фрагменты ворот I в.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Серебра и золота нет у меня»:</b> У Петра и Иоанна не было денег, но было то, что ценнее — власть воскресшего Христа. Это исцеление привело к аресту апостолов и первой проповеди перед Синедрионом, где Пётр провозгласил: «Нет другого имени под небом» (Деян 4:12).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Southern_Steps_of_the_Temple_Mount.jpg/640px-Southern_Steps_of_the_Temple_Mount.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Southern_Steps_of_the_Temple_Mount.jpg/200px-Southern_Steps_of_the_Temple_Mount.jpg","label":"Южные ступени Храмовой горы","credit":"Wikimedia Commons"}]}},"solomons_porch":{"n":"Притвор Соломонов","k":"Собрания · знамения · рост Церкви","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/200px-Western_Wall_at_night.jpg","tl":"Стена Плача — Храмовая гора","f":"Притвор Соломонов (колоннада на восточной стороне Храмовой горы) — место проповеди Петра и Иисуса (Ин 10:23; Деян 3:11, 5:12). Раскопки открыли остатки колоннады Ирода.","lex":null,"glyphs":[],"dossier":{"story":"<p>В Притворе Соломоновом ежедневно собиралась иерусалимская церковь. Здесь апостолы совершали знамения и чудеса, народ приносил больных на улицы, «так что выносили больных на улицы и полагали на постелях… дабы хотя тень проходящего Петра осенила кого».</p>","bible":"<div class=\"verse\">«Все же верующие единодушно пребывали в притворе Соломоновом».<span>ДЕЯНИЯ 5:12</span></div>","arch":"<p>Притвор Соломонов (колоннада на восточной стороне Храмовой горы) — место проповеди Петра и Иисуса (Ин 10:23; Деян 3:11, 5:12). Раскопки открыли остатки колоннады Ирода.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Притвор Соломонов — место собрания первой церкви:</b> Здесь Иисус ходил зимой (Ин 10:23). Здесь Пётр проповедовал после исцеления хромого (Деян 3:11). Здесь ежедневно собирались верующие (Деян 5:12). Удивительно: Церковь родилась не в подполье, а в самом публичном месте Иерусалима.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/640px-Western_Wall_at_night.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f1/Western_Wall_at_night.jpg/200px-Western_Wall_at_night.jpg","label":"Стена Плача — Храмовая гора","credit":"Wikimedia Commons"}]}},"gaza_road":{"n":"Дорога в Газу","k":"Филипп и эфиопский евнух","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Gaza_Strip_map.png/200px-Gaza_Strip_map.png","tl":"Дорога в Газу — регион","f":"Дорога Иерусалим–Газa, где Филипп встретил эфиопского евнуха (Деян 8:26–40). Древняя римская дорога; Газa — филистимский/эллинистический город.","lex":null,"glyphs":[],"dossier":{"story":"<p>«Ангел Господень сказал Филиппу: встань и иди на полдень, на дорогу, идущую из Иерусалима в Газу» (Деян 8:26). На этой дороге Филипп встретил эфиопского евнуха, читавшего Исайю 53. Филипп благовествовал ему об Иисусе и крестил его — первое обращение африканца.</p>","bible":"<div class=\"verse\">«И, начав от сего Писания, благовествовал ему об Иисусе».<span>ДЕЯНИЯ 8:35</span></div>","arch":"<p>Дорога Иерусалим–Газa, где Филипп встретил эфиопского евнуха (Деян 8:26–40). Древняя римская дорога; Газa — филистимский/эллинистический город.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Первое обращение африканца:</b> Эфиопский евнух читал Исайю 53 — главу о страдающем Рабе. Филипп «начав от сего Писания, благовествовал ему об Иисусе» (Деян 8:35). Евангелие выходит за пределы Израиля — в Эфиопию, в Африку. Исайя 56:3-5 обещал евнухам место в доме Божьем — и вот оно исполнилось.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Gaza_Strip_map.png/640px-Gaza_Strip_map.png","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Gaza_Strip_map.png/200px-Gaza_Strip_map.png","label":"Дорога в Газу — регион","credit":"Wikimedia Commons"}]}},"samaria_philip":{"n":"Самария","k":"Филипп · Симон волхв","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","tl":"Руины Самарии (Себастия)","f":"Самария (Себаста) — где Филипп проповедовал (Деян 8:5–25). Раскопки открыли город, перестроенный Иродом (храм Августа, колоннады).","lex":null,"glyphs":[],"dossier":{"story":"<p>Филипп пошёл в Самарию и проповедовал Христа. Народ единодушно внимал, совершались исцеления. Симон волхв уверовал и крестился, но пытался купить дар Святого Духа за деньги. Пётр и Иоанн пришли из Иерусалима, чтобы самаряне получили Духа Святого.</p>","bible":"<div class=\"verse\">«Но Пётр сказал ему: серебро твоё да будет в погибель с тобою».<span>ДЕЯНИЯ 8:20</span></div>","arch":"<p>Самария (Себаста) — где Филипп проповедовал (Деян 8:5–25). Раскопки открыли город, перестроенный Иродом (храм Августа, колоннады).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Евангелие в Самарии:</b> Филипп проповедовал в Самарии — первый выход Евангелия за пределы Иудеи. Самаряне приняли слово, и Пётр с Иоанном пришли, чтобы они получили Духа Святого. Это исполнение Деян 1:8.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/640px-Sebastia-313.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","label":"Руины Самарии (Себастия)","credit":"Wikimedia Commons"}]}},"lydda":{"n":"Лидда","k":"Пётр исцеляет Енея","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Lod_street.jpg/200px-Lod_street.jpg","tl":"Лод (Лидда) — современный вид","f":"Лидда (Лод) — где Пётр исцелил Энея (Деян 9:32–35). Древний город на прибрежной равнине, перекрёсток дорог.","lex":null,"glyphs":[],"dossier":{"story":"<p>В Лидде Пётр исцелил Енея, который 8 лет лежал в постели расслабленным. «Еней! исцеляет тебя Иисус Христос; встань с постели твоей». И он тотчас встал. Все жители Лидды и Сарона обратились к Господу.</p>","bible":"<div class=\"verse\">«И видели его все, живущие в Лидде и в Сароне, и обратились к Господу».<span>ДЕЯНИЯ 9:35</span></div>","arch":"<p>Лидда (Лод) — где Пётр исцелил Энея (Деян 9:32–35). Древний город на прибрежной равнине, перекрёсток дорог.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Еней! исцеляет тебя Иисус Христос»:</b> Пётр не говорит «я исцеляю тебя» или «Бог исцеляет». Он называет имя Иисуса. Все чудеса в Деяниях совершаются во имя Христа — продолжение Его служения через апостолов.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Lod_street.jpg/640px-Lod_street.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Lod_street.jpg/200px-Lod_street.jpg","label":"Лод (Лидда) — современный вид","credit":"Wikimedia Commons"}]}},"joppa":{"n":"Иоппия","k":"Воскрешение Тавифы · видение Петра","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Jaffa_Old_City_panoramic.jpg/200px-Jaffa_Old_City_panoramic.jpg","tl":"Яффо (Иоппия) — старый город","f":"Иоппия (Яффа) — порт, где Пётр воскресил Тавифу и видел видение (Деян 9:36–43, 10). Древний финикийский/еврейский порт.","lex":null,"glyphs":[],"dossier":{"story":"<p>В Иоппии Пётр воскресил Тавифу (Серну), ученицу, которая «была исполнена добрых дел». Здесь же, на кровле дома Симона-кожевника, Пётр увидел видение о полотне с нечистыми животными: «Что Бог очистил, того ты не почитай нечистым». Это открыло путь к проповеди язычникам.</p>","bible":"<div class=\"verse\">«И слышу глас: что Бог очистил, того ты не почитай нечистым».<span>ДЕЯНИЯ 10:15</span></div>","arch":"<p>Иоппия (Яффа) — порт, где Пётр воскресил Тавифу и видел видение (Деян 9:36–43, 10). Древний финикийский/еврейский порт.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Видение Петра:</b> На кровле дома Симона-кожевника Пётр увидел полотно с нечистыми животными. «Что Бог очистил, того ты не почитай нечистым». Это видение открыло дверь для проповеди язычникам — один из важнейших поворотов в книге Деяний.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Jaffa_Old_City_panoramic.jpg/640px-Jaffa_Old_City_panoramic.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/17/Jaffa_Old_City_panoramic.jpg/200px-Jaffa_Old_City_panoramic.jpg","label":"Яффо (Иоппия) — старый город","credit":"Wikimedia Commons"}]}},"caesarea_cornelius":{"n":"Кесария Приморская","k":"Корнилий · первые язычники","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Caesarea_Maritima_aqueduct.jpg/200px-Caesarea_Maritima_aqueduct.jpg","tl":"Акведук Кесарии Приморской","f":"Кесария Приморская построена Иродом Великим (22–10 гг. до н.э.). Раскопан порт, театр, дворец прокуратора (здесь Павел провёл 2 года в узах). Надпись Пилата найдена в театре: «Tibe…","lex":null,"glyphs":[],"dossier":{"story":"<p>Корнилий, римский сотник из Италийского полка — первый язычник, принявший крещение. Когда Пётр проповедовал в его доме, Дух Святой сошёл на всех слушавших. «Кто может запретить креститься водою тем, которые, как и мы, получили Святого Духа?»</p>","bible":"<div class=\"verse\">«Итак и язычникам дал Бог покаяние в жизнь».<span>ДЕЯНИЯ 11:18</span></div>","arch":"<p>Кесария Приморская построена Иродом Великим (22–10 гг. до н.э.). Раскопан порт, театр, дворец прокуратора (здесь Павел провёл 2 года в узах). Надпись Пилата найдена в театре: «Tiberieum… Pontius Pilatus… Praefectus Iudaeae».</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Первые язычники:</b> Корнилий, римский сотник, стал первым язычником, принявшим крещение. Когда Пётр проповедовал, Дух Святой сошёл на всех слушавших — до крещения! «Кто может запретить креститься водою тем, которые получили Святого Духа?»</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Caesarea_Maritima_aqueduct.jpg/640px-Caesarea_Maritima_aqueduct.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Caesarea_Maritima_aqueduct.jpg/200px-Caesarea_Maritima_aqueduct.jpg","label":"Акведук Кесарии Приморской","credit":"Wikimedia Commons"}]}},"damascus":{"n":"Дамаск","k":"Обращение Савла · прямая улица","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/200px-Umayyad_Mosque_%28night%29.jpg","tl":"Мечеть Омейядов — Дамаск","f":"Прямая улица (Via Recta) Дамаска существует до сих пор. Традиционный дом Анании — подземная церковь в старом городе. Дамаск — один из древнейших непрерывно населённых городов мира.","lex":null,"glyphs":[],"dossier":{"story":"<p>На пути в Дамаск Савл, «ещё дыша угрозами и убийством на учеников Господа», встретил Воскресшего Христа. «Савл, Савл! что ты гонишь Меня?» — ослепший, он был приведён в Дамаск, где Анания вернул ему зрение. Савл крестился и немедленно начал проповедовать Христа.</p>","bible":"<div class=\"verse\">«Савл, Савл! что ты гонишь Меня? Трудно тебе идти против рожна».<span>ДЕЯНИЯ 9:4-5</span></div>","arch":"<p>Прямая улица (Via Recta) Дамаска существует до сих пор. Традиционный дом Анании — подземная церковь в старом городе. Дамаск — один из древнейших непрерывно населённых городов мира.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Савл, Савл! что ты гонишь Меня?»:</b> Христос не спрашивает: «Почему ты гонишь Моих учеников?» Он говорит: «Меня». Церковь — Тело Христово. Гонение на Церковь — это гонение на Самого Христа. Это единство Христа и Его Церкви — ключевая истина, которую Павел позже разовьёт в своих посланиях.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/640px-Umayyad_Mosque_%28night%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/200px-Umayyad_Mosque_%28night%29.jpg","label":"Мечеть Омейядов — Дамаск","credit":"Wikimedia Commons"}]}},"tarsus":{"n":"Тарс","k":"Родина Савла · Киликия","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Tarsus_St_Paul_church.jpg/200px-Tarsus_St_Paul_church.jpg","tl":"Церковь Св. Павла — Тарс","f":"Тарс — родина апостола Павла (Деян 9:11, 22:3), крупный университетский центр Киликии. Раскопки открыли римские ворота (Ворота Клеопатры), улицу, рынок.","lex":null,"glyphs":[],"dossier":{"story":"<p>«Я Иудеянин, родившийся в Тарсе Киликийском» (Деян 21:39). После обращения Савл вернулся в родной город на несколько лет. Варнава позже нашёл его здесь и привёл в Антиохию для совместного служения (Деян 11:25-26).</p>","bible":"<div class=\"verse\">«Потом Варнава пошёл в Тарс искать Савла и, найдя его, привёл в Антиохию».<span>ДЕЯНИЯ 11:25-26</span></div>","arch":"<p>Тарс — родина апостола Павла (Деян 9:11, 22:3), крупный университетский центр Киликии. Раскопки открыли римские ворота (Ворота Клеопатры), улицу, рынок.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Годы молчания:</b> После обращения Савл провёл несколько лет в родном Тарсе (Деян 9:30). Что он делал? Гал 1:17-18: «Я пошёл в Аравию, и опять возвратился в Дамаск. Потом, спустя три года, ходил я в Иерусалим». Аравия, Тарс, Дамаск — Павел не сразу стал апостолом. Бог готовил его в тишине.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Tarsus_St_Paul_church.jpg/640px-Tarsus_St_Paul_church.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Tarsus_St_Paul_church.jpg/200px-Tarsus_St_Paul_church.jpg","label":"Церковь Св. Павла — Тарс","credit":"Wikimedia Commons"}]}},"antioch_church":{"n":"Антиохия Сирийская","k":"Первая церковь из язычников · «христиане»","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Saint_Pierre_Church%2C_Antakya_01.jpg/200px-Saint_Pierre_Church%2C_Antakya_01.jpg","tl":"Церковь Св. Петра — Антакья (Антиохия)","f":"Антиохия Сирийская — где впервые последователей назвали «христианами» (Деян 11:26), база миссий Павла. Раскопки открыли колоссальный эллинистическо-римский город с прямой колоннадн…","lex":null,"glyphs":[],"dossier":{"story":"<p>После гонений на Стефана ученики рассеялись до Финикии, Кипра и Антиохии. Здесь Евангелие впервые систематически проповедовалось язычникам. Варнава и Савл учили целый год. «И ученики в Антиохии в первый раз стали называться Христианами» (Деян 11:26).</p>","bible":"<div class=\"verse\">«…И ученики в Антиохии в первый раз стали называться Христианами».<span>ДЕЯНИЯ 11:26</span></div>","arch":"<p>Антиохия Сирийская — где впервые последователей назвали «христианами» (Деян 11:26), база миссий Павла. Раскопки открыли колоссальный эллинистическо-римский город с прямой колоннадной улицой.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Антиохия — вторая столица христианства:</b> После Иерусалима именно Антиохия стала центром миссии к язычникам. Отсюда Павел и Варнава отправились во все три путешествия. Здесь Дух Святой сказал: «Отделите Мне Варнаву и Савла» (Деян 13:2).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Saint_Pierre_Church%2C_Antakya_01.jpg/640px-Saint_Pierre_Church%2C_Antakya_01.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cb/Saint_Pierre_Church%2C_Antakya_01.jpg/200px-Saint_Pierre_Church%2C_Antakya_01.jpg","label":"Церковь Св. Петра — Антакья (Антиохия)","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Пятидесятница и Иерусалим","d":"","age":"30–35 ГГ. · РОЖДЕНИЕ ЦЕРКВИ","km":"","r":"Деян 1–5"},{"n":"II","t":"Пётр в Иудее и Самарии","d":"","age":"35–40 ГГ. · ЛИДДА · ИОППИЯ · КЕСАРИЯ","km":"","r":"Деян 8–10"},{"n":"III","t":"Гонения и рассеяние","d":"","age":"35–37 ГГ. · СТЕФАН · ФИЛИПП","km":"","r":"Деян 6–8"},{"n":"IV","t":"Обращение Савла и Антиохия","d":"","age":"37–47 ГГ. · ДАМАСК · АНТИОХИЯ","km":"","r":"Деян 9, 11"}];window.ATLAS_WPS=[];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
