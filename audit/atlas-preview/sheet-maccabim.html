<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Межзаветный период · Маккавеи — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#e3d4ac}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#ecdcb4}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ═══ E1: территории-уделы (заливка+граница+подпись+бейдж) ═══ */
  .region{cursor:pointer}
  .region-fill{opacity:.42;stroke:none;transition:opacity .2s}
  svg.zoomed .region-fill{opacity:.34}
  svg.z3 .region-fill{opacity:.24}
  svg.z4 .region-fill{opacity:.16}
  .region:hover .region-fill{opacity:.56}
  .region-border{fill:none;stroke:#5c4a24;stroke-width:1.1px;stroke-dasharray:5 3.5;opacity:.55;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .region-border-k{fill:none;stroke:#5c4a24;stroke-width:1.5px;opacity:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .region-name{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;fill:#4a3a1c;letter-spacing:.14em;text-transform:uppercase;opacity:.8;paint-order:stroke;stroke:#ecdcb4;stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
  .region-badge{stroke:#ecdcb4;stroke-width:1.3px;vector-effect:non-scaling-stroke}
  .region-badge-t{font-family:Georgia,serif;font-weight:700;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(60,40,10,.35);stroke-width:.4px}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  /* иконки живут мелко; при наведении — плавно вырастают из своего основания
     (transform-origin у «земли»), штрихи non-scaling держат тонкость */
  #sheet-svg .glyph{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
  #sheet-svg .glyph-hit:hover .glyph,
  #sheet-svg .glyph-hit:focus-visible .glyph{transform:scale(1.7);transform-box:fill-box;transform-origin:50% 90%}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#6a5028;stroke-width:.62px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#6a5028;stroke-width:.68px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.2;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.32;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.6);stroke-width:.55px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#ecdcb4;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#ecdcb4;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#ecdcb4;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(247,242,231,.82);stroke:rgba(138,106,31,.28);stroke-width:1}
  .cart-rule{stroke:rgba(138,106,31,.3);stroke-width:.8}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}

ив Иудеи. 2Макк 4 описывает роскошь и коррупцию. Раскопки открыли остатки античного города на материке и островной части.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Исполнение пророчества:</b> Иезекииль 26 предсказал разрушение Тира за 250 лет до Александра. Александр построил дамбу от берега к острову и разрушил город. «И разобьют стены Тира и разрушат башни его… и сделаю тебя голою скалою» (Иез 26:4,14).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Tyre_Al_Mina_Excavations_-_The_Roman_City_2.jpg/640px-Tyre_Al_Mina_Excavations_-_The_Roman_City_2.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Tyre_Al_Mina_Excavations_-_The_Roman_City_2.jpg/200px-Tyre_Al_Mina_Excavations_-_The_Roman_City_2.jpg","label":"Тир — римские руины Аль-Мина","credit":"Wikimedia Commons"}]}},"jerusalem_meet":{"n":"Иерусалим","k":"Встреча с Александром · Храм","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/200px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","tl":"Храмовая гора — Иерусалим","f":"Крепость Акра (Ακρα), построенная Антиохом IV Эпифаном для контроля над Храмом (1Макк 1:33–40), оставалась символом селевкидского господства, пока Симон не взял её (1Макк 13:49–52)…","lex":null,"glyphs":[],"dossier":{"story":"<p>По свидетельству Иосифа Флавия, Александр Великий посетил Иерусалим и почтил первосвященника, признав в нём фигуру из своего сна. Здесь же Антиох IV Епифан осквернил Храм в 167 г. до н.э., установив «мерзость запустения» (Дан 11:31). Именно это событие спровоцировало Маккавейское восстание.</p>","bible":"<div class=\"verse\">«И поставят мерзость запустения».<span>ДАНИИЛ 11:31</span></div>","arch":"<p>Крепость Акра (Ακρα), построенная Антиохом IV Эпифаном для контроля над Храмом (1Макк 1:33–40), оставалась символом селевкидского господства, пока Симон не взял её (1Макк 13:49–52).</p><p>С 2015 г. в районе Givati Parking (юго-восток Старого города) IAA/Тель-Авивский университет раскопали массивную эллинистическую башню с наклонным glacis (оборонительным склоном) IV–II вв. до н.э. Команда (Дорот Бен-Ами) предлагает идентифицировать её с Акрой, но это дискуссионно — традиционная локализация севернее Храмовой горы.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Ханука: историческое событие и раввинистическая традиция</div><div class=\"dispute-pos cons\"><b>1 Маккавейская 4:36-59:</b> Очищение Храма 25 Кислева 164 г. до н.э., 8-дневное празднование. <span class=\"conf-hi\">Надёжность: высокая</span></div><div class=\"dispute-pos alt\"><b>Талмуд (Шаббат 21b):</b> Чудо с маслом — кувшина хватило на 8 дней. Добавлено позже, не в 1Макк. <span class=\"conf-med\">Надёжность: традиция, не история</span></div><div class=\"dispute-note\">Историческое ядро (очищение Храма) надёжно. Чудо с маслом — поздняя традиция, не влияющая на историчность события.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Даниил 11 — детальная карта межзаветной истории:</b> Пророчество Даниила (гл. 11) с поразительной точностью описывает войны Птолемеев и Селевкидов, «презренного» Антиоха IV и осквернение Храма — за 400 лет до событий. Это одно из самых сильных свидетельств богодухновенности Писания.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/640px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/200px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","label":"Храмовая гора — Иерусалим","credit":"Wikimedia Commons"}]}},"alexandria":{"n":"Александрия","k":"Септуагинта · центр диаспоры","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Alexandria_12-9-2005_3.JPG/200px-Alexandria_12-9-2005_3.JPG","tl":"Александрия — гавань и крепость Кайтбей","f":"Александрия Египетская — крупнейший эллинистический центр, где по инициативе Птолемеев была создана Септуагинта (LXX, греческий перевод Ветхого Завета, III в. до н.э.). Город олице…","lex":null,"glyphs":[],"dossier":{"story":"<p>Александрия Египетская — величайший центр еврейской диаспоры. Здесь при Птолемее II Филадельфе (285–246) был выполнен перевод Ветхого Завета на греческий — Септуагинта (LXX). Филон Александрийский, крупнейший еврейский философ, жил и писал здесь.</p>","bible":"<div class=\"verse\">Перевод 70 толковников (Септуагинта) стал Библией ранней Церкви — именно её цитируют апостолы в Новом Завете.</div>","arch":"<p>Александрия Египетская — крупнейший эллинистический центр, где по инициативе Птолемеев была создана Септуагинта (LXX, греческий перевод Ветхого Завета, III в. до н.э.). Город олицетворяет культурное давление эллинизма, против которого поднялись Маккавеи. Раскопки открыли район царских дворцов, храм Сераписа, знаменитый маяк на Фаросе.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Септуагинта — Библия апостолов:</b> Когда новозаветные авторы цитируют Ветхий Завет, они в 80% случаев цитируют именно Септуагинту, а не еврейский оригинал. Бог использовал греческий перевод, подготовленный за 200 лет до Христа, чтобы Евангелие могло распространяться на языке всей империи.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Alexandria_12-9-2005_3.JPG/640px-Alexandria_12-9-2005_3.JPG","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Alexandria_12-9-2005_3.JPG/200px-Alexandria_12-9-2005_3.JPG","label":"Александрия — гавань и крепость Кайтбей","credit":"Wikimedia Commons"}]}},"modiin":{"n":"Модиин","k":"Родина Маккавеев · начало восстания","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Modiin_Illit.jpg/200px-Modiin_Illit.jpg","tl":"Модиин — родина Маккавейского восстания","f":"Древний Модиин — родина Хасмонеев (1Макк 2:1) — до сих пор не локализован бесспорно. Главный кандидат — окрестности арабской деревни Аль-Мидья (Хорбат Ха-Гарди), название которой с…","lex":null,"glyphs":[],"dossier":{"story":"<p>Модиин — родной город священника Маттафии Хасмонея и его пяти сыновей. В 167 г. до н.э. Маттафия отказался принести языческую жертву и убил царского посланника. С этого началось Маккавейское восстание: «Всякий ревнитель закона — за мной!» (1Макк 2:27).</p>","bible":"<div class=\"verse\">«И возревновал Маттафия о законе… и воскликнул громким голосом: всякий, кто ревнует о законе, выходи за мною!»<span>1МАККАВЕЙСКАЯ 2:27</span></div>","arch":"<p>Древний Модиин — родина Хасмонеев (1Макк 2:1) — до сих пор не локализован бесспорно. Главный кандидат — окрестности арабской деревни Аль-Мидья (Хорбат Ха-Гарди), название которой созвучно «Модиину».</p><p>В 1870 г. Виктор Герен раскопал здесь мавзолей (21×82 фута) из тёсаного камня с погребальной камерой и следами пирамидальной надстройки — точно как у Иосифа Флавия (семь пирамид гробницы Маккавеев). Но в 1870-х Ш. Клермон-Ганно нашёл на полу мозаики с византийским крестом и признал сооружение христианским.</p><p>В 2015 г. Управление древностей Израиля (Амит Реем, Дан Шахар) возобновило раскопки: обнаружили мавзолей на массивных столбах со вторым этажом и передним двором. Вердикт IAA: «археологических доказательств пока недостаточно, загадка не решена».</p>","dispute":"⚖ Спор о локализации. Кандидаты на древний Модиин: (1) Аль-Мидья / Хорбат Ха-Гарди — традиционный (совпадение названия + «гробница Маккавеев», но с христианской надстройкой); (2) Умм эль-Умдан — раскопки IAA открыли синагогу эпохи Второго храма; (3) Тиват/Рас эль-Тинахух. Ни один не признан бесспорным. Источники: 1Макк 2:1; 13:25–30; Иосиф Флавий, Древности 13.6.5–6; IAA, 21.09.2015.","bible_extra":"<p class=\"bib-note\"><b>Маттафия — священник, ставший воином:</b> Он не был профессиональным солдатом. Он был священником из рода Хасмонеев, который отказался поклониться идолам. Его действие — убийство отступника и царского посланника — было актом святой ревности, подобным Финеесу (Числ 25:7-8).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Modiin_Illit.jpg/640px-Modiin_Illit.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4e/Modiin_Illit.jpg/200px-Modiin_Illit.jpg","label":"Модиин — родина Маккавейского восстания","credit":"Wikimedia Commons"}]}},"antioch_syria":{"n":"Антиохия Сирийская","k":"Столица Селевкидов · Антиох IV","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/200px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","tl":"Мозаика Антиохии Сирийской","f":"Антиохия Сирийская — столица державы Селевкидов, резиденция Антиоха IV Эпифана. Отсюда шли указы о гонениях на иудейскую веру (1Макк 1). Раскопки открыли колоссальный город с прямо…","lex":null,"glyphs":[],"dossier":{"story":"<p>Антиохия на Оронте — столица Селевкидской империи, один из четырёх великих городов эллинистического мира. Отсюда Антиох IV Епифан издавал указы против иудейской религии: запрет субботы, обрезания, свитки Торы сжигались.</p>","bible":"<div class=\"verse\">«И возвратившись, вознегодует на святой завет… и войдёт в соглашение с отступниками от святого завета».<span>ДАНИИЛ 11:30</span></div>","arch":"<p>Антиохия Сирийская — столица державы Селевкидов, резиденция Антиоха IV Эпифана. Отсюда шли указы о гонениях на иудейскую веру (1Макк 1). Раскопки открыли колоссальный город с прямой улицей, храмом Аполлона в Дафне; один из крупнейших городов античного мира.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Антиох IV — прообраз антихриста:</b> Его действия — осквернение Храма, требование поклонения себе, преследование верных — стали прообразом «человека греха» (2Фес 2:3-4). Даниил 11:36-37 описывает царя, который «вознесётся выше всякого божества» — двойное исполнение: Антиох и будущий антихрист.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/640px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/200px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","label":"Мозаика Антиохии Сирийской","credit":"Wikimedia Commons"}]}},"beth_horon":{"n":"Беф-Орон","k":"Победа Иуды Маккавея · 166 г.","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Beit_Horon.jpg/200px-Beit_Horon.jpg","tl":"Беф-Орон — вид на перевал","f":"Верхний и Нижний Беф-Орон (Бейт Ур аль-Фаука / аль-Тахта) охраняли стратегический перевал на дороге из прибрежной равнины в Иерусалим. Здесь Иуда Маккавей разбил Серона (1Макк 3:13…","lex":null,"glyphs":[],"dossier":{"story":"<p>У перевала Беф-Орон Иуда Маккавей одержал первую крупную победу над армией Селевкидов под командованием Аполлония. С небольшим отрядом он разбил превосходящие силы — и с тех пор имя Маккавея стало символом сопротивления.</p>","bible":"<div class=\"verse\">«И напал на них Иуда, и убито было много, а остальные разбежались».<span>1МАККАВЕЙСКАЯ 3:24</span></div>","arch":"<p>Верхний и Нижний Беф-Орон (Бейт Ур аль-Фаука / аль-Тахта) охраняли стратегический перевал на дороге из прибрежной равнины в Иерусалим. Здесь Иуда Маккавей разбил Серона (1Макк 3:13–26). Раскопки подтверждают укреплённый эллинистическо-хасмонейский город на перевале.</p>","dispute":"⚖ Два Беф-Орона. Битва с Сероном традиционно локализуется на подъёме к Верхнему Беф-Орону. Источники: 1Макк 3:13–26; Иосиф Флавий, Древности 12.8.4.","bible_extra":"<p class=\"bib-note\"><b>Беф-Орон — место, где Бог сражается за Свой народ:</b> Этот перевал был местом не одной победы. Здесь Иисус Навин разбил аморреев (Нав 10:10-11). Здесь Иуда Маккавей разбил Аполлония. Один и тот же Бог, одна и та же география, та же верность.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Beit_Horon.jpg/640px-Beit_Horon.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Beit_Horon.jpg/200px-Beit_Horon.jpg","label":"Беф-Орон — вид на перевал","credit":"Wikimedia Commons"}]}},"emmaus":{"n":"Еммаус","k":"Решающая битва · 165 г.","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Emmaus_Nicopolis_basilica.jpg/200px-Emmaus_Nicopolis_basilica.jpg","tl":"Еммаус Никополь — базилика","f":"Еммаус, где Иуда Маккавей одержил ключевую победу над отрядами Горгиия и Никанора (1Макк 3:38–4:25). Emmaus Nicopolis (Имвас) — раскопки византийской базилики V–VI вв., римской дор…","lex":null,"glyphs":[],"dossier":{"story":"<p>Битва при Еммаусе — ключевое сражение Маккавейской войны. Армия Горгия и Никанора была разбита Иудой Маккавеем. После этой победы Иуда смог войти в Иерусалим и очистить Храм — событие, отмечаемое как Ханука.</p>","bible":"<div class=\"verse\">«И обратились в бегство язычники… Иуда же сказал: не желайте добычи, ибо война ещё предстоит нам».<span>1МАККАВЕЙСКАЯ 4:16-17</span></div>","arch":"<p>Еммаус, где Иуда Маккавей одержил ключевую победу над отрядами Горгиия и Никанора (1Макк 3:38–4:25). Emmaus Nicopolis (Имвас) — раскопки византийской базилики V–VI вв., римской дороги; идентификация с маккавейским Еммаусом основана на Иосифе Флавии.</p>","dispute":"⚖ Спор о локализации Еммауса. Для маккавейского контекста обычно Nicopolis (Имвас), но есть кандидаты: Абу-Гош (Кириаф-Иарим), Моца, эль-Кубейбе (последний — традиц. для Лк 24). Источники: 1Макк 3:38–4:25; Иосий Флавий, Древности 12.8.5, Война 2.21.3.","bible_extra":"<p class=\"bib-note\"><b>Два Еммауса:</b> Еммаус Маккавейский (битва 165 г. до н.э.) — не путать с Еммаусом из Лк 24:13 (явление Воскресшего Христа). Два разных места, два разных события. Но оба — места, где Бог явил Свою победу: военную при Маккавеях, и победу над смертью во Христе.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Emmaus_Nicopolis_basilica.jpg/640px-Emmaus_Nicopolis_basilica.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Emmaus_Nicopolis_basilica.jpg/200px-Emmaus_Nicopolis_basilica.jpg","label":"Еммаус Никополь — базилика","credit":"Wikimedia Commons"}]}},"beth_zur":{"n":"Беф-Цур","k":"Крепость · 164 г.","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Hebron_Hills.jpg/200px-Hebron_Hills.jpg","tl":"Хевронское нагорье — регион Беф-Цур","f":"Беф-Цур (Тель Бейт-Цур / Хирбет эт-Тубейка) — крепость на южных подступах к Иудее, где Иуда сразился с Лисием (1Макк 4:29–35). Раскопки (О. Р. Селлерс, Американская школа, 1931; по…","lex":null,"glyphs":[],"dossier":{"story":"<p>Беф-Цур — стратегическая крепость на южной границе Иудеи, которую Иуда Маккавей укрепил для защиты от идумеев. Здесь произошло несколько сражений с селевкидскими войсками Лисия.</p>","bible":"","arch":"<p>Беф-Цур (Тель Бейт-Цур / Хирбет эт-Тубейка) — крепость на южных подступах к Иудее, где Иуда сразился с Лисием (1Макк 4:29–35). Раскопки (О. Р. Селлерс, Американская школа, 1931; повторные 1957–1960) открыли укрепления эллинистического периода и крупную хасмонейскую крепость II в. до н.э.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Крепость на границе:</b> Беф-Цур защищал южную границу Иудеи от идумеев. Иуда Маккавей укрепил его как стратегический форпост. Через 200 лет Иуда Маккавей из другого колена — Иуда из рода Давида — родится в Вифлееме, всего в нескольких километрах отсюда.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Hebron_Hills.jpg/640px-Hebron_Hills.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/96/Hebron_Hills.jpg/200px-Hebron_Hills.jpg","label":"Хевронское нагорье — регион Беф-Цур","credit":"Wikimedia Commons"}]}},"beit_shean":{"n":"Беф-Сан","k":"Гибель царя Саула · Скифополь","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Beit_Shean_roman_theatre.jpg/200px-Beit_Shean_roman_theatre.jpg","tl":"Беф-Сан (Скифополь) — римский театр","f":"Беф-Сан (Скифополь) — крупный эллинистическо-римский город Декаполиса. Раскопки открыли театр, ипподром, колоннадные улицы. В маккавейский период — оплот эллинизма в регионе, контр…","lex":null,"glyphs":[],"dossier":{"story":"<p>Беф-Сан (эллинистический Скифополь) — город, где филистимляне повесили тело Саула на стене. В эллинистический период стал одним из городов Декаполиса. Упоминается в Маккавейских войнах как укреплённый пункт.</p>","bible":"","arch":"<p>Беф-Сан (Скифополь) — крупный эллинистическо-римский город Декаполиса. Раскопки открыли театр, ипподром, колоннадные улицы. В маккавейский период — оплот эллинизма в регионе, контраст с иудейской Иудеей.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Город, видевший падение и воскресение:</b> На стенах Беф-Сана филистимляне повесили тело Саула. Позже город стал Скифополем — одним из десяти городов Декаполиса. Через тысячу лет после Саула в этот регион придёт Иисус и исцелит гадаринского бесноватого.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Beit_Shean_roman_theatre.jpg/640px-Beit_Shean_roman_theatre.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Beit_Shean_roman_theatre.jpg/200px-Beit_Shean_roman_theatre.jpg","label":"Беф-Сан (Скифополь) — римский театр","credit":"Wikimedia Commons"}]}},"samaria_hasm":{"n":"Самария","k":"Разрушена Гирканом · 107 г.","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","tl":"Руины Самарии","f":"Самария (Шомрон) — столица Северного царства, перестроенная при Селевкидах и позже переименованная Иродом Великим в Себасту. Раскопки Гарварда (1908–1910) и последующие открыли дво…","lex":null,"glyphs":[],"dossier":{"story":"<p>Иоанн Гиркан I (134–104 до н.э.), внук Маттафии, расширил Хасмонейское царство и разрушил Самарию и храм на горе Гаризим (~107 г.). Это углубило раскол между иудеями и самарянами, сохранившийся до новозаветных времён.</p>","bible":"","arch":"<p>Самария (Шомрон) — столица Северного царства, перестроенная при Селевкидах и позже переименованная Иродом Великим в Себасту. Раскопки Гарварда (1908–1910) и последующие открыли дворцы, фортификации и римский храм Августа. Хронологически маккавейские события — до иродовой перестройки.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Корень вражды:</b> Разрушение Самарии и храма на Гаризиме Иоанном Гирканом (107 г. до н.э.) углубило раскол между иудеями и самарянами. Через 140 лет Иисус будет говорить с самарянкой у колодца Иакова (Ин 4) — исцеляя рану, нанесённую за полтора века до Него.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/640px-Sebastia-313.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","label":"Руины Самарии","credit":"Wikimedia Commons"}]}},"gerasa":{"n":"Гераса","k":"Город Декаполиса · гадаринский бесноватый","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Jerash_Forum.jpg/200px-Jerash_Forum.jpg","tl":"Джераш (Гераса) — форум","f":"Гераса (Джераш) — город Декаполиса, образец эллинистическо-римской городской культуры. Раскопки открыли знаменитый овальный форум, храм Артемиды, колоннаду. Как и Беф-Сан, иллюстри…","lex":null,"glyphs":[],"dossier":{"story":"<p>Гераса (Джераш, Иордания) — один из десяти городов Декаполиса, эллинистический центр в Заиорданье. Александр Яннай (103–76 до н.э.) завоевал город, расширив Хасмонейское царство до максимальных границ. В НЗ — возможное место исцеления гадаринского бесноватого.</p>","bible":"<div class=\"verse\">«И вышел из гробов человек, одержимый нечистым духом».<span>МАРКА 5:2</span></div>","arch":"<p>Гераса (Джераш) — город Декаполиса, образец эллинистическо-римской городской культуры. Раскопки открыли знаменитый овальный форум, храм Артемиды, колоннаду. Как и Беф-Сан, иллюстрирует эллинистическое окружение Иудеи.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Город, который построил римлянин для греков в иудейской земле:</b> Гераса (Джераш) — один из наиболее сохранившихся римских городов. Александр Яннай завоевал его для Хасмонейского царства. Через 100 лет Иисус исцелил гадаринского бесноватого в этом регионе (Мк 5:1-20).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Jerash_Forum.jpg/640px-Jerash_Forum.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/89/Jerash_Forum.jpg/200px-Jerash_Forum.jpg","label":"Джераш (Гераса) — форум","credit":"Wikimedia Commons"}]}},"masada":{"n":"Масада","k":"Крепость Хасмонеев","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Masada_Sunset.jpg/200px-Masada_Sunset.jpg","tl":"Масада — крепость на закате","f":"Масада — крепость на вершине плато над Мёртвым морем. Иосиф Флавий приписывает её первое укрепление Ионатану Хасмонею (Древности 13.8.4) — первому маккавейскому правителю; позже пе…","lex":null,"glyphs":[],"dossier":{"story":"<p>Масада — крепость на вершине скалы над Мёртвым морем, построенная Хасмонеями. Позже Ирод Великий превратил её в роскошный дворец-убежище. В 73 г. н.э., уже после разрушения Храма, стала последним оплотом еврейских повстанцев.</p>","bible":"","arch":"<p>Масада — крепость на вершине плато над Мёртвым морем. Иосиф Флавий приписывает её первое укрепление Ионатану Хасмонею (Древности 13.8.4) — первому маккавейскому правителю; позже перестроена Иродом. Раскопки Игаэля Ядина (1963–1965) открыли дворцы, синагогу и систему водосбора.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Масада — символ сопротивления и трагедии:</b> Крепость на вершине скалы (450 м над Мёртвым морем). Построена Хасмонеями, расширена Иродом. В 73 г. н.э. 960 еврейских повстанцев предпочли смерть римскому рабству. Их история, записанная Иосифом Флавием, стала символом: «Масада больше не падёт».</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Masada_Sunset.jpg/640px-Masada_Sunset.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0e/Masada_Sunset.jpg/200px-Masada_Sunset.jpg","label":"Масада — крепость на закате","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Александр Македонский","d":"","age":"332–323 ДО Н.Э.","km":"","r":"Дан 8:5-8; 11:3-4"},{"n":"II","t":"Под властью Птолемеев","d":"","age":"323–198 ДО Н.Э. · СЕПТУАГИНТА","km":"","r":"Дан 11:5-6"},{"n":"III","t":"Селевкиды и гонения","d":"","age":"198–167 ДО Н.Э. · АНТИОХ IV","km":"","r":"Дан 11:28-31; 1Макк 1"},{"n":"IV","t":"Восстание Маккавеев","d":"","age":"167–142 ДО Н.Э. · ХАНУКА","km":"","r":"1Макк 2–9; 2Макк 8–15"},{"n":"V","t":"Хасмонейское царство","d":"","age":"142–37 ДО Н.Э. · ДО ИРОДА","km":"","r":"1Макк 13–16; Иосиф Флавий"}];window.ATLAS_WPS=[];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
