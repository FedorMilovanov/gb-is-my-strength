<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>7 Церквей Откровения — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#f3ecdc;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  /* иконки живут мелко; при наведении — плавно вырастают из своего основания
     (transform-origin у «земли»), штрихи non-scaling держат тонкость */
  #sheet-svg .glyph{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
  #sheet-svg .glyph-hit:hover .glyph,
  #sheet-svg .glyph-hit:focus-visible .glyph{transform:scale(1.7);transform-box:fill-box;transform-origin:50% 90%}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#6a5028;stroke-width:.62px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#6a5028;stroke-width:.68px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.2;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.32;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.6);stroke-width:.55px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#f5edd8;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#f5edd8;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":null},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":null},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":null},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":null},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":null},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":null},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":null},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":null},{"slug":"revelation","title":"7 Церквей Откровения","current":true,"cover":null},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":null}];window.ATLAS_LAYERS=[{"id":"main","label":"7 церквей","pathLabel":"путь 7 церквей"}];window.ATLAS_PLACES={"ephesus_rev":{"n":"Эфес","k":"Оставила первую любовь","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/200px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","tl":"Библиотека Цельса — Эфес","f":"Эфес — крупнейший город римской Асии, центр культа Артемиды. Библиотека Цельса, театр на 25 000 мест. Павел провёл здесь почти 3 года (Деян 19). Церковь основана Павлом, затем возг…","lex":null,"glyphs":[],"dossier":{"story":"<p>Эфес — первая церковь, которой адресовано послание. Христос хвалит её за труд, терпение и различение лжеапостолов. Но упрёк серьёзен: «Ты оставил первую любовь твою». Вспомни, откуда ты ниспал, и покайся. Побеждающему дано вкушать от древа жизни.</p>","bible":"<div class=\"verse\">«Но имею против тебя то, что ты оставил первую любовь твою».<span>ОТКРОВЕНИЕ 2:4</span></div>","arch":"<p>Эфес — крупнейший город римской Асии, центр культа Артемиды. Библиотека Цельса, театр на 25 000 мест. Павел провёл здесь почти 3 года (Деян 19). Церковь основана Павлом, затем возглавлена Тимофеем, позже — апостолом Иоанном.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Ортодоксия без любви:</b> Эфесская церковь была доктринально чистой, но эмоционально холодной. Это предупреждение всем церквам, которые ставят правильное учение выше живой любви ко Христу и друг другу.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/640px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/200px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","label":"Библиотека Цельса — Эфес","credit":"Wikimedia Commons"}]}},"smyrna":{"n":"Смирна","k":"Верная в гонениях","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Smyrna_Agora.jpg/200px-Smyrna_Agora.jpg","tl":"Агора Смирны (Измир)","f":"Смирна (Измир) — древний портовый город. Агора, раскопанная в XX веке, показывает масштаб римского города. Поликарп, ученик Иоанна, был епископом Смирны и принял мученическую смерт…","lex":null,"glyphs":[],"dossier":{"story":"<p>Смирна — единственная церковь, не получившая упрёка. Христос знает её скорбь и нищету (но она богата!). «Не бойся ничего, что тебе надобно будет претерпеть». Верность до смерти — и венец жизни. Поликарп, епископ Смирны, был сожжён за веру в 155 г.</p>","bible":"<div class=\"verse\">«Будь верен до смерти, и дам тебе венец жизни».<span>ОТКРОВЕНИЕ 2:10</span></div>","arch":"<p>Смирна (Измир) — древний портовый город. Агора, раскопанная в XX веке, показывает масштаб римского города. Поликарп, ученик Иоанна, был епископом Смирны и принял мученическую смерть в 155 г.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Церковь без упрёка:</b> Смирна — единственная из семи, которую Христос ни в чём не упрекнул. Страдающая церковь часто оказывается самой чистой. Богатство в глазах Христа не измеряется банковским счётом.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Smyrna_Agora.jpg/640px-Smyrna_Agora.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Smyrna_Agora.jpg/200px-Smyrna_Agora.jpg","label":"Агора Смирны (Измир)","credit":"Wikimedia Commons"}]}},"pergamon":{"n":"Пергам","k":"Где престол сатаны","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Pergamon_Altar.jpg/200px-Pergamon_Altar.jpg","tl":"Пергамский алтарь (Пергамский музей, Берлин)","f":"Пергамский алтарь Зевса (II в. до н.э.) — массивная мраморная структура, сейчас в Пергамском музее Берлина. Храм императора Августа (29 г. до н.э.) — первый в Асии. Асклепион — мед…","lex":null,"glyphs":[],"dossier":{"story":"<p>Пергам — «ты живёшь там, где престол сатаны». Город был центром императорского культа с огромным алтарём Зевса. Христос упрекает церковь за терпимость к учению Валаама и Николаитов. Побеждающему — сокровенная манна и белый камень с новым именем.</p>","bible":"<div class=\"verse\">«Знаю твои дела, и что ты живёшь там, где престол сатаны».<span>ОТКРОВЕНИЕ 2:13</span></div>","arch":"<p>Пергамский алтарь Зевса (II в. до н.э.) — массивная мраморная структура, сейчас в Пергамском музее Берлина. Храм императора Августа (29 г. до н.э.) — первый в Асии. Асклепион — медицинский центр. Антипа был замучен здесь (Откр 2:13).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Престол сатаны»:</b> Скорее всего, алтарь Зевса или храм императорского культа. Пергам был первым городом, построившим храм живому императору. Церковь жила в эпицентре языческой власти — и устояла, но допустила компромисс внутри.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Pergamon_Altar.jpg/640px-Pergamon_Altar.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Pergamon_Altar.jpg/200px-Pergamon_Altar.jpg","label":"Пергамский алтарь (Пергамский музей, Берлин)","credit":"Wikimedia Commons"}]}},"thyatira":{"n":"Фиатира","k":"Иезавель и терпимость к греху","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Thyatira_Ruins.jpg/200px-Thyatira_Ruins.jpg","tl":"Руины Фиатиры (Акхисар)","f":"Фиатира (Акхисар) — небольшой город, известный гильдиями ремесленников (красильщики, гончары, кузнецы). Лидия, продавщица багряницы из Фиатиры, была первой европейской христианкой …","lex":null,"glyphs":[],"dossier":{"story":"<p>Фиатира — церковь, которую Христос хвалит за любовь, веру и служение, но упрекает за попустительство «Иезавели» — лжепророчице, вводящей в блуд и идоложертвенное. Христос даёт ей время на покаяние. Побеждающему — власть над народами и утренняя звезда.</p>","bible":"<div class=\"verse\">«И дал Я ей время покаяться в любодеянии её, но она не покаялась».<span>ОТКРОВЕНИЕ 2:21</span></div>","arch":"<p>Фиатира (Акхисар) — небольшой город, известный гильдиями ремесленников (красильщики, гончары, кузнецы). Лидия, продавщица багряницы из Фиатиры, была первой европейской христианкой (Деян 16:14).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Опасность терпимости к греху:</b> Любовь и служение Фиатиры были реальными, но Христос не принимает «хорошие дела» как оправдание терпимости к греху. Святость и любовь неразделимы.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Thyatira_Ruins.jpg/640px-Thyatira_Ruins.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Thyatira_Ruins.jpg/200px-Thyatira_Ruins.jpg","label":"Руины Фиатиры (Акхисар)","credit":"Wikimedia Commons"}]}},"sardis":{"n":"Сардис","k":"Имя живо, но ты мёртв","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Sardis_Temple_of_Artemis.jpg/200px-Sardis_Temple_of_Artemis.jpg","tl":"Храм Артемиды — Сардис","f":"Сардис — столица древней Лидии, город царя Креза. Расположен на горе Тмол. Дважды пал из-за невнимательности стражи (Кир, 546 г.; Антиох III, 214 г.). Храм Артемиды (IV в. до н.э.)…","lex":null,"glyphs":[],"dossier":{"story":"<p>Сардис — «ты носишь имя, будто жив, но ты мёртв». Самая страшная оценка из семи. Церковь с репутацией живой, но без реальной духовной жизни. «Вспомни, что ты принял и слышал, и храни и покайся». Немногие в Сардисе не осквернили одежд.</p>","bible":"<div class=\"verse\">«Знаю твои дела; ты носишь имя, будто жив, но ты мёртв».<span>ОТКРОВЕНИЕ 3:1</span></div>","arch":"<p>Сардис — столица древней Лидии, город царя Креза. Расположен на горе Тмол. Дважды пал из-за невнимательности стражи (Кир, 546 г.; Антиох III, 214 г.). Храм Артемиды (IV в. до н.э.). Синагога III в. н.э. — крупнейшая в Малой Азии.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Репутация без реальности:</b> Сардис — предупреждение церквам, которые живут прошлыми достижениями. Как город дважды пал из-за спящей стражи, так и церковь может потерять всё, если не бодрствует.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Sardis_Temple_of_Artemis.jpg/640px-Sardis_Temple_of_Artemis.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Sardis_Temple_of_Artemis.jpg/200px-Sardis_Temple_of_Artemis.jpg","label":"Храм Артемиды — Сардис","credit":"Wikimedia Commons"}]}},"philadelphia":{"n":"Филадельфия","k":"Отверстая дверь","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Philadelphia_Ala%C5%9Fehir_Church.jpg/200px-Philadelphia_Ala%C5%9Fehir_Church.jpg","tl":"Церковь Св. Иоанна — Филадельфия (Алашехир)","f":"Филадельфия (Алашехир) — город, основанный Атталом II Филадельфом (II в. до н.э.). Расположен в сейсмически активной зоне, часто разрушался землетрясениями. Жители часто жили вне г…","lex":null,"glyphs":[],"dossier":{"story":"<p>Филадельфия — церковь, не получившая упрёка. «Ты не много имеешь силы, но сохранил слово Моё и не отрёкся имени Моего». Христос открывает перед ней дверь, которую никто не может затворить. Обещание: «Сделаю столпом в храме Бога Моего».</p>","bible":"<div class=\"verse\">«Вот, Я отворил пред тобою дверь, и никто не может затворить её».<span>ОТКРОВЕНИЕ 3:8</span></div>","arch":"<p>Филадельфия (Алашехир) — город, основанный Атталом II Филадельфом (II в. до н.э.). Расположен в сейсмически активной зоне, часто разрушался землетрясениями. Жители часто жили вне города из-за страха — отсюда обещание «столпа» (устойчивости).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Малая сила — великая верность:</b> Филадельфия не была великой или влиятельной церковью. Но Христос ценит не размер, а верность. «Ты не много имеешь силы» — и этого достаточно, когда дверь открывает Бог.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Philadelphia_Ala%C5%9Fehir_Church.jpg/640px-Philadelphia_Ala%C5%9Fehir_Church.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/Philadelphia_Ala%C5%9Fehir_Church.jpg/200px-Philadelphia_Ala%C5%9Fehir_Church.jpg","label":"Церковь Св. Иоанна — Филадельфия (Алашехир)","credit":"Wikimedia Commons"}]}},"laodicea":{"n":"Лаодикия","k":"Тёплая — ни горячая, ни холодная","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Laodicea_on_the_Lycus.jpg/200px-Laodicea_on_the_Lycus.jpg","tl":"Руины Лаодикии","f":"Лаодикия — богатый банковский центр, известный производством чёрной шерсти и глазной мази (коллирий). Город имел водопровод от горячих источников Иераполя, но вода остывала по пути…","lex":null,"glyphs":[],"dossier":{"story":"<p>Лаодикия — самая печально известная церковь. «Ты ни холоден, ни горяч; о, если бы ты был холоден или горяч! Но как ты тёпл, а не горяч и не холоден, то извергну тебя из уст Моих». Богатство ослепило её: «Ты говоришь: я богат… а не знаешь, что ты несчастен, и жалок, и нищ, и слеп, и наг». Христос стоит у двери и стучит.</p>","bible":"<div class=\"verse\">«Се, стою у двери и стучу: если кто услышит голос Мой и отворит дверь, войду к нему».<span>ОТКРОВЕНИЕ 3:20</span></div>","arch":"<p>Лаодикия — богатый банковский центр, известный производством чёрной шерсти и глазной мази (коллирий). Город имел водопровод от горячих источников Иераполя, но вода остывала по пути — отсюда образ «тёплой» воды. Разрушена землетрясением 60 г. н.э., отстроена без помощи Рима.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Богатство как духовная опасность:</b> Лаодикия — единственная церковь, о которой Христос не сказал ни одного доброго слова. Она думала, что ни в чём не нуждается — и не замечала, что Христос стоит снаружи. «Се, стою у двери и стучу» — это обращение к церкви, не к неверующим.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Laodicea_on_the_Lycus.jpg/640px-Laodicea_on_the_Lycus.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Laodicea_on_the_Lycus.jpg/200px-Laodicea_on_the_Lycus.jpg","label":"Руины Лаодикии","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"7 церквей Асии","d":"","age":"~95 Г. Н.Э. · ПАТМОС","km":"","r":"Откр 2–3"}];window.ATLAS_WPS=[];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
