<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>12 Колен Израиля — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#e3d4ac}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#ecdcb4}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#ecdcb4;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  /* иконки живут мелко; при наведении — плавно вырастают из своего основания
     (transform-origin у «земли»), штрихи non-scaling держат тонкость */
  #sheet-svg .glyph{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
  #sheet-svg .glyph-hit:hover .glyph,
  #sheet-svg .glyph-hit:focus-visible .glyph{transform:scale(1.7);transform-box:fill-box;transform-origin:50% 90%}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#6a5028;stroke-width:.62px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#6a5028;stroke-width:.68px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.2;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.32;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.6);stroke-width:.55px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#ecdcb4;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#ecdcb4;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#ecdcb4;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#ecdcb4;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}

  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}

  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}

  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  /* position:absolute относительно .wrap (не viewport) — иначе на широких
     экранах кнопки съезжают за реальный правый край листа (обрезаются
     тенью контейнера); top сдвинут ниже розы ветров (компас в SVG кончается

  .dive-btn{position:absolute;right:10px;top:120px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}

  .legend-pop b{display:block;font:700 11px/1 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:8px}

  .legend-pop .lg-dot{flex-basis:9px;width:9px;height:9px;border-radius:50%;background:#1e3a63;border:1.5px solid #f6f1e7}
  .legend-pop .lg-cand{flex-basis:9px;width:9px;height:9px;border-radius:50%;border:1.4px dashed #8a6a1f}
  .legend-pop .lg-arch{flex-basis:9px;width:8px;height:8px;background:#4e7a52;transform:rotate(45deg)}

  body.dive{padding:0}

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":null},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":null},{"slug":"shvatim","title":"12 Колен Израиля","current":true,"cover":null},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":null},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":null},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":null},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":null},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":null},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":null},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":null}];window.ATLAS_LAYERS=[{"id":"main","label":"Колена","pathLabel":"путь Колена"}];window.ATLAS_PLACES={"judah":{"n":"Иуда","k":"Царское колено · Давид","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","tl":"Хеврон — пещера Махпела","f":"Удел Иуды (Быт 49:8–12; Нав 15) — крупнейший и южнейший надел. Включал Хеврон (резиденция Давида до Иерусалима), Вифлеем (родина Давида и Христа), Лахис (крепость), Беф-Цур. Раскоп…","lex":null,"glyphs":[],"dossier":{"story":"<p>Иуда — колено, из которого вышел Давид и Мессия. Получил обширную территорию от Мёртвого моря до Средиземного: Хеврон, Вифлеем, Иерусалим. Благословение Иакова: «Не отойдёт скипетр от Иуды» (Быт 49:10).</p>","bible":"<div class=\"verse\">«Не отойдёт скипетр от Иуды и законодатель от чресл его, доколе не придёт Примиритель».<span>БЫТИЕ 49:10</span></div>","arch":"<p>Удел Иуды (Быт 49:8–12; Нав 15) — крупнейший и южнейший надел. Включал Хеврон (резиденция Давида до Иерусалима), Вифлеем (родина Давида и Христа), Лахис (крепость), Беф-Цур. Раскопки Лахиса (IAA) открыли остатки ханаанейских и израильских укреплений, осадный вал Сеннахерима (4Цар 18).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Колено Царя:</b> Из Иуды произошли Давид, Соломон и — по плоти — Иисус Христос. «Не отойдёт скипетр от Иуды» (Быт 49:10). Это колено получило наибольшую территорию. Иуда стал синонимом еврейского народа.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/640px-Hebron_Cave_of_the_Patriarchs.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","label":"Хеврон — пещера Махпела","credit":"Wikimedia Commons"}]}},"ephraim":{"n":"Ефрем","k":"Центр · Силом и Сихем","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/200px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","tl":"Силом — центр Ефрема","f":"Удел Ефрема (Нав 16) — центральная горная страна Самарии. Сихем (Телль-Балата) — ключевой город, где Иисус Навин обновил завет (Нав 24). Раскопки открыли ханаанейский храм Баал-Бер…","lex":null,"glyphs":[],"dossier":{"story":"<p>Ефрем — ведущее колено Северного царства. Здесь находились Силом (Скиния 369 лет) и Сихем (первая столица Израиля). Иеровоам I был ефремлянином. Пророки часто называли Северное царство «Ефремом».</p>","bible":"<div class=\"verse\">«И собралось всё общество сынов Израилевых в Силом, и поставили там скинию собрания».<span>ИИСУС НАВИН 18:1</span></div>","arch":"<p>Удел Ефрема (Нав 16) — центральная горная страна Самарии. Сихем (Телль-Балата) — ключевой город, где Иисус Навин обновил завет (Нав 24). Раскопки открыли ханаанейский храм Баал-Берит, израильские слои. Гора Гаризим (благословение) и Гевал (проклятие) — на границе удела.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Ведущее колено Севера:</b> Ефрем стал синонимом Северного царства. Пророки часто называли Израиль «Ефремом». Иеровоам I, разделивший царство, был ефремлянином. В Силоме, на земле Ефрема, Скиния стояла 369 лет.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/640px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg/200px-Tel_Shiloh_%28Khirbet_Seilun%29_-_panoramio.jpg","label":"Силом — центр Ефрема","credit":"Wikimedia Commons"}]}},"manasseh_n":{"n":"Манассия (запад)","k":"Половина колена · запад","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Samaria_landscape.jpg/200px-Samaria_landscape.jpg","tl":"Самарийский ландшафт — Манассия","f":"Удел Манассии западный (Нав 17) — от Кармила до Дора. Избранные города: Мегиддо (Тель-Мегиддо, раскопки IAA/Чикагского университета — конюшни Соломона, водный туннель), Таанах, Дор…","lex":null,"glyphs":[],"dossier":{"story":"<p>Манассия получил наибольшую территорию из всех колен — половину к западу от Иордана (от Изрееля до Средиземного моря) и половину к востоку (Галаад и Васан). Гедеон был из Манассии.</p>","bible":"<div class=\"verse\">«И сыны Иосифа сказали: не останется у нас гора; и все Хананеи, живущие на долине, имеют колесницы железные».<span>ИИСУС НАВИН 17:16</span></div>","arch":"<p>Удел Манассии западный (Нав 17) — от Кармила до Дора. Избранные города: Мегиддо (Тель-Мегиддо, раскопки IAA/Чикагского университета — конюшни Соломона, водный туннель), Таанах, Дор. Мегиддо — стратегический узел на Via Maris.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Самое большое колено:</b> Манассия получил наибольшую территорию — половину к западу от Иордана и половину к востоку. Гедеон, один из величайших судей, был из Манассии. Разделённое колено стало символом: даже в самом большом уделе есть разделение.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Samaria_landscape.jpg/640px-Samaria_landscape.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Samaria_landscape.jpg/200px-Samaria_landscape.jpg","label":"Самарийский ландшафт — Манассия","credit":"Wikimedia Commons"}]}},"manasseh_e":{"n":"Манассия (восток)","k":"Половина колена · восток","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","tl":"Галаад — восточный Манассия","f":"Удел Манассии восточный (Нав 17, 13:29–31) — за Иорданом, Васан. Авирам (Абел-Шиттим), Голаны. Земля Манассиии на востоке простиралась до горы Ермон; раскопки укреплённых городов б…","lex":null,"glyphs":[],"dossier":{"story":"<p>Восточная половина Манассии включала Галаад и Васан — плодородные пастбища. Иаир из Манассии взял 60 городов в Васане. Иеффай Галаадитянин также был из восточной половины.</p>","bible":"","arch":"<p>Удел Манассии восточный (Нав 17, 13:29–31) — за Иорданом, Васан. Авирам (Абел-Шиттим), Голаны. Земля Манассиии на востоке простиралась до горы Ермон; раскопки укреплённых городов басанского типа.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Восточное наследие:</b> Восточная половина Манассии включала Галаад и Васан — плодородные пастбища. Иаир из Манассии взял 60 городов. Иеффай Галаадитянин также был из восточной половины — Бог использует людей с окраин.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/640px-Gilead_region_Jordan.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","label":"Галаад — восточный Манассия","credit":"Wikimedia Commons"}]}},"benjamin":{"n":"Вениамин","k":"Между Ефремом и Иудой","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Judean_Desert.jpg/200px-Judean_Desert.jpg","tl":"Иудейская пустыня — Вениамин","f":"Удел Вениамина (Нав 18:11–28) — между Иудой и Ефремом. Иерусалим (Иевус) на южной границе удела — завоёван Давидом. Гаваон (эль-Джиб) — где Иисус остановил солнце (Нав 10). Рама, В…","lex":null,"glyphs":[],"dossier":{"story":"<p>Вениамин — самое маленькое колено, но стратегически расположенное между Ефремом и Иудой. Включало Иерихон, Гиву (столица Саула), Вефиль и часть Иерусалима. Саул и Павел были вениамитянами.</p>","bible":"<div class=\"verse\">«Вениамин, хищный волк, утром будет есть ловитву и вечером делить добычу».<span>БЫТИЕ 49:27</span></div>","arch":"<p>Удел Вениамина (Нав 18:11–28) — между Иудой и Ефремом. Иерусалим (Иевус) на южной границе удела — завоёван Давидом. Гаваон (эль-Джиб) — где Иисус остановил солнце (Нав 10). Рама, Вефиль (Бет-Эль) — важнейшие святилища.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Малое, но избранное:</b> Самое маленькое колено, но из него вышли: Саул (первый царь), Савл/Павел (апостол язычников), Есфирь и Мардохей. Вениамин был «хищным волком» (Быт 49:27) — но Бог превращает хищников в апостолов.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Judean_Desert.jpg/640px-Judean_Desert.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Judean_Desert.jpg/200px-Judean_Desert.jpg","label":"Иудейская пустыня — Вениамин","credit":"Wikimedia Commons"}]}},"dan":{"n":"Дан","k":"От Шфелы до Галилеи","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/200px-Dan_Gate.jpg","tl":"Ворота Тель Дана","f":"Удел Дана (Нав 19:40–48) — первоначально на побережье (вокруг Яффы), но аморреи оттеснили Дана в горы (Суд 1:34). Позже колено захватило Лаис/Дан (Суд 18) на севере. Раскопки Тель-…","lex":null,"glyphs":[],"dossier":{"story":"<p>Изначально Дан получил удел в Шфеле, но не смог завоевать его. Колено переселилось на север и захватило Лаис (позже Дан). «От Дана до Вирсавии» — северная и южная границы Израиля.</p>","bible":"","arch":"<p>Удел Дана (Нав 19:40–48) — первоначально на побережье (вокруг Яффы), но аморреи оттеснили Дана в горы (Суд 1:34). Позже колено захватило Лаис/Дан (Суд 18) на севере. Раскопки Тель-Дан (IAA, А. Биран) открыли городские ворота эпохи Авраама, жертвенник Иеровоама, надпись «Дом Давидов» (IX в. до н.э.).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Колено, потерявшее удел:</b> Дан не смог завоевать свой первоначальный удел и переселился на север. Позже здесь был поставлен золотой телец. Колено Дана исчезло из перечня в Откр 7 — предупреждение о последствиях идолопоклонства.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/640px-Dan_Gate.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/200px-Dan_Gate.jpg","label":"Ворота Тель Дана","credit":"Wikimedia Commons"}]}},"simeon":{"n":"Симеон","k":"Внутри Иуды · Негев","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Negev_desert_panorama.jpg/200px-Negev_desert_panorama.jpg","tl":"Пустыня Негев — Симеон","f":"Удел Симеона (Нав 19:1–9) — поглощён уделом Иуды; «наследие их было среди удела сынов Иудиных». Северо-Негев: Вирсавия (Беэр-Шева, раскопки — ханаанейский ров, израильский жертвенн…","lex":null,"glyphs":[],"dossier":{"story":"<p>Симеон получил удел внутри территории Иуды — 17 городов разбросанных по Негеву. Со временем колено было полностью поглощено Иудой. Благословение Иакова предсказало рассеяние Симеона и Левия.</p>","bible":"<div class=\"verse\">«Разделю их в Иакове и рассею их в Израиле».<span>БЫТИЕ 49:7</span></div>","arch":"<p>Удел Симеона (Нав 19:1–9) — поглощён уделом Иуды; «наследие их было среди удела сынов Иудиных». Северо-Негев: Вирсавия (Беэр-Шева, раскопки — ханаанейский ров, израильский жертвенник), Шаарим. Симеон рассеялся, как пророчествовал Иаков (Быт 49:7).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Рассеянное колено:</b> Симеон получил удел внутри Иуды и был поглощён им. Благословение Иакова предсказало рассеяние (Быт 49:7). Но Бог не забывает рассеянных — в Откр 7:7 Симеон снова назван среди спасённых.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Negev_desert_panorama.jpg/640px-Negev_desert_panorama.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Negev_desert_panorama.jpg/200px-Negev_desert_panorama.jpg","label":"Пустыня Негев — Симеон","credit":"Wikimedia Commons"}]}},"issachar":{"n":"Иссахар","k":"Изреельская долина","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/200px-Jezreel_Valley.jpg","tl":"Изреельская долина","f":"Удел Иссахара (Нав 19:17–23) — Изреельская долина, житница Израиля. Избранные города: Изреель (Тель-Изреель — дворец Ахава), Сунем (Шунем — где воскрешён сын сонамитянки, 4Цар 4), …","lex":null,"glyphs":[],"dossier":{"story":"<p>Иссахар получил плодородную Изреельскую долину с городами Изреель, Сунем, Ен-Ганним. «Осёл крепкий, лежащий между протоками вод» (Быт 49:14) — земледельческое колено, снабжавшее Израиль продовольствием.</p>","bible":"","arch":"<p>Удел Иссахара (Нав 19:17–23) — Изреельская долина, житница Израиля. Избранные города: Изреель (Тель-Изреель — дворец Ахава), Сунем (Шунем — где воскрешён сын сонамитянки, 4Цар 4), Ен-Дор (Айн-Дор). Плодородная равнина между Кармилом и Галилеей.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Осёл крепкий»:</b> Так Иаков благословил Иссахара (Быт 49:14). Колено земледельцев, снабжавшее Израиль продовольствием. Образ осла как вьючного животного говорит о готовности служить и нести бремя.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/640px-Jezreel_Valley.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/200px-Jezreel_Valley.jpg","label":"Изреельская долина","credit":"Wikimedia Commons"}]}},"zebulun":{"n":"Завулон","k":"Торговые пути","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Lower_Galilee.jpg/200px-Lower_Galilee.jpg","tl":"Нижняя Галилея — Завулон","f":"Удел Завулона (Нав 19:10–16) — Нижняя Галилея. Города: Беф-Саул, Вифлеем Галилейский (не иудейский!), Назарет (возможно на границе). Пророчество: «берег моря... пристань для корабл…","lex":null,"glyphs":[],"dossier":{"story":"<p>Завулон получил территорию в Нижней Галилее с выходом к морским путям. Назарет находился на его земле. Благословение Иакова: «Завулон при береге морском будет жить и у пристани корабельной» (Быт 49:13).</p>","bible":"","arch":"<p>Удел Завулона (Нав 19:10–16) — Нижняя Галилея. Города: Беф-Саул, Вифлеем Галилейский (не иудейский!), Назарет (возможно на границе). Пророчество: «берег моря... пристань для кораблей» (Быт 49:13) — доступ к заливу Акко.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Торговое колено:</b> Завулон получил выход к морским путям. На его земле находился Назарет. Пророчество Исайи 9:1-2 о «земле Завулоновой и Неффалимовой» исполнилось в служении Христа в Галилее.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Lower_Galilee.jpg/640px-Lower_Galilee.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Lower_Galilee.jpg/200px-Lower_Galilee.jpg","label":"Нижняя Галилея — Завулон","credit":"Wikimedia Commons"}]}},"naphtali":{"n":"Неффалим","k":"Верхняя Галилея","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/200px-Sea_of_Galilee_%28panoramic%29.jpg","tl":"Галилейское море — Неффалим","f":"Удел Неффалима (Нав 19:32–39) — Верхняя Галилея и запад Кинерета. Кедес-Неффалим (город-убежище), Хацор (Тель-Хацор — крупнейший библейский тель, раскопки Ядина — ханаанейский двор…","lex":null,"glyphs":[],"dossier":{"story":"<p>Неффалим — северное колено, Галилея языческая. Здесь позже жил и проповедовал Иисус в Капернауме, на горе Блаженств, в Вифсаиде. Пророчество Исайи: «Народ, ходящий во тьме, увидит свет» (Ис 9:1-2).</p>","bible":"<div class=\"verse\">«Земля Завулонова и земля Неффалимова… народ, сидящий во тьме, увидел свет великий».<span>МАТФЕЯ 4:15-16</span></div>","arch":"<p>Удел Неффалима (Нав 19:32–39) — Верхняя Галилея и запад Кинерета. Кедес-Неффалим (город-убежище), Хацор (Тель-Хацор — крупнейший библейский тель, раскопки Ядина — ханаанейский дворец, израильская крепость Соломона). Горный и лесистый удел на севере.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Народ, ходящий во тьме, увидит свет»:</b> Исайя 9:1-2 пророчествовал о Галилее языческой. Здесь, на земле Неффалима, Иисус начал Своё служение в Капернауме. «Свет» пришёл именно в ту часть Израиля, которую считали самой тёмной.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/640px-Sea_of_Galilee_%28panoramic%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5f/Sea_of_Galilee_%28panoramic%29.jpg/200px-Sea_of_Galilee_%28panoramic%29.jpg","label":"Галилейское море — Неффалим","credit":"Wikimedia Commons"}]}},"asher":{"n":"Асир","k":"Берег Средиземного","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Akko_Crusader_walls.jpg/200px-Akko_Crusader_walls.jpg","tl":"Акко — побережье Асира","f":"Удел Асира (Нав 19:24–31) — побережье от Кармила до Сидона. Тир и Сидон — на границе (не полностью завоёваны). Акко (Птолемаида) — важный порт. Пророчество: «пища его тук» (Втор 33…","lex":null,"glyphs":[],"dossier":{"story":"<p>Асир получил северное побережье Средиземного моря с городами Акко, Тир, Сидон. Благословение Моисея: «Асир благословен между сынами… окунёт в масло ногу свою» (Втор 33:24) — регион славился оливковым маслом.</p>","bible":"","arch":"<p>Удел Асира (Нав 19:24–31) — побережье от Кармила до Сидона. Тир и Сидон — на границе (не полностью завоёваны). Акко (Птолемаида) — важный порт. Пророчество: «пища его тук» (Втор 33:24) — оливковое масло с прибрежных террас.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Благословенное колено:</b> Моисей благословил Асира: «Окунёт в масло ногу свою» (Втор 33:24) — регион славился оливковым маслом. Анна-пророчица, увидевшая Младенца Иисуса в Храме, была из колена Асира (Лк 2:36).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Akko_Crusader_walls.jpg/640px-Akko_Crusader_walls.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/2/2c/Akko_Crusader_walls.jpg/200px-Akko_Crusader_walls.jpg","label":"Акко — побережье Асира","credit":"Wikimedia Commons"}]}},"gad":{"n":"Гад","k":"За Иорданом · воины","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","tl":"Галаадские горы — Гад","f":"Удел Гада (Нав 13:24–28) — за Иорданом, в Галааде. Иавис Галаадский (Суд 21), Рамоф-Галаадский (Рафидим/Рамот — стратегическая крепость на востоке). Горный лесистый регион восточне…","lex":null,"glyphs":[],"dossier":{"story":"<p>Гад получил удел к югу от восточного Манассии и к северу от Рувима — территорию от Галаада до равнин Моава. Гадитяне славились как храбрые воины. Благословение Моисея: «Гад расположился как лев» (Втор 33:20).</p>","bible":"","arch":"<p>Удел Гада (Нав 13:24–28) — за Иорданом, в Галааде. Иавис Галаадский (Суд 21), Рамоф-Галаадский (Рафидим/Рамот — стратегическая крепость на востоке). Горный лесистый регион восточнее Иордана.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Воины за Иорданом:</b> Гад вместе с Рувимом и половиной Манассии попросил удел в Заиорданье. Они обязались первыми идти в бой за землю, прежде чем вернуться к своим семьям (Числ 32). Воинское колено, верное обещанию.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/640px-Gilead_region_Jordan.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/42/Gilead_region_Jordan.jpg/200px-Gilead_region_Jordan.jpg","label":"Галаадские горы — Гад","credit":"Wikimedia Commons"}]}},"reuben":{"n":"Рувим","k":"За Иорданом · первый","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Machareus_view.jpg/200px-Machareus_view.jpg","tl":"Заиорданье — регион Рувима","f":"Удел Рувима (Нав 13:15–23) — за Иорданом, к югу от Арнона. Есевон (Хешбон — раскопки открыли моавитские/израильские слои), Дивон. Первоначальный удел, но колено рано ассимилировало…","lex":null,"glyphs":[],"dossier":{"story":"<p>Рувим — первенец Иакова, но потерял первородство из-за греха с Валлой. Получил южное Заиорданье от Арнона до Есевона. Племя постепенно растворилось среди моавитян. Благословение: «Рувим, ты — первенец мой… но ты бушевал как вода» (Быт 49:3-4).</p>","bible":"","arch":"<p>Удел Рувима (Нав 13:15–23) — за Иорданом, к югу от Арнона. Есевон (Хешбон — раскопки открыли моавитские/израильские слои), Дивон. Первоначальный удел, но колено рано ассимилировалось среди моавитян. «Рувим, первенец мой» (Быт 49:3).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Потерянное первородство:</b> Рувим был первенцем Иакова, но потерял первородство из-за греха. Его удел в Заиорданье — первый захваченный, но и первый потерянный. Колено постепенно растворилось среди моавитян.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Machareus_view.jpg/640px-Machareus_view.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Machareus_view.jpg/200px-Machareus_view.jpg","label":"Заиорданье — регион Рувима","credit":"Wikimedia Commons"}]}},"jericho":{"n":"Иерихон","k":"Первая победа · стены пали","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/200px-Tell_es-Sultan_%28Jericho%29.jpg","tl":"Тель эс-Султан — Иерихон","f":"Иерихон (Телль-эс-Султан) — древнейший город мира (~9000 до н.э.). Кенyon (1950-е) и Bartolini (1997–2010) — раскопки открыли оборонительную стену ранней бронзы, которая соответств…","lex":null,"glyphs":[],"dossier":{"story":"<p>Первый город, взятый Израилем в Ханаане. 7 дней обхождения, 7 труб, крик народа — и «обрушилась стена города до своего основания». Только Раав и её семья были пощажены. Археологически: Тель эс-Султан, рухнувшие стены бронзового века.</p>","bible":"<div class=\"verse\">«И обрушилась стена города до своего основания, и народ пошёл в город, каждый с своей стороны, и взяли город».<span>ИИСУС НАВИН 6:20</span></div>","arch":"<p>Иерихон (Телль-эс-Султан) — древнейший город мира (~9000 до н.э.). Кенyon (1950-е) и Bartolini (1997–2010) — раскопки открыли оборонительную стену ранней бронзы, которая соответствует библейскому叙述у о падении стен (Нав 6). Пружина Айн-эс-Султан — источник, делавший город оазисом. Иисус Навин проклял rebuilding (3Цар 16:34 — исполнено при Ахаве).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Стены Иерихона — вера против логики:</b> Военный план Бога не имел военного смысла: 7 дней обходить город, трубить и кричать. Но «вера есть осуществление ожидаемого и уверенность в невидимом» (Евр 11:1). Иерихон — первый урок: Божьи пути — не наши пути.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/640px-Tell_es-Sultan_%28Jericho%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_es-Sultan_%28Jericho%29.jpg/200px-Tell_es-Sultan_%28Jericho%29.jpg","label":"Тель эс-Султан — Иерихон","credit":"Wikimedia Commons"}]}},"ai":{"n":"Гай","k":"Грех Ахана · вторая попытка","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Et-Tell.jpg/200px-Et-Tell.jpg","tl":"Эт-Телль — возможный Гай","f":"Гай (et-Tell) — второй город после Иерихона (Нав 7–8). Раскопки (Callaway, 1960-е) показывают, что et-Tell был необитаем в позднебронзовом веке (когда Иисус вошёл в Ханаан) — это п…","lex":null,"glyphs":[],"dossier":{"story":"<p>После Иерихона Израиль потерпел поражение у Гая из-за греха Ахана, взявшего заклятое. После очищения стана Иисус Навин взял город засадой. Урок: победа зависит от послушания, не от военной силы.</p>","bible":"<div class=\"verse\">«Встань, освяти народ… ибо не можешь ты устоять пред врагами твоими, доколе не удалишь от себя заклятое».<span>ИИСУС НАВИН 7:13</span></div>","arch":"<p>Гай (et-Tell) — второй город после Иерихона (Нав 7–8). Раскопки (Callaway, 1960-е) показывают, что et-Tell был необитаем в позднебронзовом веке (когда Иисус вошёл в Ханаан) — это породило дискуссию о локализации Гая. Альтернативная локализация — Khirbet el-Maqatir (Wood/Hanson, 1995+) — раскопки открыли небольшое поселение поздней бронзы.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Гай (Эт-Телль): археологическая проблема</div><div class=\"dispute-pos cons\"><b>Эт-Телль = Гай?</b> Раннебронзовый город (3100–2400 до н.э.). Разрушен ок. 2400 г. — за 1000 лет до Иисуса Навина. <span class=\"conf-med\">Надёжность идентификации: средняя</span></div><div class=\"dispute-pos alt\"><b>Альтернативы:</b> (1) Гай мог быть военным форпостом, не городом. (2) Название «Гай» (руины) могло быть дано позже. (3) Локализация может быть неверной. <span class=\"conf-lo\">Надёжность: низкая</span></div><div class=\"dispute-note\">YEC позиция: библейский текст точен. Археологическая проблема Гая — одна из самых сложных. Возможное решение: Bethel и Ai были единым военным объектом, или локализация требует пересмотра.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Гай — урок о грехе в стане:</b> После триумфа Иерихона Израиль потерпел поражение у маленького Гая. 36 человек погибли. Причина: грех Ахана, взявшего заклятое. Грех одного человека повлиял на весь народ. Святость — не личное дело.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Et-Tell.jpg/640px-Et-Tell.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3e/Et-Tell.jpg/200px-Et-Tell.jpg","label":"Эт-Телль — возможный Гай","credit":"Wikimedia Commons"}]}},"gibeon":{"n":"Гаваон","k":"Хитрость гаваонитян · битва","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Gibeon_pool.jpg/200px-Gibeon_pool.jpg","tl":"Пруд в Гаваоне (Эль-Джиб)","f":"Гаваон (эль-Джиб, 10 км северо-западнее Иерусалима) — где гаваонитяне обманом заключили завет с Иисусом (Нав 9). Раскопки Pritchard (1956–1962) открыли винодельню эпохи железа, «пр…","lex":null,"glyphs":[],"dossier":{"story":"<p>Жители Гаваона хитростью заключили союз с Израилем. Пять аморрейских царей напали на Гаваон. Иисус Навин вышел на помощь — и Бог бросал на врагов «камни града с небес». «Стой, солнце, над Гаваоном!» — и Бог продлил день для победы.</p>","bible":"<div class=\"verse\">«Стой, солнце, над Гаваоном, и луна, над долиною Аиалонскою! И остановилось солнце… доколе народ мстил врагам своим».<span>ИИСУС НАВИН 10:12-13</span></div>","arch":"<p>Гаваон (эль-Джиб, 10 км северо-западнее Иерусалима) — где гаваонитяне обманом заключили завет с Иисусом (Нав 9). Раскопки Pritchard (1956–1962) открыли винодельню эпохи железа, «пруд Гаваонский» (2Цар 2:13 — где Авенир убил Асуила). Стратегический город на дороге Иерусалим–Сихем.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Стой, солнце, над Гаваоном!»:</b> В день битвы Иисус Навин произнёс молитву, которая остановила движение небесных тел. Скептики ищут астрономические объяснения; верующие видят Творца, Который не связан законами Своего творения.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Gibeon_pool.jpg/640px-Gibeon_pool.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/06/Gibeon_pool.jpg/200px-Gibeon_pool.jpg","label":"Пруд в Гаваоне (Эль-Джиб)","credit":"Wikimedia Commons"}]}},"hazor_conquest":{"n":"Асор","k":"Иавин · северная коалиция","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","tl":"Тель Хацор","f":"Асор (Тель-Хацор) — «глава всех царств сих» (Нав 11:10). Иисус сжёг Асор. Раскопки Ядина (1955–1958, 1968) и Ben-Tor (1990-е–2010-е) открыли огромный ханаанейский дворец эпохи брон…","lex":null,"glyphs":[],"dossier":{"story":"<p>Иавин, царь Асора, собрал коалицию северных царей «многочисленных, как песок на берегу моря». Иисус Навин разбил их у вод Меромских и сжёг Асор. «Не было ни одного города, который заключил бы мир с сынами Израилевыми».</p>","bible":"<div class=\"verse\">«И поразили они их… и не оставили ни одной души. А Асор сожёг он огнём».<span>ИИСУС НАВИН 11:11</span></div>","arch":"<p>Асор (Тель-Хацор) — «глава всех царств сих» (Нав 11:10). Иисус сжёг Асор. Раскопки Ядина (1955–1958, 1968) и Ben-Tor (1990-е–2010-е) открыли огромный ханаанейский дворец эпохи бронзы, ритуальный комплекс, слои пожара, соответствующие библейскому разрушению. Один из трёх городов, сожжённых Иисусом (с Иерихоном и Гаем).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Асор — «глава всех царств тех» (Нав 11:10):</b> Иавин, царь Асора, собрал северную коалицию «многочисленную, как песок на берегу моря». Иисус Навин разбил их у вод Меромских и сжёг Асор. Археология подтверждает мощный слой разрушения XIII в. до н.э. в верхнем городе.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/640px-Hatzor-Israelite-4.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","label":"Тель Хацор","credit":"Wikimedia Commons"}]}},"mount_ebal":{"n":"Гевал · благословение и проклятие","k":"Жертвенник Иисуса Навина","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Mount_Ebal_from_Mount_Gerizim.jpg/200px-Mount_Ebal_from_Mount_Gerizim.jpg","tl":"Гора Гевал","f":"Адам Зерталь (1980-е) обнаружил на Гевале массивную каменную структуру (9×7 м) с пандусом, датируемую железным веком I (~1250 г.). В засыпи найдены кости только кошерных животных. …","lex":null,"glyphs":[],"dossier":{"story":"<p>На горе Гевал Иисус Навин построил жертвенник Господу из цельных камней и написал на камнях список с закона Моисеева. Половина колен стояла на Гаризиме для благословения, половина на Гевале для проклятия. Археологически: Адам Зерталь (1980) обнаружил массивный каменный жертвенник на Гевале — возможно, тот самый.</p>","bible":"<div class=\"verse\">«Тогда Иисус устроил жертвенник Господу Богу Израилеву на горе Гевал».<span>ИИСУС НАВИН 8:30</span></div>","arch":"<p>Адам Зерталь (1980-е) обнаружил на Гевале массивную каменную структуру (9×7 м) с пандусом, датируемую железным веком I (~1250 г.). В засыпи найдены кости только кошерных животных. Идентифицирован как жертвенник Иисуса Навина.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Жертвенник на Гевале — Иисус Навин или израильский?</div><div class=\"dispute-pos cons\"><b>Адам Зерталь (1980):</b> Массивная каменная структура (9×7 м, пандус) на Гевале — жертвенник Иисуса Навина (1200+ г. до н.э.). Только кошерные кости. <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-pos alt\"><b>Критика (Финкельштейн, Кемпински):</b> (1) Структура может быть башней или сторожевым постом. (2) Датировка может быть железным веком I (не XIII в.). (3) Не все кости определены как жертвенные. <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-note\">Дебаты продолжаются. Если Зерталь прав — это одно из важнейших открытий библейской археологии.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Жертвенник на Гевале — исполнение заповеди Моисея:</b> Второзаконие 27:4-8 повелевало построить жертвенник на горе Гевал. Иисус Навин исполнил это сразу после взятия Гая. Археолог Адам Зерталь (1980) обнаружил массивную каменную структуру — возможно, тот самый жертвенник.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Mount_Ebal_from_Mount_Gerizim.jpg/640px-Mount_Ebal_from_Mount_Gerizim.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/72/Mount_Ebal_from_Mount_Gerizim.jpg/200px-Mount_Ebal_from_Mount_Gerizim.jpg","label":"Гора Гевал","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Северные колена","d":"","age":"6 КОЛЕН · ГАЛИЛЕЯ, САМАРИЯ","km":"","r":"Нав 13–19"},{"n":"II","t":"Южные колена","d":"","age":"4 КОЛЕНА · ИУДЕЯ, ШФЕЛА, НЕГЕВ","km":"","r":"Нав 15–18"},{"n":"III","t":"Заиорданские колена","d":"","age":"2½ КОЛЕНА · ГАЛААД, ВАСАН, МОАВ","km":"","r":"Нав 13, 22"}];window.ATLAS_WPS=[];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
