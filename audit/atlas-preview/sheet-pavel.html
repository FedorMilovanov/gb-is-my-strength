<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Миссионерские путешествия Павла — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#f3ecdc;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  /* иконки живут мелко; при наведении — плавно вырастают из своего основания
     (transform-origin у «земли»), штрихи non-scaling держат тонкость */
  #sheet-svg .glyph{transition:transform .2s cubic-bezier(.34,1.35,.5,1)}
  #sheet-svg .glyph-hit:hover .glyph,
  #sheet-svg .glyph-hit:focus-visible .glyph{transform:scale(1.7);transform-box:fill-box;transform-origin:50% 90%}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  /* ── киношные иконки-глифы: объём, светотень, цвет-акцент ── */
  .glyph .gb{stroke:#6a5028;stroke-width:.62px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-out{fill:none;stroke:#6a5028;stroke-width:.68px;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .glyph .g-sh{fill:#3d2c0f;opacity:.2;stroke:none}
  .glyph .g-sh2{fill:#3d2c0f;opacity:.32;stroke:none}
  .glyph .g-hi{fill:none;stroke:rgba(255,250,235,.6);stroke-width:.55px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-smoke{fill:none;stroke:#8a7a58;stroke-width:.85px;opacity:.7;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-legs{fill:none;stroke:#5c421d;stroke-width:.8px;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .glyph .g-shadow{stroke:none}
  /* мягкое гашение объёма иконок на глубоких зумах, чтобы не давить карту */
  svg.z3 .glyph .g-shadow{opacity:.6}
  svg.z4 .glyph .g-shadow{opacity:.35}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#f5edd8;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#f5edd8;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":null},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":null},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":null},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":null},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":null},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":null},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":null},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":true,"cover":null},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":null},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":null}];window.ATLAS_LAYERS=[{"id":"journey1","label":"Первое путешествие","pathLabel":"путь Первое путешествие"},{"id":"journey2","label":"Второе путешествие","pathLabel":"путь Второе путешествие"},{"id":"journey3","label":"Третье + Рим","pathLabel":"путь Третье + Рим"}];window.ATLAS_PLACES={"antioch":{"n":"Антиохия","k":"База миссий · Сирия","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/200px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","tl":"Мозаика из Антиохии (музей Антакьи)","f":"Антакья, Турция — Деян 11:26; 13:1–3","lex":null,"glyphs":[],"dossier":{"story":"<p>Антиохия на Оронте — третий по величине город империи, центр эллинистического христианства. Здесь ученики впервые названы «христианами» (Деян 11:26). Отсюда Павел и Варнава отправляются во все три путешествия.</p>","bible":"<div class=\"verse\">«Целый год собирались они в церкви и учили немалое число людей; и ученики в Антиохии в первый раз стали называться Христианами».<span>ДЕЯНИЯ 11:26</span></div>","arch":"<p>Антиохия раскопана частично (современная Антакья поверх древнего города). Найдены остатки Главной улицы с колоннадой, театра, ипподрома. Мозаики из Дафны (пригород) — мирового уровня (музей Антакьи).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Центр миссии к язычникам:</b> Антиохия — первая мультикультурная церковь. Именно здесь Дух Святой сказал: «Отделите Мне Варнаву и Савла на дело» (Деян 13:2). Отсюда начались все три путешествия. Без Антиохии не было бы миссии Павла в том виде, в каком мы её знаем.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/640px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/Hatay_Archaeology_Museum_Antioch_mosaic.jpg/200px-Hatay_Archaeology_Museum_Antioch_mosaic.jpg","label":"Мозаика из Антиохии (музей Антакьи)","credit":"Wikimedia Commons"}]}},"cyprus":{"n":"Кипр · Саламин","k":"Первый остров · проконсул Павел","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Paphos_Archaeological_Site.jpg/200px-Paphos_Archaeological_Site.jpg","tl":"Пафос — археологический парк","f":"Саламин → Пафос — Деян 13:4–12","lex":null,"glyphs":[],"dossier":{"story":"<p>Первая остановка первого путешествия. Павел и Варнава проходят остров от Саламина до Пафоса. В Пафосе проконсул Сергий Павел обращается, а Елима-волхв поражается слепотой — первое чудо Павла в миссии.</p>","bible":"<div class=\"verse\">«Тогда проконсул, увидев происшедшее, уверовал, дивясь учению Господню».<span>ДЕЯНИЯ 13:12</span></div>","arch":"<p>Кипр — первая остановка первого путешествия Павла (Деян 13:4–12). Саламин (раскопки — раннехристианские базилики, театр) и Паф (где проконсул Сергий Павел уверовал). Остров был центром медных рудников и морской торговли.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>От Савла к Павлу:</b> Именно на Кипре, после обращения проконсула Сергия Павла, Лука впервые использует имя «Павел» вместо «Савл» (Деян 13:9). Возможно, Савл принял римское имя в честь этого обращения — или просто начал использовать его в языческом контексте.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Paphos_Archaeological_Site.jpg/640px-Paphos_Archaeological_Site.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/16/Paphos_Archaeological_Site.jpg/200px-Paphos_Archaeological_Site.jpg","label":"Пафос — археологический парк","credit":"Wikimedia Commons"}]}},"iconium":{"n":"Икония","k":"Галатия · проповедь в синагоге","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Konya_Alaeddin_Mosque.jpg/200px-Konya_Alaeddin_Mosque.jpg","tl":"Конья — древняя Икония","f":"Конья, Турция — Деян 13:51–14:5","lex":null,"glyphs":[],"dossier":{"story":"<p>После изгнания из Антиохии Писидийской Павел и Варнава идут в Иконию. Проповедуют в синагоге. Город разделяется: одни за апостолов, другие против. Попытка побить камнями вынуждает бежать в Листру.</p>","bible":"<div class=\"verse\">«В Иконии они вошли вместе в Иудейскую синагогу и говорили так, что уверовало великое множество Иудеев и Еллинов».<span>ДЕЯНИЯ 14:1</span></div>","arch":"<p>Икония (Конья) — где Павел и Варнава проповедовали в первом путешествии (Деян 14:1–5). Древний город Ликаонии; римско-византийские слои. Народ хотел принести им жертвы как богам.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Город, разделившийся надвое:</b> «Между тем народ в городе разделился: одни были на стороне Иудеев, а другие на стороне Апостолов» (Деян 14:4). Евангелие всегда производит разделение — одни принимают, другие отвергают.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Konya_Alaeddin_Mosque.jpg/640px-Konya_Alaeddin_Mosque.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Konya_Alaeddin_Mosque.jpg/200px-Konya_Alaeddin_Mosque.jpg","label":"Конья — древняя Икония","credit":"Wikimedia Commons"}]}},"philippi":{"n":"Филиппы","k":"Первая церковь Европы","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Philippi_Basilica_B.jpg/200px-Philippi_Basilica_B.jpg","tl":"Базилика в Филиппах","f":"Кренидес, Греция — Деян 16:12–40","lex":null,"glyphs":[],"dossier":{"story":"<p>Первый европейский город, где Павел основывает церковь. Лидия, темничный страж и его домашние становятся первыми верующими. Павел и Сила поют в темнице — и землетрясение открывает двери.</p>","bible":"<div class=\"verse\">«Около полуночи Павел и Сила, молясь, воспевали Бога; узники же слушали их».<span>ДЕЯНИЯ 16:25</span></div>","arch":"<p>Филиппы — один из наиболее раскопанных новозаветных городов. Агора (форум), базилика, предполагаемое место темницы («темница Павла»), театр, улица Эгнатия. Надпись с упоминанием πολιτάρχης подтверждает точность Деян 17:6.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Первая церковь Европы:</b> Филиппы — первая европейская церковь, основанная Павлом. Послание к Филиппийцам — самое тёплое письмо апостола: «радость моя и венец мой» (Флп 4:1). Единственная церковь, от которой Павел принимал материальную поддержку.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Philippi_Basilica_B.jpg/640px-Philippi_Basilica_B.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Philippi_Basilica_B.jpg/200px-Philippi_Basilica_B.jpg","label":"Базилика в Филиппах","credit":"Wikimedia Commons"}]}},"thessalonica":{"n":"Фессалоника","k":"Три субботы и погром","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Thessaloniki_White_Tower.jpg/200px-Thessaloniki_White_Tower.jpg","tl":"Салоники — древняя Фессалоника","f":"Салоники, Греция — Деян 17:1–9","lex":null,"glyphs":[],"dossier":{"story":"<p>Павел проповедует три субботы в синагоге. Обращаются иудеи, множество прозелитов и знатные женщины. Противники поднимают городской бунт и тащат Иасона к градоначальникам.</p>","bible":"<div class=\"verse\">«И Павел, по своему обыкновению, вошёл к ним и три субботы говорил с ними из Писаний».<span>ДЕЯНИЯ 17:2</span></div>","arch":"<p>Фессалоники (Салоники) — где Павел проповедовал в синагоге (Деян 17:1–9). Римский город на Via Egnatia; раскопки открыли римский форум (Древняя Агора), арка Галерия. 1–2 Фессалоникийцам написаны отсюда.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Фессалоника — церковь, рождённая за три субботы:</b> Павел проповедовал здесь всего три субботы — и родилась церковь. Позже он написал им два послания — одни из самых ранних текстов Нового Завета (~50–51 гг.). В Фессалониках Павел хвалит верующих за «дело веры, труд любви и терпение упования» (1Фес 1:3).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Thessaloniki_White_Tower.jpg/640px-Thessaloniki_White_Tower.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Thessaloniki_White_Tower.jpg/200px-Thessaloniki_White_Tower.jpg","label":"Салоники — древняя Фессалоника","credit":"Wikimedia Commons"}]}},"athens":{"n":"Афины · Ареопаг","k":"Проповедь философам","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Areopagus_from_Acropolis.jpg/200px-Areopagus_from_Acropolis.jpg","tl":"Ареопаг — Афины","f":"Ареопаг, Афины — Деян 17:16–34","lex":null,"glyphs":[],"dossier":{"story":"<p>Павел в Афинах — единственная проповедь апостола к чисто языческой аудитории в Деяниях. На Ареопаге он цитирует греческих поэтов и провозглашает «неведомого Бога». Реакция смешанная: одни насмехаются, другие уверовали (Дионисий, Дамарь).</p>","bible":"<div class=\"verse\">«Ибо, проходя и осматривая ваши святыни, я нашёл и жертвенник, на котором написано: неведомому Богу. Сего-то, Которого вы, не зная, чтите, я проповедую вам».<span>ДЕЯНИЯ 17:23</span></div>","arch":"<p>Ареопаг (Марсов холм) — скалистый холм ниже Акрополя, место заседания совета. Памятная бронзовая табличка с текстом Деян 17:22–23 установлена у подножия. Рядом — древняя Агора с остатками стои.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Проповедь философам:</b> Афины — единственная чисто языческая аудитория Павла в Деяниях. Апостол цитирует Эпименида («в Нём мы живём и движемся и существуем») и Арата («мы Его и род»). Результат скромный: несколько уверовавших (Дионисий Ареопагит, Дамарь). Но метод — образец контекстуализации Евангелия.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Areopagus_from_Acropolis.jpg/640px-Areopagus_from_Acropolis.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6c/Areopagus_from_Acropolis.jpg/200px-Areopagus_from_Acropolis.jpg","label":"Ареопаг — Афины","credit":"Wikimedia Commons"}]}},"corinth":{"n":"Коринф","k":"Полтора года служения","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Corinth_Bema.jpg/200px-Corinth_Bema.jpg","tl":"Бема в Коринфе — суд Галлиона","f":"Коринф, Греция — Деян 18:1–18","lex":null,"glyphs":[],"dossier":{"story":"<p>Коринф — портовый мегаполис, центр торговли и разврата. Павел проводит здесь полтора года, основывает церковь, пишет Послания к Фессалоникийцам. Галлион, проконсул Ахайи, отказывается судить Павла — важная хронологическая привязка (~51 г.).</p>","bible":"<div class=\"verse\">«И сказал Господь в видении ночью Павлу: не бойся, но говори и не умолкай, ибо Я с тобою».<span>ДЕЯНИЯ 18:9–10</span></div>","arch":"<p>Раскопана Агора с трибуной (bema), где Павел предстал перед Галлионом (Деян 18:12). Надпись с именем Галлиона найдена в Дельфах (датирует проконсульство ~51–52 г.). Остатки синагоги (надпись [ΣΥΝ]ΑΓΩΓΗ).</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Датировка: Галлион 51-52 гг.</div><div class=\"dispute-pos cons\"><b>Дельфийская надпись</b>: Император Клавдий упоминает Галлиона как проконсула Ахайи. Датируется 51-52 гг. н.э. (26-я аккламация Клавдия как императора). <span class=\"conf-hi\">Надёжность: высокая</span></div><div class=\"dispute-note\">Павел прибыл в Коринф осенью 50 г. и пробыл 18 месяцев. Галлион прибыл летом 51 г. Суд произошёл вскоре после его прибытия.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Галлион и хронология:</b> Деян 18:12-17 — Павел перед Галлионом на беме. Дельфийская надпись датирует проконсульство Галлиона 51-52 гг. Это один из самых надёжных хронологических якорей Нового Завета — и ключ к датировке всех путешествий Павла.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Corinth_Bema.jpg/640px-Corinth_Bema.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Corinth_Bema.jpg/200px-Corinth_Bema.jpg","label":"Бема в Коринфе — суд Галлиона","credit":"Wikimedia Commons"}]}},"ephesus":{"n":"Эфес","k":"Три года в Асии","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/200px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","tl":"Библиотека Цельса — Эфес","f":"Сельчук, Турция — Деян 19–20","lex":null,"glyphs":[],"dossier":{"story":"<p>Столица провинции Асия и центр культа Артемиды. Павел проводит здесь почти три года — дольше, чем в любом другом городе. Мятеж Димитрия-серебряника, прощание с пресвитерами в Милите. Отсюда написано 1 Коринфянам.</p>","bible":"<div class=\"verse\">«Велика Артемида Эфесская!»<span>ДЕЯНИЯ 19:28</span></div>","arch":"<p>Библиотека Цельса, Большой театр (24 000 мест), Одеон, Агора. Храм Артемиды (одно из семи чудес) — лишь фундамент. Предполагаемая гробница Иоанна на горе Айасолук. Базилика Св. Иоанна.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Три года в Эфесе:</b> Деян 20:31 — «три года день и ночь непрестанно со слезами учил каждого». Дольше, чем в любом другом городе. Отсюда написано 1 Коринфянам. Здесь произошёл мятеж серебряников Артемиды. Эфес — база третьего путешествия и центр асийских церквей (Откр 2:1-7).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/640px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/94/Ephesus_Celsus_Library_Fa%C3%A7ade.jpg/200px-Ephesus_Celsus_Library_Fa%C3%A7ade.jpg","label":"Библиотека Цельса — Эфес","credit":"Wikimedia Commons"}]}},"jerusalem":{"n":"Иерусалим","k":"Арест в Храме","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Temple_Mount_%28Aerial_view%29.jpg/200px-Temple_Mount_%28Aerial_view%29.jpg","tl":"Храмовая гора — Иерусалим","f":"Иерусалим, Израиль — Деян 21–23","lex":null,"glyphs":[],"dossier":{"story":"<p>Павел возвращается в Иерусалим, несмотря на пророчества об узах. В Храме толпа узнаёт его и едва не убивает. Римский трибун Клавдий Лисий арестовывает его. С этого момента начинается путь в Кесарию и Рим.</p>","bible":"<div class=\"verse\">«Мужи, братия и отцы! Выслушайте теперь моё оправдание перед вами».<span>ДЕЯНИЯ 22:1</span></div>","arch":"<p>Иерусалим — откуда Павел отправлялся и куда возвращался после путешествий (Деян 18:22). Апостольский собор (Деян 15). Город, где был Храм — центр иудейского поклонения, из которого исходило благовестие «от Иерусалима» (Деян 1:8).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Я готов не только быть узником, но и умереть»:</b> Пророк Агав связал себе руки и ноги поясом Павла и предсказал его арест (Деян 21:11). Павел пошёл в Иерусалим, зная, что его ждёт. Это не безрассудство, а послушание: «Я не дорожу своею жизнью» (Деян 20:24).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Temple_Mount_%28Aerial_view%29.jpg/640px-Temple_Mount_%28Aerial_view%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Temple_Mount_%28Aerial_view%29.jpg/200px-Temple_Mount_%28Aerial_view%29.jpg","label":"Храмовая гора — Иерусалим","credit":"Wikimedia Commons"}]}},"rome":{"n":"Рим","k":"Конец пути · столица империи","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Colosseum_Rome.jpg/200px-Colosseum_Rome.jpg","tl":"Колизей — Рим","f":"Рим, Италия — Деян 28:16–31","lex":null,"glyphs":[],"dossier":{"story":"<p>После кораблекрушения у Мелита и трёх месяцев на Мальте Павел наконец достигает Рима. Живёт под домашним арестом, «принимая всех приходящих к нему, проповедуя Царствие Божие… со всяким дерзновением невозбранно».</p>","bible":"<div class=\"verse\">«И жил Павел целых два года на своём иждивении и принимал всех приходивших к нему, проповедуя Царствие Божие».<span>ДЕЯНИЯ 28:30–31</span></div>","arch":"<p>Церковь Сан-Паоло-алла-Регола (традиционное место дома Павла под арестом). Мамертинская темница (традиция). Аппиева дорога — место встречи с римскими христианами (Деян 28:15).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Конец Деяний — открытый финал:</b> Лука заканчивает книгу Деяний тем, что Павел «проповедует Царствие Божие невозбранно» (Деян 28:31). Ни суда, ни казни, ни освобождения. Учёные обсуждают: был ли Павел казнён в 64 г. при Нероне или освобождён и совершил четвёртое путешествие (Испания?). Традиция: мученическая смерть ок. 64-67 гг.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Colosseum_Rome.jpg/640px-Colosseum_Rome.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Colosseum_Rome.jpg/200px-Colosseum_Rome.jpg","label":"Колизей — Рим","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Первое путешествие","d":"","age":"45–48 гг. н.э.","km":"~2000 км","r":"Деян 13–14"},{"n":"II","t":"Второе путешествие","d":"","age":"49–52 гг. н.э.","km":"~3000 км","r":"Деян 15–18"},{"n":"III","t":"Третье + путь в Рим","d":"","age":"53–60 гг. н.э.","km":"~4500 км","r":"Деян 19–28"}];window.ATLAS_WPS=[{"n":"Антиохия (арх.)","role":"","note":""},{"n":"Филиппы (арх.)","role":"","note":""},{"n":"Бема Коринфа","role":"","note":""},{"n":"Эфес (арх.)","role":"","note":""}];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
