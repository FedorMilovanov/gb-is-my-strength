<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Царства Израиля и Иуды — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{position:relative;max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .frame-inner{stroke-width:.5;opacity:.35}
  .frame-orn use{opacity:.5}
  svg.zoomed .frame-inner,svg.zoomed .frame-orn{opacity:0}
  /* ════ СИСТЕМА МАСШТАБИРОВАНИЯ ЛИСТА ════
     Линейные объекты держат ЭКРАННУЮ толщину (non-scaling-stroke);
     точки/подписи/символы — ступени LOD z2/z3/z4 (целевые размеры в
     экранных px, пересчитаны на середину каждой ступени).            */
  #sheet-svg path[fill="none"][stroke="#2d4a66"],
  #sheet-svg path[fill="none"][stroke="#2e4d6b"],
  #sheet-svg g[stroke="#2d4a66"] path,
  #sheet-svg path[stroke="#4a80a8"], #sheet-svg path[stroke="#4a80a0"],
  #sheet-svg #tradeRoutes path,
  #sheet-svg .route, #sheet-svg .route-under, #sheet-svg .route-arrow,
  #sheet-svg .war-route, #sheet-svg .ovl,
  #sheet-svg .leader, #sheet-svg .grat,
  #sheet-svg .glyph path, #sheet-svg .glyph circle,
  #sheet-svg .decor-ship path,
  #sheet-svg path[stroke="#2e4d6b"], #sheet-svg ellipse[stroke="#2e4d6b"],
  #sheet-svg path[stroke="#8b7d5a"], #sheet-svg path[stroke="#3a4150"]
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city, #sheet-svg .pl-cand, #sheet-svg .pl-ctx, #sheet-svg .wp-dot
  {vector-effect:non-scaling-stroke}
  #sheet-svg .pl-city{stroke-width:1px}
  #sheet-svg .pl-cand{stroke-width:1.1px}
  /* при non-scaling-stroke dash-паттерн тоже в ЭКРАННЫХ px — задаём один раз */
  #sheet-svg #tradeRoutes path{stroke-width:2.1px;stroke-dasharray:.1 6.5}
  #sheet-svg .route{stroke-width:2.1px;stroke-dasharray:.1 8}
  #sheet-svg .route-arrow{fill:none;stroke:#b0472e;stroke-width:1.5px;stroke-linecap:round;stroke-linejoin:round;opacity:.72}
  /* издательский halo подписей: обводка цветом бумаги ПОД заливкой букв
     (paint-order) — пунктиры маршрутов/рек не перечёркивают текст;
     non-scaling держит толщину halo на всех зумах */
  #sheet-svg text.lab-place, #sheet-svg .lab-war, #sheet-svg .lab-ctx,
  #sheet-svg .mile-t, #sheet-svg text.lab-wp
  {paint-order:stroke;stroke:rgba(245,237,216,.88);stroke-width:2.6px;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  #sheet-svg .route-under{stroke-width:3px}
  #sheet-svg .war-route{stroke-width:1.15px;stroke-dasharray:9 5.5}
  #sheet-svg .ovl-covenant{stroke-width:1.5px;stroke-dasharray:10 6}
  #sheet-svg .ovl-ctxpath{stroke-width:1.2px;stroke-dasharray:2.8 4.6}
  #sheet-svg .grat{stroke-width:.8px}
  #sheet-svg .leader{stroke-width:.75px}
  /* ── ступень z2 (≈1.6–3.1×, целевые экранные: main 13 · minor 11 · точка 4.4) ── */
  svg.z2 text.lab-main{font-size:7.1px}
  svg.z2 text.lab-minor{font-size:6px}
  svg.z2 text.lab-cand{font-size:5.5px}
  svg.z2 .pl-city{transform:scale(.257);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-cand{transform:scale(.27);transform-box:fill-box;transform-origin:center}
  svg.z2 .pl-ctx{transform:scale(.293);transform-box:fill-box;transform-origin:center}
  svg.z2 .mile-t{font-size:5.5px}
  svg.z2 .lab-war{font-size:4.7px}
  svg.z2 .lab-ovl{font-size:4.4px}
  svg.z2 .lab-ctx{font-size:4.7px}
  svg.z2 text.lab-wp{font-size:4.4px}
  svg.z2 .war-x{transform:scale(.6);transform-box:fill-box;transform-origin:center}
  /* ── ступень z3 (≈3.1–5.5×) ── */
  svg.z3 text.lab-main{font-size:3.7px}
  svg.z3 text.lab-minor{font-size:3.2px}
  svg.z3 text.lab-cand{font-size:2.9px}
  svg.z3 .pl-city{transform:scale(.137);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-cand{transform:scale(.144);transform-box:fill-box;transform-origin:center}
  svg.z3 .pl-ctx{transform:scale(.16);transform-box:fill-box;transform-origin:center}
  svg.z3 .mile-t{font-size:2.9px}
  svg.z3 .lab-war{font-size:2.4px}
  svg.z3 .lab-ovl{font-size:2.3px}
  svg.z3 .lab-ctx{font-size:2.4px}
  svg.z3 text.lab-wp{font-size:2.3px}
  svg.z3 .war-x{transform:scale(.34);transform-box:fill-box;transform-origin:center}
  svg.z3 .lab-region{opacity:.22}
  /* ── ступень z4 (≥5.5×) ── */
  svg.z4 text.lab-main{font-size:2.3px}
  svg.z4 text.lab-minor{font-size:2px}
  svg.z4 text.lab-cand{font-size:1.8px}
  svg.z4 .pl-city{transform:scale(.0857);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-cand{transform:scale(.09);transform-box:fill-box;transform-origin:center}
  svg.z4 .pl-ctx{transform:scale(.107);transform-box:fill-box;transform-origin:center}
  svg.z4 .mile-t{font-size:1.8px}
  svg.z4 .lab-war{font-size:1.5px}
  svg.z4 .lab-ovl{font-size:1.4px}
  svg.z4 .lab-ctx{font-size:1.5px}
  svg.z4 text.lab-wp{font-size:1.4px}
  svg.z4 .war-x{transform:scale(.2);transform-box:fill-box;transform-origin:center}
  svg.z4 .lab-region{opacity:0}
  /* глифы: контур постоянный (ve), геометрия скейлится — тоньше не нужно */
  /* ── базовые подписи (донор): родная LOD-семантика lbl-z1/lbl-z2 ──
     ДВА бага разом: (1) селектор был ограничен text./g. — сырые ellipse/path
     с классом lbl-z2 (озеро Хула, стрелки течения, мелкие притоки) не
     попадали под гейт и были видны ВСЕГДА на любом зуме; (2) базовое
     правило с #sheet-svg (id) по специфичности ВСЕГДА перебивало
     "svg.z2 .lbl-z2" (id > class×2 в каскаде CSS) — из-за этого "Киннерет"
     и все донорские lbl-z2 подписи не проявлялись НИ НА ОДНОМ зуме за всё
     время существования этой LOD-системы. База без #id — тогда zoom-правило
     (0,2,0) законно перебивает базовое (0,1,0). */
  .lbl-z2{opacity:0}
  svg.z2 .lbl-z2{opacity:.85}
  svg.z3 .lbl-z2, svg.z4 .lbl-z2{opacity:.9}
  /* крупные надписи базы (моря/макрорегионы без lbl-классов) — хороши как фоновый
     "водяной знак" на обзоре, но перечёркивают локальные подписи при малейшем
     приближении: гасим уже на первой ступени зума, а не только с z3 */
  svg.zoomed text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.zoomed text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.45}
  svg.z3 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z3 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:.15}
  svg.z4 text.sea-label:not(.lbl-z1):not(.lbl-z2),
  svg.z4 text.region-label:not(.lbl-z1):not(.lbl-z2){opacity:0}
  svg.z3 text.region-he, svg.z4 text.region-he{opacity:.1}
  /* штриховка рельефа хороша как фактура на обзоре, но при зуме тайл растёт
     (userSpaceOnUse) и превращается в редкие гигантские полосы — гасим её
     к близким масштабам, оставляя мягкий рельефный тон (mtG-эллипсы) */
  #sheet-svg .relief{transition:none}
  svg.zoomed .relief{opacity:.5}
  svg.z3 .relief{opacity:.22}
  svg.z4 .relief{opacity:.08}
  /* бумажная фактура/виньетка — для обзора; feTurbulence-грейн на сильном
     зуме даёт тайловые артефакты (вертикальные полосы) — гасим на близких */
  svg.z3 .paper-grain{opacity:.2}
  svg.z4 .paper-grain{opacity:0}
  svg.z4 .paper-fx{opacity:.4}
  /* прибрежная тень-мелководье: глубина на обзоре, но на зуме читается
     тёмным клином вдоль берега — растворяем */
  svg.zoomed path[fill="rgba(13,40,70,.3)"]{opacity:.22}
  svg.z3 path[fill="rgba(13,40,70,.3)"], svg.z4 path[fill="rgba(13,40,70,.3)"]{opacity:0}
  svg.z3 text.lbl-z1, svg.z3 g.lbl-z1 text{font-size:2.4px}
  svg.z4 text.lbl-z1, svg.z4 g.lbl-z1 text{font-size:1.6px}
  svg.z3 text.lbl-z2, svg.z3 g.lbl-z2 text{font-size:2.2px}
  svg.z4 text.lbl-z2, svg.z4 g.lbl-z2 text{font-size:1.5px}
  svg.z2 .wp-dot{opacity:.75}
  /* без transition: смена LOD всегда совпадает с синхронной сменой viewBox
     (см. atlas-reader.js apply()), а CSS-transition для font-size/r в этом
     случае у части браузеров "застревает" на нескомпенсированном значении —
     переход в одном тике должен быть мгновенным и детерминированным */
  .grat{stroke:#8a6a1f;stroke-width:.8;opacity:.4}
  .grat-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a6a1f;opacity:.5}
  .rose path{fill:rgba(138,106,31,.32);stroke:#8a6a1f;stroke-width:.5;opacity:.8}
  .rose .rose-ring{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.5}
  .rose .rose-ticks path{fill:none;stroke:#8a6a1f;stroke-width:.6;opacity:.55}
  .rose .rose-sec{fill:rgba(138,106,31,.16);stroke:#8a6a1f;stroke-width:.4;opacity:.75}
  .rose .rose-shade{fill:rgba(107,82,22,.45);stroke:none}
  .rose .rose-hub{fill:#8a6a1f;stroke:none;opacity:.7}
  .graticule{transition:opacity .35s}
  svg.zoomed .graticule{opacity:0}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .lab-ctxnote{font-family:Lora,Georgia,serif;font-weight:500;fill:#8a7a5e;letter-spacing:.3em;opacity:.7;paint-order:stroke;stroke:#f3ecdc;stroke-width:.16em}
  .ovl{fill:none;stroke-linecap:round}
  .ovl-covenant{stroke:#7d8f4e;stroke-width:1.5;stroke-dasharray:11 7;opacity:.5}
  .ovl-ctxpath{stroke:#7a8fa0;stroke-width:1.2;stroke-dasharray:3 5;opacity:.55}
  .lab-ovl{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-ovl-covenant{fill:#6e7f42;letter-spacing:.12em}
  .lab-ovl-ctxpath{fill:#63798a}
  .sn-plate{fill:rgba(246,241,231,.72);stroke:rgba(138,106,31,.28);stroke-width:.7}
  .sn-title{font-family:Lora,Georgia,serif;font-weight:600;fill:#8a6a30;letter-spacing:.22em}
  .sn-line{font-family:Lora,Georgia,serif;font-style:italic;fill:#5a4c30}
  .decor-ship path{fill:none;stroke:#5c718a;stroke-width:1.1;opacity:.5;stroke-linejoin:round}
  .decor-ship .ds-line{stroke-width:.9}
  .decor-ship .ds-wave{opacity:.35}
  .pl-ctx{fill:#6e5f43;stroke:#f6f1e7;stroke-width:.7;opacity:.9}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#8a5a5c;stroke-width:1.05;opacity:.72;fill:none}
  .war-route{fill:none;stroke:#8a6668;stroke-width:1.15;stroke-dasharray:10 6;opacity:.42;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  .mile,.wp,.ovl-layer,.decor-ship,.war{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.09}
  #sheet-svg #tradeRoutes{opacity:.32}
  .glyph path,.glyph circle{fill:none;stroke:#6b5216;stroke-width:.85;stroke-linejoin:round;opacity:.85}
  .glyph .glyph-line{fill:none;stroke:#6b5216;stroke-width:.9;stroke-linecap:round}
  .glyph .glyph-flame{fill:#a25d33;stroke:none}
  .glyph .glyph-smoke{fill:none;stroke:#8a7a58;stroke-width:.8;opacity:.75;stroke-linecap:round}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#f5edd8;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#f5edd8;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.42);stroke-width:1}
  .cart-inner2{fill:none;stroke:rgba(138,106,31,.22);stroke-width:.5}
  .cartouche use{opacity:.72}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  /* было position:fixed + bottom:10 — на широких вьюпортах съезжал за
     край листа (как dive-btn), да ещё и садился на масштабную линейку;
     теперь внутри .wrap (position:absolute) и в верхнем правом углу, где
     после переноса dive-btn ниже розы ветров освободилось место */
  .g9{position:absolute;right:10px;top:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* компактный HUD зума: экранная шкала + север (фурнитура листа на зуме скрыта) */
  .zoom-hud{position:absolute;left:14px;bottom:14px;z-index:20;display:flex;align-items:center;gap:9px;font:600 11px/1 Georgia,serif;color:#6b5216;background:rgba(246,241,231,.92);border:1px solid rgba(138,106,31,.4);border-radius:8px;padding:7px 11px;box-shadow:0 2px 8px rgba(90,70,30,.18);pointer-events:none}
  /* display:flex выше перебивает UA-стиль [hidden] — возвращаем скрытие явно */
  .zoom-hud[hidden]{display:none}
  .zoom-hud .zh-bar{display:inline-block;height:5px;background:#4a3f28;border:1px solid #6b5216;border-radius:1px}
  .zoom-hud .zh-north{letter-spacing:.05em}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}
  .spine-it:hover{background:rgba(138,106,31,.08)}
  .spine-it--on{background:rgba(138,106,31,.14);box-shadow:inset 3px 0 0 #8a6a1f}
  .spine-head{padding:12px 12px 8px;font:700 10px/1 Georgia,serif;letter-spacing:.28em;color:#8a6a1f;border-bottom:1px solid rgba(138,106,31,.25)}
  .spine-cover{position:relative;display:block}
  .spine-cover b{position:absolute;left:6px;top:6px;background:rgba(246,241,231,.92);color:#8a6a1f;font:700 10px/1 Georgia,serif;border-radius:6px;padding:3px 6px;border:1px solid rgba(138,106,31,.4)}
  /* ── Ховер-карточка места: фото раскопок + факт ── */
  .place-card{position:fixed;z-index:30;width:300px;background:#f6f1e7;border:1px solid rgba(138,106,31,.45);border-radius:12px;box-shadow:0 14px 40px rgba(60,45,15,.35);overflow:hidden;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none;font-family:Lora,Georgia,serif}
  .place-card.pc--on{opacity:1;transform:none}
  .pc-ph{position:relative;height:130px;background:#e8dcbc}
  .pc-ph img{width:100%;height:100%;object-fit:cover;display:block}

  .dossier{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);z-index:26;background:#f6f1e7;border-left:1px solid rgba(138,106,31,.4);box-shadow:-16px 0 44px rgba(60,45,15,.3);transform:translateX(103%);transition:transform .28s ease;display:flex;flex-direction:column;font-family:Lora,Georgia,serif}

  .do-x{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:9px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.95);color:#7a5c26;font-size:19px;cursor:pointer}

  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}

  .do-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

  .do-bible .verse{display:block;padding:10px 12px;background:rgba(30,58,99,.06);border-left:3px solid #1e3a63;border-radius:6px;font:italic 400 13.5px/1.55 Georgia,serif;color:#1e3a63;margin-bottom:8px}

  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}

  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  /* position:absolute относительно .wrap (не viewport) — иначе на широких
     экранах кнопки съезжают за реальный правый край листа (обрезаются
     тенью контейнера); top сдвинут ниже розы ветров (компас в SVG кончается
     на ~108px при ширине листа 1500px) — иначе кнопка "Домой" ложится
     поверх компаса */
  .dive-btn{position:absolute;right:10px;top:120px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}
  .home-btn{right:64px}
  .legend-btn{top:166px}
  .legend-pop{position:absolute;right:10px;top:210px;z-index:22;background:rgba(246,241,231,.96);border:1px solid rgba(138,106,31,.4);border-radius:10px;padding:10px 13px;box-shadow:0 4px 14px rgba(90,70,30,.28);font:400 12px/1.5 Georgia,serif;color:#3a3020;max-width:220px}
  .legend-pop b{display:block;font:700 11px/1 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:8px}
  .legend-pop i{display:flex;align-items:center;gap:8px;font-style:normal}
  .legend-pop span{flex:0 0 20px;height:10px;display:inline-block}
  .legend-pop .lg-route{border-top:2.2px dotted #b0472e}
  .legend-pop .lg-dot{flex-basis:9px;width:9px;height:9px;border-radius:50%;background:#1e3a63;border:1.5px solid #f6f1e7}
  .legend-pop .lg-cand{flex-basis:9px;width:9px;height:9px;border-radius:50%;border:1.4px dashed #8a6a1f}
  .legend-pop .lg-arch{flex-basis:9px;width:8px;height:8px;background:#4e7a52;transform:rotate(45deg)}
  .legend-pop .lg-war{border-top:0;color:#8a6668;font-weight:700}
  .legend-pop .lg-war::before{content:"✕";color:#8a6668}
  .legend-pop .lg-lot{border-top:1.5px dashed #7c93a8}
  .dive-btn:hover{background:#f6f1e7}
  body.dive .spine,body.dive .stage-strip,body.dive .g9{display:none}

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":"../../images/atlas-avraam-scene-600w.webp"},{"slug":"ishod","title":"Исход из Египта","current":false,"cover":"../../images/atlas-ishod-scene-600w.webp"},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":"../../images/atlas-shvatim-scene-600w.webp"},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":"../../images/atlas-shoftim-scene-600w.webp"},{"slug":"melachim","title":"Царства Израиля и Иуды","current":true,"cover":"../../images/atlas-melachim-scene-600w.webp"},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":"../../images/atlas-yeshua-scene-600w.webp"},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":"../../images/atlas-early-church-scene-600w.webp"},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":"../../images/atlas-pavel-scene-600w.webp"},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":"../../images/atlas-revelation-scene-600w.webp"},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":"../../images/atlas-maccabim-scene-600w.webp"}];window.ATLAS_LAYERS=[{"id":"main","label":"Города царей","pathLabel":"путь Города царей"},{"id":"wp","label":"Археология","pathLabel":"путь Археология"}];window.ATLAS_PLACES={"jerusalem_kings":{"n":"Иерусалим","k":"Град Давида · Храм Соломона","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/200px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","tl":"Храмовая гора — Иерусалим","f":"Город Давида / Храмовая гора — 2Цар 5:6-9; 3Цар 6–8","lex":null,"glyphs":[],"dossier":{"story":"<p>Иерусалим — сердце библейской истории. Давид завоевал крепость Иевус и сделал её столицей объединённого царства (~1000 г. до н.э.). Соломон построил Храм — центр поклонения Яхве на 400 лет. После разделения (930 г.) Иерусалим остался столицей Иудеи. В 586 г. до н.э. Навуходоносор разрушил город и Храм, уведя народ в вавилонский плен.</p>","bible":"<div class=\"verse\">«И взял Давид крепость Сион: это — город Давидов».<span>2ЦАРСТВ 5:7</span></div><div class=\"verse\">«Я построил Тебе дом для обитания, место для вечного пребывания Твоего».<span>3ЦАРСТВ 8:13</span></div>","arch":"<p>Раскопки в Городе Давида (Эйлат Мазар, 2005–): большое каменное строение эпохи Давида/Соломона. Туннель Езекии (533 м, Силоамская надпись). Стена Неемии. Шестикамерные ворота. Надпись из Тель-Дана (IX в.): «дом Давида» — древнейшее внебиблейское упоминание династии.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Давид и Соломон: историчность</div><div class=\"dispute-pos cons\"><b>Традиционная (консервативная):</b> Давид и Соломон — исторические фигуры, правившие объединённым царством в X в. до н.э. Надпись из Тель-Дана (IX в.) упоминает «дом Давида». <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-pos alt\"><b>Минималистская:</b> Иерусалим X в. — небольшое поселение, объединённая монархия — поздняя легенда. <span class=\"conf-lo\">Надёжность: низкая</span></div><div class=\"dispute-note\">Позиция: Давид и Соломон — реальные исторические фигуры. Масштаб строительства мог быть преувеличен библейским повествованием.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Трижды избранный город:</b> Бог избрал Иерусалим для Своего Имени (3Цар 11:36), для Храма (2Пар 6:6) и для искупления мира (Лк 9:51). От горы Мориа (жертвоприношение Исаака) до Голгофы — одна линия Божьего плана.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/640px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0f/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg/200px-Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%28SE_exposure%29.jpg","label":"Храмовая гора — Иерусалим","credit":"Wikimedia Commons"}]}},"gibeah":{"n":"Гива","k":"Столица Саула","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Tell_el-Ful.jpg/200px-Tell_el-Ful.jpg","tl":"Тель эль-Фуль — Гива Саула","f":"Тель эль-Фуль — 1Цар 10:26; 11:4; 15:34","lex":null,"glyphs":[],"dossier":{"story":"<p>Гива — родной город и столица первого царя Израиля Саула. Здесь он был помазан на царство, отсюда правил и сюда возвращался после походов. Раскопки в Тель эль-Фуль обнаружили крепость железного века — вероятно, дворец Саула.</p>","bible":"<div class=\"verse\">«И пошёл Саул в дом свой, в Гиву; и пошли с ним храбрые, которых сердца коснулся Бог».<span>1ЦАРСТВ 10:26</span></div>","arch":"<p>Тель эль-Фуль раскопан Олбрайтом (1922–1923, 1933). Крепость железного века I (XII–XI вв.), перестроенная в несколько фаз. Четырёхкомнатные ворота. Керамика и архитектура согласуются с периодом Саула.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Саул — трагический царь:</b> Избранный Богом, помазанный Самуилом, Саул начал хорошо, но закончил трагически. Его правление — урок: внешние данные (высокий, красивый) не заменяют послушания Богу. «Послушание лучше жертвы» (1Цар 15:22).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Tell_el-Ful.jpg/640px-Tell_el-Ful.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/Tell_el-Ful.jpg/200px-Tell_el-Ful.jpg","label":"Тель эль-Фуль — Гива Саула","credit":"Wikimedia Commons"}]}},"hebron_kings":{"n":"Хеврон","k":"Первая столица Давида · 7 лет","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","tl":"Хеврон — пещера Махпела","f":"Эль-Халиль — 2Цар 2:1-4; 5:1-5","lex":null,"glyphs":[],"dossier":{"story":"<p>Давид воцарился в Хевроне над Иудой и правил там семь лет и шесть месяцев, прежде чем был помазан над всем Израилем. Здесь он родил шестерых сыновей, включая Амнона и Авессалома. Хеврон — город Авраама, Исаака и Иакова, место погребения патриархов в пещере Махпела.</p>","bible":"<div class=\"verse\">«И пришли мужи Иудины и помазали там Давида на царство над домом Иудиным».<span>2ЦАРСТВ 2:4</span></div>","arch":"<p>Хеврон — первая столица Давида (7,5 лет, 2Цар 2:1–11), до переноса в Иерусалим. Пещера Махпела — фамильная гробница Давидовой династии. В эпоху царств — один из укреплённых городов Иудеи.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Семь лет в Хевроне:</b> Давид ждал 7 лет, прежде чем стать царём над всем Израилем. Бог не спешит. Период ожидания — не потерянное время, а подготовка. Из Хеврона Давид вышел готовым царём.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/640px-Hebron_Cave_of_the_Patriarchs.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Hebron_Cave_of_the_Patriarchs.jpg/200px-Hebron_Cave_of_the_Patriarchs.jpg","label":"Хеврон — пещера Махпела","credit":"Wikimedia Commons"}]}},"shechem_kings":{"n":"Сихем","k":"Первая столица Израиля","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_Balata%2C_Shechem.jpg/200px-Tell_Balata%2C_Shechem.jpg","tl":"Тель Балата — древний Сихем","f":"Тель Балата — 3Цар 12:1,25","lex":null,"glyphs":[],"dossier":{"story":"<p>После разделения царства Иеровоам I сделал Сихем первой столицей Северного царства. Здесь собрались колена, отказавшиеся от Ровоама. Позже столица переместилась в Пенуэл, затем в Фирцу, и наконец в Самарию при Амврии.</p>","bible":"<div class=\"verse\">«И обстроил Иеровоам Сихем на горе Ефремовой и поселился в нём».<span>3ЦАРСТВ 12:25</span></div>","arch":"<p>Сихем (Телль-Балата) — где Ровоам был коронован (3Цар 12:1), и где произошло разделение царства. Иеровоам сделал Сихем столицей Северного царства (до переноса в Фирцу). Раскопки открыли ханаанейский храм, израильские ворота.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Разделение царства:</b> Ровоам отверг совет старейшин и послушал молодых советников. Результат: 10 колен ушли. «Такова была воля Господа» (3Цар 12:15). Бог использует даже глупость правителей для исполнения Своего плана.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_Balata%2C_Shechem.jpg/640px-Tell_Balata%2C_Shechem.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/5a/Tell_Balata%2C_Shechem.jpg/200px-Tell_Balata%2C_Shechem.jpg","label":"Тель Балата — древний Сихем","credit":"Wikimedia Commons"}]}},"samaria":{"n":"Самария","k":"Столица Израиля · дом Амврия","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","tl":"Руины Самарии (Себастия)","f":"Себастия — 3Цар 16:24; 4Цар 17:5-6","lex":null,"glyphs":[],"dossier":{"story":"<p>Амврий купил гору Семерон и построил Самарию (~880 г. до н.э.) как столицу Северного царства. Город процветал при Ахаве и Ииуе. В 722 г. до н.э. Салманасар V и Саргон II Ассирийский взяли Самарию после трёхлетней осады. 10 колен были уведены в плен и рассеяны.</p>","bible":"<div class=\"verse\">«В девятый год Осии взял царь Ассирийский Самарию».<span>4ЦАРСТВ 17:6</span></div>","arch":"<p>Раскопки Гарварда (1908–1910) и объединённой экспедиции (1931–1935). Дворец Амврия/Ахава, «слоновья кость» (3Цар 22:39), остраконы Самарии (налоговые документы VIII в.). Ассирийские рельефы в Нимруде изображают осаду и падение Самарии.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Столица отступников:</b> Самария была построена Амврием на купленной горе и стала центром идолопоклонства. Осия (10 раз) и Амос обличали её. Падение Самарии в 722 г. до н.э. — урок: политическая мощь без послушания Богу ведёт к гибели.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/640px-Sebastia-313.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/cf/Sebastia-313.jpg/200px-Sebastia-313.jpg","label":"Руины Самарии (Себастия)","credit":"Wikimedia Commons"}]}},"carmel":{"n":"Кармил","k":"Илия против пророков Ваала","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Mount_Carmel_081.jpg/200px-Mount_Carmel_081.jpg","tl":"Гора Кармил","f":"Хар ха-Кармель, 546 м — 3Цар 18:20-40","lex":null,"glyphs":[],"dossier":{"story":"<p>Гора Кармил — место одного из самых драматичных противостояний в Библии. Пророк Илия вызвал 450 пророков Ваала на состязание: «Бог, Который ответит посредством огня, есть Бог». После нескольких часов безрезультатных криков вааловых пророков Илия помолился — и огонь Господень попалил жертву, дрова, камни и воду. Народ пал на лица: «Господь есть Бог!».</p>","bible":"<div class=\"verse\">«И ниспал огонь Господень, и пожрал всесожжение, и дрова, и камни, и прах, и воду, которая во рве».<span>3ЦАРСТВ 18:38</span></div>","arch":"<p>Кармил (Хар-Кармель) — горный хребет, где Илия одержал победу над жрецами Ваала (3Цар 18). Раскопки на вершине — остатки алтарей и пещер отшельников. В эпоху царств — стратегический наблюдательный пункт над Изреельской долиной.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Илия на Кармиле — поворотный момент:</b> После трёх с половиной лет засухи Бог ответил огнём. «Господь есть Бог!» — это был не просто богословский тезис, а выбор народа, которому предстояло жить по этому исповеданию.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Mount_Carmel_081.jpg/640px-Mount_Carmel_081.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Mount_Carmel_081.jpg/200px-Mount_Carmel_081.jpg","label":"Гора Кармил","credit":"Wikimedia Commons"}]}},"bethel_kings":{"n":"Вефиль","k":"Золотой телец Иеровоама","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Beitin.jpg/200px-Beitin.jpg","tl":"Бейтин — древний Вефиль","f":"Бейтин — 3Цар 12:28-29; 13:1-5","lex":null,"glyphs":[],"dossier":{"story":"<p>Чтобы удержать северные колена от паломничеств в Иерусалим, Иеровоам I поставил золотого тельца в Вефиле и вторую статую в Дане. «Вот боги твои, Израиль, которые вывели тебя из земли Египетской» (3Цар 12:28). Вефиль стал центром синкретического культа на 200 лет, пока Иосия не разрушил жертвенник.</p>","bible":"<div class=\"verse\">«И поставил одного в Вефиле, а другого в Дане. И повело это ко греху».<span>3ЦАРСТВ 12:29-30</span></div>","arch":"<p>Вефиль (Бетин) — центр золотого тельца Иеровоама (3Цар 12:29). Пророк из Иудеи предрёк гибель жертвенника (3Цар 13). Осия обличал культ здесь (Ос 10:15). Раскопки Kelso — слои от ранней бронзы до персидского периода.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>«Дом Божий» стал домом идолов:</b> Иеровоам I поставил золотого тельца в Вефиле из политических соображений — чтобы народ не ходил в Иерусалим. Религия стала инструментом политики. Через 200 лет Иосия разрушил этот жертвенник, исполнив пророчество 3Цар 13:2.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Beitin.jpg/640px-Beitin.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6b/Beitin.jpg/200px-Beitin.jpg","label":"Бейтин — древний Вефиль","credit":"Wikimedia Commons"}]}},"dan_kings":{"n":"Дан","k":"Второй телец · северный предел","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/200px-Dan_Gate.jpg","tl":"Ворота Тель Дана — «дом Давида»","f":"Тель Дан — Суд 18:27-31; 3Цар 12:29","lex":null,"glyphs":[],"dossier":{"story":"<p>Дан — северная граница Израиля («от Дана до Вирсавии»). Здесь колено Дана поставило истукан ещё в эпоху Судей. Иеровоам I использовал эту традицию для второго золотого тельца. В 1993 г. в Тель Дане найдена стела IX в. до н.э. с надписью «дом Давида» — древнейшее археологическое свидетельство династии Давида.</p>","bible":"<div class=\"verse\">«От Дана до Вирсавии» — фраза, повторяющаяся 10+ раз в Ветхом Завете как обозначение всей земли Израиля.</div>","arch":"<p>Тель Дан — ключевой археологический объект. Раскопки Авраама Бирана (1966–1999). Ворота Авраама (средняя бронза, ~1750 г. до н.э.) — древнейшая арка в мире. Стела из Тель Дана (IX в. до н.э.): арамейская надпись о победе над «царём Израиля» и «царём дома Давида» — первое внебиблейское упоминание Давида. Культовый комплекс эпохи Иеровоама.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Стела из Тель Дана:</b> В 1993 г. найдена арамейская надпись IX в. до н.э. с упоминанием «дома Давида» — древнейшее внебиблейское свидетельство династии Давида. Археология подтверждает: Давид — не легенда, а историческая фигура.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/640px-Dan_Gate.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f2/Dan_Gate.jpg/200px-Dan_Gate.jpg","label":"Ворота Тель Дана — «дом Давида»","credit":"Wikimedia Commons"}]}},"gezer":{"n":"Газер","k":"Соломоновы ворота и город","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Gezer_017.jpg/200px-Gezer_017.jpg","tl":"Тель Гезер — ворота Соломона","f":"Тель Гезер — 3Цар 9:15-17","lex":null,"glyphs":[],"dossier":{"story":"<p>Газер — ханаанский город, отданный фараоном в приданое дочери, вышедшей за Соломона. Соломон укрепил Газер вместе с Асором и Мегиддо (3Цар 9:15). Шестикамерные ворота Газера идентичны воротам в Асоре и Мегиддо — археологическая «визитная карточка» Соломонова строительства.</p>","bible":"<div class=\"verse\">«Фараон, царь Египетский, пришёл и взял Газер… и отдал его в приданое дочери своей, жене Соломоновой».<span>3ЦАРСТВ 9:16</span></div>","arch":"<p>Раскопки Макалистера (1902–1909) и Дивера (1960-е–1970-е). Шестикамерные ворота X в., приписываемые Соломону. Календарь из Газера (X в.) — древнейший известный палеоеврейский текст. Мегалитический культовый комплекс (стоянки камней).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Календарь из Газера:</b> Древнейший палеоеврейский текст (X в. до н.э.) — сельскохозяйственный календарь, найденный в Газере. Показывает, что еврейская письменность существовала во времена Соломона.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Gezer_017.jpg/640px-Gezer_017.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Gezer_017.jpg/200px-Gezer_017.jpg","label":"Тель Гезер — ворота Соломона","credit":"Wikimedia Commons"}]}},"megiddo_kings":{"n":"Мегиддо","k":"Колесничный город Соломона","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/200px-Tel_Megiddo_%282%29.jpg","tl":"Тель Мегиддо","f":"Тель Мегиддо — 3Цар 9:15; 4:26","lex":null,"glyphs":[],"dossier":{"story":"<p>Соломон сделал Мегиддо одним из трёх главных укреплённых городов наряду с Асором и Газером. Город был центром колесничных войск: «У Соломона было 1 400 колесниц и 12 000 всадников» (3Цар 4:26). Археологически здесь найдены конюшни и колесничные помещения.</p>","bible":"<div class=\"verse\">«И собрал Соломон колесницы и всадников; у него было тысяча четыреста колесниц и двенадцать тысяч всадников».<span>3ЦАРСТВ 4:26</span></div>","arch":"<p>Мегиддо (Тель-Мегиддо) — город-крепость Соломона (3Цар 9:15). Ворота Соломона (6-камерные), конюшни (повторное использование в Израиле), водный туннель (XII в.). Раскопки IAA/Chicago.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Армагеддон:</b> Хар-Мегиддо — гора Мегиддо. Откр 16:16 помещает здесь финальную битву. Мегиддо видел больше сражений, чем любое другое место в истории — и будет местом последней битвы.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/640px-Tel_Megiddo_%282%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0d/Tel_Megiddo_%282%29.jpg/200px-Tel_Megiddo_%282%29.jpg","label":"Тель Мегиддо","credit":"Wikimedia Commons"}]}},"hazor_kings":{"n":"Асор","k":"Третий город Соломона","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","tl":"Тель Хацор","f":"Тель Хацор — 3Цар 9:15","lex":null,"glyphs":[],"dossier":{"story":"<p>Соломон восстановил и укрепил Асор как административный центр севера. Три города — Асор, Мегиддо, Газер — образуют «триаду Соломона»: идентичные шестикамерные ворота и казематные стены в каждом. Раскопки Игаля Ядина подтвердили эту связь.</p>","bible":"<div class=\"verse\">«Вот распоряжение о налоге, который наложил царь Соломон, чтобы построить храм Господень… и Асор, и Мегиддо, и Газер».<span>3ЦАРСТВ 9:15</span></div>","arch":"<p>Асор (Тель-Хацор) — город-крепость Соломона (3Цар 9:15). Ворота Соломона, крепость. Крупнейший библейский тель (200 акров). Yadin/Ben-Tor.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Триада Соломона:</b> Асор, Мегиддо и Газер имеют идентичные шестикамерные ворота — археологическое подтверждение единого строительства при Соломоне (3Цар 9:15). Это не легенда, а история.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/640px-Hatzor-Israelite-4.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/Hatzor-Israelite-4.jpg/200px-Hatzor-Israelite-4.jpg","label":"Тель Хацор","credit":"Wikimedia Commons"}]}},"lachish":{"n":"Лахис","k":"Последняя крепость Иудеи","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Lachish_Gate.jpg/200px-Lachish_Gate.jpg","tl":"Ворота Тель Лахиш","f":"Тель Лахиш — 4Цар 18:14; Иер 34:7","lex":null,"glyphs":[],"dossier":{"story":"<p>Лахис — второй по значению город Иудеи после Иерусалима, главная крепость на пути из Египта. Сеннахирим Ассирийский осаждал Лахис в 701 г. до н.э. и изобразил осаду на рельефах своего дворца в Ниневии. В 586 г. Навуходоносор разрушил Лахис вместе с Иерусалимом. Лахишские письма (остраконы) — последние сообщения из осаждённого города.</p>","bible":"<div class=\"verse\">«Между тем только Лахис и Азека оставались ещё у них из городов укреплённых».<span>ИЕРЕМИЯ 34:7</span></div>","arch":"<p>Раскопки Старки (1932–1938) и Уссишкина (1973–1994). Ассирийская осадная рампа — единственная в мире сохранившаяся in situ. 21 остракон (лахишские письма, ~589 г.) — свидетельства последних дней перед вавилонской осадой. Массивные ворота, дворец, культовые предметы.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Письма из Лахиша:</b> 21 остракон (черепок с надписью) найден в руинах Лахиша. Они описывают последние дни перед вавилонским нашествием 586 г. Один из них сообщает: «Мы смотрим на сигнальные огни Лахиша… но Азеки уже не видно». Библейская история в реальном времени.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Lachish_Gate.jpg/640px-Lachish_Gate.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/5/52/Lachish_Gate.jpg/200px-Lachish_Gate.jpg","label":"Ворота Тель Лахиш","credit":"Wikimedia Commons"}]}},"mizpah_judah":{"n":"Массифа","k":"Центр после падения Иерусалима","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Tell_en-Nasbeh.jpg/200px-Tell_en-Nasbeh.jpg","tl":"Тель эн-Насбех — Массифа","f":"Тель эн-Насбех — 4Цар 25:23-26; Иер 40–41","lex":null,"glyphs":[],"dossier":{"story":"<p>После разрушения Иерусалима в 586 г. вавилоняне назначили Годолию правителем над остатком Иудеи. Он разместил администрацию в Массифе. Пророк Иеремия также остался там. Годолия был убит через несколько месяцев, и остаток бежал в Египет, уведя с собой Иеремию.</p>","bible":"<div class=\"verse\">«И пришли к Годолии в Массифу… и Годолия поклялся им и людям их, и сказал: не бойтесь служить Халдеям».<span>4ЦАРСТВ 25:23-24</span></div>","arch":"<p>Массифа (Тель-эн-Насбе) — в уделе Вениамина, где Самуил собирал Израиль (1Цар 7:5–12). После плена — административный центр (Годолия, 4Цар 25:23). Раскопки Zorn — мощные укрепления железа.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Последняя администрация:</b> После падения Иерусалима вавилоняне назначили Годолию правителем в Массифе. Иеремия остался с остатком. Убийство Годолии привело к бегству в Египет — последний акт трагедии.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Tell_en-Nasbeh.jpg/640px-Tell_en-Nasbeh.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/Tell_en-Nasbeh.jpg/200px-Tell_en-Nasbeh.jpg","label":"Тель эн-Насбех — Массифа","credit":"Wikimedia Commons"}]}},"babylon":{"n":"Вавилон","k":"Пленение 586 г. · 70 лет","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Babylon_Ishtar_Gate.jpg/200px-Babylon_Ishtar_Gate.jpg","tl":"Ворота Иштар — Вавилон (Пергамский музей)","f":"Вавилон, Ирак — 4Цар 25:8-12; Пс 136; Иер 25:11-12","lex":null,"glyphs":[],"dossier":{"story":"<p>В 586 г. до н.э. Навуходоносор разрушил Иерусалим, сжёг Храм и увёл иудеев в вавилонский плен. Псалом 136: «При реках Вавилона… сидели мы и плакали». Иеремия предсказал 70 лет плена (Иер 25:11-12). Кир Великий в 539 г. издал указ о возвращении (Езд 1:1-4).</p>","bible":"<div class=\"verse\">«При реках Вавилона, там сидели мы и плакали, когда вспоминали о Сионе».<span>ПСАЛОМ 136:1</span></div>","arch":"<p>Вавилон — один из крупнейших городов древности. Раскопки немецкого восточного общества (Кольдевей, 1899–1917). Ворота Иштар ( Pergamon Museum, Берлин), Дорога процессий, Висячие сады, зиккурат Этеменанки. Вавилонский Талмуд составлен здесь в V–VI вв. н.э.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>70 лет — срок Божьего суда и Божьей верности:</b> Иеремия (25:11-12) предсказал 70 лет плена. Даниил, читая Иеремию, понял, что время возвращения близко (Дан 9:2). Бог судит Свой народ, но не забывает Своих обещаний.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Babylon_Ishtar_Gate.jpg/640px-Babylon_Ishtar_Gate.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/3/3d/Babylon_Ishtar_Gate.jpg/200px-Babylon_Ishtar_Gate.jpg","label":"Ворота Иштар — Вавилон (Пергамский музей)","credit":"Wikimedia Commons"}]}},"jezreel":{"n":"Изреель","k":"Дворец Ахава · виноградник Навуфея","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/200px-Jezreel_Valley.jpg","tl":"Изреельская долина","f":"Изреель (Тель-Изреель) — где находился дворец Ахава и Иезавели (4Цар 9–10). Раскопки Ussishkin/Woodhead (1990-е) открыли большой оградительный ров и остатки дворцового комплекса.","lex":null,"glyphs":[],"dossier":{"story":"<p>В Изрееле находился дворец царя Ахава. Здесь произошла история с виноградником Навуфея: Ахав захотел сад, Иезавель организовала казнь Навуфея, а Илия предсказал гибель всей династии Амврия. Пророчество исполнилось: Ииуй убил Иорама и выбросил его тело на поле Навуфея.</p>","bible":"<div class=\"verse\">«Так говорит Господь: ты убил, и ещё вступаешь в наследство? На том месте, где псы лизали кровь Навуфея, псы будут лизать и твою кровь».<span>3ЦАРСТВ 21:19</span></div>","arch":"<p>Изреель (Тель-Изреель) — где находился дворец Ахава и Иезавели (4Цар 9–10). Раскопки Ussishkin/Woodhead (1990-е) открыли большой оградительный ров и остатки дворцового комплекса.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Виноградник Навуфея:</b> Ахав хотел сад, Иезавель организовала убийство. Илия встретил Ахава в винограднике: «На том месте, где псы лизали кровь Навуфея, псы будут лизать и твою кровь». Через несколько лет Ииуй убил сына Ахава и бросил его тело на том же поле. Божье слово исполняется буквально.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/640px-Jezreel_Valley.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Jezreel_Valley.jpg/200px-Jezreel_Valley.jpg","label":"Изреельская долина","credit":"Wikimedia Commons"}]}},"kir_haraseth":{"n":"Кир-Харешет","k":"Меса · жертва сына · Елисей","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Karak_Castle_Jordan.jpg/200px-Karak_Castle_Jordan.jpg","tl":"Эль-Карак — древний Кир-Харешет","f":"Стела Месы (Moabite Stone) — базальтовая плита с надписью моавитского царя Месы (IX в. до н.э.), найденная в Дивоне (1868). Упоминает войну с Израилем, «дом Амврия» и божество Хамо…","lex":null,"glyphs":[],"dossier":{"story":"<p>Царь Моава Меса восстал против Израиля. Иорам, Иосафат и царь Едома пошли войной. Елисей предсказал: «Не увидите ветра и не увидите дождя, а долина сия наполнится водою». Меса в отчаянии принёс в жертву своего первенца на стене. Стела Месы (надпись на моавитском языке) подтверждает эти события.</p>","bible":"<div class=\"verse\">«И взял он сына своего первенца, которому следовало царствовать вместо него, и вознёс его во всесожжение на стене».<span>4ЦАРСТВ 3:27</span></div>","arch":"<p>Стела Месы (Moabite Stone) — базальтовая плита с надписью моавитского царя Месы (IX в. до н.э.), найденная в Дивоне (1868). Упоминает войну с Израилем, «дом Амврия» и божество Хамоса. Подтверждает историчность 4Цар 3.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Стела Месы — подтверждение Библии:</b> Моавитский камень (1868, Лувр) содержит надпись царя Месы о победе над Израилем. Он упоминает «дом Амврия» и бога Хамоса. Удивительно: враг Израиля подтверждает библейскую историю.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Karak_Castle_Jordan.jpg/640px-Karak_Castle_Jordan.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Karak_Castle_Jordan.jpg/200px-Karak_Castle_Jordan.jpg","label":"Эль-Карак — древний Кир-Харешет","credit":"Wikimedia Commons"}]}},"syria_aram":{"n":"Дамаск Арамейский","k":"Венадад · Азаил · Елисей","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/200px-Umayyad_Mosque_%28night%29.jpg","tl":"Мечеть Омейядов — древний Дамаск","f":"Дамаск (Арамейская столица) — центр арамейского царства Рецина (3Цар 11:23–25). Ахав воевал с ним (3Цар 20). Илия помазал Азаила (3Цар 19:15). Раскопки — арамейский город, дворец, …","lex":null,"glyphs":[],"dossier":{"story":"<p>Арамейский Дамаск был главным врагом Израиля в IX–VIII вв. Нееман Сириянин исцелился от проказы, окунувшись 7 раз в Иордане. Елисей предсказал, что Азаил станет царём Арама. Венадад осаждал Самарию, но был обращён в бегство Богом (4Цар 7).</p>","bible":"<div class=\"verse\">«И пошёл он, и окунулся в Иордане семь раз… и обновилось тело его, как тело малого ребёнка, и очистился».<span>4ЦАРСТВ 5:14</span></div>","arch":"<p>Дамаск (Арамейская столица) — центр арамейского царства Рецина (3Цар 11:23–25). Ахав воевал с ним (3Цар 20). Илия помазал Азаила (3Цар 19:15). Раскопки — арамейский город, дворец, храм Хадада.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Нееман — враг, исцелённый Богом Израиля:</b> Сирийский военачальник, прокажённый, окунулся 7 раз в Иордане по слову Елисея — и очистился. Иисус упомянул его в назаретской синагоге: «Много было прокажённых в Израиле… и ни один не очистился, кроме Неемана Сириянина» (Лк 4:27). За это Его хотели убить.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/640px-Umayyad_Mosque_%28night%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a8/Umayyad_Mosque_%28night%29.jpg/200px-Umayyad_Mosque_%28night%29.jpg","label":"Мечеть Омейядов — древний Дамаск","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"ark":{"t":"Ковчег","d":"Знак традиции, не находки: Быт 8:4 говорит о «горах Араратских» (страна Урарту), а не о пике. Все заявленные «находки ковчега» — от Дурупынара до «Арарат-аномалии» — не верифицированы; лодкообразную формацию Дурупынар первыми разобрали креационные геологи (Snelling, 1992). Атлас показывает регион и честно называет традиции."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};window.ATLAS_STAGES=[{"n":"I","t":"Саул — первый царь","d":"","age":"40 ЛЕТ ПРАВЛЕНИЯ","km":"~1050–1010","r":"1Цар 8–31"},{"n":"II","t":"Давид — царь воин","d":"","age":"40 ЛЕТ · ИЕРУСАЛИМ","km":"~1010–970","r":"2Цар 1–24"},{"n":"III","t":"Соломон — строитель","d":"","age":"40 ЛЕТ · ХРАМ","km":"~970–930","r":"3Цар 1–11"},{"n":"IV","t":"Разделённое царство","d":"","age":"ИЗРАИЛЬ · 20 ЦАРЕЙ","km":"~930–722","r":"3Цар 12–4Цар 17"},{"n":"V","t":"Иудея одна","d":"","age":"ЕЗЕКИЯ · ИОСИЯ · ПАДЕНИЕ","km":"~722–586","r":"4Цар 18–25; 2Пар 29–36"},{"n":"VI","t":"Плен и возвращение","d":"","age":"70 ЛЕТ · КИР · ЗОРОВАВЕЛЬ","km":"~586–516","r":"Езд 1–6; Пс 136"}];window.ATLAS_WPS=[{"n":"Город Давида (арх.)","role":"","note":""},{"n":"Самария (раскопки)","role":"","note":""},{"n":"Тель Лахиш (осада Сеннахирима)","role":"","note":""},{"n":"Стела Тель Дан (дом Давида)","role":"","note":""}];window.ATLAS_OVLS=[];window.ATLAS_DECOR={"ship":{"t":"Корабль Великого моря","d":"Декор в традиции старинных атласов — и напоминание, что Средиземное («Великое», Чис 34:6) море для патриархов было краем мира: их пути шли по суше. Морская торговля (корабли Фарсиса — 3 Цар 10:22; Ион 1:3) расцветёт много позже."},"whale":{"t":"«Левиафан, которого Ты сотворил играть в нём»","d":"Пс 103:25–26 о Великом море: «Это — море великое и пространное: там пресмыкающиеся, которым нет числа… там плавают корабли, там этот левиафан, которого Ты сотворил играть в нём». Кит на пустой воде — цитата старинной картографии и псалма разом."},"caravan":{"t":"Караван в Аравийской пустыне","d":"Виньетка в традиции старинных карт — и напоминание о верблюжьих караванах эпохи патриархов: «И взял раб из верблюдов господина своего десять верблюдов… и пошёл в Месопотамию» (Быт 24:10). Великие караванные пути огибали сердце Аравии — прямых дорог через пустыню не было."}};</script>
