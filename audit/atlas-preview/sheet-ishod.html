<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Исход из Египта — лист Атласа (светлый, awaiting G9)</title>
<link rel="stylesheet" href="../../fonts/fonts.css">
<style>
  html,body{margin:0;min-height:100%;background:#efe6cf}
  body{display:grid;place-items:center;padding:12px;box-sizing:border-box}
  .wrap{max-width:1500px;width:100%;box-shadow:0 18px 60px rgba(90,70,30,.35), 0 2px 10px rgba(90,70,30,.22);border-radius:6px;overflow:hidden}
  svg.sheet{display:block;width:100%;height:auto;background:#f5edd8}
  .frame{fill:none;stroke:#8a6a1f;stroke-width:1.2;opacity:.55}
  .base{opacity:.96}
  .base [fill="#10263a"]{fill:#8fb7cb}
  .base [stroke="#2e4d6b"]{stroke:#6f97ae}
  .base [stroke="#2d4a66"]{stroke:#6f97ae}
  .base text{opacity:.85}
  .route-under{fill:none;stroke:#fdf9ef;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.3}
  .route{fill:none;stroke:#a2653f;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.1 8.2;opacity:.82}
  .pl-city{fill:#1e3a63;stroke:#f6f1e7;stroke-width:.9}
  .pl-cand{fill:none;stroke:#8a6a1f;stroke-width:1.2;stroke-dasharray:2.6 2}
  .pl{cursor:pointer}
  .pl-ctx{fill:#8a7a5e;stroke:#f6f1e7;stroke-width:.7;opacity:.85}
  .lab-ctx{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#8a7a5e;opacity:.9;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .war-x{stroke:#96503c;stroke-width:1.05;opacity:.75;fill:none}
  .war-route{fill:none;stroke:#96503c;stroke-width:1.25;stroke-dasharray:7 4.5;opacity:.5;stroke-linecap:round}
  .lab-war{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500;fill:#8a4a38;opacity:.92;paint-order:stroke;stroke:#f3ecdc;stroke-width:.14em;stroke-linejoin:round}
  .lab-war-note{opacity:.8}
  .glyph-hit{cursor:pointer}
  #sheet-svg [fill="url(#jordanG)"]{opacity:.22}
  #sheet-svg #tradeRoutes{opacity:.32}
  .glyph path,.glyph circle{fill:none;stroke:#6b5216;stroke-width:.85;stroke-linejoin:round;opacity:.85}
  .glyph .glyph-line{fill:none;stroke:#6b5216;stroke-width:.9;stroke-linecap:round}
  .glyph .glyph-flame{fill:#a25d33;stroke:none}
  .glyph .glyph-smoke{fill:none;stroke:#8a7a58;stroke-width:.8;opacity:.75;stroke-linecap:round}

  .wp-dot{fill:#4a7a52;stroke:none;opacity:.6}
  .leader{stroke:#5c4d33;stroke-width:.75;opacity:.45}
  .mile-t{font:italic 500 1em 'Cormorant Garamond',Georgia,serif;opacity:.95;letter-spacing:.04em}
  text.lab-place{font-family:Lora,Georgia,serif;font-weight:600;fill:#2b2418;letter-spacing:.01em;paint-order:stroke;stroke:#f5edd8;stroke-width:.17em;stroke-linejoin:round}
  text.lab-cand{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#6b5a35;paint-order:stroke;stroke:#f5edd8;stroke-width:.15em;stroke-linejoin:round}
  text.lab-region{font-family:Lora,Georgia,serif;font-weight:500;fill:#7a6a48;letter-spacing:.34em;opacity:.78;paint-order:stroke;stroke:#f5edd8;stroke-width:.18em;stroke-linejoin:round}
  text.lab-ctx{font-family:Georgia,serif;letter-spacing:.24em;fill:#8a7a58;opacity:.6;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  text.lab-wp{font-family:Georgia,serif;font-style:italic;fill:#4a6a52;opacity:0;transition:opacity .3s;paint-order:stroke;stroke:#f5edd8;stroke-width:.16em}
  svg.zoomed text.lab-wp{opacity:.85}
  .plate{fill:rgba(246,241,231,.85);stroke:rgba(120,95,40,.35);stroke-width:1}
  .cart-plate{fill:rgba(246,241,231,.92)}
  .cart-inner{fill:none;stroke:rgba(138,106,31,.3);stroke-width:.8}
  .cart-over{font-family:Lora,Georgia,serif;fill:#8a6a1f;letter-spacing:.26em;font-weight:500}
  .cart-title{font-family:'Playfair Display',Georgia,serif;font-weight:700;fill:#243a56;letter-spacing:.01em}
  .cart-sub{font-family:Lora,Georgia,serif;font-style:italic;font-weight:400;fill:#5c6e86}
  .leg-t{font-family:Lora,Georgia,serif;font-weight:500;fill:#3a3020;opacity:.9}
  .sb-d{fill:#3a3020}.sb-l{fill:#f6f1e7;stroke:#3a3020;stroke-width:1}
  .sb-t{font-family:Georgia,serif;fill:#5c4d33;font-weight:600}
  .north{fill:#8a6a1f;stroke:#6b5216;stroke-width:1}
  .north-t{font-family:Georgia,serif;font-weight:700;fill:#6b5216}
  .stage-strip{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:#f0e8d2;border-top:1px solid rgba(138,106,31,.25)}
  .st{display:flex;align-items:center;gap:8px}
  .st-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 1px 2px rgba(90,70,30,.4)}
  .st-body{font-family:Georgia,serif;font-size:13px;color:#3a3020}
  .st-body b{color:#8a6a1f}
  .st-body i{color:#7a6a48;margin-left:6px;font-size:11.5px}
  .g9{position:fixed;right:10px;bottom:10px;z-index:9;font:600 10px/1 system-ui;letter-spacing:.08em;color:#7a5c26;background:rgba(246,241,231,.9);border:1px solid rgba(138,106,31,.4);border-radius:999px;padding:6px 10px}
  /* ── Читалка (R1, §14): корешок, погружение, курсоры ── */
  svg.sheet{cursor:grab;touch-action:none}
  .frame,.legend,.cartouche,.furn{transition:opacity .35s}
  svg.zoomed .frame,svg.zoomed .legend,svg.zoomed .cartouche,svg.zoomed .furn{opacity:0;pointer-events:none}
  svg.sheet.grabbing{cursor:grabbing}
  .stage-strip .st{cursor:pointer;border-radius:8px;padding:2px 8px;margin:-2px -8px;transition:background .15s}
  .stage-strip .st:hover{background:rgba(138,106,31,.1)}
  .stage-strip .st--on{background:rgba(138,106,31,.16)}
  .spine{position:fixed;left:0;top:0;bottom:0;z-index:20;display:flex;align-items:stretch}
  .spine-tab{writing-mode:vertical-rl;transform:rotate(180deg);display:flex;align-items:center;gap:6px;padding:14px 5px;background:rgba(246,241,231,.94);border-right:1px solid rgba(138,106,31,.35);color:#8a6a1f;font:700 11px/1 Georgia,serif;letter-spacing:.22em;cursor:pointer;box-shadow:2px 0 10px rgba(90,70,30,.15)}
  .spine-list{width:0;overflow:hidden;overflow-y:auto;background:rgba(246,241,231,.97);transition:width .25s ease;box-shadow:4px 0 18px rgba(90,70,30,.2)}
  .spine:hover .spine-list,.spine:focus-within .spine-list{width:212px}
  .spine-it{display:block;padding:10px 12px;text-decoration:none;color:#3a3020;font:600 13px/1.25 Georgia,serif;border-bottom:1px solid rgba(138,106,31,.14)}
  .spine-it img{display:block;width:100%;border-radius:6px;margin-bottom:6px;box-shadow:0 2px 8px rgba(90,70,30,.25)}
  .spine-it:hover{background:rgba(138,106,31,.08)}
  .spine-it--on{background:rgba(138,106,31,.14);box-shadow:inset 3px 0 0 #8a6a1f}
  .spine-head{padding:12px 12px 8px;font:700 10px/1 Georgia,serif;letter-spacing:.28em;color:#8a6a1f;border-bottom:1px solid rgba(138,106,31,.25)}
  .spine-cover{position:relative;display:block}
  .spine-cover b{position:absolute;left:6px;top:6px;background:rgba(246,241,231,.92);color:#8a6a1f;font:700 10px/1 Georgia,serif;border-radius:6px;padding:3px 6px;border:1px solid rgba(138,106,31,.4)}
  /* ── Ховер-карточка места: фото раскопок + факт ── */
  .place-card{position:fixed;z-index:30;width:300px;background:#f6f1e7;border:1px solid rgba(138,106,31,.45);border-radius:12px;box-shadow:0 14px 40px rgba(60,45,15,.35);overflow:hidden;opacity:0;transform:translateY(6px) scale(.98);transition:opacity .18s,transform .18s;pointer-events:none;font-family:Lora,Georgia,serif}
  .place-card.pc--on{opacity:1;transform:none}
  .pc-ph{position:relative;height:130px;background:#e8dcbc}
  .pc-ph img{width:100%;height:100%;object-fit:cover;display:block}
  .pc-ph i{position:absolute;left:0;right:0;bottom:0;padding:14px 10px 5px;font:600 9px/1 system-ui;letter-spacing:.12em;color:#fff;background:linear-gradient(transparent,rgba(20,14,4,.72))}
  .pc-body{padding:10px 12px 12px}
  .pc-body b{display:block;font:700 15px/1.2 Georgia,serif;color:#1e3a63}
  .pc-body u{display:block;text-decoration:none;font:600 10.5px/1.3 Georgia,serif;color:#8a6a1f;letter-spacing:.06em;margin-top:2px}
  .pc-body p{margin:7px 0 0;font:400 12px/1.5 Georgia,serif;color:#3a3020}
  /* ── Панель-досье (клик по месту) ── */
  .dossier{position:fixed;right:0;top:0;bottom:0;width:min(430px,94vw);z-index:26;background:#f6f1e7;border-left:1px solid rgba(138,106,31,.4);box-shadow:-16px 0 44px rgba(60,45,15,.3);transform:translateX(103%);transition:transform .28s ease;display:flex;flex-direction:column;font-family:Lora,Georgia,serif}
  .dossier.do--on{transform:none}
  .do-x{position:absolute;right:10px;top:10px;z-index:2;width:34px;height:34px;border-radius:9px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.95);color:#7a5c26;font-size:19px;cursor:pointer}
  .do-head{padding:16px 54px 12px 18px;border-bottom:1px solid rgba(138,106,31,.25);background:rgba(240,232,210,.6)}
  .do-head b{display:block;font:700 20px/1.2 Georgia,serif;color:#1e3a63}
  .do-head u{display:block;text-decoration:none;font:600 11.5px/1.35 Georgia,serif;color:#8a6a1f;margin-top:3px;letter-spacing:.05em}
  .do-scroll{overflow-y:auto;padding:14px 18px 22px;flex:1}
  .do-gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .do-ph{margin:0}
  .do-ph img{width:100%;height:96px;object-fit:cover;border-radius:8px;box-shadow:0 2px 8px rgba(90,70,30,.3);display:block;background:#e8dcbc}
  .do-ph figcaption{font:600 8.5px/1.3 system-ui;letter-spacing:.08em;color:#7a6a48;margin-top:3px}
  .do-ph figcaption i{display:block;font:400 8px/1.2 system-ui;color:#9a8a68;letter-spacing:0}
  .do-sec{margin:0 0 14px}
  .do-sec h4{margin:0 0 5px;font:700 10.5px/1 Georgia,serif;letter-spacing:.22em;color:#8a6a1f;text-transform:uppercase}
  .do-lex{background:rgba(138,106,31,.06);border:1px solid rgba(138,106,31,.16);border-radius:10px;padding:12px 14px}
  .do-lex .lex-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .do-lex .he{font-family:'Noto Serif Hebrew',serif;font-size:1.7em;line-height:1.2;color:#3a3020}
  .do-lex .lex-tr{font-family:Lora,Georgia,serif;color:#8a6a30;font-size:.95em}
  .do-lex .lex-ru{font-family:Lora,Georgia,serif;font-weight:600;margin:.2em 0 .35em}
  .do-lex .lex-note{margin:.25em 0;line-height:1.55}
  .do-lex .lex-refs{margin:.35em 0 0;font-style:italic;color:#6b5a35;font-size:.92em}
  .do-lex .lex-glyph{display:flex;flex-direction:column;gap:2px;margin-top:.7em;padding-top:.6em;border-top:1px dashed rgba(138,106,31,.25)}
  .do-lex .lex-glyph b{font-family:Lora,Georgia,serif}
  .do-lex .lex-glyph span{line-height:1.5;font-size:.94em}
  .do-sec p{margin:0 0 8px;font:400 13.5px/1.6 Georgia,serif;color:#2b2418}
  .do-bible .verse{display:block;padding:10px 12px;background:rgba(30,58,99,.06);border-left:3px solid #1e3a63;border-radius:6px;font:italic 400 13.5px/1.55 Georgia,serif;color:#1e3a63;margin-bottom:8px}
  .do-bible .verse span{display:block;font:700 9.5px/1 system-ui;letter-spacing:.16em;color:#8a6a1f;margin-top:6px;font-style:normal}
  .do-sec .dispute-block{border:1px solid rgba(138,106,31,.35);border-radius:10px;padding:10px 12px;background:rgba(240,232,210,.5)}
  .do-sec .dispute-title{font:700 11px/1.2 Georgia,serif;letter-spacing:.1em;color:#8a6a1f;margin-bottom:7px}
  .do-sec .dispute-pos{font:400 12.5px/1.55 Georgia,serif;color:#2b2418;margin-bottom:7px}
  .do-sec .conf-med,.do-sec .conf-lo,.do-sec .conf-hi{display:inline-block;font:600 9px/1 system-ui;letter-spacing:.08em;padding:2px 7px;border-radius:999px;background:rgba(138,106,31,.15);color:#7a5c26}
  .do-sec .act-btn{display:none}
  body.dive .dossier{display:none}
  .dive-btn{position:fixed;right:10px;top:10px;z-index:21;width:38px;height:38px;border-radius:10px;border:1px solid rgba(138,106,31,.4);background:rgba(246,241,231,.92);color:#7a5c26;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(90,70,30,.2)}
  .dive-btn:hover{background:#f6f1e7}
  body.dive .spine,body.dive .stage-strip,body.dive .g9{display:none}
  body.dive .wrap{max-width:none;border-radius:0;box-shadow:none}
  body.dive{padding:0}
</style>
</head>
<body>
<div class="wrap"><svg id="sheet-svg" viewBox="10.0 426.7 1300 866.7" data-vb="10.0 426.7 1300 866.7" xmlns="http://www.w3.org/2000/svg" class="sheet" role="img" aria-label="Исход из Египта — лист Атласа">
<defs>
  <linearGradient id="landG" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0e7cf"/><stop offset=".45" stop-color="#e8dcbc"/><stop offset="1" stop-color="#dfd1a9"/>
  </linearGradient>
  <linearGradient id="richLandG" x1="0" y1="0" x2=".5" y2="1">
    <stop offset="0" stop-color="#ece1c2"/><stop offset=".5" stop-color="#e5d8b4"/><stop offset="1" stop-color="#decfa6"/>
  </linearGradient>
  <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe0e9"/><stop offset="1" stop-color="#b4cedd"/>
  </linearGradient>
  <pattern id="seaPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M0,10 Q5,6 10,10 Q15,14 20,10" fill="none" stroke="#7fa7c4" stroke-width=".6" opacity=".38"/>
    <path d="M0,20 Q5,16 10,20 Q15,24 20,20" fill="none" stroke="#7fa7c4" stroke-width=".5" opacity=".26"/>
  </pattern>
  <radialGradient id="fertileG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6b8f4a" stop-opacity=".26"/><stop offset="1" stop-color="#6b8f4a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="jordanG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4f7a3f" stop-opacity=".3"/><stop offset="1" stop-color="#4f7a3f" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="desertG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#c09a55" stop-opacity=".2"/><stop offset="1" stop-color="#c09a55" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="negevG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#b08050" stop-opacity=".16"/><stop offset="1" stop-color="#b08050" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="sinaiG" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#a07040" stop-opacity=".18"/><stop offset="1" stop-color="#a07040" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="mtG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#8b7d5a" stop-opacity=".4"/><stop offset="1" stop-color="#8b7d5a" stop-opacity="0"/>
  </linearGradient>
  <pattern id="mountainHatch" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" stroke="#8b7d5a" stroke-width=".6" opacity=".45"/>
  </pattern>
  <pattern id="desertStipple" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r=".7" fill="#9c7c43" opacity=".4"/>
    <circle cx="9" cy="9" r=".5" fill="#9c7c43" opacity=".3"/>
    <circle cx="6" cy="1" r=".4" fill="#b08050" opacity=".25"/>
  </pattern>
  <filter id="waterRipple" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation=".8"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="dotShadow" x="-60%" y="-60%" width="220%" height="220%">
    <feDropShadow dx="0" dy=".7" stdDeviation=".8" flood-color="#3a2c10" flood-opacity=".45"/>
  </filter>
  <radialGradient id="sunGlow" cx=".22" cy=".14" r=".9">
    <stop offset="0" stop-color="#ffdf9a" stop-opacity=".22"/>
    <stop offset=".4" stop-color="#f5d489" stop-opacity=".08"/>
    <stop offset="1" stop-color="#f5d489" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="edgeFog" cx=".5" cy=".5" r=".72">
    <stop offset="0" stop-color="#7a5c26" stop-opacity="0"/>
    <stop offset=".8" stop-color="#7a5c26" stop-opacity="0"/>
    <stop offset="1" stop-color="#6b4f1e" stop-opacity=".18"/>
  </radialGradient>
  <filter id="parchmentGrain">
    <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="2" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 .45  0 0 0 0 .36  0 0 0 0 .2  0 0 0 .05 0"/>
  </filter>
</defs>
<rect x="10" y="426.6666666666667" width="1300" height="866.6666666666666" fill="url(#seaG)"/>
<g class="base"><?xml version="1.0" encoding="UTF-8"?>
<!-- base-geo.svg — базовая география Ближнего Востока
     Общая для всех карт: Авраам, Исход, Павел, Давид
     Координаты: viewBox 0 0 1900 1430 (W0×H0)
     Масштаб: 1 SVG-единица ≈ 0.92 км
     НЕ МЕНЯТЬ координатную систему!
     Обновление: при добавлении новых географических объектов
-->

<defs>
  <!-- Все фильтры и градиенты из основного файла -->
  <!-- Импортируются в конкретную карту через <use> или inline -->
</defs>
<!-- ============ TERRAIN ============ -->
<g id="terrain" data-layer="base-geo">
  <rect x="-400" y="-400" width="2700" height="2230" fill="url(#landG)"/>
  <!-- Terrain texture overlay для глубины рельефа -->
  <rect x="-400" y="-400" width="2700" height="2230" fill="url(#richLandG)" opacity=".3" filter="url(#terrainTex)"/>

  <!-- deserts / fertile tints -->
  <ellipse cx="1240" cy="1010" rx="520" ry="330" fill="url(#desertG)"/>
  <ellipse cx="470" cy="1130" rx="260" ry="220" fill="url(#desertG)"/>
  <ellipse cx="560" cy="930" rx="170" ry="110" fill="url(#desertG)"/>
  <ellipse cx="1280" cy="520" rx="430" ry="200" fill="url(#fertileG)" transform="rotate(28 1280 520)"/>
  <ellipse cx="640" cy="700" rx="110" ry="240" fill="url(#fertileG)"/>
  <ellipse cx="220" cy="930" rx="120" ry="120" fill="url(#fertileG)"/>
  <path fill="url(#fertileG)" d="M226,1014 C196,964 168,916 142,868 L304,860 C280,912 252,964 226,1014 Z"/>

  <!-- mountain ridges (decorative) -->
  <g stroke="#6b6248" stroke-width="2" fill="none" opacity=".14" filter="url(#soft)">
    <path d="M120,160 Q300,110 470,150 Q620,180 760,150 Q900,118 1060,160"/>
    <path d="M180,205 Q330,165 480,195 Q640,225 800,196"/>
    <path d="M1430,110 Q1530,210 1610,310 Q1700,430 1790,560 Q1840,640 1880,720"/>
    <path d="M1500,90 Q1600,190 1680,300 Q1770,430 1860,560"/>
    <path d="M668,520 Q676,560 670,600"/>
    <path d="M652,758 Q646,800 640,845"/>
  </g>

  <!-- Ливанские горы / Антиливан (северный Ханаан) -->
  <g opacity=".22" filter="url(#soft)">
    <path fill="url(#mtG)" d="M590,500 C610,480 630,460 655,448 C670,440 690,435 710,432 C730,429 750,430 760,435 C748,450 730,460 710,468 C688,478 660,488 635,500 C618,508 602,515 590,520 Z"/>
    <path stroke="#8b7d5a" stroke-width="1.5" fill="none" opacity=".7" d="M600,502 Q618,492 636,484 Q660,474 685,468 Q710,462 730,458"/>
    <!-- Отдельные пики (снег на вершинах) -->
    <path d="M640,462 L644,453 L648,462 Z" fill="rgba(230,225,215,.15)" stroke="#a09070" stroke-width=".8"/>
    <path d="M670,446 L675,435 L680,446 Z" fill="rgba(230,225,215,.18)" stroke="#a09070" stroke-width=".8"/>
    <path d="M700,437 L705,425 L710,437 Z" fill="rgba(240,235,225,.2)" stroke="#b0a080" stroke-width=".9"/>

<script>window.ATLAS_SPINE=[{"slug":"nachalo","title":"Начало: от Эдема до Вавилона","current":false,"cover":null},{"slug":"avraam","title":"Путь Авраама","current":false,"cover":"../../images/atlas-avraam-scene-600w.webp"},{"slug":"ishod","title":"Исход из Египта","current":true,"cover":"../../images/atlas-ishod-scene-600w.webp"},{"slug":"shvatim","title":"12 Колен Израиля","current":false,"cover":"../../images/atlas-shvatim-scene-600w.webp"},{"slug":"shoftim","title":"Эпоха Судей","current":false,"cover":"../../images/atlas-shoftim-scene-600w.webp"},{"slug":"melachim","title":"Царства Израиля и Иуды","current":false,"cover":"../../images/atlas-melachim-scene-600w.webp"},{"slug":"yeshua","title":"Жизнь Иисуса Христа","current":false,"cover":"../../images/atlas-yeshua-scene-600w.webp"},{"slug":"early-church","title":"Ранняя Церковь · Деяния 1–12","current":false,"cover":"../../images/atlas-early-church-scene-600w.webp"},{"slug":"pavel","title":"Миссионерские путешествия Павла","current":false,"cover":"../../images/atlas-pavel-scene-600w.webp"},{"slug":"revelation","title":"7 Церквей Откровения","current":false,"cover":"../../images/atlas-revelation-scene-600w.webp"},{"slug":"maccabim","title":"Межзаветный период · Маккавеи","current":false,"cover":"../../images/atlas-maccabim-scene-600w.webp"}];window.ATLAS_PLACES={"rameses":{"n":"Раамсес","k":"Начало исхода · Тель эд-Даба/Авар","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Qantir_Pi-Ramesses.jpg/200px-Qantir_Pi-Ramesses.jpg","tl":"Тель эд-Даба/Кантир — Пи-Рамессес","f":"Тель эд-Даба (Кантир) — Исх 12:37; Числ 33:3-5","lex":null,"glyphs":[],"dossier":{"story":"<p>Отсюда вышли сыны Израилевы из Египта после 430 лет рабства (Исх 12:40-41). Раамсес — египетское имя города; в хронологии Ашшера — ок. 1447 г. до н.э. Тель эд-Даба (Авар) раскопан Манфредом Битаком: следы семитского населения Среднего царства согласуются с библейским контекстом.</p>","bible":"<div class=\"verse\">«И отправились сыны Израилевы из Раамсеса в Сокхоф, около шестисот тысяч пеших мужчин».<span>ИСХОД 12:37</span></div>","arch":"<p>Тель эд-Даба = Авар (Хиксосская столица и позднее резиденция Рамессидов). Раскопки М. Битака (1966–): семитские поселения ок. 1800–1550 до н.э., поздний период — рабочий квартал. YEC датировка: Исход при Тутмосе III (XVIII дин.) ок. 1447 до н.э. или при Рамессидах — дебаты открыты.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Дата Исхода: XV или XIII в. до н.э.?</div><div class=\"dispute-pos cons\"><b>Ранняя (~1447 до н.э.)</b>: 3Цар 6:1 — 480 лет до Храма (~967). Фараон: Тутмос III / Аменхотеп II. <span class=\"conf-med\">Средняя</span></div><div class=\"dispute-pos alt\"><b>Поздняя (~1260 до н.э.)</b>: Исх 1:11 — Раамсес при Рамессидах. Фараон: Рамсес II. <span class=\"conf-med\">Средняя</span></div><div class=\"dispute-note\">Позиция: YEC — ранняя дата. Название «Раамсес» может быть ретроспективным (ср. Быт 14:14).</div></div>","bible_extra":"<p class=\"bib-note\"><b>Пророчество:</b> Быт 15:13-14 — «потомки твои будут пришельцами… но Я произведу суд». Исполнено в Исх 12:35-36.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Qantir_Pi-Ramesses.jpg/640px-Qantir_Pi-Ramesses.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/6/6a/Qantir_Pi-Ramesses.jpg/200px-Qantir_Pi-Ramesses.jpg","label":"Тель эд-Даба/Кантир — Пи-Рамессес","credit":"Wikimedia Commons"}]}},"succoth":{"n":"Сокхоф","k":"Первая стоянка · шатры","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Wadi_Tumilat.jpg/200px-Wadi_Tumilat.jpg","tl":"Вади Тумилат — путь из Дельты","f":"Тель эль-Масхута / Дефенна? — Исх 12:37; 13:20; Числ 33:5-6","lex":null,"glyphs":[],"dossier":{"story":"<p><span class='hw' lang='he'>סֻכּוֹת</span> — «шатры, кущи»: место, где останавливаются для ночлега. Здесь Моисей объяснил закон о перворождённых (Исх 13:1-16) и первой Пасхе. Смешанное множество («толпа иноплеменников», Исх 12:38) присоединилось к Израилю.</p>","bible":"<div class=\"verse\">«И двинулись сыны Израилевы из Раамсеса в Сокхоф, около шестисот тысяч пеших мужчин».<span>ИСХОД 12:37</span></div>","arch":"<p>Сокхоф предположительно = египетск. «Tjeku»; возможно Тель эль-Масхута в Вади Тумилат. Аль-Бирдавил? Точная локализация дискуссионна. Вади Тумилат — естественный путь из Дельты на Синай.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Пасха и первенцы:</b> В Сокхофе даны законы о перворождённых (Исх 13:1-16). «И будет тебе знаком на руке» (13:9).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Wadi_Tumilat.jpg/640px-Wadi_Tumilat.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d2/Wadi_Tumilat.jpg/200px-Wadi_Tumilat.jpg","label":"Вади Тумилат — путь из Дельты","credit":"Wikimedia Commons"}]}},"pihahiroth":{"n":"Пи-Гахироф","k":"Место переправы · спор о локализации","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Gulf_of_Suez_from_ISS.jpg/200px-Gulf_of_Suez_from_ISS.jpg","tl":"Суэцкий залив из космоса — NASA","f":"Суэцкий? Акабский? — дискуссия — Исх 14:2,9; Числ 33:7-8","lex":null,"glyphs":[],"dossier":{"story":"<p>Здесь произошло чудо: «И разделились воды» (<span class='hw' lang='he'>וַיִּבָּקְעוּ הַמָּיִם</span>, Исх 14:21). Армия фараона была уничтожена. Моисей воспел: «Кто, как Ты, Господи!» (Исх 15). Три версии переправы: (1) Суэцкий залив; (2) Горькие озёра; (3) Акабский залив (ям суф = «море тростника» или «Красное море»).</p>","bible":"<div class=\"verse\">«И простёр Моисей руку свою на море, и гнал Господь море сильным восточным ветром всю ночь».<span>ИСХОД 14:21</span></div><div class=\"verse\">«Кто, как Ты, Господи, между богами? Кто, как Ты, величествен святостью?»<span>ИСХОД 15:11</span></div>","arch":"<p>Место переправы — одна из наиболее горячих дискуссий библейской географии. YEC: предпочтительна переправа через Акабский залив у Нувейбы (Ron Wyatt / 1980s, спорная гипотеза) или Суэцкий залив. Ям суф: евр. «тростниковое море» — исторически = Красному морю включая оба залива.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">⚖ Место переправы — главный вопрос географии Исхода</div><div class=\"dispute-pos cons\"><b>Суэцкий залив (северная часть)</b>: традиционная идентификация, согласуется с маршрутом через Вади Тумилат. Горькие озёра — возможное «море». <span class=\"conf-med\">Надёжность: средняя</span></div><div class=\"dispute-pos alt\"><b>Акабский залив</b>: аргументы Рона Уайатта (Нувейба) и рядом исследователей; глубина и ширина согласуются с «стеной воды». <span class=\"conf-lo\">Надёжность: спорная</span></div><div class=\"dispute-pos alt\"><b>Горькие озёра / мелководье</b>: натуралистические объяснения; отвергаются консервативными экзегетами (текст говорит о чуде). <span class=\"conf-lo\">Надёжность: низкая (отвергается)</span></div><div class=\"dispute-note\">Позиция сайта: реальное чудо Бога (Исх 14:21–22). Точное место — открытый вопрос; богословски важнее само событие.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Крещение в облаке и в море:</b> 1Кор 10:1-2: «Все прошли сквозь море; и все крестились в Моисея в облаке и в море». Переход через море — прообраз крещения: смерть старой жизни (Египет/рабство) и рождение новой (пустыня/Бог). Это не просто историческое событие, но богословский образ спасения.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Gulf_of_Suez_from_ISS.jpg/640px-Gulf_of_Suez_from_ISS.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Gulf_of_Suez_from_ISS.jpg/200px-Gulf_of_Suez_from_ISS.jpg","label":"Суэцкий залив из космоса — NASA","credit":"NASA PD"}]}},"etham":{"n":"Ефам","k":"Край пустыни · перед разворотом к морю","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Sinai_desert_wide.jpg/200px-Sinai_desert_wide.jpg","tl":"Синайская пустыня — край Ефама","f":"локализация спорна — Исх 13:20; Числ 33:6-7","lex":null,"glyphs":[],"dossier":{"story":"<p>Ефам — стан «на краю пустыни», откуда Израиль получает неожиданный поворот обратно к морю. Это подчёркивает: маршрут Исхода ведёт не просто по удобной дороге, а под водительством столпа облачного и огненного.</p>","bible":"<div class=\"verse\">«И двинулись из Сокхофа, и расположились станом в Ефаме, в конце пустыни».<span>ИСХОД 13:20</span></div>","arch":"<p>Точная локализация Ефама неизвестна. В карте это маршрутный узел между Вади Тумилат и зоной переправы; он отмечен как ориентир библейской последовательности, а не как археологически доказанный телль.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Столп:</b> Исх 13:21-22 — первое явление Шехины, ведущей Израиль. Присутствие Бога продолжится в Скинии.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Sinai_desert_wide.jpg/640px-Sinai_desert_wide.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/0/0c/Sinai_desert_wide.jpg/200px-Sinai_desert_wide.jpg","label":"Синайская пустыня — край Ефама","credit":"Wikimedia Commons"}]}},"marah":{"n":"Мара","k":"Горькая вода → сладкая","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Sinai_desert_spring.jpg/200px-Sinai_desert_spring.jpg","tl":"Источник в Синайской пустыне","f":"Эйн Хавара? Бир Сувейс? — Исх 15:23–25; Числ 33:8-9","lex":null,"glyphs":[],"dossier":{"story":"<p><span class='hw' lang='he'>מָרָה</span> — «горькая». Народ роптал: «Что нам пить?» — и Бог показал Моисею дерево, которое делает воду сладкой. Первое испытание — первый ропот — первое исцеление. Здесь же даны первые законы (Исх 15:25-26): «Если будешь слушаться Господа Бога твоего… то не наведу на тебя ни одной болезни».</p>","bible":"<div class=\"verse\">«И назвал то место Маррою. Народ роптал на Моисея: «Что нам пить?» — Тот воззвал к Господу, и Господь показал ему дерево, и он бросил его в воду, и вода сделалась сладкою».<span>ИСХОД 15:23,25</span></div>","arch":"<p>Точная локализация неизвестна. Кандидаты: Айн Хавара (~65 км от Суэца) или Бир Сувейс. Горькие источники типичны для NW Синая — высокое содержание магния и серы. Текст важнее локализации: здесь впервые дана Тора (уставы и законы, 15:25).</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Параллель Откровения:</b> Откр 8:10-11 описывает ангела, бросающего в воды «звезду Полынь» — воды становятся горькими и люди умирают. Обратный образ Мары: там дерево сделало горькое сладким — здесь звезда делает воды горькими. Мара — тип благодати; Полынь — образ суда.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Sinai_desert_spring.jpg/640px-Sinai_desert_spring.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/a/a4/Sinai_desert_spring.jpg/200px-Sinai_desert_spring.jpg","label":"Источник в Синайской пустыне","credit":"Wikimedia Commons"}]}},"elim":{"n":"Елим","k":"12 источников и 70 пальм","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Wadi_Gharandel.jpg/200px-Wadi_Gharandel.jpg","tl":"Вади Гарандель — возможный Елим","f":"Вади Гарандель? — Исх 15:27; Числ 33:9","lex":null,"glyphs":[],"dossier":{"story":"<p>После горьких вод Мары Израиль приходит в Елим: двенадцать источников и семьдесят пальм. Текст намеренно противопоставляет испытание и утешение: Бог не только испытывает, но и даёт место отдыха.</p>","bible":"<div class=\"verse\">«И пришли в Елим; там было двенадцать источников воды и семьдесят финиковых дерев; и расположились там станом при водах».<span>ИСХОД 15:27</span></div>","arch":"<p>Часто предлагается Вади Гарандель или соседние оазисы западного Синая. Идентификация вероятностная: карта фиксирует библейский стан и тип оазиса, а не окончательную точку.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Отдых после испытания:</b> За Мара следует Елим — принцип: за испытанием Бог даёт утешение (2Кор 1:3-5).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Wadi_Gharandel.jpg/640px-Wadi_Gharandel.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/7/7e/Wadi_Gharandel.jpg/200px-Wadi_Gharandel.jpg","label":"Вади Гарандель — возможный Елим","credit":"Wikimedia Commons"}]}},"rephidim":{"n":"Рефидим","k":"Вода из скалы · Амалик","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Wadi_Feiran.jpg/200px-Wadi_Feiran.jpg","tl":"Вади Фейран — возможный Рефидим","f":"район Вади Фейран? — Исх 17:1-16; Числ 33:14-15","lex":null,"glyphs":[],"dossier":{"story":"<p>В Рефидиме народ снова ропщет из-за воды, и Моисей ударяет по скале. Здесь же Амалик нападает на Израиля, а Моисей стоит на горе с поднятыми руками; победа связана не с силой войска, а с ходатайством.</p>","bible":"<div class=\"verse\">«И назвал месту тому имя: Масса и Мерива, по причине укорения сынов Израилевых».<span>ИСХОД 17:7</span></div>","arch":"<p>Локализация Рефидима спорна; часто называется район Вади Фейран при традиционном южносинайском маршруте. В карте это необходимый стан между Елимом/пустыней Син и Синаем.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Скала и победа:</b> 1Кор 10:4 — «камень был Христос». Руки Моисея — прообраз ходатайства. Иисус Навин = прообраз Иисуса Христа.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Wadi_Feiran.jpg/640px-Wadi_Feiran.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/c/c2/Wadi_Feiran.jpg/200px-Wadi_Feiran.jpg","label":"Вади Фейран — возможный Рефидим","credit":"Wikimedia Commons"}]}},"sinai":{"n":"Синай · гора Хорив","k":"Гора Завета · Десять слов","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mount_Sinai_%28Jabal_Musa%29.jpg/200px-Mount_Sinai_%28Jabal_Musa%29.jpg","tl":"Джебель Муса — традиционная гора Синай","f":"Джебель Муса (2285 м)? — Исх 19–20; 24; 31–34; Числ 10","lex":null,"glyphs":[],"dossier":{"story":"<p>Центр Исхода. Здесь 49 дней после Пасхи Бог говорит с народом, даёт Десять Слов (<span class='hw' lang='he'>עֲשֶׂרֶת הַדְּבָרִים</span>), заключает Завет, открывает Свою Славу (<span class='hw' lang='he'>כָּבוֹד יְהוָה</span>) Моисею. Здесь же — грех золотого тельца и прощение. Израиль проведёт у горы почти год.</p>","bible":"<div class=\"verse\">«И сказал Бог все слова сии, говоря: Я Господь, Бог твой, Который вывел тебя из земли Египетской, из дома рабства».<span>ИСХОД 20:1–2</span></div><div class=\"verse\">«И был вид славы Господней на вершине горы как огонь поядающий пред глазами сынов Израилевых».<span>ИСХОД 24:17</span></div>","arch":"<p>Традиционная идентификация: Джебель Муса (2285 м, «Гора Моисея»), монастырь Св. Екатерины IV в. Альтернативы: Джебель Лоз в Аравии (Саудовская Аравия, Рон Уайатт, спорная гипотеза), Джебель Синин. YEC: Джебель Муса — надёжная традиция с ранневизантийского периода, согласуется с Гал 4:25 («Синай в Аравии»).</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">⚖ Гора Синай: Джебель Муса или Джебель Лоз?</div><div class=\"dispute-pos cons\"><b>Джебель Муса (Южный Синай)</b>: традиция с IV в. н.э., монастырь Св. Екатерины, непрерывная паломническая история. <span class=\"conf-hi\">Надёжность: высокая (традиция)</span></div><div class=\"dispute-pos alt\"><b>Джебель Лоз (Саудовская Аравия)</b>: Рон Уайатт + Боб Корнуки (~1980-2000); Гал 4:25 «Синай в Аравии». Спорная гипотеза, не принятая основным потоком. <span class=\"conf-lo\">Надёжность: спорная</span></div><div class=\"dispute-note\">Позиция: Джебель Муса — наиболее обоснованная идентификация. Гал 4:25: «Аравия» в I в. н.э. включала Синайский полуостров.</div></div>","bible_extra":"<p class=\"bib-note\"><b>Пятидесятница:</b> Пасха → 50 дней → Синай // Пасха → 50 дней → Деян 2. Евр 12:18-24: «вы приступили к горе Сион».</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mount_Sinai_%28Jabal_Musa%29.jpg/640px-Mount_Sinai_%28Jabal_Musa%29.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4a/Mount_Sinai_%28Jabal_Musa%29.jpg/200px-Mount_Sinai_%28Jabal_Musa%29.jpg","label":"Джебель Муса — традиционная гора Синай","credit":"Wikimedia Commons"}]}},"kadesh_barnea":{"n":"Кадеш-Барнеа","k":"Разведчики · 40 лет странствий","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Ein_el-Qudeirat.jpg/200px-Ein_el-Qudeirat.jpg","tl":"Эйн эль-Кудейрат — оазис","f":"Эйн эль-Кудейрат — Числ 13–14; 20; 32:8; Втор 1:19-46","lex":null,"glyphs":[],"dossier":{"story":"<p>Самая горькая точка Исхода: разведчики вернулись с «дурной молвой» (Числ 13:32), народ отказался идти, и Бог произнёс приговор: «Сорок лет будете вы скитаться в пустыне» (Числ 14:33). Целое поколение умрёт здесь. Сюда же Израиль вернётся в конце странствий — и умрёт Мариам (Числ 20:1).</p>","bible":"<div class=\"verse\">«Сыны же Израилевы сорок лет ходили по пустыне, доколе не погиб весь народ, — воины, вышедшие из Египта, которые не слушали гласа Господня».<span>ИИСУС НАВИН 5:6</span></div>","arch":"<p>Эйн эль-Кудейрат — крупнейший оазис Синайского полуострова. Три крепости железного века (раскопки Коэна 1976–1982). Бронзовый слой отсутствует на телле — типично для кочевых стоянок. LOC Matson ~1900s: оазис с источником и стадами.</p>","dispute":"<div class=\"dispute-block\"><div class=\"dispute-title\">Кадеш: оазис без бронзового слоя</div><div class=\"dispute-pos cons\"><b>Эйн эль-Кудейрат</b>: три железновековые крепости (X–VII вв.). Бронза отсутствует. <span class=\"conf-med\">Средняя</span></div><div class=\"dispute-pos alt\"><b>Кочевая стоянка</b>: отсутствие архитектуры ожидаемо. Керамика Qurayyah Painted Ware. <span class=\"conf-med\">Средняя</span></div><div class=\"dispute-note\">Кочевники не оставляют построек; традиция (Евсевий) сильна.</div></div>","bible_extra":"<p class=\"bib-note\"><b>40 лет за 40 дней:</b> Числ 13:25; 14:34. Разведчики → неверие → приговор. Иисус Навин и Халев — остаток веры.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Ein_el-Qudeirat.jpg/640px-Ein_el-Qudeirat.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Ein_el-Qudeirat.jpg/200px-Ein_el-Qudeirat.jpg","label":"Эйн эль-Кудейрат — оазис","credit":"Wikimedia Commons"}]}},"aaron_mount":{"n":"Гора Ор","k":"Смерть Аарона","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Jebel_Harun_Petra.jpg/200px-Jebel_Harun_Petra.jpg","tl":"Джебель Харун — гора Аарона близ Петры","f":"Джебель Харун? — Числ 20:22-29; 33:37-39","lex":null,"glyphs":[],"dossier":{"story":"<p>На горе Ор умирает Аарон. Священнические одежды снимаются с него и надеваются на Елеазара: поколение Исхода уходит, но служение продолжается. Это один из самых тихих и тяжёлых переходов книги Чисел.</p>","bible":"<div class=\"verse\">«И снял Моисей с Аарона одежды его, и надел их на Елеазара, сына его; и умер там Аарон на вершине горы».<span>ЧИСЛА 20:28</span></div>","arch":"<p>Традиционная идентификация — Джебель Харун у Петры; есть и альтернативные предложения. Для scaffold карты это пограничный узел между Кадешем и равнинами Моава.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Смерть первосвященника:</b> Священство переходит. Ветхозаветное священство смертно; Христос — «Священник вовек» (Евр 7:17).</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Jebel_Harun_Petra.jpg/640px-Jebel_Harun_Petra.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/9a/Jebel_Harun_Petra.jpg/200px-Jebel_Harun_Petra.jpg","label":"Джебель Харун — гора Аарона близ Петры","credit":"Wikimedia Commons"}]}},"plains_moab":{"n":"Равнины Моавитские","k":"Конец странствий · пред Ханааном","t":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Mount_Nebo_View.jpg/200px-Mount_Nebo_View.jpg","tl":"Вид с Нево на Ханаан","f":"Вади Мозаиб / к востоку от Иерихона — Числ 22–36; Втор 1–34","lex":null,"glyphs":[],"dossier":{"story":"<p>Последний стан: здесь произнесены речи Второзакония, благословение Моисея, перепись народа. Моисей взошёл на Нево (<span class='hw' lang='he'>נְבוֹ</span>) и увидел всю землю — и умер там, «и никто не знает могилы его до сего дня» (Втор 34:6). Израиль оплакивал его тридцать дней — и перешёл Иордан под вождством Иисуса Навина.</p>","bible":"<div class=\"verse\">«И умер там Моисей, раб Господень, в земле Моавитской, по слову Господню».<span>ВТОРОЗАКОНИЕ 34:5</span></div><div class=\"verse\">«И не было более у Израиля пророка такого, как Моисей, которого Господь знал лицом к лицу».<span>ВТОРОЗАКОНИЕ 34:10</span></div>","arch":"<p>Равнины Моавитские — хорошо идентифицированный регион к востоку от нижнего Иордана, напротив Иерихона. Нево (Джебель Нейба, ~817 м) — традиционное место смерти Моисея; на вершине — мозаичная карта IV в. и мемориальная церковь. Раскопки подтверждают железновековые поселения; для бронзового века — номадический характер.</p>","dispute":"","bible_extra":"<p class=\"bib-note\"><b>Смерть Моисея:</b> Тора заканчивается не Ханааном. Закон не вводит в обетование — нужен Иисус (Навин). Втор 18:15 обещает Пророка.</p>","photos":[{"src":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Mount_Nebo_View.jpg/640px-Mount_Nebo_View.jpg","thumb":"https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/Mount_Nebo_View.jpg/200px-Mount_Nebo_View.jpg","label":"Вид с Нево на Ханаан","credit":"Wikimedia Commons"}]}}};window.ATLAS_GLYPHS={"ziggurat":{"t":"Зиккурат","d":"Ступенчатая храмовая башня Междуречья. У Ура — зиккурат Ур-Намму (~2100 г. до н.э.), раскопан Л. Вулли; святилище бога луны Нанны/Сина, городского божества Ура и Харрана."},"pyramid":{"t":"Пирамида","d":"Великие пирамиды Гизы к приходу Аврама уже стояли века (Древнее царство). Знак Египта — «дома фараонов», куда голод погнал патриарха (Быт 12:10)."},"ruin":{"t":"Разрушенный город","d":"Знак городов долины Сиддим, «ниспроверженных» серой и огнём (Быт 19:24–25). Дым над руиной — то, что увидел Авраам с высоты у Хеврона: «дым поднимается с земли, как дым из печи» (Быт 19:28)."},"oak":{"t":"Дубрава Мамре","d":"Элоне-Мамре — «дубрава Мамре» (Быт 13:18; 18:1): вековые деревья, под которыми Авраам принял трёх гостей. Знак дерева — место шатра и жертвенника патриарха."},"well":{"t":"Колодец","d":"Беэр — колодец: главная валюта кочевника в Негеве. За колодцы клялись (Беэр-Шева, Быт 21:25–31), из-за них спорили пастухи (Быт 26). Знак вырытого колодца с воротом."},"tent":{"t":"Шатёр патриарха","d":"«Авраам сидел при входе в шатёр, во время зноя дневного» (Быт 18:1). Шатёр — дом странника, не построившего города: «ибо он ожидал города, имеющего основание» (Евр 11:9–10)."},"sheep":{"t":"Стада","d":"Богатство патриархов измерялось скотом (Быт 13:2; 24:35). Из-за пастбищ разошлись Авраам и Лот (Быт 13:5–9); мелкий скот — предмет клятвы в Гераре и Беэр-Шеве (Быт 21:27–30)."},"spring":{"t":"Источник","d":"Аин — источник живой воды в пустыне; у источников останавливаются и встречают Бога (Агарь — Быт 16:7,13–14)."},"altar":{"t":"Жертвенник","d":"Маршрут Аврама размечен жертвенниками: Сихем (Быт 12:7), Бет-Эль (12:8), Хеврон (13:18), Мория (22:9) — богословская нить листа."},"gate":{"t":"Ворота","d":"Городские ворота — суд и сделки (Быт 23:10,18). У Тель-Дана сохранилась сырцовая арка ворот средней бронзы — «ворота времён Авраама»."},"palm":{"t":"Пальма","d":"Знак оазиса; Хацацон-Фамар — «Фамарь» значит «пальма» (Эн-Геди, 2 Пар 20:2)."},"tower":{"t":"Башня","d":"Знак города-крепости; на листе-прологе — Вавилонская башня (Быт 11)."}};</script>
