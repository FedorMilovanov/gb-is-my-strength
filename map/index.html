</style>

<script>
(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var svg=document.getElementById('cnv');
var card=document.getElementById('card');
var GROUPS={
  gill:{label:'Джон Гилл',color:'#d4a574'},
  'hard-texts':{label:'Тайны сердца',color:'#7da2e8'},
  nagornaya:{label:'Нагорная проповедь',color:'#5fc9a8'},
  standalone:{label:'Статьи',color:'#c9b186'},
  landing:{label:'Разделы',color:'#a78bfa'}
};
var W=1200,H=800;
var view={x:0,y:0,k:1};
var nodes=[],edges=[],byId={},deg={};
var gEdges,gNodes;
var hidden={};      // group -> true (выключен фильтром)
var pinned=null;    // зафиксированная карточка (id)
var hoverId=null;
var reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- детерминированный PRNG (стабильная раскладка) ---------- */
var seed=42;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}

fetch('/data/links-graph.json').then(function(r){return r.json()}).then(function(data){
  nodes=data.nodes; edges=data.edges;
  nodes.forEach(function(n){byId[n.id]=n;deg[n.id]=0});
  edges.forEach(function(e){deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1});
  layout();
  build();
  fit(1);
  document.getElementById('stats').innerHTML='<b>'+nodes.length+'</b> материалов · <b>'+edges.length+'</b> связи';
  buildLegend();
});

/* ---------- force layout ---------- */
function layout(){
  var gc={gill:{x:W*.26,y:H*.34},nagornaya:{x:W*.74,y:H*.30},'hard-texts':{x:W*.40,y:H*.72},standalone:{x:W*.72,y:H*.68},landing:{x:W*.52,y:H*.46}};
  nodes.forEach(function(n){
    var c=gc[n.group]||{x:W/2,y:H/2};
    n.x=c.x+(rnd()-.5)*170; n.y=c.y+(rnd()-.5)*130; n.vx=0; n.vy=0;
  });
  var iters=320;
  for(var t=0;t<iters;t++){
    var alpha=(1-t/iters)*.9;
    // отталкивание
    for(var i=0;i<nodes.length;i++)for(var j=i+1;j<nodes.length;j++){
      var a=nodes[i],b=nodes[j],dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);
      var rep=9000/d2; if(d<170)rep*=1.6;
      var fx=dx/d*rep,fy=dy/d*rep;
      a.vx-=fx*alpha;a.vy-=fy*alpha;b.vx+=fx*alpha;b.vy+=fy*alpha;
    }
    // пружины
    edges.forEach(function(e){
      var a=byId[e[0]],b=byId[e[1]];if(!a||!b)return;
      var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      var want=165+(Math.min(deg[a.id],deg[b.id])>6?50:0);
      var f=(d-want)*.015;
      var fx=dx/d*f,fy=dy/d*f;
      a.vx+=fx*alpha;a.vy+=fy*alpha;b.vx-=fx*alpha;b.vy-=fy*alpha;
    });
    // гравитация к центру группы
    var gc2=gc;
    nodes.forEach(function(n){
      var c=gc2[n.group];if(!c)return;
      n.vx+=(c.x-n.x)*.004*alpha;n.vy+=(c.y-n.y)*.004*alpha;
      n.x+=n.vx;n.y+=n.vy;n.vx*=.6;n.vy*=.6;
      n.x=Math.max(90,Math.min(W-90,n.x));n.y=Math.max(70,Math.min(H-70,n.y));
    });
  }
}

/* ---------- построение SVG ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function build(){
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  var defs=el('defs',{},svg);
  // мягкое свечение узлов
  var f=el('filter',{id:'glow',x:'-80%',y:'-80%',width:'260%',height:'260%'},defs);
  el('feGaussianBlur',{'in':'SourceGraphic',stdDeviation:'5',result:'b'},f);
  var m=el('feMerge',{},f); el('feMergeNode',{'in':'b'},m); el('feMergeNode',{'in':'SourceGraphic'},m);

  var root=el('g',{id:'root'},svg);
  gEdges=el('g',{id:'edges'},root);
  gNodes=el('g',{id:'nodes'},root);

  edges.forEach(function(e,i){
    var a=byId[e[0]],b=byId[e[1]];if(!a||!b)return;
    var mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    var bend=Math.min(34,d*.16);
    var px=-dy/d*bend,py=dx/d*bend;
    var p=el('path',{'class':'edge',d:'M'+a.x+','+a.y+' Q'+(mx+px)+','+(my+py)+' '+b.x+','+b.y,'stroke-width':1.1,'data-a':a.id,'data-b':b.id},gEdges);
  });

  nodes.forEach(function(n){
    var col=(GROUPS[n.group]||{}).color||'#c9b186';
    var r=6+Math.min(9,(deg[n.id]||1)*.85);
    var isHub=n.group==='landing';
    var g=el('g',{'class':'node'+(isHub?' hub':''),transform:'translate('+n.x+','+n.y+')','data-id':n.id,tabindex:'-1'},gNodes);
    el('circle',{'class':'halo',r:r+7,fill:'none',stroke:col,'stroke-opacity':.5,'stroke-width':1.4,filter:'url(#glow)'},g);
    el('circle',{'class':'ring',r:r+3.2,fill:'none',stroke:col,'stroke-opacity':.28,'stroke-width':1},g);
    el('circle',{'class':'core',r:r,fill:col,'fill-opacity':.92,stroke:'rgba(7,10,16,.9)','stroke-width':1.6},g);
    var label=n.title.length>28?n.title.slice(0,26)+'…':n.title;
    var ly=(n._lab=((n.y*7+n.x*3)|0)%2)?-(r+8):(r+15);el('text',{y:ly,'text-anchor':'middle'},g).textContent=label;
    n._g=g; n._r=r; n._col=col;
  });

  svg.addEventListener('pointerover',function(ev){
    var g=ev.target.closest&&ev.target.closest('.node'); if(!g)return;
    hoverId=g.getAttribute('data-id'); light(hoverId); showCard(hoverId,false);
  });
  svg.addEventListener('pointerout',function(ev){
    var g=ev.target.closest&&ev.target.closest('.node'); if(!g)return;
    if(pinned)return;
    hoverId=null;
    hideCardSoon();
  });
  svg.addEventListener('click',function(ev){
    var g=ev.target.closest&&ev.target.closest('.node');
    if(g){
      var id=g.getAttribute('data-id');
      if(pinned===id){pinned=null;unlight();hideCard()}
      else{pinned=id;light(id);showCard(id,true)}
      ev.stopPropagation();
    }else if(pinned){pinned=null;unlight();hideCard()}
  });
  card.addEventListener('pointerenter',function(){clearTimeout(hideT)});
  card.addEventListener('pointerleave',function(){if(!pinned)hideCardSoon()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&(pinned||card.classList.contains('on'))){pinned=null;unlight();hideCard()}});

  panzoom();
}

/* ---------- подсветка ---------- */
function light(id){
  var nb={}; nb[id]=1;
  gEdges.querySelectorAll('.edge').forEach(function(p){
    var a=p.getAttribute('data-a'),b=p.getAttribute('data-b');
    var hit=(a===id||b===id);
    p.classList.toggle('lit',hit); p.classList.toggle('dim',!hit);
    if(hit){nb[a]=1;nb[b]=1}
  });
  nodes.forEach(function(n){
    n._g.classList.toggle('lit',n.id===id);
    n._g.classList.toggle('dim',!nb[n.id]);
  });
}
function unlight(){
  gEdges.querySelectorAll('.edge').forEach(function(p){p.classList.remove('lit','dim')});
  nodes.forEach(function(n){n._g.classList.remove('lit','dim')});
}

/* ---------- карточка-превью ---------- */
var hideT=null;
function showCard(id,pin){
  clearTimeout(hideT);
  var n=byId[id];if(!n)return;
  var G=GROUPS[n.group]||{label:n.group,color:'#c9b186'};
  var img=document.getElementById('cImg');
  img.classList.remove('ld'); img.removeAttribute('src');
  if(n.cover){
    img.onload=function(){img.classList.add('ld')};
    img.src=n.cover;
    img.parentElement.style.display='';
  }else{
    img.parentElement.style.display='none';
  }
  var grp=document.getElementById('cGrp');
  grp.innerHTML='<i style="background:'+G.color+';color:'+G.color+'"></i>'+G.label;
  document.getElementById('cTtl').textContent=n.title;
  document.getElementById('cDsc').textContent=n.desc||'';
  var links=deg[n.id]||0;
  var mins=n.readingTime?('<b>'+n.readingTime+'</b> мин · '):'';
  document.getElementById('cMeta').innerHTML=mins+'<span><b>'+links+'</b> '+plural(links,'связь','связи','связей')+'</span>';
  document.getElementById('cGo').setAttribute('href',n.url);
  card.setAttribute('aria-hidden','false');
  position(n);
  card.classList.add('on');
}
function plural(x,a,b,c){var m=x%100,d=x%10;return m>10&&m<20?c:d>1&&d<5?b:d===1?a:c}
function position(n){
  if(matchMedia('(max-width:720px)').matches)return; // мобайл: css прижимает вниз
  var pt=svg.createSVGPoint();pt.x=n.x;pt.y=n.y;
  var sp=pt.matrixTransform(gNodes.getScreenCTM());
  var cw=330,ch=card.offsetHeight||300,pad=14;
  var x=sp.x+24, y=sp.y-ch/2;
  if(x+cw>innerWidth-pad)x=sp.x-cw-24;
  if(x<pad)x=pad;
  y=Math.max(pad+70,Math.min(innerHeight-ch-pad,y));
  card.style.left=x+'px'; card.style.top=y+'px'; card.style.right='auto'; card.style.bottom='auto';
}
function hideCard(){card.classList.remove('on');card.setAttribute('aria-hidden','true')}
function hideCardSoon(){clearTimeout(hideT);hideT=setTimeout(function(){if(!pinned){unlight();hideCard()}},260)}

/* ---------- легенда-фильтры ---------- */
function buildLegend(){
  var lg=document.getElementById('legend');
  Object.keys(GROUPS).forEach(function(k){
    var count=nodes.filter(function(n){return n.group===k}).length;
    var b=document.createElement('button');
    b.type='button';b.className='lg';b.setAttribute('data-g',k);
    b.innerHTML='<i style="background:'+GROUPS[k].color+';color:'+GROUPS[k].color+'"></i>'+GROUPS[k].label+'<span class="n">'+count+'</span>';
    b.setAttribute('aria-pressed','true');
    b.addEventListener('click',function(){
      hidden[k]=!hidden[k];
      b.classList.toggle('off',hidden[k]);
      b.setAttribute('aria-pressed',hidden[k]?'false':'true');
      applyFilter();
    });
    lg.appendChild(b);
  });
}
function applyFilter(){
  nodes.forEach(function(n){n._g.style.display=hidden[n.group]?'none':''});
  gEdges.querySelectorAll('.edge').forEach(function(p){
    var a=byId[p.getAttribute('data-a')],b=byId[p.getAttribute('data-b')];
    p.style.display=(a&&hidden[a.group])||(b&&hidden[b.group])?'none':'';
  });
  if(pinned&&hidden[(byId[pinned]||{}).group]){pinned=null;unlight();hideCard()}
}

/* ---------- пан/зум ---------- */
function apply(){
  document.getElementById('root').setAttribute('transform','translate('+view.x+','+view.y+') scale('+view.k+')');
  if(card.classList.contains('on')){var id=pinned||hoverId;if(id&&byId[id])position(byId[id])}
}
function fit(animate){
  var pad=80;
  var minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  nodes.forEach(function(n){minx=Math.min(minx,n.x);maxx=Math.max(maxx,n.x);miny=Math.min(miny,n.y);maxy=Math.max(maxy,n.y)});
  var bw=maxx-minx+pad*2,bh=maxy-miny+pad*2;
  var r=svg.getBoundingClientRect();
  var sx=r.width/bw*(W/r.width),sy=r.height/bh*(H/r.height);
  var k=Math.min(sx,sy,1.6)*0.92;
  view.k=k;
  view.x=(W-(minx+maxx)*k)/2;
  view.y=(H-(miny+maxy)*k)/2 + 52;
  apply();
}
function panzoom(){
  var drag=null;
  svg.addEventListener('pointerdown',function(e){
    if(e.target.closest('.node'))return;
    drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
    svg.classList.add('dragging');svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove',function(e){
    if(!drag)return;
    var r=svg.getBoundingClientRect();var s=W/r.width;
    view.x=drag.vx+(e.clientX-drag.x)*s; view.y=drag.vy+(e.clientY-drag.y)*s; apply();
  });
  function end(e){if(drag){drag=null;svg.classList.remove('dragging')}}
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
  svg.addEventListener('wheel',function(e){
    e.preventDefault();
    var r=svg.getBoundingClientRect();
    var mx=(e.clientX-r.left)*(W/r.width),my=(e.clientY-r.top)*(H/r.height);
    var k2=Math.max(.45,Math.min(3.2,view.k*(e.deltaY<0?1.13:0.885)));
    view.x=mx-(mx-view.x)*(k2/view.k); view.y=my-(my-view.y)*(k2/view.k); view.k=k2; apply();
  },{passive:false});
  // тач-пинч
  var pts={},pd=0;
  svg.addEventListener('touchstart',function(e){if(e.touches.length===2){pd=tdist(e)}},{passive:true});
  svg.addEventListener('touchmove',function(e){
    if(e.touches.length===2){
      e.preventDefault();
      var d=tdist(e);var k2=Math.max(.45,Math.min(3.2,view.k*(d/pd)));pd=d;
      var r=svg.getBoundingClientRect();
      var cx=((e.touches[0].clientX+e.touches[1].clientX)/2-r.left)*(W/r.width);
      var cy=((e.touches[0].clientY+e.touches[1].clientY)/2-r.top)*(H/r.height);
      view.x=cx-(cx-view.x)*(k2/view.k);view.y=cy-(cy-view.y)*(k2/view.k);view.k=k2;apply();
    }
  },{passive:false});
  function tdist(e){var a=e.touches[0],b=e.touches[1];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
  document.getElementById('zin').addEventListener('click',function(){zoomTo(view.k*1.3)});
  document.getElementById('zout').addEventListener('click',function(){zoomTo(view.k/1.3)});
  document.getElementById('zfit').addEventListener('click',function(){fit()});
  function zoomTo(k2){
    k2=Math.max(.45,Math.min(3.2,k2));
    var cx=W/2,cy=H/2;
    view.x=cx-(cx-view.x)*(k2/view.k);view.y=cy-(cy-view.y)*(k2/view.k);view.k=k2;apply();
  }
  addEventListener('resize',function(){fit()});
}
})();
</script>
