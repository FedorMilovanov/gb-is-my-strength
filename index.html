כָּאַиָּלוֹת",translit:"Ka-ayalot",grammar:"Предлог כ (как) + существительное ж.р. мн.ч.",meaning:"как у ланей (быстрых оленей)"},וְעַל:{word:"וְעַל",translit:"Ve-al",grammar:"Союз ו (и) + предлог עַל (на, над)",meaning:"и на, и над"},בָּמוֹתַי:{word:"בָּמוֹתַי",translit:"Bamotay",grammar:"Существительное ж.р. мн.ч. с суффиксом 1 л. ед.ч.",meaning:"высоты мои, возвышенности мои"},יַדְרִכֵנִי:{word:"יַדְרִכֵנִי",translit:"Yadricheni",grammar:"Глагол, Hiphil (каузатив), имперфект, 3 л. ед.ч. м.р. с суффиксом 1 л. ед.ч.",meaning:"возведет меня, направит стопы мои"}},Mf=[{id:"hermeneutics",title:"Герменевтическая оценка христоцентричной герменевтики",category:"Переводы",author:"Абнер Чау",editor:"Фёдор Милованов",time:35,tag:"Герменевтика",kicker:"Перевод с английского",abstract:"Грамматико-исторический метод оправдан Писанием и более чем достаточен для раскрытия славы Христа — без обходных путей христоцентризма.",cover:"https://picsum.photos/id/1015/1200/630",content:[{id:"h2-intro",type:"h2",text:"1. Введение в проблему христоцентризма"},{type:"p",text:"В последнее время среди евангельских богословов набрало силу движение, утверждающее, что любой текст Ветхого Завета должен толковаться исключительно через призму личности и служения Иисуса Христа. Этот подход, известный как «христоцентричная герменевтика», противопоставляет себя традиционному грамматико-историческому методу."},{type:"blockquote",text:"«Если вы не видите Христа в каждом стихе Левита или Книги Судей, вы читаете Библию неправильно» — таково кредо этого направления."},{type:"p",text:"Однако Абнер Чау убедительно доказывает, что подобный подход, несмотря на благочестивые намерения его авторов, таит в себе серьезные опасности для библейского авторитета. Навязывание новозаветного богословия ветхозаветным текстам лишает их собственного исторического контекста и первоначального значения, задуманного Богом через человеческих авторов."},{id:"h2-method",type:"h2",text:"2. Грамматико-исторический метод и его полнота"},{type:"p",text:"Защитники грамматико-исторического толкования не отрицают, что всё Писание в конечном итоге свидетельствует о Христе. Различие кроется в методологии. Христоцентристы склонны находить аллегорические или типологические связи там, где оригинальный автор их не предполагал. Традиционный же метод ищет Христа там, куда указывает сам библейский текст посредством своего исторического, грамматического и литературного контекста."}],footnotes:['Abner Chou, "The Hermeneutical Assessment of Christocentric Hermeneutics," MSJ, 2018.',"См. подробнее: Чикагское заявление о безошибочности Писания, статья XV."]},{id:"heart",title:"Крайне ли испорчено моё сердце — если я уже верующий?",category:"Статьи",author:"Фёдор Милованов",editor:"Фёдор Милованов",time:32,tag:"Экзегеза",kicker:"Авторская статья",abstract:"Разбор Иеремии 17:9–10: что значит «сердце обманчиво более всего» — и относится ли это к верующему? Экзегеза, богословский синтез и пастырское применение.",cover:"https://picsum.photos/id/1016/1200/630",content:[{id:"h2-context",type:"h2",text:"1. Исторический и пророческий контекст"},{type:"p",text:"Стихи об обманчивости человеческого сердца часто цитируются в отрыве от исторического контекста. Иеремия пишет в преддверии вавилонского пленения, когда Иудея уповала на союзы с Египтом и внешние ритуалы, вместо того чтобы искренне обратиться к Яхве."},{type:"blockquote",text:"«Лукаво сердце человеческое более всего и крайне испорчено; кто узнает его?» (Иер. 17:9)"},{id:"h2-theology",type:"h2",text:"2. Новое сердце и продолжающееся освящение"},{type:"p",text:"Новый Завет говорит о верующих как о людях с «новым сердцем» (Иез. 36:26) and «новым творением» во Христе. Означает ли это, что верующий больше не подвержен лукавству собственного сердца? Ответ кроется в понимании одновременного состояния оправдания и продолжающегося освящения (simul iustus et peccator)."}],footnotes:["Мартин Лютер часто использовал эту латинскую формулу для описания двойственной природы верующего."]},{id:"davinci",title:"«Код да Винчи»: блестящий триллер или историческая подмена?",category:"Апологетика",author:"Фёдор Милованов",editor:"Фёдор Милованов",time:17,tag:"Апологетика",kicker:"Разбор заблуждений",abstract:"Мария Магдалина, Никея, канон Нового Завета, Свитки Мёртвого моря, Наг-Хаммади, Приорат Сиона — полный разбор с позиций Писания и исторической науки.",cover:"https://picsum.photos/id/1018/1200/630",content:[{id:"h2-nicea",type:"h2",text:"1. Никейский собор и Божественность Христа"},{type:"p",text:"Дэн Браун утверждает, что божественность Христа была утверждена лишь в IV веке на Никейском соборе «минимальным большинством голосов». Исторические свидетельства говорят об обратном: решение было принято практически единогласно (316 против 2 голосов), а божественность Христа исповедовалась Церковью с самого её зарождения."}],footnotes:['См. Евсевий Кесарийский, "Церковная история", описание Никейского собора.']}],ce=[{id:1,question:"Какая основная опасность кроется в христоцентричной герменевтике согласно Абнеру Чау?",options:["Она отрицает божественность Христа","Она навязывает новозаветное богословие ветхозаветным текстам, лишая их исторического контекста","Она признает авторитет только Нового Завета","Она пропагандирует только исторический критицизм"],correctIndex:1,explanation:"Навязывание новозаветного контекста ветхозаветным писаниям часто игнорирует изначальное намерение автора (sensus literalis), заменяя грамматико-исторический метод аллегорическим прочтением.",category:"Герменевтика"},{id:2,question:"К какому историческому периоду относится пророчество Иеремии об обманчивости сердца (Иер. 17:9)?",options:["Царствование Давида","Период непосредственно перед вавилонским пленением Иудеи","Эпоха после возвращения из Египта","Период восстановления Иерусалима при Неемии"],correctIndex:1,explanation:"Иеремия писал в кризисный период Иудейского царства, обличая народ за упование на плоть и союзы с Египтом перед лицом вавилонской угрозы.",category:"Экзегеза"},{id:3,question:"Как было принято решение о божественности Христа на Никейском соборе?",options:["Минимальным большинством (51% голосов)","Практически единогласно (316 против 2 голосов)","Решением императора Константина без голосования","Жеребьевкой среди участников собора"],correctIndex:1,explanation:"Исторические документы опровергают миф Дэна Брауна: решение о признании Христа единосущным Отцу было поддержано подавляющим большинством отцов собора.",category:"Апологетика"},{id:4,question:"Что означает термин «simul iustus et peccator» в контексте богословия Реформации?",options:["Человек одновременно свят и грешник","Только праведные могут быть спасены","Грех полностью уничтожается при обращении","Спасение достигается только добрыми делами"],correctIndex:0,explanation:"Это классическая формула Мартина Лютера, описывающая парадокс христианской жизни: человек одновременно оправдан (iustus) и всё ещё грешник (peccator) до окончательного прославления.",category:"Богословие"}];function ih(){const[D,xt]=tt.useState(!1),[K,y]=tt.useState(!1),[X,J]=tt.useState(!1),[ht,qt]=tt.useState(""),[T,N]=tt.useState(null),[P,H]=tt.useState(2),[vt,kt]=tt.useState(0),[pt,Ht]=tt.useState({}),[It,Gt]=tt.useState(null),[Pt,Et]=tt.useState([]),[At,tl]=tt.useState(null),[Xt,V]=tt.useState(null),[wt,Mt]=tt.useState(!1),[ll,ml]=tt.useState(0),[Wt,Ul]=tt.useState(null),[ul,el]=tt.useState(!1),[S,E]=tt.useState(0),[q,nt]=tt.useState(!1),[ct,o]=tt.useState(!1),[z,A]=tt.useState(""),[O,Y]=tt.useState([]),[L,lt]=tt.useState(""),[_t,yt]=tt.useState(!1),[Re,fe]=tt.useState(null),[Va,Ka]=tt.useState(0),[ql,ea]=tt.useState(0),qe=[14,16,17,19,21],ni=tt.useRef(null),aa=tt.useRef(null);tt.useEffect(()=>{const g=localStorage.getItem("theme"),M=window.matchMedia("(prefers-color-scheme: dark)").matches,B=g==="dark"||!g&&M;xt(B),B?document.documentElement.classList.add("dark"):document.documentElement.classList.remove("dark");const W={};try{for(let ut=0;ut<localStorage.length;ut++){const al=localS
