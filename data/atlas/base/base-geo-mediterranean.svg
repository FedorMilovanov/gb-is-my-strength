<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1430" aria-label="Базовая карта Средиземноморья: семейство mediterranean">
<!--
  base-geo-mediterranean.svg — подложка семейства mediterranean (KA-6 первый заход, Ф2-Ц2).
  Сетка: x = 40 + (lon − 10)·65 ;  y = 120 + (43 − lat)·82  (1 ед. ≈ 1,37 км по широте).
  Дефы (landG, seaG, seaPattern, desertG, fertileG, mountainHatch, mtG…) — У ПОТРЕБИТЕЛЯ
  (инлайн-дефы сборки/страницы), как и у base-geo.svg Леванта: «краски у потребителя».
  Контуры побережий — художественная развёртка по опорным точкам сетки (не строгая проекция).
-->
