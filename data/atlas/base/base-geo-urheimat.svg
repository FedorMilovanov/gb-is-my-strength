<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1430" aria-label="Базовая карта мира Бытия 1–11: Армянское нагорье и Междуречье">
<!--
  base-geo-urheimat.svg — подложка листа-пролога «Начало» (Быт 1–11).
  Сетка: x = 40 + (lon − 38)·130 ;  y = 60 + (40 − lat)·130  (1 ед. ≈ 0,85 км).
  Покрытие: Армянское нагорье (Арарат) → Междуречье → Персидский залив.
  Дефы (landG, seaG, seaPattern, mountainHatch, desertG, fertileG…) — у потребителя.
  Позиция листа (§2-бис): постпотопный мир; допотопная география глобальным
  потопом переформатирована — реконструкции Эдема принципиально версионны.
-->
<rect x="0" y="0" width="1900" height="1430" fill="url(#landG)"/>
<rect x="0" y="0" width="1900" height="1430" fill="url(#desertG)" opacity=".5"/>

<!-- ═══ Персидский залив (юго-восток) ═══ -->
<path fill="url(#seaG)" stroke="#2e4d6b" stroke-width="1.4" stroke-linejoin="round" d="
M1220,1290
C1260,1266 1305,1252 1350,1246
C1420,1238 1490,1244 1550,1270
C1620,1300 1690,1330 1750,1372
C1800,1408 1850,1424 1900,1430
L1220,1430
Z"/>
<path fill="url(#seaPattern)" opacity=".35" d="
M1220,1290 C1260,1266 1305,1252 1350,1246 C1420,1238 1490,1244 1550,1270
C1620,1300 1690,1330 1750,1372 C1800,1408 1850,1424 1900,1430 L1220,1430 Z"/>

<!-- ═══ Озёра нагорья: Ван и Урмия ═══ -->
<path fill="url(#seaG)" stroke="#2e4d6b" stroke-width="1.1" d="
M540,290 C570,272 610,268 645,280 C670,290 680,312 668,334 C650,362 610,370 572,358 C536,346 520,315 540,290 Z"/>
<path fill="url(#seaG)" stroke="#2e4d6b" stroke-width="1.1" d="
M910,330 C940,318 972,322 992,344 C1010,364 1006,398 986,424 C962,454 924,458 898,436 C870,412 878,352 910,330 Z"/>

<!-- ═══ Каспий (северо-восточный угол, краем) ═══ -->
<path fill="url(#seaG)" stroke="#2e4d6b" stroke-width="1.2" d="
M1610,60 C1650,120 1680,190 1690,270 C1698,340 1690,410 1668,470 C1700,470 1800,470 1900,470 L1900,60 Z"/>

<!-- ═══ Реки ═══ -->
<g fill="none" stroke="#2d4a66" stroke-width="2.4">
  <!-- Евфрат: истоки нагорья → большая дуга на запад → юго-восток к заливу -->
  <path d="M560,240 C520,300 470,360 440,430 C405,510 390,590 415,660 C445,742 520,800 610,850 C700,900 790,952 855,1010 C920,1068 985,1130 1060,1180 C1120,1220 1180,1252 1240,1276" stroke-width="3"/>
  <!-- Тигр: исток восточнее → прямее на юго-восток -->
  <path d="M660,300 C680,370 700,440 730,510 C765,592 810,668 860,740 C915,818 975,890 1030,960 C1085,1030 1140,1105 1195,1170 C1225,1206 1258,1240 1290,1264" stroke-width="2.6"/>
  <!-- Большой Заб (приток Тигра у Ниневии/Калаха) -->
  <path d="M880,470 C860,510 840,545 820,580 C800,612 780,640 762,664" stroke-width="1.6"/>
  <!-- слияние: Шатт-эль-Араб -->
  <path d="M1240,1276 C1258,1282 1275,1280 1290,1264 C1282,1292 1262,1300 1240,1276" stroke-width="2"/>
</g>

<!-- ═══ Горы: Арарат и цепи нагорья, Загрос ═══ -->
<g>
  <!-- Большой Арарат -->
  <path d="M810,182 L850,108 L890,182 Z" fill="url(#mtG)" stroke="#8b7d5a" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M838,130 L850,108 L862,130 L850,138 Z" fill="#f6f1e7" stroke="#8b7d5a" stroke-width=".8"/>
  <!-- Малый Арарат -->
  <path d="M900,182 L925,132 L950,182 Z" fill="url(#mtG)" stroke="#8b7d5a" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- цепи Армянского нагорья -->
  <ellipse cx="600" cy="200" rx="200" ry="34" fill="url(#mountainHatch)" transform="rotate(-8 600 200)"/>
  <ellipse cx="1000" cy="230" rx="170" ry="30" fill="url(#mountainHatch)" transform="rotate(6 1000 230)"/>
  <!-- Загрос (юго-восточная дуга) -->
  <ellipse cx="1150" cy="700" rx="80" ry="300" fill="url(#mountainHatch)" transform="rotate(38 1150 700)"/>
  <ellipse cx="1360" cy="1000" rx="70" ry="260" fill="url(#mountainHatch)" transform="rotate(42 1360 1000)"/>
  <!-- Синджар/степи северного Междуречья -->
  <ellipse cx="620" cy="520" rx="120" ry="20" fill="url(#mountainHatch)" opacity=".6" transform="rotate(-4 620 520)"/>
</g>

<!-- ═══ Плодородная пойма Междуречья ═══ -->
<ellipse cx="1000" cy="1050" rx="330" ry="200" fill="url(#fertileG)" transform="rotate(35 1000 1050)"/>
<ellipse cx="760" cy="700" rx="220" ry="130" fill="url(#fertileG)" opacity=".6" transform="rotate(38 760 700)"/>
<ellipse cx="420" cy="1150" rx="300" ry="180" fill="url(#desertStipple)" opacity=".55"/>
<ellipse cx="1550" cy="800" rx="240" ry="200" fill="url(#desertStipple)" opacity=".45"/>

<!-- ═══ Ярлыки вод и земель ═══ -->
<g font-family="Georgia, 'Times New Roman', serif" fill="#4a80a0" text-anchor="middle" letter-spacing=".3em" opacity=".85">
  <text class="sea-label" x="1600" y="1370" font-size="22" transform="rotate(14 1600 1370)">ПЕРСИДСКИЙ&#160;ЗАЛИВ</text>
  <text class="sea-label" x="600" y="322" font-size="11" letter-spacing=".18em" opacity=".75">ОЗ.&#160;ВАН</text>
  <text class="sea-label" x="945" y="390" font-size="11" letter-spacing=".18em" opacity=".75">ОЗ.&#160;УРМИЯ</text>
  <text class="sea-label" x="1780" y="240" font-size="13" transform="rotate(78 1780 240)" opacity=".7">КАСПИЙСКОЕ&#160;МОРЕ</text>
  <text class="sea-label" x="620" y="640" font-size="13" transform="rotate(48 620 640)" opacity=".8">ЕВФРАТ · פְּרָת</text>
  <text class="sea-label" x="930" y="800" font-size="13" transform="rotate(52 930 800)" opacity=".8">ТИГР · חִדֶּקֶל</text>
</g>
<g font-family="Georgia, 'Times New Roman', serif" fill="#8b7d5a" text-anchor="middle" letter-spacing=".3em" opacity=".8">
  <text class="region-label" x="760" y="70" font-size="15">АРМЯНСКОЕ&#160;НАГОРЬЕ · АРАРАТ</text>
  <text class="region-label" x="500" y="470" font-size="13" opacity=".75">АРАМ-НАХАРАИМ</text>
  <text class="region-label" x="820" y="640" font-size="14" transform="rotate(36 820 640)">МЕЖДУРЕЧЬЕ</text>
  <text class="region-label" x="1010" y="1105" font-size="15" transform="rotate(33 1010 1105)">ШИНАР · שִׁנְעָר</text>
  <text class="region-label" x="1420" y="640" font-size="13" transform="rotate(40 1420 640)" opacity=".7">ЗАГРОС · ЭЛАМ</text>
  <text class="region-label" x="380" y="1120" font-size="13" opacity=".7">АРАВИЙСКАЯ&#160;СТЕПЬ</text>
</g>
</svg>
