<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Озвучка статьи — Господь Бог — Сила Моя">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#241d16"/>
      <stop offset="55%" stop-color="#171411"/>
      <stop offset="100%" stop-color="#0d0b09"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c883"/>
      <stop offset="50%" stop-color="#c9a45c"/>
      <stop offset="100%" stop-color="#9a7a3e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c883" stop-opacity=".28"/>
      <stop offset="60%" stop-color="#c9a45c" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#c9a45c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- мягкое свечение за кнопкой -->
  <circle cx="256" cy="238" r="190" fill="url(#glow)"/>

  <!-- фирменные тонкие контуры PLAY: внешний след + активное кольцо -->
  <circle cx="256" cy="238" r="132" fill="none" stroke="#c9a45c" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="256" cy="238" r="118" fill="none" stroke="url(#gold)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="580 162" transform="rotate(-90 256 238)"/>

  <!-- треугольник воспроизведения -->
  <path d="M225 187 L316 238 L225 289 Z" fill="url(#gold)"/>

  <!-- лучи-акценты по углам кольца -->
  <g stroke="#c9a45c" stroke-opacity=".45" stroke-width="2" stroke-linecap="round">
    <line x1="256" y1="82"  x2="256" y2="64"/>
    <line x1="256" y1="394" x2="256" y2="412"/>
    <line x1="100" y1="238" x2="82"  y2="238"/>
    <line x1="412" y1="238" x2="430" y2="238"/>
  </g>

  <!-- разделительная линия и словомарка -->
  <line x1="146" y1="432" x2="366" y2="432" stroke="#c9a45c" stroke-opacity=".35" stroke-width="1.5"/>
  <text x="256" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="21" letter-spacing="4.5" fill="#e6ddcf">ГОСПОДЬ БОГ — СИЛА МОЯ</text>
  <text x="256" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13" letter-spacing="6" fill="#c9a45c" fill-opacity=".75">ОЗВУЧКА СТАТЬИ</text>
</svg>
