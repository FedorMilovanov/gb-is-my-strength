<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Тайны человеческого сердца · Пролог — Что Библия называет сердцем">
  <defs>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a1a1c"/>
      <stop offset="0.5" stop-color="#331113"/>
      <stop offset="1" stop-color="#1c090a"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="22%" r="60%">
      <stop offset="0" stop-color="#e6c483" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#e6c483" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vign" cx="50%" cy="48%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d59a"/>
      <stop offset="1" stop-color="#bd9350"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#leather)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g stroke="#000000" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 120 H1200 M0 250 H1200 M0 380 H1200 M0 510 H1200"/>
  </g>

  <g opacity="0.13" transform="translate(830 118) scale(3.05)">
    <path d="M50 88 C 12 60, 0 40, 0 24 C 0 8, 14 0, 28 0 C 40 0, 47 8, 50 16 C 53 8, 60 0, 72 0 C 86 0, 100 8, 100 24 C 100 40, 88 60, 50 88 Z" fill="url(#gold)"/>
    <path d="M50 79 C 18 55, 8 38, 8 24 C 8 13, 17 7, 27 7 C 38 7, 45 15, 50 24 C 55 15, 62 7, 73 7 C 83 7, 92 13, 92 24 C 92 38, 82 55, 50 79 Z" fill="none" stroke="#2a0d0e" stroke-opacity="0.5" stroke-width="1.4"/>
  </g>

  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="url(#gold)" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="52" y="52" width="1096" height="526" fill="none" stroke="url(#gold)" stroke-opacity="0.28" stroke-width="1"/>

  <text x="90" y="128" fill="#e6c483" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="7">ТАЙНЫ ЧЕЛОВЕЧЕСКОГО СЕРДЦА</text>
  <rect x="92" y="150" width="132" height="3" fill="url(#gold)"/>
  <text x="90" y="214" fill="#e6c483" font-family="Georgia, serif" font-size="30" font-style="italic" letter-spacing="2" opacity="0.92">Пролог</text>

  <text x="86" y="352" fill="#fbf3e4" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700">Что Библия</text>
  <text x="86" y="464" fill="#fbf3e4" font-family="Georgia, 'Times New Roman', serif" font-size="112" font-weight="700">называет сердцем</text>

  <text x="90" y="548" fill="#f4e6cc" font-family="Georgia, serif" font-size="34" opacity="0.82">Полный библейский портрет внутреннего человека</text>

  <rect width="1200" height="630" fill="url(#vign)"/>
</svg>
