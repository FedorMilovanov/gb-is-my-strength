<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="rb09-title rb09-desc">
  <title id="rb09-title">Подпольная печать ЕХБ: память, выпуск и распространение</title>
  <desc id="rb09-desc">Редакционная схема показывает поток от сообщений и бюллетеней через издательство и подпольную печать к общинам, семьям и читателям, а затем обратный поток сведений о преследованиях. Сплошные стрелки обозначают подтвержденные функции сети, пунктирные — редакционную связь между типами деятельности.</desc>
  <style>
    :root{color-scheme:light dark}
    .bg{fill:#f7f4ed}.panel{fill:#fffdf8;stroke:#c8b993;stroke-width:1.5}.node{fill:#ffffff;stroke:#947a43;stroke-width:1.5}.node2{fill:#f1ead8;stroke:#947a43;stroke-width:1.5}.ink{fill:#22201c}.muted{fill:#635f55}.accent{fill:#7d642d}.line{stroke:#7d642d;stroke-width:2.5;fill:none}.dash{stroke:#8c877c;stroke-width:2;stroke-dasharray:7 6;fill:none}.small{font:500 13px system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:600 15px system-ui,-apple-system,"Segoe UI",sans-serif}.head{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif}.year{font:700 13px system-ui,-apple-system,"Segoe UI",sans-serif}
    @media (prefers-color-scheme:dark){.bg{fill:#171612}.panel{fill:#201f1a;stroke:#6f6245}.node{fill:#26241e;stroke:#a58b50}.node2{fill:#332d20;stroke:#a58b50}.ink{fill:#f3efe5}.muted{fill:#c7c0b0}.accent{fill:#d0ad62}.line{stroke:#d0ad62}.dash{stroke:#a8a193}}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" class="accent"/></marker>
  </defs>
  <rect class="bg" width="760" height="500" rx="24"/>
  <rect class="panel" x="18" y="18" width="724" height="464" rx="20"/>
  <text class="head ink" x="42" y="57">Подпольная печать: память → выпуск → распространение</text>
  <text class="small muted" x="42" y="82">Редакционная схема по проверенной библиографии и первичным выпускам</text>

  <rect class="node2" x="42" y="112" width="190" height="82" rx="14"/>
  <text class="year accent" x="58" y="137">1964 → 1971</text>
  <text class="body ink" x="58" y="160">Сведения о гонениях</text>
  <text class="small muted" x="58" y="181">сообщения → Бюллетень</text>

  <rect class="node" x="285" y="112" width="190" height="82" rx="14"/>
  <text class="year accent" x="301" y="137">1971</text>
  <text class="body ink" x="301" y="160">Издательство «Христианин»</text>
  <text class="small muted" x="301" y="181">церковная издательская сеть</text>

  <rect class="node" x="528" y="112" width="190" height="82" rx="14"/>
  <text class="year accent" x="544" y="137">1970-е → 1980-е</text>
  <text class="body ink" x="544" y="160">Печать и размножение</text>
  <text class="small muted" x="544" y="181">гектограф → ротатор → офсет</text>

  <path class="line" d="M232 153H278" marker-end="url(#arrow)"/>
  <path class="line" d="M475 153H521" marker-end="url(#arrow)"/>

  <rect class="node" x="164" y="250" width="190" height="86" rx="14"/>
  <text class="body ink" x="180" y="278">Журналы и книги</text>
  <text class="small muted" x="180" y="301">«Вестник спасения» /</text>
  <text class="small muted" x="180" y="321">«Вестник истины», Писание</text>

  <rect class="node2" x="406" y="250" width="190" height="86" rx="14"/>
  <text class="body ink" x="422" y="278">Общины и семьи</text>
  <text class="small muted" x="422" y="301">чтение, передача, помощь</text>
  <text class="small muted" x="422" y="321">и новые свидетельства</text>

  <path class="line" d="M623 194C623 224 563 232 544 250" marker-end="url(#arrow)"/>
  <path class="line" d="M406 293H361" marker-end="url(#arrow)"/>
  <path class="dash" d="M205 250C124 232 112 194 137 194" marker-end="url(#arrow)"/>

  <rect class="node" x="42" y="382" width="676" height="66" rx="14"/>
  <text class="year accent" x="58" y="405">1977 · Ивангород</text>
  <text class="small ink" x="58" y="428">Бюллетень №44 подтверждает сотрудников «Христианина»; точный PDF и SHA256 проверены.</text>

  <circle cx="58" cy="466" r="4" class="accent"/>
  <text class="small muted" x="70" y="471">Сплошная стрелка — подтверждённая функция сети; пунктир — редакционная связка, не отдельный архивный факт.</text>
</svg>