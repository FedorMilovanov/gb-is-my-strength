<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="rb10-title rb10-desc">
  <title id="rb10-title">Матрица типов источников и границ уверенности</title>
  <desc id="rb10-desc">Редакционная схема показывает пять читательских типов свидетельств: первичный документ, официальный документ или публикация, академическая реконструкция, память участника и открытый или спорный вопрос. Схема напоминает, что сила формулировки не должна превышать силу источника, а внутренние буквенные статусы не являются шкалой истины.</desc>
  <style>
    .bg{fill:#f7f4ed}.panel{fill:#fffdf8;stroke:#c8b993;stroke-width:1.5}.card{fill:#fff;stroke:#9a8456;stroke-width:1.4}.open{fill:#f3ead8;stroke:#9a8456;stroke-width:1.4}.ink{fill:#22201c}.muted{fill:#635f55}.accent{fill:#7d642d}.head{font:700 22px system-ui,-apple-system,"Segoe UI",sans-serif}.label{font:700 14px system-ui,-apple-system,"Segoe UI",sans-serif}.body{font:500 12.5px system-ui,-apple-system,"Segoe UI",sans-serif}.rule{stroke:#9a8456;stroke-width:2.2;fill:none}.dash{stroke:#9a8456;stroke-width:1.8;stroke-dasharray:6 5;fill:none}
    @media (prefers-color-scheme:dark){.bg{fill:#171612}.panel{fill:#201f1a;stroke:#6f6245}.card{fill:#27241e;stroke:#aa925a}.open{fill:#342d20;stroke:#aa925a}.ink{fill:#f3efe5}.muted{fill:#c7c0b0}.accent{fill:#d0ad62}.rule,.dash{stroke:#d0ad62}}
  </style>
  <defs><marker id="rb10-arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0l10 5-10 5z" class="accent"/></marker></defs>
  <rect class="bg" width="760" height="500" rx="24"/>
  <rect class="panel" x="18" y="18" width="724" height="464" rx="20"/>
  <text class="head ink" x="42" y="57">Как сила источника ограничивает силу формулировки</text>
  <text class="body muted" x="42" y="80">Тип свидетельства важнее внутренней буквенной метки. Проверяемость должна оставаться видимой.</text>

  <rect class="card" x="42" y="112" width="206" height="86" rx="14"/>
  <text class="label ink" x="58" y="138">Первичный документ</text>
  <text class="body muted" x="58" y="160">закон · письмо · протокол</text>
  <text class="body muted" x="58" y="179">журнал эпохи · проверенный скан</text>

  <rect class="card" x="277" y="112" width="206" height="86" rx="14"/>
  <text class="label ink" x="293" y="138">Официальная публикация</text>
  <text class="body muted" x="293" y="160">позиция церкви, союза,</text>
  <text class="body muted" x="293" y="179">государства, суда или архива</text>

  <rect class="card" x="512" y="112" width="206" height="86" rx="14"/>
  <text class="label ink" x="528" y="138">Академическая реконструкция</text>
  <text class="body muted" x="528" y="160">сопоставляет документы</text>
  <text class="body muted" x="528" y="179">и отделяет вывод от свидетельства</text>

  <path class="rule" d="M145 207V235H380" marker-end="url(#rb10-arrow)"/>
  <path class="rule" d="M380 207V235"/>
  <path class="rule" d="M615 207V235H390"/>

  <rect class="card" x="107" y="258" width="250" height="90" rx="14"/>
  <text class="label ink" x="123" y="285">Память участника</text>
  <text class="body muted" x="123" y="307">незаменима для внутренней логики,</text>
  <text class="body muted" x="123" y="327">но даты и причинность требуют сверки</text>

  <rect class="open" x="403" y="258" width="250" height="90" rx="14"/>
  <text class="label ink" x="419" y="285">Открытый / спорный вопрос</text>
  <text class="body muted" x="419" y="307">документ неполон, локатор не проверен</text>
  <text class="body muted" x="419" y="327">или свидетельства расходятся</text>

  <path class="dash" d="M357 303H396" marker-end="url(#rb10-arrow)"/>

  <rect class="open" x="76" y="388" width="608" height="60" rx="14"/>
  <text class="label accent" x="94" y="412">Редакционное правило</text>
  <text class="body ink" x="94" y="434">Не усиливать утверждение выше источника; границу знания называть прямо.</text>

  <text class="body muted" x="42" y="471">Внутренние A/B/C/D помогают редакции организовать проверку, но не являются публичной шкалой «истинности».</text>
</svg>