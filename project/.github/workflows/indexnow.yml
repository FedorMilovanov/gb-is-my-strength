name: IndexNow — Уведомление поисковиков

on:
  push:
    branches:
      - main
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'feed.xml'

jobs:
  indexnow:
    name: Отправить изменённые страницы в Яндекс и Bing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Построить payload и отправить в поисковики
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          python3 << 'PYEOF'
          import subprocess, json, urllib.request, urllib.error, os, sys

          key = os.environ.get('INDEXNOW_KEY', '')
          if not key:
              print('::error::Секрет INDEXNOW_KEY не задан. Добавьте его в Settings -> Secrets -> Actions')
              sys.exit(1)

          # Получить изменённые HTML-файлы. HEAD~1 может не существовать при первом push.
          try:
              result = subprocess.run(
                  ['git', 'diff', '--name-only', 'HEAD~1', 'HEAD', '--', '*.html'],
                  capture_output=True, text=True, check=True
              )
              changed = result.stdout.strip().splitlines()
          except subprocess.CalledProcessError:
              print('HEAD~1 не существует (первый push). Fallback на sitemap.xml.')
              changed = []

          EXCLUDE = {
              '404.html', 'google7e02f9855e02b89a.html',
              'yandex_d8876d66da1b4592.html', 'yandex_42bc0d54a1ca4952.html'
          }

          urls = []
          seen = set()
          for path in changed:
              fname = os.path.basename(path)
              if fname in EXCLUDE:
                  continue
              url_path = path.replace('index.html', '').lstrip('./')
              url = 'https://gospod-bog.ru/' + url_path
              if url not in seen:
                  urls.append(url)
                  seen.add(url)

          # Fallback: читаем sitemap если нет изменённых файлов
          if not urls:
              print('Нет изменённых HTML или первый push — читаем sitemap.xml')
              import xml.etree.ElementTree as ET
              try:
                  tree = ET.parse('sitemap.xml')
                  ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
                  urls = [loc.text for loc in tree.findall('.//sm:loc', ns)]
              except Exception as e:
                  print(f'Ошибка чтения sitemap: {e}')
                  sys.exit(0)

          if not urls:
              print('Нет URL для отправки. Пропускаем.')
              sys.exit(0)

          print(f'Отправляем {len(urls)} URL:')
          for u in urls:
              print(f'  {u}')

          payload = {
              'host': 'gospod-bog.ru',
              'key': key,
              'keyLocation': f'https://gospod-bog.ru/{key}.txt',
              'urlList': urls
          }
          body = json.dumps(payload, ensure_ascii=False).encode('utf-8')

          endpoints = [
              ('Yandex', 'https://yandex.com/indexnow'),
              ('Bing',   'https://api.indexnow.org/indexnow'),
          ]

          exit_code = 0
          for name, url in endpoints:
              req = urllib.request.Request(
                  url, data=body,
                  headers={'Content-Type': 'application/json; charset=utf-8'},
                  method='POST'
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      print(f'{name}: HTTP {resp.getcode()} OK')
              except urllib.error.HTTPError as e:
                  detail = e.read().decode('utf-8', errors='replace')[:200]
                  print(f'{name}: HTTP {e.code} — {detail}')
                  if e.code not in (200, 202):
                      exit_code = 1
              except Exception as e:
                  print(f'{name}: error — {e}')
                  exit_code = 1

          sys.exit(exit_code)
          PYEOF
