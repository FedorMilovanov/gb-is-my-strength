name: Work item
description: Bounded product, content, route or system result
title: "[Task]: "
labels: ["triage"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Required outcome
      description: What must be true when this lane is complete?
      placeholder: Describe one verifiable result.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Risk mode
      options:
        - FAST
        - LANE
        - SYSTEM
        - Unknown — classify before mutation
    validations:
      required: true

  - type: textarea
    id: lane
    attributes:
      label: Lane, owner and scope
      description: Use one independently mergeable lane. Include only overlap information that is known now.
      placeholder: |
        Owner or unassigned:
        Routes/files/surfaces:
        Related active PRs or overlap:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Optional at intake; complete before merge.
      placeholder: |
        Source of truth:
        Relevant checks:
        Production evidence needed: yes/no
    validations:
      required: false

  - type: checkboxes
    id: safety
    attributes:
      label: Ownership safety
      options:
        - label: I will not modify another owner’s active branch; overlap will be resolved before mutation.
          required: true
