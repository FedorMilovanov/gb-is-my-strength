name: One-shot global Actions pin transfer v2

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/actions-global-pin-transfer-v2.yml"
      - "scripts/actions-global-pin-transfer-v2.py"

concurrency:
  group: actions-global-pin-transfer-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  transfer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact same-repository PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Generate immutable pins and permanent guard
        run: python3 scripts/actions-global-pin-transfer-v2.py

      - name: Remove disposable transfer infrastructure
        run: |
          rm .github/workflows/actions-global-pin-transfer-v2.yml
          rm scripts/actions-global-pin-transfer-v2.py
          rm -rf reports/actions-global-pin-transfer

      - name: Verify generated scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=ACDMRTUXB"],
              text=True,
          ).splitlines()
          allowed_exact = {
              "package.json",
              "scripts/github-actions-global-pin-contract-test.mjs",
              "docs/dependency-migrations/GITHUB_ACTIONS_GLOBAL_PINS.md",
              ".github/workflows/actions-global-pin-transfer-v2.yml",
              "scripts/actions-global-pin-transfer-v2.py",
          }
          unexpected = [
              path for path in changed
              if path not in allowed_exact and not path.startswith(".github/workflows/")
          ]
          if unexpected:
              raise SystemExit(f"unexpected generated scope: {unexpected}")
          if not any(path.startswith(".github/workflows/") and path != ".github/workflows/actions-global-pin-transfer-v2.yml" for path in changed):
              raise SystemExit("no permanent workflow pins were generated")
          print(f"SCOPE PASS: {len(changed)} paths")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Prove global immutable action contract
        run: node scripts/github-actions-global-pin-contract-test.mjs

      - name: Run permanent workflow policy and actionlint
        run: npm run workflows:policy

      - name: Publish one clean generated commit to the PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): pin every external GitHub Action immutably"
          git push origin "HEAD:${HEAD_REF}"
