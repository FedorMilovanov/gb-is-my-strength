name: TEMP Fix Pages Trigger Topology PR

on:
  push:
    branches:
      - fix/pages-trigger-topology-2026-07-22

permissions:
  contents: write

concurrency:
  group: temp-fix-pages-trigger-topology-pr
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[topology-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-trigger-topology-2026-07-22
          fetch-depth: 0
      - name: Restore asset-only direct push block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/deploy.yml')
          text = p.read_text(encoding='utf-8')
          old_header = '''# Production deploy has one automatic entry point: a successful read-only
          # Metadata & IndexNow Readiness run. workflow_dispatch remains for explicit
          # operator recovery. The workflow never rewrites source revisions.
          on:
          '''
          new_header = '''# Source/build deploys have one automatic entry point: a successful read-only
          # Metadata & IndexNow Readiness run. Asset/static/infrastructure paths may
          # deploy directly; workflow_dispatch remains for explicit operator recovery.
          # The workflow never rewrites source revisions.
          on:
            push:
              branches: [main]
              paths:
                - 'images/**'
                - 'fonts/**'
                - 'icons/**'
                - 'konfessii/**'
                - 'karty/**'
                - 'map/**'
                - 'biografii/**'
                - 'hard-texts/**'
                - '.nojekyll'
                - 'favicon*'
                - 'apple-touch-icon.png'
                - 'CNAME'
                - '.github/workflows/deploy.yml'

          '''
          if text.count(old_header) != 1:
              raise SystemExit(f'header anchor count: {text.count(old_header)}')
          text = text.replace(old_header, new_header, 1)
          old_if = '''    # Automatic deploy is allowed only after readiness succeeds. Manual runs
              # remain available for explicit operator recovery. A failed/cancelled
              # readiness must never ship production.
              if: >
                github.event_name == 'workflow_dispatch' ||
                github.event.workflow_run.conclusion == 'success'
          '''
          new_if = '''    # Source/build deploys are allowed only after readiness succeeds. Direct
              # push is restricted above to asset/static/infrastructure paths. Manual
              # runs remain available for explicit operator recovery.
              if: >
                github.event_name == 'workflow_dispatch' ||
                github.event_name == 'push' ||
                github.event.workflow_run.conclusion == 'success'
          '''
          if text.count(old_if) != 1:
              raise SystemExit(f'job condition anchor count: {text.count(old_if)}')
          text = text.replace(old_if, new_if, 1)
          old_check = '''      - name: Check asset revisions for manual deploys
                  # workflow_run already follows a successful read-only readiness check.
                  if: github.event_name == 'workflow_dispatch'
                  run: node scripts/cache-bust.js
          '''
          new_check = '''      - name: Check asset revisions for direct or manual deploys
                  # workflow_run already follows a successful read-only readiness check.
                  if: github.event_name != 'workflow_run'
                  run: node scripts/cache-bust.js
          '''
          if text.count(old_check) != 1:
              raise SystemExit(f'revision check anchor count: {text.count(old_check)}')
          text = text.replace(old_check, new_check, 1)
          p.write_text(text, encoding='utf-8')
          PY
          node scripts/workflow-linkage-regression-test.js
          node scripts/check-workflows.js
          git diff --check
      - name: Publish corrected deploy workflow
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/deploy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[topology-patch] restore asset-only direct deploy paths'
          git push origin HEAD:fix/pages-trigger-topology-2026-07-22
