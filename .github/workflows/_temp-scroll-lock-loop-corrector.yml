name: TEMP scroll lock loop corrector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  correct-scroll-lock:
    if: github.head_ref == 'lane/system-reader-preferences-r1-final-2026-07-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Make scroll lock observer idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/site-utils.js')
          text = path.read_text(encoding='utf-8')

          sync_anchor = '  function syncPublicState() {'
          lock_helper = """  function lockStylesApplied() {
            var body = document.body;
            var html = document.documentElement;
            return Boolean(
              body && html &&
              html.getAttribute('data-scroll-locked') === '1' &&
              body.style.position === 'fixed' &&
              body.style.overflow === 'hidden' &&
              body.style.overscrollBehavior === 'none' &&
              body.style.width === '100%'
            );
          }

          """
          if text.count(sync_anchor) != 1:
              raise SystemExit(f'expected one syncPublicState anchor, found {text.count(sync_anchor)}')
          text = text.replace(sync_anchor, lock_helper + sync_anchor, 1)

          old_apply = '    if (!effectiveLocked() || restoring) return;'
          new_apply = '    if (!effectiveLocked() || restoring || lockStylesApplied()) return;'
          if text.count(old_apply) != 1:
              raise SystemExit(f'expected one applyLock guard, found {text.count(old_apply)}')
          text = text.replace(old_apply, new_apply, 1)

          old_observer = '      if (!restoring && effectiveLocked()) queueMicrotask(ensureLockState);'
          new_observer = '      if (!restoring && effectiveLocked() && !lockStylesApplied()) queueMicrotask(ensureLockState);'
          if text.count(old_observer) != 1:
              raise SystemExit(f'expected one observer guard, found {text.count(old_observer)}')
          text = text.replace(old_observer, new_observer, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/runtime-integrity-test.js')
          test = test_path.read_text(encoding='utf-8')
          console_line = "console.log('✅ runtime-integrity-test: dedupe + ARIA bootstrap + coordinated scroll lock');"
          assertions = """assert.ok(source.includes('function lockStylesApplied()'), 'scroll-lock repair must be idempotent');
          assert.ok(
            source.includes('restoring || lockStylesApplied()'),
            'applyLock must not rewrite an already-correct lock state',
          );
          assert.ok(
            source.includes('effectiveLocked() && !lockStylesApplied()'),
            'MutationObserver must repair only real lock drift',
          );

          console.log('✅ runtime-integrity-test: dedupe + ARIA bootstrap + coordinated idempotent scroll lock');"""
          if test.count(console_line) != 1:
              raise SystemExit(f'expected one runtime console anchor, found {test.count(console_line)}')
          test = test.replace(console_line, assertions, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Validate correction
        run: |
          node --check js/site-utils.js
          node scripts/runtime-integrity-test.js
      - name: Commit correction
        shell: bash
        run: |
          git rm .github/workflows/_temp-scroll-lock-loop-corrector.yml
          git add js/site-utils.js scripts/runtime-integrity-test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): stop scroll-lock observer feedback loop'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
