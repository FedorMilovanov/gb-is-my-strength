name: TEMP scroll lock loop corrector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  correct-scroll-lock:
    if: github.head_ref == 'lane/system-reader-preferences-r1-final-2026-07-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Make scroll lock observer idempotent
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('js/site-utils.js')
          text = path.read_text(encoding='utf-8')

          anchor = r"""  function effectiveLocked() {
              return legacyLockActive || globalSources.size > 0;
            }

            function syncPublicState() {
          """
          replacement = r"""  function effectiveLocked() {
              return legacyLockActive || globalSources.size > 0;
            }

            function lockStylesApplied() {
              var body = document.body;
              var html = document.documentElement;
              return Boolean(
                body && html &&
                html.getAttribute('data-scroll-locked') === '1' &&
                body.style.position === 'fixed' &&
                body.style.overflow === 'hidden' &&
                body.style.overscrollBehavior === 'none' &&
                body.style.width === '100%'
              );
            }

            function syncPublicState() {
          """
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one effectiveLocked anchor, found {text.count(anchor)}')
          text = text.replace(anchor, replacement, 1)

          old_apply = "  function applyLock() {\n    if (!effectiveLocked() || restoring) return;\n"
          new_apply = "  function applyLock() {\n    if (!effectiveLocked() || restoring || lockStylesApplied()) return;\n"
          if text.count(old_apply) != 1:
              raise SystemExit(f'expected one applyLock anchor, found {text.count(old_apply)}')
          text = text.replace(old_apply, new_apply, 1)

          old_observer = """    var lockObserver = new MutationObserver(function () {
              if (!restoring && effectiveLocked()) queueMicrotask(ensureLockState);
            });
          """
          new_observer = """    var lockObserver = new MutationObserver(function () {
              if (!restoring && effectiveLocked() && !lockStylesApplied()) queueMicrotask(ensureLockState);
            });
          """
          if text.count(old_observer) != 1:
              raise SystemExit(f'expected one observer anchor, found {text.count(old_observer)}')
          text = text.replace(old_observer, new_observer, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/runtime-integrity-test.js')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = """assert.equal(dialog.inert, true, 'the hidden quotes dialog must be inert');

          console.log('✅ runtime-integrity-test: dedupe + ARIA bootstrap + coordinated scroll lock');
          """
          test_replacement = """assert.equal(dialog.inert, true, 'the hidden quotes dialog must be inert');

          assert.ok(source.includes('function lockStylesApplied()'), 'scroll-lock repair must be idempotent');
          assert.ok(
            source.includes('restoring || lockStylesApplied()'),
            'applyLock must not rewrite an already-correct lock state',
          );
          assert.ok(
            source.includes('effectiveLocked() && !lockStylesApplied()'),
            'MutationObserver must repair only real lock drift',
          );

          console.log('✅ runtime-integrity-test: dedupe + ARIA bootstrap + coordinated idempotent scroll lock');
          """
          if test.count(test_anchor) != 1:
              raise SystemExit(f'expected one runtime test anchor, found {test.count(test_anchor)}')
          test = test.replace(test_anchor, test_replacement, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Validate correction
        run: |
          node --check js/site-utils.js
          node scripts/runtime-integrity-test.js
      - name: Commit correction
        shell: bash
        run: |
          git rm .github/workflows/_temp-scroll-lock-loop-corrector.yml
          git add js/site-utils.js scripts/runtime-integrity-test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(runtime): stop scroll-lock observer feedback loop'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
