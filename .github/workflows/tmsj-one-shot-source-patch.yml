name: TMSJ One-shot Source Patch

on:
  push:
    branches:
      - fix/tmsj-current-translation-rights-20260906
    paths:
      - '.github/workflows/tmsj-one-shot-source-patch.yml'

permissions:
  contents: write

concurrency:
  group: tmsj-one-shot-source-patch
  cancel-in-progress: false

jobs:
  exact-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/tmsj-current-translation-rights-20260906
          fetch-depth: 0

      - name: Apply exact two-line source patch and remove writer
        shell: bash
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_EVENT_SHA"
          test "$(git rev-parse origin/fix/tmsj-current-translation-rights-20260906)" = "$EXPECTED_EVENT_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('src/components/article-pilots/hermenevtika/HermenevtikaBody.astro')
          data = path.read_bytes()
          git_sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          assert git_sha == '671d5ebf941434d499ed2f58b71682298efb48c3', git_sha
          text = data.decode('utf-8')

          old_top = '<p><strong>Права:</strong> © The Master’s Seminary Journal (TMSJ). Переведённый материал размещён в ознакомительных целях для назидания тех, кто не знает английский. По запросу правообладателя будет удалён.</p>'
          new_top = '<p><strong>Права:</strong> © The Master’s Seminary Journal (TMSJ). Русский перевод этой статьи публикуется с разрешения TMS Journal. Разрешение относится к данной публикации и не распространяется автоматически на другие материалы TMSJ.</p>'
          old_card = ' Материал публикуется в ознакомительных целях; по требованию правообладателя будет удалён.'
          new_card = ' Русский перевод этой статьи публикуется с разрешения TMS Journal; это разрешение относится только к данной публикации и не распространяется автоматически на другие материалы TMSJ.'

          assert text.count(old_top) == 1
          assert text.count(old_card) == 1
          assert 'Русский перевод этой статьи публикуется с разрешения TMS Journal.' not in text
          assert 'Разрешение относится к данной публикации и не распространяется автоматически на другие материалы TMSJ.' not in text

          text = text.replace(old_top, new_top).replace(old_card, new_card)
          patched = text.encode('utf-8')
          patched_sha = hashlib.sha1(b'blob ' + str(len(patched)).encode() + b'\0' + patched).hexdigest()
          assert patched_sha == '3579bc38f6c37921c6a4557548e0254fbfe26c81', patched_sha
          path.write_bytes(patched)
          PY

          git show 3c8641bc1447de61d4f9cad70720f98cf60a685c:scripts/lib/tmsj-translation-rights-contract.js > scripts/lib/tmsj-translation-rights-contract.js
          test "$(git hash-object scripts/lib/tmsj-translation-rights-contract.js)" = "c03705d8ace9159924121b0536135d08c04a2003"

          git rm .github/workflows/tmsj-one-shot-source-patch.yml
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            '.github/workflows/tmsj-one-shot-source-patch.yml'
            'scripts/lib/tmsj-translation-rights-contract.js'
            'src/components/article-pilots/hermenevtika/HermenevtikaBody.astro'
          )
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected
          printf '%s\n' "${changed[@]}" > /tmp/actual
          diff -u /tmp/expected /tmp/actual

          remote_sha="$(git ls-remote origin refs/heads/fix/tmsj-current-translation-rights-20260906 | cut -f1)"
          test "$remote_sha" = "$EXPECTED_EVENT_SHA"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/lib/tmsj-translation-rights-contract.js src/components/article-pilots/hermenevtika/HermenevtikaBody.astro
          git commit -m 'fix(tmsj): update current translation permission notice'
          git push origin HEAD:fix/tmsj-current-translation-rights-20260906
