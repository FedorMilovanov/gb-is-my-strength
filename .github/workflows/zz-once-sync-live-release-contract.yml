name: One-shot sync live release contract

on:
  push:
    branches: [fix/live-home-css-contract]
    paths:
      - '.github/workflows/zz-once-sync-live-release-contract.yml'
      - 'scripts/live-release-contract.mjs'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/live-home-css-contract
          fetch-depth: 0
      - name: Update mutation contract for extracted Home CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/release-pipeline-contract-test.mjs')
          s = p.read_text()
          old_token = '    ["approved Refutations geometry", "assert.match(html, /h-refutation-card[^}]{0,500}box-sizing:border-box/"],\n'
          new_token = '''    ["approved Refutations stylesheet local binding", "const localRefutationsStylesheet = findRefutationsStylesheet(localHomeStylesheets, 'local candidate home');"],
    ["approved Refutations stylesheet geometry contract", "function assertRefutationsStylesheet(buffer, label) {"],
    ["approved Refutations border-box selector", "box-sizing\\s*:\\s*border-box"],
    ["approved Refutations stylesheet live fetch", "const liveRefutationsStyle = await fetchBuffer(localRefutationsStylesheet.path, attempt, 'home-refutations-stylesheet');"],
    ["approved Refutations stylesheet byte equality", "'home-refutations-stylesheet: live byte count mismatch'"],
    ["approved Refutations stylesheet digest equality", "'home-refutations-stylesheet: live SHA-256 mismatch'"],
    ["approved Refutations stylesheet live semantic contract", "assertRefutationsStylesheet(liveRefutationsStyle.buffer, 'live home Refutations stylesheet');"],
'''
          old_mutation = '  ["generic live Refutations geometry removed", { ...sources, live: sources.live.replace("assert.match(html, /h-refutation-card[^}]{0,500}box-sizing:border-box/", "assert.match(html, /.*/") }],\n'
          new_mutation = '''  ["generic live Refutations stylesheet binding removed", { ...sources, live: sources.live.replace("const localRefutationsStylesheet = findRefutationsStylesheet(localHomeStylesheets, 'local candidate home');", "") }],
  ["generic live Refutations selector weakened", { ...sources, live: sources.live.replace('box-sizing\\\\s*:\\\\s*border-box', 'box-sizing\\\\s*:\\\\s*content-box') }],
  ["generic live Refutations stylesheet fetch removed", { ...sources, live: sources.live.replace("const liveRefutationsStyle = await fetchBuffer(localRefutationsStylesheet.path, attempt, 'home-refutations-stylesheet');", "const liveRefutationsStyle = { buffer: localRefutationsStylesheet.buffer, url: 'local' };") }],
  ["generic live Refutations stylesheet byte equality removed", { ...sources, live: sources.live.replace("'home-refutations-stylesheet: live byte count mismatch'", "'home-refutations-stylesheet: unchecked bytes'") }],
  ["generic live Refutations stylesheet digest equality removed", { ...sources, live: sources.live.replace("'home-refutations-stylesheet: live SHA-256 mismatch'", "'home-refutations-stylesheet: unchecked digest'") }],
  ["generic live Refutations stylesheet semantic contract removed", { ...sources, live: sources.live.replace("assertRefutationsStylesheet(liveRefutationsStyle.buffer, 'live home Refutations stylesheet');", "") }],
'''
          assert old_token in s, 'old Refutations token not found'
          assert old_mutation in s, 'old Refutations mutation not found'
          s = s.replace(old_token, new_token, 1).replace(old_mutation, new_mutation, 1)
          p.write_text(s)
          PY
          node --check scripts/release-pipeline-contract-test.mjs
          node scripts/release-pipeline-contract-test.mjs
      - name: Commit exact contract sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/release-pipeline-contract-test.mjs
          git diff --cached --exit-code && exit 0
          git commit -m "test(release): guard extracted Home CSS witness"
          git push origin HEAD:fix/live-home-css-contract
