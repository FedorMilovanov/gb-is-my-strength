name: Temporary Reader R6 Refresh Main

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-refresh-main.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Merge exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0d352415396145d9ded48c5563a7d61cfd863a67"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-ff origin/main -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] merge current main 0d35241 into Reader R6"
          git diff --check HEAD^1 HEAD
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
