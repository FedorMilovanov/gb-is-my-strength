name: Diotrophes Wave 12 release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diotrophes-wave12-release.yml'
      - 'data/diotrophes-wave10-product-draft.json'
      - 'data/diotrophes-wave11-faithful-witness-*.json'
      - 'data/diotrophes-wave12-release-manifest.json'
      - 'data/route-profiles/articles-diotrefy-nashego-vremeni.json'
      - 'data/route-search-policy.json'
      - 'data/search-manifest.json'
      - 'data/series.json'
      - 'data/editorial-metadata-supplements/diotrophes-wave12.json'
      - 'migration/page-ownership.json'
      - 'migration/route-migration-matrix.json'
      - 'src/components/article-pilots/diotrophes/**'
      - 'src/components/article-pilots/_shared/series/pastorSeriesConfig.ts'
      - 'src/components/pastor-series/**'
      - 'src/components/articles/ArticlesPublicationsSection.astro'
      - 'src/pages/articles/diotrefy-nashego-vremeni/**'
      - 'scripts/diotrophes-wave10-contract.mjs'
      - 'scripts/diotrophes-wave11-faithful-witness-contract.mjs'
      - 'scripts/diotrophes-wave12-*.mjs'
      - 'scripts/search-index-policy-contract-test.js'
      - 'scripts/search-index-policy-inventory.js'
      - 'scripts/rss-feed-normalizer.js'
      - 'scripts/sitemap-policy-normalizer.js'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'sitemap-pastor-series.xml'
      - 'feed-pastor-series.xml'
      - 'robots.txt'
      - 'research/WAVE12_DIOTROPHES_PUBLICATION_2026-08-02.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/diotrophes-wave12-release.yml'
      - 'data/diotrophes-wave10-product-draft.json'
      - 'data/diotrophes-wave11-faithful-witness-*.json'
      - 'data/diotrophes-wave12-release-manifest.json'
      - 'data/route-profiles/articles-diotrefy-nashego-vremeni.json'
      - 'data/route-search-policy.json'
      - 'data/search-manifest.json'
      - 'data/series.json'
      - 'data/editorial-metadata-supplements/diotrophes-wave12.json'
      - 'migration/page-ownership.json'
      - 'migration/route-migration-matrix.json'
      - 'src/components/article-pilots/diotrophes/**'
      - 'src/components/article-pilots/_shared/series/pastorSeriesConfig.ts'
      - 'src/components/pastor-series/**'
      - 'src/components/articles/ArticlesPublicationsSection.astro'
      - 'src/pages/articles/diotrefy-nashego-vremeni/**'
      - 'scripts/diotrophes-wave10-contract.mjs'
      - 'scripts/diotrophes-wave11-faithful-witness-contract.mjs'
      - 'scripts/diotrophes-wave12-*.mjs'
      - 'scripts/search-index-policy-contract-test.js'
      - 'scripts/search-index-policy-inventory.js'
      - 'scripts/rss-feed-normalizer.js'
      - 'scripts/sitemap-policy-normalizer.js'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'sitemap-pastor-series.xml'
      - 'feed-pastor-series.xml'
      - 'robots.txt'
      - 'research/WAVE12_DIOTROPHES_PUBLICATION_2026-08-02.md'

permissions:
  contents: read

concurrency:
  group: diotrophes-wave12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIOTROPHES_WAVE12_RELEASE_BOUNDARY: 8f17085dc8411cffbcb5a4dcd2f8fc5db9c30a97
      DIOTROPHES_WAVE12_HISTORICAL_VALIDATOR: b90103f1bf4020873c89454a36b6cd367c6348a6
    steps:
      - name: Checkout complete Product history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install browser and PDF witnesses
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Validate predecessor historical and scoped release authorities
        shell: bash
        run: |
          set -euo pipefail
          node scripts/diotrophes-wave10-contract.mjs
          node scripts/diotrophes-wave11-faithful-witness-contract.mjs
          git merge-base --is-ancestor "$DIOTROPHES_WAVE12_RELEASE_BOUNDARY" HEAD

          boundary_dir="${RUNNER_TEMP}/diotrophes-wave12-release-boundary"
          historical_validator="${RUNNER_TEMP}/diotrophes-wave12-historical-validator.mjs"
          rm -rf "$boundary_dir" "$historical_validator"
          git show "${DIOTROPHES_WAVE12_HISTORICAL_VALIDATOR}:scripts/diotrophes-wave12-release-contract.mjs" > "$historical_validator"
          git worktree add --detach "$boundary_dir" "$DIOTROPHES_WAVE12_RELEASE_BOUNDARY"
          cleanup_boundary() {
            git worktree remove --force "$boundary_dir" >/dev/null 2>&1 || true
          }
          trap cleanup_boundary EXIT
          (
            cd "$boundary_dir"
            node "$historical_validator"
          )
          cleanup_boundary
          trap - EXIT

          node scripts/diotrophes-wave12-transaction-scope-contract.mjs
          node scripts/diotrophes-wave12-canonical-discovery-contract.mjs

      - name: Validate route registries search contract and Astro types
        run: |
          npm run migration:metadata:check:strict
          npm run page-ownership:check
          node scripts/search-index-policy-contract-test.js
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          npm run astro:check

      - name: Build production-like site and Pagefind
        run: |
          npm run strangler:build:production-like
          npm run page-ownership:dist:production-like
          npm run pagefind:build:dist
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Chromium WebKit no-JS and print contract
        run: node scripts/diotrophes-wave12-browser-contract.mjs

      - name: Ensure validation did not mutate tracked files
        run: git diff --exit-code

      - name: Upload Wave 12 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diotrophes-wave12-release-evidence
          path: |
            reports/diotrophes-wave12/
            reports/search-index-policy-inventory.json
            reports/search-index-policy-inventory.md
          if-no-files-found: warn
          retention-days: 30
