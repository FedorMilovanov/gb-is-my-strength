name: TEMP reader preferences ordering

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  reorder:
    if: github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reorder first-paint bootstrap after charset and CSP
        shell: bash
        run: |
          set +e
          python3 scripts/_temp_reorder_reader_preferences.py > reader-preferences-ordering.log 2>&1
          status=$?
          cat reader-preferences-ordering.log
          exit "$status"

      - name: Finalize permanent assertions and adapter docs
        run: python3 scripts/_temp_finalize_reader_preferences.py

      - name: Upload ordering diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-preferences-ordering-log
          path: reader-preferences-ordering.log
          if-no-files-found: error
          retention-days: 1

      - name: Verify preference foundation and revisions
        run: |
          node scripts/cache-bust.js
          node scripts/reader-preferences-regression-test.js

      - name: Commit secure ordering and permanent contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "[LANE lane/system-reader-preferences-foundation-2026-07-21] fix(reader): secure bootstrap order and adapter contracts"
          git push origin HEAD:lane/system-reader-preferences-foundation-2026-07-21
