name: Apply Atlas contract hardening

on:
  push:
    branches:
      - feat/relationship-atlas-marathon-20260727
    paths:
      - .github/workflows/apply-atlas-contract-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relationship-atlas-marathon-20260727
          fetch-depth: 0

      - name: Apply exact compiler and runtime patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          engine = Path('src/lib/relations/engine.mjs')
          replace_once(engine, "export const RELATION_ENGINE_VERSION = '1.1.0';", "export const RELATION_ENGINE_VERSION = '1.1.1';")
          replace_once(
              engine,
              "const NODE_ID_PATTERN = /^[a-z0-9][a-z0-9_-]{1,119}$/;\n",
              "const NODE_ID_PATTERN = /^[a-z0-9][a-z0-9_-]{1,119}$/;\nconst PART_SLUG_PATTERN = /^[a-z0-9][a-z0-9-]*$/;\n",
          )
          replace_once(
              engine,
              "  return text.startsWith('/') && !text.startsWith('//') && !/[?#]/.test(text) && !/^[a-z][a-z0-9+.-]*:/i.test(text);\n",
              "  return text.startsWith('/')\n    && !text.startsWith('//')\n    && !text.includes('\\\\')\n    && !/[?#]/.test(text)\n    && !/(^|\\/)\\.{1,2}(\\/|$)/.test(text)\n    && !/^[a-z][a-z0-9+.-]*:/i.test(text);\n",
          )
          replace_once(
              engine,
              "    if (!NODE_ID_PATTERN.test(id) || !title || !validInternalUrl(rawUrl) || url === '/') {\n",
              "    if (!NODE_ID_PATTERN.test(id) || !NODE_ID_PATTERN.test(group) || !title || !validInternalUrl(rawUrl) || url === '/') {\n",
          )
          replace_once(
              engine,
              "    if (!NODE_ID_PATTERN.test(seriesId) || !validInternalUrl(baseUrl) || !Array.isArray(series?.parts)) {\n",
              "    if (!NODE_ID_PATTERN.test(seriesId) || !validInternalUrl(baseUrl) || !baseUrl.endsWith('/') || !Array.isArray(series?.parts)) {\n",
          )
          replace_once(
              engine,
              "      if (!partSlug || !title || !validReadingTime(part?.readingTime)) {\n",
              "      if (!PART_SLUG_PATTERN.test(partSlug) || !title || !validReadingTime(part?.readingTime)) {\n",
          )
          replace_once(
              engine,
              "        let id = `series-${slug(seriesId)}-${slug(partSlug)}`;\n        let suffix = 2;\n        while (byId.has(id)) id = `series-${slug(seriesId)}-${slug(partSlug)}-${suffix++}`;\n        node = {\n",
              "        const id = `series-${slug(seriesId)}-${slug(partSlug)}`;\n        if (!NODE_ID_PATTERN.test(id) || byId.has(id)) {\n          errors.push(`synthetic series node id ${id} collides with an existing graph node`);\n          continue;\n        }\n        node = {\n",
          )

          tests = Path('scripts/check-relations.mjs')
          anchor = "rejects('catalog schema version is fail-closed', () => compileRelations({\n"
          insertion = """rejects('synthetic series ids are stable and collisions fail closed', () => compileRelations({
  graphData: {
    nodes: [{ id: 'series-series-a-part-one', title: 'Collision', url: '/collision/', group: 'standalone' }],
    edges: [],
  },
  seriesData: {
    'series-a': { title: 'A', baseUrl: '/articles/', parts: [{ slug: 'part-one', title: 'Part one', status: 'published' }] },
  },
  catalogData: { schemaVersion: 1, relations: [] },
  strict: true,
}), /synthetic series node id .* collides/);

rejects('series routes require canonical base and slug forms', () => compileRelations({
  graphData: { nodes: [], edges: [] },
  seriesData: {
    'series-a': { title: 'A', baseUrl: '/articles', parts: [{ slug: '../part-one', title: 'Part one', status: 'published' }] },
  },
  catalogData: { schemaVersion: 1, relations: [] },
  strict: true,
}), /invalid series registry entry|invalid published part/);

rejects('graph URLs and groups reject ambiguous identifiers', () => compileRelations({
  graphData: { nodes: [{ id: 'node-a', title: 'A', url: '/a/../b/', group: 'Bad Group' }], edges: [] },
  seriesData: {},
  catalogData: { schemaVersion: 1, relations: [] },
  strict: true,
}), /invalid graph node/);

"""
          replace_once(tests, anchor, insertion + anchor)

          runtime = Path('src/runtime/atlas-runtime.js')
          replace_once(
              runtime,
              "    function relatedTo(id) {\n      var result = [];\n      data.edges.forEach(function (edge) {\n        if (edge.source === id) result.push({ id: edge.target, edge: edge, orientation: 'outgoing' });\n        else if (edge.target === id) result.push({ id: edge.source, edge: edge, orientation: edge.direction === 'directed' ? 'incoming' : 'undirected' });\n      });\n",
              "    function relatedTo(id, includeDisabledKinds) {\n      var result = [];\n      data.edges.forEach(function (edge) {\n        if (!includeDisabledKinds && !enabledKinds.has(edge.kind)) return;\n        if (edge.source === id) result.push({ id: edge.target, edge: edge, orientation: 'outgoing' });\n        else if (edge.target === id) result.push({ id: edge.source, edge: edge, orientation: edge.direction === 'directed' ? 'incoming' : 'undirected' });\n      });\n",
          )
          replace_once(
              runtime,
              "      var neighbors = relatedTo(id).filter(function (item) { return nodeById.has(item.id); }).slice(0, 7);\n",
              "      var allNeighbors = relatedTo(id).filter(function (item) { return nodeById.has(item.id); });\n      var neighbors = allNeighbors.slice(0, 7);\n",
          )
          replace_once(
              runtime,
              "      detailContent.replaceChildren();\n\n      detailContent.appendChild(createElement('span', 'atlas-detail__kind', group.label));\n",
              "      detailContent.replaceChildren();\n      detailContent.dataset.relationCount = String(allNeighbors.length);\n      detailContent.dataset.renderedRelationCount = String(neighbors.length);\n\n      detailContent.appendChild(createElement('span', 'atlas-detail__kind', group.label));\n",
          )
          replace_once(
              runtime,
              "      meta.appendChild(createElement('span', '', neighbors.length + ' ' + pluralRelations(neighbors.length)));\n",
              "      meta.appendChild(createElement('span', '', allNeighbors.length + ' ' + pluralRelations(allNeighbors.length)));\n",
          )
          replace_once(
              runtime,
              "      if (activeFocus && (!isNodeVisible(nodeById.get(activeFocus)) || !matchesSearch(nodeById.get(activeFocus)))) clearFocus(false);\n",
              "      if (activeFocus && (!isNodeVisible(nodeById.get(activeFocus)) || !matchesSearch(nodeById.get(activeFocus)))) clearFocus();\n",
          )
          replace_once(
              runtime,
              "      updateUrl({ group: activeGroup === 'all' ? null : activeGroup }, pushHistory ? 'push' : 'replace');\n",
              "      updateUrl({ group: activeGroup === 'all' ? null : activeGroup, focus: null }, pushHistory ? 'push' : 'replace');\n",
          )
          replace_once(
              runtime,
              "        enabledKinds = new Set(Array.from(document.querySelectorAll('.atlas-relation-filter input:checked')).map(function (item) { return item.value; }));\n        applyFilters();\n",
              "        enabledKinds = new Set(Array.from(document.querySelectorAll('.atlas-relation-filter input:checked')).map(function (item) { return item.value; }));\n        applyFilters();\n        if (activeFocus) focusNode(activeFocus, false, false);\n",
          )

          browser = Path('scripts/atlas-browser-contract.mjs')
          replace_once(
              browser,
              "async function desktopScene(browser, base, compiled) {\n",
              "function relationDegree(compiled, nodeId, disabledKind = '') {\n  return compiled.edges.filter((edge) => (edge.source === nodeId || edge.target === nodeId) && edge.kind !== disabledKind).length;\n}\n\nfunction highestDegreeNode(compiled) {\n  return compiled.nodes\n    .map((node) => ({ ...node, degree: relationDegree(compiled, node.id) }))\n    .sort((left, right) => right.degree - left.degree || left.id.localeCompare(right.id))[0];\n}\n\nasync function desktopScene(browser, base, compiled) {\n",
          )
          replace_once(
              browser,
              "  const dataRequests = observeDataRequests(page);\n  page.on('pageerror', (error) => errors.push(String(error)));\n",
              "  const dataRequests = observeDataRequests(page);\n  const detailTarget = highestDegreeNode(compiled);\n  const disabledKind = compiled.edges.find((edge) => edge.source === detailTarget.id || edge.target === detailTarget.id)?.kind || '';\n  const filteredDegree = relationDegree(compiled, detailTarget.id, disabledKind);\n  const alternateGroup = compiled.groups.find((group) => group.id !== detailTarget.atlasGroup)?.id || '';\n  page.on('pageerror', (error) => errors.push(String(error)));\n",
          )
          replace_once(
              browser,
              "    await page.locator('.atlas-node:not(.is-filtered-out)').first().click();\n",
              "    await page.locator(`.atlas-node[data-node-id=\"${detailTarget.id}\"]`).click();\n",
          )
          replace_once(
              browser,
              "      const detail = document.getElementById('atlasDetail')?.getBoundingClientRect();\n      return {\n",
              "      const detail = document.getElementById('atlasDetail')?.getBoundingClientRect();\n      const detailContent = document.getElementById('atlasDetailContent');\n      const relationCopy = document.querySelector('.atlas-detail__meta span:last-child')?.textContent || '';\n      return {\n",
          )
          replace_once(
              browser,
              "        detail: detail ? { left: detail.left, right: detail.right, width: detail.width } : null,\n      };\n",
              "        detail: detail ? { left: detail.left, right: detail.right, width: detail.width } : null,\n        relationCount: Number(detailContent?.dataset.relationCount || 0),\n        renderedRelationCount: Number(detailContent?.dataset.renderedRelationCount || 0),\n        relationCopy,\n      };\n",
          )
          replace_once(
              browser,
              "    const focusParam = new URL(page.url()).searchParams.get('focus');\n\n    await page.locator('#atlasSearchInput').fill(compiled.nodes.at(-1).title.slice(0, 8));\n",
              "    const focusParam = new URL(page.url()).searchParams.get('focus');\n\n    if (disabledKind) {\n      await page.locator(`.atlas-relation-filter input[value=\"${disabledKind}\"]`).uncheck();\n      await page.waitForFunction((expected) => Number(document.getElementById('atlasDetailContent')?.dataset.relationCount || -1) === expected, filteredDegree);\n    }\n    const filteredDetail = await page.evaluate(() => ({\n      relationCount: Number(document.getElementById('atlasDetailContent')?.dataset.relationCount || 0),\n      renderedRelationCount: Number(document.getElementById('atlasDetailContent')?.dataset.renderedRelationCount || 0),\n    }));\n    if (disabledKind) await page.locator(`.atlas-relation-filter input[value=\"${disabledKind}\"]`).check();\n\n    if (alternateGroup) {\n      await page.locator(`[data-atlas-group=\"${alternateGroup}\"]`).click();\n      await page.waitForFunction(() => !new URL(location.href).searchParams.has('focus') && !document.getElementById('atlasApp')?.classList.contains('has-detail'));\n    }\n    const groupState = await page.evaluate(() => ({\n      focus: new URL(location.href).searchParams.get('focus'),\n      hasDetail: document.getElementById('atlasApp')?.classList.contains('has-detail') || false,\n    }));\n    await page.locator('[data-atlas-group=\"all\"]').click();\n\n    await page.locator('#atlasSearchInput').fill(compiled.nodes.at(-1).title.slice(0, 8));\n",
          )
          replace_once(
              browser,
              "    const detailExpansion = focusedGeometry.hasDetail\n      && focusedGeometry.detail?.width >= 320\n      && focusedGeometry.detail?.right <= 1442\n      && focusedGeometry.main?.width < initialGeometry.main?.width - 250;\n",
              "    const detailExpansion = focusedGeometry.hasDetail\n      && focusedGeometry.detail?.width >= 320\n      && focusedGeometry.detail?.right <= 1442\n      && focusedGeometry.main?.width < initialGeometry.main?.width - 250\n      && focusedGeometry.relationCount === detailTarget.degree\n      && focusedGeometry.renderedRelationCount === Math.min(7, detailTarget.degree)\n      && focusedGeometry.relationCopy.startsWith(String(detailTarget.degree));\n    const relationFilterContract = !disabledKind\n      || (filteredDetail.relationCount === filteredDegree\n        && filteredDetail.renderedRelationCount === Math.min(7, filteredDegree));\n    const groupUrlContract = !alternateGroup || (!groupState.focus && !groupState.hasDetail);\n",
          )
          replace_once(
              browser,
              "      openStage && detailExpansion\n",
              "      openStage && detailExpansion && relationFilterContract && groupUrlContract\n",
          )
          replace_once(
              browser,
              "      JSON.stringify({ initialGeometry, focusedGeometry, beforeView, afterView, focusParam, searchFocus, ...state, dataRequests, errors }));\n",
              "      JSON.stringify({ initialGeometry, focusedGeometry, filteredDetail, groupState, detailTarget, disabledKind, filteredDegree, beforeView, afterView, focusParam, searchFocus, ...state, dataRequests, errors }));\n",
          )
          PY

      - name: Validate patched sources
        shell: bash
        run: |
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-browser-contract.mjs
          node --check src/lib/relations/engine.mjs
          node scripts/check-relations.mjs
          git diff --check

      - name: Commit source changes and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-atlas-contract-hardening.yml
          git add src/lib/relations/engine.mjs scripts/check-relations.mjs src/runtime/atlas-runtime.js scripts/atlas-browser-contract.mjs
          git diff --cached --check
          git commit -m "fix(atlas): harden deep links, filters and relation counts"
          git push origin HEAD:feat/relationship-atlas-marathon-20260727
