name: Temporary Avraam lifecycle order transaction

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'scripts/.tmp-avraam-static-order-materialize-20260803.py'
      - '.github/workflows/.tmp-avraam-static-order-materialize-20260803.yml'

permissions:
  contents: read

concurrency:
  group: temp-avraam-static-order-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/avraam-skip-contrast-a11y-20260803' &&
      contains(github.event.pull_request.labels.*.name, 'autofix')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize lifecycle-aware order contract
        run: python scripts/.tmp-avraam-static-order-materialize-20260803.py

      - name: Validate generated witness
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/avraam-dossier-witness.mjs
          node scripts/check-workflows.js
          git diff --check
          python - <<'PY'
          import subprocess
          expected = {'scripts/avraam-dossier-witness.mjs'}
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {
              row[3:] for row in rows
              if row
              and not row.endswith('.tmp-avraam-static-order-materialize-20260803.py')
              and not row.endswith('.tmp-avraam-static-order-materialize-20260803.yml')
          }
          if changed != expected:
              raise SystemExit(f'unexpected generated paths: {sorted(changed)}')
          witness = open('scripts/avraam-dossier-witness.mjs', encoding='utf-8').read()
          for token in ('lifecycleHeadingPresent', 'skipBeforeFallback', 'fallbackBeforeStage'):
              if token not in witness: raise SystemExit(f'witness marker missing: {token}')
          for stale in ('skipBeforeHeading:', 'headingBeforeFallback:'):
              if stale in witness: raise SystemExit(f'stale lifecycle-unstable marker remains: {stale}')
          PY

      - name: Remove transaction transport and validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            scripts/.tmp-avraam-static-order-materialize-20260803.py \
            .github/workflows/.tmp-avraam-static-order-materialize-20260803.yml
          git add scripts/avraam-dossier-witness.mjs
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/.tmp-avraam-static-order-materialize-20260803.yml',
              'scripts/.tmp-avraam-static-order-materialize-20260803.py',
              'scripts/avraam-dossier-witness.mjs',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(changed)}')
          PY

      - name: Commit and push exact PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'avraam-a11y-materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(avraam): use lifecycle-stable reading order'
          git push origin "HEAD:${HEAD_REF}"
