name: Temporary Nagornaya Main Sync

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/_temp-nagornaya-sync-main-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-nagornaya-main-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.number == 1197 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Merge latest main, validate, self-clean and push
        env:
          INITIAL_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$INITIAL_HEAD"
          git fetch origin main "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$INITIAL_HEAD"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/main
          git diff --cached --check origin/main

          node scripts/nagornaya-visual-parity-audit.js
          node scripts/cache-bust.js

          git rm .github/workflows/_temp-nagornaya-sync-main-once.yml
          git add -A
          git diff --cached --check origin/main

          git fetch origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$INITIAL_HEAD"

          git commit -m "merge(main): refresh Nagornaya candidate after FAQ security"
          git push origin HEAD:"$HEAD_REF"
