name: Temporary TTS Download Consent Materializer

on:
  push:
    branches:
      - "agent/tts-download-cancel-notice"
    paths:
      - ".github/workflows/_tmp-tts-download-consent-materialize.yml"

permissions:
  contents: write

concurrency:
  group: tmp-tts-download-consent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: macos-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/tts-download-cancel-notice
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Reconstruct materializer
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const dir = 'scripts/_tmp-tts-materializer-parts';
          const encoded = fs.readdirSync(dir)
            .filter((name) => name.startsWith('part-') && name.endsWith('.b64'))
            .sort()
            .map((name) => fs.readFileSync(`${dir}/${name}`, 'utf8'))
            .join('');
          fs.writeFileSync('scripts/_tmp-tts-download-consent-materialize.js', Buffer.from(encoded, 'base64'));
          NODE
          node --check scripts/_tmp-tts-download-consent-materialize.js

      - name: Materialize permanent TTS consent contract and width fix
        run: node scripts/_tmp-tts-download-consent-materialize.js

      - name: Apply real mobile viewport and keyboard fixture
        run: node scripts/_tmp-tts-browser-fixture-fix.js

      - name: Remove transport chunks
        run: rm -rf scripts/_tmp-tts-materializer-parts

      - name: Check permanent JavaScript syntax
        run: |
          node --check js/vosk-tts-engine.js
          node --check scripts/tts-download-consent-contract-test.js
          node --check scripts/tts-download-notice-browser-test.js

      - name: Run TTS consent mutation contract
        run: node scripts/tts-download-consent-contract-test.js

      - name: Verify existing cache-bust contract remains clean
        run: node scripts/cache-bust.js

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install chromium

      - name: Verify cancellable download notice in Chromium
        run: node scripts/tts-download-notice-browser-test.js

      - name: Verify materialized permanent scope
        run: |
          test ! -e scripts/_tmp-tts-download-consent-materialize.js
          test ! -e scripts/_tmp-tts-box-sizing-fix.js
          test ! -e scripts/_tmp-tts-browser-fixture-fix.js
          test ! -e scripts/_tmp-tts-materializer-parts
          test ! -e .github/workflows/_tmp-tts-download-consent-materialize.yml
          test ! -e TTS_BROWSER_ERROR.txt
          test ! -e TTS_MUTATION_ERROR.txt
          test -f js/vosk-tts-engine.js
          test -f css/tts-download-notice.css
          test -f scripts/tts-download-consent-contract-test.js
          test -f scripts/tts-download-notice-browser-test.js
          test -f .github/workflows/tts-download-consent.yml
          git diff --check

      - name: Upload verified permanent scope
        uses: actions/upload-artifact@v4
        with:
          name: tts-permanent-scope-${{ github.run_id }}
          path: |
            js/vosk-tts-engine.js
            css/tts-download-notice.css
            scripts/tts-download-consent-contract-test.js
            scripts/tts-download-notice-browser-test.js
            .github/workflows/tts-download-consent.yml
            reports/tts-download-notice-desktop.png
            reports/tts-download-notice-mobile-dark.png
          if-no-files-found: error
          retention-days: 14

      - name: Restore transport workflow for connector cleanup
        run: git checkout HEAD -- .github/workflows/_tmp-tts-download-consent-materialize.yml

      - name: Commit permanent changes and remove transport payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(tts): make model download cancellable"
          git push origin HEAD:agent/tts-download-cancel-notice
