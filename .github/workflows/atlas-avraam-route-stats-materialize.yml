name: Atlas Avraam Route Stats Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/atlas-avraam-route-stats-materialize.py'
      - '.github/workflows/atlas-avraam-route-stats-materialize.yml'

concurrency:
  group: atlas-avraam-route-stats-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize exact route-stat repair
        run: python3 scripts/atlas-avraam-route-stats-materialize.py

      - name: Validate route semantics and bounded scope
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-map-routes.js
          git diff --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          route=json.loads(Path('karty/avraam/route.json').read_text(encoding='utf-8'))
          stats=route['meta']['stats']
          assert stats['places'] == 19
          assert stats['route_places'] == 19
          assert stats['context_places'] == 3
          assert len(route['places']) == 22
          PY
          expected=$'.github/workflows/atlas-avraam-route-stats-materialize.yml\nkarty/avraam/route.json\nscripts/atlas-avraam-route-stats-materialize.py'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Commit permanent route repair only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/avraam/route.json
          git add -u scripts/atlas-avraam-route-stats-materialize.py .github/workflows/atlas-avraam-route-stats-materialize.yml
          git commit -m 'fix(atlas): distinguish route places from all map objects'
          git push origin "HEAD:${HEAD_REF}"
