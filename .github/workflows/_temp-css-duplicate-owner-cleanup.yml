name: Temporary CSS Duplicate Owner Cleanup

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - '.github/workflows/_temp-css-duplicate-owner-cleanup.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-css-duplicate-owner-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'cleanup/css-duplicate-owners-20260808'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove only proved duplicate CSS owners, project assets, self-clean
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || { echo "stale head: $actual != $EXPECTED_HEAD"; exit 1; }
          git fetch origin main "$HEAD_REF"
          test "$(git rev-parse origin/main)" = "76ad2f3ff814c088eb429d5ec0edd35d5bbe27b0" || { echo "main moved; rebuild from latest main"; exit 1; }
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD" || { echo "remote head moved before cleanup"; exit 1; }

          node <<'NODE'
          const fs = require('fs');

          function count(haystack, needle) {
            return haystack.split(needle).length - 1;
          }

          const sitePath = 'css/site.css';
          let site = fs.readFileSync(sitePath, 'utf8');
          const early = '@keyframes fx-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}';
          const canonical = '@keyframes fx-breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.06);opacity:1}}';
          if (count(site, early) !== 1) throw new Error('expected exactly one dead scale-only fx-breathe owner');
          if (count(site, canonical) !== 1) throw new Error('expected exactly one canonical scale+opacity fx-breathe owner');
          site = site.replace(early, '');
          if (count(site, '@keyframes fx-breathe') !== 1 || count(site, canonical) !== 1) {
            throw new Error('fx-breathe did not converge to one canonical owner');
          }
          fs.writeFileSync(sitePath, site);

          const floatingPath = 'css/floating-cluster.css';
          let floating = fs.readFileSync(floatingPath, 'utf8');
          const repeatedStandalone = `  .gb-floater {
            top: auto;
            left: 50%;
            right: auto;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            flex-direction: row;
            gap: 2px;
            padding: 3px;
            border: 1px solid color-mix(in srgb, var(--color-border, #e5e2dc) 86%, transparent);
            border-radius: 24px;
            background: color-mix(in srgb, var(--color-surface, #fff) 94%, transparent);
            -webkit-backdrop-filter: blur(16px) saturate(160%);
            backdrop-filter: blur(16px) saturate(160%);
            z-index: var(--z-bottom-bar, 2000);
          }

          html.dark .gb-floater {
            background: color-mix(in srgb, var(--color-surface, #161a21) 94%, transparent);
            border-color: rgba(255, 255, 255, 0.08);
          }

          body.gb-cluster-single-active .article-main {
            padding-bottom: 88px;
          }

`;
          if (count(floating, repeatedStandalone) !== 1) {
            throw new Error('expected exactly one later repeated standalone mobile owner');
          }
          const earlyOwnerMarker = `  body.fc-single-active .article-main,
          body.gb-cluster-single-active .article-main {
            padding-bottom: 88px;
          }`;
          if (count(floating, earlyOwnerMarker) !== 1) throw new Error('early canonical/legacy standalone owner missing');
          if (!floating.includes('  /* Series-lite mobile */')) throw new Error('series-lite mobile owner missing before cleanup');
          floating = floating.replace(repeatedStandalone, '');
          if (count(floating, earlyOwnerMarker) !== 1) throw new Error('early standalone owner changed');
          if (!floating.includes('  /* Series-lite mobile */') || !floating.includes('  .gb-floater--series-lite {')) {
            throw new Error('series-lite rules changed/removed');
          }
          fs.writeFileSync(floatingPath, floating);
          NODE

          node scripts/css-layer-validator.js css/site.css --ceiling=200
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          node scripts/legacy-reference-inventory-audit.mjs

          git rm .github/workflows/_temp-css-duplicate-owner-cleanup.yml
          git add -A
          git diff --cached --check

          node <<'NODE'
          const fs = require('fs');
          const site = fs.readFileSync('css/site.css', 'utf8');
          const floating = fs.readFileSync('css/floating-cluster.css', 'utf8');
          if ((site.match(/@keyframes fx-breathe/g) || []).length !== 1) throw new Error('final fx-breathe owner count != 1');
          if ((floating.match(/body\.fc-single-active \.article-main,/g) || []).length !== 1) throw new Error('legacy standalone padding owner lost');
          if (!floating.includes('.gb-floater--series-lite')) throw new Error('series-lite owner lost');
          NODE

          git fetch origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD" || { echo "remote head moved during cleanup"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cleanup(css): remove duplicate shared owners"
          git push origin HEAD:"$HEAD_REF"
