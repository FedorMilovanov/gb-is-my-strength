name: One-shot Enoch source audit patch

on:
  push:
    branches:
      - agent/genesis-6-enoch-source-audit-continuation-2026-07-28

permissions:
  contents: write

jobs:
  apply-exact-editorial-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/genesis-6-enoch-source-audit-continuation-2026-07-28
          fetch-depth: 0

      - name: Apply exact reader-facing bibliography corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/agent-one-shot-enoch-source-audit.yml')
          article_6a = Path('src/content/articles/kniga-enoha-kotoroy-ne-bylo-kak-raznye-proizvedeniya-stali-korpusom.mdx')
          article_6b = Path('src/content/articles/mozhno-li-doveryat-1-enohu-kanonicheskiy-audit.mdx')

          replacements = {
              article_6a: [
                  (
                      'В Эфиопии этот раздел не только сохранялся внутри полного корпуса. Его извлекали, копировали отдельно, помещали в календарные сборники и сопровождали дополнительными схемами.[^16]',
                      'Поздняя геэз-форма Астрономической книги сохранилась внутри полного корпуса 1 Еноха. Геэз-передача корпуса известна по множеству рукописей и текстовых форм, поэтому её нельзя представлять как один неизменный экземпляр.[^16]',
                  ),
                  (
                      '[^16]: Erho and Stuckenbruck, “A Manuscript History of Ethiopic Enoch”; DFG project 270668285; каталоги эфиопских календарных и енохических рукописей, учтённые в Research dossier. Факт поздней рецепции не устанавливает первоначальную форму арамейского произведения.',
                      '[^16]: Erho and Stuckenbruck, “A Manuscript History of Ethiopic Enoch”; DFG project 270668285, final report, especially its account of the expanded manuscript basis and `Eth I / Eth II`. Эти источники поддерживают множественность и развивающуюся историю геэз-передачи корпуса; они не устанавливают первоначальную форму арамейской Астрономической книги.',
                  ),
                  (
                      '[^24]: OCP, Greek, Syriac and Coptic manuscript bibliography; S. P. Brock, “A Fragment of Enoch in Syriac,” *Journal of Theological Studies* 19/2 (1968): 626–631; S. Donadoni, *Acta Orientalia* 26 (1960): 197–202; греческие извлечения Георгия Синкелла в критических реестрах.',
                      '[^24]: OCP, Greek, Syriac and Coptic manuscript bibliography, including its entries for Syncellus; S. P. Brock, “A Fragment of Enoch in Syriac,” *Journal of Theological Studies* 19/2 (1968): 626–631; S. Donadoni, *Acta Orientalia* 26 (1960): 197–202. Эти источники подтверждают локальные версионные остатки, а не один полный греческий, сирийский или коптский 1 Енох.',
                  ),
              ],
              article_6b: [
                  (
                      '[^10]: Модели абсолютной этиологии, ограниченной допотопной ответственности, гиперболы и культовой формулы являются интерпретационными предложениями. До полного version control ни одна из них не должна выдаваться за единственно доказанное чтение.',
                      '[^10]: Michael A. Knibb, *The Ethiopic Book of Enoch*, vols. 1–2; Nickelsburg, commentary on 1 Enoch 10:8. Перечень моделей является редакторской картой возможных чтений, а не заявлением о научном консенсусе. До полного version control ни одна модель не повышается выше `LITERARY-HYPOTHESIS / HOLD`.',
                  ),
                  (
                      '[^11]: Nickelsburg, commentary on 1 Enoch 15–16; Knibb, *The Ethiopic Book of Enoch*; древние версии locus. Текстовая модель происхождения духов может быть описана исторически, но не переносится автоматически в новозаветную демонологию.',
                      '[^11]: Nickelsburg, commentary on 1 Enoch 15–16; Knibb, *The Ethiopic Book of Enoch*, vols. 1–2. Эти издания поддерживают описание Еноховой модели; окончательное сопоставление всех версионных форм locus остаётся `HOLD`. Модель не переносится автоматически в новозаветную демонологию.',
                  ),
                  (
                      '[^26]: `1_ENOCH_LII_TEXTUAL_FORMS_VERSIONS_RECONSTRUCTIONS_AND_PUBLICATION_BOUNDARY`, `1_ENOCH_LII_CANONICAL_TENSION_AND_CONTRADICTION_MATRIX` и LIX claim-level source pass в Research. Управляющий порядок остаётся: произведение → слой → свидетель → язык/версия → реконструкция → каноническая оценка.',
                      '[^26]: Online Critical Pseudepigrapha, “Current State of the OCP Text,” “Corrections,” and manuscript bibliography; Michael A. Knibb, *The Ethiopic Book of Enoch*, vols. 1–2; George W. E. Nickelsburg, *1 Enoch 1*; George W. E. Nickelsburg and James C. VanderKam, *1 Enoch 2*; предыдущая статья серии о составе, свидетелях, версиях и реконструкциях 1 Еноха. Эти источники устанавливают произведение, свидетель, язык/версию и степень реконструкции; жанровая и каноническая категория является отдельной конфессиональной оценкой статьи. Управляющий порядок: произведение → слой → свидетель → язык/версия → реконструкция → жанр → каноническая оценка.',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              source = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = source.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one exact match, found {count}: {old[:120]}')
                  source = source.replace(old, new, 1)
              path.write_text(source, encoding='utf-8')

          workflow.unlink()
          PY

          git diff --check
          node scripts/genesis6-enoch-footnote-gate.mjs

      - name: Commit exact patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/content/articles/kniga-enoha-kotoroy-ne-bylo-kak-raznye-proizvedeniya-stali-korpusom.mdx \
            src/content/articles/mozhno-li-doveryat-1-enohu-kanonicheskiy-audit.mdx \
            .github/workflows/agent-one-shot-enoch-source-audit.yml
          git commit -m "docs(enoch): replace internal and vague reader citations"
          git push origin HEAD:agent/genesis-6-enoch-source-audit-continuation-2026-07-28
