name: Route Registry Validators

on:
  push:
    branches:
      - lane/system-route-registry-validators-v2-2026-07-09
  pull_request:
    branches: [main]
    paths:
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "data/series.json"
      - "data/nagornaya/source-registry*.json"
      - "migration/page-ownership.json"
      - "migration/route-migration-matrix.json"
      - "src/content/**"
      - "src/pages/**"
      - "src/components/article-pilots/**"
      - "src/components/article-pilots/_shared/mobileChromeRegistry.ts"
      - "src/components/article-pilots/_shared/series/SeriesReaderChrome.astro"
      - "src/components/article-pilots/gill-series/GillSeriesChrome.astro"
      - "src/components/nagornaya/**"
      - "css/**"
      - "js/**"
      - "feed.xml"
      - "sitemap.xml"
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-pro.js"
      - "scripts/audit-pro-source-corpus-test.js"
      - "scripts/lib/audit-pro-source-corpus.js"
      - "scripts/seo-audit.js"
      - "scripts/dist-jsonld-audit.js"
      - "scripts/check-route-profiles.js"
      - "scripts/check-route-migration-matrix.js"
      - "scripts/check-content-source-coverage.js"
      - "scripts/install-effective-route-registry.js"
      - "scripts/route-profile-contract-audit.js"
      - "scripts/route-migration-matrix-contract-audit.js"
      - "scripts/content-source-provenance-audit.js"
      - "scripts/public-surface-registry-audit.js"
      - "scripts/public-surface-registry-regression-test.js"
      - "scripts/rss-feed-normalizer.js"
      - "scripts/rss-feed-normalizer-test.js"
      - "scripts/rss-route-contract-test.js"
      - "scripts/search-index-policy-contract-test.js"
      - "scripts/search-index-policy-inventory.js"
      - "scripts/search-manifest-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer-test.js"
      - "scripts/sitemap-route-contract-test.js"
      - "scripts/seo-route-contract-test.js"
      - "scripts/public-surface-browser-matrix.mjs"
      - "scripts/public-surface-browser-diagnostics.mjs"
      - "scripts/route-semantics-browser-test.mjs"
      - "scripts/nagornaya-source-integrity-regression-test.js"
      - "scripts/nagornaya-source-registry-test.js"
      - "scripts/nagornaya-epistemic-ui-browser-test.mjs"
      - "scripts/lib/public-surface-registry.js"
      - "scripts/lib/rss-route-contract.js"
      - "scripts/lib/search-index-policy-contract.js"
      - "scripts/lib/sitemap-route-contract.js"
      - "scripts/lib/seo-route-contract.js"
      - "scripts/lib/route-source-contract.js"
      - "scripts/lib/route-matrix-normalizer.js"
      - "scripts/lib/effective-route-registry.js"
      - "scripts/sync-route-migration-matrix.js"
      - ".github/workflows/route-registry-validators.yml"
      - ".github/workflows/search-manifest-policy.yml"
  workflow_dispatch:

concurrency:
  group: route-registry-validators-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  materialize-source-corpus:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/audit-pro-source-corpus' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/audit-pro-source-corpus
          fetch-depth: 0

      - name: Materialize registry-owned source corpus
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY'
          from pathlib import Path

          debug = []
          audit = Path('scripts/audit-pro.js')
          source = audit.read_text(encoding='utf-8')
          if "require('./lib/audit-pro-source-corpus')" in source:
              debug.append('already materialized')
              Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise SystemExit(0)

          old_require = "const { auditSitemapCoverage, contractProblems } = require('./lib/sitemap-route-contract');\n"
          debug.append(f'require count={source.count(old_require)}')
          if source.count(old_require) != 1:
              Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise SystemExit('unexpected sitemap require count')
          source = source.replace(
              old_require,
              old_require + "const { buildPublicSurfaceRegistry } = require('./lib/public-surface-registry');\nconst { buildAuditProSourceCorpus } = require('./lib/audit-pro-source-corpus');\n",
              1,
          )

          old_corpus = """const allFiles = walk(ROOT);
          const htmlFiles = allFiles.filter(p => p.endsWith('.html') && !/[\\/]scripts[\\/]/.test(p)).sort();
          const htmlPages = htmlFiles.filter(p => !verificationFileRe.test(rel(p)));
          """
          debug.append(f'corpus count={source.count(old_corpus)}')
          if source.count(old_corpus) != 1:
              Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise SystemExit('unexpected legacy HTML corpus block count')
          new_corpus = """const allFiles = walk(ROOT);
          const allHtmlFiles = allFiles.filter(p => p.endsWith('.html') && !/[\\/]scripts[\\/]/.test(p)).sort();
          const surfaceRegistry = buildPublicSurfaceRegistry();
          for (const error of surfaceRegistry.errors) R.err(`Public surface registry: ${error}`);
          const sourceCorpus = buildAuditProSourceCorpus({
            root: ROOT,
            entries: surfaceRegistry.entries,
            allHtmlFiles,
          });
          const htmlFiles = sourceCorpus.sourcePages.map((item) => item.file).sort();
          const htmlPages = htmlFiles;

          if (sourceCorpus.duplicateRootMappings.length) {
            for (const item of sourceCorpus.duplicateRootMappings) {
              R.err(`Duplicate route-to-root mapping: ${item.routes.join(' + ')} -> ${rel(item.file)}`);
            }
          }
          if (sourceCorpus.unregisteredRootHtml.length) {
            R.err(`Unregistered root HTML outside the canonical route registry:\n  - ${sourceCorpus.unregisteredRootHtml.map((item) => item.relative).join('\\n  - ')}`);
          } else {
            R.ok(`Source HTML corpus is registry-owned (${htmlPages.length} committed production shadows)`);
          }
          R.note(`Production HTML corpus: ${sourceCorpus.productionRoutes} routes = ${htmlPages.length} committed source shadows + ${sourceCorpus.distOnly.length} dist-only routes delegated to mandatory production contracts`);
          if (sourceCorpus.registeredNonProduction.length) {
            R.note(`Registered non-production root HTML excluded from public source checks: ${sourceCorpus.registeredNonProduction.map((item) => item.route).join(', ')}`);
          }
          """
          source = source.replace(old_corpus, new_corpus, 1)

          walk_expr = r"walk(ROOT).filter(f => f.endsWith('.html') && !/[\/]scripts[\/]/.test(f))"
          walk_count = source.count(walk_expr)
          debug.append(f'repeated HTML walk count={walk_count}')
          if walk_count < 1:
              Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise SystemExit('repeated HTML walk matcher found nothing')
          source = source.replace(walk_expr, 'htmlPages')

          old_quote = """  for (const file of htmlFiles) {
            if (!file.startsWith('articles/') && !file.startsWith('nagornaya/')) continue;
            const html = read(file);
          """
          debug.append(f'quote loop count={source.count(old_quote)}')
          if source.count(old_quote) != 1:
              Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
              raise SystemExit('unexpected Russian quote policy loop count')
          source = source.replace(
              old_quote,
              """  for (const page of htmlFiles) {
            const file = rel(page);
            if (!file.startsWith('articles/') && !file.startsWith('nagornaya/')) continue;
            const html = fs.readFileSync(page, 'utf8');
          """,
              1,
          )
          source = source.replace(
              ' * - SEO/PWA/resource/link basics\n',
              ' * - source-shadow contracts; production breadth is delegated to mandatory registry/dist gates\n',
              1,
          )
          audit.write_text(source, encoding='utf-8')
          debug.append('materialization written')
          Path('reports/materializer-debug.txt').write_text('\n'.join(debug) + '\n', encoding='utf-8')
          PY

          node --check scripts/audit-pro.js
          node scripts/audit-pro-source-corpus-test.js
          git diff --check
          if git diff --quiet; then
            echo 'No materialization changes required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-pro.js
          git commit -m "fix(audit): make source HTML corpus registry-owned"
          git push origin HEAD:agent/audit-pro-source-corpus

      - name: Upload materializer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-pro-materializer-${{ github.run_id }}
          path: reports/materializer-debug.txt
          if-no-files-found: warn
          retention-days: 2

  registry-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Validate effective matrix contract without writing
        run: node scripts/sync-route-migration-matrix.js --check

      - name: Route profile contract
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node -r ./scripts/install-effective-route-registry.js \
            scripts/route-profile-contract-audit.js --strict 2>&1 \
            | tee reports/route-profile-contract.log

      - name: Public surface, sitemap, RSS, SEO and policy mutations
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            npm run surface:registry:check
            npm run surface:registry:test
            node scripts/sitemap-route-contract-test.js
            node scripts/rss-route-contract-test.js
            node scripts/rss-feed-normalizer.js --check
            node scripts/seo-route-contract-test.js
            node scripts/search-index-policy-contract-test.js
            node scripts/audit-pro-source-corpus-test.js
            node scripts/audit-pro.js
          } 2>&1 | tee reports/public-surface-registry.log

      - name: Migration matrix contract
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node -r ./scripts/install-effective-route-registry.js \
            scripts/route-migration-matrix-contract-audit.js --strict 2>&1 \
            | tee reports/route-migration-matrix-contract.log

      - name: Content source provenance
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node -r ./scripts/install-effective-route-registry.js \
            scripts/content-source-provenance-audit.js --strict 2>&1 \
            | tee reports/content-source-provenance.log

      - name: Compatibility command surface
        if: always()
        shell: bash
        run: |
          set -o pipefail
          {
            node scripts/check-route-profiles.js --strict
            node scripts/check-route-migration-matrix.js --strict
            node scripts/check-content-source-coverage.js --strict
          } 2>&1 | tee reports/route-registry-compatibility.log

      - name: Verify all validators are read-only
        if: always()
        run: git diff --exit-code

      - name: Upload registry diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-registry-validators-${{ github.run_id }}
          path: |
            reports/*.log
            reports/rss-route-contract.json
            data/route-search-policy.json
            data/search-manifest.json
            migration/route-migration-matrix.json
          if-no-files-found: error
          retention-days: 7

  public-surface-browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Audit registry-derived production SEO
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/dist-jsonld-audit.js --root dist 2>&1 | tee reports/seo-dist.log

      - name: Enforce production search and index policy
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test every public surface in Chromium
        env:
          GB_MATRIX_WORKERS: "4"
        run: node scripts/public-surface-browser-matrix.mjs

      - name: Test route semantics in Chromium
        run: node scripts/route-semantics-browser-test.mjs

      - name: Test Nagornaya epistemic UI in Chromium
        run: node scripts/nagornaya-epistemic-ui-browser-test.mjs

      - name: Diagnose overflowing routes
        if: ${{ failure() && hashFiles('reports/public-surface-browser-matrix.json') != '' }}
        shell: bash
        run: |
          python3 -m http.server 4177 --bind 127.0.0.1 --directory dist >/tmp/public-surface-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:4177/ >/dev/null
          node scripts/public-surface-browser-diagnostics.mjs \
            reports/public-surface-browser-matrix.json \
            http://127.0.0.1:4177

      - name: Upload browser, SEO and search-policy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-surface-browser-matrix-${{ github.run_id }}
          path: |
            reports/seo-dist.log
            reports/search-index-policy-inventory.json
            reports/search-index-policy-inventory.md
            reports/public-surface-browser-matrix.json
            reports/public-surface-browser-matrix.md
            reports/route-semantics-browser.json
            reports/nagornaya-epistemic-ui-browser.json
            reports/public-surface-browser-diagnostics/**
          if-no-files-found: error
          retention-days: 14
