name: TEMP map war witness corrector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  correct:
    if: github.head_ref == 'lane/system-map-layers-theme-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Correct default-off war witness
        run: python3 scripts/_temp_correct_map_war_witness.py

      - name: Verify browser harness syntax
        run: node --check scripts/map-layers-theme-browser-smoke.js

      - name: Commit permanent witness correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/map-layers-theme-browser-smoke.js
          git commit -m "[LANE lane/system-map-layers-theme-2026-07-21] test(karty): honor default-off war layer"
          git push origin HEAD:lane/system-map-layers-theme-2026-07-21
