name: TEMP Avraam retraction closure

on:
  push:
    branches:
      - fix/avraam-tall-el-hammam-retraction-parity-20260809
    paths:
      - '.github/workflows/avraam-retraction-closure-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/avraam-tall-el-hammam-retraction-parity-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Close Tall el-Hammam variant residual at both data surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          stale_note = 'Гипотеза строится на видимости долины с Бет-Эля и разрушении города.'
          fixed_note = 'Северная идентификация опирается прежде всего на топографическую реконструкцию Коллинза; разрушение города и отозванная airburst-модель 2021 года не являются установленным положительным доказательством идентификации Содома.'
          stale_source = 'Collins, Discovering the City of Sodom (2013); Bunch et al., Sci. Reports 2021'
          fixed_source = 'Collins, Discovering the City of Sodom (2013); Bunch et al., Sci. Reports 2021 (отозвана 24.04.2025); критика — Boslough и др.'

          route_path = Path('karty/avraam/route.json')
          route = route_path.read_text(encoding='utf-8')
          old_route = f'"note": "{stale_note}",\n        "sources": "{stale_source}"'
          new_route = f'"note": "{fixed_note}",\n        "sources": "{fixed_source}"'
          if route.count(old_route) != 1:
              raise SystemExit(f'route.json: expected one stale Hammam candidate pair, found {route.count(old_route)}')
          route_path.write_text(route.replace(old_route, new_route, 1), encoding='utf-8')

          app_path = Path('karty/avraam/avraam-app.js')
          app = app_path.read_text(encoding='utf-8')
          old_app = f'"note": "{stale_note}"'
          new_app = f'"note": "{fixed_note}",\n      "sources": "{fixed_source}"'
          if app.count(old_app) != 1:
              raise SystemExit(f'avraam-app.js: expected one stale Hammam candidate note, found {app.count(old_app)}')
          app_path.write_text(app.replace(old_app, new_app, 1), encoding='utf-8')

          audit_path = Path('scripts/avraam-map-audit.js')
          audit = audit_path.read_text(encoding='utf-8')

          const_anchor = "const HAMMAM_OLD_POSITIVE_PHRASE = 'со следами мощного разрушительного события';"
          const_repl = const_anchor + "\nconst HAMMAM_VARIANT_STALE_NOTE = 'Гипотеза строится на видимости долины с Бет-Эля и разрушении города.';\nconst HAMMAM_VARIANT_RETRACTION_MARKER = 'отозвана 24.04.2025';\nconst HAMMAM_VARIANT_NO_POSITIVE_EVIDENCE = 'не являются установленным положительным доказательством';"
          if audit.count(const_anchor) != 1:
              raise SystemExit('audit: Hammam constant anchor drift')
          audit = audit.replace(const_anchor, const_repl, 1)

          fn_anchor = "function sodomStaticStage(source) {"
          fn_insert = """function hammamVariantRow(container) {
            return container?.hammam?.find(row => row?.title === 'Талл эль-Хаммам как северный Содом') || null;
          }

          function hasHammamVariantRetraction(container) {
            const row = hammamVariantRow(container);
            if (!row) return false;
            const text = `${String(row.note || '')} ${String(row.sources || '')}`;
            return text.includes(HAMMAM_VARIANT_RETRACTION_MARKER)
              && text.includes(HAMMAM_VARIANT_NO_POSITIVE_EVIDENCE)
              && !text.includes(HAMMAM_VARIANT_STALE_NOTE);
          }

          """ + fn_anchor
          if audit.count(fn_anchor) != 1:
              raise SystemExit('audit: sodomStaticStage anchor drift')
          audit = audit.replace(fn_anchor, fn_insert, 1)

          route_assert_anchor = "  assert('mutation: removing Tall el-Hammam route retraction is rejected', !hasCanonicalHammamRetraction(mutatedHammamRoute));"
          route_assert_repl = route_assert_anchor + "\n\n  assert('route Tall el-Hammam scientific candidate exposes retraction boundary', hasHammamVariantRetraction(route.scientific_variants));\n  const mutatedHammamVariants = JSON.parse(JSON.stringify(route.scientific_variants));\n  const mutatedHammamVariant = hammamVariantRow(mutatedHammamVariants);\n  if (mutatedHammamVariant) {\n    mutatedHammamVariant.note = HAMMAM_VARIANT_STALE_NOTE;\n    mutatedHammamVariant.sources = String(mutatedHammamVariant.sources || '').replace(HAMMAM_VARIANT_RETRACTION_MARKER, 'airburst claim retained');\n  }\n  assert('mutation: stale route Tall el-Hammam scientific candidate is rejected', !hasHammamVariantRetraction(mutatedHammamVariants));"
          if audit.count(route_assert_anchor) != 1:
              raise SystemExit('audit: route retraction assertion anchor drift')
          audit = audit.replace(route_assert_anchor, route_assert_repl, 1)

          inline_anchor = "  assert('scientific variant statuses are canonical', variantRows.every(v => statuses.has(v.status)));"
          inline_repl = inline_anchor + "\n  assert('inline Tall el-Hammam scientific candidate exposes retraction boundary', hasHammamVariantRetraction(SCIENCE_VARIANTS));\n  const mutatedInlineVariants = JSON.parse(JSON.stringify(SCIENCE_VARIANTS));\n  const mutatedInlineHammam = hammamVariantRow(mutatedInlineVariants);\n  if (mutatedInlineHammam) {\n    mutatedInlineHammam.note = HAMMAM_VARIANT_STALE_NOTE;\n    mutatedInlineHammam.sources = String(mutatedInlineHammam.sources || '').replace(HAMMAM_VARIANT_RETRACTION_MARKER, 'airburst claim retained');\n  }\n  assert('mutation: stale inline Tall el-Hammam scientific candidate is rejected', !hasHammamVariantRetraction(mutatedInlineVariants));"
          if audit.count(inline_anchor) != 1:
              raise SystemExit('audit: inline variant assertion anchor drift')
          audit = audit.replace(inline_anchor, inline_repl, 1)
          audit_path.write_text(audit, encoding='utf-8')
          PY

      - name: Prove bounded semantic mutation
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' 'karty/avraam/avraam-app.js' 'karty/avraam/route.json' 'scripts/avraam-map-audit.js' | sort)"
          node scripts/avraam-map-audit.js

      - name: Commit exact closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/avraam/avraam-app.js karty/avraam/route.json scripts/avraam-map-audit.js
          git commit -m 'fix(avraam): close Hammam scientific variant retraction residual'
          git push origin HEAD:fix/avraam-tall-el-hammam-retraction-parity-20260809
