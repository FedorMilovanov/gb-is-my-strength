name: A03 NoteRegistry Projection

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "js/site.js"
      - "scripts/site-tooltip-touch-normalizer.js"
      - "scripts/note-print-normalizer.js"
      - "scripts/lib/note-registry.mjs"
      - "scripts/note-registry-contract-test.mjs"
      - "src/**"
      - "**/*.html"
      - ".github/workflows/a03-note-registry-projection.yml"

permissions:
  contents: read

concurrency:
  group: a03-note-registry-projection-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  projection-autofix:
    name: Project reviewed NoteRegistry sources
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Validate normalizer syntax
        run: |
          node --check scripts/site-tooltip-touch-normalizer.js
          node --check scripts/note-print-normalizer.js

      - name: Project reviewed sources
        run: |
          node scripts/site-tooltip-touch-normalizer.js --write
          node scripts/note-print-normalizer.js --write
          node scripts/cache-bust.js --write

      - name: Validate projected tree
        run: |
          node scripts/site-tooltip-touch-normalizer.js
          node scripts/note-print-normalizer.js
          node scripts/note-registry-contract-test.mjs
          node scripts/cache-bust.js
          git diff --check

      - name: Enforce projection boundary
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              js/site.js|scripts/lib/note-registry.mjs|scripts/note-registry-contract-test.mjs|src/lib/asset-version.js|*.html|src/*.astro|src/**/*.astro)
                ;;
              *)
                echo "Unexpected projection path: $path" >&2
                exit 1
                ;;
            esac
          done < <(git diff --name-only)

      - name: Commit projection and remove one-shot workflow
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/a03-note-registry-projection.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(notes): project WebKit and empty-endnotes contracts"
          git push origin "HEAD:${HEAD_REF}"
