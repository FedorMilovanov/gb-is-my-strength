name: TEMP Finalize Single Deploy Owner

on:
  push:
    branches:
      - fix/pages-trigger-topology-2026-07-22

permissions:
  contents: write

concurrency:
  group: temp-finalize-single-deploy-owner
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[single-owner]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-trigger-topology-2026-07-22
          fetch-depth: 0

      - name: Materialize one-owner topology and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('.github/workflows/indexnow.yml')
          text = index.read_text(encoding='utf-8')
          anchor = "      - 'data/**'\n"
          addition = """      # Every production-impacting path is readiness-owned. Deploy has no
      # automatic push trigger, so mixed source/asset commits still create one run.
      - 'images/**'
      - 'fonts/**'
      - 'icons/**'
      - 'konfessii/**'
      - 'karty/**'
      - 'map/**'
      - 'biografii/**'
      - 'hard-texts/**'
      - '.nojekyll'
      - 'favicon*'
      - 'apple-touch-icon.png'
      - 'CNAME'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/indexnow.yml'
"""
          if text.count(anchor) != 1:
              raise SystemExit(f'indexnow anchor count: {text.count(anchor)}')
          if "      - 'images/**'\n" not in text:
              text = text.replace(anchor, anchor + addition, 1)
          index.write_text(text, encoding='utf-8')

          check = Path('scripts/check-workflows.js')
          text = check.read_text(encoding='utf-8')
          start = text.index('// Source/build changes have exactly one trigger owner: readiness.')
          end = text.index('\n// Visual parity and shared-files guards', start)
          replacement = """// Every production-impacting path has exactly one automatic trigger owner:
// readiness. Deploy follows only through workflow_run; a top-level deploy.push
// would recreate cancellation races for mixed source/asset commits.
const readinessOwnedPushPaths = [
  'src/**', 'data/**', 'baptisty-rossii/**', 'scripts/**', 'css/**', 'js/**',
  'sitemap.xml', 'feed.xml', 'astro.config.mjs', 'tsconfig.json', 'migration/**',
  'package.json', 'package-lock.json',
  'images/**', 'fonts/**', 'icons/**', 'konfessii/**', 'karty/**', 'map/**',
  'biografii/**', 'hard-texts/**', '.nojekyll', 'favicon*',
  'apple-touch-icon.png', 'CNAME', '.github/workflows/deploy.yml',
  '.github/workflows/indexnow.yml',
];
for (const glob of readinessOwnedPushPaths) {
  must('.github/workflows/indexnow.yml', indexnow, pushPathRx(glob), `readiness paths must include ${glob}`);
}
mustNot(
  '.github/workflows/deploy.yml',
  deploy,
  /^\\s{2}push:\\s*$/m,
  'deploy must not declare an automatic push trigger; readiness is the sole automatic owner',
);
"""
          check.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          linkage = Path('scripts/workflow-linkage-regression-test.js')
          text = linkage.read_text(encoding='utf-8')
          text = text.replace("const deployPaths = pushPaths(deploy, DEPLOY_PATH);\n", "")
          start = text.index('const requiredReadinessPaths = [')
          end = text.index('\nconsole.log(`✅ workflow linkage:', start)
          replacement = """const requiredReadinessPaths = [
  'src/**', 'data/**', 'baptisty-rossii/**', 'scripts/**', 'css/**', 'js/**',
  'sitemap.xml', 'feed.xml', 'astro.config.mjs', 'tsconfig.json', 'migration/**',
  'package.json', 'package-lock.json',
  'images/**', 'fonts/**', 'icons/**', 'konfessii/**', 'karty/**', 'map/**',
  'biografii/**', 'hard-texts/**', '.nojekyll', 'favicon*',
  'apple-touch-icon.png', 'CNAME', '.github/workflows/deploy.yml',
  '.github/workflows/indexnow.yml',
];
for (const glob of requiredReadinessPaths) {
  assert.ok(readinessPaths.includes(glob), `${READINESS_PATH}: push.paths must include ${glob}`);
}
assert.doesNotMatch(
  deploy,
  /^\\s{2}push:\\s*$/m,
  `${DEPLOY_PATH}: automatic push trigger is forbidden; readiness is the sole owner`,
);
"""
          text = text[:start] + replacement + text[end:]
          text = text.replace("console.log(`✅ readiness-owned paths: ${readinessPaths.length}; direct asset paths: ${deployPaths.length}; overlap: 0`);", "console.log(`✅ single automatic deploy owner: readiness (${readinessPaths.length} path classes); deploy.push absent`);")
          linkage.write_text(text, encoding='utf-8')
          PY

          node scripts/workflow-linkage-regression-test.js
          node scripts/check-workflows.js
          git diff --check

      - name: Publish permanent files
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/indexnow.yml scripts/check-workflows.js scripts/workflow-linkage-regression-test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[single-owner] cover all production paths through readiness'
          git push origin HEAD:fix/pages-trigger-topology-2026-07-22
