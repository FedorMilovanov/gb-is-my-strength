name: Lazy Runtime Loader Failure State

on:
  pull_request:
    paths:
      - '.github/workflows/lazy-runtime-loader-failure-state.yml'
      - 'scripts/lazy-runtime-loader-failure-contract-test.js'
      - 'src/components/article-pilots/_shared/MobileChromePage.astro'
      - 'src/runtime/reader-tts.js'
      - 'js/floating-cluster-controller.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/lazy-runtime-loader-failure-state.yml'
      - 'scripts/lazy-runtime-loader-failure-contract-test.js'
      - 'src/components/article-pilots/_shared/MobileChromePage.astro'
      - 'src/runtime/reader-tts.js'
      - 'js/floating-cluster-controller.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lazy-runtime-loader-failure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Retry, terminal state and cross-loader dedup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check runtime syntax
        run: |
          node --check src/runtime/reader-tts.js
          node --check js/floating-cluster-controller.js
          node --check scripts/lazy-runtime-loader-failure-contract-test.js

      - name: Run failure-state contract
        run: node scripts/lazy-runtime-loader-failure-contract-test.js
