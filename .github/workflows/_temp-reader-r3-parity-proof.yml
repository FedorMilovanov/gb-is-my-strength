name: TEMP reader R3 parity proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-css-churn:
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Restore runtime CSS byte-for-byte from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- css/series-samizdat.css
          if git diff --quiet -- css/series-samizdat.css; then
            echo 'CSS already byte-identical to main.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/series-samizdat.css
          git commit -m 'chore(reader): avoid façade-only CSS cache churn'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

  output-parity:
    needs: cleanup-css-churn
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies once
        run: npm ci
      - name: Build façade head
        run: npm run strangler:build:production-like
      - name: Preserve representative head output
        shell: bash
        run: |
          mkdir -p /tmp/r3-head
          cp dist/articles/dzhon-gill-chast-1-chelovek/index.html /tmp/r3-head/gill.html
          cp dist/articles/novoe-serdce/index.html /tmp/r3-head/book.html
          cp dist/baptisty-rossii/dva-sezda-1884/index.html /tmp/r3-head/baptisty.html
      - name: Build exact main baseline
        shell: bash
        run: |
          git worktree add /tmp/r3-main origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/r3-main/node_modules
          npm --prefix /tmp/r3-main run strangler:build:production-like
      - name: Require structural output parity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import re
          import sys

          routes = {
              'gill': Path('/tmp/r3-main/dist/articles/dzhon-gill-chast-1-chelovek/index.html'),
              'book': Path('/tmp/r3-main/dist/articles/novoe-serdce/index.html'),
              'baptisty': Path('/tmp/r3-main/dist/baptisty-rossii/dva-sezda-1884/index.html'),
          }

          def normalize(text: str) -> str:
              text = re.sub(r'([?&]v=)[0-9a-fA-F]{8,64}', r'\1<asset-hash>', text)
              text = re.sub(r'>\s+<', '><', text)
              return text.strip()

          failed = False
          for name, base_path in routes.items():
              head_path = Path('/tmp/r3-head') / f'{name}.html'
              base = normalize(base_path.read_text(encoding='utf-8'))
              head = normalize(head_path.read_text(encoding='utf-8'))
              if base != head:
                  failed = True
                  print(f'::error::{name} structural output changed across façade-only migration')
                  diff = difflib.unified_diff(
                      base.splitlines(), head.splitlines(),
                      fromfile=f'main/{name}', tofile=f'head/{name}', lineterm=''
                  )
                  for line in list(diff)[:300]:
                      print(line)
              else:
                  print(f'PASS structural parity: {name}')
          if failed:
              sys.exit(1)
          PY

  engine-sweep:
    needs: cleanup-css-churn
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and Chromium
        shell: bash
        run: |
          npm ci
          npx playwright install chromium
          browser_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "$browser_path"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sfn "$browser_path" /opt/pw-browsers/chromium
          test -x /opt/pw-browsers/chromium
      - name: Build production-like target
        run: npm run strangler:build:production-like
      - name: Run full functional engine sweep
        run: npm run engine:sweep
