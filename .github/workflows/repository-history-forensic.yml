name: Repository History Forensic

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/repository-history-forensic-audit.mjs"
      - ".github/workflows/repository-history-forensic.yml"
  workflow_dispatch:

concurrency:
  group: repository-history-forensic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  history-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact head with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Validate audit syntax
        run: node --check scripts/repository-history-forensic-audit.mjs

      - name: Inventory branches and closed PR heads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository-history-forensic-audit.mjs --strict

      - name: Normalize evidence semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const jsonPath = 'reports/repository-history-forensic-audit.json';
          const mdPath = 'reports/repository-history-forensic-audit.md';
          const report = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
          const evidenceLanePattern = /(?:evidence[- ]lane|evidence[- ]only|not\s+(?:a\s+)?(?:merge\s+)?candidate|must\s+not\s+be\s+merged|не\s+кандидат\s+на\s+merge|не\s+будет\s+(?:см[её]ржен|опубликован)|не\s+сливать)/i;

          for (const pr of report.closedUnmerged || []) {
            const candidates = (pr.referencedPullRequests || []).filter((item) => item.mergedAt);
            pr.referencedMergedPrCandidates = candidates;
            delete pr.verifiedMergedReplacement;

            const evidence = [
              pr.title || '',
              ...(pr.closureComments || []).map((comment) => comment.body || ''),
            ].join('\n');
            if (pr.category === 'unclassified' && evidenceLanePattern.test(evidence)) {
              pr.category = 'diagnostic';
              pr.reviewPriority = 0;
            }
          }

          const closedByNumber = new Map((report.closedUnmerged || []).map((pr) => [pr.number, pr]));
          for (const branch of report.branches || []) {
            for (const associated of branch.associatedPrs || []) {
              const closed = closedByNumber.get(associated.number);
              if (closed) associated.category = closed.category;
            }

            if (
              branch.reconciliation === 'closed-unclassified-pr-head' &&
              (branch.associatedPrs || []).some((pr) => pr.category === 'diagnostic')
            ) {
              branch.reconciliation = 'closed-diagnostic-pr-head';
            } else if (
              branch.reconciliation === 'orphan-branch' &&
              /(?:trigger|materializ|diagnostic|verification|reconcile|_temp|temp-)/i.test(`${branch.name} ${branch.subject || ''}`)
            ) {
              branch.reconciliation = 'diagnostic-transaction-branch';
            }
          }

          report.summary.unexplainedRemoteBranches = (report.branches || []).filter((branch) =>
            ['orphan-branch', 'closed-unclassified-pr-head'].includes(branch.reconciliation)
          ).length;
          report.summary.explainedClosedBranches = (report.branches || []).filter((branch) =>
            branch.reconciliation.startsWith('closed-') || branch.reconciliation === 'diagnostic-transaction-branch'
          ).length;
          report.summary.manualReviewCandidates = (report.closedUnmerged || []).filter((pr) => pr.reviewPriority > 0).length;

          let md = fs.readFileSync(mdPath, 'utf8');
          md = md.replace(
            /- Orphan or unclassified remote branch refs: \d+/,
            `- Orphan or unclassified remote branch refs: ${report.summary.unexplainedRemoteBranches}`
          );
          md = md.replace(
            /- Closed\/superseded\/diagnostic\/prototype branch refs: \d+/,
            `- Closed/superseded/diagnostic/prototype branch refs: ${report.summary.explainedClosedBranches}`
          );
          md = md.replace(
            /- Manual review candidates: \d+/,
            `- Manual review candidates: ${report.summary.manualReviewCandidates}`
          );
          md = md.replace(/Verified merged replacement/g, 'Referenced merged PR candidates');

          const prByNumber = new Map((report.closedUnmerged || []).map((pr) => [String(pr.number), pr]));
          const branchByName = new Map((report.branches || []).map((branch) => [branch.name, branch]));
          md = md.split('\n').map((line) => {
            const prMatch = line.match(/^\| #(\d+) \|/);
            if (prMatch) {
              const pr = prByNumber.get(prMatch[1]);
              if (pr) {
                const parts = line.split('|');
                parts[2] = ` ${pr.category} `;
                parts[6] = ` ${(pr.referencedMergedPrCandidates || []).map((item) => `#${item.number}`).join(', ') || '—'} `;
                parts[7] = ` ${pr.reviewPriority} `;
                return parts.join('|');
              }
            }

            const branchMatch = line.match(/^\| `([^`]+)` \|/);
            if (branchMatch) {
              const branch = branchByName.get(branchMatch[1]);
              if (branch) {
                const parts = line.split('|');
                parts[2] = ` ${branch.reconciliation} `;
                return parts.join('|');
              }
            }
            return line;
          }).join('\n');

          fs.writeFileSync(jsonPath, `${JSON.stringify(report, null, 2)}\n`);
          fs.writeFileSync(mdPath, md);
          NODE

      - name: Verify normalized report semantics
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('reports/repository-history-forensic-audit.json', 'utf8'));
          const evidenceLanePattern = /(?:evidence[- ]lane|evidence[- ]only|not\s+(?:a\s+)?(?:merge\s+)?candidate|must\s+not\s+be\s+merged|не\s+кандидат\s+на\s+merge|не\s+будет\s+(?:см[её]ржен|опубликован)|не\s+сливать)/i;
          if ((report.closedUnmerged || []).some((pr) => 'verifiedMergedReplacement' in pr)) {
            throw new Error('stale verifiedMergedReplacement field survived normalization');
          }
          if ((report.closedUnmerged || []).some((pr) => pr.category === 'unclassified' && evidenceLanePattern.test([pr.title || '', ...(pr.closureComments || []).map((comment) => comment.body || '')].join('\n')))) {
            throw new Error('closed evidence lane remains classified as unclassified');
          }
          if ((report.branches || []).some((branch) => branch.reconciliation === 'orphan-branch' && /(?:trigger|materializ|diagnostic|verification|reconcile|_temp|temp-)/i.test(`${branch.name} ${branch.subject || ''}`))) {
            throw new Error('diagnostic transaction branch remains classified as orphan');
          }
          NODE

      - name: Verify tracked tree is unchanged
        run: git diff --exit-code

      - name: Upload forensic inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-history-forensic-${{ github.run_id }}
          path: |
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          if-no-files-found: error
          retention-days: 30
