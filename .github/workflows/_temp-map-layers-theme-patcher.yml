name: TEMP map layers theme patcher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'lane/system-map-layers-theme-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Correct exact patch signature
        run: python3 scripts/_temp_correct_map_layers_theme_patcher.py

      - name: Apply exact engine patch
        id: apply
        shell: bash
        run: |
          set +e
          python3 scripts/_temp_apply_map_layers_theme.py > map-layers-theme-patch.log 2>&1
          status=$?
          cat map-layers-theme-patch.log
          exit "$status"

      - name: Upload exact patch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-layers-theme-patch-log
          path: map-layers-theme-patch.log
          retention-days: 1

      - name: Verify syntax and pure contracts
        run: |
          node --check karty/_engine/map-engine.js
          node scripts/map-layers-theme-regression-test.js

      - name: Commit engine source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karty/_engine/map-engine.js
          git commit -m "[LANE lane/system-map-layers-theme-2026-07-21] fix(karty): restore layers and map palette"
          git push origin HEAD:lane/system-map-layers-theme-2026-07-21
