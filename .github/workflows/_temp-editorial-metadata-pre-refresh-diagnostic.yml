name: TEMP Editorial metadata pre-refresh diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/_temp-editorial-metadata-pre-refresh-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact diagnostic head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare immediate pre-refresh registry
        shell: bash
        env:
          BASELINE_SHA: 6e8562dfe5d3d2a9c87bc611b21c5220c6b2aa61
        run: |
          set -euo pipefail
          out='reports/editorial-metadata-pre-refresh'
          mkdir -p "$out"
          git show "$BASELINE_SHA:data/editorial-metadata.json" > "$out/baseline.json"
          cp data/editorial-metadata.json "$out/current.json"
          git diff --no-ext-diff --unified=3 "$BASELINE_SHA..HEAD" -- data/editorial-metadata.json > "$out/full-git-diff.patch"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const out = 'reports/editorial-metadata-pre-refresh';
          const before = JSON.parse(fs.readFileSync(path.join(out, 'baseline.json'), 'utf8'));
          const after = JSON.parse(fs.readFileSync(path.join(out, 'current.json'), 'utf8'));
          const searchRoutes = new Set([
            '/articles/chto-bibliya-nazyvaet-serdcem/',
            '/articles/novoe-serdce/',
            '/articles/serdce-i-duh/',
            '/articles/serdce-spravochnik/',
          ]);
          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const scalar = (v) => v === null || ['string', 'number', 'boolean'].includes(typeof v);
          function flatten(v, prefix = '', result = new Map()) {
            if (scalar(v) || Array.isArray(v)) { result.set(prefix, v); return result; }
            for (const key of Object.keys(v || {}).sort()) flatten(v[key], prefix ? `${prefix}.${key}` : key, result);
            return result;
          }
          function classify(route, field, oldValue, newValue) {
            if (field === 'observations.rssPublishedAt' && oldValue === '2026-07-14T18:00:00.000Z' && newValue === '2026-07-11T21:00:00.000Z') return 'proven-rss-projection';
            if (searchRoutes.has(route) && ['observations.searchPublishedAt', 'observations.searchModifiedAt'].includes(field) && oldValue === null && newValue !== null) return 'proven-search-projection';
            if (field.startsWith('observations.')) return 'other-observation';
            if (['editorialPublishedAt', 'editorialModifiedAt', 'reviewStatus'].includes(field)) return 'editorial-governance';
            return 'record-structure';
          }
          const routesBefore = Object.keys(before.records || {}).sort();
          const routesAfter = Object.keys(after.records || {}).sort();
          const changes = [];
          for (const route of routesBefore) {
            if (!after.records[route]) continue;
            const a = flatten(before.records[route]);
            const b = flatten(after.records[route]);
            for (const field of [...new Set([...a.keys(), ...b.keys()])].sort()) {
              const oldValue = a.has(field) ? a.get(field) : undefined;
              const newValue = b.has(field) ? b.get(field) : undefined;
              if (!same(oldValue, newValue)) changes.push({ route, field, before: oldValue, after: newValue, class: classify(route, field, oldValue, newValue) });
            }
          }
          const byClass = {}, byField = {};
          for (const c of changes) {
            byClass[c.class] = (byClass[c.class] || 0) + 1;
            byField[c.field] = (byField[c.field] || 0) + 1;
          }
          const governance = changes.filter((c) => c.class === 'editorial-governance');
          const proven = changes.filter((c) => c.class.startsWith('proven-'));
          const unexpected = changes.filter((c) => !c.class.startsWith('proven-') && c.class !== 'editorial-governance');
          const candidate = structuredClone(after);
          for (const c of governance) candidate.records[c.route][c.field] = c.before;
          const report = {
            schema: 1,
            baselineSha: '6e8562dfe5d3d2a9c87bc611b21c5220c6b2aa61',
            headSha: process.env.GITHUB_SHA || null,
            baselineSourceCommit: before.sourceCommit,
            currentSourceCommit: after.sourceCommit,
            baselineRecordCount: routesBefore.length,
            currentRecordCount: routesAfter.length,
            addedRoutes: routesAfter.filter((r) => !before.records[r]),
            removedRoutes: routesBefore.filter((r) => !after.records[r]),
            rootSourceCommitChanged: before.sourceCommit !== after.sourceCommit,
            counts: {
              totalChanges: changes.length,
              provenProjectionChanges: proven.length,
              governanceDrift: governance.length,
              unexpectedDrift: unexpected.length,
              byClass, byField,
            },
            changes,
          };
          fs.writeFileSync(path.join(out, 'field-class-report.json'), JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'governance-drift.json'), JSON.stringify(governance, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'unexpected-drift.json'), JSON.stringify(unexpected, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'candidate-governance-restored.json'), JSON.stringify(candidate, null, 2) + '\n');
          const summary = [
            `baseline records: ${routesBefore.length}`,
            `current records: ${routesAfter.length}`,
            `existing-record changes: ${changes.length}`,
            `proven projection changes: ${proven.length}`,
            `editorial governance drift: ${governance.length}`,
            `unexpected drift: ${unexpected.length}`,
            `classes: ${JSON.stringify(byClass)}`,
            `fields: ${JSON.stringify(byField)}`,
          ].join('\n');
          fs.writeFileSync(path.join(out, 'summary.txt'), summary + '\n');
          console.log(summary);
          NODE

          cat "$out/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pre-refresh evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-metadata-pre-refresh-${{ github.run_id }}
          path: reports/editorial-metadata-pre-refresh
          if-no-files-found: error
          retention-days: 14
