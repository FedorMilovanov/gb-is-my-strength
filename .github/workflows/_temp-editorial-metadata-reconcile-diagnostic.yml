name: TEMP Editorial metadata reconciliation diagnostic

on:
  push:
    branches:
      - agent/editorial-metadata-reconcile-20260727
    paths:
      - '.github/workflows/_temp-editorial-metadata-reconcile-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build field-class reconciliation report
        shell: bash
        env:
          BASELINE_SHA: e9faea5b1cc33e877a5971dcb2ad6a99209270de
        run: |
          set -euo pipefail
          out='reports/editorial-metadata-reconcile'
          mkdir -p "$out"
          git show "$BASELINE_SHA:data/editorial-metadata.json" > "$out/baseline.json"
          cp data/editorial-metadata.json "$out/current.json"
          git log --reverse --date=iso-strict --format='%H%x09%ad%x09%s' "$BASELINE_SHA..HEAD" -- data/editorial-metadata.json > "$out/file-history.tsv"
          git diff --no-ext-diff --unified=3 "$BASELINE_SHA..HEAD" -- data/editorial-metadata.json > "$out/full-git-diff.patch"

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const out = 'reports/editorial-metadata-reconcile';
          const baseline = JSON.parse(fs.readFileSync(path.join(out, 'baseline.json'), 'utf8'));
          const current = JSON.parse(fs.readFileSync(path.join(out, 'current.json'), 'utf8'));
          const searchRoutes = new Set([
            '/articles/chto-bibliya-nazyvaet-serdcem/',
            '/articles/novoe-serdce/',
            '/articles/serdce-i-duh/',
            '/articles/serdce-spravochnik/',
          ]);

          const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
          const scalar = (value) => value === null || ['string', 'number', 'boolean'].includes(typeof value);

          function flatten(value, prefix = '', result = new Map()) {
            if (scalar(value)) {
              result.set(prefix, value);
              return result;
            }
            if (Array.isArray(value)) {
              result.set(prefix, value);
              return result;
            }
            for (const key of Object.keys(value || {}).sort()) {
              flatten(value[key], prefix ? `${prefix}.${key}` : key, result);
            }
            return result;
          }

          function classify(route, field, before, after) {
            if (field === 'observations.rssPublishedAt' && before === '2026-07-14T18:00:00.000Z' && after === '2026-07-11T21:00:00.000Z') {
              return 'proven-rss-projection';
            }
            if (searchRoutes.has(route) && (field === 'observations.searchPublishedAt' || field === 'observations.searchModifiedAt') && before === null && after !== null) {
              return 'proven-search-projection';
            }
            if (field.startsWith('observations.')) return 'other-observation';
            if (field === 'editorialPublishedAt' || field === 'editorialModifiedAt' || field === 'reviewStatus') return 'editorial-governance';
            return 'record-structure';
          }

          const baselineRoutes = Object.keys(baseline.records || {}).sort();
          const currentRoutes = Object.keys(current.records || {}).sort();
          const addedRoutes = currentRoutes.filter((route) => !baseline.records[route]);
          const removedRoutes = baselineRoutes.filter((route) => !current.records[route]);
          const changes = [];

          for (const route of baselineRoutes) {
            const beforeRecord = baseline.records[route];
            const afterRecord = current.records[route];
            if (!afterRecord) continue;
            const beforeFields = flatten(beforeRecord);
            const afterFields = flatten(afterRecord);
            const fields = [...new Set([...beforeFields.keys(), ...afterFields.keys()])].sort();
            for (const field of fields) {
              const before = beforeFields.has(field) ? beforeFields.get(field) : undefined;
              const after = afterFields.has(field) ? afterFields.get(field) : undefined;
              if (same(before, after)) continue;
              changes.push({ route, field, before, after, class: classify(route, field, before, after) });
            }
          }

          const rootChanges = [];
          for (const key of ['version', 'policy', 'sourceCommit']) {
            if (!same(baseline[key], current[key])) rootChanges.push({ field: key, before: baseline[key], after: current[key] });
          }

          const countsByClass = {};
          const countsByField = {};
          for (const change of changes) {
            countsByClass[change.class] = (countsByClass[change.class] || 0) + 1;
            countsByField[change.field] = (countsByField[change.field] || 0) + 1;
          }

          const strictIssueScope = changes.filter((change) => change.class === 'proven-rss-projection' || change.class === 'proven-search-projection');
          const governanceDrift = changes.filter((change) => change.class === 'editorial-governance');
          const unexpectedExistingRecordDrift = changes.filter((change) => !['proven-rss-projection', 'proven-search-projection', 'editorial-governance'].includes(change.class));

          const candidate = structuredClone(current);
          for (const change of governanceDrift) {
            candidate.records[change.route][change.field] = change.before;
          }

          const report = {
            schema: 1,
            baselineSha: 'e9faea5b1cc33e877a5971dcb2ad6a99209270de',
            headSha: process.env.GITHUB_SHA || null,
            baselineSourceCommit: baseline.sourceCommit,
            currentSourceCommit: current.sourceCommit,
            baselineRecordCount: baselineRoutes.length,
            currentRecordCount: currentRoutes.length,
            addedRoutes,
            removedRoutes,
            rootChanges,
            counts: {
              totalExistingRecordFieldChanges: changes.length,
              provenProjectionChanges: strictIssueScope.length,
              governanceDrift: governanceDrift.length,
              unexpectedExistingRecordDrift: unexpectedExistingRecordDrift.length,
              byClass: countsByClass,
              byField: countsByField,
            },
            changes,
          };

          fs.writeFileSync(path.join(out, 'field-class-report.json'), JSON.stringify(report, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'governance-drift.json'), JSON.stringify(governanceDrift, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'unexpected-existing-record-drift.json'), JSON.stringify(unexpectedExistingRecordDrift, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'candidate-governance-restored.json'), JSON.stringify(candidate, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'changes.tsv'), [
            'class\troute\tfield\tbefore\tafter',
            ...changes.map((change) => [change.class, change.route, change.field, JSON.stringify(change.before), JSON.stringify(change.after)].join('\t')),
          ].join('\n') + '\n');

          const summary = [
            `baseline records: ${baselineRoutes.length}`,
            `current records: ${currentRoutes.length}`,
            `added routes: ${addedRoutes.length}`,
            `removed routes: ${removedRoutes.length}`,
            `existing-record field changes: ${changes.length}`,
            `proven projection changes: ${strictIssueScope.length}`,
            `editorial governance drift: ${governanceDrift.length}`,
            `unexpected existing-record drift: ${unexpectedExistingRecordDrift.length}`,
            `classes: ${JSON.stringify(countsByClass)}`,
            `fields: ${JSON.stringify(countsByField)}`,
          ].join('\n');
          fs.writeFileSync(path.join(out, 'summary.txt'), summary + '\n');
          console.log(summary);
          NODE

          cat "$out/summary.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: editorial-metadata-reconcile-${{ github.run_id }}
          path: reports/editorial-metadata-reconcile
          if-no-files-found: error
          retention-days: 14
