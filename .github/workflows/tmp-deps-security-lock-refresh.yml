name: Temporary dependency security lock refresh

on:
  push:
    branches:
      - agent/deps-security-lock-refresh-20260907
    paths:
      - .github/workflows/tmp-deps-security-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact helper head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Generate registry-authoritative repaired graph
        shell: bash
        run: |
          cp package-lock.json /tmp/base-lock.json
          npm audit fix --package-lock-only --ignore-scripts
          cp package-lock.json /tmp/registry-repaired-lock.json

      - name: Keep only the security dependency closure
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'));
          const repaired = JSON.parse(fs.readFileSync('/tmp/registry-repaired-lock.json', 'utf8'));
          const allowed = [
            'node_modules/baseline-browser-mapping',
            'node_modules/browserslist',
            'node_modules/caniuse-lite',
            'node_modules/electron-to-chromium',
            'node_modules/fast-uri',
            'node_modules/node-releases',
            'node_modules/update-browserslist-db',
          ];
          for (const key of allowed) {
            if (!repaired.packages[key]) throw new Error(`missing repaired package entry: ${key}`);
            base.packages[key] = repaired.packages[key];
          }
          fs.writeFileSync('package-lock.json', `${JSON.stringify(base, null, 2)}\n`);
          NODE

      - name: Prove surgical lock scope
        shell: bash
        run: |
          git diff --exit-code -- package.json
          node <<'NODE'
          const fs = require('fs');
          const base = JSON.parse(fs.readFileSync('/tmp/base-lock.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const allowed = new Set([
            'node_modules/baseline-browser-mapping',
            'node_modules/browserslist',
            'node_modules/caniuse-lite',
            'node_modules/electron-to-chromium',
            'node_modules/fast-uri',
            'node_modules/node-releases',
            'node_modules/update-browserslist-db',
          ]);
          const keys = new Set([...Object.keys(base.packages), ...Object.keys(next.packages)]);
          const changed = [...keys].filter((key) => JSON.stringify(base.packages[key]) !== JSON.stringify(next.packages[key]));
          const outside = changed.filter((key) => !allowed.has(key));
          if (outside.length) throw new Error(`unexpected lock entries changed: ${outside.join(', ')}`);
          if (changed.length !== allowed.size || changed.some((key) => !allowed.has(key))) {
            throw new Error(`security closure mismatch: ${changed.join(', ')}`);
          }
          if (JSON.stringify({ ...base, packages: null }) !== JSON.stringify({ ...next, packages: null })) {
            throw new Error('non-packages lock metadata changed');
          }
          console.log(`Surgical lock scope PASS: ${changed.length} package entries`);
          NODE

      - name: Install surgical immutable graph
        run: npm ci

      - name: Enforce repaired security contract
        shell: bash
        run: |
          mkdir -p reports/npm-security-refresh
          set +e
          npm audit --json > reports/npm-security-refresh/after.json
          status=$?
          set -e
          echo "$status" > reports/npm-security-refresh/after-exit.txt
          node scripts/npm-security-contract.mjs reports/npm-security-refresh/after.json
          npm ls browserslist fast-uri --all > reports/npm-security-refresh/ancestry.txt
          git diff -- package-lock.json > reports/npm-security-refresh/package-lock.diff
          test -s reports/npm-security-refresh/package-lock.diff

      - name: Commit generated surgical lock to helper branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh vulnerable transitive lock entries"
          git push origin HEAD:agent/deps-security-lock-refresh-20260907

      - name: Upload surgical evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deps-security-surgical-${{ github.run_id }}
          path: reports/npm-security-refresh/
          if-no-files-found: warn
          retention-days: 1
