name: TEMP Avraam Scripture index autofix

on:
  push:
    branches:
      - fix/avraam-tall-el-hammam-retraction-parity-20260809
    paths:
      - '.github/workflows/avraam-scripture-index-autofix-temp.yml'

permissions:
  contents: write

jobs:
  write-index:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/avraam-tall-el-hammam-retraction-parity-20260809
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.1
      - name: Run canonical writer and contract
        run: |
          node scripts/build-scripture-occurrence-index.mjs --write
          test "$(git diff --name-only | sort)" = "data/scripture-search-index.json"
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs
          git diff --check
      - name: Commit deterministic derivative
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/scripture-search-index.json
          git commit -m 'fix(scripture): regenerate index after Avraam evidence update'
          git push origin HEAD:fix/avraam-tall-el-hammam-retraction-parity-20260809
