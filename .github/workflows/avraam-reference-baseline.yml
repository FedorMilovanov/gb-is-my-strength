name: Avraam Reference Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/avraam-reference-baseline.mjs"
      - ".github/workflows/avraam-reference-baseline.yml"
      - "src/components/karty/avraam/**"
      - "src/pages/karty/avraam/**"
      - "karty/avraam/**"
      - "karty/_engine/**"
      - "css/**"
      - "js/**"

concurrency:
  group: avraam-reference-baseline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: "npm"

      - name: Validate exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          node --check scripts/avraam-reference-baseline.mjs
          python3 - <<'PY'
          import json, xml.etree.ElementTree as ET
          json.load(open('karty/avraam/route.json', encoding='utf-8'))
          ET.parse('karty/avraam/base.svg')
          PY
          test -z "$(git status --porcelain)"

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Validate baseline harness syntax
        run: node --check scripts/avraam-reference-baseline.mjs

      - name: Build production-like site
        run: npm run strangler:build:production-like

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --directory dist > /tmp/avraam-http.log 2>&1 &
          echo $! > /tmp/avraam-http.pid
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8090/karty/avraam/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/avraam-http.log
          exit 1

      - name: Capture macro, micro, geometry and interaction baseline
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          AVRAAM_BASELINE_OUT: reports/atlas/avraam-reference-baseline
        run: node scripts/avraam-reference-baseline.mjs

      - name: Preserve exact source snapshot
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          snapshot="reports/atlas/avraam-reference-baseline/source"
          mkdir -p "$snapshot/karty/_engine" "$snapshot/karty/avraam" "$snapshot/src/components/karty/avraam" "$snapshot/scripts"
          cp karty/_engine/map-engine.js "$snapshot/karty/_engine/map-engine.js"
          cp karty/avraam/route.json "$snapshot/karty/avraam/route.json"
          cp karty/avraam/base.svg "$snapshot/karty/avraam/base.svg"
          cp src/components/karty/avraam/AvraamMap.astro "$snapshot/src/components/karty/avraam/AvraamMap.astro"
          cp scripts/avraam-reference-baseline.mjs "$snapshot/scripts/avraam-reference-baseline.mjs"
          sha256sum \
            "$snapshot/karty/_engine/map-engine.js" \
            "$snapshot/karty/avraam/route.json" \
            "$snapshot/karty/avraam/base.svg" \
            "$snapshot/src/components/karty/avraam/AvraamMap.astro" \
            "$snapshot/scripts/avraam-reference-baseline.mjs" \
            > "$snapshot/SHA256SUMS.txt"

      - name: Record environment manifest
        if: always()
        shell: bash
        run: |
          mkdir -p reports/atlas/avraam-reference-baseline
          {
            echo "head_sha=${HEAD_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "node=$(node --version 2>/dev/null || true)"
            echo "npm=$(npm --version 2>/dev/null || true)"
            echo "chromium=$(npx playwright --version 2>/dev/null || true)"
          } > reports/atlas/avraam-reference-baseline/ENVIRONMENT.txt
          if [[ -f /tmp/avraam-http.log ]]; then
            cp /tmp/avraam-http.log reports/atlas/avraam-reference-baseline/http-server.log
          fi

      - name: Upload Avraam reference evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: avraam-reference-baseline-${{ github.run_id }}
          path: reports/atlas/avraam-reference-baseline
          if-no-files-found: error
          retention-days: 30
