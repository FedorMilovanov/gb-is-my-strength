name: Home WebKit audit scroll reset executor

on:
  push:
    branches:
      - lane/home-webkit-audit-scroll-reset-20260805

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: lane/home-webkit-audit-scroll-reset-20260805
          fetch-depth: 0

      - name: Assemble, verify, self-clean and commit
        shell: bash
        env:
          BASE_SHA: 3341eb2580ba8655901731344274633b767eb431
          EXPECTED_SHA256: 6f76d9e33d363ead704dd8b761dde12b991c61bedb861b88d4bc6f65f50ad028
          EXPECTED_BYTES: '27763'
          EXECUTOR: .github/workflows/home-webkit-audit-scroll-reset-executor.yml
          PARTS: .tmp/home-webkit-audit-scroll-reset
        run: |
          set -euo pipefail
          cat "$PARTS/part1" "$PARTS/part2" "$PARTS/part3" "$PARTS/part4" > scripts/home-design-audit-pro.mjs
          test "$(wc -c < scripts/home-design-audit-pro.mjs | tr -d ' ')" = "$EXPECTED_BYTES"
          test "$(sha256sum scripts/home-design-audit-pro.mjs | awk '{print $1}')" = "$EXPECTED_SHA256"
          node --check scripts/home-design-audit-pro.mjs

          rm -rf "$PARTS"
          rm -f "$EXECUTOR"
          rmdir .tmp 2>/dev/null || true

          git add -A
          test "$(git diff --cached --name-only "$BASE_SHA")" = "scripts/home-design-audit-pro.mjs"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test(home): reset WebKit horizontal state before geometry"
          git push origin HEAD:lane/home-webkit-audit-scroll-reset-20260805
