name: Atlas A11y Exact Witness

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/atlas-a11y-exact-witness.yml'
      - 'karty/_engine/map-engine.js'
      - 'scripts/audit-browser-runtime-wave.mjs'

concurrency:
  group: atlas-a11y-exact-witness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      AUDIT_TARGET_ID: atlas-a11y-repair-head
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate exact source and witness
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          node --check scripts/audit-browser-runtime-wave.mjs
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Build production-like site
        run: npm run strangler:build:production-like

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --directory dist > /tmp/atlas-a11y-http.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8090/karty/avraam/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/atlas-a11y-http.log
          exit 1

      - name: Capture browser evidence
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          AUDIT_BROWSER_OUT: reports/audit/atlas-a11y-exact-witness
        run: node scripts/audit-browser-runtime-wave.mjs

      - name: Preserve identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=reports/audit/atlas-a11y-exact-witness
          mkdir -p "$out"
          cp /tmp/atlas-a11y-http.log "$out/http-server.log" || true
          {
            echo "checked_out_sha=$(git rev-parse HEAD)"
            echo "expected_head_sha=$HEAD_SHA"
            echo "run_id=$GITHUB_RUN_ID"
          } > "$out/ENVIRONMENT.txt"
          sha256sum karty/_engine/map-engine.js scripts/audit-browser-runtime-wave.mjs > "$out/SHA256SUMS.txt"

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-a11y-exact-witness-${{ github.run_id }}
          path: reports/audit/atlas-a11y-exact-witness
          if-no-files-found: error
          retention-days: 30
