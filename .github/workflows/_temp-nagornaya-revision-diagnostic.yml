name: TEMP Nagornaya Revision Materialization

on:
  push:
    branches:
      - agent/nagornaya-bar-asset-contract-2026-07-22

permissions:
  contents: write

concurrency:
  group: temp-nagornaya-revision-materialization
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nagornaya-bar-asset-contract-2026-07-22
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Reconcile revisions and enforce exact generated scope
        shell: bash
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'No generated revision drift remains.'
            exit 0
          fi
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 11
          for path in "${changed[@]}"; do
            case "$path" in
              src/components/baptisty-rossii/*PageHead.astro) ;;
              *) echo "Unexpected generated file: $path" >&2; exit 1 ;;
            esac
          done
      - name: Commit generated revision reconciliation
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git add src/components/baptisty-rossii/*PageHead.astro
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(assets): reconcile Baptist page-head revisions'
          git push origin HEAD:agent/nagornaya-bar-asset-contract-2026-07-22
