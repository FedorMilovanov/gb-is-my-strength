name: Rodosloviye OG Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'rodosloviye/index.html'
      - 'images/og-rodosloviye-1200x630.webp'
      - 'scripts/rodosloviye-og-contract.mjs'
      - '.github/workflows/rodosloviye-og-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rodosloviye-og-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-owned-social-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source social-image identity
        run: node scripts/rodosloviye-og-contract.mjs

      - name: Build production-like candidate
        run: npm run strangler:build:production-like

      - name: Validate production artifact parity
        run: node scripts/rodosloviye-og-contract.mjs --require-dist
