name: Pagefind Landing Body Contract
on:
  pull_request:
    paths: ['.github/workflows/pagefind-landing-body.yml','scripts/pagefind-landing-body-browser-test.mjs','src/components/hard-texts/**','src/components/pastor-series/**','src/components/biografii/**','src/pages/hard-texts/**','src/pages/pastor-series/**','src/pages/biografii/**','package.json','package-lock.json']
  push:
    branches: [main]
    paths: ['.github/workflows/pagefind-landing-body.yml','scripts/pagefind-landing-body-browser-test.mjs','src/components/hard-texts/**','src/components/pastor-series/**','src/components/biografii/**','src/pages/hard-texts/**','src/pages/pastor-series/**','src/pages/biografii/**','package.json','package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pagefind-landing-body-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  built-index-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - run: npm ci
      - run: timeout 12m npx playwright install --with-deps chromium
      - run: npm run strangler:build:production-like
      - run: npm run pagefind:build:dist
      - name: Run landing Pagefind-body contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/pagefind-landing-body-browser-test.mjs
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pagefind-landing-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/pagefind-landing-body
          if-no-files-found: error
          retention-days: 14
