name: TEMP Special Map Overlay Apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: special-map-overlay-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply deterministic map adapter patch
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p reports
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp-special-map-overlay-patch.py')
          text = path.read_text(encoding='utf-8')
          pairs = [
            (
              '"       destroy(){\\n         stopTour();\\n         _cleanupAll();\\n         container.innerHTML=\'\';container.className=\'\';\\n       }\\n"',
              '"      destroy(){\\n        stopTour();\\n        _cleanupAll();\\n        container.innerHTML=\'\';container.className=\'\';\\n      }\\n"',
            ),
            (
              '"       destroy(){\\n         stopTour();\\n         photoModal.classList.remove(\'me-photo-modal--open\');\\n         panel.classList.remove(\'me-panel--open\');\\n         panelBackdrop.classList.remove(\'me-panel__backdrop--active\');\\n         destroySpecialOverlay(photoOverlayOwner);\\n         destroySpecialOverlay(panelOverlayOwner);\\n         _cleanupAll();\\n         container.innerHTML=\'\';container.className=\'\';\\n       }\\n"',
              '"      destroy(){\\n        stopTour();\\n        photoModal.classList.remove(\'me-photo-modal--open\');\\n        panel.classList.remove(\'me-panel--open\');\\n        panelBackdrop.classList.remove(\'me-panel__backdrop--active\');\\n        destroySpecialOverlay(photoOverlayOwner);\\n        destroySpecialOverlay(panelOverlayOwner);\\n        _cleanupAll();\\n        container.innerHTML=\'\';container.className=\'\';\\n      }\\n"',
            ),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'destroy patcher source mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/_temp-special-map-overlay-patch.py > reports/special-map-patch.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python3 scripts/_temp-special-map-browser-diagnostic.py >> reports/special-map-patch.log 2>&1
            status=$?
          fi
          cat reports/special-map-patch.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-map-patch-diagnostic
          path: reports/special-map-patch.log
          retention-days: 1

      - name: Fail on patch error
        if: steps.patch.outputs.status != '0'
        run: exit 1

      - name: Validate static contracts
        if: steps.patch.outputs.status == '0'
        id: static
        shell: bash
        run: |
          set +e
          {
            node --check karty/_engine/map-engine.js
            node --check scripts/map-overlay-runtime-browser-test.js
            npm run overlay:runtime:test
            git diff --check
          } > reports/special-map-static.log 2>&1
          status=$?
          cat reports/special-map-static.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-map-static-diagnostic
          path: reports/special-map-static.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on static error
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status != '0'
        run: exit 1

      - name: Install dependencies
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0'
        run: npm ci

      - name: Install Chromium
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0'
        run: npx playwright install --with-deps chromium

      - name: Validate map overlay browser lifecycle
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0'
        id: browser
        shell: bash
        env:
          PW_BROWSER: chromium
        run: |
          set +e
          npm run overlay:map:browser:test > reports/special-map-browser.log 2>&1
          status=$?
          cat reports/special-map-browser.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-map-browser-diagnostic
          path: reports/special-map-browser.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on browser error
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0' && steps.browser.outputs.status != '0'
        run: exit 1

      - name: Validate Astro templates
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0' && steps.browser.outputs.status == '0'
        run: npm run astro:check

      - name: Commit permanent map adapter files
        if: steps.patch.outputs.status == '0' && steps.static.outputs.status == '0' && steps.browser.outputs.status == '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm scripts/_temp-special-map-overlay-patch.py scripts/_temp-special-map-browser-diagnostic.py
          git add karty/_engine/map-engine.js \
                  scripts/overlay-runtime-contract-test.js \
                  scripts/map-overlay-runtime-browser-test.js \
                  package.json
          test -z "$(git diff --cached --diff-filter=ACMR --name-only | grep -E '(^|/)_temp-' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(special): migrate map overlays to canonical runtime'
          git push origin "HEAD:${HEAD_REF}"
