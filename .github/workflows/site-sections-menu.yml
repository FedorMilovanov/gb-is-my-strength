name: Site Sections Menu Contract

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: site-menu-exact-head-refresh-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh-same-branch:
    if: github.event.pull_request.number == 1558 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/system-site-menu-owner-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main with cleanup-aware CAS
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: agent/system-site-menu-owner-20260810
          PERMANENT_WORKFLOW_SHA: 8d8dbc1bacf89bfa76732f2ecee495d859589a9f
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/site-sections-menu.yml'
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"

          adopt_safe_cleanup() {
            local expected="$1"
            local remote="$2"
            [ "$remote" = "$expected" ] && return 0
            mapfile -t changed < <(git diff --name-only "$expected".."$remote")
            if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$WORKFLOW" ]; then
              echo "Refusing concurrent head $remote: change is not workflow-only cleanup" >&2
              printf '%s\n' "${changed[@]}" >&2
              exit 1
            fi
            if ! git diff --quiet "$PERMANENT_WORKFLOW_SHA" "$remote" -- "$WORKFLOW"; then
              echo "Refusing concurrent head $remote: workflow is not canonical permanent content" >&2
              exit 1
            fi
            echo "Adopting safe concurrent permanent-workflow cleanup $remote"
            git reset --hard "$remote"
          }

          for attempt in 1 2 3; do
            echo "refresh attempt $attempt"
            git fetch --no-tags origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_head="$(git rev-parse "refs/remotes/origin/$BRANCH")"
            adopt_safe_cleanup "$(git rev-parse HEAD)" "$remote_head"
            expected="$(git rev-parse HEAD)"

            base="$(git merge-base HEAD origin/main)"
            git diff --name-only "$base"..HEAD | grep -v '^\.github/workflows/site-sections-menu\.yml$' | sort -u > /tmp/lane.txt
            git diff --name-only "$base"..origin/main | sort -u > /tmp/main.txt
            if comm -12 /tmp/lane.txt /tmp/main.txt | grep -q .; then
              echo 'Refusing refresh: lane/main product-path overlap detected' >&2
              comm -12 /tmp/lane.txt /tmp/main.txt >&2
              exit 1
            fi

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-ff --no-commit origin/main
            git checkout "$PERMANENT_WORKFLOW_SHA" -- "$WORKFLOW"
            git commit -m 'chore(site-menu): refresh same branch onto current main'
            git merge-base --is-ancestor origin/main HEAD
            grep -F 'contents: read' "$WORKFLOW" >/dev/null
            grep -F 'Chromium + WebKit full-site menu contract' "$WORKFLOW" >/dev/null
            ! grep -F 'contents: write' "$WORKFLOW" >/dev/null

            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_now="$(git rev-parse "refs/remotes/origin/$BRANCH")"
            if [ "$remote_now" != "$expected" ]; then
              adopt_safe_cleanup "$expected" "$remote_now"
              continue
            fi

            if git push origin HEAD:"refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$expected"; then
              exit 0
            fi

            git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            remote_after="$(git rev-parse "refs/remotes/origin/$BRANCH")"
            adopt_safe_cleanup "$expected" "$remote_after"
          done

          echo 'Refusing refresh after three cleanup-aware CAS attempts' >&2
          exit 1
