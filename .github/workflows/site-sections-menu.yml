name: Site Sections Menu Contract

on:
  push:
    branches:
      - 'agent/system-site-menu-owner-20260810'
    paths:
      - '.github/workflows/site-sections-menu.yml'

permissions:
  contents: write

concurrency:
  group: site-menu-exact-head-refresh
  cancel-in-progress: false

jobs:
  refresh-same-branch:
    if: github.ref == 'refs/heads/agent/system-site-menu-owner-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pushed head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and restore permanent workflow before commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BRANCH: agent/system-site-menu-owner-20260810
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git fetch --no-tags origin main

          BASE="$(git merge-base HEAD origin/main)"
          git diff --name-only "$BASE"..HEAD | grep -v '^\.github/workflows/site-sections-menu\.yml$' | sort -u > /tmp/lane.txt
          git diff --name-only "$BASE"..origin/main | sort -u > /tmp/main.txt
          if comm -12 /tmp/lane.txt /tmp/main.txt | grep -q .; then
            echo 'Refusing refresh: lane/main product-path overlap detected' >&2
            comm -12 /tmp/lane.txt /tmp/main.txt >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          git checkout HEAD^ -- .github/workflows/site-sections-menu.yml
          git commit -m 'chore(site-menu): refresh same branch onto current main'

          git merge-base --is-ancestor origin/main HEAD
          grep -F 'permissions:' .github/workflows/site-sections-menu.yml >/dev/null
          grep -F 'contents: read' .github/workflows/site-sections-menu.yml >/dev/null
          grep -F 'Chromium + WebKit full-site menu contract' .github/workflows/site-sections-menu.yml >/dev/null
          ! grep -F 'contents: write' .github/workflows/site-sections-menu.yml >/dev/null
          test "$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          git push origin HEAD:"refs/heads/$BRANCH" --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA"
