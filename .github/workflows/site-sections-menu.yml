name: Site Sections Menu Contract

on:
  pull_request:
    paths:
      - 'js/site.js'
      - 'src/components/about/**'
      - 'src/components/article-pilots/_shared/SiteSectionsMenu.astro'
      - 'src/components/article-pilots/_shared/SiteSectionsMenuRuntime.astro'
      - 'src/components/article-pilots/_shared/ReaderRail.astro'
      - 'src/components/article-pilots/gill-series/**'
      - 'src/components/articles/**'
      - 'src/components/baptisty-rossii/**'
      - 'src/components/biografii/**'
      - 'src/components/hard-texts/**'
      - 'src/components/home/**'
      - 'src/components/karty/**'
      - 'src/components/konfessii/russkij-baptizm/**'
      - 'src/components/nagornaya/**'
      - 'src/components/pastor-series/**'
      - 'src/components/rodosloviye/**'
      - 'src/components/search/AppSearchSurface.astro'
      - 'src/pages/biografii/index.astro'
      - 'src/pages/karty/**'
      - 'src/pages/konfessii/russkij-baptizm/**'
      - 'src/pages/nagornaya/**'
      - 'src/pages/rodosloviye/index.astro'
      - 'src/runtime/reader-controls-a11y.js'
      - 'scripts/reader-controls-residual-browser-contract.mjs'
      - 'scripts/site-sections-menu-visual-contract.mjs'
      - 'scripts/lib/public-surface-registry.js'
      - 'src/lib/asset-version.js'
      - '.github/workflows/site-sections-menu.yml'
  push:
    branches: [main]
    paths:
      - 'js/site.js'
      - 'src/components/about/**'
      - 'src/components/article-pilots/_shared/SiteSectionsMenu.astro'
      - 'src/components/article-pilots/_shared/SiteSectionsMenuRuntime.astro'
      - 'src/components/article-pilots/_shared/ReaderRail.astro'
      - 'src/components/article-pilots/gill-series/**'
      - 'src/components/articles/**'
      - 'src/components/baptisty-rossii/**'
      - 'src/components/biografii/**'
      - 'src/components/hard-texts/**'
      - 'src/components/home/**'
      - 'src/components/karty/**'
      - 'src/components/konfessii/russkij-baptizm/**'
      - 'src/components/nagornaya/**'
      - 'src/components/pastor-series/**'
      - 'src/components/rodosloviye/**'
      - 'src/components/search/AppSearchSurface.astro'
      - 'src/pages/biografii/index.astro'
      - 'src/pages/karty/**'
      - 'src/pages/konfessii/russkij-baptizm/**'
      - 'src/pages/nagornaya/**'
      - 'src/pages/rodosloviye/index.astro'
      - 'src/runtime/reader-controls-a11y.js'
      - 'scripts/reader-controls-residual-browser-contract.mjs'
      - 'scripts/site-sections-menu-visual-contract.mjs'
      - 'scripts/lib/public-surface-registry.js'
      - 'src/lib/asset-version.js'
      - '.github/workflows/site-sections-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-sections-menu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium + WebKit full-site menu contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Source ownership and cache-bust guards
        run: |
          node --check js/site.js
          node --check src/runtime/reader-controls-a11y.js
          node --check scripts/reader-controls-residual-browser-contract.mjs
          node --check scripts/site-sections-menu-visual-contract.mjs
          node scripts/cache-bust.js
          node - <<'NODE'
          const fs = require('fs');
          const menu = fs.readFileSync('src/components/article-pilots/_shared/SiteSectionsMenu.astro', 'utf8');
          const runtime = fs.readFileSync('src/components/article-pilots/_shared/SiteSectionsMenuRuntime.astro', 'utf8');
          const site = fs.readFileSync('js/site.js', 'utf8');
          const a11y = fs.readFileSync('src/runtime/reader-controls-a11y.js', 'utf8');
          if (!menu.includes('data-gb-site-menu-runtime="canonical"')) throw new Error('canonical menu marker missing');
          if (!menu.includes('data-gb-site-menu-nojs')) throw new Error('shared no-JS navigation missing');
          if (!menu.includes('gb-site-menu--rich')) throw new Error('shared rich-reader menu presentation missing');
          if (!runtime.includes("OWNER_ID = 'site-sections-menu'")) throw new Error('canonical menu runtime owner missing');
          if (!runtime.includes('window.OverlayRuntime')) throw new Error('menu runtime must delegate lifecycle to OverlayRuntime');
          if (!site.includes('data-gb-site-menu-runtime')) throw new Error('legacy site.js must skip canonical menu owner');
          if (a11y.includes('bindNativeSiteSectionsMenu')) throw new Error('reader a11y must not own site-menu visual lifecycle');
          NODE

      - name: Build production-like dist
        run: |
          mkdir -p reports
          set -o pipefail
          npm run strangler:build:production-like 2>&1 | tee reports/site-sections-menu-build.log

      - name: Verify nested Bible App entrypoints in built public shells
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const routes = [
            '/karty/avraam/',
            '/karty/early-church/',
            '/karty/ishod/',
            '/karty/maccabim/',
            '/karty/melachim/',
            '/karty/pavel/',
            '/karty/revelation/',
            '/karty/shoftim/',
            '/karty/shvatim/',
            '/karty/yeshua/',
            '/nagornaya/chast-1/',
            '/nagornaya/chast-2/',
            '/nagornaya/chast-3/',
            '/nagornaya/chast-4/',
            '/nagornaya/chast-5/',
            '/nagornaya/istochniki/',
            '/nagornaya/nakhodki/',
            '/konfessii/russkij-baptizm/',
            '/rodosloviye/',
          ];
          const failures = [];
          for (const route of routes) {
            const relative = route.replace(/^\/+|\/+$/g, '');
            const file = path.join('dist', relative, 'index.html');
            if (!fs.existsSync(file)) {
              failures.push(`${route}: built shell missing (${file})`);
              continue;
            }
            const html = fs.readFileSync(file, 'utf8');
            if (!html.includes('href="/app/"')) {
              failures.push(`${route}: href="/app/" missing from built shell`);
            }
          }
          if (failures.length) {
            console.error('Nested Bible App entrypoint contract failed:\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log(`Nested Bible App entrypoint contract passed for ${routes.length} public shells.`);
          NODE

      - name: Run full-site menu behavior contract
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/reader-controls-residual-browser-contract.mjs 2>&1 | tee reports/site-sections-menu-browser.log

      - name: Run full-site menu visual geometry contract
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/site-sections-menu-visual-contract.mjs 2>&1 | tee reports/site-sections-menu-visual.log

      - name: Upload exact-head proof and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-sections-menu-${{ github.run_id }}
          path: |
            reports/site-sections-menu-build.log
            reports/site-sections-menu-browser.log
            reports/site-sections-menu-visual.log
            reports/reader-controls-residual-browser-contract.json
            reports/reader-controls-residual-browser-contract.md
            reports/site-sections-menu-visual-contract.json
            reports/site-sections-menu-visual-contract.md
            reports/reader-controls-a11y-menu-*.png
          if-no-files-found: warn
          retention-days: 14
