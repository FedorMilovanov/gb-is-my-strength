name: Temporary Atlas Layout Witness Verifier

on:
  push:
    branches:
      - agent/atlas-focus-format-helper-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Replace focus-failure witness with layout-readiness witness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/atlas-focus-state-browser-test.mjs')
          text = path.read_text()
          old = """        const nativeFocus = target.focus.bind(target);\n        let attempts = 0;\n        target.focus = function faultInjectedFocus(options) {\n          attempts += 1;\n          if (attempts >= 3) nativeFocus(options);\n        };"""
          new = """        const nativeGetClientRects = target.getClientRects.bind(target);\n        target.__atlasNativeGetClientRectsForTest = nativeGetClientRects;\n        window.__atlasFocusGeometryReadsForTest = 0;\n        target.getClientRects = function faultInjectedClientRects() {\n          window.__atlasFocusGeometryReadsForTest += 1;\n          if (window.__atlasFocusGeometryReadsForTest <= 2) return [];\n          return nativeGetClientRects();\n        };"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one focus fault-injection block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old_restore = """      await page.evaluate(() => {\n        const nativeResizeObserver = window.__atlasNativeResizeObserverForTest;\n        if (typeof nativeResizeObserver === 'function') window.ResizeObserver = nativeResizeObserver;\n        delete window.__atlasNativeResizeObserverForTest;\n      });"""
          new_restore = """      const layoutWitness = await page.evaluate(() => {\n        const target = document.querySelector('#atlasSidebar [data-atlas-group]');\n        const geometryReads = Number(window.__atlasFocusGeometryReadsForTest || 0);\n        if (target && typeof target.__atlasNativeGetClientRectsForTest === 'function') {\n          target.getClientRects = target.__atlasNativeGetClientRectsForTest;\n          delete target.__atlasNativeGetClientRectsForTest;\n        }\n        delete window.__atlasFocusGeometryReadsForTest;\n        const nativeResizeObserver = window.__atlasNativeResizeObserverForTest;\n        if (typeof nativeResizeObserver === 'function') window.ResizeObserver = nativeResizeObserver;\n        delete window.__atlasNativeResizeObserverForTest;\n        return { geometryReads };\n      });\n      assert.ok(layoutWitness.geometryReads >= 3, `${browserName}/${width}: layout witness did not reach bounded second-frame recovery`);"""
          if text.count(old_restore) != 1:
              raise SystemExit(f'expected one witness restore block, found {text.count(old_restore)}')
          path.write_text(text.replace(old_restore, new_restore, 1))
          PY
      - name: Verify syntax and whitespace
        run: |
          git diff --check
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-focus-state-browser-test.mjs
      - name: Install dependencies and browsers
        run: |
          npm ci
          timeout 12m npx playwright install --with-deps chromium webkit
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Run Atlas focus-state contract
        run: node scripts/atlas-focus-state-browser-test.mjs
      - name: Commit verified product witness
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/atlas-focus-state-browser-test.mjs
          git commit -m 'test(atlas): model delayed layout readiness deterministically'
          git push

# trigger: semantic layout-readiness witness
