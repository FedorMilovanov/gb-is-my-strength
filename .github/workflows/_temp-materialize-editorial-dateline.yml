name: TEMP Materialize Editorial Dateline

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: temp-materialize-editorial-dateline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Apply universal dateline migration
        run: |
          mkdir -p reports/editorial-dateline-materializer
          exec > >(tee reports/editorial-dateline-materializer/full.log) 2>&1
          set -euo pipefail
          rm -f .github/workflows/_temp-editorial-dateline-inventory.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp-materialize-editorial-dateline.py')
          source = path.read_text('utf-8')
          old = "if path.is_file() and path != Path(__file__) and '.git' not in path.parts:"
          new = "if path.is_file() and path != Path(__file__) and path.name != 'editorial-dateline-contract-test.js' and '.git' not in path.parts:"
          if old not in source:
              raise SystemExit('materializer legacy-scan anchor missing')
          path.write_text(source.replace(old, new), 'utf-8')
          PY
          python3 scripts/_temp-materialize-editorial-dateline.py
          rm -f scripts/_temp-materialize-editorial-dateline.py
          node scripts/cache-bust.js --write
          node scripts/editorial-dateline-contract-test.js
          node --check js/reader-preferences-head.js
          git diff --check
      - name: Commit materialized product and contracts
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p reports/editorial-dateline-materializer
          exec > >(tee reports/editorial-dateline-materializer/commit-push.log) 2>&1
          set -euo pipefail
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**'
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No product materialization changes remain.'
            exit 0
          fi
          git commit -m 'feat(editorial): replace foliant boxes with semantic datelines'
          git push origin "HEAD:${BRANCH}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-dateline-materializer-${{ github.sha }}
          path: reports/editorial-dateline-materializer
          if-no-files-found: warn
          retention-days: 7
