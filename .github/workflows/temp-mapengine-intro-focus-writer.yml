name: TEMP MapEngine Intro Focus Writer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-mapengine-intro-focus-writer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-mapengine-intro-focus-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Assert writer lease and apply bounded patch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          node scripts/temp-mapengine-intro-focus-patch.mjs
          rm scripts/temp-mapengine-intro-focus-patch.mjs
          rm .github/workflows/temp-mapengine-intro-focus-writer.yml
          node --check karty/_engine/map-engine.js
          node --check scripts/mapengine-intro-focus-browser-test.mjs
          git diff --check

      - name: Commit only final repair surface
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karty/_engine/map-engine.js scripts/temp-mapengine-intro-focus-patch.mjs .github/workflows/temp-mapengine-intro-focus-writer.yml
          git commit -m "fix(map): give Intro deterministic focus ownership"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git push origin "HEAD:${BRANCH}"
