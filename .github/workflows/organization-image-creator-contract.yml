name: Organization Image Creator Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/home/HomePageHead.astro'
      - 'src/components/nagornaya/seriya/NagornayaSeriyaPageHead.astro'
      - 'scripts/organization-image-creator-contract.mjs'
      - '.github/workflows/organization-image-creator-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-image-creator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source Organization/ImageObject identity
        run: node scripts/organization-image-creator-contract.mjs

      - name: Build production-like candidate
        run: npm run strangler:build:production-like

      - name: Validate rendered Organization/ImageObject identity
        run: node scripts/organization-image-creator-contract.mjs --require-dist
