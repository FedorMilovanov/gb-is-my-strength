name: Runtime Interactive Audit

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-bfcache-launcher:
    if: github.head_ref == 'fix/home-browser-contract-residuals-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/home-browser-contract-residuals-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Patch launcher, restore workflow and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_materialize_home_bfcache_launcher.py
          test ! -e scripts/_temp_materialize_home_bfcache_launcher.py
          grep -F "ignoreDefaultArgs: ['--disable-back-forward-cache']" scripts/home-browser-lifecycle-contract.mjs
          grep -F 'persist-credentials: false' .github/workflows/interactive-audit.yml
          git diff --check
          git add scripts/home-browser-lifecycle-contract.mjs \
            scripts/_temp_materialize_home_bfcache_launcher.py \
            .github/workflows/interactive-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(home): enable real Chromium BFCache lifecycle proof'
          git push origin HEAD:fix/home-browser-contract-residuals-20260725
