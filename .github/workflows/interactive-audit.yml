name: Runtime Interactive Audit

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-bfcache-diagnostics:
    if: github.head_ref == 'fix/home-browser-contract-residuals-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/home-browser-contract-residuals-20260725
          fetch-depth: 0
          persist-credentials: true

      - name: Patch permanent diagnostics and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_materialize_bfcache_diagnostics.py
          test ! -e scripts/_temp_materialize_bfcache_diagnostics.py
          grep -F 'Page.backForwardCacheNotUsed' scripts/home-browser-lifecycle-contract.mjs
          git diff --check
          git add scripts/home-browser-lifecycle-contract.mjs \
            scripts/_temp_materialize_bfcache_diagnostics.py
          git diff --cached --name-only
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(home): record Chromium BFCache rejection reasons'
          git push origin HEAD:fix/home-browser-contract-residuals-20260725
