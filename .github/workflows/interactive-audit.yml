name: TEMP Materialize Pagefind Request Identity

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/home-browser-lifecycle-final-clean-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/home-browser-lifecycle-final-clean-20260726
          fetch-depth: 0
          persist-credentials: true

      - name: Apply request identity and restore reviewed workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_bind_pagefind_request_identity.py
          test ! -e scripts/_temp_bind_pagefind_request_identity.py
          git show a73b57945ebb354a79e723b2939d9f70e3e0c42e:.github/workflows/interactive-audit.yml > .github/workflows/interactive-audit.yml
          node --check scripts/home-browser-lifecycle-contract.mjs
          python3 - <<'PY'
          from pathlib import Path
          text = Path('scripts/home-browser-lifecycle-contract.mjs').read_text(encoding='utf-8')
          required = [
              'function isExpectedPagefindRequest(request, baseUrl)',
              'function isKnownNavigationAbort(request, expectedNavigationAborts)',
              'const expectedNavigationAborts = new WeakSet();',
              "page.on('request', (request) => {",
              'expectedNavigationAborts.add(request);',
              'isKnownNavigationAbort(request, expectedNavigationAborts)',
          ]
          missing = [marker for marker in required if text.count(marker) != 1]
          if missing:
              raise SystemExit(f'request identity boundary incomplete: {missing}')
          workflow = Path('.github/workflows/interactive-audit.yml').read_text(encoding='utf-8')
          required_workflow = [
              "'scripts/home-browser-lifecycle-contract.mjs'",
              'persist-credentials: false',
              'xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs',
              'reports/home-browser-lifecycle-contract',
          ]
          if any(marker not in workflow for marker in required_workflow):
              raise SystemExit('reviewed workflow restoration incomplete')
          if 'contents: write' in workflow or '_temp_' in workflow:
              raise SystemExit('reviewed workflow restoration retained transport state')
          PY
          git diff --check
          git add -A
          git config user.name 'home-contract-materializer'
          git config user.email 'home-contract-materializer@users.noreply.github.com'
          git commit -m 'test(home): bind Pagefind abort to request identity'
          git push origin HEAD:fix/home-browser-lifecycle-final-clean-20260726
