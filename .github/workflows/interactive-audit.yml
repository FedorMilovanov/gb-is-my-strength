name: Runtime Interactive Audit

on:
  pull_request:
    paths:
      - '.github/workflows/interactive-audit.yml'

permissions:
  contents: write

concurrency:
  group: runtime-interactive-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-glossary-audit-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glossary-tooltip-runtime-20260727
          fetch-depth: 1
          show-progress: false

      - name: Extract validated replacement program
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/_temp-glossary-tooltip-diagnostic.yml').read_text(encoding='utf-8').splitlines()
          starts = [i for i, line in enumerate(source) if line.strip() == "python - <<'PY'"]
          if len(starts) != 1:
              raise SystemExit(f'expected one embedded Python program, found {len(starts)}')
          start = starts[0]
          end = next(i for i in range(start + 1, len(source)) if source[i].strip() == 'PY')
          block = []
          for line in source[start + 1:end]:
              if line.startswith('          '):
                  block.append(line[10:])
              elif not line.strip():
                  block.append('')
              else:
                  raise SystemExit(f'unexpected Python indentation: {line!r}')
          program = '\n'.join(block) + '\n'
          if 'glossary-tooltip-runtime-not-ready' not in program or 'await target.hover();' not in program:
              raise SystemExit('extracted replacement program is incomplete')
          Path('/tmp/glossary-audit-repair.py').write_text(program, encoding='utf-8')
          PY
          python -m py_compile /tmp/glossary-audit-repair.py

      - name: Apply exact one-file replacement
        run: python /tmp/glossary-audit-repair.py

      - name: Validate generated JavaScript
        run: |
          node --check scripts/interactive-audit.js
          git diff --check

      - name: Enforce exact permanent scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == 'scripts/interactive-audit.js' ]]
          grep -q 'glossary-tooltip-runtime-not-ready' scripts/interactive-audit.js
          grep -q 'glossary-tooltip-did-not-open' scripts/interactive-audit.js
          grep -q 'await target.hover();' scripts/interactive-audit.js

      - name: Commit and push permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/interactive-audit.js
          git commit -m 'fix(audit): wait for glossary runtime readiness'
          git push origin HEAD:agent/glossary-tooltip-runtime-20260727
