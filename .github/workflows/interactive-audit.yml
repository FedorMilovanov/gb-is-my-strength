name: Runtime Interactive Audit

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-bfcache-materializer:
    if: github.head_ref == 'fix/home-browser-contract-residuals-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/home-browser-contract-residuals-20260725
          persist-credentials: false

      - name: Capture exact materializer result
        shell: bash
        run: |
          set +e
          python3 scripts/_temp_materialize_bfcache_diagnostics.py > "$RUNNER_TEMP/materializer.log" 2>&1
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/materializer.status"
          {
            echo '--- python output ---'
            cat "$RUNNER_TEMP/materializer.log"
            echo '--- git status ---'
            git status --short
            echo '--- diff check ---'
            git diff --check
          } > "$RUNNER_TEMP/diagnostic.txt" 2>&1
          cp scripts/home-browser-lifecycle-contract.mjs "$RUNNER_TEMP/patched-home-browser-lifecycle-contract.mjs"
          exit 0

      - name: Upload materializer diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bfcache-materializer-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/diagnostic.txt
            ${{ runner.temp }}/materializer.status
            ${{ runner.temp }}/patched-home-browser-lifecycle-contract.mjs
          if-no-files-found: error
          retention-days: 2

      - name: Preserve materializer failure status
        shell: bash
        run: exit "$(cat "$RUNNER_TEMP/materializer.status")"
