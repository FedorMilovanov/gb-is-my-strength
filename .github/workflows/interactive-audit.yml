name: Runtime Interactive Audit

on:
  pull_request:
    paths:
      - '.github/workflows/interactive-audit.yml'
      - 'scripts/interactive-audit.js'
      - 'scripts/home-browser-contract.mjs'
      - 'scripts/home-browser-lifecycle-contract.mjs'
      - 'src/pages/index.astro'
      - 'src/components/home/**'
      - 'src/components/article-pilots/**'
      - 'src/components/reader-platform/**'
      - 'src/layouts/**'
      - 'src/runtime/**'
      - 'src/styles/**'
      - 'css/**'
      - 'js/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/interactive-audit.yml'
      - 'scripts/interactive-audit.js'
      - 'scripts/home-browser-contract.mjs'
      - 'scripts/home-browser-lifecycle-contract.mjs'
      - 'src/pages/index.astro'
      - 'src/components/home/**'
      - 'src/components/article-pilots/**'
      - 'src/components/reader-platform/**'
      - 'src/layouts/**'
      - 'src/runtime/**'
      - 'src/styles/**'
      - 'css/**'
      - 'js/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  schedule:
    # Weekly Monday 03:30 UTC. Browser runtime checks are heavier than static gates.
    - cron: '30 3 * * 1'

permissions:
  contents: read

concurrency:
  group: runtime-interactive-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  home-browser-contract:
    name: Home Chromium WebKit contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit for Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index into dist
        run: npm run pagefind:build:dist

      - name: Run homepage interaction contract
        run: node scripts/home-browser-contract.mjs

      - name: Run real headed homepage lifecycle contract
        run: xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs

      - name: Upload homepage browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-browser-contract-${{ github.run_id }}
          path: |
            reports/home-browser-contract
            reports/home-browser-lifecycle-contract
          if-no-files-found: error
          retention-days: 14

  interactive-audit:
    needs: home-browser-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Determine whether the full runtime audit is required
        id: audit-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          run=false
          reason=unrelated-change
          runtime_pattern='^(\.github/workflows/interactive-audit\.yml|scripts/interactive-audit\.js|scripts/home-browser-contract\.mjs|scripts/home-browser-lifecycle-contract\.mjs|src/pages/index\.astro|src/components/home/|src/components/article-pilots/|src/components/reader-platform/|src/layouts/|src/runtime/|src/styles/|css/|js/|package\.json|package-lock\.json)'

          case "$EVENT_NAME" in
            schedule|workflow_dispatch)
              run=true
              reason="$EVENT_NAME"
              ;;
            pull_request)
              if git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | grep -Eq "$runtime_pattern"; then
                run=true
                reason=runtime-impacting-source-change
              fi
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                run=true
                reason=initial-push
              elif git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" | grep -Eq "$runtime_pattern"; then
                run=true
                reason=runtime-impacting-source-change
              fi
              ;;
          esac

          {
            echo "run=$run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

          printf 'Runtime audit: %s (%s)\n' "$run" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        if: steps.audit-scope.outputs.run == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install dependencies
        if: steps.audit-scope.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium and WebKit for Playwright
        if: steps.audit-scope.outputs.run == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Build production-like dist
        if: steps.audit-scope.outputs.run == 'true'
        run: npm run strangler:build:production-like

      - name: Build Pagefind index into dist
        if: steps.audit-scope.outputs.run == 'true'
        run: npm run pagefind:build:dist

      - name: Start production-like dist server
        if: steps.audit-scope.outputs.run == 'true'
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 -d dist > /tmp/gb-http.log 2>&1 &
          echo $! > /tmp/gb-http.pid
          sleep 2

      - name: Runtime interactive audit with durable evidence
        if: steps.audit-scope.outputs.run == 'true'
        env:
          AUDIT_BASE: http://127.0.0.1:8080
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.event.pull_request.head.ref || github.ref }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/interactive-audit

          status=0
          npm run interactive-audit 2>&1 |
            tee reports/interactive-audit/output.log || status=$?

          STATUS="$status" node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const status = Number(process.env.STATUS || 1);
          const report = {
            schemaVersion: 1,
            conclusion: status === 0 ? 'success' : 'failure',
            exitCode: status,
            sha: process.env.SOURCE_SHA || '',
            ref: process.env.SOURCE_REF || '',
            event: process.env.GITHUB_EVENT_NAME || '',
            runId: process.env.GITHUB_RUN_ID || '',
            runAttempt: process.env.GITHUB_RUN_ATTEMPT || '',
          };

          fs.writeFileSync(
            path.join('reports', 'interactive-audit', 'result.json'),
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

          exit "$status"

      - name: Stop local server
        if: always() && steps.audit-scope.outputs.run == 'true'
        run: |
          if [ -f /tmp/gb-http.pid ]; then
            kill "$(cat /tmp/gb-http.pid)" 2>/dev/null || true
          fi

      - name: Upload runtime interactive audit evidence
        if: always() && steps.audit-scope.outputs.run == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-interactive-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/interactive-audit
          if-no-files-found: error
          retention-days: 14
