name: Runtime Interactive Audit

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-lifecycle-diagnostics:
    if: github.head_ref == 'test/home-browser-lifecycle-clean-20260726'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/home-browser-lifecycle-clean-20260726
          fetch-depth: 2
          persist-credentials: true

      - name: Apply exact lifecycle diagnostic boundaries
        run: python3 scripts/_temp_fix_home_lifecycle_diagnostics.py

      - name: Restore permanent read-only workflow
        run: |
          git checkout HEAD^ -- .github/workflows/interactive-audit.yml
          test ! -e scripts/_temp_fix_home_lifecycle_diagnostics.py
          node --check scripts/home-browser-lifecycle-contract.mjs
          grep -F "Initial/opaque documents may deny storage" scripts/home-browser-lifecycle-contract.mjs
          grep -F "pathname === '/pagefind/pagefind.js'" scripts/home-browser-lifecycle-contract.mjs
          grep -F "ignoredDiagnostics.push" scripts/home-browser-lifecycle-contract.mjs

      - name: Publish tested correction
        run: |
          git config user.name "home-contract-materializer"
          git config user.email "home-contract-materializer@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(home): bound lifecycle-only browser diagnostics"
          git push origin HEAD:test/home-browser-lifecycle-clean-20260726
