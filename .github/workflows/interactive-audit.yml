name: Runtime Interactive Audit

on:
  pull_request:
    paths:
      - '.github/workflows/interactive-audit.yml'
      - 'scripts/_temp-glossary-readiness-refine.py'

permissions:
  contents: write

concurrency:
  group: runtime-interactive-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refine-glossary-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/glossary-tooltip-runtime-20260727
          fetch-depth: 1
          show-progress: false

      - name: Apply proven manual-term readiness predicate
        run: python scripts/_temp-glossary-readiness-refine.py

      - name: Validate exact one-file change
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/interactive-audit.js
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == 'scripts/interactive-audit.js' ]]
          grep -q "target && target.hasAttribute('aria-expanded') && target.querySelector('.gtip')" scripts/interactive-audit.js
          grep -q 'glossary-tooltip-runtime-not-ready' scripts/interactive-audit.js
          grep -q 'glossary-tooltip-did-not-open' scripts/interactive-audit.js

      - name: Commit and push refined repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/interactive-audit.js
          git commit -m 'fix(audit): accept initialized manual glossary terms'
          git push origin HEAD:agent/glossary-tooltip-runtime-20260727
