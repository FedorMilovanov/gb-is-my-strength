name: Genealogy v2 Publication Safety

on:
  pull_request:
    paths:
      - 'scripts/genealogy-build/**'
      - 'scripts/genealogy-v2-publication-audit.mjs'
      - 'data/genealogy/genealogy.json'
      - 'data/genealogy/v2/**'
      - '.github/workflows/genealogy-v2-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/genealogy-build/**'
      - 'scripts/genealogy-v2-publication-audit.mjs'
      - 'data/genealogy/genealogy.json'
      - 'data/genealogy/v2/**'
      - '.github/workflows/genealogy-v2-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genealogy-v2-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-safety:
    name: Matcher and publication guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check genealogy pipeline syntax
        run: |
          node --check scripts/genealogy-build/build.mjs
          node --check scripts/genealogy-v2-publication-audit.mjs

      - name: Run deterministic genealogy matcher regressions
        run: node scripts/genealogy-build/build.mjs test

      - name: Audit committed v2 publication readiness and runtime boundary
        run: node scripts/genealogy-v2-publication-audit.mjs

      - name: Upload genealogy v2 publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genealogy-v2-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/genealogy-v2-publication-audit.json
            reports/genealogy-v2-publication-audit.md
          if-no-files-found: error
          retention-days: 30
