name: Temporary Deploy Pages Pin Refresh Helper

on:
  push:
    branches:
      - agent/deploy-pages-pin-refresh-helper-20260907

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/deploy-pages-pin-refresh-helper-20260907
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Build clean candidate worktree from exact main
        shell: bash
        env:
          BASE_SHA: 99a7b9a7d68c4c2c29c36c179c50eb0f23d48489
        run: |
          set -euo pipefail
          git fetch --no-tags origin +main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BASE_SHA"
          rm -rf /tmp/deploy-pages-candidate
          git worktree add --detach /tmp/deploy-pages-candidate "$BASE_SHA"

      - name: Apply exact atomic pin refresh to clean candidate
        shell: bash
        working-directory: /tmp/deploy-pages-candidate
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const files = [
            '.github/workflows/deploy.yml',
            'scripts/check-workflows.js',
            'scripts/release-pipeline-contract-test.mjs',
          ];
          const from = 'actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0';
          const to = 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1';
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            const occurrences = before.split(from).length - 1;
            if (occurrences !== 1) throw new Error(`${file}: expected exactly one old deploy-pages pin, found ${occurrences}`);
            const after = before.replace(from, to);
            if ((after.split(to).length - 1) !== 1) throw new Error(`${file}: new deploy-pages pin cardinality is not exactly one`);
            fs.writeFileSync(file, after);
          }
          NODE

      - name: Prove future-tree workflow and release contracts
        shell: bash
        working-directory: /tmp/deploy-pages-candidate
        run: |
          set -euo pipefail
          npm run workflows:check
          node scripts/release-pipeline-contract-test.mjs
          node scripts/node-toolchain-pin-contract-test.mjs
          git diff --check
          mapfile -t files < <(git diff --name-only | sort)
          expected=(
            '.github/workflows/deploy.yml'
            'scripts/check-workflows.js'
            'scripts/release-pipeline-contract-test.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq 3
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${files[@]}")

      - name: Create verified blobs without mutating refs
        shell: bash
        working-directory: /tmp/deploy-pages-candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in \
            .github/workflows/deploy.yml \
            scripts/check-workflows.js \
            scripts/release-pipeline-contract-test.mjs
          do
            payload=$(jq -n --arg content "$(base64 -w0 "$file")" '{content:$content,encoding:"base64"}')
            response=$(curl --fail-with-body -sS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -X POST "https://api.github.com/repos/FedorMilovanov/gb-is-my-strength/git/blobs" \
              -d "$payload")
            sha=$(printf '%s' "$response" | jq -r '.sha')
            test "$sha" != "null"
            test -n "$sha"
            printf 'VERIFIED_BLOB %s %s\n' "$file" "$sha"
          done
