name: Search Modal Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/search.js'
      - 'css/command-palette.css'
      - 'scripts/search-modal-browser-contract.mjs'
      - '.github/workflows/search-modal-contract.yml'
  push:
    branches: [main]
    paths:
      - 'js/search.js'
      - 'css/command-palette.css'
      - 'scripts/search-modal-browser-contract.mjs'
      - '.github/workflows/search-modal-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-modal-contract:
    name: Search combobox, modal and touch contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Validate source contracts
        run: |
          node --check js/search.js
          node --check scripts/search-modal-browser-contract.mjs
          npm run astro:check

      - name: Build production-like publication
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate Search modal runtime
        run: node scripts/search-modal-browser-contract.mjs --dist=dist --report=reports/search-modal-contract

      - name: Verify validation is read-only
        run: git diff --exit-code

      - name: Upload Search modal evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-modal-contract-${{ github.run_id }}
          path: reports/search-modal-contract/**
          if-no-files-found: warn
          retention-days: 14
