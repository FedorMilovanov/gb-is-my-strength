name: Branch Hygiene Report

on:
  pull_request:
    paths:
      - 'scripts/branch-hygiene-report.py'
      - '.github/workflows/branch-hygiene-report.yml'
  workflow_dispatch:
  schedule:
    # Weekly Monday 04:10 UTC. Report only; no refs or PRs are mutated.
    - cron: '10 4 * * 1'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/branch-hygiene-report.py

      - name: Generate read-only branch inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/branch-hygiene-report.py \
            --repository "$GH_REPOSITORY" \
            --output-dir reports/branch-hygiene

      - name: Upload inventory artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: branch-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/branch-hygiene/
          retention-days: 30
          if-no-files-found: error
