name: Branch Hygiene Report

on:
  pull_request:
    paths:
      - 'scripts/branch-hygiene-report.py'
      - '.github/workflows/branch-hygiene-report.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: branch-hygiene-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate Python syntax
        run: python3 -m py_compile scripts/branch-hygiene-report.py

      - name: Generate read-only branch inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/branch-hygiene-report.py \
            --repository "$GH_REPOSITORY" \
            --output-dir reports/branch-hygiene

      - name: Upload inventory artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: branch-hygiene-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/branch-hygiene/
          retention-days: 30
          if-no-files-found: error
