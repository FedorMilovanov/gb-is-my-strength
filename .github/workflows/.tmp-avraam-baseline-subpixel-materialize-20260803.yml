name: Atlas Baseline Subpixel Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/.tmp-avraam-baseline-subpixel-materialize-20260803.yml'
      - 'scripts/.tmp-avraam-baseline-subpixel-materialize-20260803.py'

permissions:
  contents: read

jobs:
  baseline-subpixel-autofix:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Write bounded baseline tolerance repair
        run: python3 scripts/.tmp-avraam-baseline-subpixel-materialize-20260803.py --write

      - name: Validate baseline witness change
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/avraam-reference-baseline.mjs
          git diff --check
          mapfile -t paths < <(git status --porcelain | sed 's/^...//' | sort)
          expected=(
            '.github/workflows/.tmp-avraam-baseline-subpixel-materialize-20260803.yml'
            'scripts/.tmp-avraam-baseline-subpixel-materialize-20260803.py'
            'scripts/avraam-reference-baseline.mjs'
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${paths[*]}" == "${expected_sorted[*]}" ]]

      - name: Commit permanent witness repair and transport cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/.tmp-avraam-baseline-subpixel-materialize-20260803.yml \
            scripts/.tmp-avraam-baseline-subpixel-materialize-20260803.py \
            scripts/avraam-reference-baseline.mjs
          git diff --cached --check
          git commit -m 'test(atlas): tolerate subpixel rounding at 44px'
          git push origin "HEAD:${HEAD_REF}"
