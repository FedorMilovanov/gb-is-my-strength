name: Genesis 6 Research provenance

on:
  pull_request:
    paths:
      - 'data/genesis6-research-provenance.json'
      - 'data/genesis6-enoch-footnote-gates.json'
      - 'scripts/genesis6-research-provenance-contract.mjs'
      - 'scripts/genesis6-enoch-footnote-gate.mjs'
      - 'src/content/articles/*enoh*'
      - 'src/content/articles/*angely-pod-mrakom*'
      - 'src/content/articles/*duhi-v-temnice*'
      - 'src/content/articles/*blagovestie-mertvym*'
      - 'src/pages/hard-texts/**'
      - 'src/components/**/genesis6*'
      - '.github/workflows/genesis6-research-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'data/genesis6-research-provenance.json'
      - 'data/genesis6-enoch-footnote-gates.json'
      - 'scripts/genesis6-research-provenance-contract.mjs'
      - 'scripts/genesis6-enoch-footnote-gate.mjs'
      - 'src/content/articles/*enoh*'
      - 'src/content/articles/*angely-pod-mrakom*'
      - 'src/content/articles/*duhi-v-temnice*'
      - 'src/content/articles/*blagovestie-mertvym*'
      - 'src/pages/hard-texts/**'
      - 'src/components/**/genesis6*'
      - '.github/workflows/genesis6-research-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact Research authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: FedorMilovanov/Research
          ref: 1f03a2439767505ae66a7ba8d92195e5904a1a2a
          path: _external/Research
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare provenance evidence directory
        run: mkdir -p reports/genesis6-research-provenance

      - name: Validate legacy Research authority graph
        shell: bash
        run: |
          set -o pipefail
          python3 _external/Research/scripts/validate_genesis6_authority_manifest.py --root _external/Research \
            2>&1 | tee reports/genesis6-research-provenance/research-validator.log

      - name: Validate Enoch extension authority graph
        shell: bash
        run: |
          set -o pipefail
          python3 _external/Research/scripts/validate_genesis6_enoch_extension.py --root _external/Research \
            2>&1 | tee reports/genesis6-research-provenance/enoch-extension-validator.log

      - name: Validate Enoch footnote publication gates
        shell: bash
        run: |
          set -o pipefail
          node scripts/genesis6-enoch-footnote-gate.mjs \
            2>&1 | tee reports/genesis6-research-provenance/enoch-footnote-gate.log

      - name: Validate pinned site provenance
        shell: bash
        run: |
          set -o pipefail
          node scripts/genesis6-research-provenance-contract.mjs --research-root _external/Research \
            2>&1 | tee reports/genesis6-research-provenance/site-contract.log

      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis6-research-provenance-${{ github.run_id }}
          path: reports/genesis6-research-provenance
          if-no-files-found: error
          retention-days: 14
