name: TEMP Atlas Breakpoint Repair

on:
  push:
    branches:
      - agent/atlas-neutral-group-20260810
    paths:
      - '.github/workflows/temp-atlas-breakpoint-repair.yml'

permissions:
  contents: write

concurrency:
  group: temp-atlas-breakpoint-repair
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded runtime and witness repair
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('src/runtime/atlas-runtime.js')
          s = runtime.read_text()
          replacements = [
            ("    var compactMedia = window.matchMedia('(max-width: 680px)');\n",
             "    var compactMedia = window.matchMedia('(max-width: 680px)');\n    var drawerMedia = window.matchMedia('(max-width: 980px)');\n"),
            ("      var compact = compactMedia.matches;\n",
             "      var compact = drawerMedia.matches;\n"),
            ("    function relayoutForViewport() {\n",
             "    function syncDrawerForViewport() {\n      var activeWasSidebar = sidebar.contains(document.activeElement);\n      syncSidebarSurface(false, { restoreFocus: activeWasSidebar });\n    }\n\n    function relayoutForViewport() {\n"),
            ("    if (typeof compactMedia.addEventListener === 'function') compactMedia.addEventListener('change', relayoutForViewport);\n    else if (typeof compactMedia.addListener === 'function') compactMedia.addListener(relayoutForViewport);\n",
             "    if (typeof compactMedia.addEventListener === 'function') compactMedia.addEventListener('change', relayoutForViewport);\n    else if (typeof compactMedia.addListener === 'function') compactMedia.addListener(relayoutForViewport);\n    if (typeof drawerMedia.addEventListener === 'function') drawerMedia.addEventListener('change', syncDrawerForViewport);\n    else if (typeof drawerMedia.addListener === 'function') drawerMedia.addListener(syncDrawerForViewport);\n"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'runtime bounded target count={count}; expected 1 for {old[:70]!r}')
              s = s.replace(old, new)
          runtime.write_text(s)

          test = Path('scripts/atlas-focus-state-browser-test.mjs')
          t = test.read_text()
          replacements = [
            ("const WIDTHS = [390, 680, 681, 1440];", "const WIDTHS = [390, 680, 681, 980, 981, 1440];"),
            ("  const compact = width <= 680;", "  const compact = width <= 980;"),
            ("    if (width === 680 || width === 681) {\n", "    if (width === 680 || width === 681 || width === 980 || width === 981) {\n"),
            ("      await page.setViewportSize({ width: width === 680 ? 681 : 680, height: HEIGHT });\n",
             "      const resizeTarget = width === 680 ? 681 : width === 681 ? 680 : width === 980 ? 981 : 980;\n      await page.setViewportSize({ width: resizeTarget, height: HEIGHT });\n"),
          ]
          for old, new in replacements:
              count = t.count(old)
              if count != 1:
                  raise SystemExit(f'test bounded target count={count}; expected 1 for {old[:70]!r}')
              t = t.replace(old, new)
          test.write_text(t)
          PY
          git diff --check
          git diff -- src/runtime/atlas-runtime.js scripts/atlas-focus-state-browser-test.mjs
      - name: Self-delete staging workflow and commit final bounded diff
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-atlas-breakpoint-repair.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'scripts/atlas-focus-state-browser-test.mjs src/runtime/atlas-runtime.js '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/atlas-focus-state-browser-test.mjs src/runtime/atlas-runtime.js
          git commit -m 'fix(atlas): align drawer lifecycle with tablet breakpoint'
          git fetch --no-tags origin '+refs/heads/agent/atlas-neutral-group-20260810:refs/remotes/origin/agent/atlas-neutral-group-20260810'
          test "$(git rev-parse refs/remotes/origin/agent/atlas-neutral-group-20260810)" = "$TRIGGER_SHA"
          git push --force-with-lease="refs/heads/agent/atlas-neutral-group-20260810:$TRIGGER_SHA" origin HEAD:refs/heads/agent/atlas-neutral-group-20260810