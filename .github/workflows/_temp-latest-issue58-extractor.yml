name: TEMP Latest Issue 58 Extractor

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-latest-issue58-extractor
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[latest-58]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0
      - name: Capture latest observer comments
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" --slurp \
            | jq 'add | sort_by(.id) | .[-6:] | map({id,created_at,updated_at,body,html_url,user:.user.login})' \
            > .github/_temp-latest-issue58-comments.json
      - name: Remove extractor and publish evidence
        shell: bash
        run: |
          rm -f .github/workflows/_temp-latest-issue58-extractor.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[latest-58] capture latest observer comments'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
