name: TEMP Special Overlay Production Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_temp-special-production-smoke.yml"

permissions:
  contents: write

concurrency:
  group: special-overlay-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source ancestry and immutable blobs
        shell: bash
        run: |
          set -euo pipefail
          merge_sha='39f6c3ac5851b6ded164f4de42b4e9dba1ca72e7'
          git merge-base --is-ancestor "$merge_sha" HEAD
          test "$(git rev-parse HEAD:js/site.js)" = "$(git rev-parse ${merge_sha}:js/site.js)"
          test "$(git rev-parse HEAD:karty/_engine/map-engine.js)" = "$(git rev-parse ${merge_sha}:karty/_engine/map-engine.js)"
          test "$(git rev-parse HEAD:konfessii/russkij-baptizm/_app/index.html)" = "$(git rev-parse ${merge_sha}:konfessii/russkij-baptizm/_app/index.html)"
          echo '✅ Current main retains the exact merged special-runtime blobs'

      - name: Wait for Pages and verify deployed runtime
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          root='https://gospod-bog.ru'
          cache="?deploy-smoke=${GITHUB_SHA}"
          mkdir -p /tmp/gb-smoke

          for attempt in $(seq 1 75); do
            echo "Production smoke attempt ${attempt}/75"
            ok=1
            curl --compressed -fsSL --max-time 30 "${root}/${cache}" -o /tmp/gb-smoke/index.html || ok=0
            curl --compressed -fsSL --max-time 30 "${root}/js/site.js${cache}" -o /tmp/gb-smoke/site.js || ok=0
            curl --compressed -fsSL --max-time 30 "${root}/karty/_engine/map-engine.js${cache}" -o /tmp/gb-smoke/map-engine.js || ok=0
            curl --compressed -fsSL --max-time 45 "${root}/konfessii/russkij-baptizm/_app/index.html${cache}" -o /tmp/gb-smoke/mindmap.html || ok=0

            if [ "$ok" -eq 1 ] \
              && cmp -s js/site.js /tmp/gb-smoke/site.js \
              && cmp -s karty/_engine/map-engine.js /tmp/gb-smoke/map-engine.js \
              && cmp -s konfessii/russkij-baptizm/_app/index.html /tmp/gb-smoke/mindmap.html \
              && grep -Fq 'site-image-viewer' /tmp/gb-smoke/site.js \
              && grep -Fq 'special:map:' /tmp/gb-smoke/map-engine.js \
              && grep -Fq 'const wasOpen = fallbackOverlayOwners.has(ownerId)' /tmp/gb-smoke/map-engine.js \
              && grep -Fq 'special:konfessii-mindmap-launcher' /tmp/gb-smoke/mindmap.html \
              && grep -Fq '../../../js/site-utils.js' /tmp/gb-smoke/mindmap.html \
              && ! grep -Eq 'document\.body\.style\.(overflow|position|top|left|right|width)[[:space:]]*=' /tmp/gb-smoke/map-engine.js \
              && ! grep -Eq 'document\.(body|documentElement)\.style\.(overflow|position|top|left|right|width|overscrollBehavior)[[:space:]]*=' /tmp/gb-smoke/mindmap.html; then
              echo '✅ Production smoke: exact merged special overlay assets are live'
              echo "attempt=${attempt}" >> "$GITHUB_OUTPUT"
              echo "root_bytes=$(wc -c < /tmp/gb-smoke/index.html)" >> "$GITHUB_OUTPUT"
              echo "site_js_bytes=$(wc -c < /tmp/gb-smoke/site.js)" >> "$GITHUB_OUTPUT"
              echo "map_engine_bytes=$(wc -c < /tmp/gb-smoke/map-engine.js)" >> "$GITHUB_OUTPUT"
              echo "mindmap_bytes=$(wc -c < /tmp/gb-smoke/mindmap.html)" >> "$GITHUB_OUTPUT"
              echo "site_js_sha256=$(sha256sum /tmp/gb-smoke/site.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"
              echo "map_engine_sha256=$(sha256sum /tmp/gb-smoke/map-engine.js | awk '{print $1}')" >> "$GITHUB_OUTPUT"
              echo "mindmap_sha256=$(sha256sum /tmp/gb-smoke/mindmap.html | awk '{print $1}')" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            sleep 10
          done

          echo '❌ Deployed assets did not converge to the expected special overlay runtime'
          for file in /tmp/gb-smoke/*; do
            echo "--- ${file} ($(wc -c < "$file" 2>/dev/null || echo 0) bytes)"
          done
          exit 1

      - name: Persist production evidence
        env:
          ATTEMPT: ${{ steps.smoke.outputs.attempt }}
          ROOT_BYTES: ${{ steps.smoke.outputs.root_bytes }}
          SITE_JS_BYTES: ${{ steps.smoke.outputs.site_js_bytes }}
          MAP_ENGINE_BYTES: ${{ steps.smoke.outputs.map_engine_bytes }}
          MINDMAP_BYTES: ${{ steps.smoke.outputs.mindmap_bytes }}
          SITE_JS_SHA256: ${{ steps.smoke.outputs.site_js_sha256 }}
          MAP_ENGINE_SHA256: ${{ steps.smoke.outputs.map_engine_sha256 }}
          MINDMAP_SHA256: ${{ steps.smoke.outputs.mindmap_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p reports
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          evidence = {
              'contract': 'special-overlay-production-smoke/v1',
              'verified_source_merge_sha': '39f6c3ac5851b6ded164f4de42b4e9dba1ca72e7',
              'smoke_trigger_sha': os.environ['GITHUB_SHA'],
              'verified_at_utc': datetime.now(timezone.utc).isoformat(),
              'public_origin': 'https://gospod-bog.ru',
              'attempt': int(os.environ['ATTEMPT']),
              'assets': {
                  '/': {'bytes': int(os.environ['ROOT_BYTES']), 'http': 200},
                  '/js/site.js': {'bytes': int(os.environ['SITE_JS_BYTES']), 'sha256': os.environ['SITE_JS_SHA256'], 'exact_repo_match': True},
                  '/karty/_engine/map-engine.js': {'bytes': int(os.environ['MAP_ENGINE_BYTES']), 'sha256': os.environ['MAP_ENGINE_SHA256'], 'exact_repo_match': True},
                  '/konfessii/russkij-baptizm/_app/index.html': {'bytes': int(os.environ['MINDMAP_BYTES']), 'sha256': os.environ['MINDMAP_SHA256'], 'exact_repo_match': True},
              },
              'assertions': {
                  'main_contains_merge': True,
                  'current_main_blobs_equal_merge_blobs': True,
                  'site_image_viewer_owner_live': True,
                  'map_namespaced_owners_live': True,
                  'map_fallback_idempotency_live': True,
                  'built_launcher_owner_live': True,
                  'built_launcher_loads_canonical_runtime': True,
                  'legacy_special_direct_writers_absent': True,
              },
              'result': 'PASS',
          }
          with open('reports/SPECIAL-OVERLAY-PRODUCTION-SMOKE-2026-07-21.json', 'w', encoding='utf-8') as handle:
              json.dump(evidence, handle, ensure_ascii=False, indent=2)
              handle.write('\n')
          PY
          git add reports/SPECIAL-OVERLAY-PRODUCTION-SMOKE-2026-07-21.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'Production evidence already current'
            exit 0
          fi
          git commit -m 'test(production): record special overlay smoke evidence'
          for retry in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((retry * 2))
          done
          exit 1
