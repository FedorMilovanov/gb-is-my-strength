name: TEMP reader R3 commit recovery

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  recover:
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Reapply deterministic implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/_temp-reader-r3-inventory.yml').read_text(encoding='utf-8').splitlines()
          marker = '- name: Introduce façade and migrate consumers'
          step = next(i for i, line in enumerate(lines) if marker in line)
          start = next(i for i in range(step, len(lines)) if "python3 - <<'PY'" in lines[i])
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = []
          for line in lines[start + 1:end]:
            code.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reader-r3-apply.py').write_text('\n'.join(code) + '\n', encoding='utf-8')
          PY
          python3 /tmp/reader-r3-apply.py
      - name: Record validation diagnostics
        shell: bash
        run: |
          set +e
          {
            node --check scripts/series-reader-facade-regression-test.js
            npm run series:facade:guard
            npm run engine:contracts
          } 2>&1 | tee /tmp/reader-r3-validation.txt
          echo "validation_exit=${PIPESTATUS[0]}" >> /tmp/reader-r3-validation.txt
          exit 0
      - name: Diagnose commit and push
        shell: bash
        run: |
          set +e
          {
            echo '=== before rm ==='
            git status --short
            git rm .github/workflows/_temp-reader-r3-inventory.yml .github/workflows/_temp-reader-r3-commit-recovery.yml
            echo "git_rm_exit=$?"
            git add -A
            echo "git_add_exit=$?"
            echo '=== staged stat ==='
            git diff --cached --stat
            echo '=== staged names ==='
            git diff --cached --name-status
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor(reader): route series through neutral façade'
            commit_status=$?
            echo "git_commit_exit=$commit_status"
            if [ "$commit_status" -eq 0 ]; then
              git push origin "HEAD:${GITHUB_HEAD_REF}"
              echo "git_push_exit=$?"
            fi
            echo '=== after attempt ==='
            git status --short
          } 2>&1 | tee /tmp/reader-r3-commit.txt
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r3-commit-diagnostics
          path: |
            /tmp/reader-r3-validation.txt
            /tmp/reader-r3-commit.txt
          if-no-files-found: error
          retention-days: 1
