name: TEMP reader R3 source commit

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  commit-source:
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Reapply deterministic implementation patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lines = Path('.github/workflows/_temp-reader-r3-inventory.yml').read_text(encoding='utf-8').splitlines()
          marker = '- name: Introduce façade and migrate consumers'
          step = next(i for i, line in enumerate(lines) if marker in line)
          start = next(i for i in range(step, len(lines)) if "python3 - <<'PY'" in lines[i])
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = []
          for line in lines[start + 1:end]:
            code.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/reader-r3-apply.py').write_text('\n'.join(code) + '\n', encoding='utf-8')
          PY
          python3 /tmp/reader-r3-apply.py
      - name: Validate permanent source contracts
        run: |
          node --check scripts/series-reader-facade-regression-test.js
          npm run series:facade:guard
          npm run engine:contracts
      - name: Commit only non-workflow files
        shell: bash
        run: |
          # The branch workflow files are written separately by the GitHub App,
          # because the ephemeral GITHUB_TOKEN cannot update workflow paths.
          git restore -- .github/workflows/shared-files-guard.yml
          git add -A
          git restore --staged .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'workflow file unexpectedly staged' >&2
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(reader): route series through neutral façade'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
