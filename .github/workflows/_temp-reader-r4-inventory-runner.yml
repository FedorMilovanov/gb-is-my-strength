name: TEMP reader R4 registry implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'lane/reader-r4-public-surface-registry-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Rebuild exact R4 inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/_temp-reader-r4-inventory.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "node <<'JS'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'JS')
          code = [line[10:] if line.startswith('          ') else line for line in lines[start + 1:end]]
          Path('/tmp/reader-r4-inventory.js').write_text('\n'.join(code) + '\n', encoding='utf-8')
          PY
          node /tmp/reader-r4-inventory.js
      - name: Apply deterministic R4 implementation
        run: python3 scripts/_temp-reader-r4-apply.py
      - name: Validate permanent R4 contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          {
            node --check scripts/lib/public-surface-registry.js
            node --check scripts/public-surface-registry-audit.js
            node --check scripts/public-surface-registry-regression-test.js
            npm run surface:registry:check
            npm run surface:registry:test
            npm run migration:metadata:check:strict
            git diff --check
          } 2>&1 | tee reports/reader-r4-implementation.log
      - name: Commit permanent non-workflow implementation
        shell: bash
        run: |
          git add data/route-profiles \
                  package.json \
                  scripts/lib/public-surface-registry.js \
                  scripts/public-surface-registry-audit.js \
                  scripts/public-surface-registry-regression-test.js \
                  docs/READER-R4-PUBLIC-SURFACE-INVENTORY-2026-07-21.md \
                  docs/READER-R4-PUBLIC-SURFACE-REGISTRY-2026-07-21.md
          if git diff --cached --quiet; then
            echo 'Permanent R4 implementation already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(reader): derive public surface registry from route profiles'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
      - name: Upload R4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r4-implementation-${{ github.run_id }}
          path: |
            reports/reader-r4-implementation.log
            reports/reader-r4-public-surface-inventory.md
            reports/reader-r4-public-surface-inventory.json
          if-no-files-found: warn
          retention-days: 1
