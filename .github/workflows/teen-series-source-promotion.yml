name: Teen Series Source Promotion

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - "src/content/articles/podrostok-za-kadrom-*.mdx"
      - "src/content/articles/vzroslyy-rebenok-*.mdx"
      - "src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx"
      - "src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx"
      - "src/pages/podrostok-za-kadrom/**"
      - "src/pages/articles/podrostok-za-kadrom-*/**"
      - "src/pages/articles/vzroslyy-rebenok-*/**"
      - "src/pages/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya/**"
      - "src/pages/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti/**"
      - "scripts/teen-series-source-promotion.mjs"
      - ".github/workflows/teen-series-source-promotion.yml"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: teen-series-source-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promote-source:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/teen-series-live-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Snapshot machine writer lease
        run: node scripts/writer-lease.mjs snapshot

      - name: Reject stale or foreign writer before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Normalize only the seven teen MDX frontmatters
        run: node scripts/teen-series-source-promotion.mjs --write

      - name: Validate bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > /tmp/teen-source-files
          if [[ -s /tmp/teen-source-files ]]; then
            while IFS= read -r file; do
              case "$file" in
                src/content/articles/podrostok-za-kadrom-dvoynaya-zhizn.mdx|\
                src/content/articles/podrostok-za-kadrom-roditelyam-posle-razoblacheniya.mdx|\
                src/content/articles/podrostok-za-kadrom-chto-delat-tserkvi.mdx|\
                src/content/articles/vzroslyy-rebenok-ushel-kontakt-pokayanie-vozvrashchenie.mdx|\
                src/content/articles/vzroslyy-rebenok-doma-dengi-pomoshch-posledstviya.mdx|\
                src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx|\
                src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx) ;;
                *) echo "Unexpected source-promotion path: $file" >&2; exit 1 ;;
              esac
            done < /tmp/teen-source-files
          fi
          node scripts/teen-series-source-promotion.mjs

      - name: Commit normalized source publication state
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/content/articles; then
            echo "Teen source publication state is already canonical."
            exit 0
          fi
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          EXPECTED_HEAD="$(node scripts/writer-lease.mjs field expectedHead)"
          LEASE_TRAILER="$(node scripts/writer-lease.mjs trailer)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/articles/podrostok-za-kadrom-dvoynaya-zhizn.mdx \
                  src/content/articles/podrostok-za-kadrom-roditelyam-posle-razoblacheniya.mdx \
                  src/content/articles/podrostok-za-kadrom-chto-delat-tserkvi.mdx \
                  src/content/articles/vzroslyy-rebenok-ushel-kontakt-pokayanie-vozvrashchenie.mdx \
                  src/content/articles/vzroslyy-rebenok-doma-dengi-pomoshch-posledstviya.mdx \
                  src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx \
                  src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx
          git commit -m "content(teen): promote canonical publication frontmatter" -m "${LEASE_TRAILER}"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:${HEAD_REF}"
