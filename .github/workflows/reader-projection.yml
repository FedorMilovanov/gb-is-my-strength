name: Reader Projection Contract

on:
  pull_request:
    paths:
      - "css/site.css"
      - "js/site.js"
      - "src/components/reader-platform/ReaderActionsRuntime.astro"
      - "src/runtime/article-interactions.js"
      - "src/runtime/article-tooltips.css"
      - "src/runtime/article-tooltips.js"
      - "src/runtime/reader-projection.js"
      - "src/runtime/reader-tts.js"
      - "src/runtime/print-pagination-geometry.js"
      - "src/components/article-pilots/_shared/ReaderRail.astro"
      - "src/components/article-pilots/_shared/ReaderSettings.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaPageHead.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaBody.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaMobileBar.astro"
      - "src/components/article-pilots/hermenevtika/hermenevtika-footnotes.css"
      - "src/components/article-pilots/kod-da-vinchi/KodDaVinchiPageChrome.astro"
      - "src/components/article-pilots/kod-da-vinchi/KodDaVinchiMainShell.astro"
      - "src/pages/articles/hermenevticheskaya-otsenka-hristotsentrichnoy-germenevtiki/index.astro"
      - "scripts/reader-projection-source-contract.mjs"
      - "scripts/reader-projection-browser-contract.mjs"
      - "scripts/reader-projection-tooltip-handoff-contract.mjs"
      - ".github/workflows/reader-projection.yml"
  push:
    branches: [main]
    paths:
      - "css/site.css"
      - "js/site.js"
      - "src/components/reader-platform/ReaderActionsRuntime.astro"
      - "src/runtime/article-interactions.js"
      - "src/runtime/article-tooltips.css"
      - "src/runtime/article-tooltips.js"
      - "src/runtime/reader-projection.js"
      - "src/runtime/reader-tts.js"
      - "src/runtime/print-pagination-geometry.js"
      - "src/components/article-pilots/_shared/ReaderRail.astro"
      - "src/components/article-pilots/_shared/ReaderSettings.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaPageHead.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaBody.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaMobileBar.astro"
      - "src/components/article-pilots/hermenevtika/hermenevtika-footnotes.css"
      - "src/components/article-pilots/kod-da-vinchi/KodDaVinchiPageChrome.astro"
      - "src/components/article-pilots/kod-da-vinchi/KodDaVinchiMainShell.astro"
      - "src/pages/articles/hermenevticheskaya-otsenka-hristotsentrichnoy-germenevtiki/index.astro"
      - "scripts/reader-projection-source-contract.mjs"
      - "scripts/reader-projection-browser-contract.mjs"
      - "scripts/reader-projection-tooltip-handoff-contract.mjs"
      - ".github/workflows/reader-projection.yml"

permissions:
  contents: read

concurrency:
  group: reader-projection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  projection-contract:
    name: Source and Chromium projection contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Syntax and source contract
        run: |
          mkdir -p reports
          node --check src/runtime/reader-projection.js
          node --check scripts/reader-projection-source-contract.mjs
          node --check scripts/reader-projection-browser-contract.mjs
          node --check scripts/reader-projection-tooltip-handoff-contract.mjs
          set -o pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/reader-projection-source-contract.mjs 2>&1 | tee reports/reader-projection-source-contract.log

      - name: Build production-like dist
        run: |
          set -o pipefail
          npm run strangler:build:production-like 2>&1 | tee reports/reader-projection-build.log

      - name: Run permanent browser contracts
        run: |
          set -o pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/reader-projection-browser-contract.mjs 2>&1 | tee reports/reader-projection-browser-contract.log
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/reader-projection-tooltip-handoff-contract.mjs 2>&1 | tee reports/reader-projection-tooltip-handoff-contract.log

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-projection-${{ github.run_id }}
          path: |
            reports/reader-projection-build.log
            reports/reader-projection-source-contract.log
            reports/reader-projection-source-contract.json
            reports/reader-projection-source-contract.md
            reports/reader-projection-browser-contract.log
            reports/reader-projection-browser-contract.json
            reports/reader-projection-browser-contract.md
            reports/reader-projection-tooltip-handoff-contract.log
            reports/reader-projection-tooltip-handoff-contract.json
            reports/reader-projection-tooltip-handoff-contract.md
            reports/reader-projection-*.png
          if-no-files-found: warn
          retention-days: 14
