name: TEMP Map Archaeology Coverage Materialize

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - scripts/_temp-map-archaeology-boundary-materialize.mjs
      - scripts/map-archaeology-source-registry-audit.js
      - scripts/map-archaeology-category-coverage-audit.js
      - karty/_data/archaeology-source-registry.json
      - karty/_data/archaeology-source-provenance.json
      - .github/workflows/_temp-map-archaeology-coverage-materialize.yml

concurrency:
  group: temp-map-archaeology-boundary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-boundary:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/map-archaeology-registry-expansion' &&
      contains(github.event.pull_request.labels.*.name, 'autofix')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Materialize exact provenance foundation boundary
        run: node scripts/_temp-map-archaeology-boundary-materialize.mjs --write
      - name: Verify syntax and independent contracts
        run: |
          node --check scripts/_temp-map-archaeology-boundary-materialize.mjs
          node scripts/_temp-map-archaeology-boundary-materialize.mjs
          node scripts/map-archaeology-source-registry-audit.js
          node scripts/map-archaeology-category-coverage-audit.js
      - name: Upload boundary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-archaeology-boundary-${{ github.run_id }}
          path: |
            reports/map-archaeology-source-registry.json
            reports/map-archaeology-category-coverage.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verify exact two-file boundary diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'changed[%s]=%s\n' "${#changed[@]}" "${changed[*]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "karty/_data/archaeology-source-provenance.json"
          test "${changed[1]}" = "karty/_data/archaeology-source-registry.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('karty/_data/archaeology-source-registry.json','utf8'));
          const provenance = JSON.parse(fs.readFileSync('karty/_data/archaeology-source-provenance.json','utf8'));
          const expected = '83a13a0755b37296ccec053987654ceefbca349e';
          if (catalog.sourceBoundary !== expected || provenance.catalogBoundary !== expected) throw new Error('boundary drift');
          if (catalog.sources.length !== 94 || Object.keys(provenance.records).length !== 94) throw new Error('corpus drift');
          console.log(`PASS shared archaeology boundary ${expected}`);
          NODE
      - name: Commit exact boundary transaction
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karty/_data/archaeology-source-registry.json karty/_data/archaeology-source-provenance.json
          git diff --cached --check
          git commit -m "research(karty): pin provenance foundation boundary"
          git push origin "HEAD:${HEAD_REF}"
