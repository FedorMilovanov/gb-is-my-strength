name: Temporary Reader R6 Force Contract

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-reader-r6-force-contract.yml"
      - "scripts/_temp_reader_r6_force.patch.gz.b64"

permissions:
  contents: write

concurrency:
  group: temp-reader-r6-force-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Detect pending payload
        id: payload
        shell: bash
        run: |
          if test -f scripts/_temp_reader_r6_force.patch.gz.b64; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "R6 force-save patch already materialized."
          fi

      - name: Set up Node.js 22
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify and apply exact force-save patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '7a276329148f91d9ad0b9c83d5f3e838f74aadd47696731288991febc70cf5e2' \
            'scripts/_temp_reader_r6_force.patch.gz.b64' \
            | sha256sum -c -
          base64 --decode scripts/_temp_reader_r6_force.patch.gz.b64 > /tmp/reader-r6-force.patch.gz
          printf '%s  %s\n' \
            '68e4e083fc28b12ba9c7e5971a2f375d3456a54d8ca73ee7da90820e7e82545e' \
            '/tmp/reader-r6-force.patch.gz' \
            | sha256sum -c -
          gzip --decompress --stdout /tmp/reader-r6-force.patch.gz > /tmp/reader-r6-force.patch
          printf '%s  %s\n' \
            '4d28b2f3c6d2a1b9065ae0694db0cd72f1d07f94dbd982f642768cf473bef738' \
            '/tmp/reader-r6-force.patch' \
            | sha256sum -c -
          patch -p1 --batch --forward < /tmp/reader-r6-force.patch
          rm scripts/_temp_reader_r6_force.patch.gz.b64

      - name: Install dependencies
        if: steps.payload.outputs.present == 'true'
        run: npm ci

      - name: Synchronize generated asset revisions
        if: steps.payload.outputs.present == 'true'
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Verify force-save and reader contracts
        if: steps.payload.outputs.present == 'true'
        run: |
          node --check js/reader-state.js
          node scripts/reader-state-regression-test.js
          node scripts/reader-preferences-regression-test.js
          npm run engine:contracts
          npm run astro:check

      - name: Verify repository policy
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-pro.js
          git clean -f -- audit/audit-pro-*.md
          node scripts/cache-bust.js
          git diff --check
          test ! -e scripts/_temp_reader_r6_force.patch.gz.b64

      - name: Commit permanent force-save contract
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/_temp-reader-r6-force-contract.yml'
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] fix(reader): preserve forced deep resume state"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
