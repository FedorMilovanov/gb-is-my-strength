name: TEMP Print Decoration Diagnose

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-print-decoration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run source and live DOM diagnostics
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist >/tmp/print-decoration-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/articles/dzhon-gill-chast-1-chelovek/ >/dev/null && break
            sleep 1
          done
          PRINT_DIAG_BASE_URL=http://127.0.0.1:4173 node scripts/_temp-print-decoration-diagnose.mjs
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-decoration-diagnose-${{ github.run_id }}
          path: reports/print-decoration-diagnose
          if-no-files-found: warn
          retention-days: 7
