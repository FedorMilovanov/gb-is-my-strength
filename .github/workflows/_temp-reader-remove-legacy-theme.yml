name: TEMP reader remove legacy theme

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Remove route-owned theme bootstraps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_remove_legacy_theme_bootstraps.py
          node scripts/reader-preferences-regression-test.js
          node scripts/audit-pro.js
          npm run engine:contracts

      - name: Commit canonical first-paint ownership
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git add scripts/reader-preferences-regression-test.js
          git diff --cached --quiet && { echo 'no legacy bootstrap migration'; exit 1; }
          git commit -m "[LANE lane/system-reader-preferences-foundation-2026-07-21] refactor(reader): remove route-owned theme bootstraps"
          git push origin HEAD:lane/system-reader-preferences-foundation-2026-07-21
