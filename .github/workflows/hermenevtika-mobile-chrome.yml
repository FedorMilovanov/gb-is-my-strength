name: Hermenevtika Mobile Chrome Contract

on:
  pull_request:
    paths:
      - 'src/components/ui/floating-cluster/SingleArticleCluster.astro'
      - 'src/components/article-pilots/hermenevtika/**'
      - 'src/components/article-pilots/kod-da-vinchi/**'
      - 'css/floating-cluster.css'
      - 'css/highlights-runtime.css'
      - 'js/highlights.js'
      - 'src/lib/asset-version.js'
      - 'scripts/hermenevtika-mobile-chrome-visual-contract.mjs'
      - '.github/workflows/hermenevtika-mobile-chrome.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/ui/floating-cluster/SingleArticleCluster.astro'
      - 'src/components/article-pilots/hermenevtika/**'
      - 'src/components/article-pilots/kod-da-vinchi/**'
      - 'css/floating-cluster.css'
      - 'css/highlights-runtime.css'
      - 'js/highlights.js'
      - 'src/lib/asset-version.js'
      - 'scripts/hermenevtika-mobile-chrome-visual-contract.mjs'
      - '.github/workflows/hermenevtika-mobile-chrome.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermenevtika-mobile-chrome-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium + WebKit breakpoint and docked-control contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Source boundary and workflow checks
        run: |
          node --check scripts/hermenevtika-mobile-chrome-visual-contract.mjs
          grep -F '@media (max-width: 1199px)' src/components/ui/floating-cluster/SingleArticleCluster.astro
          grep -F '.gb-floater.gb-floater--hermeneutics { display: none; }' src/components/ui/floating-cluster/SingleArticleCluster.astro
          grep -F '#gb-hl-fab.gb-hl-fab--docked.hmbar-btn' src/components/ui/floating-cluster/SingleArticleCluster.astro
          npm run workflows:check
          npm run control-plane:audit

      - name: Build production-like dist
        run: |
          mkdir -p reports
          set -o pipefail
          npm run strangler:build:production-like 2>&1 | tee reports/hermenevtika-mobile-chrome-build.log

      - name: Run permanent cross-browser visual contract
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          node scripts/hermenevtika-mobile-chrome-visual-contract.mjs 2>&1 | tee reports/hermenevtika-mobile-chrome-visual.log

      - name: Run shared publication barrier
        run: |
          set -o pipefail
          npm run validate:static-publication 2>&1 | tee reports/hermenevtika-mobile-chrome-publication.log

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermenevtika-mobile-chrome-${{ github.run_id }}
          path: |
            reports/hermenevtika-mobile-chrome-build.log
            reports/hermenevtika-mobile-chrome-visual.log
            reports/hermenevtika-mobile-chrome-publication.log
            reports/hermenevtika-mobile-chrome-visual-contract.json
            reports/hermenevtika-mobile-chrome-visual-contract.md
            reports/hermenevtika-mobile-chrome-*.png
          if-no-files-found: warn
          retention-days: 14
