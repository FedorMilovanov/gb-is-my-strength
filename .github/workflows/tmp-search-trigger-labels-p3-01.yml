name: Temporary Search trigger labels P3-01 publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/tmp_search_trigger_labels_writer.py
      - .github/workflows/tmp-search-trigger-labels-p3-01.yml

permissions:
  contents: write

concurrency:
  group: search-trigger-labels-p3-01-agent-search-trigger-labels-p3-01-20260806
  cancel-in-progress: true

jobs:
  publish-clean-label-lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact base branch and transport shape
        env:
          EXPECTED_BASE: 8a51db9a2df74fa615a3eaca698144302e47e332
          EXPECTED_BRANCH: agent/search-trigger-labels-p3-01-20260806
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$GITHUB_HEAD_REF" = "$EXPECTED_BRANCH"
          mapfile -t transport < <(git diff --name-only "$EXPECTED_BASE"...HEAD)
          printf '%s\n' "${transport[@]}"
          test "${#transport[@]}" -eq 2
          test "${transport[0]}" = ".github/workflows/tmp-search-trigger-labels-p3-01.yml"
          test "${transport[1]}" = "scripts/tmp_search_trigger_labels_writer.py"

      - name: Patch and apply bounded writer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_search_trigger_labels_writer.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1, found {count}')
              text = text.replace(old, new, 1)

          old_assets = '''assets = read("scripts/cache-bust-assets.js")
          assets = replace_once(
              assets,
              "  'js/search.js',\\n",
              "  'js/search-trigger-labels.js',\\n  'js/search.js',\\n",
              "cache-bust asset registration",
          )
          write("scripts/cache-bust-assets.js", assets)
          '''
          new_assets = '''assets = read("scripts/cache-bust-assets.js")
          marker = "  'js/search.js',\\n"
          if assets.count(marker) != 2:
              raise SystemExit(f"cache-bust search asset occurrences: expected 2, found {assets.count(marker)}")
          assets = assets.replace(marker, "  'js/search-trigger-labels.js',\\n  'js/search.js',\\n", 1)
          write("scripts/cache-bust-assets.js", assets)
          '''
          replace_once(old_assets, new_assets, 'asset patch')

          start_marker = "  const sync = (root = document) => {\n"
          end_marker = "  window.addEventListener('pageshow', run);\n"
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit(f'helper anchors start={text.count(start_marker)} end={text.count(end_marker)}')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          helper = '''  const setAttr = (node, name, value) => {
            if (node.getAttribute(name) !== value) node.setAttribute(name, value);
          };

          const setText = (node, value) => {
            if (node.textContent !== value) node.textContent = value;
          };

          const sync = (root = document) => {
            const key = shortcut();
            const mod = modifier();
            const nodes = collect(root);
            nodes.forEach((control) => {
              setAttr(control, 'data-search-shortcut', '');
              setAttr(control, 'data-search-shortcut-label', LABEL);
              setAttr(control, 'aria-label', `${LABEL} (${key})`);
              setAttr(control, 'title', `${LABEL} ${key}`);
              setAttr(control, 'data-search-label-ready', key);
              control.querySelectorAll('[data-search-shortcut-value], .kb').forEach((hint) => setText(hint, key));
              control.querySelectorAll('[data-search-shortcut-modifier]').forEach((hint) => setText(hint, mod));
            });
            return nodes.length;
          };

          const api = Object.freeze({
            version: 1,
            label: LABEL,
            selector: SELECTOR,
            platformValue,
            modifier,
            shortcut,
            sync,
          });

          window.GBSearchTriggerLabels = api;
          let syncQueued = false;
          const scheduleSync = () => {
            if (syncQueued) return;
            syncQueued = true;
            queueMicrotask(() => {
              syncQueued = false;
              api.sync(document);
            });
          };
          const observer = new MutationObserver((records) => {
            const relevant = records.some((record) => {
              if (record.type === 'attributes') return record.target instanceof Element && record.target.matches(SELECTOR);
              return [...record.addedNodes].some((node) => node instanceof Element && (node.matches(SELECTOR) || node.querySelector(SELECTOR)));
            });
            if (relevant) scheduleSync();
          });
          const run = () => {
            api.sync(document);
            observer.observe(document.documentElement, {
              childList: true,
              subtree: true,
              attributes: true,
              attributeFilter: ['aria-label', 'title', 'data-search-shortcut-label'],
            });
          };
          if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run, { once: true });
          else run();
          window.addEventListener('pageshow', scheduleSync);
          '''
          text = text[:start] + helper + text[end:]

          for old, new in (
              ("control.setAttribute('aria-label', `${LABEL} (${key})`)", "setAttr(control, 'aria-label', `${LABEL} (${key})`)"),
              ("control.setAttribute('title', `${LABEL} ${key}`)", "setAttr(control, 'title', `${LABEL} ${key}`)"),
              ("control.setAttribute('data-search-label-ready', key)", "setAttr(control, 'data-search-label-ready', key)"),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'source contract marker drift: {old} count={text.count(old)}')
              text = text.replace(old, new, 1)

          source_marker = '  "window.GBSearchTriggerLabels = api",\n])'
          source_replacement = '  "window.GBSearchTriggerLabels = api",\n  "const observer = new MutationObserver",\n  "attributeFilter: [\'aria-label\', \'title\', \'data-search-shortcut-label\']",\n  "queueMicrotask",\n])'
          replace_once(source_marker, source_replacement, 'observer source contract')

          readiness_old = '''    await page.waitForFunction(({ selector, shortcut }) => {
      const controls = [...document.querySelectorAll(selector)];
      return controls.length > 0 && controls.every((control) => control.getAttribute('data-search-label-ready') === shortcut);
    }, { selector, shortcut: scenario.shortcut }, { timeout: 30_000 });
'''
          readiness_new = '''    await page.waitForFunction(({ selector, shortcut }) => {
      const controls = [...document.querySelectorAll(selector)];
      const expectedAria = `Поиск по всему сайту (${shortcut})`;
      const expectedTitle = `Поиск по всему сайту ${shortcut}`;
      return controls.length > 0 && controls.every((control) =>
        control.getAttribute('data-search-label-ready') === shortcut
        && control.getAttribute('aria-label') === expectedAria
        && control.getAttribute('title') === expectedTitle
      );
    }, { selector, shortcut: scenario.shortcut }, { timeout: 30_000 });
'''
          replace_once(readiness_old, readiness_new, 'exact initial label readiness')

          browser_marker = "    const trigger = page.locator('#gbSearchBtn').first();\n"
          browser_replacement = '''    const lateControl = page.locator(selector).first();
            await lateControl.evaluate((node) => {
              node.setAttribute('aria-label', 'Поздний локальный drift');
              node.setAttribute('title', 'Поздний локальный drift');
            });
            await page.waitForFunction(({ selector, shortcut }) => {
              const control = document.querySelector(selector);
              return control?.getAttribute('aria-label') === `Поиск по всему сайту (${shortcut})`
                && control?.getAttribute('title') === `Поиск по всему сайту ${shortcut}`;
            }, { selector, shortcut: scenario.shortcut }, { timeout: 10_000 });

            const trigger = page.locator('#gbSearchBtn').first();
          '''
          replace_once(browser_marker, browser_replacement, 'late-drift browser contract')
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/tmp_search_trigger_labels_writer.py
          test ! -e scripts/tmp_search_trigger_labels_writer.py
          test ! -e .github/workflows/tmp-search-trigger-labels-p3-01.yml
          node --check js/search.js
          node --check js/search-trigger-labels.js
          node --check scripts/search-trigger-label-source-contract.mjs
          node --check scripts/search-trigger-label-browser-contract.mjs
          node scripts/search-trigger-label-source-contract.mjs

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Synchronize and validate governed source
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          node scripts/search-trigger-label-source-contract.mjs
          npm run workflows:check
          npm run workflows:lint
          npm run astro:check

      - name: Prove bounded functional and generated paths
        run: |
          set -euo pipefail
          git add -N .
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess

          base = '8a51db9a2df74fa615a3eaca698144302e47e332'
          root = Path('.')
          functional = {
              '.github/workflows/search-modal-contract.yml', 'js/search-trigger-labels.js', 'js/search.js',
              'scripts/cache-bust-assets.js', 'scripts/search-trigger-label-source-contract.mjs',
              'scripts/search-trigger-label-browser-contract.mjs',
              'src/components/reader-platform/ReaderPreferencesHead.astro',
              'src/components/home/HomePageChrome.astro', 'src/components/search/AppSearchSurface.astro',
              'src/lib/asset-version.js',
          }
          changed = subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines()
          missing = sorted(functional - set(changed))
          if missing: raise SystemExit(f'missing functional paths: {missing}')
          if any(p.startswith('.github/workflows/tmp-') or p.startswith('scripts/tmp_') for p in changed):
              raise SystemExit('temporary transport survived')
          search_hash = hashlib.md5((root / 'js/search.js').read_bytes()).hexdigest()[:8]
          def base_text(p): return subprocess.check_output(['git', 'show', f'{base}:{p}'], text=True)
          for p in changed:
              if p in functional: continue
              if p.endswith('.astro'):
                  expected = re.sub(r'((?:\.\./)*|/?)js/search\.js\?v=[^\s"\'&}>]+', lambda m: f'{m.group(1)}js/search.js?v={search_hash}', base_text(p))
              elif p.endswith('.html'):
                  expected = re.sub(r'((?:\.\./)*js/search\.js)(?:\?v=[^\s"&]+)?', lambda m: f'{m.group(1)}?v={search_hash}', base_text(p))
              else:
                  raise SystemExit(f'unexpected non-projection path: {p}')
              if (root / p).read_text(encoding='utf-8') != expected:
                  raise SystemExit(f'non-cache-bust drift: {p}')
          print(f'BOUNDED SEARCH LABEL PATHS: {len(changed)} total; search={search_hash}')
          print('\n'.join(changed))
          PY

      - name: Build production-like publication
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate core app and late-drift label contracts
        run: |
          set -euo pipefail
          node scripts/search-modal-browser-contract.mjs --dist=dist --report=reports/search-modal-contract/core
          node scripts/app-search-surface-browser-contract.mjs --dist=dist --report=reports/search-modal-contract/app-surfaces
          node scripts/search-trigger-label-browser-contract.mjs --dist=dist --report=reports/search-modal-contract/trigger-labels

      - name: Recheck tracked diff and publication purity
        run: |
          set -euo pipefail
          node scripts/cache-bust.js
          node scripts/search-trigger-label-source-contract.mjs
          git diff --check
          test -z "$(git status --short --untracked-files=no | grep -E '^( M|M |A | D|D ) dist/|reports/' || true)"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-search-trigger-labels-${{ github.run_id }}
          path: reports/search-modal-contract/**
          if-no-files-found: warn
          retention-days: 14

      - name: Canonicalize to one clean commit and push guarded ref
        env:
          EXPECTED_BASE: 8a51db9a2df74fa615a3eaca698144302e47e332
          BRANCH: agent/search-trigger-labels-p3-01-20260806
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -rf reports/search-modal-contract dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft "$EXPECTED_BASE"
          git add -A
          test ! -e scripts/tmp_search_trigger_labels_writer.py
          test ! -e .github/workflows/tmp-search-trigger-labels-p3-01.yml
          git diff --cached --check
          git commit -m "fix(search): unify platform-aware trigger labels"
          git push --force-with-lease="refs/heads/$BRANCH:$TARGET_SHA" origin "HEAD:refs/heads/$BRANCH"

# transport retrigger: definition already existed on the previous head
