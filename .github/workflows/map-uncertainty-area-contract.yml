name: Map Uncertainty Area Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'karty/**/route.json'
      - 'karty/_shared/uncertainty-area.schema.json'
      - 'scripts/map-uncertainty-area-contract.js'
      - 'scripts/map-uncertainty-area-contract-test.js'
      - '.github/workflows/map-uncertainty-area-contract.yml'
  push:
    branches: [main]
    paths:
      - 'karty/**/route.json'
      - 'karty/_shared/uncertainty-area.schema.json'
      - 'scripts/map-uncertainty-area-contract.js'
      - 'scripts/map-uncertainty-area-contract-test.js'
      - '.github/workflows/map-uncertainty-area-contract.yml'

permissions:
  contents: read

concurrency:
  group: map-uncertainty-area-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Verify uncertainty-area source contract
        run: node scripts/map-uncertainty-area-contract.js
      - name: Verify fail-closed mutations
        run: node scripts/map-uncertainty-area-contract-test.js
      - name: Verify source syntax
        run: |
          node --check scripts/map-uncertainty-area-contract.js
          node --check scripts/map-uncertainty-area-contract-test.js
      - name: Lint workflow
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/map-uncertainty-area-contract.yml
      - name: Ensure validation is read-only
        run: git diff --exit-code
