name: Home Audit Final Search Patch

on:
  pull_request:
    paths:
      - '.github/workflows/home-audit-final-search-patch.yml'
      - 'scripts/home-audit-final-search-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: lane/home-search-audit-pro-2026-08-03
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified audit-only corrections
        run: python3 scripts/home-audit-final-search-patch.py

      - name: Verify audit source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/home-design-audit-pro.mjs
          git diff --check
          git diff --name-only

      - name: Commit corrected audit to lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(home): verify settled search result states'
          git push origin HEAD:lane/home-search-audit-pro-2026-08-03
