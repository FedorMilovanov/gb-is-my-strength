name: Dist Strangler Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-strangler-dry-run
  cancel-in-progress: true

jobs:
  dist-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Static root gates
        run: npm run ci:check

      - name: About visual review screenshots
        run: npm run astro:audit:about:shots

      - name: Production-like strangler readiness
        run: npm run strangler:deploy-readiness

      - name: Verify production-like artifact shape
        run: |
          test -f dist/index.html
          test -f dist/about/index.html
          test -f dist/articles/dzhon-gill-spravochnik/index.html
          test -f dist/articles/dzhon-gill-istoricheskiy-kontekst/index.html
          test -f dist/pagefind/pagefind.js
          test -f dist/.nojekyll
          test ! -e dist/dev/astro-test/index.html
          test ! -e dist/dev/article-mdx-pilot/index.html

      - name: Upload production-like dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-like-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist-dry-run-review-reports
          path: |
            reports
            audit
          if-no-files-found: warn
          retention-days: 7
