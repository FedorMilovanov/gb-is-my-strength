name: Dist Strangler Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dist-strangler-dry-run
  cancel-in-progress: true

jobs:
  dist-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Static root gates
        run: npm run ci:check

      - name: Prove validation is source-read-only
        run: git diff --exit-code

      - name: About visual review screenshots
        run: npm run astro:audit:about:shots

      - name: Production-like strangler readiness
        run: npm run strangler:deploy-readiness

      - name: Verify registry-owned production artifact shape
        run: |
          node scripts/check-page-ownership.js --dist --production-like
          test -f dist/pagefind/pagefind.js
          test -f dist/.nojekyll

      - name: Upload production-like dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-like-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload review reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-dry-run-review-reports
          path: |
            reports
            audit
          if-no-files-found: warn
          retention-days: 7
