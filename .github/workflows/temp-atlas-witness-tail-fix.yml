name: TEMP Atlas Witness Tail Fix

on:
  push:
    branches:
      - agent/atlas-neutral-group-20260810
    paths:
      - '.github/workflows/temp-atlas-witness-tail-fix.yml'

permissions:
  contents: write

concurrency:
  group: temp-atlas-witness-tail-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded witness cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/atlas-focus-state-browser-test.mjs')
          s = p.read_text()
          old = '''    await page.locator('[data-atlas-view="list"]').click();
    await page.waitForFunction(() => !document.getElementById('atlasListView')?.hidden);
    const listFocus = page.locator('[data-list-focus]:visible').first();
    await listFocus.focus();
    await listFocus.click();
    await page.waitForFunction(() => !document.getElementById('atlasGraphView')?.hidden);
    result.steps.listToGraph = await assertSafeFocus(page, `${browserName}/${width}/list-to-graph`, (state) => String(state.className).includes('atlas-node'));
'''
          new = '''    const listButton = page.locator('[data-atlas-view="list"]');
    if (compact) {
      assert.equal(await listButton.isVisible(), false, `${browserName}/${width}: drawer layout must hide desktop List switch`);
      const graphState = await page.evaluate(() => ({
        graphHidden: document.getElementById('atlasGraphView')?.hidden,
        listHidden: document.getElementById('atlasListView')?.hidden,
      }));
      assert.equal(graphState.graphHidden, false, `${browserName}/${width}: drawer layout must retain Graph view`);
      assert.equal(graphState.listHidden, true, `${browserName}/${width}: drawer layout must keep List view hidden`);
      result.steps.listAvailability = { visible: false, graphState };
    } else {
      await listButton.waitFor({ state: 'visible' });
      await listButton.click();
      await page.waitForFunction(() => !document.getElementById('atlasListView')?.hidden);
      const listFocus = page.locator('[data-list-focus]:visible').first();
      await listFocus.focus();
      await listFocus.click();
      await page.waitForFunction(() => !document.getElementById('atlasGraphView')?.hidden);
      result.steps.listToGraph = await assertSafeFocus(page, `${browserName}/${width}/list-to-graph`, (state) => String(state.className).includes('atlas-node'));
    }
'''
          if s.count(old) != 1:
              raise SystemExit(f'direct List block count={s.count(old)}; expected 1')
          s = s.replace(old, new)
          old_resize = '''      result.steps.resize = await assertSafeFocus(page, `${browserName}/${width}/resize`, (state) =>
        String(state.className).includes('atlas-node') || state.id === 'atlasFilterTrigger');
'''
          new_resize = '''      result.steps.resize = await assertSafeFocus(page, `${browserName}/${width}/resize`, (state) =>
        String(state.className).includes('atlas-node') || state.id === 'atlasFilterTrigger');
      result.steps.resizeSurfaces = await assertClosedSurfaceState(page, resizeTarget <= 980);
'''
          if s.count(old_resize) != 1:
              raise SystemExit(f'resize assertion count={s.count(old_resize)}; expected 1')
          s = s.replace(old_resize, new_resize)
          if s.count("page.locator('[data-atlas-view=\"list\"]')") != 1:
              raise SystemExit('unexpected remaining List locator ownership')
          p.write_text(s)
          PY
          git diff --check
          git diff -- scripts/atlas-focus-state-browser-test.mjs
      - name: Self-delete staging workflow and publish test-only delta
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-atlas-witness-tail-fix.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = 'scripts/atlas-focus-state-browser-test.mjs '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/atlas-focus-state-browser-test.mjs
          git commit -m 'test(atlas): respect drawer ownership in remaining paths'
          git fetch --no-tags origin '+refs/heads/agent/atlas-neutral-group-20260810:refs/remotes/origin/agent/atlas-neutral-group-20260810'
          test "$(git rev-parse refs/remotes/origin/agent/atlas-neutral-group-20260810)" = "$TRIGGER_SHA"
          git push --force-with-lease="refs/heads/agent/atlas-neutral-group-20260810:$TRIGGER_SHA" origin HEAD:refs/heads/agent/atlas-neutral-group-20260810