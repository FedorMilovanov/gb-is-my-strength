# one-shot trigger; self-deletes after successful repair
name: Search P3 deterministic Pagefind fixture repair once

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'scripts/search-p3-pagefind-fixture-once.mjs'
      - '.github/workflows/search-p3-pagefind-fixture-once.yml'

permissions:
  contents: write

concurrency:
  group: search-p3-pagefind-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-and-self-clean:
    if: github.event.pull_request.head.ref == 'fix/search-truthful-continuation-20260808-r1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Search P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/search-truthful-continuation-20260808-r1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate applicator syntax
        run: node --check scripts/search-p3-pagefind-fixture-once.mjs

      - name: Apply deterministic Pagefind fixture repair
        run: node scripts/search-p3-pagefind-fixture-once.mjs --write

      - name: Validate permanent Search modal contract
        run: |
          set -euo pipefail
          node --check scripts/search-modal-browser-contract.mjs
          node scripts/search-p3-pagefind-fixture-once.mjs
          git diff --check

      - name: Self-clean transport and commit permanent guard only
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/search-p3-pagefind-fixture-once.yml
          rm scripts/search-p3-pagefind-fixture-once.mjs
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(scripts/search-modal-browser-contract\.mjs|\.github/workflows/search-p3-pagefind-fixture-once\.yml|scripts/search-p3-pagefind-fixture-once\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Pagefind fixture repair paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(search): make Pagefind continuation fixture deterministic"
          git push origin "HEAD:${HEAD_REF}"
