name: Temporary TTS Mobile Notice Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - 'css/tts-download-notice.css'
      - 'js/vosk-tts-engine.js'
      - 'js/floating-cluster-controller.js'
      - 'scripts/cache-bust-assets.js'
      - 'scripts/tts-engine-status-contract-test.js'
      - 'scripts/tts-mobile-notice-geometry-browser-test.js'
      - 'scripts/_temp-materialize-tts-mobile-notice.mjs'
      - '.github/workflows/_temp-materialize-tts-mobile-notice.yml'

permissions:
  contents: write

concurrency:
  group: temp-tts-mobile-notice-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact product lane
        uses: actions/checkout@v4
        with:
          ref: fix/tts-mobile-notice-viewport-2026-07-25
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact mobile notice transaction
        run: node scripts/_temp-materialize-tts-mobile-notice.mjs

      - name: Validate source and workflow contracts
        run: |
          node scripts/tts-engine-status-contract-test.js
          node scripts/tts-download-consent-contract-test.js
          node scripts/run-actionlint.mjs -no-color .github/workflows/tts-download-consent.yml .github/workflows/_temp-materialize-tts-mobile-notice.yml
          node scripts/cache-bust.js

      - name: Build production-like routes
        run: npm run strangler:build:production-like

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run TTS lifecycle fixtures
        run: node scripts/tts-engine-lifecycle-browser-test.js

      - name: Run real-route status matrix
        run: node scripts/tts-status-route-browser-test.js

      - name: Run mobile notice viewport geometry
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/tts-mobile-notice-geometry-browser-test.js 2>&1 | tee reports/tts-mobile-notice-geometry.log

      - name: Publish product commit without workflow mutation
        run: |
          git checkout -- .github/workflows/tts-download-consent.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- . ':(exclude)scripts/_temp-*' ':(exclude).github/workflows/_temp-*'
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m "fix(tts): anchor mobile status notice to viewport insets"
          git push origin HEAD:fix/tts-mobile-notice-viewport-2026-07-25

      - name: Upload mobile geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-mobile-notice-geometry-${{ github.run_id }}
          path: |
            reports/tts-mobile-notice-geometry.log
            reports/tts-mobile-notice-geometry*.json
            reports/tts-mobile-notice-geometry*.png
          if-no-files-found: warn
          retention-days: 14
