name: TEMP reader platform inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'research/reader-platform-inventory-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build repository inventory
        run: python scripts/_temp_reader_platform_inventory.py

      - name: Upload inventory archive
        uses: actions/upload-artifact@v4
        with:
          name: reader-platform-inventory
          path: reader-platform-inventory.zip
          retention-days: 2

      - name: Upload compact reports
        uses: actions/upload-artifact@v4
        with:
          name: reader-platform-reports
          path: |
            reader-platform-inventory/tree.txt
            reader-platform-inventory/reader-patterns.txt
            reader-platform-inventory/git-history.txt
            reader-platform-inventory/candidate-surfaces.txt
            reader-platform-inventory/file-index.json
          retention-days: 2
