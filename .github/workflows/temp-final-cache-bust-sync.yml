name: TEMP Final Cache Bust Sync

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-final-cache-bust-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.number == 1567 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/reader-linear-text-pollution-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Regenerate only governed asset revisions and self-delete
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: agent/reader-linear-text-pollution-20260810
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node scripts/cache-bust.js --write
          rm .github/workflows/temp-final-cache-bust-sync.yml

          printf '%s\n' \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            > /tmp/allowed.txt
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          git diff --name-only | grep -v '^\.github/workflows/temp-final-cache-bust-sync\.yml$' | sort -u > /tmp/changed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          node scripts/cache-bust.js
          git diff --check
          node scripts/check-workflows.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(assets): synchronize final revision references'

          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$EXPECTED_SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin HEAD:"refs/heads/$BRANCH"
