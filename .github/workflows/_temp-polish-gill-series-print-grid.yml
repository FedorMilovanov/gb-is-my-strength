name: TEMP Polish Gill Series Print Grid

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: temp-polish-gill-series-print-grid
  cancel-in-progress: true

jobs:
  polish-and-prove:
    if: github.event.pull_request.number == 257
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gill-series-print-orphan-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Apply balanced print grid
        run: node scripts/_temp-polish-gill-series-print-grid.mjs
      - name: Verify asset revisions
        run: npm run cache-bust
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - name: Build production-like site
        run: npm run strangler:build:production-like
      - name: Generate canonical reader PDF
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/print-paper
        run: node scripts/engine-sweep.mjs
      - name: Audit page breaks and paper rendering
        run: python3 scripts/print-paper-pdf-audit.py reports/print-paper/reader-print-a4.pdf --out reports/print-paper
      - name: Remove one-shot infrastructure and commit product polish
        run: |
          rm scripts/_temp-polish-gill-series-print-grid.mjs
          rm .github/workflows/_temp-polish-gill-series-print-grid.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m "fix(print): balance Gill series overview grid"
          git push origin HEAD:fix/gill-series-print-orphan-2026-07-25
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gill-series-print-grid-proof-${{ github.sha }}
          path: reports/print-paper
          if-no-files-found: warn
          retention-days: 7
