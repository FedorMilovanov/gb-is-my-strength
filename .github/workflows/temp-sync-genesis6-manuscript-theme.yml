name: Temporary sync Genesis 6 manuscript theme

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.head_ref == 'lane/system-genesis6-manuscript-theme-2026-07-26'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize with exact main and create clean merge commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "cc2e829fe738d3d62322cf3c5c61dab895e3490e"
          test "$(git merge-base origin/main HEAD)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git rev-parse HEAD^)" = "40eb40e89d121bdeee7da96e86e9a8facd5b1766"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff origin/main
          rm -f .github/workflows/temp-sync-genesis6-manuscript-theme.yml
          git add -A
          git commit -m "system(genesis6): sync dormant manuscript theme with main [LANE lane/system-genesis6-manuscript-theme-2026-07-26]"
          expected=$'css/series-manuscript.css\nscripts/audit-pro.js\nscripts/cache-bust-assets.js\nscripts/check-engine-contracts.js\nsrc/lib/asset-version.js'
          test "$(git diff --name-only origin/main...HEAD)" = "${expected}"
          test ! -e .github/workflows/temp-sync-genesis6-manuscript-theme.yml
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/product-commit-sha.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/product-tree-sha.txt

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install exact dependencies
        run: npm ci

      - name: Read-only cache-bust parity
        run: npm run cache-bust

      - name: Shared-file guard
        run: npm run guard:shared-files

      - name: Engine contracts
        run: npm run engine:contracts

      - name: Workflow contracts
        run: npm run workflows:check

      - name: Control-plane audit
        run: npm run control-plane:audit

      - name: Workflow YAML lint
        run: npm run workflows:lint

      - name: Static publication acceptance
        run: npm run validate:static-publication

      - name: Verify clean permanent scope
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          expected=$'css/series-manuscript.css\nscripts/audit-pro.js\nscripts/cache-bust-assets.js\nscripts/check-engine-contracts.js\nsrc/lib/asset-version.js'
          test "$(git diff --name-only origin/main...HEAD)" = "${expected}"

      - name: Push clean synchronized head
        shell: bash
        run: git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis6-manuscript-theme-sync-${{ github.run_id }}
          path: |
            /tmp/product-commit-sha.txt
            /tmp/product-tree-sha.txt
            reports
          if-no-files-found: warn
          retention-days: 14
