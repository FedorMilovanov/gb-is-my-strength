name: Apply Atlas integrity fixes

on:
  push:
    branches:
      - feat/relationship-atlas-marathon-20260727
    paths:
      - .github/workflows/apply-atlas-integrity-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relationship-atlas-marathon-20260727
          fetch-depth: 0

      - name: Apply exact source patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          engine = Path('src/lib/relations/engine.mjs')
          replace_once(
              engine,
              "export const RELATION_ENGINE_VERSION = '1.1.0';",
              "export const RELATION_ENGINE_VERSION = '1.1.1';",
          )
          replace_once(
              engine,
              "        let id = `series-${slug(seriesId)}-${slug(partSlug)}`;\n        let suffix = 2;\n        while (byId.has(id)) id = `series-${slug(seriesId)}-${slug(partSlug)}-${suffix++}`;\n        node = {\n",
              "        const id = `series-${slug(seriesId)}-${slug(partSlug)}`;\n        if (byId.has(id)) {\n          errors.push(`synthetic series node id ${id} collides with an existing graph node`);\n          continue;\n        }\n        node = {\n",
          )

          relations_test = Path('scripts/check-relations.mjs')
          anchor = "rejects('catalog schema version is fail-closed', () => compileRelations({\n"
          insertion = """rejects('synthetic series ids are stable and collisions fail closed', () => compileRelations({
  graphData: {
    nodes: [{ id: 'series-series-a-part-one', title: 'Collision', url: '/collision/', group: 'standalone' }],
    edges: [],
  },
  seriesData: {
    'series-a': { title: 'A', baseUrl: '/articles/', parts: [{ slug: 'part-one', title: 'Part one', status: 'published' }] },
  },
  catalogData: { schemaVersion: 1, relations: [] },
  strict: true,
}), /synthetic series node id .* collides/);

"""
          replace_once(relations_test, anchor, insertion + anchor)

          runtime = Path('src/runtime/atlas-runtime.js')
          replace_once(
              runtime,
              "      var neighbors = relatedTo(id).filter(function (item) { return nodeById.has(item.id); }).slice(0, 7);\n",
              "      var allNeighbors = relatedTo(id).filter(function (item) { return nodeById.has(item.id); });\n      var neighbors = allNeighbors.slice(0, 7);\n",
          )
          replace_once(
              runtime,
              "      detailContent.replaceChildren();\n\n      detailContent.appendChild(createElement('span', 'atlas-detail__kind', group.label));\n",
              "      detailContent.replaceChildren();\n      detailContent.dataset.relationCount = String(allNeighbors.length);\n      detailContent.dataset.renderedRelationCount = String(neighbors.length);\n\n      detailContent.appendChild(createElement('span', 'atlas-detail__kind', group.label));\n",
          )
          replace_once(
              runtime,
              "      meta.appendChild(createElement('span', '', neighbors.length + ' ' + pluralRelations(neighbors.length)));\n",
              "      meta.appendChild(createElement('span', '', allNeighbors.length + ' ' + pluralRelations(allNeighbors.length)));\n",
          )

          browser = Path('scripts/atlas-browser-contract.mjs')
          helper_anchor = "async function desktopScene(browser, base, compiled) {\n"
          helper = """function highestDegreeNode(compiled) {
  const degree = new Map(compiled.nodes.map((node) => [node.id, 0]));
  for (const edge of compiled.edges) {
    degree.set(edge.source, (degree.get(edge.source) || 0) + 1);
    degree.set(edge.target, (degree.get(edge.target) || 0) + 1);
  }
  return compiled.nodes
    .map((node) => ({ id: node.id, degree: degree.get(node.id) || 0 }))
    .sort((a, b) => b.degree - a.degree || a.id.localeCompare(b.id))[0];
}

"""
          replace_once(browser, helper_anchor, helper + helper_anchor)
          replace_once(
              browser,
              "async function desktopScene(browser, base, compiled) {\n  const context = await browser.newContext({ viewport: { width: 1440, height: 950 } });\n  const page = await context.newPage();\n  const errors = [];\n  const dataRequests = observeDataRequests(page);\n",
              "async function desktopScene(browser, base, compiled) {\n  const context = await browser.newContext({ viewport: { width: 1440, height: 950 } });\n  const page = await context.newPage();\n  const errors = [];\n  const dataRequests = observeDataRequests(page);\n  const detailTarget = highestDegreeNode(compiled);\n",
          )
          replace_once(
              browser,
              "    await page.locator('.atlas-node:not(.is-filtered-out)').first().click();\n",
              "    await page.locator(`.atlas-node[data-node-id=\"${detailTarget.id}\"]`).click();\n",
          )
          replace_once(
              browser,
              "      const detail = document.getElementById('atlasDetail')?.getBoundingClientRect();\n      return {\n",
              "      const detail = document.getElementById('atlasDetail')?.getBoundingClientRect();\n      const detailContent = document.getElementById('atlasDetailContent');\n      const relationCopy = document.querySelector('.atlas-detail__meta span:last-child')?.textContent || '';\n      return {\n",
          )
          replace_once(
              browser,
              "        detail: detail ? { left: detail.left, right: detail.right, width: detail.width } : null,\n      };\n",
              "        detail: detail ? { left: detail.left, right: detail.right, width: detail.width } : null,\n        relationCount: Number(detailContent?.dataset.relationCount || 0),\n        renderedRelationCount: Number(detailContent?.dataset.renderedRelationCount || 0),\n        relationCopy,\n      };\n",
          )
          replace_once(
              browser,
              "      && focusedGeometry.main?.width < initialGeometry.main?.width - 250;\n",
              "      && focusedGeometry.main?.width < initialGeometry.main?.width - 250\n      && focusedGeometry.relationCount === detailTarget.degree\n      && focusedGeometry.renderedRelationCount === Math.min(7, detailTarget.degree)\n      && focusedGeometry.relationCopy.startsWith(String(detailTarget.degree));\n",
          )
          PY

      - name: Commit integrity fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/relations/engine.mjs scripts/check-relations.mjs src/runtime/atlas-runtime.js scripts/atlas-browser-contract.mjs
          git diff --cached --check
          git commit -m "fix(atlas): preserve stable ids and exact relation counts"
          git push origin HEAD:feat/relationship-atlas-marathon-20260727
