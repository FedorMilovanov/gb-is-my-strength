name: TEMP map initial-state refiner

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.head_ref == 'lane/system-map-initial-state-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply exact edge refinements
        run: python3 scripts/_temp_refine_map_initial_state.py

      - name: Verify runtime syntax
        run: node --check karty/_engine/map-engine.js

      - name: Commit engine refinement only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karty/_engine/map-engine.js
          git commit -m "[LANE lane/system-map-initial-state-2026-07-21] fix(karty): make URL source precedence atomic"
          git push origin HEAD:lane/system-map-initial-state-2026-07-21
