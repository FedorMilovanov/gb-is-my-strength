name: TEMP reader R1 browser proof

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# Exact scroll-lock-fix diagnostic. Remove after engine:sweep proof.
jobs:
  engine-sweep:
    if: github.head_ref == 'lane/system-reader-preferences-r1-final-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        shell: bash
        run: |
          npx playwright install chromium
          browser_path="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          test -x "$browser_path"
          sudo mkdir -p /opt/pw-browsers
          sudo ln -sfn "$browser_path" /opt/pw-browsers/chromium
          test -x /opt/pw-browsers/chromium
      - name: Build production-like target
        run: npm run strangler:build:production-like
      - name: Trace functional engine sweep
        shell: bash
        run: |
          set -u
          : > reader-engine-sweep.log
          setsid env DEBUG=pw:api npm run engine:sweep > reader-engine-sweep.log 2>&1 &
          engine_pid=$!

          cleanup() {
            if kill -0 "$engine_pid" 2>/dev/null; then
              kill -TERM -- "-$engine_pid" 2>/dev/null || true
              sleep 3
              kill -KILL -- "-$engine_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for attempt in $(seq 1 120); do
            if ! kill -0 "$engine_pid" 2>/dev/null; then
              set +e
              wait "$engine_pid"
              status=$?
              set -e
              cat reader-engine-sweep.log
              exit "$status"
            fi
            if (( attempt % 6 == 0 )); then
              echo "--- engine sweep trace after $((attempt * 5))s ---"
              tail -n 30 reader-engine-sweep.log || true
            fi
            sleep 5
          done

          echo 'engine:sweep exceeded 10 minutes; dumping process tree and trace'
          ps -ef --forest || true
          tail -n 500 reader-engine-sweep.log || true
          cleanup
          wait "$engine_pid" 2>/dev/null || true
          exit 124
      - name: Upload engine diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r1-engine-sweep-trace
          path: reader-engine-sweep.log
          if-no-files-found: warn
          retention-days: 1

  cross-engine-matrix:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Already proved green on permanent source before cleanup-only engine runner correction.'
