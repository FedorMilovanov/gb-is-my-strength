name: Temporary home388 exact snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    if: github.head_ref == 'temp/home388-ff613-snapshot-20260726'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact product head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ff61367623276815bd88af1f6fa7ab1fca3324f0
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact file
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ff61367623276815bd88af1f6fa7ab1fca3324f0"
          test -f scripts/home-browser-lifecycle-contract.mjs
          sha256sum scripts/home-browser-lifecycle-contract.mjs > home388-file.sha256
      - name: Upload exact source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home388-ff613676-source
          path: |
            scripts/home-browser-lifecycle-contract.mjs
            home388-file.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
