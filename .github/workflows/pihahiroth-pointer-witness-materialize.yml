name: Pihahiroth Pointer Witness Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/pihahiroth-pointer-witness-materialize.py'
      - '.github/workflows/pihahiroth-pointer-witness-materialize.yml'

concurrency:
  group: pihahiroth-pointer-witness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize exposed-point pointer witness
        run: python3 scripts/pihahiroth-pointer-witness-materialize.py

      - name: Validate bounded fail-closed witness scope
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/pihahiroth-uncertainty-browser-contract.mjs
          grep -Fq 'corridors:pointer-exposed-point' scripts/pihahiroth-uncertainty-browser-contract.mjs
          grep -Fq 'target corridor has no physically exposed pointer point' scripts/pihahiroth-uncertainty-browser-contract.mjs
          git diff --check
          expected=$'.github/workflows/pihahiroth-pointer-witness-materialize.yml\nscripts/pihahiroth-pointer-witness-materialize.py\nscripts/pihahiroth-uncertainty-browser-contract.mjs'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Commit permanent witness repair only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/pihahiroth-uncertainty-browser-contract.mjs
          git add -u scripts/pihahiroth-pointer-witness-materialize.py .github/workflows/pihahiroth-pointer-witness-materialize.yml
          git commit -m 'test(pihahiroth): click a physically exposed corridor point'
          git push origin "HEAD:${HEAD_REF}"
