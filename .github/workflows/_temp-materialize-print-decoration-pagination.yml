name: TEMP Materialize Print Decoration Pagination

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-print-decoration-pagination.yml'
      - 'scripts/_temp-materialize-print-decoration-pagination.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-print-decoration-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/print-decoration-pagination-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact product lane
        uses: actions/checkout@v4
        with:
          ref: fix/print-decoration-pagination-2026-07-25
          fetch-depth: 0

      - name: Setup Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct exact product transaction
        run: node scripts/_temp-materialize-print-decoration-pagination.mjs

      - name: Normalize generated EOF and raster geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path('css/site.css')
          site.write_text(site.read_text('utf-8').rstrip() + '\n', 'utf-8')

          raster = Path('scripts/print-pagination-raster-audit.py')
          source = raster.read_text('utf-8')
          pattern = re.compile(r'\ndef find_amber_header_bars\(image: Image\.Image\) -> list\[dict\]:[\s\S]*?\n\ndef audit_pdf\(pdf: Path, out: Path\) -> dict:')
          replacement = r'''
          def paper_ratio_around(image: Image.Image, bar: dict) -> float:
              """Return the neutral-paper ratio immediately above and below a candidate strip."""
              pixels = image.load()
              width, height = image.size
              pad_x = max(4, int(width * 0.006))
              pad_y = max(4, int(height * 0.004))
              x0 = max(0, bar["x"] - pad_x)
              x1 = min(width, bar["x"] + bar["width"] + pad_x)
              rows = list(range(max(0, bar["y"] - pad_y), bar["y"]))
              rows += list(range(bar["y"] + bar["height"], min(height, bar["y"] + bar["height"] + pad_y)))
              neutral = 0
              total = 0
              for y in rows:
                  for x in range(x0, x1):
                      r, g, b = pixels[x, y]
                      total += 1
                      if min(r, g, b) >= 232 and max(r, g, b) - min(r, g, b) <= 20:
                          neutral += 1
              return neutral / total if total else 0.0


          def find_amber_header_bars(image: Image.Image) -> list[dict]:
              """Find the obsolete broad gold progress strip on neutral paper."""
              width, height = image.size
              limit_y = max(1, int(height * 0.16))
              qualifying_rows: list[tuple[int, int, int]] = []
              pixels = image.load()
              min_run = max(48, int(width * 0.28))
              for y in range(limit_y):
                  longest = 0
                  run_length = 0
                  run_start = 0
                  longest_start = 0
                  for x in range(width):
                      r, g, b = pixels[x, y]
                      warm_gold = r >= 165 and g >= 105 and b <= 170 and r >= g + 18 and g >= b + 12
                      if warm_gold:
                          if run_length == 0:
                              run_start = x
                          run_length += 1
                          if run_length > longest:
                              longest = run_length
                              longest_start = run_start
                      else:
                          run_length = 0
                  if longest >= min_run:
                      qualifying_rows.append((y, longest_start, longest))

              bars: list[dict] = []
              group: list[tuple[int, int, int]] = []
              for row in qualifying_rows:
                  if group and row[0] > group[-1][0] + 1:
                      if len(group) >= 2:
                          bars.append({
                              "y": group[0][0],
                              "height": group[-1][0] - group[0][0] + 1,
                              "x": min(item[1] for item in group),
                              "width": max(item[2] for item in group),
                          })
                      group = []
                  group.append(row)
              if len(group) >= 2:
                  bars.append({
                      "y": group[0][0],
                      "height": group[-1][0] - group[0][0] + 1,
                      "x": min(item[1] for item in group),
                      "width": max(item[2] for item in group),
                  })

              confirmed: list[dict] = []
              for bar in bars:
                  geometry_matches = (
                      2 <= bar["height"] <= max(20, int(height * 0.018))
                      and bar["x"] <= int(width * 0.28)
                      and int(width * 0.28) <= bar["width"] <= int(width * 0.78)
                  )
                  if not geometry_matches:
                      continue
                  paper_ratio = paper_ratio_around(image, bar)
                  if paper_ratio >= 0.82:
                      confirmed.append({**bar, "paperRatio": round(paper_ratio, 4)})
              return confirmed


          def audit_pdf(pdf: Path, out: Path) -> dict:'''
          updated, count = pattern.subn('\n' + replacement.strip('\n'), source, count=1)
          if count != 1:
              raise SystemExit(f'paper-header detector block: expected 1 match, found {count}')
          raster.write_text(updated, 'utf-8')
          PY
          node scripts/cache-bust.js --write

      - name: Validate source, scope and revision contracts
        run: |
          mkdir -p reports
          set +e
          set -o pipefail
          (
            set -euo pipefail
            node --check js/reader-preferences-head.js
            node --check scripts/print-pagination-contract.mjs
            python3 -m py_compile scripts/print-pagination-raster-audit.py
            node scripts/cache-bust.js
            git diff --check
            grep -Fq 'GB_PRINT_REVERSIBLE_CARD_ROOTS_V1' js/reader-preferences-head.js
            grep -Fq 'GB PRINT CONTRACT v2.9' css/site.css
            grep -Fq 'ГОСПОДЬ БОГ — СИЛА МОЯ' css/site.css
            grep -Fq '#reading-progress, .h-reading-progress' css/site.css
            grep -Fq 'paper_ratio_around' scripts/print-pagination-raster-audit.py
            if grep -Fq 'GB PRINT CONTRACT v2.8' css/site.css; then
              echo 'obsolete v2.8 print contract remains' >&2
              exit 1
            fi
            if grep -Fq 'transform: scaleX(var(--gb-read-pct, 0))' css/floating-cluster.css; then
              echo 'duplicate global progress pseudo-element remains' >&2
              exit 1
            fi
            node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-print-decoration-pagination.yml
          ) 2>&1 | tee reports/print-decoration-validation.log
          code=${PIPESTATUS[0]}
          exit "${code}"

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install browser and PDF audit dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Run multi-route pagination proof
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/print-decoration-pagination
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/print-pagination-contract.mjs 2>&1 | tee reports/print-decoration-pagination.log

      - name: Raster-audit every generated PDF
        run: |
          python3 scripts/print-pagination-raster-audit.py \
            reports/print-decoration-pagination \
            --out reports/print-decoration-pagination-raster

      - name: Publish tested product commit only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            css/floating-cluster.css \
            css/site.css \
            js/reader-preferences-head.js \
            scripts/print-pagination-contract.mjs \
            scripts/print-pagination-raster-audit.py \
            src/lib/asset-version.js
          git add -u -- '*.html' '*.astro'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No tested product changes staged' >&2
            exit 1
          fi
          git commit -m 'fix(print): isolate progress chrome and keep active card face atomic'
          git push origin HEAD:fix/print-decoration-pagination-2026-07-25

      - name: Upload print evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-decoration-pagination-${{ github.run_id }}
          path: |
            reports/print-decoration-validation.log
            reports/print-decoration-pagination.log
            reports/print-decoration-pagination/
            reports/print-decoration-pagination-raster/
          if-no-files-found: warn
          retention-days: 14
