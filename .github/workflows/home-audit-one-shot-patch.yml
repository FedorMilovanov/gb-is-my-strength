name: Home Audit One-shot Patch

on:
  pull_request:
    paths:
      - '.github/workflows/home-audit-one-shot-patch.yml'
      - 'scripts/home-audit-one-shot-patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: lane/home-search-audit-pro-2026-08-03
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact verified replacements
        run: python3 scripts/home-audit-one-shot-patch.py

      - name: Verify edits before commit
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R 'http-equiv="X-Content-Type-Options"' src/components/home/HomePageHead.astro
          ! grep -F 'h-hero-brand" aria-label=' src/components/home/HomeHero.astro
          node --check scripts/home-design-audit-pro.mjs
          git diff --check
          git diff --name-only

      - name: Commit verified corrections to lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(home): close validated semantic audit findings'
          git push origin HEAD:lane/home-search-audit-pro-2026-08-03
