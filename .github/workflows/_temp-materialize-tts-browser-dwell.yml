name: Temporary TTS Browser Status Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-tts-browser-dwell.yml'
      - 'scripts/_temp-materialize-tts-browser-dwell.mjs'
      - 'js/floating-cluster-controller.js'
      - 'scripts/tts-engine-status-contract-test.js'
      - 'scripts/tts-status-route-browser-test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-tts-browser-dwell-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/tts-system-voice-visible-status-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Detect completed transaction
        id: transaction
        run: |
          if grep -Fq 'VOSK_BROWSER_STATUS_DWELL_MS = 900' js/floating-cluster-controller.js; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node 22.12
        if: steps.transaction.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        if: steps.transaction.outputs.skip != 'true'
        run: npm ci
      - name: Apply exact-match product transaction
        if: steps.transaction.outputs.skip != 'true'
        run: node scripts/_temp-materialize-tts-browser-dwell.mjs
      - name: Build production-like dist
        if: steps.transaction.outputs.skip != 'true'
        run: npm run strangler:build:production-like
      - name: Install Chromium and WebKit
        if: steps.transaction.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Run TTS source and browser contracts
        if: steps.transaction.outputs.skip != 'true'
        run: |
          node scripts/tts-engine-status-contract-test.js
          node scripts/tts-download-consent-contract-test.js
          node scripts/tts-download-notice-browser-test.js
          node scripts/tts-engine-lifecycle-browser-test.js
          node scripts/tts-status-route-browser-test.js
      - name: Re-run Gill controller traversal
        if: steps.transaction.outputs.skip != 'true'
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: npm run gill:pre-v16-submenu:audit
      - name: Verify revisions and diff
        if: steps.transaction.outputs.skip != 'true'
        run: |
          node scripts/cache-bust.js
          git diff --check
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-tts-browser-dwell.yml
      - name: Publish tested product commit
        if: steps.transaction.outputs.skip != 'true'
        env:
          TARGET_BRANCH: fix/tts-system-voice-visible-status-2026-07-25
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(tts): keep system voice status visible before warm-up'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Upload browser evidence
        if: always() && steps.transaction.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-browser-dwell-${{ github.run_id }}
          path: |
            reports/tts-route-*.png
            reports/tts-lifecycle-*.png
            reports/gill-pre-v16-submenu-audit/
          if-no-files-found: warn
          retention-days: 14
