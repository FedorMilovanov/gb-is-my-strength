name: TEMP map layers theme full gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  full-gate:
    if: github.head_ref == 'lane/system-map-layers-theme-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static publication barrier
        shell: bash
        run: |
          set +e
          npm run validate:static-publication > static-publication.log 2>&1
          status=$?
          tail -n 80 static-publication.log
          exit "$status"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-layers-theme-static-publication-log
          path: static-publication.log
          retention-days: 1

      - name: Shared files barrier
        run: npm run guard:shared-files

      - name: Build production-like browser target
        run: npm run strangler:build:production-like

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Browser layers and palette witnesses
        shell: bash
        run: |
          python3 -m http.server 8090 --directory dist >/tmp/map-layers-theme-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8090/karty/ishod/ >/dev/null; then break; fi
            sleep 1
          done
          AUDIT_BASE=http://127.0.0.1:8090 node scripts/map-layers-theme-browser-smoke.js
