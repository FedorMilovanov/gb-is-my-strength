name: TEMP Extract E4CF Pages Witness

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-extract-e4cf-pages-witness
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[e4cf-witness]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: e4cf04ab63966e9002e3403eff64fffda8d8d757
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0
      - name: Capture exact-head observer comments
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" --slurp \
            | jq --arg sha "$EXPECTED_SHA" 'add | map(select(.body | contains($sha))) | map({id,created_at,updated_at,body,html_url,user:.user.login})' \
            > .github/_temp-e4cf-pages-witness.json
      - name: Remove extractor and publish evidence
        shell: bash
        run: |
          rm -f .github/workflows/_temp-extract-e4cf-pages-witness.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[e4cf-witness] capture exact observer comments'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
