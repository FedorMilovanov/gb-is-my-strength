name: Article Capability Completeness

on:
  pull_request:
    paths:
      - '.github/workflows/article-capability-contract.yml'
      - 'scripts/article-capability-owner-contract.mjs'
      - 'scripts/article-capability-browser-contract.mjs'
      - 'src/runtime/article-*.js'
      - 'src/runtime/article-capabilities.css'
      - 'src/components/reader-platform/ReaderActionsRuntime.astro'
      - 'src/components/article-pilots/**'
      - 'src/pages/articles/**'
      - 'js/enhancements.js'
      - 'js/site.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/article-capability-contract.yml'
      - 'scripts/article-capability-owner-contract.mjs'
      - 'scripts/article-capability-browser-contract.mjs'
      - 'src/runtime/article-*.js'
      - 'src/runtime/article-capabilities.css'
      - 'src/components/reader-platform/ReaderActionsRuntime.astro'
      - 'src/components/article-pilots/**'
      - 'src/pages/articles/**'
      - 'js/enhancements.js'
      - 'js/site.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: article-capability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capability-contract:
    name: Native owners + Chromium WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Prove capability ownership cardinality
        run: node scripts/article-capability-owner-contract.mjs
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Run retained-capability browser contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/article-capability-browser-contract.mjs
      - name: Upload Article capability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: article-capability-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/article-capability
          if-no-files-found: warn
          retention-days: 14
