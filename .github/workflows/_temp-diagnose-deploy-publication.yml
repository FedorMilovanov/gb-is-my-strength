name: TEMP Diagnose Deploy Publication Audit

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-diagnose-deploy-publication.yml'
      - 'scripts/_temp-materialize-deploy-lazy-policy.mjs'
      - 'scripts/dist-publication-audit.js'
      - 'scripts/tts-engine-status-contract-test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-diagnose-deploy-publication-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: fix/deploy-publication-audit-2026-07-25
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize canonical deploy lazy policy
        run: |
          mkdir -p reports/deploy-publication-diagnostic
          set -o pipefail
          node scripts/_temp-materialize-deploy-lazy-policy.mjs 2>&1 | tee reports/deploy-publication-diagnostic/materializer.log

      - name: Reproduce deploy dist through failed gate
        run: |
          mkdir -p reports/deploy-publication-diagnostic
          set +e
          set -o pipefail
          {
            node scripts/tts-engine-status-contract-test.js
            node scripts/cache-bust.js
            npm run validate:static-publication
            npm run strangler:build:production-like
            npm run page-ownership:dist:production-like
            npm run pagefind:build:dist
            touch dist/.nojekyll
            npm run visual:parity:production
            node scripts/dist-publication-audit.js --require-pagefind --forbid-dev
          } 2>&1 | tee reports/deploy-publication-diagnostic/full.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/deploy-publication-diagnostic/exit-code.txt
          find dist -maxdepth 4 -type f | sort > reports/deploy-publication-diagnostic/dist-files.txt || true
          exit "$code"

      - name: Publish permanent deploy audit fix only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/dist-publication-audit.js scripts/tts-engine-status-contract-test.js
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m "fix(deploy): honor canonical lazy precache policy"
          git push origin HEAD:fix/deploy-publication-audit-2026-07-25

      - name: Upload exact deploy diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-publication-diagnostic-${{ github.run_id }}
          path: reports/deploy-publication-diagnostic
          if-no-files-found: warn
          retention-days: 7
