name: Overlay Runtime Browser

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "js/site-utils.js"
      - "js/site.js"
      - "js/floating-cluster-controller.js"
      - "karty/_engine/map-engine.js"
      - "_build-tools/konfessii-baptizm/MindMap3D.tsx"
      - "konfessii/russkij-baptizm/_app/index.html"
      - "src/components/article-pilots/**"
      - "scripts/overlay-runtime-*.js"
      - "scripts/map-overlay-runtime-browser-test.js"
      - "scripts/special-overlay-*.js"
      - "scripts/runtime-integrity-test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/overlay-runtime-browser.yml"

concurrency:
  group: overlay-runtime-browser-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: "npm"
      - run: npm ci
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Full overlay browser matrix
        env:
          PW_BROWSER: ${{ matrix.browser }}
        run: npm run overlay:browser:all
