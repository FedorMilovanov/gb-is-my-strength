name: Reconcile QUAL-P1-02 MapEngine version

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/system-karty-hebrew-semantics-20260804'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@v4
        with:
          ref: agent/system-karty-hebrew-semantics-20260804
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Preserve the canonical MapEngine version contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('karty/_engine/map-engine.js')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('map-engine.js v0.58 — reusable biblical map rendering engine.',
               'map-engine.js v0.57 — reusable biblical map rendering engine.'),
              ("version:'0.58.0',buildDate:'2026-08-04'",
               "version:'0.57.0',buildDate:'2026-08-01'"),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one marker, found {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          node --check karty/_engine/map-engine.js
          node scripts/map-layers-theme-regression-test.js
          npm run avraam:audit

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Re-run Hebrew browser witness
        shell: bash
        run: |
          python3 -m http.server 8090 > /tmp/qual-p1-02-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null
          AUDIT_BASE=http://127.0.0.1:8090 MAP_SMOKE_ROUTES=ishod node scripts/map-browser-smoke.js

      - name: Commit reconciliation and remove executor
        shell: bash
        run: |
          rm .github/workflows/qual-p1-02-version-reconcile.yml
          git diff --check
          git add karty/_engine/map-engine.js .github/workflows/qual-p1-02-version-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(karty): preserve MapEngine version contract"
          git push origin HEAD:agent/system-karty-hebrew-semantics-20260804
