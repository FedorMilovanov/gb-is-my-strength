name: Editorial freeze diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/editorial-freeze-diagnostic.yml'
      - 'scripts/editorial-metadata-freeze-audit.js'
      - 'scripts/editorial-metadata-registry.js'
      - 'scripts/lib/editorial-metadata.js'
      - 'scripts/lib/editorial-metadata-v3.js'
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Assert pinned npm toolchain
        run: test "$(npm --version)" = '10.9.8'

      - name: Install dependencies
        run: npm ci

      - name: Validate editorial registry
        run: node scripts/editorial-metadata-registry.js --check

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Capture failing frozen projection audit
        id: before
        shell: bash
        run: |
          mkdir -p reports
          set +e
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.before.log
          status=${PIPESTATUS[0]}
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate registry observation repair
        shell: bash
        run: |
          cp data/editorial-metadata.json reports/editorial-metadata.before.json
          node scripts/editorial-metadata-registry.js --write
          cp data/editorial-metadata.json reports/editorial-metadata.generated.json
          git diff -- data/editorial-metadata.json > reports/editorial-metadata.generated.diff
          test -s reports/editorial-metadata.generated.diff

      - name: Verify generated registry repair
        id: after
        shell: bash
        run: |
          set +e
          set -o pipefail
          node scripts/editorial-metadata-registry.js --check 2>&1 \
            | tee reports/editorial-metadata-registry.after.log
          registry_status=${PIPESTATUS[0]}
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.after.log
          audit_status=${PIPESTATUS[0]}
          if [ "$registry_status" -ne 0 ] || [ "$audit_status" -ne 0 ]; then
            status=1
          else
            status=0
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact diagnostic and generated repair
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-freeze-repair-${{ github.run_id }}
          path: |
            reports/editorial-metadata-freeze.before.log
            reports/editorial-metadata.before.json
            reports/editorial-metadata.generated.json
            reports/editorial-metadata.generated.diff
            reports/editorial-metadata-registry.after.log
            reports/editorial-metadata-freeze.after.log
          if-no-files-found: error
          retention-days: 7

      - name: Prove expected failure became a passing repair
        if: always()
        shell: bash
        run: |
          test '${{ steps.before.outputs.status }}' -ne 0
          test '${{ steps.after.outputs.status }}' -eq 0
