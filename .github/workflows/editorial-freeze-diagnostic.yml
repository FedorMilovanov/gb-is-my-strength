name: Editorial freeze diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/editorial-freeze-diagnostic.yml'
      - 'scripts/editorial-metadata-freeze-audit.js'
      - 'scripts/lib/editorial-metadata.js'
      - 'scripts/lib/editorial-metadata-v3.js'
      - 'data/**'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Assert pinned npm toolchain
        run: test "$(npm --version)" = '10.9.8'

      - name: Install dependencies
        run: npm ci

      - name: Validate editorial registry
        run: node scripts/editorial-metadata-registry.js --check

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Capture exact Diotrophes editorial state
        shell: bash
        run: |
          mkdir -p reports
          node <<'NODE' > reports/diotrophes-editorial-state.json
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            ROOT,
            eligibleRecords,
            observeRoute,
            readRegistry,
          } = require('./scripts/lib/editorial-metadata');
          const route = '/articles/diotrefy-nashego-vremeni/';
          const dist = path.join(ROOT, 'dist');
          const sitemapFiles = fs.readdirSync(dist)
            .filter((name) => /^sitemap(?:-\d+)?\.xml$/i.test(name))
            .sort();
          const shared = {
            searchItems: JSON.parse(fs.readFileSync(path.join(dist, 'data', 'search-manifest.json'), 'utf8')).items || [],
            sitemapXml: sitemapFiles.map((name) => fs.readFileSync(path.join(dist, name), 'utf8')).join('\n'),
            feedXml: fs.readFileSync(path.join(dist, 'feed.xml'), 'utf8'),
          };
          const routeRecord = eligibleRecords().find((item) => item.route === route);
          if (!routeRecord) throw new Error(`eligible route missing: ${route}`);
          const registryRecord = readRegistry().records[route];
          if (!registryRecord) throw new Error(`registry route missing: ${route}`);
          const current = observeRoute(routeRecord, dist, shared);
          process.stdout.write(JSON.stringify({ route, registryRecord, current }, null, 2));
          NODE

      - name: Capture frozen editorial projection audit
        id: audit
        shell: bash
        run: |
          mkdir -p reports
          set +e
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.log
          status=${PIPESTATUS[0]}
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-freeze-diagnostic-${{ github.run_id }}
          path: |
            reports/editorial-metadata-freeze.log
            reports/diotrophes-editorial-state.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve audit conclusion
        if: always()
        shell: bash
        run: exit '${{ steps.audit.outputs.status }}'
