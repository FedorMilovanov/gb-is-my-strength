name: Reader Linear Text Projection Contract

on:
  pull_request:
    paths:
      - 'scripts/astro-cache-bust-postbuild.js'
      - 'scripts/project-reader-linear-text-to-dist.mjs'
      - 'scripts/reader-linear-text-projection-browser-test.mjs'
      - 'js/glossary.js'
      - '.github/workflows/reader-linear-text-projection.yml'
      - 'src/components/article-pilots/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'scripts/astro-cache-bust-postbuild.js'
      - 'scripts/project-reader-linear-text-to-dist.mjs'
      - 'scripts/reader-linear-text-projection-browser-test.mjs'
      - 'js/glossary.js'
      - '.github/workflows/reader-linear-text-projection.yml'
      - 'src/components/article-pilots/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-linear-text-projection-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium WebKit reader semantic projection
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install exact dependencies and browsers
        run: |
          npm ci
          timeout 12m npx playwright install --with-deps chromium webkit
      - name: Syntax check semantic projection guards
        run: |
          node --check scripts/astro-cache-bust-postbuild.js
          node --check scripts/project-reader-linear-text-to-dist.mjs
          node --check scripts/reader-linear-text-projection-browser-test.mjs
          node --check js/glossary.js
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Prove semantic projector is idempotent
        run: node scripts/project-reader-linear-text-to-dist.mjs --root dist --dry-run
      - name: Build Pagefind index
        run: npm run pagefind:build:dist
      - name: Run reader semantic projection contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/reader-linear-text-projection-browser-test.mjs
      - name: Upload semantic projection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-linear-text-projection-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/reader-linear-text-projection
          if-no-files-found: error
          retention-days: 14
