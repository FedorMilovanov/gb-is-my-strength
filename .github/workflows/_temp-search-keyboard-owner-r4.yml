name: Temporary Search Keyboard Owner R4

on:
  pull_request:
    types: [labeled]
    branches: [main]

concurrency:
  group: temp-search-keyboard-owner-r4-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/system-search-keyboard-owner-r4'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout exact pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Detect transaction phase
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "function isCanonicalSearchShortcut(event)" js/site-utils.js; then
            node scripts/cache-bust.js
            echo "TXN_PHASE=reconcile" >> "$GITHUB_ENV"
            echo "Search source is already migrated and asset revisions are synchronized."
          else
            echo "TXN_PHASE=source" >> "$GITHUB_ENV"
            echo "Search source migration is pending."
          fi

      - name: Write Search owner source
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/_temp-search-keyboard-owner-r4.mjs
          if [ "$TXN_PHASE" = "source" ]; then
            # --write is the explicit capability marker required by Workflow Policy v2.
            # The temporary writer performs only bounded source migration.
            # Canonical asset revisions remain owned by glossary-contract.yml,
            # and permanent workflow mutation remains outside this Actions token boundary.
            node scripts/_temp-search-keyboard-owner-r4.mjs --apply --write
            node - <<'NODE'
          const fs = require('fs');
          const file = 'src/components/search/AppSearchSurface.astro';
          const source = fs.readFileSync(file, 'utf8').replace(/\n+$/, '\n');
          fs.writeFileSync(file, source, 'utf8');
          NODE
            git restore --source=HEAD -- .github/workflows/search-modal-contract.yml
          else
            echo "Source already migrated; this invocation is ledger/self-clean reconciliation only."
          fi

      - name: Validate transaction state
        shell: bash
        run: |
          set -euo pipefail
          node --check js/site-utils.js
          node --check js/search.js
          node --check scripts/audit-pro.js
          node --check scripts/app-search-surface-source-contract.mjs
          node --check scripts/app-search-surface-browser-contract.mjs
          node --check scripts/home-browser-contract.mjs
          npm run workflows:check
          npm run astro:check
          git diff --check
          if [ "$TXN_PHASE" = "reconcile" ]; then
            node scripts/cache-bust.js
            node scripts/audit-pro.js
            node scripts/legacy-reference-inventory-audit.mjs
            node scripts/legacy-reference-path-contract-test.js
            node scripts/strangler-duplicate-inventory.mjs --self-test
          fi

      - name: Verify bounded source paths
        if: env.TXN_PHASE == 'source'
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/search-keyboard-owner-paths
          while IFS= read -r file; do
            case "$file" in
              js/search.js|js/site-utils.js|404.html|scripts/audit-pro.js|scripts/app-search-surface-source-contract.mjs|scripts/app-search-surface-browser-contract.mjs|scripts/home-browser-contract.mjs|src/layouts/BaseLayout.astro) ;;
              *.html) ;;
              src/*.astro|src/*/*.astro|src/*/*/*.astro|src/*/*/*/*.astro|src/*/*/*/*/*.astro|src/*/*/*/*/*/*.astro) ;;
              *) echo "Unexpected Search keyboard owner source path: $file" >&2; exit 1 ;;
            esac
          done < /tmp/search-keyboard-owner-paths

      - name: Commit source migration
        if: env.TXN_PHASE == 'source'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          START_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$START_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(search): centralize global keyboard ownership"
          git push origin "HEAD:${HEAD_REF}"
          echo "Source migration published. Glossary Contract owns canonical cache-bust regeneration."

      - name: Commit clean transaction boundary
        if: env.TXN_PHASE == 'reconcile'
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/_temp-search-keyboard-owner-r4.mjs /tmp/search-keyboard-owner-r4.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp-search-keyboard-owner-r4.yml scripts/_temp-search-keyboard-owner-r4.mjs
          npm run workflows:check
          git diff --check
          git commit -m "chore(search): remove temporary owner transaction"
          echo "CLEAN_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh immutable legacy-reference ledger
        if: env.TXN_PHASE == 'reconcile'
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/search-keyboard-owner-r4.mjs --refresh-ledger "$CLEAN_SOURCE_SHA"
          node scripts/cache-bust.js
          node scripts/audit-pro.js
          node scripts/legacy-reference-inventory-audit.mjs
          node scripts/legacy-reference-path-contract-test.js
          node scripts/strangler-duplicate-inventory.mjs --self-test
          npm run workflows:check
          npm run astro:check
          git diff --check
          git add data/legacy-reference-ledger/manifest.json \
                  data/legacy-reference-ledger/references-1.json \
                  data/legacy-reference-ledger/references-2.json \
                  data/legacy-reference-ledger/references-3.json \
                  data/legacy-reference-ledger/references-4.json
          git commit -m "chore(search): reconcile immutable reference bytes"

      - name: Final self-clean race guard and push
        if: env.TXN_PHASE == 'reconcile'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          START_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test ! -e .github/workflows/_temp-search-keyboard-owner-r4.yml
          test ! -e scripts/_temp-search-keyboard-owner-r4.mjs
          node scripts/cache-bust.js
          node scripts/audit-pro.js
          node scripts/legacy-reference-inventory-audit.mjs
          node scripts/legacy-reference-path-contract-test.js
          node scripts/strangler-duplicate-inventory.mjs --self-test
          npm run workflows:check
          git diff --check
          test -z "$(git status --porcelain)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$START_SHA"
          git push origin "HEAD:${HEAD_REF}"
