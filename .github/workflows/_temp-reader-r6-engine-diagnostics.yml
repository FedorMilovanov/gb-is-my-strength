name: Temporary Reader R6 Engine Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-engine-diagnostics.yml"

permissions:
  contents: read

jobs:
  engine-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ReaderState engine sweep with retained log
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run engine:sweep 2>&1 | tee reports/engine-sweep.log

      - name: Upload ReaderState diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r6-engine-diagnostics-${{ github.run_id }}
          path: reports/engine-sweep.log
          if-no-files-found: error
          retention-days: 7
