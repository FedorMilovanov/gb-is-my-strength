name: Dependency Security

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/npm-security-contract.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-security.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/npm-security-contract.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Capture exact npm advisory report
        id: audit
        shell: bash
        run: |
          mkdir -p reports/npm-security
          set +e
          npm audit --json > reports/npm-security/npm-audit.json
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          test -s reports/npm-security/npm-audit.json

      - name: Enforce dependency security contract
        run: node scripts/npm-security-contract.mjs reports/npm-security/npm-audit.json

      - name: Upload npm security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-security-${{ github.run_id }}
          path: reports/npm-security/npm-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Lint dependency security workflow
        if: always()
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/dependency-security.yml

      - name: Ensure validation is read-only
        if: always()
        run: git diff --exit-code
