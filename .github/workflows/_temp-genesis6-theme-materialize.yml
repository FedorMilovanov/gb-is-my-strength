name: Temporary Genesis 6 manuscript theme materializer

on:
  pull_request:
    paths:
      - '.github/workflows/_temp-genesis6-theme-materialize.yml'
      - '.genesis6-transfer/theme-system.patch.gz.b64'
      - '.genesis6-transfer/theme-trigger.txt'

permissions:
  contents: write

concurrency:
  group: genesis6-theme-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "38d6e82da2323568008dc1ed70093fc660499475"
          echo "cb423c2ac52f93fe9448b7816b290855086e3d70e8f80e99302f10afaa84d385  .genesis6-transfer/theme-system.patch.gz.b64" | sha256sum -c -
          git diff --name-only origin/main...HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.genesis6-transfer/theme-system.patch.gz.b64' \
            '.genesis6-transfer/theme-trigger.txt' \
            '.github/workflows/_temp-genesis6-theme-materialize.yml' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Apply reviewed patch and remove transport
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .genesis6-transfer/theme-system.patch.gz.b64 > /tmp/theme-system.patch.gz
          echo "3c2a043ff57f1366d3e68187d9d373e6162c17583f0030ae3c316092d6565631  /tmp/theme-system.patch.gz" | sha256sum -c -
          gzip -dc /tmp/theme-system.patch.gz > /tmp/theme-system.patch
          echo "219a606f665c0e5c3140f508b761ace2885bde89e30da0baebe7646d0f5a8c07  /tmp/theme-system.patch" | sha256sum -c -
          git apply --check /tmp/theme-system.patch
          git apply /tmp/theme-system.patch
          rm -rf .genesis6-transfer
          rm -f .github/workflows/_temp-genesis6-theme-materialize.yml
          git add -A
          git diff --cached --check

      - name: Create and verify clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'genesis6-system-materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'system(genesis6): register dormant manuscript theme [LANE lane/system-genesis6-manuscript-theme-2026-07-26]'
          git diff --name-only origin/main...HEAD | sort > /tmp/final-files.txt
          printf '%s\n' \
            'css/series-manuscript.css' \
            'scripts/audit-pro.js' \
            'scripts/cache-bust-assets.js' \
            'scripts/check-engine-contracts.js' \
            'src/lib/asset-version.js' | sort > /tmp/final-expected.txt
          diff -u /tmp/final-expected.txt /tmp/final-files.txt
          test -z "$(git status --porcelain)"

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run SYSTEM acceptance
        shell: bash
        run: |
          set -euo pipefail
          npm run guard:shared-files
          npm run engine:contracts
          npm run workflows:check
          npm run control-plane:audit
          npm run workflows:lint
          npm run validate:static-publication
          node scripts/cache-bust.js
          git diff --exit-code

      - name: Push clean product head
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/${HEAD_BRANCH}"
