name: Complete cascade-safe Nagornaya dark-theme repair

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: nagornaya-dark-cascade-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/nagornaya-dark-cascade-repair-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact successor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Guard exact base and owner blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "66206333467cf65e761f827074136c625d886f38"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse HEAD:css/nagornaya-mobile-toc.css)" = "205b12a814c9fe47ce605766c673c3f1c8104303"
          test "$(git rev-parse HEAD:scripts/nagornaya-epistemic-ui-browser-test.mjs)" = "9832d8dd3a95be033110cb56107e61e4d5c4514a"
          test "$(git rev-parse HEAD:sw.js)" = "f9dada3c79dee430d8513cbd5b274eb8b5def9aa"
          test "$(git rev-parse HEAD:migration/sw-cache-version-baseline.json)" = "d633805fc48bff876fda6349bf894e2ece4e4615"
          test "$(git rev-parse HEAD:data/offline-route-matrix.json)" = "f80d32f03f79f3a36c6d1e7c4d89119edd322a35"
          test "$(git rev-parse HEAD:src/lib/asset-version.js)" = "d6987463b9d699377a201888fc3e28799408dcac"
          test -f .github/tmp/nagornaya_dark_cascade_repair.py
          test "$(grep -o '!important' css/nagornaya-mobile-toc.css | wc -l)" = 134

      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Write bounded cascade repair and cache revisions
        shell: bash
        run: |
          set -euo pipefail
          git grep -l 'nagornaya-mobile-toc.css?v=' -- '*.html' '*.astro' | sort > "${RUNNER_TEMP}/nagornaya-css-references.before"
          test -s "${RUNNER_TEMP}/nagornaya-css-references.before"
          python3 .github/tmp/nagornaya_dark_cascade_repair.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/nagornaya-epistemic-ui-browser-test.mjs')
          source = path.read_text(encoding='utf-8')
          anchor = "  'https://gospod-bog.ru/icons/icon-192.png',\n]);"
          replacement = "  'https://gospod-bog.ru/icons/icon-192.png',\n  'https://gospod-bog.ru/images/og-nagornaya-propoved.webp',\n]);"
          if source.count(anchor) != 1:
              raise SystemExit(f'localhost CSP asset anchor drift: {source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)
          if source.count('EXPECTED_LOCALHOST_CSP_ICON_URLS') != 3:
              raise SystemExit('unexpected CSP URL-set reference count')
          if source.count('isExpectedLocalhostCspIconError') != 4:
              raise SystemExit('unexpected CSP predicate reference count')
          source = source.replace('EXPECTED_LOCALHOST_CSP_ICON_URLS', 'EXPECTED_LOCALHOST_CSP_ASSET_URLS')
          source = source.replace('expectedLocalhostCspIconUrls', 'expectedLocalhostCspAssetUrls')
          source = source.replace('isExpectedLocalhostCspIconError', 'isExpectedLocalhostCspAssetError')
          path.write_text(source, encoding='utf-8')
          PY
          node scripts/cache-bust.js --write
          test "$(grep -o '!important' css/nagornaya-mobile-toc.css | wc -l)" = 134
          grep -q 'NG-DARK-01 cascade-safe Chromium-confirmed utility remaps' css/nagornaya-mobile-toc.css
          grep -q "'https://gospod-bog.ru/images/og-nagornaya-propoved.webp'" scripts/nagornaya-epistemic-ui-browser-test.mjs

      - name: Prepare bounded self-cleaned diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/nagornaya_dark_cascade_repair.py
          rm -f .github/workflows/tmp-nagornaya-dark-cascade-repair.yml
          git diff --check
          changed="${RUNNER_TEMP}/changed.txt"
          git diff --name-only > "${changed}"
          grep -qx 'css/nagornaya-mobile-toc.css' "${changed}"
          grep -qx 'scripts/nagornaya-epistemic-ui-browser-test.mjs' "${changed}"
          grep -qx 'sw.js' "${changed}"
          grep -qx 'migration/sw-cache-version-baseline.json' "${changed}"
          grep -qx 'data/offline-route-matrix.json' "${changed}"
          grep -qx 'src/lib/asset-version.js' "${changed}"
          while IFS= read -r path; do
            case "${path}" in
              css/nagornaya-mobile-toc.css|scripts/nagornaya-epistemic-ui-browser-test.mjs|sw.js|migration/sw-cache-version-baseline.json|data/offline-route-matrix.json|src/lib/asset-version.js|.github/tmp/nagornaya_dark_cascade_repair.py|.github/workflows/tmp-nagornaya-dark-cascade-repair.yml) ;;
              *) grep -qxF "${path}" "${RUNNER_TEMP}/nagornaya-css-references.before" || { echo "Unexpected changed path: ${path}"; exit 1; } ;;
            esac
            case "${path}" in
              *tts*|*TTS*|*vosk*|*Vosk*) echo "Forbidden TTS path: ${path}"; exit 1 ;;
            esac
          done < "${changed}"
          test "$(git grep -l 'nagornaya-mobile-toc.css?v=' -- '*.html' '*.astro' | sort)" = "$(cat "${RUNNER_TEMP}/nagornaya-css-references.before")"

      - name: Validate source, native build, Chromium and offline contracts
        shell: bash
        run: |
          set -euo pipefail
          probe_head="$(git stash create 'nagornaya cascade shared-files probe')"
          test -n "${probe_head}"
          node scripts/guard-shared-files.js --base origin/main --head "${probe_head}" --branch "${HEAD_REF}"
          npm run guard:agents-rev
          node --check scripts/nagornaya-epistemic-ui-browser-test.mjs
          npm run nagornaya:visual-parity:audit
          npm run strangler:build:production-like
          npx playwright install --with-deps chromium
          node scripts/nagornaya-epistemic-ui-browser-test.mjs
          npm run sw:dist:audit
          npm run pagefind:build:dist
          npm run sw:dist:audit:deploy-switch

      - name: Validate full static publication barrier
        shell: bash
        run: |
          set -euo pipefail
          npm run validate:static-publication

      - name: Commit self-cleaned successor repair
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t revision_refs < "${RUNNER_TEMP}/nagornaya-css-references.before"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            css/nagornaya-mobile-toc.css \
            scripts/nagornaya-epistemic-ui-browser-test.mjs \
            sw.js \
            migration/sw-cache-version-baseline.json \
            data/offline-route-matrix.json \
            src/lib/asset-version.js \
            .github/tmp/nagornaya_dark_cascade_repair.py \
            .github/workflows/tmp-nagornaya-dark-cascade-repair.yml \
            "${revision_refs[@]}"
          git diff --cached --quiet && { echo 'No repair generated'; exit 1; }
          git commit -m 'fix(nagornaya): repair dark contrast through cascade'
          git push origin "HEAD:${HEAD_REF}"
