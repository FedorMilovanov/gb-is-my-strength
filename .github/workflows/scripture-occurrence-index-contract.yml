name: Scripture Occurrence Index Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "data/scripture-search-index.json"
      - "data/search-manifest.json"
      - "data/bible/**"
      - "migration/page-ownership.json"
      - "migration/route-migration-matrix.json"
      - "data/route-profiles/**"
      - "src/pages/**"
      - "src/components/**"
      - "src/content/**"
      - "src/lib/bible-reference-core.mjs"
      - "scripts/lib/route-source-contract.js"
      - "scripts/build-scripture-occurrence-index.mjs"
      - "scripts/scripture-occurrence-index-contract.mjs"
      - ".github/workflows/scripture-occurrence-index-contract.yml"
  push:
    branches: [main]
    paths:
      - "data/scripture-search-index.json"
      - "data/search-manifest.json"
      - "data/bible/**"
      - "migration/page-ownership.json"
      - "migration/route-migration-matrix.json"
      - "data/route-profiles/**"
      - "src/pages/**"
      - "src/components/**"
      - "src/content/**"
      - "src/lib/bible-reference-core.mjs"
      - "scripts/lib/route-source-contract.js"
      - "scripts/build-scripture-occurrence-index.mjs"
      - "scripts/scripture-occurrence-index-contract.mjs"
      - ".github/workflows/scripture-occurrence-index-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripture-occurrence-index:
    name: Deterministic source index and dist witness
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Validate source-owned deterministic index
        run: |
          node --check scripts/build-scripture-occurrence-index.mjs
          node --check scripts/scripture-occurrence-index-contract.mjs
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs
      - name: Build production-like publication witness
        run: npm run strangler:build:production-like
      - name: Validate route text and anchors in dist
        run: node scripts/scripture-occurrence-index-contract.mjs --dist=dist
      - name: Verify validation is read-only
        run: git diff --exit-code

  scripture-occurrence-autofix:
    name: Scripture occurrence index autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Resolve live pull request branch
        id: pr-branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${HEAD_REF}" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo "PR branch ${HEAD_REF} no longer exists; autofix is obsolete."
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact pull request branch
        if: steps.pr-branch.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        if: steps.pr-branch.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Generate canonical Scripture occurrence index
        if: steps.pr-branch.outputs.exists == 'true'
        run: |
          node --check scripts/build-scripture-occurrence-index.mjs
          node --check scripts/scripture-occurrence-index-contract.mjs
          node scripts/build-scripture-occurrence-index.mjs --write
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs

      - name: Validate focused diff
        if: steps.pr-branch.outputs.exists == 'true'
        shell: bash
        run: |
          git diff --check
          git diff --name-only -- . \
            ':(exclude)data/scripture-search-index.json' > /tmp/unexpected-scripture-autofix-paths
          if [[ -s /tmp/unexpected-scripture-autofix-paths ]]; then
            echo "Unexpected Scripture autofix paths:" >&2
            cat /tmp/unexpected-scripture-autofix-paths >&2
            exit 1
          fi

      - name: Commit canonical Scripture occurrence index
        if: steps.pr-branch.outputs.exists == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- data/scripture-search-index.json; then
            echo "No Scripture occurrence normalization required."
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/${HEAD_REF}" >/dev/null; then
            echo "PR branch ${HEAD_REF} disappeared after validation; autofix result is obsolete."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture-search-index.json
          git commit -m "fix(scripture): regenerate occurrence index"
          git push origin "HEAD:${HEAD_REF}"
