name: TEMP Live Reader Production Smoke

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

concurrency:
  group: temp-live-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-production-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 253
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Require exact merged Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com/repos/${{ github.repository }}
          TARGET_SHA: 59a91bacea6c498d2c16e6a965924b37f9bd7c2f
        run: |
          set -euo pipefail
          export TARGET_SHA
          mkdir -p reports/live-reader-production/github-api
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          deploy_run_id=""
          for attempt in $(seq 1 24); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows/deploy.yml/runs?head_sha=${TARGET_SHA}&per_page=20" \
              > reports/live-reader-production/github-api/deploy-runs.json
            deploy_run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.TARGET_SHA and .event == "workflow_run")) | sort_by(.created_at) | reverse | .[0].id // empty' reports/live-reader-production/github-api/deploy-runs.json)"
            if [[ -n "${deploy_run_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/actions/runs/${deploy_run_id}" \
                > reports/live-reader-production/github-api/deploy-run.json
              status="$(jq -r '.status' reports/live-reader-production/github-api/deploy-run.json)"
              [[ "${status}" == "completed" ]] && break
            fi
            sleep 15
          done
          test -n "${deploy_run_id}"
          jq -e --arg sha "${TARGET_SHA}" '.head_sha == $sha and .event == "workflow_run" and .status == "completed" and .conclusion == "success"' \
            reports/live-reader-production/github-api/deploy-run.json
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${deploy_run_id}/jobs?per_page=100" \
            > reports/live-reader-production/github-api/deploy-jobs.json
          jq -e '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length == 0' \
            reports/live-reader-production/github-api/deploy-jobs.json
          deployment_id=""
          for attempt in $(seq 1 20); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/deployments?sha=${TARGET_SHA}&per_page=100" \
              > reports/live-reader-production/github-api/deployments.json
            deployment_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' reports/live-reader-production/github-api/deployments.json)"
            if [[ -n "${deployment_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/deployments/${deployment_id}/statuses?per_page=100" \
                > reports/live-reader-production/github-api/deployment-statuses.json
              state="$(jq -r 'sort_by(.created_at) | reverse | .[0].state // empty' reports/live-reader-production/github-api/deployment-statuses.json)"
              [[ "${state}" == "success" ]] && break
            fi
            sleep 15
          done
          test -n "${deployment_id}"
          jq -e --arg sha "${TARGET_SHA}" 'length > 0 and (sort_by(.created_at) | reverse | .[0].sha == $sha)' \
            reports/live-reader-production/github-api/deployments.json
          jq -e 'sort_by(.created_at) | reverse | .[0].state == "success"' \
            reports/live-reader-production/github-api/deployment-statuses.json
          printf '%s\n' "deploy_run_id=${deploy_run_id}" "deployment_id=${deployment_id}" \
            > reports/live-reader-production/github-api/exact-deployment.txt
      - run: npm ci
      - name: Materialize exact proof contracts
        env:
          TARGET_SHA: 59a91bacea6c498d2c16e6a965924b37f9bd7c2f
        run: |
          set -euo pipefail
          git show "${TARGET_SHA}:src/lib/asset-version.js" > src/lib/asset-version.js
          git show "${TARGET_SHA}:scripts/print-paper-pdf-audit.py" > scripts/print-paper-pdf-audit.py
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-live-reader-production-smoke.yml
          node --check scripts/_temp-live-reader-production-smoke.mjs
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - name: Poll production and generate live A4 proof
        env:
          LIVE_MAX_POLLS: '20'
          LIVE_POLL_MS: '15000'
        run: node scripts/_temp-live-reader-production-smoke.mjs
      - name: Audit live production PDF
        run: python3 scripts/print-paper-pdf-audit.py reports/live-reader-production/live-reader-print-a4.pdf --out reports/live-reader-production
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reader-production-proof-${{ github.sha }}
          path: reports/live-reader-production
          if-no-files-found: warn
          retention-days: 14
