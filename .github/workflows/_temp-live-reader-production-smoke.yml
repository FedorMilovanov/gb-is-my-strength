name: TEMP Live Reader Production Smoke

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-live-reader-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-production-proof:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 253
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - name: Poll production and generate live A4 proof
        env:
          LIVE_MAX_POLLS: '80'
          LIVE_POLL_MS: '15000'
        run: node scripts/_temp-live-reader-production-smoke.mjs
      - name: Audit live production PDF
        run: python3 scripts/print-paper-pdf-audit.py reports/live-reader-production/live-reader-print-a4.pdf --out reports/live-reader-production
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reader-production-proof-${{ github.sha }}
          path: reports/live-reader-production
          if-no-files-found: warn
          retention-days: 7
