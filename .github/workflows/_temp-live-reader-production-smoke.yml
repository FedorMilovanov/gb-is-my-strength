name: TEMP Live Reader Production Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-reader-production-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compare deployed assets and run live Playwright smoke
        env:
          GB_LIVE_READER_OUT: reports/live-reader-production
        run: |
          mkdir -p reports/live-reader-production
          set -o pipefail
          node scripts/_temp-live-reader-production-smoke.mjs 2>&1 | tee reports/live-reader-production/live-smoke.log

      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-reader-production-proof-${{ github.sha }}
          path: reports/live-reader-production
          if-no-files-found: error
          retention-days: 7
