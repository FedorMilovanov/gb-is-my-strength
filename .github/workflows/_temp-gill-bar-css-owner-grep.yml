name: TEMP Locate Gill Bar CSS Owner Grep

on:
  push:
    branches:
      - diagnostic/gill-mobile-layout-2026-07-22

permissions:
  contents: write

jobs:
  locate:
    if: ${{ !contains(github.event.head_commit.message, '[css-owner-grep]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/gill-mobile-layout-2026-07-22
          fetch-depth: 0

      - name: Capture exact declarations and blame
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '# Gill mobile bar CSS ownership evidence v2'
            echo
            echo '## mobile-bottom-bar occurrences'
            grep -Rni --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=reports --exclude='*.map' 'mobile-bottom-bar' src css js scripts || true
            echo
            echo '## exact computed color candidates'
            grep -RniE --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=reports --exclude='*.map' '253[^0-9]+251[^0-9]+246|13[^0-9]+17[^0-9]+23|background[^;]*(\.8|0\.8|\.78|0\.78)' src css || true
            echo
            echo '## floating-cluster contexts'
            grep -n -A14 -B14 'mobile-bottom-bar' css/floating-cluster.css || true
            echo
            echo '## source component contexts'
            grep -Rni -A14 -B14 --include='*.astro' 'mobile-bottom-bar' src/components || true
          } > .github/_temp-gill-bar-css-owner-v2.txt
          test -s .github/_temp-gill-bar-css-owner-v2.txt

      - name: Remove workflow and publish evidence
        run: |
          rm -f .github/workflows/_temp-gill-bar-css-owner-grep.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[css-owner-grep] capture Gill bar CSS ownership'
          git push origin HEAD:diagnostic/gill-mobile-layout-2026-07-22
