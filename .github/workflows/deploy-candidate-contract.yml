name: Deploy Candidate Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "migration/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "fonts/**"
      - "audio/**"
      - "*.html"
      - "*.xml"
      - "*.txt"
      - "CNAME"
      - "manifest.json"
      - "sw.js"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/deploy-candidate-contract.yml"
  workflow_dispatch:

concurrency:
  group: deploy-candidate-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_NPM_VERSION: '10.9.8'

jobs:
  production-like-candidate:
    name: Build and audit production-like candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact candidate source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Determine genealogy release proof scope
        id: genealogy-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=false
          reason=unrelated-change
          genealogy_pattern='^(\.github/workflows/(deploy\.yml|deploy-candidate-contract\.yml)|scripts/genealogy-|data/genealogy/|src/pages/rodosloviye/|src/components/(genealogy|rodosloviye)/|src/components/search/|src/components/article-pilots/_shared/|src/components/ui/floating-cluster/|src/runtime/|src/layouts/|src/styles/|css/|js/|astro\.config\.mjs|package\.json|package-lock\.json)'
          case "$EVENT_NAME" in
            workflow_dispatch)
              run=true
              reason=workflow_dispatch
              ;;
            pull_request)
              if git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" | grep -Eq "$genealogy_pattern"; then
                run=true
                reason=genealogy-impacting-change
              fi
              ;;
          esac
          {
            echo "run=$run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          printf 'Genealogy release proof: %s (%s)\n' "$run" "$reason" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Pin release npm
        run: npm install --global npm@10.9.8

      - name: Assert pinned npm toolchain
        run: test "$(npm --version)" = "$RELEASE_NPM_VERSION"

      - name: Install dependencies once
        run: npm ci

      - name: Verify deterministic local fonts
        run: |
          node --check scripts/font-assets-lib.mjs
          node --check scripts/verify-font-assets.mjs
          node --check scripts/generate-font-assets.mjs
          node --check scripts/font-assets-contract-test.mjs
          node scripts/font-assets-contract-test.mjs
          node scripts/verify-font-assets.mjs

      - name: Validate registry structure
        run: node scripts/editorial-metadata-registry.js --check

      - name: Check source asset revisions without writing
        run: node scripts/cache-bust.js

      - name: Static publication source gates
        run: npm run validate:static-publication

      - name: Genealogy source and data contracts
        if: steps.genealogy-scope.outputs.run == 'true'
        run: |
          node scripts/genealogy-gospel-contract.mjs
          node scripts/genealogy-focus-contract.mjs
          node scripts/genealogy-geometry-contract.mjs

      - name: Build production-like dist once
        run: npm run strangler:build:production-like

      - name: Verify frozen editorial projections
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.log

      - name: Verify page ownership in candidate dist
        run: npm run page-ownership:dist:production-like

      - name: Build Pagefind index in candidate dist
        run: npm run pagefind:build:dist

      - name: Match production no-Jekyll candidate state
        run: |
          test -f dist/pagefind/pagefind.js
          touch dist/.nojekyll

      - name: Route-specific visual parity contract
        run: npm run visual:parity:production

      - name: Production-like dist publication audit
        run: node scripts/dist-publication-audit.js --require-pagefind --forbid-dev

      - name: Public URL contract compare on candidate dist
        run: npm run contract:extract:dist && npm run contract:compare:dist

      - name: Dist JSON-LD parse audit
        run: npm run dist:jsonld:audit

      - name: Semantic rich-results schema audit
        run: npm run schema:rich-results:audit:dist

      - name: PremiumControls rollout contract
        run: npm run audit:premium-controls

      - name: Gill v16 dist strict audits
        run: node scripts/gill-context-visual-parity-audit.js --require-dist && node scripts/gill-spravochnik-visual-parity-audit.js --require-dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Playwright WebKit and Firefox for genealogy release proof
        if: steps.genealogy-scope.outputs.run == 'true'
        run: npx playwright install --with-deps webkit firefox

      - name: Genealogy full browser release gate
        if: steps.genealogy-scope.outputs.run == 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GENEALOGY_BROWSERS: chromium,webkit,firefox
          GENEALOGY_VIEWPORTS: 320x760,360x800,390x844,430x932,768x1024,1024x768,1440x1000,1920x1080
        run: node scripts/genealogy-browser-contract.mjs

      - name: Preserve genealogy full-matrix evidence
        if: steps.genealogy-scope.outputs.run == 'true'
        run: cp -a reports/genealogy-browser-contract reports/genealogy-browser-contract-full

      - name: Genealogy reduced-motion release gate
        if: steps.genealogy-scope.outputs.run == 'true'
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GENEALOGY_BROWSERS: chromium,webkit
          GENEALOGY_VIEWPORTS: 390x844,1440x1000
          GENEALOGY_REDUCED_MOTION: '1'
        run: node scripts/genealogy-browser-contract.mjs

      - name: Teen series browser release gate
        run: node scripts/teen-series-quality-browser-audit.mjs

      - name: A07 offline/PWA Chromium witness
        run: node scripts/sw-offline-browser-test.mjs

      - name: SW root generation authority Chromium witness
        run: node scripts/sw-root-generation-browser-contract.mjs

      - name: Verify Home Refutations computed box model
        run: node scripts/visual-parity-home-refutations-box-model-browser-test.js

      - name: Gill pre-v16 submenu regression audit
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: npm run gill:pre-v16-submenu:audit

      - name: Gill mobile TOC and PlayEmber smoke
        run: npm run gill:mobile-play:smoke

      - name: Gill mobile reference layout audit
        run: npm run gill:mobile-layout:audit

      - name: Upload deploy-candidate diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deploy-candidate-contract-${{ github.run_id }}
          path: |
            reports/a07-offline-pwa-browser.json
            reports/a07-offline-pwa-browser.md
            reports/a07-sw-static-audit.json
            reports/a07-sw-static-audit.md
            reports/teen-series-browser/**
            reports/genealogy-browser-contract/**
            reports/genealogy-browser-contract-full/**
            reports/gill-mobile-layout-audit-2026-06-29/summary.json
            reports/gill-v16-mobile-play-smoke-2026-06-28/summary.json
            reports/gill-pre-v16-submenu-audit/**
            reports/visual-parity/home-refutations-box-model/report.json
            reports/dist-publication-audit.json
            reports/url-contract-dist.json
            reports/url-contract-dist.md
            reports/editorial-metadata-freeze.log
          if-no-files-found: error
          retention-days: 14
