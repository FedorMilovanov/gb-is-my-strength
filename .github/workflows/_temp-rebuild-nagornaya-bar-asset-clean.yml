name: TEMP Rebuild Nagornaya Bar Asset Clean

on:
  push:
    branches:
      - fix/nagornaya-bar-asset-contract-clean-2026-07-22

permissions:
  contents: write

concurrency:
  group: temp-rebuild-nagornaya-bar-asset-clean
  cancel-in-progress: true

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[nag-bar-clean]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nagornaya-bar-asset-contract-clean-2026-07-22
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy proven page/test files and patch current contracts
        shell: bash
        run: |
          set -euo pipefail
          source_ref='origin/agent/nagornaya-bar-asset-contract-2026-07-22'
          files=(
            'nagornaya/chast-1/index.html'
            'nagornaya/chast-2/index.html'
            'nagornaya/chast-3/index.html'
            'nagornaya/chast-4/index.html'
            'nagornaya/chast-5/index.html'
            'scripts/nagornaya-bar-asset-browser-test.js'
            'scripts/nagornaya-bar-asset-contract-test.js'
            'src/components/nagornaya/chast-1/NagornayaChast1PageFooter.astro'
            'src/components/nagornaya/chast-2/NagornayaChast2PageFooter.astro'
            'src/components/nagornaya/chast-3/NagornayaChast3PageFooter.astro'
            'src/components/nagornaya/chast-4/NagornayaChast4PageFooter.astro'
            'src/components/nagornaya/chast-5/NagornayaChast5PageFooter.astro'
          )
          for path in "${files[@]}"; do
            mkdir -p "$(dirname "$path")"
            git show "${source_ref}:${path}" > "$path"
          done

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          scripts = package['scripts']
          scripts['nagornaya:bar-asset:contract'] = 'node scripts/nagornaya-bar-asset-contract-test.js'
          scripts['nagornaya:bar-asset:browser:test'] = 'node scripts/nagornaya-bar-asset-browser-test.js'
          base_engine = 'node scripts/check-engine-contracts.js && npm run series:facade:guard'
          expected_engine = base_engine + ' && npm run nagornaya:bar-asset:contract'
          if scripts.get('engine:contracts') not in {base_engine, expected_engine}:
              raise SystemExit(f"unexpected current engine:contracts: {scripts.get('engine:contracts')!r}")
          scripts['engine:contracts'] = expected_engine
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cache_path = Path('scripts/cache-bust.js')
          current_lines = cache_path.read_text(encoding='utf-8').splitlines()
          proven_text = subprocess.check_output(
              ['git', 'show', 'origin/agent/nagornaya-bar-asset-contract-2026-07-22:scripts/cache-bust.js'],
              text=True,
          )
          def is_astro_revision_line(line):
              return 'const re = new RegExp' in line and '|/?)${escapedAsset}' in line
          current_matches = [i for i, line in enumerate(current_lines) if is_astro_revision_line(line)]
          proven_matches = [line for line in proven_text.splitlines() if is_astro_revision_line(line)]
          if len(current_matches) != 1 or len(proven_matches) != 1:
              raise SystemExit(f'cache-bust Astro line matches: current={len(current_matches)} proven={len(proven_matches)}')
          current_lines[current_matches[0]] = proven_matches[0]
          cache_path.write_text('\n'.join(current_lines) + '\n', encoding='utf-8')
          PY

      - name: Reconcile and verify revisions
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Verify source and engine contracts
        run: |
          npm run nagornaya:bar-asset:contract
          npm run engine:contracts
          git diff --check

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Verify production visual parity
        run: npm run visual:parity:production

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify browser matrix
        run: npm run nagornaya:bar-asset:browser:test

      - name: Publish clean permanent diff
        shell: bash
        run: |
          set -euo pipefail
          git add \
            nagornaya/chast-1/index.html \
            nagornaya/chast-2/index.html \
            nagornaya/chast-3/index.html \
            nagornaya/chast-4/index.html \
            nagornaya/chast-5/index.html \
            package.json \
            scripts/cache-bust.js \
            scripts/nagornaya-bar-asset-browser-test.js \
            scripts/nagornaya-bar-asset-contract-test.js \
            src/components/nagornaya/chast-1/NagornayaChast1PageFooter.astro \
            src/components/nagornaya/chast-2/NagornayaChast2PageFooter.astro \
            src/components/nagornaya/chast-3/NagornayaChast3PageFooter.astro \
            src/components/nagornaya/chast-4/NagornayaChast4PageFooter.astro \
            src/components/nagornaya/chast-5/NagornayaChast5PageFooter.astro
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[nag-bar-clean] materialize verified asset contract'
          git push origin HEAD:fix/nagornaya-bar-asset-contract-clean-2026-07-22
