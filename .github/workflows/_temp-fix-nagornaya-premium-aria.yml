name: Temp fix Nagornaya PremiumControls ARIA

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-fix-nagornaya-premium-aria-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact ARIA and CI cleanup patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths=[
            'src/components/nagornaya/chast-1/NagornayaChast1PageChrome.astro',
            'src/components/nagornaya/chast-2/NagornayaChast2PageChrome.astro',
            'src/components/nagornaya/chast-3/NagornayaChast3PageChrome.astro',
            'src/components/nagornaya/chast-4/NagornayaChast4PageChrome.astro',
            'src/components/nagornaya/chast-5/NagornayaChast5PageChrome.astro',
          ]
          old='data-fc-action="play" aria-label="Озвучка"'
          new='data-fc-action="play" aria-label="Озвучка" aria-haspopup="dialog" aria-expanded="false"'
          for name in paths:
              p=Path(name); text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1: raise SystemExit(f'{name}: expected one Play anchor, found {count}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')
              print(f'patched {name}')

          regression=Path('scripts/nagornaya-premium-controls-aria-regression-test.js')
          regression.write_text("""#!/usr/bin/env node
          'use strict';
          const fs = require('fs');
          const assert = require('assert/strict');
          const parts = [1, 2, 3, 4, 5];
          for (const part of parts) {
            const file = `src/components/nagornaya/chast-${part}/NagornayaChast${part}PageChrome.astro`;
            const source = fs.readFileSync(file, 'utf8');
            const tags = source.match(/<button[^>]+class=\"gb-ember nag-sidebar-ember\"[^>]*>/g) || [];
            assert.equal(tags.length, 1, `${file}: expected exactly one Nagornaya Play control`);
            assert.match(tags[0], /aria-haspopup=\"dialog\"/, `${file}: Play control must expose speed-dialog semantics`);
            assert.match(tags[0], /aria-expanded=\"false\"/, `${file}: Play control must declare its initial closed state`);
          }
          console.log('✅ Nagornaya PremiumControls ARIA source contract passed (parts I–V)');
          """.replace(/^          /gm,''),encoding='utf-8')

          guard=Path('.github/workflows/shared-files-guard.yml')
          text=guard.read_text(encoding='utf-8')
          anchor='''      - name: Nagornaya epistemic UI regressions\n        run: node scripts/nagornaya-epistemic-ui-regression-test.js\n'''
          addition=anchor+'''\n      - name: Nagornaya PremiumControls ARIA regressions\n        run: node scripts/nagornaya-premium-controls-aria-regression-test.js\n'''
          if addition not in text:
              if text.count(anchor)!=1: raise SystemExit('Shared Guard insertion anchor drift')
              text=text.replace(anchor,addition,1)
          stale='\n  nagornaya-neutral-proof:'
          if stale in text:
              text=text.split(stale,1)[0].rstrip()+'\n'
          guard.write_text(text,encoding='utf-8')
          PY

      - name: Validate exact repair
        shell: bash
        run: |
          node scripts/nagornaya-premium-controls-aria-regression-test.js
          node --check scripts/nagornaya-premium-controls-aria-regression-test.js
          node scripts/check-workflows.js
          git diff --check

      - name: Commit permanent repair
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          git diff --name-only | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/shared-files-guard.yml
          scripts/nagornaya-premium-controls-aria-regression-test.js
          src/components/nagornaya/chast-1/NagornayaChast1PageChrome.astro
          src/components/nagornaya/chast-2/NagornayaChast2PageChrome.astro
          src/components/nagornaya/chast-3/NagornayaChast3PageChrome.astro
          src/components/nagornaya/chast-4/NagornayaChast4PageChrome.astro
          src/components/nagornaya/chast-5/NagornayaChast5PageChrome.astro
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nagornaya): restore PremiumControls ARIA contract'
          git push origin HEAD:"$BRANCH"
