name: Search Sync Main Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/search-sync-main-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Refuse stale branch and fetch latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}" main
          test "$(git rev-parse "origin/${HEAD_BRANCH}")" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"
          echo "MAIN_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Merge latest main without successor branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          rm .github/workflows/search-sync-main-once.yml
          git add -A
          node --check js/search.js
          node --check scripts/audit-pro.js
          node scripts/audit-pro-source-corpus-test.js
          node scripts/cache-bust.js
          node scripts/legacy-reference-inventory-audit.mjs
          git diff --cached --check -- . ':(exclude)docs/LANE_LOCK_POLICY.md'
          git commit -m "merge(main): refresh Search candidate on ${MAIN_SHA}"
          git push origin "HEAD:${HEAD_BRANCH}"
