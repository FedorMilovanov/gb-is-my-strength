name: TEMP Map scale adversarial witness patch

on:
  push:
    branches:
      - fix/map-scale-resize-witness-20260809
    paths:
      - '.github/workflows/map-scale-adversarial-patch-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/map-scale-resize-witness-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Add bounded stale-geometry adversarial witness
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/map-engine-correctness-browser-test.mjs')
          text = path.read_text(encoding='utf-8')
          anchor = """    check('Scale bar recomputes after rendered-width resize', after.expectedWidth > 0 && expectedScaleDelta(after) <= 2.5, JSON.stringify(after));

    const waypointFacts = await page.evaluate(() => {
"""
          replacement = """    check('Scale bar recomputes after rendered-width resize', after.expectedWidth > 0 && expectedScaleDelta(after) <= 2.5, JSON.stringify(after));

    const originalScaleLineStyle = await page.evaluate((staleWidth) => {
      const line = document.querySelector('#me-scale-line');
      if (!line) return null;
      const originalStyle = line.getAttribute('style');
      line.style.setProperty('transition', 'none', 'important');
      line.style.setProperty('width', `${staleWidth}px`, 'important');
      return originalStyle;
    }, after.expectedWidth + 20);
    const stale = await waitForScaleConvergence(page, scaleFacts, before, 150);
    check(
      'Scale convergence wait rejects deliberately stale scale-bar geometry',
      originalScaleLineStyle !== null && stale.expectedWidth > 0 && expectedScaleDelta(stale) > 2.5,
      JSON.stringify(stale),
    );
    await page.evaluate((originalStyle) => {
      const line = document.querySelector('#me-scale-line');
      if (!line) return;
      if (originalStyle === null) line.removeAttribute('style');
      else line.setAttribute('style', originalStyle);
    }, originalScaleLineStyle);
    const restored = await waitForScaleConvergence(page, scaleFacts, before);
    check(
      'Scale bar recovers after stale-geometry mutation is removed',
      restored.expectedWidth > 0 && expectedScaleDelta(restored) <= 2.5,
      JSON.stringify(restored),
    );

    const waypointFacts = await page.evaluate(() => {
"""
          count = text.count(anchor)
          if count != 1:
              raise SystemExit(f'expected exactly one scale assertion anchor, found {count}')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          node --check scripts/map-engine-correctness-browser-test.mjs
          git diff --check

      - name: Remove one-shot transport and prove final scope
        run: |
          git rm .github/workflows/map-scale-adversarial-patch-temp.yml
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/map-scale-adversarial-patch-temp.yml' 'scripts/map-engine-correctness-browser-test.mjs' | sort)"
          git diff --check

      - name: Commit permanent witness only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/map-engine-correctness-browser-test.mjs
          git add -u .github/workflows/map-scale-adversarial-patch-temp.yml
          git commit -m 'test(karty): add stale scale adversarial witness'
          git push origin HEAD:fix/map-scale-resize-witness-20260809
