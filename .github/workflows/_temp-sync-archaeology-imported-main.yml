name: TEMP Sync Archaeology Imported Main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-sync-archaeology-imported-main.yml'

permissions:
  contents: write

concurrency:
  group: temp-sync-archaeology-imported-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'FedorMilovanov/gb-is-my-strength' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/map-archaeology-imported-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-archaeology-imported-verification
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch current main
        run: git fetch --no-tags origin main
      - name: Prove independent main delta
        run: |
          echo 'Main-only files:'
          git diff --name-only HEAD...origin/main
          test "$(git merge-base HEAD origin/main)" = "cb378b1d086156d46d89769d73050dc6f54e2bd3"
          test "$(git rev-parse origin/main)" = "05b187ab78f21f7714bf8d31937cfc657424c39b"
          test -z "$(comm -12 <(git diff --name-only cb378b1d086156d46d89769d73050dc6f54e2bd3..HEAD | sort) <(git diff --name-only cb378b1d086156d46d89769d73050dc6f54e2bd3..origin/main | sort))"
      - name: Merge current main without rewriting history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-edit origin/main
          git push origin HEAD:agent/map-archaeology-imported-verification
