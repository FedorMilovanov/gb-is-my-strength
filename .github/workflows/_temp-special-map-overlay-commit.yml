name: TEMP Special Map Overlay Commit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: special-map-commit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  commit:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize verified map adapter files
        id: materialize
        shell: bash
        run: |
          set +e
          mkdir -p reports
          {
            set -euo pipefail
            python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp-special-map-overlay-patch.py')
          text = path.read_text(encoding='utf-8')
          pairs = [
            (
              '"       destroy(){\\n         stopTour();\\n         _cleanupAll();\\n         container.innerHTML=\'\';container.className=\'\';\\n       }\\n"',
              '"      destroy(){\\n        stopTour();\\n        _cleanupAll();\\n        container.innerHTML=\'\';container.className=\'\';\\n      }\\n"',
            ),
            (
              '"       destroy(){\\n         stopTour();\\n         photoModal.classList.remove(\'me-photo-modal--open\');\\n         panel.classList.remove(\'me-panel--open\');\\n         panelBackdrop.classList.remove(\'me-panel__backdrop--active\');\\n         destroySpecialOverlay(photoOverlayOwner);\\n         destroySpecialOverlay(panelOverlayOwner);\\n         _cleanupAll();\\n         container.innerHTML=\'\';container.className=\'\';\\n       }\\n"',
              '"      destroy(){\\n        stopTour();\\n        photoModal.classList.remove(\'me-photo-modal--open\');\\n        panel.classList.remove(\'me-panel--open\');\\n        panelBackdrop.classList.remove(\'me-panel__backdrop--active\');\\n        destroySpecialOverlay(photoOverlayOwner);\\n        destroySpecialOverlay(panelOverlayOwner);\\n        _cleanupAll();\\n        container.innerHTML=\'\';container.className=\'\';\\n      }\\n"',
            ),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'destroy patcher source mismatch: {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
            python3 scripts/_temp-special-map-overlay-patch.py
            python3 scripts/_temp-special-map-browser-diagnostic.py
            python3 scripts/_temp-special-map-browser-finalize.py
            node --check karty/_engine/map-engine.js
            node --check scripts/map-overlay-runtime-browser-test.js
            npm run overlay:runtime:test
            git diff --check
          } > reports/special-map-materialize.log 2>&1
          status=$?
          cat reports/special-map-materialize.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload materialize diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: special-map-materialize-diagnostic
          path: reports/special-map-materialize.log
          retention-days: 1

      - name: Fail on materialize error
        if: steps.materialize.outputs.status != '0'
        run: exit 1

      - name: Commit clean non-workflow transaction
        if: steps.materialize.outputs.status == '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/_temp-special-map-overlay-patch.py \
                 scripts/_temp-special-map-browser-diagnostic.py \
                 scripts/_temp-special-map-browser-finalize.py
          git add karty/_engine/map-engine.js \
                  scripts/overlay-runtime-contract-test.js \
                  scripts/map-overlay-runtime-browser-test.js \
                  package.json
          echo '--- staged files ---'
          git status --short
          forbidden="$(git diff --cached --diff-filter=ACMR --name-only | grep -E '(^|/)_temp-|^\.github/workflows/' || true)"
          test -z "$forbidden" || { echo 'Forbidden staged files:'; echo "$forbidden"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(special): migrate map overlays to canonical runtime'
          git push origin "HEAD:${HEAD_REF}"
