name: TEMP Fix CI Lifecycle Latest Seen

on:
  push:
    branches:
      - fix/ci-lifecycle-latest-seen-20260725
    paths:
      - scripts/_temp_fix_ci_lifecycle_latest_seen.py
      - .github/workflows/_temp-fix-ci-lifecycle-latest-seen.yml

permissions:
  contents: write

concurrency:
  group: temp-fix-ci-lifecycle-latest-seen
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair lane
        uses: actions/checkout@v4
        with:
          ref: fix/ci-lifecycle-latest-seen-20260725
          fetch-depth: 0
      - name: Apply monotonic transition patch
        run: python3 scripts/_temp_fix_ci_lifecycle_latest_seen.py
      - name: Validate focused lifecycle contracts
        run: |
          node --check scripts/ci-failure-lifecycle.cjs
          node --check scripts/ci-failure-lifecycle-contract-test.cjs
          node --check scripts/ci-failure-lifecycle-source-contract-test.cjs
          node scripts/ci-failure-lifecycle-contract-test.cjs
          node scripts/ci-failure-lifecycle-source-contract-test.cjs
          git diff --check
          test ! -e scripts/_temp_fix_ci_lifecycle_latest_seen.py
      - name: Publish tested source repair
        run: |
          git config user.name "ci-lifecycle-repair-bot"
          git config user.email "ci-lifecycle-repair-bot@users.noreply.github.com"
          git add scripts/ci-failure-lifecycle.cjs scripts/ci-failure-lifecycle-contract-test.cjs scripts/ci-failure-lifecycle-source-contract-test.cjs scripts/_temp_fix_ci_lifecycle_latest_seen.py
          git diff --cached --check
          git commit -m "fix(ci): order failures against latest lifecycle transition"
          git push origin HEAD:fix/ci-lifecycle-latest-seen-20260725
