name: Temporary TTS Production Proof

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-tts-production-proof.yml"
      - "scripts/_temp-tts-production-proof.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

concurrency:
  group: temp-tts-production-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-proof:
    name: Chromium and WebKit live TTS proof
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout proof head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Verify exact successful Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com/repos/${{ github.repository }}
          TARGET_SHA: 59a91bacea6c498d2c16e6a965924b37f9bd7c2f
          DEPLOY_RUN_ID: "30135679061"
        run: |
          set -euo pipefail
          mkdir -p reports/deploy-diagnostics
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${DEPLOY_RUN_ID}" \
            > reports/deploy-diagnostics/deploy-run.json
          jq -e --arg sha "${TARGET_SHA}" '.name == "Deploy to GitHub Pages" and .head_sha == $sha and .event == "workflow_run" and .status == "completed" and .conclusion == "success"' \
            reports/deploy-diagnostics/deploy-run.json
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${DEPLOY_RUN_ID}/jobs?per_page=100" \
            > reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length == 0' \
            reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[].steps[]? | select(.name == "Upload Pages artifact" or .name == "Deploy to GitHub Pages") | select(.conclusion == "success")] | length == 2' \
            reports/deploy-diagnostics/deploy-jobs.json
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=100" \
            > reports/deploy-diagnostics/deployments.json
          deployment_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' reports/deploy-diagnostics/deployments.json)"
          test -n "${deployment_id}"
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/deployments/${deployment_id}/statuses?per_page=100" \
            > reports/deploy-diagnostics/deployment-statuses.json
          jq -e --arg run "/actions/runs/${DEPLOY_RUN_ID}" 'sort_by(.created_at) | reverse | .[0] | .state == "success" and (((.log_url // "") + (.target_url // "")) | contains($run))' \
            reports/deploy-diagnostics/deployment-statuses.json
          printf '%s\n' \
            "target_sha=${TARGET_SHA}" \
            "deploy_run_id=${DEPLOY_RUN_ID}" \
            "deployment_id=${deployment_id}" \
            "deployment_state=success" \
            > reports/deploy-diagnostics/exact-deployment.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Materialize exact production expectations
        run: |
          set -euo pipefail
          sed -i "s|const EXPECTED_MAIN = '6869e0389c7e0981f002f6471f870230f3cd3c99';|const EXPECTED_MAIN = '59a91bacea6c498d2c16e6a965924b37f9bd7c2f';|" scripts/_temp-tts-production-proof.mjs
          sed -i "s|controller: '/js/floating-cluster-controller.js?v=e7ba3d29'|controller: '/js/floating-cluster-controller.js?v=4bf2a7fd'|" scripts/_temp-tts-production-proof.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_temp-tts-production-proof.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    await waitForState(page, 'browser', 5000);
              const browserState = await noticeSnapshot(page);
              assert.equal(browserState.title, 'Сейчас системный голос');
              assert.match(browserState.meta, /Улучшенный голос проверяется/);
              assertGeometry(browserState, { mobile: config.viewport.width <= 430 });
          """
          new = """    await page.waitForSelector(
                '.gb-tts-download-notice[data-state=\"browser\"].is-visible, ' +
                '.gb-tts-download-notice[data-state=\"preparing\"].is-visible',
                { timeout: 5000 },
              );
              const browserState = await noticeSnapshot(page);
              assert.ok(
                browserState.state === 'browser' || browserState.state === 'preparing',
                `unexpected immediate TTS state: ${JSON.stringify(browserState)}`,
              );
              if (browserState.state === 'browser') {
                assert.equal(browserState.title, 'Сейчас системный голос');
                assert.match(browserState.meta, /Улучшенный голос проверяется/);
              } else {
                assert.equal(browserState.title, 'Проверяем улучшенный голос');
                assert.match(browserState.meta, /Системный голос уже работает/);
              }
              await page.waitForFunction(() => {
                const link = document.querySelector('link[data-gb-tts-download-notice]');
                if (!link || !link.sheet) return false;
                try { return link.sheet.cssRules.length > 0; } catch (_) { return true; }
              }, null, { timeout: 5000 });
              await page.waitForFunction(() => {
                const notice = document.querySelector('.gb-tts-download-notice');
                return !!notice && getComputedStyle(notice).position === 'fixed';
              }, null, { timeout: 5000 });
              const positionedState = await noticeSnapshot(page);
              assertGeometry(positionedState, { mobile: config.viewport.width <= 430 });
          """
          if old not in source:
              raise SystemExit('immediate TTS-state proof block not found')
          source = source.replace(old, new, 1)
          old_cancel = """    await page.waitForFunction(() => window.__ttsProof.modelFetchAborted === true, null, { timeout: 10000 });
              await waitForState(page, 'cancelled', 5000);
              assert.equal(await page.evaluate(() => localStorage.getItem('gbx-vosk-warmup')), 'off');
          """
          new_cancel = """    await page.waitForFunction(() => window.__ttsProof.modelFetchAborted === true, null, { timeout: 10000 });
              await waitForState(page, 'disabled', 5000);
              const disabledState = await noticeSnapshot(page);
              assert.equal(disabledState.title, 'Улучшенный голос отключён');
              assert.match(disabledState.meta, /системный голос/i);
              assert.equal(disabledState.action, 'Включить');
              assert.equal(await page.evaluate(() => localStorage.getItem('gbx-vosk-warmup')), 'off');
          """
          if old_cancel not in source:
              raise SystemExit('cancel-to-disabled proof block not found')
          source = source.replace(old_cancel, new_cancel, 1)
          path.write_text(source, encoding='utf-8')
          PY
          grep -Fq "const EXPECTED_MAIN = '59a91bacea6c498d2c16e6a965924b37f9bd7c2f';" scripts/_temp-tts-production-proof.mjs
          grep -Fq "link.sheet.cssRules.length > 0" scripts/_temp-tts-production-proof.mjs
          grep -Fq "assert.match(disabledState.meta, /системный голос/i);" scripts/_temp-tts-production-proof.mjs

      - name: Validate temporary proof source
        run: |
          node --check scripts/_temp-tts-production-proof.mjs
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-tts-production-proof.yml

      - name: Run production TTS matrix
        run: |
          set -o pipefail
          node scripts/_temp-tts-production-proof.mjs 2>&1 | tee reports/tts-production-proof.log

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-live-production-proof-${{ github.run_id }}
          path: |
            reports/deploy-diagnostics/**
            reports/tts-production-proof.json
            reports/tts-production-proof.log
            reports/chromium-*.png
            reports/webkit-*.png
          if-no-files-found: error
          retention-days: 14
