name: Temporary TTS Production Proof

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-tts-production-proof.yml"
      - "scripts/_temp-tts-production-proof.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

concurrency:
  group: temp-tts-production-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-proof:
    name: Chromium and WebKit live TTS proof
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout proof head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Require exact readiness and Pages deployment chain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com/repos/${{ github.repository }}
          TARGET_SHA: 59a91bacea6c498d2c16e6a965924b37f9bd7c2f
        run: |
          set -euo pipefail
          export TARGET_SHA
          TARGET_SHORT="${TARGET_SHA:0:8}"
          mkdir -p reports/deploy-diagnostics
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          for page in 1 2; do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows?per_page=100&page=${page}" \
              > "reports/deploy-diagnostics/workflows-page-${page}.json"
          done
          jq -s '{workflows: [.[].workflows[]]}' \
            reports/deploy-diagnostics/workflows-page-1.json \
            reports/deploy-diagnostics/workflows-page-2.json \
            > reports/deploy-diagnostics/workflows.json

          readiness_workflow_id="$(jq -r '.workflows[] | select(.name == "Metadata & IndexNow Readiness") | .id' reports/deploy-diagnostics/workflows.json | head -n 1)"
          deploy_workflow_id="$(jq -r '.workflows[] | select(.name == "Deploy to GitHub Pages") | .id' reports/deploy-diagnostics/workflows.json | head -n 1)"
          test -n "${readiness_workflow_id}"
          test -n "${deploy_workflow_id}"

          readiness_run_id=""
          for attempt in $(seq 1 40); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows/${readiness_workflow_id}/runs?head_sha=${TARGET_SHA}&per_page=20" \
              > reports/deploy-diagnostics/readiness-runs.json
            readiness_run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.TARGET_SHA and .event == "push")) | sort_by(.created_at) | reverse | .[0].id // empty' reports/deploy-diagnostics/readiness-runs.json)"
            if [[ -n "${readiness_run_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/actions/runs/${readiness_run_id}" \
                > reports/deploy-diagnostics/readiness-run.json
              readiness_status="$(jq -r '.status' reports/deploy-diagnostics/readiness-run.json)"
              if [[ "${readiness_status}" == "completed" ]]; then
                break
              fi
            fi
            sleep 15
          done
          test -n "${readiness_run_id}"
          jq -e --arg sha "${TARGET_SHA}" '.head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success"' \
            reports/deploy-diagnostics/readiness-run.json
          readiness_completed_at="$(jq -r '.updated_at' reports/deploy-diagnostics/readiness-run.json)"

          deploy_run_id=""
          for attempt in $(seq 1 40); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows/${deploy_workflow_id}/runs?event=workflow_run&branch=main&per_page=30" \
              > reports/deploy-diagnostics/deploy-runs.json
            deploy_run_id="$(jq -r --arg after "${readiness_completed_at}" '.workflow_runs | map(select(.event == "workflow_run" and .created_at >= $after)) | sort_by(.created_at) | .[0].id // empty' reports/deploy-diagnostics/deploy-runs.json)"
            if [[ -n "${deploy_run_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/actions/runs/${deploy_run_id}" \
                > reports/deploy-diagnostics/deploy-run.json
              deploy_status="$(jq -r '.status' reports/deploy-diagnostics/deploy-run.json)"
              if [[ "${deploy_status}" == "completed" ]]; then
                break
              fi
            fi
            sleep 15
          done
          test -n "${deploy_run_id}"
          jq -e '.name == "Deploy to GitHub Pages" and .event == "workflow_run" and .status == "completed" and .conclusion == "success"' \
            reports/deploy-diagnostics/deploy-run.json

          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${deploy_run_id}/jobs?per_page=100" \
            > reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length == 0' \
            reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[].steps[]? | select(.name == "Upload Pages artifact" or .name == "Deploy to GitHub Pages") | select(.conclusion == "success")] | length == 2' \
            reports/deploy-diagnostics/deploy-jobs.json

          deploy_job_id="$(jq -r '.jobs[] | select(.name == "deploy") | .id' reports/deploy-diagnostics/deploy-jobs.json | head -n 1)"
          test -n "${deploy_job_id}"
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/jobs/${deploy_job_id}/logs" \
            > reports/deploy-diagnostics/deploy-job.log
          grep -Fq "${TARGET_SHORT}" reports/deploy-diagnostics/deploy-job.log

          deploy_started_at="$(jq -r '.run_started_at // .created_at' reports/deploy-diagnostics/deploy-run.json)"
          deployment_id=""
          for attempt in $(seq 1 20); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/deployments?environment=github-pages&per_page=100" \
              > reports/deploy-diagnostics/deployments.json
            deployment_id="$(jq -r --arg after "${deploy_started_at}" 'map(select(.created_at >= $after)) | sort_by(.created_at) | .[0].id // empty' reports/deploy-diagnostics/deployments.json)"
            if [[ -n "${deployment_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/deployments/${deployment_id}/statuses?per_page=100" \
                > reports/deploy-diagnostics/deployment-statuses.json
              if jq -e --arg run "/actions/runs/${deploy_run_id}" 'sort_by(.created_at) | reverse | .[0] | .state == "success" and (((.log_url // "") + (.target_url // "")) | contains($run))' \
                reports/deploy-diagnostics/deployment-statuses.json >/dev/null; then
                break
              fi
            fi
            sleep 15
          done
          test -n "${deployment_id}"
          jq -e --arg run "/actions/runs/${deploy_run_id}" 'sort_by(.created_at) | reverse | .[0] | .state == "success" and (((.log_url // "") + (.target_url // "")) | contains($run))' \
            reports/deploy-diagnostics/deployment-statuses.json

          printf '%s\n' \
            "target_sha=${TARGET_SHA}" \
            "readiness_run_id=${readiness_run_id}" \
            "deploy_run_id=${deploy_run_id}" \
            "deployment_id=${deployment_id}" \
            "deployment_state=success" \
            > reports/deploy-diagnostics/exact-deployment.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Materialize exact production expectations
        run: |
          set -euo pipefail
          sed -i "s|const EXPECTED_MAIN = '6869e0389c7e0981f002f6471f870230f3cd3c99';|const EXPECTED_MAIN = '59a91bacea6c498d2c16e6a965924b37f9bd7c2f';|" scripts/_temp-tts-production-proof.mjs
          sed -i "s|controller: '/js/floating-cluster-controller.js?v=e7ba3d29'|controller: '/js/floating-cluster-controller.js?v=4bf2a7fd'|" scripts/_temp-tts-production-proof.mjs
          grep -Fq "const EXPECTED_MAIN = '59a91bacea6c498d2c16e6a965924b37f9bd7c2f';" scripts/_temp-tts-production-proof.mjs
          grep -Fq "controller: '/js/floating-cluster-controller.js?v=4bf2a7fd'" scripts/_temp-tts-production-proof.mjs

      - name: Validate temporary proof source
        run: |
          node --check scripts/_temp-tts-production-proof.mjs
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-tts-production-proof.yml

      - name: Run production TTS matrix
        run: |
          set -o pipefail
          node scripts/_temp-tts-production-proof.mjs 2>&1 | tee reports/tts-production-proof.log

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-live-production-proof-${{ github.run_id }}
          path: |
            reports/deploy-diagnostics/**
            reports/tts-production-proof.json
            reports/tts-production-proof.log
            reports/chromium-*.png
            reports/webkit-*.png
          if-no-files-found: error
          retention-days: 14
