name: Temporary TTS Production Proof

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-tts-production-proof.yml"
      - "scripts/_temp-tts-production-proof.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

concurrency:
  group: temp-tts-production-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-proof:
    name: Chromium and WebKit live TTS proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout proof head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Require exact readiness and Pages deployment chain
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com/repos/${{ github.repository }}
          TARGET_SHA: 8af7037617db6dd389837d4c3a2546fbe27624c7
        run: |
          set -euo pipefail
          export TARGET_SHA
          mkdir -p reports/deploy-diagnostics
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          readiness_run_id=""
          for _attempt in $(seq 1 180); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows/indexnow.yml/runs?head_sha=${TARGET_SHA}&event=push&per_page=20" \
              > reports/deploy-diagnostics/readiness-runs.json
            readiness_run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.TARGET_SHA and .event == "push")) | sort_by(.created_at) | reverse | .[0].id // empty' reports/deploy-diagnostics/readiness-runs.json)"
            if [[ -n "${readiness_run_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/actions/runs/${readiness_run_id}" > reports/deploy-diagnostics/readiness-run.json
              status="$(jq -r '.status' reports/deploy-diagnostics/readiness-run.json)"
              [[ "${status}" == "completed" ]] && break
            fi
            sleep 15
          done
          test -n "${readiness_run_id}"
          jq -e --arg sha "${TARGET_SHA}" '.name == "Metadata & IndexNow Readiness" and .head_sha == $sha and .event == "push" and .status == "completed" and .conclusion == "success"' reports/deploy-diagnostics/readiness-run.json

          deploy_run_id=""
          for _attempt in $(seq 1 180); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/actions/workflows/deploy.yml/runs?head_sha=${TARGET_SHA}&event=workflow_run&per_page=20" \
              > reports/deploy-diagnostics/deploy-runs.json
            deploy_run_id="$(jq -r '.workflow_runs | map(select(.head_sha == env.TARGET_SHA and .event == "workflow_run")) | sort_by(.created_at) | reverse | .[0].id // empty' reports/deploy-diagnostics/deploy-runs.json)"
            if [[ -n "${deploy_run_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/actions/runs/${deploy_run_id}" > reports/deploy-diagnostics/deploy-run.json
              status="$(jq -r '.status' reports/deploy-diagnostics/deploy-run.json)"
              [[ "${status}" == "completed" ]] && break
            fi
            sleep 15
          done
          test -n "${deploy_run_id}"
          jq -e --arg sha "${TARGET_SHA}" '.name == "Deploy to GitHub Pages" and .head_sha == $sha and .event == "workflow_run" and .status == "completed" and .conclusion == "success"' reports/deploy-diagnostics/deploy-run.json

          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${deploy_run_id}/jobs?per_page=100" > reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")] | length == 0' reports/deploy-diagnostics/deploy-jobs.json
          jq -e '[.jobs[].steps[]? | select(.name == "Upload Pages artifact" or .name == "Deploy to GitHub Pages") | select(.conclusion == "success")] | length == 2' reports/deploy-diagnostics/deploy-jobs.json

          deployment_id=""
          for _attempt in $(seq 1 60); do
            curl --fail-with-body --location --silent --show-error "${headers[@]}" \
              "${GH_API}/deployments?sha=${TARGET_SHA}&environment=github-pages&per_page=100" > reports/deploy-diagnostics/deployments.json
            deployment_id="$(jq -r 'sort_by(.created_at) | reverse | .[0].id // empty' reports/deploy-diagnostics/deployments.json)"
            if [[ -n "${deployment_id}" ]]; then
              curl --fail-with-body --location --silent --show-error "${headers[@]}" \
                "${GH_API}/deployments/${deployment_id}/statuses?per_page=100" > reports/deploy-diagnostics/deployment-statuses.json
              if jq -e --arg run "/actions/runs/${deploy_run_id}" 'sort_by(.created_at) | reverse | .[0] | .state == "success" and (((.log_url // "") + (.target_url // "")) | contains($run))' reports/deploy-diagnostics/deployment-statuses.json >/dev/null; then
                break
              fi
            fi
            sleep 15
          done
          test -n "${deployment_id}"
          jq -e --arg sha "${TARGET_SHA}" 'length > 0 and (sort_by(.created_at) | reverse | .[0].sha == $sha)' reports/deploy-diagnostics/deployments.json
          jq -e --arg run "/actions/runs/${deploy_run_id}" 'sort_by(.created_at) | reverse | .[0] | .state == "success" and (((.log_url // "") + (.target_url // "")) | contains($run))' reports/deploy-diagnostics/deployment-statuses.json

          printf '%s\n' \
            "target_sha=${TARGET_SHA}" \
            "readiness_run_id=${readiness_run_id}" \
            "deploy_run_id=${deploy_run_id}" \
            "deployment_id=${deployment_id}" \
            "deployment_state=success" \
            > reports/deploy-diagnostics/exact-deployment.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Materialize exact production expectations
        run: |
          set -euo pipefail
          sed -i "s|const EXPECTED_MAIN = '6869e0389c7e0981f002f6471f870230f3cd3c99';|const EXPECTED_MAIN = '8af7037617db6dd389837d4c3a2546fbe27624c7';|" scripts/_temp-tts-production-proof.mjs
          sed -i "s|controller: '/js/floating-cluster-controller.js?v=e7ba3d29'|controller: '/js/floating-cluster-controller.js?v=75656128'|" scripts/_temp-tts-production-proof.mjs
          sed -i "s|engine: '/js/vosk-tts-engine.js?v=87bfc44a'|engine: '/js/vosk-tts-engine.js?v=9ca1685a'|" scripts/_temp-tts-production-proof.mjs
          sed -i "s|noticeCss: '/css/tts-download-notice.css?v=1cdbee44'|noticeCss: '/css/tts-download-notice.css?v=475abd4b'|" scripts/_temp-tts-production-proof.mjs
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/_temp-tts-production-proof.mjs')
          source = path.read_text(encoding='utf-8')
          old = """    await waitForState(page, 'browser', 5000);
              const browserState = await noticeSnapshot(page);
              assert.equal(browserState.title, 'Сейчас системный голос');
              assert.match(browserState.meta, /Улучшенный голос проверяется/);
              assertGeometry(browserState, { mobile: config.viewport.width <= 430 });
          """
          new = """    await waitForState(page, 'browser', 5000);
              const browserState = await noticeSnapshot(page);
              assert.equal(browserState.title, 'Сейчас системный голос');
              assert.match(browserState.meta, /Улучшенный голос проверяется/);
              await page.waitForFunction(() => {
                const link = document.querySelector('link[data-gb-tts-download-notice]');
                if (!link || !link.sheet) return false;
                try { return link.sheet.cssRules.length > 0; } catch (_) { return true; }
              }, null, { timeout: 5000 });
              await page.waitForFunction(() => {
                const notice = document.querySelector('.gb-tts-download-notice');
                return !!notice && getComputedStyle(notice).position === 'fixed';
              }, null, { timeout: 5000 });
              const positionedState = await noticeSnapshot(page);
              assertGeometry(positionedState, { mobile: config.viewport.width <= 430 });
          """
          if old not in source:
              raise SystemExit('strict browser-state proof block not found')
          source = source.replace(old, new, 1)

          old_cancel = """    await page.waitForFunction(() => window.__ttsProof.modelFetchAborted === true, null, { timeout: 10000 });
              await waitForState(page, 'cancelled', 5000);
              assert.equal(await page.evaluate(() => localStorage.getItem('gbx-vosk-warmup')), 'off');
          """
          new_cancel = """    await page.waitForFunction(() => window.__ttsProof.modelFetchAborted === true, null, { timeout: 10000 });
              await waitForState(page, 'disabled', 5000);
              const disabledState = await noticeSnapshot(page);
              assert.equal(disabledState.title, 'Улучшенный голос отключён');
              assert.match(disabledState.meta, /системный голос/i);
              assert.equal(disabledState.action, 'Включить');
              assert.equal(await page.evaluate(() => localStorage.getItem('gbx-vosk-warmup')), 'off');
          """
          if old_cancel not in source:
              raise SystemExit('cancel-to-disabled proof block not found')
          source = source.replace(old_cancel, new_cancel, 1)
          path.write_text(source, encoding='utf-8')
          PY
          grep -Fq "const EXPECTED_MAIN = '8af7037617db6dd389837d4c3a2546fbe27624c7';" scripts/_temp-tts-production-proof.mjs
          grep -Fq "controller: '/js/floating-cluster-controller.js?v=75656128'" scripts/_temp-tts-production-proof.mjs
          grep -Fq "engine: '/js/vosk-tts-engine.js?v=9ca1685a'" scripts/_temp-tts-production-proof.mjs
          grep -Fq "noticeCss: '/css/tts-download-notice.css?v=475abd4b'" scripts/_temp-tts-production-proof.mjs
          grep -Fq "link.sheet.cssRules.length > 0" scripts/_temp-tts-production-proof.mjs
          grep -Fq "assert.match(disabledState.meta, /системный голос/i);" scripts/_temp-tts-production-proof.mjs

      - name: Validate temporary proof source
        run: |
          mkdir -p reports
          node --check scripts/_temp-tts-production-proof.mjs
          set -o pipefail
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-tts-production-proof.yml 2>&1 | tee reports/tts-proof-actionlint.log

      - name: Verify live lazy-asset policy
        run: |
          set -euo pipefail
          curl --fail-with-body --location --silent --show-error \
            -H 'Cache-Control: no-cache' \
            "https://gospod-bog.ru/sw.js?tts_proof=${GITHUB_RUN_ID}" > reports/live-sw.js
          ! grep -Fq '/css/tts-download-notice.css' reports/live-sw.js
          ! grep -Fq '/js/vosk-tts-engine.js' reports/live-sw.js

      - name: Run production TTS matrix
        run: |
          set -o pipefail
          node scripts/_temp-tts-production-proof.mjs 2>&1 | tee reports/tts-production-proof.log

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-live-production-proof-${{ github.run_id }}
          path: |
            reports/deploy-diagnostics/**
            reports/live-sw.js
            reports/tts-proof-actionlint.log
            reports/tts-production-proof.json
            reports/tts-production-proof.log
            reports/chromium-*.png
            reports/webkit-*.png
          if-no-files-found: error
          retention-days: 14
