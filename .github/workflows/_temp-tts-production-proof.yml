name: Temporary TTS Production Proof

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-tts-production-proof.yml"
      - "scripts/_temp-tts-production-proof.mjs"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read
  pages: read

concurrency:
  group: temp-tts-production-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-proof:
    name: Chromium and WebKit live TTS proof
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout proof head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Capture failed TTS deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API: https://api.github.com/repos/${{ github.repository }}
          DEPLOY_RUN_ID: "30130291535"
          DEPLOY_JOB_ID: "89603072063"
          DEPLOYMENT_ID: "5596004610"
        run: |
          set -euo pipefail
          mkdir -p reports/deploy-diagnostics
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${DEPLOY_RUN_ID}" \
            > reports/deploy-diagnostics/deploy-run.json
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/runs/${DEPLOY_RUN_ID}/jobs?per_page=100" \
            > reports/deploy-diagnostics/deploy-jobs.json
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/actions/jobs/${DEPLOY_JOB_ID}/logs" \
            > reports/deploy-diagnostics/deploy-job.log
          curl --fail-with-body --location --silent --show-error "${headers[@]}" \
            "${GH_API}/deployments/${DEPLOYMENT_ID}/statuses?per_page=100" \
            > reports/deploy-diagnostics/deployment-statuses.json
          tail -n 240 reports/deploy-diagnostics/deploy-job.log \
            > reports/deploy-diagnostics/deploy-job-tail.log

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate temporary proof source
        run: |
          node --check scripts/_temp-tts-production-proof.mjs
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-tts-production-proof.yml

      - name: Run production TTS matrix
        run: |
          set -o pipefail
          node scripts/_temp-tts-production-proof.mjs 2>&1 | tee reports/tts-production-proof.log

      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-live-production-proof-${{ github.run_id }}
          path: |
            reports/deploy-diagnostics/**
            reports/tts-production-proof.json
            reports/tts-production-proof.log
            reports/chromium-*.png
            reports/webkit-*.png
          if-no-files-found: error
          retention-days: 14
