name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]

concurrency:
  group: shared-files-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Asset revision drift (read-only)
        run: node scripts/cache-bust.js

      - name: Workflow policy contracts
        run: npm run workflows:check

      - name: Readiness-to-deploy workflow linkage
        run: node scripts/workflow-linkage-regression-test.js

      - name: Visual parity route-policy regressions
        run: node scripts/visual-parity-policy-regression-test.js

      - name: Runtime integrity regressions
        run: node scripts/runtime-integrity-test.js

      - name: Overlay runtime contracts
        run: |
          node --check js/site-utils.js
          node --check js/site.js
          node --check js/floating-cluster-controller.js
          node scripts/overlay-runtime-contract-test.js

      - name: Special overlay writer regressions
        run: npm run overlay:special:writers:test

      - name: Map engine P0 regressions
        run: |
          node --check karty/_engine/map-engine.js
          node scripts/map-engine-p0-regression-test.js

      - name: Map initial-state regressions
        run: node scripts/map-initial-state-regression-test.js

      - name: Map layers and palette regressions
        run: node scripts/map-layers-theme-regression-test.js

      - name: Reader preferences regressions
        run: node scripts/reader-preferences-regression-test.js

      - name: Highlights runtime regressions
        run: node scripts/highlights-runtime-regression-test.js

      - name: Nagornaya pastoral safety regressions
        run: node scripts/nagornaya-pastoral-safety-regression-test.js

      - name: Nagornaya source integrity regressions
        run: node scripts/nagornaya-source-integrity-regression-test.js

      - name: Nagornaya source registry regressions
        run: node scripts/nagornaya-source-registry-test.js

      - name: Series reader façade regressions
        run: npm run series:facade:guard

      - name: Guard shared/system files (strict on main/PR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/guard-shared-files.js

      - name: Guard shared/system files (warn on lane branches)
        if: startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/heads/agent/')
        run: node scripts/guard-shared-files.js --warn
        continue-on-error: true

      - name: Lint workflow YAML (actionlint)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Report shared files touched
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Branch: $REF_NAME"
          echo "Event: $EVENT_NAME"
          echo "Shared files guard completed"

  nagornaya-neutral-proof:
    needs: guard
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 155 && github.event.pull_request.head.ref == 'agent/nagornaya-neutral-comparison-ui-2026-07-22'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check proof state
        id: gate
        run: |
          if test -f reports/nagornaya-neutral-comparison/transaction-status.txt; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture exact live baseline
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_URL: https://gospod-bog.ru
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: node scripts/_temp-nagornaya-neutral-baseline-witness.mjs

      - name: Apply isolated exact patch
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/_temp-nagornaya-neutral-comparison-patcher.py

      - name: Build production-like output
        if: steps.gate.outputs.run == 'true'
        run: npm run strangler:build:production-like

      - name: Synchronize canonical shadow pages
        if: steps.gate.outputs.run == 'true'
        run: cp dist/nagornaya/chast-4/index.html nagornaya/chast-4/index.html && cp dist/nagornaya/chast-5/index.html nagornaya/chast-5/index.html

      - name: Run permanent source contracts
        if: steps.gate.outputs.run == 'true'
        run: npm run nagornaya:neutral-comparison:test && npm run engine:contracts && node scripts/cache-bust.js

      - name: Run browser witness and capture after state
        if: steps.gate.outputs.run == 'true'
        env:
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: npm run nagornaya:neutral-comparison:browser:test

      - name: Run static publication barrier
        if: steps.gate.outputs.run == 'true'
        run: npm run validate:static-publication:light

      - name: Record evidence manifest
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '%s\n' \
            '# Nagornaya neutral comparison evidence' \
            '' \
            '- Baseline source: live production from exact verified main `6c4106aecd35a3c95b09b041332d653f581ceb92`.' \
            "- Shared Files Guard proof run: \`${RUN_ID}\`." \
            '- Viewports: 390×844 and 1440×900.' \
            '- Blocks: Part IV / Green, Part IV / Thomas, Part V / pastoral discernment.' \
            '- Browser contract also covers 320×760, reduced motion, Sepia, ARIA, DOM order and horizontal overflow.' \
            > reports/nagornaya-neutral-comparison/README.md
          printf 'success %s\n' "$RUN_ID" > reports/nagornaya-neutral-comparison/transaction-status.txt

      - name: Commit verified permanent diff to PR branch
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/lib/nagornaya-claim-projection.ts src/components/nagornaya/shared/NagornayaClaimComparison.astro src/components/nagornaya/chast-4/NagornayaChast4MainShell.astro src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro nagornaya/chast-4/index.html nagornaya/chast-5/index.html scripts/nagornaya-neutral-comparison-regression-test.js scripts/nagornaya-neutral-comparison-browser-test.mjs reports/nagornaya-neutral-comparison
          git diff --cached --check
          git commit -m 'feat(nagornaya): add neutral comparison UI'
          git push origin HEAD:refs/heads/agent/nagornaya-neutral-comparison-ui-2026-07-22

      - name: Upload visual evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nagornaya-neutral-comparison-evidence-${{ github.run_id }}
          path: reports/nagornaya-neutral-comparison
          if-no-files-found: warn
