name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]

concurrency:
  group: shared-files-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Runtime integrity regressions
        run: node scripts/runtime-integrity-test.js

      - name: Map engine P0 regressions
        run: |
          node --check karty/_engine/map-engine.js
          node scripts/map-engine-p0-regression-test.js

      - name: Map initial-state regressions
        run: node scripts/map-initial-state-regression-test.js

      - name: Map layers and palette regressions
        run: node scripts/map-layers-theme-regression-test.js

      - name: Reader preferences regressions
        run: node scripts/reader-preferences-regression-test.js

      - name: Series reader façade regressions
        run: npm run series:facade:guard

      - name: Guard shared/system files (strict on main/PR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/guard-shared-files.js

      - name: Guard shared/system files (warn on lane branches)
        if: startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/heads/agent/')
        run: node scripts/guard-shared-files.js --warn
        continue-on-error: true

      - name: Lint workflow YAML (actionlint)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          # Download actionlint binary (no npx — deterministic version)
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Report shared files touched
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Branch: $REF_NAME"
          echo "Event: $EVENT_NAME"
          echo "Shared files guard completed"

  r5-apply-runtime:
    if: github.event_name == 'pull_request' && github.head_ref == 'lane/reader-r5-overlay-runtime-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Apply deterministic R5 hardening and consumer patches
        id: apply
        shell: bash
        run: |
          set +e
          mkdir -p reports
          changed=false
          status=0
          {
            set -euo pipefail
            if ! grep -q "lockScroll: lockScroll" js/site-utils.js; then
              python3 scripts/_temp-r5-patch-runtime-hardening.py
              changed=true
            fi
            if ! grep -q "gill-series-toc" js/floating-cluster-controller.js; then
              python3 scripts/_temp-r5-patch-floating-cluster.py
              changed=true
            fi
          } > reports/r5-patch-diagnostic.log 2>&1 || status=$?
          cat reports/r5-patch-diagnostic.log
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload R5 patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r5-patch-diagnostic
          path: reports/r5-patch-diagnostic.log
          if-no-files-found: error
          retention-days: 1

      - name: Fail on patch error
        if: steps.apply.outputs.status != '0'
        run: exit 1

      - name: Validate R5 runtime transaction
        if: steps.apply.outputs.changed == 'true' && steps.apply.outputs.status == '0'
        run: |
          set -euo pipefail
          node --check js/site-utils.js
          node --check js/site.js
          node --check js/floating-cluster-controller.js
          node scripts/runtime-integrity-test.js
          node scripts/overlay-runtime-contract-test.js
          git diff --check
          npm ci
          npm run astro:check

      - name: Commit only permanent R5 runtime files
        if: steps.apply.outputs.changed == 'true' && steps.apply.outputs.status == '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            js/site-utils.js \
            js/floating-cluster-controller.js \
            scripts/runtime-integrity-test.js \
            scripts/overlay-runtime-contract-test.js
          test -z "$(git diff --cached --name-only | grep -E '(^|/)_temp-|^reports/|reader-r5-overlay-runtime-inventory\.json$' || true)"
          git diff --cached --quiet && { echo "No permanent changes to commit"; exit 0; }
          git commit -m "refactor(reader): migrate overlays to shared runtime"
          git push origin "HEAD:${HEAD_REF}"
