name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-source-links:
    if: github.head_ref == 'agent/_temp-dispatch-source-links-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Source Link Audit on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/dispatch-response.txt"
          status="$({ curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/source-links.yml/dispatches" \
            --data '{"ref":"main"}'; } || true)"
          if [ "$status" != "204" ]; then
            cat "$response_file" >&2 || true
            echo "workflow dispatch failed with HTTP $status" >&2
            exit 1
          fi
          echo "Source Link Audit dispatched on main"
