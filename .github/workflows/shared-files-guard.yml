name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-source-context:
    if: github.head_ref == 'agent/_temp-source352-context'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/_temp-source352-context
          persist-credentials: false
      - name: Extract exact source citation context
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/source352-context.txt"
          from pathlib import Path
          import re

          paths = [
              Path('articles/dzhon-gill-istoricheskiy-kontekst/index.html'),
              Path('articles/dzhon-gill-spravochnik/index.html'),
          ]
          needles = [
              'archive.org/details/confessionoffait00lond',
              'archive.org/details/historyofenglish01cros',
              'katalog.ub.uni-heidelberg.de/titel/1055162692',
              'cambridge.org',
              'grace-ebooks.com',
          ]

          for path in paths:
              text = path.read_text(encoding='utf-8')
              print(f'\n===== FILE {path} =====')
              for needle in needles:
                  start = 0
                  found = False
                  while True:
                      idx = text.lower().find(needle.lower(), start)
                      if idx < 0:
                          break
                      found = True
                      lo = max(0, idx - 900)
                      hi = min(len(text), idx + len(needle) + 900)
                      context = re.sub(r'\s+', ' ', text[lo:hi])
                      print(f'\n--- NEEDLE {needle} @ {idx} ---')
                      print(context)
                      start = idx + 1
                  if found:
                      print(f'--- END {needle} ---')

              print('\n--- MATCHING EXTERNAL HREFS ---')
              for href, label in re.findall(r'<a\b[^>]*href=["\']([^"\']+)["\'][^>]*>(.*?)</a>', text, flags=re.I|re.S):
                  if any(host in href.lower() for host in ('archive.org', 'heidelberg.de', 'cambridge.org', 'grace-ebooks.com')):
                      clean_label = re.sub(r'<[^>]+>', ' ', label)
                      clean_label = re.sub(r'\s+', ' ', clean_label).strip()
                      print(f'HREF={href}\nLABEL={clean_label}')
          PY
      - name: Upload exact citation context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source352-context-${{ github.run_id }}
          path: ${{ runner.temp }}/source352-context.txt
          if-no-files-found: error
          retention-days: 7
