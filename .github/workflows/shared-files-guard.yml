name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]

concurrency:
  group: shared-files-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    if: github.event_name != 'pull_request' || github.event.pull_request.state != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: "npm"

      - name: Resolve live PR diff authority
        id: pr-authority
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_PAYLOAD_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --check scripts/shared-diff-authority.mjs
          node scripts/shared-diff-authority.mjs

      - name: Lane collision guard contract
        run: |
          node --check scripts/shared-diff-authority.mjs
          node --check scripts/shared-diff-authority-contract-test.mjs
          node --check scripts/lane-collision-guard.mjs
          node --check scripts/lane-collision-guard-contract-test.mjs
          node scripts/shared-diff-authority-contract-test.mjs
          node scripts/lane-collision-guard-contract-test.mjs

      - name: Guard active lane collisions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EFFECTIVE_BASE_SHA: ${{ steps.pr-authority.outputs.effective_base }}
          EFFECTIVE_HEAD_SHA: ${{ steps.pr-authority.outputs.effective_head }}
        run: node scripts/lane-collision-guard.mjs

      - name: Asset revision drift (read-only)
        run: node scripts/cache-bust.js

      - name: Deterministic font asset contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          node --check scripts/font-assets-lib.mjs
          node --check scripts/verify-font-assets.mjs
          node --check scripts/generate-font-assets.mjs
          node --check scripts/font-assets-contract-test.mjs
          node --check scripts/font-assets-alias-contract-test.mjs
          node scripts/font-assets-contract-test.mjs 2>&1 | tee reports/font-assets-contract.log
          node scripts/font-assets-alias-contract-test.mjs 2>&1 | tee reports/font-assets-alias-contract.log
          node scripts/verify-font-assets.mjs 2>&1 | tee reports/font-assets-verification.log

      - name: Workflow policy contracts
        run: npm run workflows:check

      - name: CI failure lifecycle regressions
        run: |
          node --check scripts/ci-failure-lifecycle.cjs
          node --check scripts/ci-failure-lifecycle-contract-test.cjs
          node --check scripts/ci-failure-lifecycle-source-contract-test.cjs
          node scripts/ci-failure-lifecycle-contract-test.cjs
          node scripts/ci-failure-lifecycle-source-contract-test.cjs

      - name: Repository control-plane integrity
        run: npm run control-plane:audit

      - name: Bible legacy authority regressions
        shell: bash
        run: |
          set -o pipefail
          node --check scripts/bible-reference-contract.mjs
          node --check scripts/bible-legacy-authority-regression-test.mjs
          node scripts/bible-legacy-authority-regression-test.mjs 2>&1 | tee reports/bible-legacy-authority-regression.log

      - name: Legacy reference inventory and explicit path API
        run: |
          node --check scripts/legacy-reference-inventory-audit.mjs
          node --check migration/legacy-reference-path.js
          node --check scripts/legacy-reference-path-contract-test.js
          node --check scripts/audit-pro-source-corpus-test.js
          node --check scripts/strangler-duplicate-inventory.mjs
          node scripts/legacy-reference-inventory-audit.mjs
          node scripts/legacy-reference-path-contract-test.js
          node scripts/audit-pro-source-corpus-test.js
          node scripts/strangler-duplicate-inventory.mjs --self-test
          node scripts/strangler-duplicate-inventory.mjs \
            --out-json reports/strangler-duplicate-inventory.json \
            --out-md reports/strangler-duplicate-inventory.md

      - name: Gill claim surface reference authority
        run: |
          node --check scripts/gill-claim-surface-audit.js
          node scripts/gill-claim-surface-audit.js --json

      - name: Baptist roadmap publication authority
        run: |
          node --check scripts/baptisty-roadmap-audit.js
          node scripts/baptisty-roadmap-audit.js

      - name: Retained readable reference authority
        run: |
          node --check scripts/readable-audit.js
          node scripts/readable-audit.js

      - name: Owner UI retained reference authority
        run: |
          node --check scripts/owner-ui-regression-guard.js
          node scripts/owner-ui-regression-guard.js

      - name: Strangler parity authority and Baptists built-app measurement
        run: |
          node --check scripts/lib/visual-parity-authority.cjs
          node --check scripts/visual-parity-authority-audit.mjs
          node --check scripts/baptists-built-app-measure.mjs
          node --check scripts/baptists-built-app-browser-measure.mjs
          node scripts/visual-parity-authority-audit.mjs --self-test
          node scripts/baptists-built-app-measure.mjs --self-test
          node scripts/visual-parity-authority-audit.mjs \
            --out-json reports/visual-parity-authority.json \
            --out-md reports/visual-parity-authority.md
          node scripts/baptists-built-app-measure.mjs \
            --out-json reports/baptists-built-app-measure.json \
            --out-md reports/baptists-built-app-measure.md

      - name: Legacy shadow retirement readiness
        run: |
          node --check scripts/legacy-shadow-retirement-readiness.mjs
          node scripts/legacy-shadow-retirement-readiness.mjs --self-test
          node scripts/legacy-shadow-retirement-readiness.mjs \
            --out-json reports/legacy-shadow-retirement-readiness.json \
            --out-md reports/legacy-shadow-retirement-readiness.md

      - name: Readiness-to-deploy workflow linkage
        run: node scripts/workflow-linkage-regression-test.js

      - name: Visual parity route-policy regressions
        run: node scripts/visual-parity-policy-regression-test.js

      - name: Runtime integrity regressions
        run: |
          node scripts/runtime-integrity-test.js
          node scripts/faq-jsonld-text-contract-test.js

      - name: Overlay runtime contracts
        run: |
          node --check js/site-utils.js
          node --check js/site.js
          node --check js/floating-cluster-controller.js
          node scripts/overlay-runtime-contract-test.js

      - name: Special overlay writer regressions
        run: npm run overlay:special:writers:test

      - name: Engine contracts and map P0 regressions
        run: |
          npm run engine:contracts
          node --check karty/_engine/map-engine.js
          node scripts/map-engine-p0-regression-test.js
          node scripts/avraam-map-audit.js

      - name: Map initial-state regressions
        run: node scripts/map-initial-state-regression-test.js

      - name: Map layers and palette regressions
        run: node scripts/map-layers-theme-regression-test.js

      - name: Reader preferences regressions
        run: node scripts/reader-preferences-regression-test.js

      - name: Highlights runtime regressions
        run: node scripts/highlights-runtime-regression-test.js

      - name: Nagornaya bar asset retained fixture regressions
        run: |
          node --check scripts/nagornaya-bar-asset-contract-test.js
          node scripts/nagornaya-bar-asset-contract-test.js

      - name: Nagornaya pastoral safety regressions
        run: node scripts/nagornaya-pastoral-safety-regression-test.js

      - name: Nagornaya source integrity regressions
        run: node scripts/nagornaya-source-integrity-regression-test.js

      - name: Nagornaya source registry regressions
        run: node scripts/nagornaya-source-registry-test.js

      - name: Nagornaya epistemic UI regressions
        run: node scripts/nagornaya-epistemic-ui-regression-test.js

      - name: Nagornaya PremiumControls ARIA regressions
        run: node scripts/nagornaya-premium-controls-aria-regression-test.js

      - name: Series reader capability regressions
        run: |
          npm run series:facade:guard
          npm run surface:registry:check
          node scripts/series-capability-route-name-regression-test.js

      - name: Guard actual shared/system diff
        shell: bash
        env:
          PR_EFFECTIVE_BASE_SHA: ${{ steps.pr-authority.outputs.effective_base }}
          PR_EFFECTIVE_HEAD_SHA: ${{ steps.pr-authority.outputs.effective_head }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_EFFECTIVE_BASE_SHA"
            HEAD_SHA="$PR_EFFECTIVE_HEAD_SHA"
            test -n "$BASE_SHA"
            test -n "$HEAD_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi
          fi
          extra=()
          if [[ "$EVENT_NAME" == "push" && "$BRANCH_NAME" != "main" ]]; then
            extra+=(--warn)
          fi
          node scripts/guard-shared-files.js \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --branch "$BRANCH_NAME" \
            "${extra[@]}"

      - name: Lint workflow YAML (actionlint)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: npm run workflows:lint

      - name: Upload control-plane audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-control-plane-audit-${{ github.run_id }}
          path: |
            reports/repository-control-plane-audit.json
            reports/repository-control-plane-audit.md
            reports/shared-pr-diff-authority.json
            reports/font-assets-contract.log
            reports/font-assets-alias-contract.log
            reports/font-assets-verification.log
            reports/font-assets-verification.json
            reports/bible-legacy-authority-regression.log
            reports/strangler-duplicate-inventory.json
            reports/strangler-duplicate-inventory.md
            reports/visual-parity-authority.json
            reports/visual-parity-authority.md
            reports/baptists-built-app-measure.json
            reports/baptists-built-app-measure.md
            reports/legacy-shadow-retirement-readiness.json
            reports/legacy-shadow-retirement-readiness.md
          if-no-files-found: warn
          retention-days: 14

      - name: Report shared files touched
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Branch: $REF_NAME"
          echo "Event: $EVENT_NAME"
          echo "Shared files guard completed"
