name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]

concurrency:
  group: shared-files-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Runtime integrity regressions
        run: node scripts/runtime-integrity-test.js

      - name: Map engine P0 regressions
        run: |
          node --check karty/_engine/map-engine.js
          node scripts/map-engine-p0-regression-test.js

      - name: Map initial-state regressions
        run: node scripts/map-initial-state-regression-test.js

      - name: Map layers and palette regressions
        run: node scripts/map-layers-theme-regression-test.js

      - name: Reader preferences regressions
        run: node scripts/reader-preferences-regression-test.js

      - name: Series reader façade regressions
        run: npm run series:facade:guard

      - name: Guard shared/system files (strict on main/PR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/guard-shared-files.js

      - name: Guard shared/system files (warn on lane branches)
        if: startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/heads/agent/')
        run: node scripts/guard-shared-files.js --warn
        continue-on-error: true

      - name: Lint workflow YAML (actionlint)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          # Download actionlint binary (no npx — deterministic version)
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Report shared files touched
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Branch: $REF_NAME"
          echo "Event: $EVENT_NAME"
          echo "Shared files guard completed"

  r5-apply-core:
    if: github.event_name == 'pull_request' && github.head_ref == 'lane/reader-r5-overlay-runtime-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Apply deterministic R5 core patches
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "Object.defineProperty(window, 'OverlayRuntime'" js/site-utils.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OverlayRuntime core is already applied"
            exit 0
          fi
          python3 scripts/_temp-r5-patch-lock.py
          python3 scripts/_temp-r5-patch-runtime.py
          python3 scripts/_temp-r5-patch-sitejs.py
          python3 scripts/_temp-r5-patch-reader-settings.py
          python3 scripts/_temp-r5-patch-hermenevtika.py
          python3 scripts/_temp-r5-patch-test-harness.py
          python3 scripts/_temp-r5-patch-test-cases.py
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Validate R5 core transaction
        if: steps.apply.outputs.changed == 'true'
        run: |
          set -euo pipefail
          node --check js/site-utils.js
          node --check js/site.js
          node scripts/runtime-integrity-test.js
          node scripts/overlay-runtime-contract-test.js
          git diff --check
          npm ci
          npm run astro:check

      - name: Commit only permanent R5 core files
        if: steps.apply.outputs.changed == 'true'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            js/site-utils.js \
            js/site.js \
            src/components/article-pilots/_shared/ReaderSettings.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaMobileBar.astro \
            scripts/runtime-integrity-test.js
          test -z "$(git diff --cached --name-only | grep -E '(^|/)_temp-|^reports/|reader-r5-overlay-runtime-inventory\.json$' || true)"
          git diff --cached --quiet && { echo "No permanent changes to commit"; exit 0; }
          git commit -m "refactor(reader): add unified overlay runtime core"
          git push origin "HEAD:${HEAD_REF}"
