name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]

concurrency:
  group: shared-files-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Guard shared/system files (strict on main/PR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/guard-shared-files.js

      - name: Guard shared/system files (warn on lane branches)
        if: startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/heads/agent/')
        run: node scripts/guard-shared-files.js --warn
        continue-on-error: true

      - name: Report shared files touched
        if: always()
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Event: ${{ github.event_name }}"
          echo "Shared files guard completed"
