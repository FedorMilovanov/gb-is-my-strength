name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-source-links:
    if: github.head_ref == 'agent/_temp-dispatch-source-links-20260725'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch and resolve post-merge Source Link Audit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%s)"
          response_file="$RUNNER_TEMP/dispatch-response.txt"
          status="$({ curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/source-links.yml/dispatches" \
            --data '{"ref":"main"}'; } || true)"
          if [ "$status" != "204" ]; then
            cat "$response_file" >&2 || true
            echo "workflow dispatch failed with HTTP $status" >&2
            exit 1
          fi

          api="https://api.github.com/repos/$REPOSITORY/actions/workflows/source-links.yml/runs?event=workflow_dispatch&branch=main&per_page=10"
          for attempt in $(seq 1 20); do
            payload="$(curl --fail-with-body --silent --show-error \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            resolved="$(PAYLOAD="$payload" DISPATCHED_AT="$dispatched_at" node -e '
              const payload = JSON.parse(process.env.PAYLOAD);
              const threshold = Number(process.env.DISPATCHED_AT) - 5;
              const run = (payload.workflow_runs || []).find((candidate) =>
                candidate.head_branch === "main" &&
                candidate.head_sha === "6c005e49deb39c55ee7aa10bd89687bd82c65c1a" &&
                Math.floor(Date.parse(candidate.created_at) / 1000) >= threshold
              );
              if (!run) process.exit(2);
              console.log(`SOURCE_LINK_RUN_ID=${run.id}`);
              console.log(`SOURCE_LINK_RUN_STATUS=${run.status}`);
              console.log(`SOURCE_LINK_RUN_HEAD_SHA=${run.head_sha}`);
              console.log(`SOURCE_LINK_RUN_CREATED_AT=${run.created_at}`);
            ' 2>/dev/null || true)"
            if [ -n "$resolved" ]; then
              printf '%s\n' "$resolved"
              exit 0
            fi
            sleep 3
          done
          echo "post-merge run was not visible within polling window" >&2
          exit 1
