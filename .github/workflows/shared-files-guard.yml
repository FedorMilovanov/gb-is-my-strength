name: Shared Files Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main, "lane/**", "agent/**"]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.event_name == 'issue_comment' && 'shared-files-guard-command-156' || format('shared-files-guard-{0}', github.ref) }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  guard:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Asset revision drift (read-only)
        run: node scripts/cache-bust.js

      - name: Workflow policy contracts
        run: npm run workflows:check

      - name: Readiness-to-deploy workflow linkage
        run: node scripts/workflow-linkage-regression-test.js

      - name: Visual parity route-policy regressions
        run: node scripts/visual-parity-policy-regression-test.js

      - name: Runtime integrity regressions
        run: node scripts/runtime-integrity-test.js

      - name: Overlay runtime contracts
        run: |
          node --check js/site-utils.js
          node --check js/site.js
          node --check js/floating-cluster-controller.js
          node scripts/overlay-runtime-contract-test.js

      - name: Special overlay writer regressions
        run: npm run overlay:special:writers:test

      - name: Map engine P0 regressions
        run: |
          node --check karty/_engine/map-engine.js
          node scripts/map-engine-p0-regression-test.js

      - name: Map initial-state regressions
        run: node scripts/map-initial-state-regression-test.js

      - name: Map layers and palette regressions
        run: node scripts/map-layers-theme-regression-test.js

      - name: Reader preferences regressions
        run: node scripts/reader-preferences-regression-test.js

      - name: Highlights runtime regressions
        run: node scripts/highlights-runtime-regression-test.js

      - name: Nagornaya pastoral safety regressions
        run: node scripts/nagornaya-pastoral-safety-regression-test.js

      - name: Nagornaya source integrity regressions
        run: node scripts/nagornaya-source-integrity-regression-test.js

      - name: Nagornaya source registry regressions
        run: node scripts/nagornaya-source-registry-test.js

      - name: Nagornaya epistemic UI regressions
        run: node scripts/nagornaya-epistemic-ui-regression-test.js

      - name: Nagornaya PremiumControls ARIA regressions
        run: node scripts/nagornaya-premium-controls-aria-regression-test.js

      - name: Series reader façade regressions
        run: npm run series:facade:guard

      - name: Guard shared/system files (strict on main/PR)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: node scripts/guard-shared-files.js

      - name: Guard shared/system files (warn on lane branches)
        if: startsWith(github.ref, 'refs/heads/lane/') || startsWith(github.ref, 'refs/heads/agent/')
        run: node scripts/guard-shared-files.js --warn
        continue-on-error: true

      - name: Lint workflow YAML (actionlint)
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: |
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color

      - name: Report shared files touched
        if: always()
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "Branch: $REF_NAME"
          echo "Event: $EVENT_NAME"
          echo "Shared files guard completed"

  gill_wave4_finalize:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.number == 156 && github.event.comment.user.login == 'FedorMilovanov' && github.event.comment.body == '/run-gill-wave4'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Gill branch
        uses: actions/checkout@v4
        with:
          ref: agent/gill-source-marathon
          fetch-depth: 0

      - name: Verify one-time finalizer
        run: test -f scripts/gill-wave4-finalize.py

      - name: Mark finalizer start
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'pr=156\ncomment=%s\nsource_head=%s\n' '${{ github.event.comment.id }}' "$(git rev-parse HEAD)" > .gill-wave4-finalizer-started
          git add .gill-wave4-finalizer-started
          git commit -m 'chore(gill): mark wave4 finalizer start'
          git push origin HEAD:refs/heads/agent/gill-source-marathon

      - name: Apply native Gill monolith corrections
        run: python3 scripts/gill-wave4-finalize.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate native publication
        run: |
          node scripts/route-source-contract-audit.js --strict
          npm run astro:check
          npm run validate:static-publication

      - name: Commit verified Gill corpus
        run: |
          rm -f .gill-wave4-finalizer-started .gill-wave4-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'content(gill): finalize source-backed legacy corrections'
          git push origin HEAD:refs/heads/agent/gill-source-marathon
