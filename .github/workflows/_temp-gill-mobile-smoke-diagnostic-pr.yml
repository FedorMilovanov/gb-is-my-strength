name: TEMP PR Gill Mobile Smoke Diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'diagnostic/gill-mobile-play-smoke-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Gill mobile/play smoke with complete diagnostics
        id: smoke
        shell: bash
        run: |
          set +e
          npm run gill:mobile-play:smoke > /tmp/gill-mobile-play-smoke.log 2>&1
          status=$?
          set -e
          mkdir -p /tmp/gill-mobile-diagnostic
          cp /tmp/gill-mobile-play-smoke.log /tmp/gill-mobile-diagnostic/
          if [ -d reports/gill-v16-mobile-play-smoke-2026-06-28 ]; then
            cp -R reports/gill-v16-mobile-play-smoke-2026-06-28 /tmp/gill-mobile-diagnostic/report
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/gill-mobile-play-smoke.log

      - name: Upload Gill diagnostic bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gill-mobile-play-smoke-diagnostic
          path: /tmp/gill-mobile-diagnostic
          retention-days: 3

      - name: Preserve failing status
        if: steps.smoke.outputs.status != '0'
        run: exit 1
