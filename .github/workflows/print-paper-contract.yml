name: Print Paper Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'css/**'
      - 'js/**'
      - 'articles/**'
      - 'src/components/**'
      - 'scripts/engine-sweep.mjs'
      - 'scripts/print-paper-pdf-audit.py'
      - 'scripts/print-pagination-contract.mjs'
      - 'scripts/print-pagination-raster-audit.py'
      - 'scripts/print-reversible-card-contract.mjs'
      - '.github/workflows/print-paper-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-paper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a4-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Validate print proof sources
        run: |
          node --check scripts/print-pagination-contract.mjs
          node --check scripts/print-reversible-card-contract.mjs
          python3 -m py_compile scripts/print-paper-pdf-audit.py scripts/print-pagination-raster-audit.py
          node scripts/run-actionlint.mjs -no-color .github/workflows/print-paper-contract.yml
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - run: npm run strangler:build:production-like
      - name: Generate canonical reader PDF
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/print-paper/canonical
        run: node scripts/engine-sweep.mjs
      - name: Audit canonical pages, palette and pagination
        run: python3 scripts/print-paper-pdf-audit.py reports/print-paper/canonical/reader-print-a4.pdf --out reports/print-paper/canonical
      - name: Prove atomic and keep-with-next components across route families
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/print-paper/matrix
        run: node scripts/print-pagination-contract.mjs
      - name: Prove both reversible-card faces in physical PDFs
        env:
          GB_PRINT_REVERSIBLE_CARD_ARTIFACT_DIR: reports/print-paper/reversible-card
        run: node scripts/print-reversible-card-contract.mjs
      - name: Raster-audit every route PDF and build contact sheets
        run: python3 scripts/print-pagination-raster-audit.py reports/print-paper/matrix --out reports/print-paper/matrix-raster
      - name: Raster-audit reversible-card front and back PDFs
        run: python3 scripts/print-pagination-raster-audit.py reports/print-paper/reversible-card --out reports/print-paper/reversible-card-raster
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-paper-contract-${{ github.sha }}
          path: reports/print-paper
          if-no-files-found: error
          retention-days: 7
