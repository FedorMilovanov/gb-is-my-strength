name: Print Paper Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'css/**'
      - 'js/**'
      - 'articles/**'
      - 'src/components/**'
      - 'src/runtime/print-pagination-geometry.js'
      - 'scripts/check-print-geometry-contract.js'
      - 'scripts/engine-sweep.mjs'
      - 'scripts/print-paper-pdf-audit.py'
      - 'scripts/print-pagination-contract.mjs'
      - 'scripts/print-pagination-raster-audit.py'
      - 'scripts/print-reversible-card-contract.mjs'
      - '.github/workflows/print-paper-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: print-paper-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  a4-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci
      - name: Validate print geometry ownership
        run: node scripts/check-print-geometry-contract.js
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - run: npm run strangler:build:production-like
      - name: Generate canonical reader PDF
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/print-paper/canonical
        shell: bash
        run: |
          mkdir -p reports/print-paper/canonical
          set -o pipefail
          node scripts/engine-sweep.mjs 2>&1 | tee reports/print-paper/canonical/engine-sweep.log
      - name: Audit canonical pages, palette and pagination
        run: python3 scripts/print-paper-pdf-audit.py reports/print-paper/canonical/reader-print-a4.pdf --out reports/print-paper/canonical
      - name: Prove atomic and keep-with-next components across route families
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/print-paper/matrix
        run: node scripts/print-pagination-contract.mjs
      - name: Prove both physical reversible-card states
        env:
          GB_PRINT_REVERSIBLE_CARD_ARTIFACT_DIR: reports/print-paper/reversible-card
        run: node scripts/print-reversible-card-contract.mjs
      - name: Raster-audit every route PDF and build contact sheets
        run: |
          python3 scripts/print-pagination-raster-audit.py reports/print-paper/matrix --out reports/print-paper/matrix-raster
          python3 scripts/print-pagination-raster-audit.py reports/print-paper/reversible-card --out reports/print-paper/reversible-card-raster
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: print-paper-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/print-paper
          if-no-files-found: error
          retention-days: 7
