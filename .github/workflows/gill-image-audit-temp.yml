name: TEMP — Gill image premium audit

on:
  push:
    branches:
      - lane/gill-image-premium-audit-2026-07-09
    paths:
      - '.github/workflows/gill-image-audit-temp.yml'
      - 'scripts/gill-image-audit-temp.mjs'
      - 'src/**'
      - 'css/**'
      - 'images/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/gill-image-audit-temp.yml'
      - 'scripts/gill-image-audit-temp.mjs'
      - 'src/**'
      - 'css/**'
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-gill-image-premium-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose-static:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout lane
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static publication gates
        id: static
        continue-on-error: true
        run: |
          mkdir -p reports/gill-image-gate-logs
          set -o pipefail
          npm run validate:static-publication 2>&1 | tee reports/gill-image-gate-logs/validate-static-publication.log

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gill-image-static-gate-log
          path: reports/gill-image-gate-logs/
          retention-days: 7

      - name: Enforce static gate
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static.outcome }}
        run: |
          echo "static=$STATIC_OUTCOME"
          test "$STATIC_OUTCOME" = success
