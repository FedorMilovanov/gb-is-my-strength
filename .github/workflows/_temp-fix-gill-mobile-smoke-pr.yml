name: TEMP PR Fix Gill Mobile Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'fix/gill-mobile-smoke-intro-heading-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact smoke expectation patch
        run: python3 scripts/_temp-fix-gill-mobile-smoke-intro-heading.py

      - name: Validate script syntax
        run: node --check scripts/gill-v16-mobile-play-smoke.js

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete Gill mobile/play smoke
        run: npm run gill:mobile-play:smoke

      - name: Commit verified permanent test correction
        run: |
          git rm scripts/_temp-fix-gill-mobile-smoke-intro-heading.py
          git add scripts/gill-v16-mobile-play-smoke.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): align Gill intro smoke with canonical heading'
          git push origin HEAD:fix/gill-mobile-smoke-intro-heading-2026-07-21
