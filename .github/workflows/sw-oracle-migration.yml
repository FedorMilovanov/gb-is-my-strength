name: SW Oracle Migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sw-oracle-migration.yml"

permissions:
  contents: write

jobs:
  exact-oracle-migration:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Patch stale queryless SW oracles to exact revision authority
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          function replaceExactly(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            const count = source.split(before).length - 1;
            if (count !== 1) throw new Error(`${path}: expected exactly one replacement target, got ${count}`);
            fs.writeFileSync(path, source.replace(before, after));
          }

          replaceExactly(
            'scripts/reader-state-regression-test.js',
            `const auditSource = fs.readFileSync(path.join(ROOT, 'scripts/audit-pro.js'), 'utf8');\nconst swSource = fs.readFileSync(path.join(ROOT, 'sw.js'), 'utf8');`,
            `const auditSource = fs.readFileSync(path.join(ROOT, 'scripts/audit-pro.js'), 'utf8');\nconst assetVersionSource = fs.readFileSync(path.join(ROOT, 'src/lib/asset-version.js'), 'utf8');\nconst swSource = fs.readFileSync(path.join(ROOT, 'sw.js'), 'utf8');`,
          );
          replaceExactly(
            'scripts/reader-state-regression-test.js',
            `assert(/['"]\\/js\\/reader-state\\.js['"]/.test(swSource), 'ReaderState must be precached regardless of quote style');`,
            `const readerStateRevision = assetVersionSource.match(/'js\\/reader-state\\.js'\\s*:\\s*'([0-9a-f]{6,12})'/)?.[1];\nassert(readerStateRevision, 'ReaderState must have an authoritative ASSET_VERSIONS revision');\nconst readerStatePrecacheUrl = \`/js/reader-state.js?v=\${readerStateRevision}\`;\nassert(\n  swSource.includes(\`'\${readerStatePrecacheUrl}'\`) || swSource.includes(\`"\${readerStatePrecacheUrl}"\`),\n  'ReaderState must be precached at its exact authoritative revision',\n);\nassert(!/['"]\\/js\\/reader-state\\.js['"]/.test(swSource), 'ReaderState precache must not fall back to a queryless identity');`,
          );

          replaceExactly(
            'scripts/audit-pro.js',
            `  const listed = new Set([...m[1].matchAll(/['"]([^'"]+)['"]/g)].map(x => x[1]));`,
            `  const listed = new Set([...m[1].matchAll(/['"]([^'"]+)['"]/g)].map(x => x[1]));\n  const assetVersionText = read('src/lib/asset-version.js');\n  const assetVersions = new Map(\n    [...assetVersionText.matchAll(/^\\s*'([^']+)'\\s*:\\s*'([0-9a-f]{6,12})'\\s*,?\\s*$/gm)]\n      .map((match) => [match[1], match[2]]),\n  );`,
          );
          replaceExactly(
            'scripts/audit-pro.js',
            `  const required = CACHE_BUST_ASSETS.map(f => '/' + f).filter(f => !LAZY_NO_PRECACHE.has(f));\n  const missing = [];\n  for (const f of required) {\n    if (!listed.has(f)) missing.push(f);\n  }\n  if (missing.length) {\n    R.err(\`sw.js PRECACHE_ASSETS missing live files:\\n  - \${missing.join('\\n  - ')}\`);\n  } else {\n    R.ok(\`sw.js PRECACHE_ASSETS lists all required cache-busted live assets (lazy set excluded by design)\`);\n  }`,
            `  const governedRequired = CACHE_BUST_ASSETS\n    .map((asset) => String(asset).replace(/^\\/+/, ''))\n    .filter((asset) => !LAZY_NO_PRECACHE.has('/' + asset));\n  const missingAuthority = governedRequired.filter((asset) => !assetVersions.has(asset));\n  if (missingAuthority.length) {\n    R.err(\`ASSET_VERSIONS missing governed precache assets:\\n  - \${missingAuthority.join('\\n  - ')}\`);\n    return;\n  }\n  const required = governedRequired.map((asset) => \`/\${asset}?v=\${assetVersions.get(asset)}\`);\n  const missing = required.filter((assetUrl) => !listed.has(assetUrl));\n  const queryless = governedRequired\n    .map((asset) => '/' + asset)\n    .filter((assetUrl) => listed.has(assetUrl));\n  if (missing.length) {\n    R.err(\`sw.js PRECACHE_ASSETS missing exact authoritative revisions:\\n  - \${missing.join('\\n  - ')}\`);\n  } else if (queryless.length) {\n    R.err(\`sw.js PRECACHE_ASSETS contains queryless governed assets:\\n  - \${queryless.join('\\n  - ')}\`);\n  } else {\n    R.ok(\`sw.js PRECACHE_ASSETS lists exact authoritative revisions for all required cache-busted live assets (lazy set excluded by design)\`);\n  }`,
          );
          NODE

      - name: Prove strengthened oracles locally
        run: |
          node scripts/reader-state-regression-test.js
          node scripts/audit-pro.js

      - name: Remove migration carrier and verify exact mutation scope
        shell: bash
        run: |
          rm .github/workflows/sw-oracle-migration.yml
          printf '%s\n' \
            .github/workflows/sw-oracle-migration.yml \
            scripts/audit-pro.js \
            scripts/reader-state-regression-test.js | sort > /tmp/expected.txt
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --check

      - name: Commit exact oracle repair
        shell: bash
        run: |
          git config user.name "FedorMilovanov"
          git config user.email "258225528+FedorMilovanov@users.noreply.github.com"
          git add -A -- .github/workflows/sw-oracle-migration.yml scripts/audit-pro.js scripts/reader-state-regression-test.js
          git commit -m "test(sw): require exact revision authority in legacy oracles"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
