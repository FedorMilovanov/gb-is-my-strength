name: Temporary Reader R6 Page Root

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-reader-r6-page-root.yml"
      - "scripts/_temp_reader_r6_page-root.patch"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Apply exact page-root witness patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '8232013f15f397623911708506b96fc0f0d3e001936328768bdefbfac3220dad' \
            'scripts/_temp_reader_r6_page-root.patch' \
            | sha256sum -c -
          patch -p1 --batch --forward < scripts/_temp_reader_r6_page-root.patch
          rm scripts/_temp_reader_r6_page-root.patch
          node --check scripts/engine-sweep.mjs
          grep -F 'article[data-pagefind-body], main article, article' scripts/engine-sweep.mjs
          git diff --check

      - name: Commit permanent witness fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/engine-sweep.mjs scripts/_temp_reader_r6_page-root.patch
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] test(reader): align R6 page root with runtime"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
