name: Search P3 bounded closure transaction once

on:
  pull_request:
    types: [synchronize, labeled]

permissions:
  contents: read

concurrency:
  group: search-p3-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  search-p3-autofix:
    name: Search P3 bounded closure autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/search-truthful-continuation-20260808-r1'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Check finalizer syntax
        run: node --check scripts/search-p3-finalizer.mjs

      - name: Apply bounded Search P3 closure
        run: node scripts/search-p3-finalizer.mjs --write

      - name: Validate generated Search closure
        shell: bash
        run: |
          set -euo pipefail
          node --check js/search.js
          node --check scripts/search-modal-browser-contract.mjs
          node scripts/search-p3-finalizer.mjs
          node scripts/cache-bust.js
          node scripts/app-search-surface-source-contract.mjs
          npm run workflows:check
          git diff --check
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(js/search\.js|scripts/search-modal-browser-contract\.mjs|src/lib/asset-version\.js|404\.html|src/components/.+\.astro)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Search P3 generated paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Self-clean transport and commit exact tree
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/search-p3-finalize-once.yml
          rm scripts/search-p3-finalizer.mjs
          changed="$(git diff --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(js/search\.js|scripts/search-modal-browser-contract\.mjs|src/lib/asset-version\.js|404\.html|src/components/.+\.astro|\.github/workflows/search-p3-finalize-once\.yml|scripts/search-p3-finalizer\.mjs)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected final Search P3 paths:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- js/search.js scripts/search-modal-browser-contract.mjs src/lib/asset-version.js 404.html src/components .github/workflows/search-p3-finalize-once.yml scripts/search-p3-finalizer.mjs
          git diff --cached --check
          git commit -m "fix(search): close continuation races and guard coverage"
          git push origin "HEAD:${HEAD_REF}"
