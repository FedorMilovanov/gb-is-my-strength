name: Temporary Gill glossary residual projector

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - .github/workflows/tmp-gill-glossary-residuals-projector.yml

permissions:
  contents: write

concurrency:
  group: tmp-gill-glossary-residuals-projector
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require expected lane ancestry and temporary-only prestate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7dd0c2fda74cd52afebf0ca3e20c710f936a961f HEAD
          test "$(git diff --name-only 7dd0c2fda74cd52afebf0ca3e20c710f936a961f...HEAD)" = ".github/workflows/tmp-gill-glossary-residuals-projector.yml"

      - name: Apply bounded glossary data and runtime regression
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          glossary_path = Path('data/glossary.json')
          text = glossary_path.read_text(encoding='utf-8')

          bunhill_old = '''    "aliases": [
                "банхилл-филдс"
              ],'''
          bunhill_new = '''    "aliases": [
                "банхилл-филдс",
                "Bunhill Fields"
              ],'''
          key_at = text.index('  "банхилл-филдс": {')
          next_at = text.index('  "кеннингтон-коммон": {', key_at)
          bunhill = text[key_at:next_at]
          if bunhill.count(bunhill_old) != 1:
              raise SystemExit('unexpected Bunhill alias block; fail closed')
          bunhill = bunhill.replace(bunhill_old, bunhill_new, 1)
          text = text[:key_at] + bunhill + text[next_at:]

          if '  "хорслидаун": {' in text:
              raise SystemExit('Horsleydown entry already exists; fail closed for manual review')
          marker = '  "кеннингтон-коммон": {'
          horsleydown = '''  "хорслидаун": {
            "definition": "Исторический район Саутварка в южном Лондоне, связанный с пасторским служением Джона Гилла.",
            "detail": "Хорслидаун находился в Саутварке и в статье описан как рабочий район южного Лондона с причалами, ремёслами и складами. Эта характеристика помогает увидеть социальную географию служения Гилла, но сама по себе не позволяет без церковных книг точно выводить классовый состав всей общины.",
            "aliases": [
              "хорслидаун",
              "Horsleydown"
            ],
            "category": "История церкви",
            "categorySlug": "church-history"
          },
          '''
          if text.count(marker) != 1:
              raise SystemExit('unexpected Kennington marker count')
          text = text.replace(marker, horsleydown + marker, 1)
          glossary_path.write_text(text, encoding='utf-8')

          glossary = json.loads(text)
          assert glossary['банхилл-филдс']['aliases'].count('Bunhill Fields') == 1
          assert glossary['хорслидаун']['aliases'] == ['хорслидаун', 'Horsleydown']
          assert 'саутварк' not in glossary and 'Southwark' not in glossary

          audit_path = Path('scripts/interactive-audit.js')
          audit = audit_path.read_text(encoding='utf-8')
          needle = '      const target = terms.first();'
          if audit.count(needle) != 1:
              raise SystemExit(f'unexpected glossary target marker count: {audit.count(needle)}')
          addition = '''      if (!readinessError && url === '/articles/dzhon-gill-chast-1-chelovek/') {
                const residualState = await page.evaluate(() => {
                  const runtime = window.__gbGlossaryRuntime;
                  const nodes = Array.from(document.querySelectorAll('article .gterm'));
                  const label = (node) => Array.from(node.childNodes)
                    .filter((child) => child.nodeType === Node.TEXT_NODE)
                    .map((child) => child.textContent || '')
                    .join('')
                    .trim();
                  const termsByLabel = (value) => nodes
                    .filter((node) => label(node) === value)
                    .map((node) => node.getAttribute('data-term'));
                  return {
                    horsleydown: termsByLabel('Хорслидаун'),
                    bunhill: termsByLabel('Bunhill Fields'),
                    southwarkAlias: runtime?.aliasAll?.['саутварк'] || null,
                  };
                });
                if (
                  residualState.horsleydown.length !== 1 || residualState.horsleydown[0] !== 'хорслидаун' ||
                  residualState.bunhill.length !== 1 || residualState.bunhill[0] !== 'банхилл-филдс' ||
                  residualState.southwarkAlias !== null
                ) {
                  push('gill-part1-glossary-residuals', url, residualState);
                }
              }

          '''
          audit_path.write_text(audit.replace(needle, addition + needle, 1), encoding='utf-8')
          PY

      - name: Static validation
        run: |
          set -euo pipefail
          node --check scripts/interactive-audit.js
          node -e "JSON.parse(require('fs').readFileSync('data/glossary.json','utf8'))"
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' data/glossary.json scripts/interactive-audit.js | sort)"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Run canonical interactive runtime audit
        run: npm run interactive-audit

      - name: Remove temporary executor and enforce final-tree scope
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-gill-glossary-residuals-projector.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' .github/workflows/tmp-gill-glossary-residuals-projector.yml data/glossary.json scripts/interactive-audit.js | sort)"

      - name: Commit bounded repair and executor retirement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/tmp-gill-glossary-residuals-projector.yml data/glossary.json scripts/interactive-audit.js
          git commit -m "fix(gill): restore glossary residuals"
          git push origin HEAD:fix/gill-part1-glossary-residuals-20260808
