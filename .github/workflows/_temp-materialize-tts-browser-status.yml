name: Temporary TTS Browser Status Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-tts-browser-status.yml'
      - 'scripts/_temp-materialize-tts-browser-status.mjs'
      - 'js/floating-cluster-controller.js'
      - 'scripts/tts-engine-status-contract-test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-tts-browser-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'lane/tts-browser-status-visible-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout exact product lane
        uses: actions/checkout@v4
        with:
          ref: lane/tts-browser-status-visible-2026-07-25
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact TTS browser-status transaction
        run: |
          set -euo pipefail
          node scripts/_temp-materialize-tts-browser-status.mjs
          node scripts/cache-bust.js --write

      - name: Validate source contracts and revisions
        run: |
          set -euo pipefail
          node --check js/floating-cluster-controller.js
          node --check scripts/tts-engine-status-contract-test.js
          node scripts/tts-engine-status-contract-test.js
          node scripts/tts-download-consent-contract-test.js
          node scripts/cache-bust.js
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-tts-browser-status.yml
          git diff --check

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run TTS browser compatibility matrix
        run: |
          set -o pipefail
          mkdir -p reports/tts-browser-status-materializer
          {
            node scripts/tts-download-notice-browser-test.js
            node scripts/tts-engine-lifecycle-browser-test.js
            node scripts/tts-status-route-browser-test.js
          } 2>&1 | tee reports/tts-browser-status-materializer/browser-contracts.log

      - name: Publish product commit
        env:
          TARGET_BRANCH: lane/tts-browser-status-visible-2026-07-25
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Product tree already materialized; nothing to publish.'
            exit 0
          fi
          git commit -m 'fix(tts): keep system-voice status visible during warm-up'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload guarded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-browser-status-materializer-${{ github.run_id }}
          path: reports/tts-browser-status-materializer/
          if-no-files-found: warn
          retention-days: 14
