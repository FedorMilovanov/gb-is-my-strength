name: TEMP reader R1 browser test corrector

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  correct-browser-test:
    if: github.head_ref == 'lane/system-reader-preferences-r1-final-2026-07-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Correct localhost CSP diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/reader-preferences-browser-smoke.js')
          text = path.read_text(encoding='utf-8')
          marker = 'EXPECTED_LOCAL_CSP_ASSETS'
          if marker in text:
              print('browser diagnostic filter already present')
              raise SystemExit(0)

          anchor = "const results = [];\n"
          insertion = """const results = [];
          const PRODUCTION_ORIGIN = 'https://gospod-bog.ru';
          const EXPECTED_LOCAL_CSP_ASSETS = new Set([
            `${PRODUCTION_ORIGIN}/favicon.ico`,
            `${PRODUCTION_ORIGIN}/apple-touch-icon.png`,
            `${PRODUCTION_ORIGIN}/favicon-48.png`,
            `${PRODUCTION_ORIGIN}/favicon-120.png`,
            `${PRODUCTION_ORIGIN}/icons/icon-192.png`,
          ]);
          const IS_LOCAL_PROOF_ORIGIN = new URL(BASE).origin !== PRODUCTION_ORIGIN;

          function isExpectedLocalOriginCspNoise(message) {
            if (!IS_LOCAL_PROOF_ORIGIN || !message.includes('violates the following Content Security Policy directive')) return false;
            for (const asset of EXPECTED_LOCAL_CSP_ASSETS) {
              if (message.includes(`Loading the image '${asset}'`)) return true;
            }
            return false;
          }
          """
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one results anchor, found {text.count(anchor)}')
          text = text.replace(anchor, insertion, 1)

          old = "  page.on('console', (message) => { if (message.type() === 'error') errors.push(message.text()); });\n"
          new = """  page.on('console', (message) => {
            if (message.type() !== 'error') return;
            const text = message.text();
            if (!isExpectedLocalOriginCspNoise(text)) errors.push(text);
          });
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected one console listener, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify permanent reader contract
        run: node scripts/reader-preferences-regression-test.js
      - name: Commit correction
        shell: bash
        run: |
          git add scripts/reader-preferences-browser-smoke.js
          if git diff --cached --quiet; then
            echo 'no correction commit needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(reader): ignore exact localhost favicon CSP noise'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
