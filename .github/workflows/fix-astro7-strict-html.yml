name: Fix Astro 7 strict HTML findings

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-astro7-strict-html.yml

permissions:
  contents: write

concurrency:
  group: fix-astro7-strict-html
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'agent/astro7-phase1-validation-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Repair proven strict HTML findings
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const repairs = [
            {
              file: 'src/components/article-pilots/antisovetov/AntisovetovBody.astro',
              anchor: 'Никаких кадровых изменений не происходит, пострадавшие остаются виноватыми, через время ложь повторяется.</p>\n</div>\n<div class="note-box">\n<span style="display:inline-flex;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:12px;">Ложные наветы на верных пастырей</span>',
              replacement: 'Никаких кадровых изменений не происходит, пострадавшие остаются виноватыми, через время ложь повторяется.</p>\n<div class="note-box">\n<span style="display:inline-flex;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:12px;">Ложные наветы на верных пастырей</span>',
              label: 'unmatched closing div',
            },
            {
              file: 'src/components/article-pilots/serdce-iduh/SerdceIDuhBody.astro',
              anchor: '«Предузнал» — <em lang="el">προέγνω</em> (*проэгно́</em>) — здесь',
              replacement: '«Предузнал» — <em lang="el">προέγνω</em> (<em>проэгно́</em>) — здесь',
              label: 'unmatched closing em',
            },
            {
              file: 'src/components/nagornaya/seriya/NagornayaSeriyaBody.astro',
              anchor: '    <!-- BREADCRUMB + HERO -->\n    <section class="h-hero" data-pagefind-body aria-label="Серия статей">\n<main id="main-content">\n      <nav',
              replacement: '    <!-- BREADCRUMB + HERO -->\n    <main id="main-content">\n    <section class="h-hero" data-pagefind-body aria-label="Серия статей">\n      <nav',
              label: 'crossed main and hero section nesting',
            },
            {
              file: 'src/components/ui/floating-cluster/SingleArticleCluster.astro',
              anchor: '  {settings && (\n    <!-- ⚙ Настройки чтения (одиночная статья). Нейтральная кнопка: страница\n         сама привязывает её к своему листу настроек (ReaderSettings шлёт\n         событие \'hm:open-settings\'). НЕ связана с Gill-листом серий. -->\n    <button',
              replacement: '  <!-- ⚙ Настройки чтения (одиночная статья). Нейтральная кнопка: страница\n       сама привязывает её к своему листу настроек (ReaderSettings шлёт\n       событие \'hm:open-settings\'). НЕ связана с Gill-листом серий. -->\n  {settings && (\n    <button',
              label: 'HTML comment inside conditional expression',
            },
          ];

          for (const repair of repairs) {
            let source = fs.readFileSync(repair.file, 'utf8');
            const occurrences = source.split(repair.anchor).length - 1;
            if (occurrences !== 1) {
              throw new Error(`Expected one ${repair.label} anchor in ${repair.file}, found ${occurrences}`);
            }
            source = source.replace(repair.anchor, repair.replacement);
            fs.writeFileSync(repair.file, source);
          }

          const faqFile = 'src/components/article-pilots/kod-da-vinchi/KodDaVinchiSectionFaq.astro';
          let faq = fs.readFileSync(faqFile, 'utf8');
          const itemCount = (faq.match(/class="faq-accordion__item"/g) || []).length;
          const broken = '          <span aria-hidden="true" class="faq-accordion__icon">\n        </button>\n</span><div class="faq-accordion__body"';
          const fixed = '          <span aria-hidden="true" class="faq-accordion__icon"></span>\n        </button>\n<div class="faq-accordion__body"';
          const brokenCount = faq.split(broken).length - 1;
          if (itemCount < 1 || brokenCount !== itemCount) {
            throw new Error(`Expected one crossed icon span per FAQ item; items=${itemCount}, broken=${brokenCount}`);
          }
          faq = faq.replaceAll(broken, fixed);
          if (faq.includes(broken)) throw new Error('FAQ crossed icon span remains after repair');
          fs.writeFileSync(faqFile, faq);
          NODE

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Astro 7 migration and strict build
        shell: bash
        run: |
          set -euo pipefail
          npm run astro7:migration:guard
          npm run astro:build

      - name: Remove this one-shot workflow
        run: git rm -f .github/workflows/fix-astro7-strict-html.yml

      - name: Commit validated repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/article-pilots/antisovetov/AntisovetovBody.astro \
            src/components/article-pilots/serdce-iduh/SerdceIDuhBody.astro \
            src/components/nagornaya/seriya/NagornayaSeriyaBody.astro \
            src/components/ui/floating-cluster/SingleArticleCluster.astro \
            src/components/article-pilots/kod-da-vinchi/KodDaVinchiSectionFaq.astro
          git diff --cached --check
          git commit -m "fix(astro7): repair strict HTML structure"
          git push origin HEAD:agent/astro7-phase1-validation-20260731
