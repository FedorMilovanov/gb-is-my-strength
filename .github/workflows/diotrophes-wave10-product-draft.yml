name: Diotrophes Wave 10 Product Draft

on:
  pull_request:
    paths:
      - 'data/diotrophes-wave10-product-draft.json'
      - 'src/components/article-pilots/diotrophes/**'
      - 'scripts/diotrophes-wave10-contract.mjs'
      - 'research/WAVE10_DIOTROPHES_PRODUCT_DRAFT_2026-08-01.md'
      - '.github/workflows/diotrophes-wave10-product-draft.yml'

permissions:
  contents: read

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.4'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce bounded Wave 10 diff
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          base_sha='${{ github.event.pull_request.base.sha }}'
          if [[ -z "$base_sha" ]]; then
            echo 'Pull-request base SHA is unavailable.' >&2
            exit 1
          fi
          git cat-file -e "${base_sha}^{commit}" 2>/dev/null || git fetch --no-tags origin "$base_sha"
          git diff --name-only "${base_sha}...HEAD" > /tmp/wave10-files.txt

          # SYS-EDITORIAL-DATELINE-SLOT-SEMANTICS interop: the repo-wide
          # editorial lane annotates visible datelines with an explicit
          # data-editorial-slot attribute. That is a governance marker, not
          # Wave 10 content, so normalize it away before judging drift —
          # any remaining diff still activates the bounded gate below.
          draft_file='src/components/article-pilots/diotrophes/DiotrophesDraft.astro'
          if grep -q "^${draft_file}$" /tmp/wave10-files.txt && git cat-file -e "${base_sha}:${draft_file}" 2>/dev/null; then
            base_norm="$(git show "${base_sha}:${draft_file}" | sed -E 's/ data-editorial-slot="[^"]*"//g')"
            head_norm="$(sed -E 's/ data-editorial-slot="[^"]*"//g' "${draft_file}")"
            if [[ "$base_norm" == "$head_norm" ]]; then
              echo 'DiotrophesDraft.astro differs only by data-editorial-slot governance markers: content-neutral.'
              grep -v "^${draft_file}$" /tmp/wave10-files.txt > /tmp/wave10-files-normalized.txt || true
              mv /tmp/wave10-files-normalized.txt /tmp/wave10-files.txt
            fi
          fi

          wave10_owned_pattern='^(data/diotrophes-wave10-product-draft\.json|src/components/article-pilots/diotrophes/DiotrophesDraft\.astro|scripts/diotrophes-wave10-contract\.mjs|research/WAVE10_DIOTROPHES_PRODUCT_DRAFT_2026-08-01\.md|\.github/workflows/diotrophes-wave10-product-draft\.yml)$'
          wave10_exclusive_pattern='^(data/diotrophes-wave10-product-draft\.json|scripts/diotrophes-wave10-contract\.mjs|research/WAVE10_DIOTROPHES_PRODUCT_DRAFT_2026-08-01\.md|\.github/workflows/diotrophes-wave10-product-draft\.yml)$'
          wave12_owner_pattern='^scripts/diotrophes-wave12-browser-contract\.mjs$'

          # Scope the content-quality gate to actual Wave 10 content changes.
          # System-wide CI toolchain changes must still pass workflow policy,
          # exact-node toolchain and shared-file ownership validation.
          content_pattern='^(data/diotrophes-wave10-product-draft\.json|src/components/article-pilots/diotrophes/DiotrophesDraft\.astro|scripts/diotrophes-wave10-contract\.mjs|research/WAVE10_DIOTROPHES_PRODUCT_DRAFT_2026-08-01\.md)$'
          content_changed="$(grep -E "$content_pattern" /tmp/wave10-files.txt || true)"
          if [[ -z "$content_changed" ]]; then
            echo 'No Wave 10 content changed: content-specific validation is not applicable.'
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          owned="$(grep -E "$wave10_owned_pattern" /tmp/wave10-files.txt || true)"
          wave10_exclusive="$(grep -E "$wave10_exclusive_pattern" /tmp/wave10-files.txt || true)"
          wave12_owner="$(grep -E "$wave12_owner_pattern" /tmp/wave10-files.txt || true)"

          if [[ -n "$wave12_owner" && -z "$wave10_exclusive" ]]; then
            echo 'The shared DiotrophesDraft is owned by the Wave 12 publication lane in this PR; Wave 10 validation is a no-op.'
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$owned" ]]; then
            echo 'No Wave 10-owned files differ from the event base SHA; treating this path-filter synchronization event as a no-op.'
            echo 'active=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'active=true' >> "$GITHUB_OUTPUT"
          unexpected="$(grep -Ev "$wave10_owned_pattern" /tmp/wave10-files.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected Wave 10 files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Validate evidence and publication boundaries
        if: steps.scope.outputs.active == 'true'
        run: node scripts/diotrophes-wave10-contract.mjs

      - name: Type-check Astro draft
        if: steps.scope.outputs.active == 'true'
        run: npm run astro:check

      - name: Ensure validation is read-only
        if: steps.scope.outputs.active == 'true'
        run: git diff --exit-code
