name: Retire Superseded A03 Support Branches

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/a03-controller-forensic.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    if: github.head_ref == 'audit/a03-controller-ownership-20260801'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Verify exact dispositions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main \
            agent/mobile-webkit-a11y-20260801 \
            fix/diotrophes-wave11-bounded-diff-guard-20260801
          git fetch --no-tags origin \
            refs/pull/722/head:refs/remotes/origin/pr-722-head \
            refs/pull/728/head:refs/remotes/origin/pr-728-head
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          api = 'https://api.github.com/repos/' + repo

          def get(path):
              request = urllib.request.Request(api + path, headers={
                  'Authorization': 'Bearer ' + token,
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          expected = {
              'agent/mobile-webkit-a11y-20260801': 'f584730f1dd62d54242712607386f60301530daa',
              'fix/diotrophes-wave11-bounded-diff-guard-20260801': '95f4b4fa912468a474980293ea254c60ed02624c',
          }
          for branch, sha in expected.items():
              actual = git('rev-parse', 'origin/' + branch)
              if actual != sha:
                  raise SystemExit(f'{branch}: expected {sha}, got {actual}')
              opened = get('/pulls?state=open&head=' + urllib.parse.quote('FedorMilovanov:' + branch))
              if opened:
                  raise SystemExit(f'{branch}: still has open PR(s)')

          p721, p722, p726, p728 = (get(f'/pulls/{number}') for number in (721, 722, 726, 728))
          if not (p721['state'] == 'closed' and p721['merged_at'] is None and p721['head']['sha'] == expected['fix/diotrophes-wave11-bounded-diff-guard-20260801']):
              raise SystemExit('PR #721 disposition mismatch')
          if not (p722['state'] == 'closed' and p722['merged_at'] is None and p722['head']['sha'] == expected['agent/mobile-webkit-a11y-20260801']):
              raise SystemExit('PR #722 disposition mismatch')
          if not (p726['merged_at'] and p726['merge_commit_sha'] == '0ea8d5a27190a6c035235d2528f1c63d13951231'):
              raise SystemExit('PR #726 successor mismatch')
          if not (p728['merged_at'] and p728['head']['sha'] == '179b58b8a6fabfee77c9a15a3da767e33365ccd6'):
              raise SystemExit('PR #728 successor mismatch')

          predecessor_ref = git('rev-parse', 'origin/pr-722-head')
          successor_ref = git('rev-parse', 'origin/pr-728-head')
          if predecessor_ref != p722['head']['sha']:
              raise SystemExit(f'PR #722 immutable head mismatch: {predecessor_ref}')
          if successor_ref != p728['head']['sha']:
              raise SystemExit(f'PR #728 immutable head mismatch: {successor_ref}')
          body = p728.get('body') or ''
          required = [
              '#722 / `f584730f1dd62d54242712607386f60301530daa`',
              'Transferred:',
              '#722 and its diagnostic/passing artifacts',
              'SUPERSEDED_VERIFIED',
          ]
          missing = [token for token in required if token not in body]
          if missing:
              raise SystemExit('PR #728 successor record incomplete: ' + ', '.join(missing))
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', '0ea8d5a27190a6c035235d2528f1c63d13951231', 'origin/main'])
          subprocess.check_call(['git', 'merge-base', '--is-ancestor', '6d49d75ce0e8fef9c8929666c6fee7dcb1f05861', 'origin/main'])
          print('Exact PR-ref preservation and successor checks passed.')
          PY
      - name: Delete superseded and forensic refs
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete agent/mobile-webkit-a11y-20260801
          git push origin --delete fix/diotrophes-wave11-bounded-diff-guard-20260801
          git push origin --delete audit/a03-controller-ownership-20260801
