name: Temporary Search Manifest generatedAt Contract Patch

on:
  push:
    branches:
      - agent/search-manifest-generatedat-contract-2026-07-30

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact contract patch
        run: node scripts/_temp-patch-search-manifest-generatedat.cjs

      - name: Validate contract and static gate
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/search-manifest-policy-normalizer.js
          node --check scripts/search-manifest-policy-normalizer-test.js
          node scripts/search-manifest-policy-normalizer-test.js
          node scripts/check-data-consistency.js
          test ! -e scripts/_temp-patch-search-manifest-generatedat.cjs
          test ! -e .github/workflows/_temp-patch-search-manifest-generatedat.yml
          git diff --check

      - name: Commit permanent fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'fix(search): keep manifest generatedAt fresh'
          git push origin "HEAD:${GITHUB_REF_NAME}"
