name: Normalize canonical discovery surfaces

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-canonical-discovery-surfaces.yml'

permissions:
  contents: write

concurrency:
  group: normalize-canonical-discovery-surfaces
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Generate verify and push from latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            echo "Normalization attempt ${attempt}"
            git fetch origin main
            git reset --hard origin/main

            node scripts/rss-feed-normalizer.js --write
            node scripts/sitemap-policy-normalizer.js --write
            node scripts/rss-feed-normalizer.js --check
            node scripts/sitemap-policy-normalizer.js --check
            git diff --check

            git diff --name-only -- . \
              ':(exclude)feed.xml' \
              ':(exclude)sitemap.xml' > /tmp/unexpected-normalizer-paths
            if [[ -s /tmp/unexpected-normalizer-paths ]]; then
              echo 'Unexpected normalizer paths:' >&2
              cat /tmp/unexpected-normalizer-paths >&2
              exit 1
            fi

            if git diff --quiet -- feed.xml sitemap.xml; then
              echo 'Canonical discovery surfaces already normalized.'
              exit 0
            fi

            git add feed.xml sitemap.xml
            git commit -m 'fix(search): normalize canonical RSS and sitemap'
            if git push origin HEAD:main; then
              echo 'Canonical discovery surfaces committed to main.'
              exit 0
            fi
            echo 'Main advanced during normalization; retrying from the new head.' >&2
          done

          echo 'Could not push normalized discovery surfaces after four fresh-main attempts.' >&2
          exit 1
