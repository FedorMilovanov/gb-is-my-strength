name: Normalize canonical discovery surfaces

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/normalize-canonical-discovery-surfaces.yml'
      - 'data/route-search-policy.json'
      - 'data/search-manifest.json'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'scripts/rss-feed-normalizer.js'
      - 'scripts/sitemap-policy-normalizer.js'
      - 'scripts/diotrophes-wave12-canonical-discovery-contract.mjs'

permissions:
  contents: read

concurrency:
  group: normalize-canonical-discovery-surfaces-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  normalize:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check canonical discovery writers
        run: |
          node --check scripts/rss-feed-normalizer.js
          node --check scripts/sitemap-policy-normalizer.js
          node --check scripts/diotrophes-wave12-canonical-discovery-contract.mjs

      - name: Normalize canonical discovery surfaces
        run: |
          node scripts/rss-feed-normalizer.js --write
          node scripts/sitemap-policy-normalizer.js --write

      - name: Validate canonical discovery surfaces
        run: |
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/diotrophes-wave12-canonical-discovery-contract.mjs
          git diff --check

      - name: Commit canonical discovery transaction
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --name-only -- . \
            ':(exclude)feed.xml' \
            ':(exclude)sitemap.xml' > /tmp/unexpected-normalizer-paths
          if [[ -s /tmp/unexpected-normalizer-paths ]]; then
            echo 'Unexpected normalizer paths:' >&2
            cat /tmp/unexpected-normalizer-paths >&2
            exit 1
          fi
          if git diff --quiet -- feed.xml sitemap.xml; then
            echo 'Canonical discovery surfaces already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feed.xml sitemap.xml
          git commit -m 'fix(search): normalize canonical RSS and sitemap'
          git push origin "HEAD:${HEAD_REF}"
