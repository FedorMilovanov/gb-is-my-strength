name: Temporary Search Trigger Labels Safe Executor

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/tmp-search-trigger-labels-safe.yml'
      - 'data/workflow-permission-policy.json'
      - 'scripts/tmp_search_trigger_labels_safe_writer.py'

permissions:
  contents: read

concurrency:
  group: search-trigger-labels-p3-01-safe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    name: Materialize and verify bounded Search successor
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/search-trigger-labels-p3-01-safe-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact base and bounded transport
        env:
          EXPECTED_BASE: 76737eefe16a0feb2fdf729c805d17b5cdcdc376
          EXPECTED_BRANCH: agent/search-trigger-labels-p3-01-safe-20260806
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "$EXPECTED_BRANCH"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/tmp-search-trigger-labels-safe.yml',
              'data/workflow-permission-policy.json',
              'scripts/tmp_search_trigger_labels_safe_writer.py',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '76737eefe16a0feb2fdf729c805d17b5cdcdc376...HEAD'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unbounded initial transport diff: {sorted(changed)}')
          PY

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Materialize bounded Search fix
        run: |
          set -euo pipefail
          python3 scripts/tmp_search_trigger_labels_safe_writer.py --write
          rm .github/workflows/tmp-search-trigger-labels-safe.yml
          rm scripts/tmp_search_trigger_labels_safe_writer.py
          git checkout 76737eefe16a0feb2fdf729c805d17b5cdcdc376 -- data/workflow-permission-policy.json

      - name: Validate source and control plane
        run: |
          set -euo pipefail
          node --check js/search.js
          node --check scripts/app-search-surface-source-contract.mjs
          node --check scripts/app-search-surface-browser-contract.mjs
          node scripts/cache-bust.js
          node scripts/app-search-surface-source-contract.mjs
          npm run workflows:check
          npm run control-plane:audit
          npm run astro:check

      - name: Validate production-like Search evidence
        run: |
          set -euo pipefail
          npm run strangler:build:production-like
          npm run pagefind:build:dist
          npx playwright install --with-deps chromium webkit
          node scripts/search-modal-browser-contract.mjs --dist=dist --report=reports/search-modal-contract/core
          node scripts/app-search-surface-browser-contract.mjs --dist=dist --report=reports/search-modal-contract/app-surfaces

      - name: Validate final bounded diff
        env:
          EXPECTED_BASE: 76737eefe16a0feb2fdf729c805d17b5cdcdc376
        run: |
          set -euo pipefail
          rm -rf dist reports/search-modal-contract
          python3 - <<'PY'
          import subprocess
          base = '76737eefe16a0feb2fdf729c805d17b5cdcdc376'
          functional = {
              '.github/workflows/search-modal-contract.yml',
              'js/search.js',
              'scripts/app-search-surface-source-contract.mjs',
              'scripts/app-search-surface-browser-contract.mjs',
              'src/components/home/HomePageChrome.astro',
              'src/components/search/AppSearchSurface.astro',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', base],
              text=True,
          ).splitlines())
          if not functional.issubset(changed):
              raise SystemExit(f'missing functional paths: {sorted(functional - changed)}')
          forbidden = [
              path for path in changed
              if path.startswith('.github/workflows/tmp-')
              or path.startswith('scripts/tmp_')
              or path == '.github/workflows/glossary-contract.yml'
              or path == 'data/workflow-permission-policy.json'
          ]
          if forbidden:
              raise SystemExit(f'forbidden final paths: {sorted(forbidden)}')
          extras = changed - functional
          invalid_extras = [
              path for path in extras
              if not (
                  path.endswith('.html')
                  or path.endswith('.astro')
                  or path == 'src/lib/asset-version.js'
              )
          ]
          if invalid_extras:
              raise SystemExit(f'unexpected generated paths: {sorted(invalid_extras)}')
          print(
              f'bounded final diff: {len(changed)} paths '
              f'({len(functional)} functional, {len(extras)} generated projections)'
          )
          PY
          git diff --check

      - name: Commit verified successor head
        shell: bash
        env:
          EXPECTED_BASE: 76737eefe16a0feb2fdf729c805d17b5cdcdc376
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(search): unify platform-aware trigger labels"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${HEAD_REF}"
