name: Arena Release Quote Inset Fix

on:
  push:
    branches:
      - arena/019fd7ff-gb-is-my-strength

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[quote-inset-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019fd7ff-gb-is-my-strength
          fetch-depth: 0

      - name: Restore readable mobile quote safe fields
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/home/HomeSections/Quote.astro')
          s = p.read_text(encoding='utf-8')

          old = '''    body.home-page #main-content .h-quote-right {\n      order: 1;\n      padding: 0;\n      justify-content: flex-end;\n    }'''
          new = '''    body.home-page #main-content .h-quote-right {\n      order: 1;\n      padding-inline: clamp(24px, 6.5vw, 28px);\n      justify-content: flex-end;\n    }'''
          if old not in s:
              raise SystemExit('mobile quote-right block not found')
          s = s.replace(old, new, 1)

          old = '''    body.home-page #main-content .h-quote-left {\n      order: 2;\n      padding: 0;\n      text-align: left;\n    }'''
          new = '''    body.home-page #main-content .h-quote-left {\n      order: 2;\n      padding-inline: clamp(24px, 6.5vw, 28px);\n      text-align: left;\n    }'''
          if old not in s:
              raise SystemExit('mobile quote-left block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/home/HomeSections/Quote.astro
          git commit -m "fix(home): restore mobile quote safe fields [quote-inset-finalized]"
          git push origin HEAD:arena/019fd7ff-gb-is-my-strength
