name: Normalize links graph read times

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-links-graph-read-times.yml'

permissions:
  contents: write

concurrency:
  group: normalize-links-graph-read-times
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Generate deterministic links graph read times
        run: node scripts/links-graph-read-time-normalizer.js --write

      - name: Validate generated graph and focused diff
        shell: bash
        run: |
          set -euo pipefail
          node scripts/links-graph-read-time-normalizer.js --check
          node scripts/check-data-consistency.js
          git diff --check
          git diff --name-only -- . ':(exclude)data/links-graph.json' > /tmp/unexpected-links-graph-paths
          if [[ -s /tmp/unexpected-links-graph-paths ]]; then
            echo 'Unexpected generated paths:' >&2
            cat /tmp/unexpected-links-graph-paths >&2
            exit 1
          fi

      - name: Commit exact generated graph
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/links-graph.json; then
            echo 'Links graph already normalized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/links-graph.json
          git commit -m 'fix(data): synchronize links graph read times'
          git push origin HEAD:main
