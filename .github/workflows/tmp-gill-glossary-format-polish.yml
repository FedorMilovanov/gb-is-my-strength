name: Temporary Gill glossary format polish

on:
  pull_request:
    types: [synchronize]
    branches:
      - main
    paths:
      - .github/workflows/tmp-gill-glossary-format-polish.yml

permissions:
  contents: write

concurrency:
  group: tmp-gill-glossary-format-polish
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact bounded prestate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 7ff952c113872b30fa511b805804e5fe1f74ce4d HEAD
          expected="$(printf '%s\n' .github/workflows/tmp-gill-glossary-format-polish.yml data/glossary.json scripts/interactive-audit.js | sort)"
          actual="$(git diff --name-only 7ff952c113872b30fa511b805804e5fe1f74ce4d...HEAD | sort)"
          test "$actual" = "$expected"

      - name: Polish formatting only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          glossary_path = Path('data/glossary.json')
          glossary = glossary_path.read_text(encoding='utf-8')
          old_glossary = '''  "хорслидаун": {
          "definition": "Исторический район Саутварка в южном Лондоне, связанный с пасторским служением Джона Гилла.",
          "detail": "Хорслидаун находился в Саутварке и в статье описан как рабочий район южного Лондона с причалами, ремёслами и складами. Эта характеристика помогает увидеть социальную географию служения Гилла, но сама по себе не позволяет без церковных книг точно выводить классовый состав всей общины.",
          "aliases": [
            "хорслидаун",
            "Horsleydown"
          ],
          "category": "История церкви",
          "categorySlug": "church-history"
        },'''
          new_glossary = '''  "хорслидаун": {
            "definition": "Исторический район Саутварка в южном Лондоне, связанный с пасторским служением Джона Гилла.",
            "detail": "Хорслидаун находился в Саутварке и в статье описан как рабочий район южного Лондона с причалами, ремёслами и складами. Эта характеристика помогает увидеть социальную географию служения Гилла, но сама по себе не позволяет без церковных книг точно выводить классовый состав всей общины.",
            "aliases": [
              "хорслидаун",
              "Horsleydown"
            ],
            "category": "История церкви",
            "categorySlug": "church-history"
          },'''
          if glossary.count(old_glossary) != 1:
              raise SystemExit('unexpected Horsleydown formatting prestate')
          glossary_path.write_text(glossary.replace(old_glossary, new_glossary, 1), encoding='utf-8')

          audit_path = Path('scripts/interactive-audit.js')
          audit = audit_path.read_text(encoding='utf-8')
          start = audit.index("      if (!readinessError && url === '/articles/dzhon-gill-chast-1-chelovek/') {")
          end = audit.index('      const target = terms.first();', start)
          block = audit[start:end]
          lines = block.splitlines()
          fixed = []
          depth = 0
          for i, line in enumerate(lines):
              if i == 0:
                  fixed.append(line)
                  continue
              stripped = line.lstrip()
              if not stripped:
                  fixed.append('')
                  continue
              fixed.append('        ' + stripped if stripped.startswith('const residualState =') else line)
          # Use the exact approved block with repository-consistent indentation.
          replacement = '''      if (!readinessError && url === '/articles/dzhon-gill-chast-1-chelovek/') {
        const residualState = await page.evaluate(() => {
          const runtime = window.__gbGlossaryRuntime;
          const nodes = Array.from(document.querySelectorAll('article .gterm'));
          const label = (node) => Array.from(node.childNodes)
            .filter((child) => child.nodeType === Node.TEXT_NODE)
            .map((child) => child.textContent || '')
            .join('')
            .trim();
          const termsByLabel = (value) => nodes
            .filter((node) => label(node) === value)
            .map((node) => node.getAttribute('data-term'));
          const horsleydown = termsByLabel('Хорслидаун');
          const bunhill = termsByLabel('Bunhill Fields');
          const southwarkAlias = runtime?.aliasAll?.['саутварк'] ?? null;
          const ok = (
            horsleydown.length === 2 && horsleydown.every((term) => term === 'хорслидаун') &&
            bunhill.length === 1 && bunhill[0] === 'банхилл-филдс' &&
            southwarkAlias === null
          );
          return {
            ok,
            horsleydown,
            bunhill,
            southwarkAlias,
            horsleydownCodes: horsleydown.map((term) => Array.from(term || '').map((char) => char.codePointAt(0))),
            bunhillCodes: bunhill.map((term) => Array.from(term || '').map((char) => char.codePointAt(0))),
          };
        });
        if (!residualState.ok) {
          push('gill-part1-glossary-residuals', url, residualState);
        }
      }

'''
          audit_path.write_text(audit[:start] + replacement + audit[end:], encoding='utf-8')
          PY

      - name: Prove semantics and final scope
        run: |
          set -euo pipefail
          node --check scripts/interactive-audit.js
          node -e "JSON.parse(require('fs').readFileSync('data/glossary.json','utf8'))"
          git diff --check
          rm .github/workflows/tmp-gill-glossary-format-polish.yml
          expected="$(printf '%s\n' .github/workflows/tmp-gill-glossary-format-polish.yml data/glossary.json scripts/interactive-audit.js | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"

      - name: Commit polish and retire executor
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/tmp-gill-glossary-format-polish.yml data/glossary.json scripts/interactive-audit.js
          git commit -m "style(gill): polish glossary residual patch"
          git push origin HEAD:fix/gill-part1-glossary-residuals-20260808
