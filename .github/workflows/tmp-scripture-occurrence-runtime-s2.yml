name: Complete Scripture occurrence runtime S2

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: scripture-occurrence-runtime-s2-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/scripture-occurrence-runtime-s2-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact S2 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 20
      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Execute exact self-clean S2 transaction
        shell: bash
        run: bash .github/tmp/run_scripture_occurrence_runtime_s2.sh
