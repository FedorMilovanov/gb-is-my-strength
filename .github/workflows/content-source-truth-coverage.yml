name: Content Source Truth Coverage

on:
  pull_request:
    paths:
      - 'scripts/content-coverage-audit.js'
      - 'scripts/lib/route-source-contract.js'
      - 'data/route-profiles/**'
      - 'migration/page-ownership.json'
      - '.github/workflows/content-source-truth-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/content-coverage-audit.js'
      - 'scripts/lib/route-source-contract.js'
      - 'data/route-profiles/**'
      - 'migration/page-ownership.json'
      - '.github/workflows/content-source-truth-coverage.yml'

permissions:
  contents: read

concurrency:
  group: content-source-truth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-like-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Audit authoritative content coverage
        run: node scripts/content-coverage-audit.js

      - name: Ensure validation is read-only
        run: git diff --exit-code
