name: Temporary Cache-Bust Fail-Closed Policy

on:
  pull_request:
    paths:
      - ".github/workflows/_tmp-cache-bust-fail-closed-policy.yml"
      - "scripts/_tmp-wire-cache-bust-policy.js"
      - "scripts/lib/cache-bust-workflow-policy.js"

permissions:
  contents: write

concurrency:
  group: tmp-cache-bust-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/cache-bust-fail-closed-policy
          fetch-depth: 0

      - name: Detect patch payload
        id: patch
        shell: bash
        run: |
          if test -f scripts/_tmp-wire-cache-bust-policy.js; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Cache-bust policy is already materialized."
          fi

      - name: Set up Node 22.12
        if: steps.patch.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Wire permanent policy into workflows checker
        if: steps.patch.outputs.present == 'true'
        run: node scripts/_tmp-wire-cache-bust-policy.js

      - name: Verify syntax and permanent policy mutations
        if: steps.patch.outputs.present == 'true'
        run: |
          node --check scripts/lib/cache-bust-workflow-policy.js
          node --check scripts/check-workflows.js
          node scripts/check-workflows.js

      - name: Verify current source revisions are read-only clean
        if: steps.patch.outputs.present == 'true'
        run: |
          node scripts/cache-bust.js
          git diff --exit-code

      - name: Prove stale asset mutation fails without rewriting
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp js/search.js /tmp/search.js.baseline
          printf '\n/* adversarial cache-bust drift */\n' >> js/search.js
          set +e
          node scripts/cache-bust.js > /tmp/cache-bust-mutation.log 2>&1
          status=$?
          set -e
          cat /tmp/cache-bust-mutation.log
          test "$status" -ne 0
          grep -q 'Stale files:' /tmp/cache-bust-mutation.log
          cmp -s js/search.js <(cat /tmp/search.js.baseline; printf '\n/* adversarial cache-bust drift */\n')
          mv /tmp/search.js.baseline js/search.js
          git diff --exit-code -- js/search.js

      - name: Verify clean permanent scope
        if: steps.patch.outputs.present == 'true'
        run: |
          test ! -e scripts/_tmp-wire-cache-bust-policy.js
          git diff --check
          git status --short

      - name: Commit permanent policy
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ci): enforce fail-closed asset revisions"
          git push origin HEAD:agent/cache-bust-fail-closed-policy
