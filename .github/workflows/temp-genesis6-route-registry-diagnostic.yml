name: Temporary Genesis 6 route-registry diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-genesis6-route-registry-diagnostic.yml'

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.ref == 'agent/genesis6-phaseC-materializer-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ARTIFACT_ID: '8664652859'
      ARTIFACT_SHA256: b1f34cf4c113bf9f5f46a558011bc865a687e084e619e02abfa09d187f72ff6e
    steps:
      - name: Inspect exact registry failure artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/registry-diag
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            --output /tmp/registry-diag/artifact.zip
          test "$(sha256sum /tmp/registry-diag/artifact.zip | cut -d' ' -f1)" = "$ARTIFACT_SHA256"
          unzip -q /tmp/registry-diag/artifact.zip -d /tmp/registry-diag/files
          LOG="$(find /tmp/registry-diag/files -type f -name public-surface-registry.log -print -quit)"
          test -n "$LOG"
          echo '=== FAILURE SIGNALS ==='
          grep -E -i 'error|fail|mismatch|expected|drift|missing|invalid|stale|out.of.date|must|not found' "$LOG" | tail -n 100 || true
          echo '=== LOG TAIL ==='
          tail -n 120 "$LOG"
