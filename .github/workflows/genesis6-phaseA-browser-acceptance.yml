name: Temporary Genesis 6 Phase A browser acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/genesis6-phaseA-browser-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: genesis6-phaseA-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  browser-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RELEASE_SHA: c8b9cd771a62a75ffda6a3e5f34bcc11cdc692a7
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Verify exact product identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git diff --name-only "$RELEASE_SHA^" "$RELEASE_SHA" | wc -l)" -eq 21
          unexpected=$(git diff --name-only "$RELEASE_SHA^" "$RELEASE_SHA" \
            | grep -Ev '^public/images/articles/genesis6/' || true)
          test -z "$unexpected"

      - name: Install dependencies and browsers
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Build exact production-like dist
        run: npm run strangler:build:production-like

      - name: Chromium and WebKit media acceptance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/genesis6-browser
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist \
            > reports/genesis6-browser/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/images/articles/genesis6/manifest.json >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/images/articles/genesis6/manifest.json >/dev/null
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium, webkit } from 'playwright';

          const releaseSha = process.env.RELEASE_SHA;
          const root = path.resolve('dist/images/articles/genesis6');
          const manifestPath = path.join(root, 'manifest.json');
          const manifestBytes = fs.readFileSync(manifestPath);
          const manifest = JSON.parse(manifestBytes.toString('utf8'));
          const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');

          if (manifest.assets?.length !== 10) {
            throw new Error(`Expected 10 manifest assets, got ${manifest.assets?.length}`);
          }

          const images = [];
          for (const asset of manifest.assets) {
            for (const format of ['avif', 'webp']) {
              const variant = asset.variants?.[format];
              if (!variant) throw new Error(`Missing ${format} variant for ${asset.id}`);
              const file = path.join(root, variant.file);
              const bytes = fs.readFileSync(file);
              if (bytes.length !== variant.bytes) throw new Error(`Byte mismatch: ${variant.file}`);
              if (sha256(bytes) !== variant.sha256) throw new Error(`SHA-256 mismatch: ${variant.file}`);
              if (variant.width !== 1200 || variant.height !== 675) {
                throw new Error(`Manifest dimension mismatch: ${variant.file}`);
              }
              images.push({ id: asset.id, format, file: variant.file, alt: asset.alt });
            }
          }
          if (images.length !== 20) throw new Error(`Expected 20 images, got ${images.length}`);

          const evidence = {
            schemaVersion: 1,
            releaseSha,
            manifestSha256: sha256(manifestBytes),
            manifestAssets: manifest.assets.length,
            images: images.length,
            browsers: {},
          };

          for (const [browserName, browserType] of [['chromium', chromium], ['webkit', webkit]]) {
            const browser = await browserType.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
            const consoleErrors = [];
            const pageErrors = [];
            const requestFailures = [];
            page.on('console', (message) => {
              if (message.type() === 'error') consoleErrors.push(message.text());
            });
            page.on('pageerror', (error) => pageErrors.push(String(error)));
            page.on('requestfailed', (request) => requestFailures.push({
              url: request.url(),
              error: request.failure()?.errorText ?? 'unknown',
            }));

            const figures = images.map((image) => `
              <figure>
                <img src="images/articles/genesis6/${image.file}" alt="${image.alt.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}">
                <figcaption>${image.id} · ${image.format}</figcaption>
              </figure>`).join('');
            await page.setContent(`<!doctype html>
              <html lang="ru"><head>
                <meta charset="utf-8">
                <base href="http://127.0.0.1:4173/">
                <style>
                  body{margin:0;background:#111;color:#eee;font:14px system-ui}
                  main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:16px}
                  figure{margin:0;background:#222;padding:10px;border-radius:8px}
                  img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover}
                  figcaption{padding-top:8px}
                </style></head><body><main>${figures}</main></body></html>`,
              { waitUntil: 'domcontentloaded' });
            await page.waitForFunction(() => [...document.images].every((image) => image.complete), null, { timeout: 60000 });
            const rows = await page.evaluate(() => [...document.images].map((image) => ({
              src: image.currentSrc || image.src,
              complete: image.complete,
              naturalWidth: image.naturalWidth,
              naturalHeight: image.naturalHeight,
            })));
            const invalid = rows.filter((row) => !row.complete || row.naturalWidth !== 1200 || row.naturalHeight !== 675);
            await page.screenshot({ path: `reports/genesis6-browser/${browserName}-contact-sheet.png`, fullPage: true });
            evidence.browsers[browserName] = {
              version: browser.version(),
              decoded: rows.length,
              invalid,
              consoleErrors,
              pageErrors,
              requestFailures,
            };
            await browser.close();
            if (invalid.length || consoleErrors.length || pageErrors.length || requestFailures.length) {
              throw new Error(`${browserName} acceptance failed: ${JSON.stringify(evidence.browsers[browserName])}`);
            }
          }

          fs.writeFileSync(
            'reports/genesis6-browser/evidence.json',
            `${JSON.stringify(evidence, null, 2)}\n`,
          );
          NODE

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis6-phaseA-browser-${{ github.run_id }}
          path: reports/genesis6-browser
          if-no-files-found: error
          retention-days: 14
