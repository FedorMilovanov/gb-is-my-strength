name: Atlas Story Mobile Camera Autofix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/atlas-story-mobile-camera-autofix.yml'
      - 'scripts/atlas-story-mobile-camera-autofix.py'
      - 'karty/_engine/map-engine.js'
      - 'karty/avraam/route.json'

concurrency:
  group: atlas-story-mobile-camera-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Fail-closed approval decision
        id: gate
        shell: bash
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'autofix-approved') }}
          SYSTEM_LANE: ${{ contains(github.event.pull_request.labels.*.name, 'system') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED" != "true" || "$SYSTEM_LANE" != "true" ]]; then
            echo '::error::Autofix requires both autofix-approved and system labels.'
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo '::error::Autofix is restricted to same-repository pull requests.'
            exit 1
          fi
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  write:
    needs: decision
    if: needs.decision.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Materialize story camera and zoom-floor fix
        run: python3 scripts/atlas-story-mobile-camera-autofix.py

      - name: Validate bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          python3 - <<'PY'
          import json
          route=json.load(open('karty/avraam/route.json', encoding='utf-8'))
          assert route['meta']['mobile_story_min_widths']=={'lot':300,'akeda':170}
          assert route['meta']['mobile_story_viewports']['lekh-lekha']==[1167,520,1140]
          assert route['meta']['mobile_story_viewports']['lot']==[648,838,300]
          assert route['meta']['mobile_story_viewports']['akeda']==[590,850,170]
          war=next(story for story in route['stories'] if story['id']=='war')
          assert war['viewport']==[690,693,620]
          assert route['stages'][4]['paths'][1]['d']=='M752,556 C770,628 748,702 704,748 C672,780 644,794 623,800'
          PY
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'karty/_engine/map-engine.js\nkarty/avraam/route.json'
          [[ "$changed" == "$expected" ]]
          [[ "$(grep -Fc 'function activeMinViewWidth(){' karty/_engine/map-engine.js)" == '1' ]]
          [[ "$(grep -Fc 'activeMinViewWidth()' karty/_engine/map-engine.js)" == '7' ]]

      - name: Commit bounded autofix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Exact story camera state already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/_engine/map-engine.js karty/avraam/route.json
          git commit -m 'fix(atlas): frame mobile stories by narrative mass'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
