name: TEMP Universal Print Pagination Inventory

on:
  push:
    branches:
      - fix/universal-print-pagination-marathon-2026-07-25
  pull_request:
    branches:
      - main
    paths:
      - 'css/**'
      - 'js/**'
      - 'scripts/_temp-print-pagination-inventory.mjs'
      - '.github/workflows/_temp-print-pagination-inventory.yml'
      - 'src/components/reader-platform/**'

permissions:
  contents: read

concurrency:
  group: temp-universal-print-pagination-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run strangler:build:production-like
      - name: Inventory print components and suspect ancestry
        run: node scripts/_temp-print-pagination-inventory.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-print-pagination-inventory-${{ github.sha }}
          path: reports/print-pagination-inventory
          if-no-files-found: error
          retention-days: 7
