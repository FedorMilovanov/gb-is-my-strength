name: Temp retired legacy audits proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-retired-legacy-audits-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    if: github.event.pull_request.number == 159
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prove deleted implementations have no references
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            check-route-profiles-legacy.js \
            check-route-migration-matrix-legacy.js \
            check-content-source-coverage-legacy.js \
            docs/refactor-2026/lanes/search-legacy-lazy-init-2026-07-04.md
          do
            if git grep -n -F "$name" -- ':!docs/archive/**'; then
              echo "Unexpected active reference: $name" >&2
              exit 1
            fi
          done

      - name: Run canonical replacement contracts
        shell: bash
        run: |
          mkdir -p reports/legacy-retirement-proof
          set -o pipefail
          {
            node scripts/check-workflows.js
            node scripts/sync-route-migration-matrix.js --check
            node -r ./scripts/install-effective-route-registry.js scripts/route-profile-contract-audit.js --strict
            node -r ./scripts/install-effective-route-registry.js scripts/route-migration-matrix-contract-audit.js --strict
            node -r ./scripts/install-effective-route-registry.js scripts/content-source-provenance-audit.js --strict
            node scripts/check-route-profiles.js --strict
            node scripts/check-route-migration-matrix.js --strict
            node scripts/check-content-source-coverage.js --strict
            npm run surface:registry:check
            npm run surface:registry:test
          } 2>&1 | tee reports/legacy-retirement-proof/contracts.log

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Verify clean tracked source
        run: git diff --exit-code

      - name: Upload retirement proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retired-legacy-audits-proof-${{ github.run_id }}
          path: reports/legacy-retirement-proof/**
          if-no-files-found: error
          retention-days: 7
