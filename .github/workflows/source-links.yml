name: Source Link Audit

on:
  workflow_dispatch:
  schedule:
    # Weekly + governed owners.
    - cron: '0 3 * * 1'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/source-links.yml'
      - 'scripts/source-link-audit.js'
      - 'scripts/source-link-audit-contract-test.cjs'
      - 'scripts/source-link-audit-source-contract-test.cjs'
      - 'scripts/source-link-audit-main-trigger-contract.cjs'
      - 'src/components/article-pilots/antisovetov/AntisovetovBody.astro'
      - 'src/components/article-pilots/diotrophes/DiotrophesDraft.astro'
      - 'data/diotrophes-wave11-faithful-witness-sources.json'
  pull_request:
    paths:
      - '.github/workflows/source-links.yml'
      - 'scripts/source-link-audit.js'
      - 'scripts/source-link-audit-contract-test.cjs'
      - 'scripts/source-link-audit-source-contract-test.cjs'
      - 'scripts/source-link-audit-main-trigger-contract.cjs'

permissions:
  contents: read

concurrency:
  group: source-links-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Check source-link auditor syntax
        run: |
          node --check scripts/source-link-audit.js
          node --check scripts/source-link-audit-contract-test.cjs
          node --check scripts/source-link-audit-source-contract-test.cjs
          node --check scripts/source-link-audit-main-trigger-contract.cjs
      - name: Prove redirect-chain, evidence redaction and workflow policy
        run: |
          node scripts/source-link-audit-contract-test.cjs
          node scripts/source-link-audit-source-contract-test.cjs
          node scripts/source-link-audit-main-trigger-contract.cjs

  source-links:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Install dependencies
        run: npm ci
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Source link audit (production-like dist)
        run: |
          mkdir -p reports/source-links
          node scripts/source-link-audit.js --root dist --json-out reports/source-links/report.json
      - name: Upload source-link chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-link-chain-${{ github.run_id }}
          path: reports/source-links/**
          if-no-files-found: error
          retention-days: 30
