name: Antisovetov Semantic Closeout Transaction

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: antisovetov-semantic-closeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event.pull_request.head.ref == 'fix/astro7-antisovetov-semantic-closeout-20260731' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MAIN: 7c92ebd46499af59a4da268c0d27ae7be3f2c1fb
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Set up exact Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Restore, validate and commit only the semantic source repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main "$HEAD_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/$HEAD_BRANCH)" = "$EXPECTED_HEAD"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/article-pilots/antisovetov/AntisovetovBody.astro')
          source = path.read_text(encoding='utf-8')
          before = '''<p class="mb-6">Безопасное извинение звучит общо: «если кого-то ранил», «мы все несовершенны». В нём нет имени конкретного греха и пострадавших душ. Это не покаяние — это мягкая смена освещения на сцене. Если обвинения слишком доказаны — стань «мучеником»: «На служителей всегда идут атаки дьявола». Ответственность превращается в гонение, а проверка фактов — в нападение на дело Божье. Настоящая сломленность не просит сохранить трон. Лживый пастор не приходит к покаянию о систематическом искажении фактов перед общиной. Он выходит на кафедру, пускает слезу и произносит: «Братья, я признаю, что вкралась досадная неточность в коммуникации из-за моей усталости. Прошу прощения, если это кого-то смутило». Зал аплодирует его смирению. Никаких кадровых изменений не происходит, пострадавшие остаются виноватыми, через время ложь повторяется.</p>
<div class="note-box">
<span style="display:inline-flex;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:12px;">Ложные наветы на верных пастырей</span>'''
          after = '''<p class="mb-6">Безопасное извинение звучит общо: «если кого-то ранил», «мы все несовершенны». В нём нет имени конкретного греха и пострадавших душ. Это не покаяние — это мягкая смена освещения на сцене. Если обвинения слишком доказаны — стань «мучеником»: «На служителей всегда идут атаки дьявола». Ответственность превращается в гонение, а проверка фактов — в нападение на дело Божье. Настоящая сломленность не просит сохранить трон.</p>
<div class="note-box">
<div class="anti-kicker" style="margin-bottom:12px">Как это выглядит на практике</div>
<p><strong>Ритуальное извинение:</strong> Пастора ловят на систематическом искажении фактов перед общиной. Он выходит на кафедру, пускает слезу и произносит: «Братья, я признаю, что вкралась досадная неточность в коммуникации из-за моей усталости. Прошу прощения, если это кого-то смутило». Зал аплодирует его смирению. Никаких кадровых изменений не происходит, пострадавшие остаются виноватыми, через время ложь повторяется.</p>
</div>
<div class="note-box">
<span style="display:inline-flex;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--muted);font-weight:700;margin-bottom:12px;">Ложные наветы на верных пастырей</span>'''
          if source.count(before) != 1:
              raise SystemExit(f'expected one collapsed semantic witness, found {source.count(before)}')
          repaired = source.replace(before, after, 1)
          for marker in (
              '<div class="anti-kicker" style="margin-bottom:12px">Как это выглядит на практике</div>',
              '<p><strong>Ритуальное извинение:</strong> Пастора ловят на систематическом искажении фактов перед общиной.',
              'Настоящая сломленность не просит сохранить трон.</p>',
          ):
              if repaired.count(marker) != 1:
                  raise SystemExit(f'invalid restored marker count: {marker}')
          if 'Настоящая сломленность не просит сохранить трон. Лживый пастор' in repaired:
              raise SystemExit('collapsed paragraph remains')
          path.write_text(repaired, encoding='utf-8', newline='\n')
          PY

          test "$(git diff --name-only)" = 'src/components/article-pilots/antisovetov/AntisovetovBody.astro'
          git diff --check
          npm ci --no-audit --no-fund
          npm run astro:7:satteri:contract
          npm run astro:check
          npm run astro:build
          npm run content:parity

          test "$(git ls-remote origin refs/heads/$HEAD_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_MAIN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/components/article-pilots/antisovetov/AntisovetovBody.astro
          git commit -m 'fix(content): restore Antisovetov ritual-apology note box'
          git push origin "HEAD:$HEAD_BRANCH"
