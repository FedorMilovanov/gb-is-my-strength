name: Search Manifest Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "feed.xml"
      - "sitemap.xml"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "migration/page-ownership.json"
      - "src/content/**"
      - "src/pages/**"
      - "scripts/rss-feed-normalizer.js"
      - "scripts/rss-feed-normalizer-test.js"
      - "scripts/search-manifest-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer-test.js"
      - "scripts/search-index-policy-inventory.js"
      - "scripts/lib/search-index-policy-contract.js"
      - "scripts/lib/rss-route-contract.js"
      - ".github/workflows/search-manifest-policy.yml"
  push:
    branches: [main]
    paths:
      - "feed.xml"
      - "sitemap.xml"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "migration/page-ownership.json"
      - "src/content/**"
      - "src/pages/**"
      - "scripts/rss-feed-normalizer.js"
      - "scripts/rss-feed-normalizer-test.js"
      - "scripts/search-manifest-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer-test.js"
      - "scripts/search-index-policy-inventory.js"
      - "scripts/lib/search-index-policy-contract.js"
      - "scripts/lib/rss-route-contract.js"
      - ".github/workflows/search-manifest-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-manifest-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-normalizer-contract:
    name: Manifest and RSS normalizer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Check normalizer syntax
        run: |
          node --check scripts/search-manifest-policy-normalizer.js
          node --check scripts/search-manifest-policy-normalizer-test.js
          node --check scripts/rss-feed-normalizer.js
          node --check scripts/rss-feed-normalizer-test.js

      - name: Test normalizer mutations and idempotence
        run: |
          node scripts/search-manifest-policy-normalizer-test.js
          node scripts/rss-feed-normalizer-test.js

      - name: Require deterministic RSS projection
        run: node scripts/rss-feed-normalizer.js --check

  search-manifest-autofix:
    name: Search manifest and RSS autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Test normalizer contracts
        run: |
          node scripts/search-manifest-policy-normalizer-test.js
          node scripts/rss-feed-normalizer-test.js

      - name: Normalize explicit RSS article membership
        run: >-
          node scripts/search-manifest-policy-normalizer.js
          --dist=dist
          --promote-rss-articles
          --write

      - name: Normalize deterministic RSS projection
        run: node scripts/rss-feed-normalizer.js --write

      - name: Validate normalized production policy
        run: |
          node scripts/rss-feed-normalizer.js --check
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Validate focused diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only -- . \
            ':(exclude)feed.xml' \
            ':(exclude)data/route-search-policy.json' \
            ':(exclude)data/search-manifest.json' > /tmp/unexpected-search-autofix-paths
          if [[ -s /tmp/unexpected-search-autofix-paths ]]; then
            echo "Unexpected autofix paths:" >&2
            cat /tmp/unexpected-search-autofix-paths >&2
            exit 1
          fi

      - name: Commit search policy and RSS normalization
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- feed.xml data/route-search-policy.json data/search-manifest.json; then
            echo "No search policy or RSS normalization required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml data/route-search-policy.json data/search-manifest.json
          git commit -m "fix(search): align manifest and RSS with route policy"
          git push origin "HEAD:${HEAD_REF}"
