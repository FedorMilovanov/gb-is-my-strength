name: Search Manifest Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "feed.xml"
      - "sitemap.xml"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "data/series.json"
      - "migration/page-ownership.json"
      - "src/content/**"
      - "src/pages/**"
      - "src/components/**/*PageHead.astro"
      - "src/components/nagornaya/**"
      - "scripts/rss-feed-normalizer.js"
      - "scripts/rss-feed-normalizer-test.js"
      - "scripts/sitemap-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer-test.js"
      - "scripts/search-manifest-new-row-role-authority-test.js"
      - "scripts/search-index-policy-inventory.js"
      - "scripts/discovery-followups-browser-test.mjs"
      - "scripts/lib/search-index-policy-contract.js"
      - "scripts/lib/rss-route-contract.js"
      - ".github/workflows/search-manifest-policy.yml"
  push:
    branches: [main]
    paths:
      - "feed.xml"
      - "sitemap.xml"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "data/series.json"
      - "migration/page-ownership.json"
      - "src/content/**"
      - "src/pages/**"
      - "src/components/**/*PageHead.astro"
      - "src/components/nagornaya/**"
      - "scripts/rss-feed-normalizer.js"
      - "scripts/rss-feed-normalizer-test.js"
      - "scripts/sitemap-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer.js"
      - "scripts/search-manifest-policy-normalizer-test.js"
      - "scripts/search-manifest-new-row-role-authority-test.js"
      - "scripts/search-index-policy-inventory.js"
      - "scripts/discovery-followups-browser-test.mjs"
      - "scripts/lib/search-index-policy-contract.js"
      - "scripts/lib/rss-route-contract.js"
      - ".github/workflows/search-manifest-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-manifest-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-normalizer-contract:
    name: Manifest and RSS/sitemap normalizer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check normalizer syntax
        run: |
          node --check scripts/search-manifest-policy-normalizer.js
          node --check scripts/search-manifest-policy-normalizer-test.js
          node --check scripts/search-manifest-new-row-role-authority-test.js
          node --check scripts/rss-feed-normalizer.js
          node --check scripts/rss-feed-normalizer-test.js
          node --check scripts/sitemap-policy-normalizer.js
          node --check scripts/discovery-followups-browser-test.mjs

      - name: Test normalizer mutations and idempotence
        run: |
          node scripts/search-manifest-policy-normalizer-test.js
          node scripts/search-manifest-new-row-role-authority-test.js
          node scripts/rss-feed-normalizer-test.js

      - name: Require deterministic canonical discovery projection
        run: |
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check

  discovery-followups-contract:
    name: Pagefind scripture, noindex and RSS/sitemap contract
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Require existing manifest rows to match built PageHead authority
        run: node scripts/search-manifest-policy-normalizer.js --dist=dist

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Verify route policy and Nagornaya registries
        run: |
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/search-index-policy-inventory.js --dist=dist --strict
          node scripts/nagornaya-source-integrity-regression-test.js
          npm run nagornaya:visual-parity:audit

      - name: Run real Pagefind discovery queries
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node scripts/discovery-followups-browser-test.mjs
          --dist=dist
          --report=reports/a15-discovery-followups

      - name: Publish evidence summary
        run: cat reports/a15-discovery-followups.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a15-discovery-followups-${{ github.run_id }}
          path: |
            reports/a15-discovery-followups.json
            reports/a15-discovery-followups.md
            reports/search-index-policy-inventory.json
            reports/search-index-policy-inventory.md
          if-no-files-found: error
          retention-days: 30

  search-manifest-autofix:
    name: Search manifest, RSS and sitemap autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Resolve live pull request branch
        id: pr-branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${HEAD_REF}" >/dev/null; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo "PR branch ${HEAD_REF} no longer exists; autofix is obsolete."
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact pull request branch
        if: steps.pr-branch.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        if: steps.pr-branch.outputs.exists == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Snapshot machine writer lease
        run: node scripts/writer-lease.mjs snapshot

      - name: Reject stale or foreign writer before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Install dependencies
        if: steps.pr-branch.outputs.exists == 'true'
        run: npm ci

      - name: Build production-like dist
        if: steps.pr-branch.outputs.exists == 'true'
        run: npm run strangler:build:production-like

      - name: Test normalizer contracts
        if: steps.pr-branch.outputs.exists == 'true'
        run: |
          node scripts/search-manifest-policy-normalizer-test.js
          node scripts/search-manifest-new-row-role-authority-test.js
          node scripts/rss-feed-normalizer-test.js

      - name: Normalize explicit RSS article membership
        if: steps.pr-branch.outputs.exists == 'true'
        run: >-
          node scripts/search-manifest-policy-normalizer.js
          --dist=dist
          --promote-rss-articles
          --write

      - name: Normalize deterministic canonical discovery surfaces
        if: steps.pr-branch.outputs.exists == 'true'
        run: |
          node scripts/rss-feed-normalizer.js --write
          node scripts/sitemap-policy-normalizer.js --write

      - name: Validate normalized production policy
        if: steps.pr-branch.outputs.exists == 'true'
        run: |
          node scripts/search-manifest-policy-normalizer.js --dist=dist --promote-rss-articles
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Validate focused diff
        if: steps.pr-branch.outputs.exists == 'true'
        shell: bash
        run: |
          git diff --check
          git diff --name-only -- . \
            ':(exclude)feed.xml' \
            ':(exclude)sitemap.xml' \
            ':(exclude)data/route-search-policy.json' \
            ':(exclude)data/search-manifest.json' > /tmp/unexpected-search-autofix-paths
          if [[ -s /tmp/unexpected-search-autofix-paths ]]; then
            echo "Unexpected autofix paths:" >&2
            cat /tmp/unexpected-search-autofix-paths >&2
            exit 1
          fi

      - name: Commit search policy and canonical discovery normalization
        if: steps.pr-branch.outputs.exists == 'true'
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- feed.xml sitemap.xml data/route-search-policy.json data/search-manifest.json; then
            echo "No search policy, RSS or sitemap normalization required."
            exit 0
          fi
          if ! git ls-remote --exit-code --heads origin "refs/heads/${HEAD_REF}" >/dev/null; then
            echo "PR branch ${HEAD_REF} disappeared after validation; autofix result is obsolete."
            exit 0
          fi
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          EXPECTED_HEAD="$(node scripts/writer-lease.mjs field expectedHead)"
          LEASE_TRAILER="$(node scripts/writer-lease.mjs trailer)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml sitemap.xml data/route-search-policy.json data/search-manifest.json
          git commit -m "fix(search): align manifest, RSS and sitemap with route policy" -m "${LEASE_TRAILER}"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:${HEAD_REF}"
