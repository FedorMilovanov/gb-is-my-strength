name: Genesis 6 Footnote Product Carrier

on:
  pull_request:
    paths:
      - 'scripts/build-genesis6-footnote-product.py'
      - '.github/workflows/genesis6-footnote-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-product:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enable one-run mismatch inventory
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/build-genesis6-footnote-product.py')
          source = path.read_text(encoding='utf-8')
          old = """def replace_once(source: str, old: str, new: str, label: str) -> str:\n    count = source.count(old)\n    if count != 1:\n        raise SystemExit(f'{label}: expected exactly one match, found {count}')\n    return source.replace(old, new, 1)\n"""
          new = """def replace_once(source: str, old: str, new: str, label: str) -> str:\n    count = source.count(old)\n    if count != 1:\n        print(f'DIAGNOSTIC mismatch: {label}: expected exactly one match, found {count}')\n        return source\n    return source.replace(old, new, 1)\n"""
          if source.count(old) != 1:
              raise SystemExit('replace_once diagnostic patch boundary drift')
          path.write_text(source.replace(old, new, 1), encoding='utf-8', newline='')
          PY

      - name: Build exact four-file product
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/build-genesis6-footnote-product.py 2>&1 | tee carrier.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > carrier.status
          exit "$status"

      - name: Restore carrier source
        if: always()
        run: git checkout -- scripts/build-genesis6-footnote-product.py

      - name: Upload carrier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis6-footnote-carrier-${{ github.run_id }}
          path: |
            carrier.log
            carrier.status
            out
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful product build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f carrier.status
          test "$(cat carrier.status)" = "0"
