name: Genesis 6 Footnote Product Carrier

on:
  pull_request:
    paths:
      - 'scripts/build-genesis6-footnote-product.py'
      - 'scripts/finalize-genesis6-footnote-product.py'
      - '.github/workflows/genesis6-footnote-carrier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-product:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build and validate exact four-file product
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/finalize-genesis6-footnote-product.py 2>&1 | tee carrier.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > carrier.status
          exit "$status"

      - name: Verify read-only carrier and exact scope
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain --untracked-files=no | wc -l)" -eq 0
          test "$(find out -type f ! -path 'out/manifest.json' | wc -l)" -eq 4
          test -f out/manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {
              'src/content/articles/kniga-enoha-kotoroy-ne-bylo-kak-raznye-proizvedeniya-stali-korpusom.mdx',
              'src/content/articles/mozhno-li-doveryat-1-enohu-kanonicheskiy-audit.mdx',
              'data/genesis6-enoch-footnote-gates.json',
              'scripts/genesis6-enoch-footnote-gate.mjs',
          }
          manifest = json.loads(Path('out/manifest.json').read_text(encoding='utf-8'))
          actual = {entry['path'] for entry in manifest['files']}
          if actual != expected:
              raise SystemExit(f'product scope drift: {sorted(actual)}')
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Upload carrier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis6-footnote-carrier-${{ github.run_id }}
          path: |
            carrier.log
            carrier.status
            out
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful product build
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f carrier.status
          test "$(cat carrier.status)" = "0"
