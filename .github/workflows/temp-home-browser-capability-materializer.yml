name: Temporary home browser capability materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/home-browser-capability-contract-20260726'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base origin/main HEAD)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git rev-parse origin/main)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git hash-object scripts/home-browser-lifecycle-contract.mjs)" = "45c3f7d9194a62c2a71d54f77b47056c467598e8"
          grep -Fxq 'transport=5-chunks+timing+pixel-com' .home-browser-capability-trigger

          mapfile -t transfer_files < <(find .home-browser-capability-transfer -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_files=(chunk-01.b64 chunk-02.b64 chunk-03.b64 chunk-04.b64 chunk-05.b64 pixel-com.patch timing.patch)
          test "${transfer_files[*]}" = "${expected_files[*]}"

          test "$(sha256sum .home-browser-capability-transfer/chunk-01.b64 | awk '{print $1}')" = "e76937e58e3033b331f20c40b77a5e6538c4cf89600d11019580d5abfd4133d3"
          test "$(sha256sum .home-browser-capability-transfer/chunk-02.b64 | awk '{print $1}')" = "72bb1777d5108999043b58a19303fdb6abc9906f260d31089f40dec5b552d7e4"
          test "$(sha256sum .home-browser-capability-transfer/chunk-03.b64 | awk '{print $1}')" = "647a1ae65b20dc4e1e14bc21ab11357d3395d559d01bceb76cbec159c393132f"
          test "$(sha256sum .home-browser-capability-transfer/chunk-04.b64 | awk '{print $1}')" = "7a38b8e0a13802b039a985d6948857f844421b5fa57a80c5d727d47750b312ab"
          test "$(sha256sum .home-browser-capability-transfer/chunk-05.b64 | awk '{print $1}')" = "d0b784431973c1c42da68e7dc85ab593560c00888169fb85be2d3c01492f0efd"
          test "$(sha256sum .home-browser-capability-transfer/timing.patch | awk '{print $1}')" = "59e4481ba36f11d8bf19ea0184f1c2b23dbcc5bd784b5d079873b61b272a7ff1"
          test "$(sha256sum .home-browser-capability-transfer/pixel-com.patch | awk '{print $1}')" = "ef9158abe2c286f66af0bd9a913aafab1417c357e8c074de8d129a2b574bc6e8"

          cat \
            .home-browser-capability-transfer/chunk-01.b64 \
            .home-browser-capability-transfer/chunk-02.b64 \
            .home-browser-capability-transfer/chunk-03.b64 \
            .home-browser-capability-transfer/chunk-04.b64 \
            .home-browser-capability-transfer/chunk-05.b64 \
            > /tmp/home-browser-capability.patch.gz.b64
          test "$(sha256sum /tmp/home-browser-capability.patch.gz.b64 | awk '{print $1}')" = "2321e06433df2e4e5b493b92bf06a51f3cc1e449d7d2b21a60082a6e165f9d30"
          base64 --decode /tmp/home-browser-capability.patch.gz.b64 > /tmp/home-browser-capability.patch.gz
          test "$(sha256sum /tmp/home-browser-capability.patch.gz | awk '{print $1}')" = "416f25e57c2e9020bf9e95b2ac11ee7b730d9d3a1ad9690bb5800b6098950c04"
          gzip --decompress --stdout /tmp/home-browser-capability.patch.gz > /tmp/home-browser-capability.patch
          test "$(sha256sum /tmp/home-browser-capability.patch | awk '{print $1}')" = "4d19e891b1bb7f3673fd4189ee521a76ea5fe1f19dc899fc18bf9f1f0dbce688"
          git apply --check /tmp/home-browser-capability.patch

          verify_dir="$(mktemp -d)"
          mkdir -p "${verify_dir}/scripts"
          cp scripts/home-browser-lifecycle-contract.mjs "${verify_dir}/scripts/home-browser-lifecycle-contract.mjs"
          (
            cd "${verify_dir}"
            git apply /tmp/home-browser-capability.patch
            git apply "${GITHUB_WORKSPACE}/.home-browser-capability-transfer/timing.patch"
            git apply --check "${GITHUB_WORKSPACE}/.home-browser-capability-transfer/pixel-com.patch"
          )
          rm -rf "${verify_dir}"

      - name: Apply patches and create clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/home-browser-capability.patch
          git apply .home-browser-capability-transfer/timing.patch
          git apply .home-browser-capability-transfer/pixel-com.patch
          rm -rf .home-browser-capability-transfer
          rm -f .home-browser-capability-trigger
          rm -f .github/workflows/temp-home-browser-capability-materializer.yml
          node --check scripts/home-browser-lifecycle-contract.mjs
          grep -Fq "const PRODUCTION_YANDEX_METRIKA_PIXEL_FALLBACK_URL = 'https://mc.yandex.com/watch/108353327';" scripts/home-browser-lifecycle-contract.mjs
          grep -Fq ".replaceAll(PRODUCTION_YANDEX_METRIKA_PIXEL_FALLBACK_URL, LOCAL_YANDEX_METRIKA_PIXEL_PATH);" scripts/home-browser-lifecycle-contract.mjs
          sha256sum scripts/home-browser-lifecycle-contract.mjs | awk '{print $1}' > /tmp/product-file-sha256.txt
          git hash-object scripts/home-browser-lifecycle-contract.mjs > /tmp/product-file-blob.txt
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(home): align browser restoration capabilities [LANE lane/home-browser-capability-contract-2026-07-26]"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/product-commit-sha.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/product-tree-sha.txt
          test "$(git diff --name-only origin/main...HEAD)" = "scripts/home-browser-lifecycle-contract.mjs"
          test ! -e .home-browser-capability-transfer
          test ! -e .home-browser-capability-trigger
          test ! -e .github/workflows/temp-home-browser-capability-materializer.yml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Run homepage contracts with preserved logs
        shell: bash
        run: |
          set +e
          node scripts/home-browser-contract.mjs > /tmp/home-browser-contract.log 2>&1
          home_status=$?
          chromium_status=125
          webkit_status=125

          if [[ ${home_status} -eq 0 ]]; then
            rm -rf reports/home-browser-lifecycle-contract
            HOME_BROWSERS=chromium xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs > /tmp/home-browser-lifecycle-chromium.log 2>&1
            chromium_status=$?
            if [[ -d reports/home-browser-lifecycle-contract ]]; then
              cp -a reports/home-browser-lifecycle-contract reports/home-browser-lifecycle-contract-chromium
            fi

            rm -rf reports/home-browser-lifecycle-contract
            HOME_BROWSERS=webkit xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs > /tmp/home-browser-lifecycle-webkit.log 2>&1
            webkit_status=$?
            if [[ -d reports/home-browser-lifecycle-contract ]]; then
              cp -a reports/home-browser-lifecycle-contract reports/home-browser-lifecycle-contract-webkit
            fi
          else
            printf '%s\n' 'Lifecycle contracts were not started because the base homepage contract failed.' > /tmp/home-browser-lifecycle-chromium.log
            cp /tmp/home-browser-lifecycle-chromium.log /tmp/home-browser-lifecycle-webkit.log
          fi

          cat /tmp/home-browser-contract.log
          cat /tmp/home-browser-lifecycle-chromium.log
          cat /tmp/home-browser-lifecycle-webkit.log

          if [[ ${home_status} -ne 0 ]]; then
            exit "${home_status}"
          fi
          if [[ ${chromium_status} -ne 0 ]]; then
            exit "${chromium_status}"
          fi
          exit "${webkit_status}"

      - name: Run shared-file guard
        run: npm run guard:shared-files

      - name: Push clean product head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload exact product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-browser-capability-product-${{ github.run_id }}
          path: |
            /tmp/product-commit-sha.txt
            /tmp/product-tree-sha.txt
            /tmp/product-file-sha256.txt
            /tmp/product-file-blob.txt
            /tmp/home-browser-contract.log
            /tmp/home-browser-lifecycle-chromium.log
            /tmp/home-browser-lifecycle-webkit.log
            scripts/home-browser-lifecycle-contract.mjs
            reports/home-browser-contract
            reports/home-browser-lifecycle-contract-chromium
            reports/home-browser-lifecycle-contract-webkit
          if-no-files-found: warn
          retention-days: 14
