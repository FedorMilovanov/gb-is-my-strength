name: Temporary home browser capability materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/home-browser-capability-contract-20260726'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base origin/main HEAD)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git rev-parse origin/main)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git hash-object scripts/home-browser-lifecycle-contract.mjs)" = "45c3f7d9194a62c2a71d54f77b47056c467598e8"
          test "$(sha256sum .home-browser-capability-transfer/home-browser-capability.patch.gz.b64 | awk '{print $1}')" = "057349920cf94157c224df08b57a89fbb563c2eea2b3fa9a268586977f10fd3c"
          base64 --decode .home-browser-capability-transfer/home-browser-capability.patch.gz.b64 > /tmp/home-browser-capability.patch.gz
          test "$(sha256sum /tmp/home-browser-capability.patch.gz | awk '{print $1}')" = "8f08ba8fc5a419cd5acdb0f993984f0e207e12abd47b3d1efde5f24eca885a5e"
          gzip --decompress --stdout /tmp/home-browser-capability.patch.gz > /tmp/home-browser-capability.patch
          test "$(sha256sum /tmp/home-browser-capability.patch | awk '{print $1}')" = "6d4c856110eb05adcd3bbeace6d6d498cfac64334fb5644fd93dce669b1376e0"
          git apply --check /tmp/home-browser-capability.patch

      - name: Apply patch and create clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/home-browser-capability.patch
          rm -rf .home-browser-capability-transfer
          rm -f .home-browser-capability-trigger
          rm -f .github/workflows/temp-home-browser-capability-materializer.yml
          node --check scripts/home-browser-lifecycle-contract.mjs
          test "$(sha256sum scripts/home-browser-lifecycle-contract.mjs | awk '{print $1}')" = "84fafe82f27c175312e22e05c4b08bd2957cf86f4a1776f35cd9e28f3e193e4a"
          test "$(git hash-object scripts/home-browser-lifecycle-contract.mjs)" = "f361a3948298400a7d9b6d19430f13151dc2338b"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(home): align browser restoration capabilities [LANE lane/home-browser-capability-contract-2026-07-26]"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/product-commit-sha.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/product-tree-sha.txt
          test "$(git diff --name-only origin/main...HEAD)" = "scripts/home-browser-lifecycle-contract.mjs"
          test ! -e .home-browser-capability-transfer
          test ! -e .home-browser-capability-trigger
          test ! -e .github/workflows/temp-home-browser-capability-materializer.yml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Run homepage contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-browser-contract.mjs
          xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs

      - name: Run shared-file guard
        run: npm run guard:shared-files

      - name: Push clean product head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload exact product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-browser-capability-product-${{ github.run_id }}
          path: |
            /tmp/product-commit-sha.txt
            /tmp/product-tree-sha.txt
            reports/home-browser-contract
            reports/home-browser-lifecycle-contract
          if-no-files-found: warn
          retention-days: 14
