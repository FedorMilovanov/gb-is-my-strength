name: Temporary home browser capability materializer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/home-browser-capability-contract-20260726'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git merge-base origin/main HEAD)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git rev-parse origin/main)" = "38d6e82da2323568008dc1ed70093fc660499475"
          test "$(git hash-object scripts/home-browser-lifecycle-contract.mjs)" = "45c3f7d9194a62c2a71d54f77b47056c467598e8"
          grep -Fxq 'transport=4-chunks' .home-browser-capability-trigger

          mapfile -t transfer_files < <(find .home-browser-capability-transfer -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_files=(chunk-01.b64 chunk-02.b64 chunk-03.b64 chunk-04.b64)
          test "${transfer_files[*]}" = "${expected_files[*]}"

          test "$(sha256sum .home-browser-capability-transfer/chunk-01.b64 | awk '{print $1}')" = "92017e3139a3e175f178463588949c336d11723cab3db30c47e183edb6babdd2"
          test "$(sha256sum .home-browser-capability-transfer/chunk-02.b64 | awk '{print $1}')" = "b95faaba5408b23aca7a19c8b47891543e213dacbc4f5e8b354b07cbaed86b30"
          test "$(sha256sum .home-browser-capability-transfer/chunk-03.b64 | awk '{print $1}')" = "f5aaca8d7d3f29d31109d7079e1bda6337263c666acdc645171815482b7735f2"
          test "$(sha256sum .home-browser-capability-transfer/chunk-04.b64 | awk '{print $1}')" = "f6df541a0d0de7c9c8e1f5f88f760e03c020ebd192c6a13b4544c810a9ed4dc8"

          cat \
            .home-browser-capability-transfer/chunk-01.b64 \
            .home-browser-capability-transfer/chunk-02.b64 \
            .home-browser-capability-transfer/chunk-03.b64 \
            .home-browser-capability-transfer/chunk-04.b64 \
            > /tmp/home-browser-capability.patch.gz.b64
          test "$(sha256sum /tmp/home-browser-capability.patch.gz.b64 | awk '{print $1}')" = "c5d1824e5dcb5364b76358d8634c56107c10db81de025871e1fad89524213cbb"
          base64 --decode /tmp/home-browser-capability.patch.gz.b64 > /tmp/home-browser-capability.patch.gz
          test "$(sha256sum /tmp/home-browser-capability.patch.gz | awk '{print $1}')" = "1992e9640679db7752cb1d4264f3cca0e55cb0fc61b61d1b35a50d3c9b6bb9ae"
          gzip --decompress --stdout /tmp/home-browser-capability.patch.gz > /tmp/home-browser-capability.patch
          test "$(sha256sum /tmp/home-browser-capability.patch | awk '{print $1}')" = "747b144e70c91174a28bb51c96141748e939db38f76b310025e7321af9e1402d"
          git apply --check /tmp/home-browser-capability.patch

      - name: Apply patch and create clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/home-browser-capability.patch
          rm -rf .home-browser-capability-transfer
          rm -f .home-browser-capability-trigger
          rm -f .github/workflows/temp-home-browser-capability-materializer.yml
          node --check scripts/home-browser-lifecycle-contract.mjs
          test "$(sha256sum scripts/home-browser-lifecycle-contract.mjs | awk '{print $1}')" = "98ac9bb0b5e207b9e795dd91a7d6028df2acc42fe4073f2685bd3deb2fb9109f"
          test "$(git hash-object scripts/home-browser-lifecycle-contract.mjs)" = "1d073c7cf597d9a7fa06b8c5ccc24ffeaf91a351"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(home): align browser restoration capabilities [LANE lane/home-browser-capability-contract-2026-07-26]"
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/product-commit-sha.txt
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/product-tree-sha.txt
          test "$(git diff --name-only origin/main...HEAD)" = "scripts/home-browser-lifecycle-contract.mjs"
          test ! -e .home-browser-capability-transfer
          test ! -e .home-browser-capability-trigger
          test ! -e .github/workflows/temp-home-browser-capability-materializer.yml

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Run homepage contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/home-browser-contract.mjs
          xvfb-run -a node scripts/home-browser-lifecycle-contract.mjs

      - name: Run shared-file guard
        run: npm run guard:shared-files

      - name: Push clean product head
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload exact product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: home-browser-capability-product-${{ github.run_id }}
          path: |
            /tmp/product-commit-sha.txt
            /tmp/product-tree-sha.txt
            reports/home-browser-contract
            reports/home-browser-lifecycle-contract
          if-no-files-found: warn
          retention-days: 14
