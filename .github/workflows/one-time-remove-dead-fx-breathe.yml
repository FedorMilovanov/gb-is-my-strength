name: One-time remove dead fx-breathe

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-dead-fx-breathe:
    if: github.head_ref == 'agent/remove-dead-fx-breathe-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Materialize bounded CSS cleanup
        run: python scripts/_remove_dead_fx_breathe_once.py

      - name: Validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('css/site.css').read_text(encoding='utf-8')
          assert text.count('@keyframes fx-breathe') == 1
          assert '@keyframes fx-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}' not in text
          assert text.count('@keyframes fx-breathe{0%,100%{transform:scale(1);opacity:.82}50%{transform:scale(1.06);opacity:1}}') == 1
          print('fx-breathe ownership: PASS')
          PY
          npm run css:layer:validate
          npm run validate:all
          node scripts/audit-pro.js

      - name: Commit permanent file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/site.css
          git diff --cached --quiet && { echo 'No permanent diff produced'; exit 1; }
          git commit -m 'fix(css): remove dead fx-breathe definition'
          git push origin HEAD:${{ github.head_ref }}
