name: TEMP Read Latest Pages Witness

on:
  push:
    branches:
      - cleanup/pages-deploy-witness-2026-07-22

permissions:
  contents: read
  issues: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read and relay latest issue 58 comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100"
          id=$(gh api "$api" --jq '.[-1].id')
          body=$(gh api "$api" --jq '.[-1].body')
          {
            echo '## Latest issue #58 witness'
            echo
            echo "Comment ID: \`$id\`"
            echo
            printf '%s\n' "$body"
          } > /tmp/latest.md
          cat /tmp/latest.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/118/comments" \
            --method POST \
            -f body="$(cat /tmp/latest.md)"
