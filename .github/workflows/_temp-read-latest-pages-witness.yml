name: TEMP Persist Latest Pages Witness

on:
  push:
    branches:
      - agent/nagornaya-bar-asset-contract-2026-07-22

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-persist-latest-pages-witness
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nagornaya-bar-asset-contract-2026-07-22
          fetch-depth: 0
      - name: Save latest issue 58 comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          api="repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100"
          gh api "$api" --jq '.[-1] | "# Latest issue 58 witness\n\nComment ID: `\(.id)`\n\nCreated: `\(.created_at)`\n\n\(.body)"' > .github/_temp-latest-issue58-witness.md
          cat .github/_temp-latest-issue58-witness.md
      - name: Commit witness file
        shell: bash
        run: |
          git add .github/_temp-latest-issue58-witness.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: persist latest issue 58 witness'
          git push origin HEAD:agent/nagornaya-bar-asset-contract-2026-07-22
