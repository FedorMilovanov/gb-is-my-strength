name: Editorial Metadata v3

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/editorial-metadata.json'
      - 'scripts/editorial-metadata-*.js'
      - 'scripts/lib/editorial-metadata.js'
      - 'scripts/update-meta.js'
      - 'scripts/cache-bust.js'
      - '.github/workflows/editorial-metadata-v3.yml'
      - '.github/workflows/indexnow.yml'
  workflow_dispatch:

concurrency:
  group: editorial-metadata-v3-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate editorial workflow transaction contract
        run: node scripts/editorial-metadata-workflow-contract-test.js

      - name: Build production metadata surface and preserve committed freeze
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run strangler:build:production-like 2>&1 \
            | tee reports/editorial-metadata-build.log
          cp data/editorial-metadata.json reports/editorial-metadata-frozen.json

      - name: Validate committed registry structure
        run: node scripts/editorial-metadata-registry.js --check

      - name: Validate current projections against committed freeze
        shell: bash
        run: |
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.log

      - name: Capture current observations without mutating the freeze contract
        shell: bash
        run: |
          set -o pipefail
          restore_registry() {
            cp reports/editorial-metadata-frozen.json data/editorial-metadata.json
          }
          trap restore_registry EXIT

          node scripts/editorial-metadata-registry.js --write 2>&1 \
            | tee reports/editorial-metadata-capture.log
          cp data/editorial-metadata.json reports/editorial-metadata-observed.json

          restore_registry
          trap - EXIT
          git diff --exit-code -- data/editorial-metadata.json

      - name: Validate asset revisions without writing
        if: always()
        shell: bash
        run: |
          set -o pipefail
          node scripts/cache-bust.js 2>&1 \
            | tee reports/asset-revision-drift.log

      - name: Upload frozen baseline, observed snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-metadata-v3-${{ github.run_id }}
          path: |
            reports/editorial-metadata-*.log
            reports/editorial-metadata-frozen.json
            reports/editorial-metadata-observed.json
            reports/asset-revision-drift.log
          if-no-files-found: error
          retention-days: 7
