name: Temporary PWA publication parser autofix

on:
  push:
    branches:
      - lane/offline-pwa-current-20260803

permissions:
  contents: read

concurrency:
  group: tmp-pwa-publication-parser-autofix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: lane/offline-pwa-current-20260803
          fetch-depth: 0

      - name: Verify bounded transport scope
        env:
          EXPECTED_BASE: d44a6448b11feac8a0b4c0e9546326d077ed9772
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" HEAD | sort)
          expected=(
            ".github/workflows/_tmp-pwa-publication-parser-autofix.yml"
            "scripts/_tmp_pwa_publication_parser_autofix.py"
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt

      - name: Apply canonical parser repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_tmp_pwa_publication_parser_autofix.py
          node --check scripts/dist-publication-audit.js
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('scripts/dist-publication-audit.js', 'utf8');
          const start = source.indexOf('function parseSwPrecache(sw) {');
          const end = source.indexOf('\nfunction walk(', start);
          if (start < 0 || end < 0) throw new Error('parser function boundary missing');
          const factory = new Function(`${source.slice(start, end)}; return parseSwPrecache;`);
          const assets = factory()(fs.readFileSync('sw.js', 'utf8'));
          if (assets.length !== 31) throw new Error(`expected 31 precache assets, got ${assets.length}`);
          if (!assets.includes('/pagefind/pagefind.js')) throw new Error('Pagefind bootstrap missing');
          if (!assets.includes('/404.html')) throw new Error('OFFLINE_FALLBACK constant was not resolved');
          console.log(`PRECACHE parser contract: PASS (${assets.length} assets)`);
          NODE

      - name: Commit only the permanent audit repair
        env:
          EXPECTED_BASE: d44a6448b11feac8a0b4c0e9546326d077ed9772
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/_tmp-pwa-publication-parser-autofix.yml
          test ! -e scripts/_tmp_pwa_publication_parser_autofix.py
          mapfile -t final_changed < <(git diff --name-only "$EXPECTED_BASE" | sort)
          test "${#final_changed[@]}" -eq 1
          test "${final_changed[0]}" = "scripts/dist-publication-audit.js"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): parse formatted service-worker precache"
          git push origin HEAD:lane/offline-pwa-current-20260803
