name: TEMP Site Menu Bootstrap

on:
  pull_request:
    types: [labeled, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: temp-site-menu-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'agent/system-site-menu-owner-20260810' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure writer identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Snapshot and verify writer lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/writer-lease.mjs snapshot
          node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Write exact site-menu system patch
        run: node scripts/apply-site-menu-system-patch.mjs --write

      - name: Validate generated site-menu source
        run: |
          node scripts/cache-bust.js
          node --check js/site.js
          node --check src/runtime/reader-controls-a11y.js
          node --check scripts/reader-controls-residual-browser-contract.mjs
          git diff --check

      - name: Commit and CAS-push exact generated source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/temp-site-menu-bootstrap.yml
          rm scripts/apply-site-menu-system-patch.mjs
          git add js/site.js \
            src/components/about/AboutPageChrome.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/home/HomePageChrome.astro \
            src/components/nagornaya/seriya/NagornayaSeriyaBody.astro \
            .github/workflows/temp-site-menu-bootstrap.yml \
            scripts/apply-site-menu-system-patch.mjs
          test -n "$(git status --porcelain)"
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          trailer="$(node scripts/writer-lease.mjs trailer)"
          git commit -m 'fix(site-menu): establish canonical full-site menu owner' -m "$trailer"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:refs/heads/${HEAD_REF}"
