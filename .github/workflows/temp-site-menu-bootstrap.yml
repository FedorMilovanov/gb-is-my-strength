name: TEMP Site Menu Bootstrap

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-site-menu-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/system-site-menu-owner-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure writer identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Snapshot and verify writer lease
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/writer-lease.mjs snapshot
          node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Apply exact site-menu system patch
        run: |
          node scripts/apply-site-menu-system-patch.mjs
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          node --check js/site.js
          node --check src/runtime/reader-controls-a11y.js
          node --check scripts/reader-controls-residual-browser-contract.mjs
          node scripts/check-workflows.js
          git diff --check

      - name: Remove bootstrap machinery and commit final source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/temp-site-menu-bootstrap.yml
          rm scripts/apply-site-menu-system-patch.mjs
          git add -A
          test -n "$(git status --porcelain)"
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          trailer="$(node scripts/writer-lease.mjs trailer)"
          git commit -m 'fix(site-menu): establish canonical full-site menu owner' -m "$trailer"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          expected='${{ github.event.pull_request.head.sha }}'
          git push --force-with-lease=refs/heads/${{ github.event.pull_request.head.ref }}:$expected \
            origin HEAD:refs/heads/${{ github.event.pull_request.head.ref }}
