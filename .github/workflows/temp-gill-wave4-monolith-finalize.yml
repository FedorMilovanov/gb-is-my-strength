name: Temp Gill wave4 monolith finalize

on:
  pull_request_target:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: temp-gill-wave4-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 156 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/gill-source-marathon'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Gill branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect one-time finalizer
        id: finalizer
        shell: bash
        run: |
          if [[ -f scripts/gill-wave4-finalize.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mark finalizer start
        if: steps.finalizer.outputs.present == 'true' && !hashFiles('.gill-wave4-finalizer-started')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'pr=%s\nsource_head=%s\n' '${{ github.event.pull_request.number }}' '${{ github.event.pull_request.head.sha }}' > .gill-wave4-finalizer-started
          git add .gill-wave4-finalizer-started
          git commit -m 'chore(gill): mark wave4 finalizer start'
          git push origin HEAD:refs/heads/agent/gill-source-marathon

      - name: Apply native Gill monolith corrections
        if: steps.finalizer.outputs.present == 'true'
        run: python3 scripts/gill-wave4-finalize.py

      - name: Set up Node
        if: steps.finalizer.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.finalizer.outputs.present == 'true'
        run: npm ci

      - name: Validate native publication
        if: steps.finalizer.outputs.present == 'true'
        run: |
          node scripts/route-source-contract-audit.js --strict
          npm run astro:check
          npm run validate:static-publication

      - name: Commit verified Gill corpus
        if: steps.finalizer.outputs.present == 'true'
        run: |
          rm -f .gill-wave4-finalizer-started .gill-wave4-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'content(gill): finalize source-backed legacy corrections'
          git push origin HEAD:refs/heads/agent/gill-source-marathon
