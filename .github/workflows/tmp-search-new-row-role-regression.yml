name: Temporary Search new-row role regression projector

on:
  pull_request:
    types: [opened]
    branches:
      - main
    paths:
      - .github/workflows/tmp-search-new-row-role-regression.yml

permissions:
  contents: write

jobs:
  project-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Require exact empty-lane prestate
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 488d4c1a3cd02a0eade680cd78d5ee2c70a775b3 HEAD
          test "$(git diff --name-only 488d4c1a3cd02a0eade680cd78d5ee2c70a775b3...HEAD)" = ".github/workflows/tmp-search-new-row-role-regression.yml"

      - name: Add role regressions only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/search-manifest-policy-normalizer-test.js')
          text = p.read_text(encoding='utf-8')

          runtime = '<script>window.SITE_CONFIG={page:{readingTime: 17}}</script>'
          ordinary_jsonld = '''<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@type":"Article",
  "author":{"@type":"Person","name":"Author Structured Name"}
}</script>
'''
          if text.count(runtime) != 1:
              raise SystemExit(f'unexpected runtime marker count: {text.count(runtime)}')
          text = text.replace(runtime, ordinary_jsonld + runtime, 1)

          marker = "assert.equal(item.description, 'Нативное описание');\n"
          addition = """assert.equal(item.author, 'Автор, не редактор');
assert.equal(Object.hasOwn(item, 'editor'), false);
assert.equal(Object.hasOwn(item, 'translator'), false);
"""
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected ordinary assertion marker count: {text.count(marker)}')
          text = text.replace(marker, marker + addition, 1)

          translation_marker = "assert.equal(buildManifestItem(route, policy, htmlWithoutRuntimeReadTime, 23).readTime, 23);\n"
          translation_block = r'''

const translationRoute = '/articles/translation-fixture/';
const translationPolicy = {
  ...policy,
  contentKind: 'translation',
  librarySection: 'Переводы',
};
const translationHtml = `<!doctype html><html><head>
<title>Translation fallback | Господь Бог — Сила Моя</title>
<meta property="og:title" content="Переводной материал">
<meta name="description" content="Описание перевода">
<meta name="author" content="Абнер Чау">
<meta property="article:author" content="Абнер Чау">
<meta name="translator" content="Фёдор Милованов">
<meta property="article:section" content="Герменевтика">
<meta property="article:published_time" content="2016-09-01T00:00:00+03:00">
<meta property="article:modified_time" content="2026-07-09T02:34:58+03:00">
<meta property="article:tag" content="герменевтика">
<meta property="og:image" content="https://gospod-bog.ru/images/translation-fixture.webp">
<script type="application/ld+json">{
  "@context":"https://schema.org",
  "@graph":[{
    "@type":"ScholarlyArticle",
    "author":{"@type":"Person","name":"Abner Chou"},
    "translator":{"@id":"https://gospod-bog.ru/about/#person","@type":"Person","name":"Фёдор Милованов"},
    "editor":{"@id":"https://gospod-bog.ru/about/#person"}
  }]
}</script>
<script>window.SITE_CONFIG={page:{readingTime: 50}}</script>
</head><body></body></html>`;
const translationItem = buildManifestItem(translationRoute, translationPolicy, translationHtml);
assert.equal(translationItem.author, 'Абнер Чау');
assert.equal(translationItem.translator, 'Фёдор Милованов');
assert.equal(translationItem.editor, 'Фёдор Милованов');
'''
          if text.count(translation_marker) != 1:
              raise SystemExit(f'unexpected translation marker count: {text.count(translation_marker)}')
          text = text.replace(translation_marker, translation_marker + translation_block, 1)

          p.write_text(text, encoding='utf-8')
          PY
          node --check scripts/search-manifest-policy-normalizer-test.js
          git diff --check
          test "$(git diff --name-only)" = "scripts/search-manifest-policy-normalizer-test.js"

      - name: Retire executor and commit regression only
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-search-new-row-role-regression.yml
          git diff --check
          expected="$(printf '%s\n' .github/workflows/tmp-search-new-row-role-regression.yml scripts/search-manifest-policy-normalizer-test.js | sort)"
          actual="$(git diff --name-only | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows/tmp-search-new-row-role-regression.yml scripts/search-manifest-policy-normalizer-test.js
          git commit -m "test(discovery): expose new-row role conflation"
          git push origin HEAD:fix/search-manifest-new-row-role-authority-20260808
