name: TEMP reader preferences diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reuse verified exact patch payload
        shell: bash
        run: |
          sed -n 's/^          PATCH_GZ_B64: //p' .github/workflows/_temp-reader-preferences-patcher.yml \
            | base64 -d | gzip -d > /tmp/reader-preferences-patch.py
          echo 'd3ade8e3ec066101f363772c2c929bc0e4c9100c19d182560dac7f9166f9d3bd  /tmp/reader-preferences-patch.py' | sha256sum -c -
          python3 /tmp/reader-preferences-patch.py
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Capture verification and diff
        shell: bash
        run: |
          set +e
          {
            node --check js/reader-preferences-head.js
            node --check js/reader-preferences.js
            node scripts/reader-preferences-regression-test.js
          } > reader-preferences-verify.log 2>&1
          status=$?
          git status --short > reader-preferences-files.log
          git diff --stat >> reader-preferences-files.log
          cat reader-preferences-verify.log
          exit "$status"

      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-preferences-diagnostic
          path: |
            reader-preferences-verify.log
            reader-preferences-files.log
          if-no-files-found: error
          retention-days: 1
