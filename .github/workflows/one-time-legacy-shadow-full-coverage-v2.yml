name: One-time legacy shadow full coverage v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  legacy-shadow-full-coverage:
    if: github.head_ref == 'agent/registry-derived-shadow-audit-v2-20260802'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Run registry-derived production-like shadow audit
        run: node scripts/legacy-shadow-wrapper-audit.js
