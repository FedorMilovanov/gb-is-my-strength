name: TEMP Persist Final Pages Witness

on:
  push:
    branches:
      - agent/nagornaya-bar-asset-contract-2026-07-22

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-persist-final-pages-witness
  cancel-in-progress: true

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nagornaya-bar-asset-contract-2026-07-22
          fetch-depth: 0
      - name: Save latest issue 58 comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" \
            --jq '.[-1] | "# Final issue 58 witness\n\nComment ID: `\(.id)`\n\nCreated: `\(.created_at)`\n\n\(.body)"' \
            > .github/_temp-final-issue58-witness.md
          cat .github/_temp-final-issue58-witness.md
      - name: Commit witness file
        run: |
          git add .github/_temp-final-issue58-witness.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: persist final issue 58 witness'
          git push origin HEAD:agent/nagornaya-bar-asset-contract-2026-07-22
