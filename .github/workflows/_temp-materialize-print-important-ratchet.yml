name: TEMP Materialize Print Important Ratchet

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-print-important-ratchet.yml'
      - 'scripts/_temp-remove-print-important.mjs'
      - 'css/site.css'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-print-important-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/print-decoration-pagination-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact product lane
        uses: actions/checkout@v4
        with:
          ref: fix/print-decoration-pagination-2026-07-25
          fetch-depth: 0

      - name: Setup Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove v2.9 important flags and project revisions
        run: node scripts/_temp-remove-print-important.mjs

      - name: Validate source, ratchet and audit-pro
        run: |
          set -euo pipefail
          node --check scripts/_temp-remove-print-important.mjs
          node scripts/cache-bust.js
          git diff --check
          count=$(grep -o '!important' css/site.css | wc -l)
          test "${count}" -le 200
          test "$(awk '/GB PRINT CONTRACT v2.9/{f=1} f' css/site.css | grep -o '!important' | wc -l)" -eq 0
          node scripts/audit-pro.js
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-print-important-ratchet.yml

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install browser and PDF audit dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Run multi-route pagination proof
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/print-important-ratchet
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/print-pagination-contract.mjs 2>&1 | tee reports/print-important-ratchet.log

      - name: Raster-audit every generated PDF
        run: |
          python3 scripts/print-pagination-raster-audit.py \
            reports/print-important-ratchet \
            --out reports/print-important-ratchet-raster

      - name: Publish tested product commit only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add css/site.css src/lib/asset-version.js
          git add -u -- '*.html' '*.astro'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes staged' >&2; exit 1; }
          git commit -m 'fix(print): converge site important ratchet'
          git push origin HEAD:fix/print-decoration-pagination-2026-07-25

      - name: Upload ratchet evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-important-ratchet-${{ github.run_id }}
          path: |
            reports/print-important-ratchet.log
            reports/print-important-ratchet/
            reports/print-important-ratchet-raster/
          if-no-files-found: warn
          retention-days: 14
