name: TEMP reader R3 façade implementation

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'lane/reader-r3-series-facade-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Introduce façade and migrate consumers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          root = Path('.')
          old_import = "import GillSeriesChrome from '@/components/article-pilots/gill-series/GillSeriesChrome.astro';"
          new_import = "import SeriesReaderChrome from '@/components/article-pilots/_shared/series/SeriesReaderChrome.astro';"

          migrated = []
          for path in sorted((root / 'src/components').rglob('*.astro')):
            text = path.read_text(encoding='utf-8')
            if old_import not in text:
              continue
            if text.count(old_import) != 1:
              raise SystemExit(f'unexpected import count in {path}: {text.count(old_import)}')
            text = text.replace(old_import, new_import, 1)
            text = text.replace('GillSeriesChrome', 'SeriesReaderChrome')
            path.write_text(text, encoding='utf-8')
            migrated.append(str(path))

          if len(migrated) != 41:
            raise SystemExit(f'expected 41 migrated production consumers, found {len(migrated)}')

          facade = root / 'src/components/article-pilots/_shared/series/SeriesReaderChrome.astro'
          facade.write_text(textwrap.dedent("""\
          ---
          import GillSeriesChrome from '../../gill-series/GillSeriesChrome.astro';
          import type { SeriesConfig } from './seriesConfig';

          interface Props {
            pageId: string;
            config?: SeriesConfig;
          }

          const { pageId, config } = Astro.props;
          ---
          <GillSeriesChrome pageId={pageId} config={config}>
            <slot />
          </GillSeriesChrome>
          """), encoding='utf-8')

          guard = root / 'scripts/series-reader-facade-regression-test.js'
          guard.write_text(textwrap.dedent("""\
          #!/usr/bin/env node
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const assert = require('assert/strict');

          const ROOT = path.resolve(__dirname, '..');
          const FACADE = path.join(ROOT, 'src/components/article-pilots/_shared/series/SeriesReaderChrome.astro');
          const IMPLEMENTATION_IMPORT = "import GillSeriesChrome from '../../gill-series/GillSeriesChrome.astro';";
          const DIRECT_IMPORT_RE = /import\\s+[A-Za-z_$][\\w$]*\\s+from\\s+['\"][^'\"]*GillSeriesChrome\\.astro['\"]/;
          const FACADE_IMPORT_RE = /import\\s+SeriesReaderChrome\\s+from\\s+['\"][^'\"]*SeriesReaderChrome\\.astro['\"]/g;

          function walk(dir) {
            const out = [];
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === 'node_modules' || entry.name === 'dist' || entry.name === '.git') continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) out.push(...walk(full));
              else out.push(full);
            }
            return out;
          }

          const facade = fs.readFileSync(FACADE, 'utf8');
          assert.ok(facade.includes(IMPLEMENTATION_IMPORT), 'façade must be the only implementation importer');
          assert.ok(facade.includes('<GillSeriesChrome pageId={pageId} config={config}>'), 'façade must forward pageId/config');
          assert.ok(facade.includes('<slot />'), 'façade must forward the default slot');

          const sourceFiles = walk(path.join(ROOT, 'src')).filter((file) => /\\.(?:astro|ts|tsx|js|jsx|mjs|cjs)$/.test(file));
          const illegal = [];
          let facadeImports = 0;
          for (const file of sourceFiles) {
            const text = fs.readFileSync(file, 'utf8');
            if (file !== FACADE && DIRECT_IMPORT_RE.test(text)) illegal.push(path.relative(ROOT, file));
            const matches = text.match(FACADE_IMPORT_RE);
            if (matches) facadeImports += matches.length;
          }

          assert.deepEqual(illegal, [], `direct GillSeriesChrome imports outside façade: ${illegal.join(', ')}`);
          assert.ok(facadeImports >= 41, `expected at least 41 SeriesReaderChrome consumers, found ${facadeImports}`);

          console.log(`✅ series-reader-facade: ${facadeImports} consumers; implementation import isolated to façade`);
          """), encoding='utf-8')

          contracts = root / 'scripts/check-engine-contracts.js'
          text = contracts.read_text(encoding='utf-8')
          replacements = {
            '/* ---------- серия-движок: все тела серий на GillSeriesChrome ---------- */':
              '/* ---------- серия-движок: все тела серий на SeriesReaderChrome ---------- */',
            '// Хаб /baptisty-rossii/ — лендинг серии, не статья: GillSeriesChrome не обязан.':
              '// Хаб /baptisty-rossii/ — лендинг серии, не статья: SeriesReaderChrome не обязан.',
            "if (!content.includes('GillSeriesChrome')) missing.push(path.join(dir, b));":
              "if (!content.includes('SeriesReaderChrome')) missing.push(path.join(dir, b));",
            "check('Серия-движок: все статьи серий на GillSeriesChrome', missing.length === 0,":
              "check('Серия-движок: все статьи серий на SeriesReaderChrome', missing.length === 0,",
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'engine contract anchor mismatch: {old}')
            text = text.replace(old, new, 1)
          contracts.write_text(text, encoding='utf-8')

          package = root / 'package.json'
          text = package.read_text(encoding='utf-8')
          old = '    "gill:chrome:guard": "node scripts/gill-canonical-chrome-guard.js",\n    "engine:contracts": "node scripts/check-engine-contracts.js",'
          new = '    "gill:chrome:guard": "node scripts/gill-canonical-chrome-guard.js",\n    "series:facade:guard": "node scripts/series-reader-facade-regression-test.js",\n    "engine:contracts": "node scripts/check-engine-contracts.js && npm run series:facade:guard",'
          if text.count(old) != 1:
            raise SystemExit('package scripts anchor mismatch')
          package.write_text(text.replace(old, new, 1), encoding='utf-8')

          workflow = root / '.github/workflows/shared-files-guard.yml'
          text = workflow.read_text(encoding='utf-8')
          old = """      - name: Reader preferences regressions
                  run: node scripts/reader-preferences-regression-test.js

                - name: Guard shared/system files (strict on main/PR)
          """
          old = old.replace('          run:', '        run:').replace('        - name: Guard', '      - name: Guard')
          new = """      - name: Reader preferences regressions
                  run: node scripts/reader-preferences-regression-test.js

                - name: Series reader façade regressions
                  run: npm run series:facade:guard

                - name: Guard shared/system files (strict on main/PR)
          """
          new = new.replace('          run:', '        run:').replace('        - name: Series', '      - name: Series').replace('        - name: Guard', '      - name: Guard')
          if text.count(old) != 1:
            raise SystemExit('shared-files workflow anchor mismatch')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          text_replacements = {
            root / 'css/series-samizdat.css': [('GillSeriesChrome', 'SeriesReaderChrome')],
            root / 'src/components/article-pilots/_shared/mobileChromeRegistry.ts': [
              ('GillSeriesChrome→GillSeriesMobileBar', 'SeriesReaderChrome→GillSeriesMobileBar'),
              ('статически в GillSeriesChrome', 'статически в SeriesReaderChrome'),
            ],
            root / 'docs/SERIES-ENGINE-GUIDE.md': [
              ('<GillSeriesChrome pageId="<id>" config={<СЕРИЯ>}><article>…</article></GillSeriesChrome>',
               '<SeriesReaderChrome pageId="<id>" config={<СЕРИЯ>}><article>…</article></SeriesReaderChrome>'),
            ],
            root / 'migration/page-ownership.json': [
              ('Gill v16 shared chrome (`data-gill-v16`, GillSeriesChrome)',
               'shared series façade (`SeriesReaderChrome` → `data-gill-v16` implementation)'),
            ],
          }
          for path, reps in text_replacements.items():
            text = path.read_text(encoding='utf-8')
            for old, new in reps:
              if old not in text:
                raise SystemExit(f'documentation anchor missing in {path}: {old}')
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')

          architecture = root / 'docs/READER-PLATFORM-ARCHITECTURE-2026-07-21.md'
          text = architecture.read_text(encoding='utf-8')
          text = text.replace(
            '- `GillSeriesChrome` already renders not only Gill, but the Heart/book series, Baptist series and other series routes;',
            '- `SeriesReaderChrome` now fronts the existing Gill implementation for Gill, Heart/book, Baptist and other series routes;',
          )
          text = text.replace(
            '- 43 source files reference `GillSeriesChrome`;',
            '- 41 production consumers import the neutral `SeriesReaderChrome` façade;',
          )
          text = text.replace(
            '- `SeriesReaderChrome` — generic name and API; initially wraps or aliases the existing `GillSeriesChrome` implementation to preserve parity;',
            '- `SeriesReaderChrome` — landed generic façade; it alone imports the existing `GillSeriesChrome` implementation to preserve parity;',
          )
          architecture.write_text(text, encoding='utf-8')

          matrix = root / 'docs/READER-PLATFORM-MIGRATION-MATRIX-2026-07-21.md'
          text = matrix.read_text(encoding='utf-8')
          text = text.replace('`GillSeriesChrome` + Gill-specific sheets/data', '`SeriesReaderChrome` façade + Gill-specific sheets/data')
          text = text.replace('Generic configs rendered through `GillSeriesChrome`', 'Generic configs rendered through `SeriesReaderChrome` façade')
          text = text.replace('- `GillSeriesChrome` is referenced by 43 source files and already acts as the de facto generic series engine.', '- `SeriesReaderChrome` is imported by 41 production consumers and fronts the existing implementation.')
          text = text.replace('| `GillSeriesChrome` | Generic implementation has Gill name | Add `SeriesReaderChrome` façade forwarding identical props/slots | Generic series chrome; Gill wrapper optional/deprecated |', '| `SeriesReaderChrome` | Neutral façade landed; historical implementation remains internal | Keep façade as the only direct importer and preserve props/slot/DOM/CSS | Generic series chrome; Gill implementation internal |')
          matrix.write_text(text, encoding='utf-8')

          lane = root / 'docs/READER-R3-SERIES-FACADE-2026-07-21.md'
          text = lane.read_text(encoding='utf-8')
          text += '\n## Inventory and implementation\n\n- 41 production consumers migrated.\n- façade is the only direct implementation importer.\n- no DOM/CSS selector changes.\n- permanent guard wired into engine contracts and Shared Files Guard.\n'
          lane.write_text(text, encoding='utf-8')

          print(f'Migrated {len(migrated)} consumers')
          PY
      - name: Validate façade contracts
        run: |
          node --check scripts/series-reader-facade-regression-test.js
          npm run series:facade:guard
          npm run engine:contracts
      - name: Commit permanent R3 implementation
        shell: bash
        run: |
          git rm .github/workflows/_temp-reader-r3-inventory.yml
          git add .github/workflows/shared-files-guard.yml package.json \
                  scripts/check-engine-contracts.js scripts/series-reader-facade-regression-test.js \
                  src/components css/series-samizdat.css migration/page-ownership.json \
                  docs/READER-PLATFORM-ARCHITECTURE-2026-07-21.md \
                  docs/READER-PLATFORM-MIGRATION-MATRIX-2026-07-21.md \
                  docs/READER-R3-SERIES-FACADE-2026-07-21.md docs/SERIES-ENGINE-GUIDE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(reader): route series through neutral façade'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
