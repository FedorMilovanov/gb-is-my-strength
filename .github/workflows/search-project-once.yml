name: Search Project Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/search-project-once.yml'

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Refuse stale branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}"
          test "$(git rev-parse "origin/${HEAD_BRANCH}")" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Project canonical asset revisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          node scripts/legacy-reference-inventory-audit.mjs
          git diff --check

      - name: Commit projection and retire projector
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/search-project-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore(search): project current asset revision to active owners'
          git push origin "HEAD:${HEAD_BRANCH}"
