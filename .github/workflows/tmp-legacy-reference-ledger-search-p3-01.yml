name: Temporary Legacy Reference Ledger Search P3-01

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/tmp-legacy-reference-ledger-search-p3-01.yml'
      - 'data/workflow-permission-policy.json'
      - 'scripts/tmp_legacy_reference_ledger_search_p3_01.mjs'

permissions:
  contents: read

concurrency:
  group: legacy-reference-ledger-search-p3-01-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile-and-verify:
    name: Reconcile and verify legacy ledger
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/search-trigger-labels-p3-01-safe-20260806'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Guard exact base, predecessor and transport diff
        env:
          EXPECTED_BASE: 76737eefe16a0feb2fdf729c805d17b5cdcdc376
          EXPECTED_PRE_TRANSACTION: 2ec30d22029f2f7e32f13b3d210357554064757f
          EXPECTED_BRANCH: agent/search-trigger-labels-p3-01-safe-20260806
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$HEAD_REF" = "$EXPECTED_BRANCH"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_PRE_TRANSACTION" HEAD
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/tmp-legacy-reference-ledger-search-p3-01.yml',
              'data/workflow-permission-policy.json',
              'scripts/tmp_legacy_reference_ledger_search_p3_01.mjs',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '2ec30d22029f2f7e32f13b3d210357554064757f...HEAD'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unbounded ledger transaction diff: {sorted(changed)}')
          PY

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Reconcile ledger and self-clean transaction
        run: |
          set -euo pipefail
          node scripts/tmp_legacy_reference_ledger_search_p3_01.mjs --write
          rm .github/workflows/tmp-legacy-reference-ledger-search-p3-01.yml
          rm scripts/tmp_legacy_reference_ledger_search_p3_01.mjs
          git checkout 76737eefe16a0feb2fdf729c805d17b5cdcdc376 -- data/workflow-permission-policy.json

      - name: Validate reconciled candidate
        run: |
          set -euo pipefail
          node scripts/legacy-reference-inventory-audit.mjs
          node scripts/legacy-reference-path-contract-test.js
          node scripts/cache-bust.js
          node scripts/app-search-surface-source-contract.mjs
          npm run workflows:check
          npm run control-plane:audit
          git diff --check

      - name: Validate final bounded diff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          expected = {
              'data/legacy-reference-ledger/manifest.json',
              'data/legacy-reference-ledger/references-1.json',
              'data/legacy-reference-ledger/references-2.json',
              'data/legacy-reference-ledger/references-3.json',
              'data/legacy-reference-ledger/references-4.json',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', '2ec30d22029f2f7e32f13b3d210357554064757f'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unbounded final ledger diff: {sorted(changed)}')
          forbidden = [path for path in changed if path.startswith('.github/workflows/') or path.startswith('scripts/tmp_')]
          if forbidden:
              raise SystemExit(f'temporary paths survived: {sorted(forbidden)}')
          PY
          git diff --check

      - name: Commit exact reconciled ledger
        shell: bash
        env:
          EXPECTED_BASE: 76737eefe16a0feb2fdf729c805d17b5cdcdc376
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_BASE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(search): reconcile legacy reference ledger"
          test -z "$(git status --porcelain)"
          git push origin "HEAD:${HEAD_REF}"
