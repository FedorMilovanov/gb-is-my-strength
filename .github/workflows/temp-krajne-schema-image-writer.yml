name: TEMP Krajne Schema Image Writer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-krajne-schema-image-writer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-krajne-schema-image-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded Krajne schema patch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          node scripts/temp-krajne-schema-image-patch.mjs
          rm scripts/temp-krajne-schema-image-patch.mjs
          rm .github/workflows/temp-krajne-schema-image-writer.yml
          node --check scripts/schema-rich-results-audit.js
          node --check scripts/schema-image-dimensions-mutation-test.mjs
          git diff --check
      - name: Commit final repair surface
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/article-pilots/krajne/KrajnePageHead.astro scripts/temp-krajne-schema-image-patch.mjs .github/workflows/temp-krajne-schema-image-writer.yml
          git commit -m "fix(schema): align Krajne ImageObject with published binary"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git push origin "HEAD:${BRANCH}"
