name: Temporary Reader R6 Materializer

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-reader-r6-materialize.yml"
      - "scripts/_temp_reader_r6_patch.part*"

permissions:
  contents: write

concurrency:
  group: temp-reader-r6-materialize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Detect pending payload
        id: payload
        shell: bash
        run: |
          if test -f scripts/_temp_reader_r6_patch.part00; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Reader R6 payload already materialized."
          fi

      - name: Set up Node.js 22
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assemble and apply exact core patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/_temp_reader_r6_patch.part00 \
              scripts/_temp_reader_r6_patch.part01 \
              scripts/_temp_reader_r6_patch.part02 \
              scripts/_temp_reader_r6_patch.part03 \
            > /tmp/reader-r6.patch.gz.b64
          printf '%s  %s\n' \
            'aa06c7484bf9f9a71d1133ad866f3f3417dec033d0dd202dac792a4d046ab227' \
            '/tmp/reader-r6.patch.gz.b64' \
            | sha256sum -c -
          base64 --decode /tmp/reader-r6.patch.gz.b64 > /tmp/reader-r6.patch.gz
          printf '%s  %s\n' \
            '077e019faaf157ffac04d93d0df1aab107b2b925a4a71acac63498fbd594e607' \
            '/tmp/reader-r6.patch.gz' \
            | sha256sum -c -
          gzip --decompress --stdout /tmp/reader-r6.patch.gz > /tmp/reader-r6.patch
          printf '%s  %s\n' \
            '6daee36ca0200f419728e69a38914cd9e83b1772a5dc529e0aa1e953a005702d' \
            '/tmp/reader-r6.patch' \
            | sha256sum -c -
          patch -p1 --batch --forward < /tmp/reader-r6.patch
          test ! -e js/reader-state.js.rej
          test ! -e scripts/reader-state-regression-test.js.rej
          rm -f scripts/_temp_reader_r6_patch.part00 \
                scripts/_temp_reader_r6_patch.part01 \
                scripts/_temp_reader_r6_patch.part02 \
                scripts/_temp_reader_r6_patch.part03

      - name: Install project dependencies
        if: steps.payload.outputs.present == 'true'
        run: npm ci

      - name: Synchronize generated asset revisions
        if: steps.payload.outputs.present == 'true'
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Run R6 permanent contracts
        if: steps.payload.outputs.present == 'true'
        run: |
          node --check js/reader-state.js
          node --check js/bookmark-engine.js
          node --check js/floating-cluster-controller.js
          node --check scripts/engine-sweep.mjs
          node scripts/reader-state-regression-test.js
          node scripts/reader-preferences-regression-test.js
          node scripts/runtime-integrity-test.js
          node scripts/overlay-runtime-contract-test.js
          npm run engine:contracts
          npm run astro:check

      - name: Run repository audit and remove generated report
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-pro.js
          git clean -f -- audit/audit-pro-*.md
          node scripts/cache-bust.js

      - name: Verify permanent scope
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -f js/reader-state.js
          test -f scripts/reader-state-regression-test.js
          test ! -e scripts/_temp_reader_r6_patch.part00
          test ! -e scripts/_temp_reader_r6_patch.part01
          test ! -e scripts/_temp_reader_r6_patch.part02
          test ! -e scripts/_temp_reader_r6_patch.part03
          git diff --check
          git status --short

      - name: Commit permanent R6 transaction
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows/_temp-reader-r6-materialize.yml'
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] feat(reader): unify progress and resume state"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
