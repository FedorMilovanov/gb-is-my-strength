name: Patch TTS audit allowlist once

on:
  push:
    branches:
      - lane/system-tts-polish-2026-08-04
    paths:
      - ".github/workflows/patch-tts-audit-allowlist-once.yml"

permissions:
  contents: write

concurrency:
  group: patch-tts-audit-allowlist-once
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/system-tts-polish-2026-08-04
          fetch-depth: 0

      - name: Register the attested Worker and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path('scripts/audit-pro.js')
          text = audit.read_text(encoding='utf-8')
          old = "  'js/vosk-tts-engine.js',\n  'js/vosk-stress-lookup.js',"
          new = "  'js/vosk-tts-engine.js',\n  'js/vosk-tts-worker.js',\n  'js/vosk-stress-lookup.js',"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one canonical ALLOWED_JS insertion point, found {text.count(old)}')
          audit.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-tts-audit-allowlist-once.yml').unlink()
          PY
          node --check scripts/audit-pro.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-pro.js .github/workflows/patch-tts-audit-allowlist-once.yml
          git commit -m "fix(audit): register attested Vosk worker"
          git push origin "HEAD:lane/system-tts-polish-2026-08-04"
