# Temporary, branch-scoped source-derived index proof. Remove before release.
# Never writes a commit, branch ref or protected production branch.
name: G3 history index generator witness (temporary)
on:
  push:
    branches:
      - lane/g3-history-publication-20261122
    paths:
      - .github/workflows/g3-history-index-witness.yml
permissions:
  contents: write
jobs:
  generate-index-blob:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.1
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute canonical source index generator and verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/build-scripture-occurrence-index.mjs --write
          node scripts/build-scripture-occurrence-index.mjs --check
          mkdir -p reports
          git diff --numstat -- data/scripture-search-index.json | tee reports/g3-index-change-counts.txt
      - name: Register exact generated bytes as an unreferenced Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const content = fs.readFileSync('data/scripture-search-index.json', 'utf8');
          const endpoint = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/git/blobs`;
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              Accept: 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'g3-history-index-witness',
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ content, encoding: 'utf-8' }),
          });
          const result = await response.json();
          if (!response.ok || !/^[a-f0-9]{40}$/.test(result.sha || '')) throw new Error(`Git blob registration failed: ${response.status} ${JSON.stringify(result).slice(0,300)}`);
          fs.writeFileSync('reports/g3-index-blob-sha.txt', result.sha + '\n');
          console.log(`Generated index: ${Buffer.byteLength(content)} bytes; blob SHA=${result.sha}; branch remains untouched`);
          NODE
      - name: Upload generator provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: g3-history-generated-index-blob
          path: |
            reports/g3-index-blob-sha.txt
            reports/g3-index-change-counts.txt
          if-no-files-found: error
          retention-days: 2
