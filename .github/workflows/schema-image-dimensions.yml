# Permanent binary-backed proof for V09-KRAJNE-SCHEMA-IMAGE-DIMENSIONS.
name: Schema Image Dimensions Contract

on:
  pull_request:
    paths:
      - 'src/components/article-pilots/krajne/KrajnePageHead.astro'
      - 'scripts/schema-rich-results-audit.js'
      - 'scripts/schema-image-dimensions-mutation-test.mjs'
      - '.github/workflows/schema-image-dimensions.yml'
      - 'images/**'
      - 'public/images/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-image-dimensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Binary header + JSON-LD mutation contract
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Install dependencies
        run: npm ci
      - name: Syntax check schema guards
        run: |
          node --check scripts/schema-rich-results-audit.js
          node --check scripts/schema-image-dimensions-mutation-test.mjs
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Validate schema against published binary headers
        run: npm run schema:rich-results:audit:dist
      - name: Prove false dimensions fail closed
        run: node scripts/schema-image-dimensions-mutation-test.mjs
