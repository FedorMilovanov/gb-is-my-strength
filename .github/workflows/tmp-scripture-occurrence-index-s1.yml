name: Complete Scripture occurrence index S1

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: scripture-occurrence-index-s1-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build-index:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/scripture-occurrence-index-s1-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact S1 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Guard exact base and source-owner blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "83875378a31436e235f1296f13d22c816b2945df"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git rev-parse HEAD:data/search-manifest.json)" = "952cfbd8b276fc7e877a784660fb4481dc8bd83f"
          test "$(git rev-parse HEAD:data/bible/books.json)" = "1df1830241657e13efba43ebd27397dbdc46bbc7"
          test "$(git rev-parse HEAD:migration/page-ownership.json)" = "364e4ebfeb439061fcdb1311f3be9e4cc5a1b00d"
          test "$(git rev-parse HEAD:src/lib/bible-reference-core.mjs)" = "2b270eb31a7e8dccc100e263b877a522e500abdb"
          test "$(git rev-parse HEAD:scripts/lib/route-source-contract.js)" = "07592264d058898884dd4958ff3c7d469db074ef"
          test "$(git rev-parse HEAD:scripts/build-scripture-occurrence-index.mjs)" = "ebf07cb4fd900af9abcfe12138c5afd8e26cb755"
          test "$(git rev-parse HEAD:scripts/scripture-occurrence-index-contract.mjs)" = "eb98d3c42166594c82bae19baa6985f843dc119d"
          test "$(git rev-parse HEAD:.github/workflows/scripture-occurrence-index-contract.yml)" = "c32fbd1f05d8ba2f0b3c8b8a8c5cc8fe14a892a8"
          test -f .github/workflows/tmp-scripture-occurrence-index-s1.yml
          test ! -e data/scripture-search-index.json
      - name: Set up canonical Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Write deterministic source-owned index
        run: |
          set -euo pipefail
          node --check scripts/build-scripture-occurrence-index.mjs
          node --check scripts/scripture-occurrence-index-contract.mjs
          node scripts/build-scripture-occurrence-index.mjs --write
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs
      - name: Prepare self-cleaned bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-scripture-occurrence-index-s1.yml
          git diff --check origin/main
          { git diff --name-only origin/main; git ls-files --others --exclude-standard; } | sort -u > "${RUNNER_TEMP}/changed.txt"
          cat > "${RUNNER_TEMP}/expected.txt" <<'EOF'
          .github/workflows/scripture-occurrence-index-contract.yml
          data/scripture-search-index.json
          scripts/build-scripture-occurrence-index.mjs
          scripts/scripture-occurrence-index-contract.mjs
          EOF
          sort -o "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/expected.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/changed.txt"
          while IFS= read -r changed; do
            case "${changed}" in
              *tts*|*TTS*|*vosk*|*Vosk*) echo "Forbidden TTS/Vosk path: ${changed}"; exit 1 ;;
            esac
          done < "${RUNNER_TEMP}/changed.txt"
      - name: Validate protected owners and publication witness
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          probe_tree="$(git write-tree)"
          probe_head="$(printf '%s\n' 'Scripture occurrence S1 shared-files probe' | git commit-tree "${probe_tree}" -p HEAD)"
          node scripts/guard-shared-files.js --base origin/main --head "${probe_head}" --branch "${HEAD_REF}"
          git reset
          npm run guard:agents-rev
          npm run strangler:build:production-like
          npm run pagefind:build:dist
          node scripts/search-index-policy-inventory.js --dist=dist --strict
          node scripts/scripture-occurrence-index-contract.mjs --dist=dist
          npm run sw:dist:audit
      - name: Validate full static publication barrier
        run: npm run validate:static-publication
      - name: Verify final candidate remains bounded
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main
          { git diff --name-only origin/main; git ls-files --others --exclude-standard; } | sort -u > "${RUNNER_TEMP}/changed-after.txt"
          diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/changed-after.txt"
      - name: Commit clean permanent S1 index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No Scripture occurrence S1 candidate generated'; exit 1; }
          git commit -m 'feat(search): generate Scripture occurrence index S1'
          git push origin "HEAD:${HEAD_REF}"
