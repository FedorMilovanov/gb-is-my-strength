name: Genesis 6 system transaction finalizer

on:
  pull_request:
    paths:
      - '.genesis6-system/**'
      - '.github/workflows/genesis6-system-finalize.yml'
      - 'tmp-genesis6-system-finalize-trigger.txt'
      - '.github/workflows/genesis6-research-provenance.yml'
      - 'data/genesis6-research-provenance.json'
      - 'data/series-theme-registry.json'
      - 'scripts/genesis6-research-provenance-contract.mjs'

permissions:
  contents: write

concurrency:
  group: genesis6-system-finalize-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/system-genesis6-provenance-theme-2026-07-25'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact lane head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify staging boundary
        shell: bash
        env:
          BASE_SHA: f4c60ecbc15b9a6bd5353f9d1c0d81d2d72b6b3e
        run: |
          set -euo pipefail
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          unexpected="$(git diff --name-only "$BASE_SHA"..HEAD | grep -Ev '^(.genesis6-system/(apply.mjs|manuscript.css)|.github/workflows/genesis6-(system-finalize|research-provenance).yml|tmp-genesis6-system-finalize-trigger.txt|data/(genesis6-research-provenance|series-theme-registry).json|scripts/genesis6-research-provenance-contract.mjs)$' || true)"
          test -z "$unexpected" || { printf 'Unexpected staging paths:\n%s\n' "$unexpected" >&2; exit 1; }

      - name: Apply deterministic shared migration
        run: |
          set -euo pipefail
          node .genesis6-system/apply.mjs
          node scripts/cache-bust.js --write
          git add -A
          git diff --check --cached

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Run shared system contracts
        run: |
          set -euo pipefail
          node scripts/check-workflows.js
          npm run workflows:lint
          node scripts/repository-control-plane-audit.mjs
          npm run engine:contracts
          npm run series:facade:guard
          node scripts/public-surface-registry-audit.js
          node scripts/series-capability-route-name-regression-test.js
          npm run tokens:check
          npm run css:layer:validate
          node scripts/validate.js --strict
          node scripts/audit-pro.js

      - name: Commit clean permanent tree
        shell: bash
        run: |
          set -euo pipefail
          find audit -maxdepth 1 -type f -name 'audit-pro-*.md' -delete
          rm -rf .genesis6-system
          rm -f .github/workflows/genesis6-system-finalize.yml
          rm -f tmp-genesis6-system-finalize-trigger.txt
          git add -A
          ! git diff --cached --name-only | grep -E '(^|/)(.genesis6-system|genesis6-system-finalize|tmp-genesis6-system-finalize)'
          git config user.name 'Genesis 6 System Finalizer'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m '[LANE lane/system-genesis6-provenance-theme-2026-07-25] system(genesis6): pin Research authority and register manuscript theme'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
