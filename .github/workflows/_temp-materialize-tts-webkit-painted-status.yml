name: Temporary TTS WebKit Painted Status Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-tts-webkit-painted-status.yml'
      - 'scripts/_temp-materialize-tts-webkit-painted-status.mjs'
      - 'js/floating-cluster-controller.js'
      - 'scripts/tts-engine-status-contract-test.js'
      - 'scripts/tts-status-route-browser-test.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-tts-webkit-painted-status-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/tts-webkit-painted-status-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/tts-webkit-painted-status-2026-07-25
          fetch-depth: 0

      - name: Detect completed transaction
        id: transaction
        run: |
          if grep -Fq 'function scheduleVoskWarmupAfterBrowserStatus()' js/floating-cluster-controller.js; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22.12
        if: steps.transaction.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        if: steps.transaction.outputs.skip != 'true'
        run: npm ci

      - name: Apply exact WebKit painted-status transaction
        if: steps.transaction.outputs.skip != 'true'
        run: |
          mkdir -p reports
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp-materialize-tts-webkit-painted-status.mjs')
          source = path.read_text(encoding='utf-8')
          count = source.count('\n  `')
          if count < 10:
              raise SystemExit(f'guarded writer raw-template normalization found only {count} candidates')
          source = source.replace('\n  `', '\n  String.raw`')
          source = source.replace('{0,1200}fallbackTtsNoticeStylesApplied', '{0,3200}fallbackTtsNoticeStylesApplied', 1)
          source = source.replace('{0,500}TTS_NOTICE_STYLE_TIMEOUT_MS', '{0,1800}TTS_NOTICE_STYLE_TIMEOUT_MS', 1)
          source = source.replace('{0,2600}setTimeout', '{0,8000}setTimeout', 1)
          source = source.replace(
              r"function waitForFallbackTtsNoticePaint\(\)[\s\S]{0,1000}fallbackBrowserStatusPainted",
              r"function waitForFallbackTtsNoticePaint\(\)[\s\S]{0,260}return ensureFallbackTtsNoticeStyles\(\)\.then[\s\S]{0,1200}fallbackBrowserStatusPainted",
              1,
          )
          source = source.replace(
              """    window.__engineScriptAppendCount = 0;
    const nativeHeadAppendChild = HTMLHeadElement.prototype.appendChild;""",
              """    window.__engineScriptAppendCount = 0;
    window.__engineScriptAppendAt = 0;
    window.__browserStatusPaintedAt = 0;
    function captureBrowserStatusPaint() {
      if (window.__browserStatusPaintedAt) return;
      const el = document.querySelector('.gb-tts-download-notice[data-state=\"browser\"].is-visible');
      if (el) {
        const style = getComputedStyle(el);
        if (style.position === 'fixed' && style.visibility === 'visible' && Number.parseFloat(style.opacity) >= 0.99) {
          window.__browserStatusPaintedAt = performance.now();
          return;
        }
      }
      requestAnimationFrame(captureBrowserStatusPaint);
    }
    requestAnimationFrame(captureBrowserStatusPaint);
    const nativeHeadAppendChild = HTMLHeadElement.prototype.appendChild;""",
              1,
          )
          source = source.replace(
              """        window.__engineScriptAppendCount += 1;
      }""",
              """        window.__engineScriptAppendCount += 1;
        if (!window.__engineScriptAppendAt) window.__engineScriptAppendAt = performance.now();
      }""",
              1,
          )
          source = source.replace("    const paintedAt = Date.now();\n", "", 1)
          source = source.replace(
              """    const postPaintDelay = Date.now() - paintedAt;
    assert.ok(postPaintDelay >= 650, 'post-paint dwell was only ' + postPaintDelay + 'ms');""",
              """    const timing = await page.evaluate(() => ({
      paintedAt: window.__browserStatusPaintedAt,
      engineAt: window.__engineScriptAppendAt,
    }));
    assert.ok(timing.paintedAt > 0, 'browser paint timestamp was not captured');
    assert.ok(timing.engineAt > 0, 'engine append timestamp was not captured');
    const postPaintDelay = timing.engineAt - timing.paintedAt;
    assert.ok(postPaintDelay >= 700, 'browser-local post-paint dwell was only ' + postPaintDelay + 'ms');""",
              1,
          )
          path.write_text(source, encoding='utf-8')
          PY
          set -o pipefail
          node scripts/_temp-materialize-tts-webkit-painted-status.mjs 2>&1 | tee reports/tts-webkit-materializer.log

      - name: Validate source contracts
        if: steps.transaction.outputs.skip != 'true'
        run: |
          node scripts/tts-engine-status-contract-test.js
          node scripts/tts-download-consent-contract-test.js
          node scripts/cache-bust.js

      - name: Build production-like dist
        if: steps.transaction.outputs.skip != 'true'
        run: npm run strangler:build:production-like

      - name: Install Chromium and WebKit
        if: steps.transaction.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Run notice browser contract
        if: steps.transaction.outputs.skip != 'true'
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/tts-download-notice-browser-test.js 2>&1 | tee reports/tts-notice-browser.log

      - name: Run lifecycle browser contract
        if: steps.transaction.outputs.skip != 'true'
        run: |
          set -o pipefail
          node scripts/tts-engine-lifecycle-browser-test.js 2>&1 | tee reports/tts-lifecycle.log

      - name: Run real-route delayed-CSS contract
        if: steps.transaction.outputs.skip != 'true'
        run: |
          set -o pipefail
          node scripts/tts-status-route-browser-test.js 2>&1 | tee reports/tts-webkit-painted-status.log

      - name: Run mobile geometry contract
        if: steps.transaction.outputs.skip != 'true'
        run: |
          set -o pipefail
          node scripts/tts-mobile-notice-geometry-browser-test.js 2>&1 | tee reports/tts-mobile-geometry.log

      - name: Re-run Gill shared-controller traversal
        if: steps.transaction.outputs.skip != 'true'
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: npm run gill:pre-v16-submenu:audit

      - name: Verify revisions and final diff
        if: steps.transaction.outputs.skip != 'true'
        run: |
          node scripts/cache-bust.js
          git diff --check
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-tts-webkit-painted-status.yml

      - name: Publish tested product commit
        if: steps.transaction.outputs.skip != 'true'
        env:
          TARGET_BRANCH: fix/tts-webkit-painted-status-2026-07-25
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(tts): wait for painted system-voice status on WebKit'
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Upload WebKit painted-status evidence
        if: always() && steps.transaction.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tts-webkit-painted-status-${{ github.run_id }}
          path: |
            reports/tts-webkit-materializer.log
            reports/tts-notice-browser.log
            reports/tts-lifecycle.log
            reports/tts-webkit-painted-status.log
            reports/tts-mobile-geometry.log
            reports/tts-route-*.png
            reports/tts-lifecycle-*.png
            reports/tts-download-notice-*.png
            reports/gill-pre-v16-submenu-audit/
          if-no-files-found: warn
          retention-days: 14
