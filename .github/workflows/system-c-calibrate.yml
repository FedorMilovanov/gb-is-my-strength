name: SYSTEM C one-shot print calibration

on:
  push:
    branches:
      - fix/note-publication-truth-20260810

permissions:
  contents: write

jobs:
  calibrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/note-publication-truth-20260810
          fetch-depth: 0
      - name: Calibrate physical publication witness
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/print-pagination-contract.mjs')
          s = p.read_text()

          def once(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {s.count(old)}')
              s = s.replace(old, new, 1)

          once("const MARKERS = join(OUT, 'markers');\nconst MUTATION = join(OUT, 'mutation');",
               "const MARKERS = join(OUT, 'markers');\nconst NOTE_MARKERS = join(OUT, 'note-markers');\nconst MUTATION = join(OUT, 'mutation');",
               'note marker dir')

          once("const BASE_ROUTES = [\n  ['gill-part1', '/articles/dzhon-gill-chast-1-chelovek/'],\n  ['gill-part2', '/articles/dzhon-gill-chast-2-uchenyi/'],\n  ['heart-book', '/articles/novoe-serdce/'],\n  ['baptist-series', '/baptisty-rossii/podpolnaya-pechat/'],\n  ['single-article', '/articles/hermenevticheskaya-otsenka-hristotsentrichnoy-germenevtiki/']\n];",
               "const BASE_ROUTES = [\n  ['gill-part1', '/articles/dzhon-gill-chast-1-chelovek/'],\n  ['gill-part2', '/articles/dzhon-gill-chast-2-uchenyi/'],\n  ['heart-book', '/articles/novoe-serdce/'],\n  ['baptist-series', '/baptisty-rossii/podpolnaya-pechat/'],\n  ['single-article', '/articles/hermenevticheskaya-otsenka-hristotsentrichnoy-germenevtiki/']\n];\nconst PAGINATION_ROUTE_URLS = new Set(BASE_ROUTES.map(([, url]) => url));",
               'pagination authority')

          once("await mkdir(MARKERS, { recursive: true });\nawait mkdir(MUTATION, { recursive: true });",
               "await mkdir(MARKERS, { recursive: true });\nawait mkdir(NOTE_MARKERS, { recursive: true });\nawait mkdir(MUTATION, { recursive: true });",
               'mkdir note markers')

          once("    const [id, url, routeNotes = []] = ROUTES[routeIndex];\n    const context",
               "    const [id, url, routeNotes = []] = ROUTES[routeIndex];\n    const enforcePaginationMarkers = PAGINATION_ROUTE_URLS.has(url);\n    const context",
               'route mode')

          once("    const printNoteState = routeNotes.length ? await page.evaluate((expectedIds) => {\n      const failures = [];\n      for (const id of expectedIds) {\n        const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${id}\"]`);\n        const style = item ? getComputedStyle(item) : null;\n        const rect = item?.getBoundingClientRect();\n        if (!item) failures.push(`${id}: endnote missing in print DOM`);\n        else if (!style || style.display === 'none' || style.visibility === 'hidden' || !rect || rect.width <= 8 || rect.height <= 4) {\n          failures.push(`${id}: endnote hidden in print media (${style?.display || 'missing'}/${style?.visibility || 'missing'})`);\n        }\n      }\n      return { visible: expectedIds.length - failures.length, total: expectedIds.length, failures: failures.slice(0, 20) };\n    }, routeNotes.map((note) => note.id)) : null;",
               "    const printNoteState = routeNotes.length ? await page.evaluate((expected) => {\n      const failures = [];\n      const normalize = (value) => String(value || '').normalize('NFKC').replace(/\\s+/g, ' ').replace(/\\s+([,.;:!?…])/g, '$1').trim();\n      for (const note of expected) {\n        const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${note.id}\"]`);\n        const content = item?.querySelector('.gb-note-endnotes__content');\n        const style = item ? getComputedStyle(item) : null;\n        const contentStyle = content ? getComputedStyle(content) : null;\n        const rect = item?.getBoundingClientRect();\n        const contentRect = content?.getBoundingClientRect();\n        if (!item) failures.push(`${note.id}: endnote missing in print DOM`);\n        else if (!style || style.display === 'none' || style.visibility === 'hidden' || !rect || rect.width <= 8 || rect.height <= 4) {\n          failures.push(`${note.id}: endnote hidden in print media (${style?.display || 'missing'}/${style?.visibility || 'missing'})`);\n        } else if (!content || !contentStyle || contentStyle.display === 'none' || contentStyle.visibility === 'hidden' || !contentRect || contentRect.width <= 8 || contentRect.height <= 0) {\n          failures.push(`${note.id}: canonical note body hidden in print media`);\n        } else if (normalize(content.textContent) !== normalize(note.text)) {\n          failures.push(`${note.id}: canonical note body text drift`);\n        }\n      }\n      return { visible: expected.length - failures.length, total: expected.length, failures: failures.slice(0, 20) };\n    }, routeNotes.map((note) => ({ id: note.id, text: note.text }))) : null;",
               'print note state')

          once("    if (atomicMissing.length) report.failures.push(`${id}: ${atomicMissing.length} atomic PDF markers missing`);\n    if (atomicSplits.length) report.failures.push(`${id}: ${atomicSplits.length} atomic components split across pages`);\n    if (pairMissing.length) report.failures.push(`${id}: ${pairMissing.length} keep-pair PDF markers missing`);\n    if (pairSplits.length) report.failures.push(`${id}: ${pairSplits.length} keep-with-next pairs split across pages`);",
               "    if (enforcePaginationMarkers && atomicMissing.length) report.failures.push(`${id}: ${atomicMissing.length} atomic PDF markers missing`);\n    if (enforcePaginationMarkers && atomicSplits.length) report.failures.push(`${id}: ${atomicSplits.length} atomic components split across pages`);\n    if (enforcePaginationMarkers && pairMissing.length) report.failures.push(`${id}: ${pairMissing.length} keep-pair PDF markers missing`);\n    if (enforcePaginationMarkers && pairSplits.length) report.failures.push(`${id}: ${pairSplits.length} keep-with-next pairs split across pages`);",
               'legacy pagination matrix')

          old = """    const cleanPdf = join(OUT, `${id}.pdf`);
    const cleanTxt = join(OUT, `${id}.txt`);
    await page.pdf({ path: cleanPdf, format: 'A4', printBackground: true, preferCSSPageSize: true });
    execFileSync('pdftotext', ['-layout', cleanPdf, cleanTxt]);
    const cleanPdfText = await readFile(cleanTxt, 'utf8');
    const missingNotes = missingPublicationNotes(cleanPdfText, routeNotes);
    if (missingNotes.length) {
      report.failures.push(`${id}: physical PDF missing ${missingNotes.length}/${routeNotes.length} publication note bodies: ${JSON.stringify(missingNotes.slice(0, 8).map((note) => note.id))}`);
    }

    if (routeNotes.length && !mutationWitnessDone) {
      const mutationNote = selectMutationNote(routeNotes);
      const mutationApplied = mutationNote ? await page.evaluate((noteId) => {
        const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${noteId}\"]`);
        if (!item) return false;
        item.dataset.gbNotePrintMutation = 'hidden';
        item.style.setProperty('display', 'none', 'important');
        return true;
      }, mutationNote.id) : false;
      if (!mutationApplied || !mutationNote) {
        report.failures.push(`${id}: could not install publication-note mutation witness`);
      } else {
        const mutationPdf = join(MUTATION, `${id}-missing-note.pdf`);
        const mutationTxt = join(MUTATION, `${id}-missing-note.txt`);
        await page.pdf({ path: mutationPdf, format: 'A4', printBackground: true, preferCSSPageSize: true });
        execFileSync('pdftotext', ['-layout', mutationPdf, mutationTxt]);
        const mutationText = await readFile(mutationTxt, 'utf8');
        const mutationMissing = missingPublicationNotes(mutationText, routeNotes);
        const rejected = mutationMissing.some((note) => note.id === mutationNote.id);
        report.mutationWitness = {
          route: url,
          noteId: mutationNote.id,
          rejected,
          missingNoteIds: mutationMissing.map((note) => note.id),
          pdf: `mutation/${id}-missing-note.pdf`,
        };
        if (!rejected) report.failures.push(`${id}: physical note-removal mutation was not rejected`);
        await page.evaluate((noteId) => {
          const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${noteId}\"]`);
          if (!item) return;
          item.style.removeProperty('display');
          delete item.dataset.gbNotePrintMutation;
        }, mutationNote.id);
        mutationWitnessDone = true;
      }
    }
"""
          new = """    const cleanPdf = join(OUT, `${id}.pdf`);
    const cleanTxt = join(OUT, `${id}.txt`);
    await page.pdf({ path: cleanPdf, format: 'A4', printBackground: true, preferCSSPageSize: true });
    execFileSync('pdftotext', ['-layout', cleanPdf, cleanTxt]);
    const cleanPdfText = await readFile(cleanTxt, 'utf8');
    const textProbeMissingNotes = missingPublicationNotes(cleanPdfText, routeNotes);

    const noteTokens = routeNotes.map((note, index) => ({
      id: note.id,
      token: `GBNOTE_R${routeIndex}_N${index}`,
    }));
    let missingNotes = [];
    if (noteTokens.length) {
      const tokenInstall = await page.evaluate((entries) => {
        const missing = [];
        for (const entry of entries) {
          const content = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${entry.id}\"] .gb-note-endnotes__content`);
          if (!content) { missing.push(entry.id); continue; }
          const token = document.createElement('span');
          token.className = 'gb-note-print-audit-token';
          token.setAttribute('aria-hidden', 'true');
          token.style.cssText = 'font:1px/1px monospace!important;color:rgba(0,0,0,.01)!important;white-space:nowrap!important;';
          token.textContent = ` ${entry.token} `;
          content.append(token);
        }
        return missing;
      }, noteTokens);
      if (tokenInstall.length) report.failures.push(`${id}: could not install physical note-body witnesses: ${JSON.stringify(tokenInstall.slice(0, 8))}`);
      const notePdf = join(NOTE_MARKERS, `${id}.pdf`);
      const noteTxt = join(NOTE_MARKERS, `${id}.txt`);
      await page.pdf({ path: notePdf, format: 'A4', printBackground: true, preferCSSPageSize: true });
      execFileSync('pdftotext', ['-layout', notePdf, noteTxt]);
      const notePdfText = await readFile(noteTxt, 'utf8');
      missingNotes = routeNotes.filter((note, index) => !notePdfText.includes(noteTokens[index].token));
      if (missingNotes.length) {
        report.failures.push(`${id}: physical PDF missing ${missingNotes.length}/${routeNotes.length} canonical note-body witnesses: ${JSON.stringify(missingNotes.slice(0, 8).map((note) => note.id))}`);
      }
    }

    if (routeNotes.length && !mutationWitnessDone) {
      const mutationNote = selectMutationNote(routeNotes);
      const mutationIndex = mutationNote ? routeNotes.findIndex((note) => note.id === mutationNote.id) : -1;
      const mutationToken = mutationIndex >= 0 ? noteTokens[mutationIndex]?.token : '';
      const mutationApplied = mutationNote ? await page.evaluate((noteId) => {
        const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${noteId}\"]`);
        if (!item) return false;
        item.dataset.gbNotePrintMutation = 'hidden';
        item.style.setProperty('display', 'none', 'important');
        return true;
      }, mutationNote.id) : false;
      if (!mutationApplied || !mutationNote || !mutationToken) {
        report.failures.push(`${id}: could not install publication-note mutation witness`);
      } else {
        const mutationPdf = join(MUTATION, `${id}-missing-note.pdf`);
        const mutationTxt = join(MUTATION, `${id}-missing-note.txt`);
        await page.pdf({ path: mutationPdf, format: 'A4', printBackground: true, preferCSSPageSize: true });
        execFileSync('pdftotext', ['-layout', mutationPdf, mutationTxt]);
        const mutationText = await readFile(mutationTxt, 'utf8');
        const missingTokenIds = noteTokens.filter((entry) => !mutationText.includes(entry.token)).map((entry) => entry.id);
        const rejected = !mutationText.includes(mutationToken)
          && noteTokens.filter((entry) => entry.id !== mutationNote.id).every((entry) => mutationText.includes(entry.token));
        report.mutationWitness = {
          route: url,
          noteId: mutationNote.id,
          rejected,
          missingNoteIds: missingTokenIds,
          pdf: `mutation/${id}-missing-note.pdf`,
        };
        if (!rejected) report.failures.push(`${id}: physical note-removal mutation was not rejected atomically`);
        await page.evaluate((noteId) => {
          const item = document.querySelector(`[data-note-registry-endnotes] li[data-note-id=\"${noteId}\"]`);
          if (!item) return;
          item.style.removeProperty('display');
          delete item.dataset.gbNotePrintMutation;
        }, mutationNote.id);
        mutationWitnessDone = true;
      }
    }
    await page.evaluate(() => document.querySelectorAll('.gb-note-print-audit-token').forEach((node) => node.remove()));
"""
          once(old, new, 'physical note witness')

          once("      missingPublicationNoteIds: missingNotes.map((note) => note.id),\n      markerPdf: `markers/${id}.pdf`,",
               "      missingPublicationNoteIds: missingNotes.map((note) => note.id),\n      textProbeMissingPublicationNoteIds: textProbeMissingNotes.map((note) => note.id),\n      paginationAuthority: enforcePaginationMarkers,\n      noteMarkerPdf: routeNotes.length ? `note-markers/${id}.pdf` : null,\n      markerPdf: `markers/${id}.pdf`,",
               'report fields')

          p.write_text(s)
          PY
      - name: Commit calibrated contract and remove applicator
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/system-c-calibrate.yml
          git add scripts/print-pagination-contract.mjs
          git diff --cached --check
          git commit -m "test(print): separate note publication from pagination markers"
          git push origin HEAD:fix/note-publication-truth-20260810
