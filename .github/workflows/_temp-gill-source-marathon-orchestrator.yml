name: Temp Gill source marathon orchestrator

on:
  workflow_run:
    workflows: ["Shared Files Guard"]
    types: [completed]
    branches:
      - agent/gill-source-marathon

permissions:
  contents: write

concurrency:
  group: temp-gill-source-marathon-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  transaction:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch == 'agent/gill-source-marathon'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact Gill branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Apply native source correction transaction
        run: node scripts/gill-native-finalize.js

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate native sources
        run: |
          node scripts/route-source-contract-audit.js --strict
          npm run astro:check

      - name: Validate static publication
        run: npm run validate:static-publication

      - name: Commit verified native Gill corpus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'content(gill): finalize native source-backed corrections'
          git push origin HEAD:refs/heads/agent/gill-source-marathon
