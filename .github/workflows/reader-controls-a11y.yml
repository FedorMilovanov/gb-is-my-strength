# Exact-head reassertion after Gill semantic track-contract calibration.
name: Reader Controls Accessibility

on:
  pull_request:
    paths:
      - "src/components/reader-platform/ReaderActionsRuntime.astro"
      - "src/runtime/reader-controls-a11y.js"
      - "src/components/article-pilots/_shared/ReaderRail.astro"
      - "src/components/article-pilots/_shared/SiteSectionsMenu.astro"
      - "src/components/article-pilots/_shared/series/SeriesReaderChrome.astro"
      - "src/components/article-pilots/gill-series/GillSeriesRail.astro"
      - "src/components/article-pilots/gill-series/GillPartTocOverlay.astro"
      - "scripts/reader-controls-a11y-browser-contract.mjs"
      - "scripts/reader-controls-residual-browser-contract.mjs"
      - "scripts/reader-speedrail-ssr-focus-browser-test.mjs"
      - "scripts/shared-play-and-series-number-browser-contract.cjs"
      - "scripts/reader-mobile-canonical-browser-contract.cjs"
      - "src/components/article-pilots/_shared/speedSlot.ts"
      - "src/components/article-pilots/_shared/ReaderMobileMenuTrigger.astro"
      - "src/runtime/reader-tts-defaults.js"
      - "src/runtime/reader-tts.js"
      - "scripts/reader-speed-preferences-contract.cjs"
      - "scripts/reader-speed-persistence-browser-contract.mjs"
      - "scripts/reader-real-assets-visual-matrix.mjs"
      - "scripts/baptisty-archival-media-real-visual-contract.mjs"
      - "js/floating-cluster-controller.js"
      - "css/floating-cluster.css"
      - "css/site.css"
      - ".github/workflows/reader-controls-a11y.yml"
  push:
    branches: [main]
    paths:
      - "src/components/reader-platform/ReaderActionsRuntime.astro"
      - "src/runtime/reader-controls-a11y.js"
      - "src/components/article-pilots/_shared/ReaderRail.astro"
      - "src/components/article-pilots/_shared/SiteSectionsMenu.astro"
      - "src/components/article-pilots/_shared/series/SeriesReaderChrome.astro"
      - "src/components/article-pilots/gill-series/GillSeriesRail.astro"
      - "src/components/article-pilots/gill-series/GillPartTocOverlay.astro"
      - "scripts/reader-controls-a11y-browser-contract.mjs"
      - "scripts/reader-controls-residual-browser-contract.mjs"
      - "scripts/reader-speedrail-ssr-focus-browser-test.mjs"
      - "scripts/shared-play-and-series-number-browser-contract.cjs"
      - "scripts/reader-mobile-canonical-browser-contract.cjs"
      - "src/components/article-pilots/_shared/speedSlot.ts"
      - "src/components/article-pilots/_shared/ReaderMobileMenuTrigger.astro"
      - "src/runtime/reader-tts-defaults.js"
      - "src/runtime/reader-tts.js"
      - "scripts/reader-speed-preferences-contract.cjs"
      - "scripts/reader-speed-persistence-browser-contract.mjs"
      - "scripts/reader-real-assets-visual-matrix.mjs"
      - "scripts/baptisty-archival-media-real-visual-contract.mjs"
      - "js/floating-cluster-controller.js"
      - "css/floating-cluster.css"
      - "css/site.css"
      - ".github/workflows/reader-controls-a11y.yml"

permissions:
  contents: read

concurrency:
  group: reader-controls-a11y-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium + Firefox + WebKit Reader controls and real-asset contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Install exact dependencies and browsers
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit firefox

      - name: Syntax and source boundary
        run: |
          node --check src/runtime/reader-controls-a11y.js
          node --check scripts/reader-controls-a11y-browser-contract.mjs
          node --check scripts/reader-controls-residual-browser-contract.mjs
          node --check scripts/reader-speedrail-ssr-focus-browser-test.mjs
          node --check scripts/reader-library-premium-browser-contract.cjs
          node --check scripts/shared-play-and-series-number-browser-contract.cjs
          node --check scripts/reader-mobile-canonical-browser-contract.cjs
          node --check src/runtime/reader-tts-defaults.js
          node --check src/runtime/reader-tts.js
          node --check scripts/reader-speed-preferences-contract.cjs
          node --check scripts/reader-speed-persistence-browser-contract.mjs
          node --check scripts/reader-real-assets-visual-matrix.mjs
          node --check scripts/baptisty-archival-media-real-visual-contract.mjs
          node scripts/reader-speed-preferences-contract.cjs
          node --check js/floating-cluster-controller.js
          grep -F "import '../../runtime/reader-controls-a11y.js';" src/components/reader-platform/ReaderActionsRuntime.astro
          ! grep -q "GBReaderProjection\|FavoriteStore" src/runtime/reader-controls-a11y.js

      - name: Build production-like dist
        run: |
          mkdir -p reports
          set -o pipefail
          npm run strangler:build:production-like 2>&1 | tee reports/reader-controls-a11y-build.log

      - name: Run permanent browser contracts
        run: |
          set -o pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/reader-controls-a11y-browser-contract.mjs 2>&1 | tee reports/reader-controls-a11y-browser-contract.log
          GITHUB_SHA="$(git rev-parse HEAD)" node scripts/reader-controls-residual-browser-contract.mjs 2>&1 | tee reports/reader-controls-residual-browser-contract.log
          SOURCE_SHA="$(git rev-parse HEAD)" node scripts/reader-speedrail-ssr-focus-browser-test.mjs 2>&1 | tee reports/reader-speedrail-ssr-focus.log
          node scripts/reader-library-premium-browser-contract.cjs 2>&1 | tee reports/reader-library-premium-browser-contract.log
          node scripts/shared-play-and-series-number-browser-contract.cjs 2>&1 | tee reports/shared-play-and-series-number-browser-contract.log
          node scripts/reader-mobile-canonical-browser-contract.cjs 2>&1 | tee reports/reader-mobile-canonical-browser-contract.log
          node scripts/reader-speed-persistence-browser-contract.mjs 2>&1 | tee reports/reader-speed-persistence-browser-contract.log
          GB_READER_REAL_ASSETS_FAST=1 node scripts/reader-real-assets-visual-matrix.mjs 2>&1 | tee reports/reader-real-assets-visual-matrix.log
          node scripts/baptisty-archival-media-real-visual-contract.mjs 2>&1 | tee reports/baptisty-archival-media-real-visual-contract.log

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-controls-a11y-${{ github.run_id }}
          path: |
            reports/reader-controls-a11y-build.log
            reports/reader-controls-a11y-browser-contract.log
            reports/reader-controls-a11y-browser-contract.json
            reports/reader-controls-a11y-browser-contract.md
            reports/reader-controls-a11y-*.png
            reports/reader-controls-residual-browser-contract.log
            reports/reader-controls-residual-browser-contract.json
            reports/reader-controls-residual-browser-contract.md
            reports/reader-speedrail-ssr-focus.log
            reports/reader-speedrail-ssr-focus/**
            reports/reader-library-premium-browser-contract.log
            reports/shared-play-and-series-number-browser-contract.log
            reports/reader-mobile-canonical-browser-contract.log
            reports/reader-speed-persistence-browser-contract.log
            reports/reader-real-assets-visual-matrix.log
            reports/reader-real-assets/**
            reports/baptisty-archival-media-real-visual-contract.log
            reports/baptisty-archival-media/**
            reports/reader-p1-menu-*.png
            reports/reader-library-premium/*.png
          if-no-files-found: warn
          retention-days: 14
