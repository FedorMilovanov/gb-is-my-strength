name: Repair Nagornaya confirmed dark residual

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: nagornaya-dark-confirmed-pr-881
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.number == 881 && github.event.pull_request.head.ref == 'system/nagornaya-dark-confirmed-20260804'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact Product branch
        uses: actions/checkout@v4
        with:
          ref: system/nagornaya-dark-confirmed-20260804
          fetch-depth: 0

      - name: Guard exact Product base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "f9d0120718569c510833dba7a3abd68ce2f6a003"
          git merge-base --is-ancestor origin/main HEAD

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply bounded owner-level repair
        shell: bash
        run: python3 .github/tmp/nagornaya_dark_repair.py

      - name: Install exact dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate source, native build and Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm run nagornaya:visual-parity:audit
          npm run strangler:build:production-like
          node scripts/nagornaya-epistemic-ui-browser-test.mjs
          npm run guard:shared-files
          npm run validate:static-publication

      - name: Self-clean and enforce final scope
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/nagornaya_dark_repair.py
          rm -f .github/workflows/tmp-nagornaya-dark-source-map.yml
          git diff --check
          expected="$(printf '%s\n' public/css/site.css scripts/nagornaya-epistemic-ui-browser-test.mjs scripts/nagornaya-visual-parity-audit.js | sort)"
          actual="$(git diff --name-only origin/main | sort)"
          test "${actual}" = "${expected}"

      - name: Commit bounded repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(nagornaya): repair confirmed dark contrast residual'
          git push origin HEAD:system/nagornaya-dark-confirmed-20260804
