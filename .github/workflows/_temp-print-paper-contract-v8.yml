name: TEMP Print Paper Contract Final

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-print-paper-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 235
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Merge current main before materialization
        run: |
          git fetch origin main
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply final neutral paper contract
        run: |
          mkdir -p reports/print-paper
          node scripts/_temp-print-paper-comment-fix.mjs
          node --check scripts/_temp-print-template-fix.mjs
          node scripts/_temp-print-template-fix.mjs
          for script in \
            scripts/_temp-print-paper-contract.mjs \
            scripts/_temp-print-paper-followup.mjs \
            scripts/_temp-print-overflow-contract.mjs \
            scripts/_temp-print-a4-final.mjs; do
            node --check "$script"
          done
          set -o pipefail
          node scripts/_temp-print-paper-contract.mjs 2>&1 | tee reports/print-paper/materializer.log
          node scripts/_temp-print-paper-followup.mjs 2>&1 | tee reports/print-paper/followup.log
          node scripts/_temp-print-overflow-contract.mjs 2>&1 | tee reports/print-paper/overflow-contract.log
          node scripts/_temp-print-a4-final.mjs 2>&1 | tee reports/print-paper/a4-final.log
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Remove temporary scripts from product commit
        run: |
          find scripts -maxdepth 1 -name '_temp-print-*.mjs' -print0 | xargs -0 -r git rm -f
          test -z "$(find scripts -maxdepth 1 -name '_temp-print-*.mjs' -print)"
          git diff --check

      - name: Static architecture gates
        run: |
          node --check scripts/engine-sweep.mjs
          node --check js/site.js
          python3 -m py_compile scripts/print-paper-pdf-audit.py
          node scripts/reader-preferences-regression-test.js
          npm run gill:chrome:guard
          npm run css:layer:validate
          node scripts/audit-pro.js

      - name: Install Chromium and PDF tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Premium controls audit
        run: npm run audit:premium-controls

      - name: Playwright reader and print marathon
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/print-paper
        run: |
          set -o pipefail
          node scripts/engine-sweep.mjs 2>&1 | tee reports/print-paper/engine-sweep.log

      - name: Permanent raster and pagination audit
        run: python3 scripts/print-paper-pdf-audit.py reports/print-paper/reader-print-a4.pdf --out reports/print-paper

      - name: Verify permanent scope before commit
        run: |
          test -z "$(find scripts -maxdepth 1 -name '_temp-print-*.mjs' -print)"
          test "$(git diff -- css/site.css | grep -c 'margin: 14mm')" -ge 1
          git diff --check
          git status --short | tee reports/print-paper/product-status.txt

      - name: Commit permanent contract
        run: |
          git add -A
          git commit -m "fix(print): enforce neutral A4 paper contract"
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Upload print proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-paper-proof-final-${{ github.sha }}
          path: reports/print-paper
          if-no-files-found: warn
          retention-days: 7
