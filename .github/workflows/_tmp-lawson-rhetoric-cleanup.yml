name: Temporary Lawson rhetoric cleanup

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/lawson-theme-rhetoric-final
          fetch-depth: 0
      - name: Tighten remaining self-referential caveats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx')
          text = path.read_text(encoding='utf-8')
          reps = [
            ('Статья уже отмечала, что эта деталь зависит от читательских источников, — но именно она делает шестой пункт не риторическим, а фактическим:', 'Эта деталь зависит от читательских источников, но именно она делает шестой пункт не риторическим, а фактическим:', 1),
            ('Тот же разбор поднимает вопрос, который статья считает самым существенным из всех пропущенных в книге.', 'Тот же разбор поднимает самый существенный из вопросов, пропущенных в книге.', 1),
            ('Статья приводит список как ориентир, а не как экзамен: он не доказывает ни наличие, ни отсутствие покаяния у конкретного человека, а только задаёт вопросы, которые честнее задавать, чем не задавать.', 'Список здесь — ориентир, а не экзамен: он не устанавливает ни наличие, ни отсутствие покаяния у конкретного человека, а задаёт вопросы, которые честнее задать, чем обойти.', 1),
            ('Статья принимает это возражение как реальное — и всё же не считает его исчерпывающим, по одной причине.', 'Возражение весомое, но не исчерпывающее по одной причине.', 1),
            ('Статья по-прежнему не утверждает, что Лоусон добивался этого приглашения: источник говорит, что организаторы внесли его преждевременно и он отказался.', 'Приписывать инициативу Лоусону оснований нет: источник говорит, что организаторы внесли его преждевременно и он отказался.', 1),
            ('Статья приводит это не как обвинение: организаторы объяснили публикацию внутренним недопониманием, а Лоусон отказался, как только узнал. Но факт остаётся фактом —', 'Организаторы объяснили публикацию внутренним недопониманием, а Лоусон отказался, как только узнал. Но факт остаётся фактом —', 1),
            ('Ни один из трёх источников не располагает финансовыми данными Лоусона, и статья не выдаёт оценки за расчёты.', 'Ни один из трёх источников не располагает финансовыми данными Лоусона, поэтому оценки дохода остаются оценками.', 1),
            ('Статья приводит это не как характеристику Лоусона — про него никто из участников так не говорит, — а как меру, которая одинакова для всех:', 'Про Лоусона никто из участников так не говорит. Это общий критерий, одинаковый для всех:', 1),
            ('Статья приводит формулировку как принадлежащую её автору и не присоединяется к ней.', 'Формулировка остаётся мнением автора рецензии; независимого основания превращать её в диагноз нет.', 1),
            ('Статья фиксирует отсутствие публичного заявления, а не наличие злого умысла.', 'Документировано отсутствие публичного заявления, а не злой умысел.', 1),
            ('Статья фиксирует её существование как факт о площадке и не связывает её ни с кем из участников истории.', 'Достоверен сам факт карточки; связывать её с кем-либо из участников истории оснований нет.', 1),
            ('От приглашения он отказался, и статья не превращает чужую поспешность в его план.', 'От приглашения он отказался; чужая поспешность не становится его планом.', 1),
            ('Статья разделяет два действия: поспешность организаторов, опубликовавших имя до ответа, и поспешность тех, кто разносил новость без проверки.', 'Нужно разделять два действия: поспешность организаторов, опубликовавших имя до ответа, и поспешность тех, кто разносил новость без проверки.', 1),
            ('<strong>Граница этого раздела.</strong> Носитель один. Независимого подтверждения эпизода нет: ни одно издание не сообщило о комментарии, и сама платформа не позволяет проверить авторство аккаунта. Автор выпуска сам говорит, что личность комментатора нельзя верифицировать полностью, и ограничивается мнением. Авторство комментария не установлено. По доступному носителю можно установить лишь, что такой комментарий был, что его отредактировали и что одинаковый текст распространялся на нескольких каналах.', '<strong>Граница этого раздела.</strong> Носитель один, независимого подтверждения нет, а платформа не позволяет проверить владельца аккаунта. По доступному носителю можно установить лишь, что такой комментарий был, что его отредактировали и что одинаковый текст распространялся на нескольких каналах.', 1),
            ('<p><strong>Граница.</strong> Точных цифр продаж нет ни у кого из сторон. Точных цифр продаж нет; значок «первое место» сам по себе не доказывает коммерческий успех.</p>', '<p><strong>Граница.</strong> Точных цифр продаж нет; значок «первое место» сам по себе не доказывает коммерческий успех.</p>', 1),
          ]
          for old, new, n in reps:
              c = text.count(old)
              if c != n:
                  raise SystemExit(f'expected {n}, found {c}: {old[:120]!r}')
              text = text.replace(old, new)
          if 'Статья ' in text:
              # Allow ordinary grammatical references only if none are self-referential editorial disclaimers.
              banned = ['Статья принимает', 'Статья приводит', 'Статья фиксирует', 'Статья по-прежнему', 'статья не выдаёт']
              hits = [x for x in banned if x in text]
              if hits:
                  raise SystemExit(f'remaining self-referential caveats: {hits}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx
          git commit -m 'edit(lawson): remove repetitive defensive caveats'
          git push origin HEAD:audit/lawson-theme-rhetoric-final
