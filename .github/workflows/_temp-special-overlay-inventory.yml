name: TEMP Special Overlay Writer Inventory

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Scan exact production writers and built references
        shell: bash
        run: |
          mkdir -p reports
          python3 - <<'PY' > reports/special-overlay-exact-inventory.txt
          import re
          import subprocess
          from pathlib import Path

          paths = subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')
          extensions = {'.js','.mjs','.cjs','.jsx','.ts','.tsx','.astro','.html'}
          excluded_prefixes = (
              'scripts/', 'docs/', '.github/', 'reports/', 'node_modules/',
              'archive/', 'projects/',
          )
          canonical = {'js/site-utils.js'}
          direct = re.compile(r'(document\.(?:body|documentElement))\.style\.(overflow|position|top|left|right|width|overscrollBehavior)\s*=')
          alias = re.compile(r'(?<![\w.])(body|html)\.style\.(overflow|position|top|left|right|width|overscrollBehavior)\s*=')
          assignment_hits = []
          signature_hits = []

          for raw in paths:
              if not raw:
                  continue
              path = Path(raw)
              if path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'konfessii-baptizm' in raw or any(token in text for token in ('MindMap3D','NIGHT_MAP_DATA_URL','special:mindmap3d:fullscreen','prevBodyOverscroll')):
                  signature_hits.append(raw)
              if raw in canonical or raw.startswith(excluded_prefixes):
                  continue
              seen = set()
              for kind, pattern in (('direct', direct), ('alias', alias)):
                  for match in pattern.finditer(text):
                      key = (match.start(), match.group(2))
                      if key in seen:
                          continue
                      seen.add(key)
                      line = text.count('\n', 0, match.start()) + 1
                      start = max(0, match.start() - 120)
                      end = min(len(text), match.end() + 180)
                      snippet = re.sub(r'\s+', ' ', text[start:end]).strip()
                      assignment_hits.append((raw, line, match.start(), kind, match.group(2), snippet))

          print('## Exact production body/html style assignments')
          if not assignment_hits:
              print('NONE')
          for raw, line, offset, kind, prop, snippet in sorted(assignment_hits):
              print(f'{raw}:{line} offset={offset} kind={kind} property={prop}')
              print(f'  {snippet[:420]}')

          print('\n## MindMap / konfessii-baptizm tracked files or references')
          for raw in sorted(set(signature_hits)):
              print(raw)

          print('\n## Counts')
          print(f'assignments={len(assignment_hits)}')
          print(f'mindmap_or_konfessii_files={len(set(signature_hits))}')
          PY
          cat reports/special-overlay-exact-inventory.txt

      - uses: actions/upload-artifact@v4
        with:
          name: special-overlay-exact-inventory
          path: reports/special-overlay-exact-inventory.txt
          retention-days: 1
