name: TEMP reader R5 overlay inventory

on:
  push:
    branches: [lane/reader-r5-overlay-runtime-2026-07-21]

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/reader-r5-overlay-runtime-2026-07-21
          fetch-depth: 0
      - name: Run overlay runtime inventory
        run: node scripts/_temp-reader-r5-inventory.js
      - name: Persist inventory evidence
        shell: bash
        run: |
          mkdir -p docs/refactor-2026/reader-platform
          cp reports/reader-r5-overlay-runtime-inventory.md docs/READER-R5-OVERLAY-RUNTIME-INVENTORY-2026-07-21.md
          cp reports/reader-r5-overlay-runtime-inventory.json docs/refactor-2026/reader-platform/reader-r5-overlay-runtime-inventory.json
          git add docs/READER-R5-OVERLAY-RUNTIME-INVENTORY-2026-07-21.md \
                  docs/refactor-2026/reader-platform/reader-r5-overlay-runtime-inventory.json
          if git diff --cached --quiet; then
            echo 'Inventory evidence already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research(reader): record R5 overlay runtime inventory'
          git push origin HEAD:lane/reader-r5-overlay-runtime-2026-07-21
      - name: Upload inventory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r5-overlay-runtime-inventory
          path: |
            reports/reader-r5-overlay-runtime-inventory.json
            reports/reader-r5-overlay-runtime-inventory.md
          if-no-files-found: warn
          retention-days: 1
