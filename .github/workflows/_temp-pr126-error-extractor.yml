name: TEMP PR126 Failure Extractor

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-pr126-failure-extractor
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[pr126-error]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: '88882712976'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0
      - name: Extract exact error context
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path('/tmp/job.log').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          patterns = re.compile(r'(npm ERR|AssertionError|Error:|FAILED|failed|not found|exit code|Process completed|visual:parity|engine:contracts|nagornaya:bar)', re.I)
          hits = []
          for i, line in enumerate(raw):
              if patterns.search(line):
                  lo = max(0, i - 5)
                  hi = min(len(raw), i + 9)
                  hits.extend(raw[lo:hi])
                  hits.append('---')
          # Keep order, remove exact duplicates while retaining separators.
          out = []
          seen = set()
          for line in hits:
              key = line if line == '---' else line.strip()
              if line != '---' and key in seen:
                  continue
              if line != '---':
                  seen.add(key)
              out.append(line)
          Path('.github/_temp-pr126-error-context.txt').write_text('\n'.join(out[-500:]) + '\n', encoding='utf-8')
          PY
      - name: Remove extractor and publish evidence
        shell: bash
        run: |
          rm -f .github/workflows/_temp-pr126-error-extractor.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[pr126-error] capture exact failure context'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
