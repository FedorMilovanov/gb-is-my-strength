name: Bible Reference Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "data/bible/**"
      - "src/lib/bible-reference-core.mjs"
      - "scripts/bible-reference-contract.mjs"
      - "scripts/bible-legacy-authority-regression-test.mjs"
      - "scripts/lib/a04-contract.mjs"
      - "js/site.js"
      - "css/site.css"
      - "docs/REFERENCE-TOOLTIP-CONTRACT.md"
      - ".github/workflows/bible-reference-contract.yml"
  push:
    branches: [main]
    paths:
      - "data/bible/**"
      - "src/lib/bible-reference-core.mjs"
      - "scripts/bible-reference-contract.mjs"
      - "scripts/bible-legacy-authority-regression-test.mjs"
      - "scripts/lib/a04-contract.mjs"
      - "js/site.js"
      - "css/site.css"
      - "docs/REFERENCE-TOOLTIP-CONTRACT.md"
      - ".github/workflows/bible-reference-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bible-reference-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bible-reference-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Prepare diagnostics
        run: mkdir -p reports
      - name: Validate syntax
        run: |
          node --check src/lib/bible-reference-core.mjs
          node --check scripts/bible-reference-contract.mjs
          node --check scripts/bible-legacy-authority-regression-test.mjs
      - name: Enforce strict Bible reference contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/bible-reference-contract.mjs --strict 2>&1 | tee reports/bible-reference-contract.log
      - name: Prove legacy authority fails closed
        shell: bash
        run: |
          set -o pipefail
          node scripts/bible-legacy-authority-regression-test.mjs 2>&1 | tee reports/bible-legacy-authority-regression.log
      - name: Lint workflow
        shell: bash
        run: |
          set -o pipefail
          node scripts/run-actionlint.mjs -no-color .github/workflows/bible-reference-contract.yml 2>&1 | tee reports/bible-reference-actionlint.log
      - name: Ensure validators restore a clean tree
        run: git diff --exit-code
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bible-reference-contract-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
