name: Home SearchAction Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/home/HomePageHead.astro'
      - 'src/components/home/HomePageChrome.astro'
      - 'src/components/home/HomeSearchA11yGuard.astro'
      - 'src/components/home/HomeSearchQueryEntry.astro'
      - 'src/pages/index.astro'
      - 'js/search.js'
      - 'data/search-manifest.json'
      - 'scripts/home-search-action-browser-contract.mjs'
      - '.github/workflows/home-search-action-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/home/HomePageHead.astro'
      - 'src/components/home/HomePageChrome.astro'
      - 'src/components/home/HomeSearchA11yGuard.astro'
      - 'src/components/home/HomeSearchQueryEntry.astro'
      - 'src/pages/index.astro'
      - 'js/search.js'
      - 'data/search-manifest.json'
      - 'scripts/home-search-action-browser-contract.mjs'
      - '.github/workflows/home-search-action-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-search-action:
    name: SearchAction opens and queries canonical Home search
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Validate source contracts
        run: |
          node --check scripts/home-search-action-browser-contract.mjs
          npm run astro:check

      - name: Materialize derived Scripture index diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/home-search-action
          node scripts/build-scripture-occurrence-index.mjs --write
          cp data/scripture-search-index.json reports/home-search-action/scripture-search-index.generated.json
          git diff --stat -- data/scripture-search-index.json | tee reports/home-search-action/scripture-search-index.diffstat.txt
          git checkout -- data/scripture-search-index.json

      - name: Build production-like publication
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate public SearchAction runtime
        run: node scripts/home-search-action-browser-contract.mjs --dist=dist --report=reports/home-search-action

      - name: Verify validation is read-only
        run: git diff --exit-code

      - name: Upload SearchAction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-search-action-${{ github.run_id }}
          path: reports/home-search-action/**
          if-no-files-found: warn
          retention-days: 14
