name: Home SearchAction Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/home/HomePageHead.astro'
      - 'src/components/home/HomePageChrome.astro'
      - 'src/components/home/HomeSearchA11yGuard.astro'
      - 'src/pages/index.astro'
      - 'js/search.js'
      - 'data/search-manifest.json'
      - 'scripts/home-search-action-browser-contract.mjs'
      - '.github/workflows/home-search-action-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/components/home/HomePageHead.astro'
      - 'src/components/home/HomePageChrome.astro'
      - 'src/components/home/HomeSearchA11yGuard.astro'
      - 'src/pages/index.astro'
      - 'js/search.js'
      - 'data/search-manifest.json'
      - 'scripts/home-search-action-browser-contract.mjs'
      - '.github/workflows/home-search-action-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-search-action:
    name: SearchAction opens and queries canonical Home search
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Validate source contracts
        run: |
          node --check scripts/home-search-action-browser-contract.mjs
          npm run astro:check

      - name: Build production-like publication
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate public SearchAction runtime
        run: node scripts/home-search-action-browser-contract.mjs --dist=dist --report=reports/home-search-action

      - name: Verify validation is read-only
        run: git diff --exit-code

      - name: Upload SearchAction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-search-action-${{ github.run_id }}
          path: reports/home-search-action/**
          if-no-files-found: warn
          retention-days: 14

  search-modal-compute:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/search-modal-contract-compute2-20260805'
    name: Compute exact SEARCH-P2-10/11/12 tree
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout exact compute branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/search-modal-contract-compute2-20260805
          fetch-depth: 0
          persist-credentials: false

      - name: Assert exact compute head
        run: test "$(git rev-parse HEAD)" = "$(git rev-parse origin/ci/search-modal-contract-compute2-20260805)"

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Apply exact assert-based reconciliation
        run: |
          node --check scripts/reconcile-search-modal-wave.mjs
          node scripts/reconcile-search-modal-wave.mjs
          node --check js/search.js
          node --check scripts/search-modal-browser-contract.mjs
          npm run astro:check

      - name: Verify helper changed only canonical runtime and CSS
        run: |
          expected="$(printf '%s\n' 'css/command-palette.css' 'js/search.js')"
          actual="$(git diff --name-only --diff-filter=ACMR | sort)"
          test "${actual}" = "${expected}"
          git diff --check

      - name: Build production-like publication
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Validate computed Search modal
        run: node scripts/search-modal-browser-contract.mjs --dist=dist --report=reports/search-modal-contract

      - name: Prepare exact final artifact
        run: |
          mkdir -p reports/search-modal-final
          sha256sum \
            js/search.js \
            css/command-palette.css \
            scripts/search-modal-browser-contract.mjs \
            .github/workflows/search-modal-contract.yml \
            > reports/search-modal-final/sha256.txt

      - name: Upload exact four-file final tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-modal-final-${{ github.run_id }}
          path: |
            js/search.js
            css/command-palette.css
            scripts/search-modal-browser-contract.mjs
            .github/workflows/search-modal-contract.yml
            reports/search-modal-final/sha256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload compute browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-modal-compute-evidence-${{ github.run_id }}
          path: reports/search-modal-contract/**
          if-no-files-found: warn
          retention-days: 14
