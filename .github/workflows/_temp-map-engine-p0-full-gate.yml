name: TEMP map-engine P0 full gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  full-gate:
    if: github.head_ref == 'lane/system-map-engine-p0-runtime-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Static publication barrier
        run: npm run validate:static-publication

      - name: Shared files barrier
        run: npm run guard:shared-files
