name: Search continuation diagnostics transaction once

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - 'scripts/search-continuation-diagnostics-applicator.mjs'
      - '.github/workflows/search-continuation-diagnostics-once.yml'

permissions:
  contents: write

jobs:
  apply-and-self-clean:
    if: github.event.pull_request.head.ref == 'fix/search-truthful-continuation-20260808-r1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/search-truthful-continuation-20260808-r1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'
      - name: Validate applicator syntax
        run: node --check scripts/search-continuation-diagnostics-applicator.mjs
      - name: Apply continuation failure diagnostics
        run: node scripts/search-continuation-diagnostics-applicator.mjs --write
      - name: Validate final browser contract
        run: |
          node --check scripts/search-modal-browser-contract.mjs
          node scripts/search-continuation-diagnostics-applicator.mjs
          git diff --check
      - name: Self-clean transport and push final tree
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/search-continuation-diagnostics-once.yml
          rm scripts/search-continuation-diagnostics-applicator.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(search): preserve continuation failure diagnostics"
          git push origin "HEAD:${HEAD_REF}"
