name: TEMP reader preferences integrator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Integrate reader assets into canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_integrate_reader_assets.py
          node scripts/cache-bust.js
          node scripts/reader-preferences-regression-test.js
          node scripts/audit-pro.js

      - name: Commit integrated reader assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audit-pro.js sw.js css/reader-preferences.css scripts/cache-bust-assets.js '*.html' 'articles/**/*.html' 'baptisty-rossii/**/*.html' 'karty/**/*.html' 'konfessii/**/*.html' 'nagornaya/**/*.html' 'src/**/*.astro' 'src/**/*.js' 'src/**/*.ts' 2>/dev/null || true
          git add -u
          git diff --cached --quiet && { echo 'no integrated changes'; exit 1; }
          git commit -m "[LANE lane/system-reader-preferences-foundation-2026-07-21] fix(reader): register shared assets and preserve route media"
          git push origin HEAD:lane/system-reader-preferences-foundation-2026-07-21
