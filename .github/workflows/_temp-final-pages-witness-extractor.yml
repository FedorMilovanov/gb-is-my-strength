name: TEMP Final Pages Witness Extractor

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-final-pages-witness-extractor
  cancel-in-progress: true

jobs:
  extract:
    if: github.head_ref == 'diagnostic/final-pages-witness-2026-07-22' || (github.ref_name == 'diagnostic/final-pages-witness-2026-07-22' && !contains(github.event.head_commit.message, '[final-witness]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: a6a783044af69b8cc019f6885368ad67aa6a19f2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0

      - name: Capture observer comments for exact head
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" > /tmp/comments.json
          jq --arg sha "$EXPECTED_SHA" '[.[] | select(.body | contains($sha)) | {id,created_at,updated_at,body,html_url}]' /tmp/comments.json > .github/_temp-final-pages-witness-comments.json
          test "$(jq 'length' .github/_temp-final-pages-witness-comments.json)" -ge 1

      - name: Remove extractor and publish evidence
        shell: bash
        run: |
          rm -f .github/workflows/_temp-final-pages-witness-extractor.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[final-witness] capture final Pages observer comments'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
