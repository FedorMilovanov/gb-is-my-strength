name: MapEngine Bootstrap Patch (temporary)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-exact-owner-patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/map-engine-correctness-bundle-20260807-r2'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact PR head with push credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Apply deterministic MapEngine owner patch
        run: python3 scripts/apply-map-engine-correctness-patch.py

      - name: Commit exact patched blob when needed
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          if git diff --quiet -- karty/_engine/map-engine.js; then
            echo 'MapEngine already has the expected patched blob; no bootstrap commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/_engine/map-engine.js
          git commit -m 'fix(karty): repair shared MapEngine correctness owner'
          git push origin "HEAD:${HEAD_REF}"
