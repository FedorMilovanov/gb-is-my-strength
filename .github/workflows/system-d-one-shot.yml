name: SYSTEM D one-shot writer lease bootstrap

on:
  push:
    branches:
      - fix/writer-lease-v1-20260810

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply bounded SYSTEM D transaction
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/system-d-patch.py
          python /tmp/system-d-patch.py
          node --check scripts/writer-lease.mjs
          node --check scripts/writer-lease-contract-test.mjs
          node --check scripts/check-workflows.js
          node scripts/writer-lease-contract-test.mjs
          node scripts/check-workflows.js
          node scripts/run-actionlint.mjs -no-color \
            .github/workflows/writer-lease-contract.yml \
            .github/workflows/glossary-contract.yml \
            .github/workflows/indexnow.yml \
            .github/workflows/search-manifest-policy.yml \
            .github/workflows/scripture-occurrence-index-contract.yml
          git diff --check

      - name: Commit and CAS-push exact transaction
        shell: bash
        env:
          HEAD_REF: fix/writer-lease-v1-20260810
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${HEAD_REF}" | awk '{print $1}')"
          if [[ "$REMOTE_HEAD" != "$GITHUB_SHA" ]]; then
            echo "SYSTEM D bootstrap lost exact head: remote=$REMOTE_HEAD event=$GITHUB_SHA" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/writer-lease.mjs \
            scripts/writer-lease-contract-test.mjs \
            scripts/check-workflows.js \
            data/workflow-permission-policy.json \
            docs/LANE_LOCK_POLICY.md \
            docs/BRANCH_LIFECYCLE_V4.md \
            .github/workflows/glossary-contract.yml \
            .github/workflows/indexnow.yml \
            .github/workflows/search-manifest-policy.yml \
            .github/workflows/scripture-occurrence-index-contract.yml \
            .github/workflows/writer-lease-contract.yml \
            .github/workflows/system-d-one-shot.yml
          git diff --cached --name-only
          git commit -m "fix(governance): enforce machine writer leases"
          git push --force-with-lease="refs/heads/${HEAD_REF}:${GITHUB_SHA}" origin "HEAD:${HEAD_REF}"
