name: Historical Image Preservation Export

on:
  pull_request:
    paths:
      - '.github/workflows/history-image-preservation-export.yml'

permissions:
  contents: read

jobs:
  export:
    name: Export historical-only images without mutation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branch and tag refs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --prune --no-recurse-submodules origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'

      - name: Materialize every historical-only image blob
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preserve/blobs preserve/meta
          git rev-list --objects --all > preserve/meta/reachable-objects.txt
          git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(rest)' \
            < preserve/meta/reachable-objects.txt > preserve/meta/object-metadata.txt
          git ls-tree -r --long refs/remotes/origin/main > preserve/meta/main-tip-tree.txt

          python3 - <<'PY'
          import csv, hashlib, json, subprocess
          from collections import defaultdict
          from pathlib import Path

          IMAGE_EXTS = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.avif',
              '.bmp', '.tif', '.tiff', '.heic', '.heif', '.ico'
          }

          current_oids = set()
          with open('preserve/meta/main-tip-tree.txt', encoding='utf-8', errors='replace') as f:
              for line in f:
                  left = line.split('\t', 1)[0].split()
                  if len(left) >= 3:
                      current_oids.add(left[2])

          rows = []
          with open('preserve/meta/object-metadata.txt', encoding='utf-8', errors='replace') as f:
              for line in f:
                  parts = line.rstrip('\n').split(' ', 3)
                  if len(parts) < 3 or parts[1] != 'blob':
                      continue
                  oid, _, size_s = parts[:3]
                  path = parts[3] if len(parts) == 4 else ''
                  ext = Path(path).suffix.lower()
                  if ext not in IMAGE_EXTS or oid in current_oids:
                      continue
                  rows.append((oid, int(size_s), path, ext))

          rows.sort(key=lambda x: x[1], reverse=True)
          manifest = []
          seen = set()
          for oid, size, path, ext in rows:
              if oid in seen:
                  continue
              seen.add(oid)
              data = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              if len(data) != size:
                  raise SystemExit(f'size mismatch for {oid}: expected {size}, got {len(data)}')
              out = Path('preserve/blobs') / f'{oid}{ext}'
              out.write_bytes(data)
              manifest.append({
                  'oid': oid,
                  'bytes': size,
                  'mib': round(size / 1024 / 1024, 3),
                  'representative_path': path,
                  'extension': ext,
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'archive_file': str(out.relative_to('preserve')),
              })

          expected_bytes = sum(r['bytes'] for r in manifest)
          actual_bytes = sum(p.stat().st_size for p in Path('preserve/blobs').iterdir() if p.is_file())
          if expected_bytes != actual_bytes:
              raise SystemExit(f'archive byte mismatch: expected {expected_bytes}, got {actual_bytes}')

          with open('preserve/MANIFEST.csv', 'w', newline='', encoding='utf-8') as f:
              fields = ['oid','bytes','mib','representative_path','extension','sha256','archive_file']
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(manifest)

          Path('preserve/MANIFEST.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          by_top = defaultdict(lambda: {'count': 0, 'bytes': 0})
          for r in manifest:
              path = r['representative_path']
              parts = path.split('/')
              key = '/'.join(parts[:2]) if len(parts) >= 2 else path
              by_top[key]['count'] += 1
              by_top[key]['bytes'] += r['bytes']

          summary = {
              'main_tip': subprocess.check_output(['git','rev-parse','refs/remotes/origin/main'], text=True).strip(),
              'historical_only_image_blobs': len(manifest),
              'bytes': expected_bytes,
              'mib': round(expected_bytes / 1024 / 1024, 3),
              'sha256_manifest_entries': len(manifest),
              'groups': [
                  {'group': k, 'count': v['count'], 'mib': round(v['bytes']/1024/1024, 3)}
                  for k, v in sorted(by_top.items(), key=lambda kv: kv[1]['bytes'], reverse=True)
              ],
          }
          Path('preserve/SUMMARY.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('preserve/README.txt').write_text(
              'Preservation export of every reachable image blob that is absent from the current main tip tree.\n'
              'Files are stored by Git blob OID; MANIFEST.csv/json maps each blob to its representative historical path and SHA-256.\n'
              'This archive is preservation evidence only. No Git history was rewritten by this workflow.\n',
              encoding='utf-8'
          )
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

          rm -f preserve/meta/reachable-objects.txt preserve/meta/object-metadata.txt preserve/meta/main-tip-tree.txt
          du -sh preserve

      - name: Upload preservation archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: historical-only-images-preservation-${{ github.run_id }}
          path: preserve
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30
