name: Temp Atlas path leak materializer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/retire-atlas-workspace-path-leak'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Replace workspace-specific documentation paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('docs/ATLAS-CONTRACT-2026-07-10.md'): (
                  '`AuditRepo/projects/gb-is-my-strength/incoming/claude-atlas-deep-audit/2026-07-10/ATLAS_DEEP_AUDIT_AND_MASTER_PLAN.md`',
                  '`FedorMilovanov/AuditRepo` → `projects/gb-is-my-strength/incoming/claude-atlas-deep-audit/2026-07-10/ATLAS_DEEP_AUDIT_AND_MASTER_PLAN.md`',
              ),
              Path('scripts/genealogy-build/README.md'): (
                  'AuditRepo `projects/gb-is-my-strength/incoming/claude-genealogy-atlas-strategy/2026-07-11/`.',
                  '`FedorMilovanov/AuditRepo` → `projects/gb-is-my-strength/incoming/claude-genealogy-atlas-strategy/2026-07-11/`.',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one workspace-specific path')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Prove path hygiene and publication audit
        shell: bash
        run: |
          if git grep -n -F 'AuditRepo/projects/gb-is-my-strength/' -- docs scripts; then
            echo 'workspace-specific AuditRepo path remains' >&2
            exit 1
          fi
          node scripts/audit-pro.js
          git diff --check
      - name: Commit documentation cleanup
        shell: bash
        run: |
          cat > /tmp/allowed.txt <<'EOF'
          docs/ATLAS-CONTRACT-2026-07-10.md
          scripts/genealogy-build/README.md
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          git add -A
          git diff --cached --name-only | sort > /tmp/staged.txt
          diff -u /tmp/allowed.txt /tmp/staged.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(atlas): replace workspace-specific AuditRepo paths'
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
