name: Atlas Avraam A11y Tabs Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/atlas-avraam-a11y-tabs-materialize.py'
      - '.github/workflows/atlas-avraam-a11y-tabs-materialize.yml'

concurrency:
  group: atlas-avraam-a11y-tabs-materialize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize exact bounded repair
        run: python3 scripts/atlas-avraam-a11y-tabs-materialize.py

      - name: Validate source and scope
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          node --check scripts/audit-browser-runtime-wave.mjs
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          engine=Path('karty/_engine/map-engine.js').read_text(encoding='utf-8')
          assert '<h1 class="me-intro__title">' not in engine
          assert engine.count('<h2 class="me-intro__title">') == 1
          assert engine.count("tabsEl.setAttribute('role','tablist')") == 1
          assert 'aria-selected="${selected?\'true\':\'false\'}"' in engine
          assert "candidate.tabIndex=selected?0:-1" in engine
          assert "event.stopPropagation();" in engine
          witness=Path('scripts/audit-browser-runtime-wave.mjs').read_text(encoding='utf-8')
          assert 'const rovingTabindex =' in witness
          PY
          expected=$'.github/workflows/atlas-avraam-a11y-tabs-materialize.yml\nkarty/_engine/map-engine.js\nscripts/atlas-avraam-a11y-tabs-materialize.py\nscripts/audit-browser-runtime-wave.mjs'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Commit permanent source and witness changes only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/_engine/map-engine.js scripts/audit-browser-runtime-wave.mjs
          git add -u scripts/atlas-avraam-a11y-tabs-materialize.py .github/workflows/atlas-avraam-a11y-tabs-materialize.yml
          git commit -m 'fix(atlas): give intro and panel tabs one a11y contract'
          git push origin "HEAD:${HEAD_REF}"
