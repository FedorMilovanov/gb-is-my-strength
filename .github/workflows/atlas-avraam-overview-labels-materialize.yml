name: Atlas Avraam Overview Labels Materialize

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/atlas-avraam-overview-labels-materialize.py'
      - '.github/workflows/atlas-avraam-overview-labels-materialize.yml'

concurrency:
  group: atlas-avraam-overview-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Materialize overview label repair
        run: python3 scripts/atlas-avraam-overview-labels-materialize.py

      - name: Validate bounded SVG and witness scope
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/avraam-reference-baseline.mjs
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('karty/avraam/base.svg')
          svg=Path('karty/avraam/base.svg').read_text(encoding='utf-8')
          assert 'x="360" y="555" font-size="26" transform="rotate(-8 360 555)">ВЕЛИКОЕ' in svg
          assert 'x="830" y="262" font-size="12" letter-spacing=".2em">ПАДАН-АРАМ' in svg
          assert 'x="520" y="1145" font-size="14" letter-spacing=".3em">СИНАЙ' in svg
          witness=Path('scripts/avraam-reference-baseline.mjs').read_text(encoding='utf-8')
          assert witness.count('overview labels outside safe area') == 1
          PY
          git diff --check
          expected=$'.github/workflows/atlas-avraam-overview-labels-materialize.yml\nkarty/avraam/base.svg\nscripts/atlas-avraam-overview-labels-materialize.py\nscripts/avraam-reference-baseline.mjs'
          actual="$(git status --short | sed -E 's/^.. //' | sort)"
          [[ "$actual" == "$expected" ]]

      - name: Commit permanent composition and witness changes only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/avraam/base.svg scripts/avraam-reference-baseline.mjs
          git add -u scripts/atlas-avraam-overview-labels-materialize.py .github/workflows/atlas-avraam-overview-labels-materialize.yml
          git commit -m 'fix(atlas): keep overview labels inside safe area'
          git push origin "HEAD:${HEAD_REF}"
