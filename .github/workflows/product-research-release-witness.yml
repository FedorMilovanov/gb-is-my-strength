name: Product to Research release witness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/product-research-release-witness.yml'
      - 'scripts/diotrophes-wave12-*.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/product-research-release-witness.yml'
      - 'data/diotrophes-wave10-product-draft.json'
      - 'data/diotrophes-wave11-faithful-witness-*.json'
      - 'data/diotrophes-wave12-release-manifest.json'
      - 'data/route-profiles/articles-diotrefy-nashego-vremeni.json'
      - 'data/route-search-policy.json'
      - 'data/search-manifest.json'
      - 'data/series.json'
      - 'data/links-graph.json'
      - 'data/visual-parity-baseline.json'
      - 'migration/page-ownership.json'
      - 'migration/route-migration-matrix.json'
      - 'src/components/article-pilots/diotrophes/**'
      - 'src/components/article-pilots/_shared/series/pastorSeriesConfig.ts'
      - 'src/components/pastor-series/**'
      - 'src/components/articles/ArticlesPublicationsSection.astro'
      - 'src/pages/articles/diotrefy-nashego-vremeni/**'
      - 'src/components/karty/ishod/**'
      - 'src/pages/karty/ishod/**'
      - 'karty/ishod/**'
      - 'karty/_engine/**'
      - 'scripts/diotrophes-wave10-contract.mjs'
      - 'scripts/diotrophes-wave11-faithful-witness-contract.mjs'
      - 'scripts/diotrophes-wave12-*.mjs'
      - 'scripts/pihahiroth-uncertainty-*.mjs'
      - 'scripts/rss-feed-normalizer.js'
      - 'scripts/sitemap-policy-normalizer.js'
      - 'scripts/links-graph-read-time-normalizer.js'
      - 'scripts/pastor-series-visual-parity-audit.js'
      - 'scripts/check-data-consistency.js'
      - 'scripts/public-surface-registry-regression-test.js'
      - 'scripts/search-index-policy-contract-test.js'
      - 'scripts/search-index-policy-inventory.js'
      - 'feed.xml'
      - 'sitemap.xml'
      - 'feed-pastor-series.xml'
      - 'sitemap-pastor-series.xml'
      - 'robots.txt'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: product-research-release-witness
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DIOTROPHES_WAVE12_PRE_WAVE12: 289cea9b1f8fb4284aac0c712e23e83fb25b00f0
      DIOTROPHES_WAVE12_RELEASE_BOUNDARY: fbd305a54ded904931275eb9510647994c32b5ea
      DIOTROPHES_WAVE12_HISTORICAL_VALIDATOR: aaf0ba7ff95afcd1c6f1488de9798c2a48b4386b
    steps:
      - name: Checkout exact complete Product history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies and browser witnesses
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Validate immutable and scoped Wave 12 transaction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/diotrophes-wave12-history-anchor-contract.mjs
          boundary_dir="${RUNNER_TEMP}/diotrophes-wave12-release-boundary"
          historical_validator="${RUNNER_TEMP}/diotrophes-wave12-historical-validator.mjs"
          rm -rf "$boundary_dir" "$historical_validator"
          git show "${DIOTROPHES_WAVE12_HISTORICAL_VALIDATOR}:scripts/diotrophes-wave12-release-contract.mjs" > "$historical_validator"
          node scripts/diotrophes-wave12-history-anchor-contract.mjs \
            --rebind-historical-validator "$historical_validator"
          git worktree add --detach "$boundary_dir" "$DIOTROPHES_WAVE12_RELEASE_BOUNDARY"
          cleanup_boundary() { git worktree remove --force "$boundary_dir" >/dev/null 2>&1 || true; }
          trap cleanup_boundary EXIT
          (cd "$boundary_dir" && node "$historical_validator")
          cleanup_boundary
          trap - EXIT
          node scripts/diotrophes-wave12-transaction-scope-contract.mjs

      - name: Validate current Wave 10 to 12 and canonical discovery authority
        run: |
          set -euo pipefail
          node scripts/diotrophes-wave10-contract.mjs
          node scripts/diotrophes-wave11-faithful-witness-contract.mjs
          node scripts/diotrophes-wave12-canonical-discovery-contract.mjs
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/links-graph-read-time-normalizer.js --check
          node scripts/pastor-series-visual-parity-audit.js
          node scripts/check-data-consistency.js
          node scripts/public-surface-registry-regression-test.js

      - name: Validate Pihahiroth authority and map projection
        run: |
          set -euo pipefail
          node scripts/pihahiroth-uncertainty-release-contract.mjs
          npm run maps:validate

      - name: Validate current registries types and publication policy
        run: |
          set -euo pipefail
          npm run migration:metadata:check:strict
          npm run page-ownership:check
          node scripts/search-index-policy-contract-test.js
          npm run astro:check

      - name: Build immutable production-like witness
        run: |
          set -euo pipefail
          npm run strangler:build:production-like
          npm run page-ownership:dist:production-like
          npm run pagefind:build:dist
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Run Pihahiroth desktop mobile and no-JS witness
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/pihahiroth-uncertainty
          node scripts/pihahiroth-uncertainty-browser-contract.mjs 2>&1 \
            | tee reports/pihahiroth-uncertainty/browser-run.log

      - name: Run Wave 12 Chromium WebKit no-JS and print witness
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports/diotrophes-wave12
          node scripts/diotrophes-wave12-browser-contract.mjs 2>&1 \
            | tee reports/diotrophes-wave12/browser-run.log

      - name: Prove source tree remained immutable
        run: git diff --exit-code

      - name: Upload combined release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-research-release-witness-${{ github.run_id }}
          path: |
            reports/pihahiroth-uncertainty/
            reports/diotrophes-wave12/
            reports/search-index-policy-inventory.json
            reports/search-index-policy-inventory.md
          if-no-files-found: warn
          retention-days: 30
