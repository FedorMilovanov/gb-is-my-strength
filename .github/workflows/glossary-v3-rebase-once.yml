name: One-shot glossary v3 rebase

on:
  push:
    branches:
      - feat/universal-glossary-final-v3-2026-07-24

permissions:
  contents: write

concurrency:
  group: one-shot-glossary-v3-rebase
  cancel-in-progress: true

jobs:
  transplant-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-glossary-final-v3-2026-07-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Transplant only the permanent glossary core
        run: |
          git fetch origin feat/universal-glossary-final-v2-2026-07-24
          core=(
            .github/workflows/glossary-contract.yml
            css/site.css
            data/glossary-policy.json
            docs/glossary-contract.md
            js/glossary.js
            js/site.js
            scripts/glossary-contract-audit.js
            scripts/glossary-placement-normalizer-test.js
            scripts/glossary-placement-normalizer.js
            scripts/glossary-runtime-browser-test.js
            scripts/reference-system-inventory.js
            scripts/tooltip-icon-audit.js
            scripts/tooltip-marker-browser-test.js
            scripts/tooltip-style-normalizer-test.js
            scripts/tooltip-style-normalizer.js
            scripts/tooltip-trigger-normalizer-test.js
            scripts/tooltip-trigger-normalizer.js
            src/components/article-pilots/krajne/KrajneBody.astro
          )
          git diff --binary 7a7db47301c157c588632afcfa991f13ff4e297b origin/feat/universal-glossary-final-v2-2026-07-24 -- "${core[@]}" > /tmp/glossary-core.patch
          test -s /tmp/glossary-core.patch
          git apply --3way --index /tmp/glossary-core.patch
      - name: Regenerate deterministic asset revisions
        run: node scripts/cache-bust.js --write
      - name: Validate transplanted core
        run: |
          node --check js/glossary.js
          node scripts/glossary-placement-normalizer-test.js
          node scripts/glossary-contract-audit.js
          node scripts/cache-bust.js
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/glossary-v3-rebase-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(glossary): rebuild universal core on current main'
          git push origin HEAD:feat/universal-glossary-final-v3-2026-07-24
