name: TEMP PR126 Failure 2 Extractor

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22

permissions:
  actions: read
  contents: write

concurrency:
  group: temp-pr126-error2-extractor
  cancel-in-progress: true

jobs:
  extract:
    if: ${{ !contains(github.event.head_commit.message, '[pr126-error2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      JOB_ID: '88885396076'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0
      - name: Extract exact error context
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" > /tmp/job.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          raw = Path('/tmp/job.log').read_text(encoding='utf-8-sig', errors='replace').splitlines()
          patterns = re.compile(r'(Traceback|SystemExit|unexpected current|anchor not found|cache-bust|SyntaxError|Error:|failed|Process completed|exit code)', re.I)
          indices = [i for i,line in enumerate(raw) if patterns.search(line)]
          chunks=[]
          for i in indices:
              chunks.extend(raw[max(0,i-8):min(len(raw),i+12)])
              chunks.append('---')
          Path('.github/_temp-pr126-error2-context.txt').write_text('\n'.join(chunks[-400:])+'\n', encoding='utf-8')
          PY
      - name: Remove extractor and publish evidence
        shell: bash
        run: |
          rm -f .github/workflows/_temp-pr126-error2-extractor.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[pr126-error2] capture exact failure context'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
