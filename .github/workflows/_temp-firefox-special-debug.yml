name: TEMP Firefox Special Overlay Diagnostic

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  firefox-debug:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Capture complete Firefox overlay log
        id: test
        env:
          PW_BROWSER: firefox
        shell: bash
        run: |
          set +e
          mkdir -p reports
          npm run overlay:browser:all > reports/firefox-special-overlay.log 2>&1
          status=$?
          cat reports/firefox-special-overlay.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-special-overlay-diagnostic
          path: reports/firefox-special-overlay.log
          retention-days: 1
      - if: steps.test.outputs.status != '0'
        run: exit 1
