name: Complete Home and tooltip runtime owners

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: home-tooltip-owners-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/home-webkit-content-box-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 40

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit

      - name: Adapt bounded helper for stacked tooltip owner
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/tmp/home_webkit_box_model.py")
          source = path.read_text(encoding="utf-8")
          replacements = [
              (
                  'ASSET_REGISTRY_PATH = Path("src/lib/asset-version.js")\n',
                  'ASSET_REGISTRY_PATH = Path("src/lib/asset-version.js")\n'
                  'TOOLTIP_PATH = Path("src/runtime/article-tooltips.js")\n'
                  'TOOLTIP_BLOB = "625d72d49f11272d8a436bb7afe9de7ac84dfd16"\n',
              ),
              (
                  '    expected = {HELPER_PATH.as_posix(), WORKFLOW_PATH.as_posix()}\n'
                  '    if initial != expected:\n',
                  '    expected = {HELPER_PATH.as_posix(), WORKFLOW_PATH.as_posix(), TOOLTIP_PATH.as_posix()}\n'
                  '    tooltip_blob = output("git", "rev-parse", f"HEAD:{TOOLTIP_PATH.as_posix()}")\n'
                  '    if tooltip_blob != TOOLTIP_BLOB:\n'
                  '        raise SystemExit(f"tooltip owner drifted: expected {TOOLTIP_BLOB}, got {tooltip_blob}")\n'
                  '    base_tooltip_blob = output("git", "rev-parse", f"{BASE_SHA}:{TOOLTIP_PATH.as_posix()}")\n'
                  '    if base_tooltip_blob == TOOLTIP_BLOB:\n'
                  '        raise SystemExit("stacked tooltip owner is not a real base delta")\n'
                  '    if initial != expected:\n',
              ),
              (
                  '    if CSS_PATH.as_posix() not in permanent:\n'
                  '        raise SystemExit("canonical CSS owner missing from candidate diff")\n',
                  '    if TOOLTIP_PATH.as_posix() not in permanent:\n'
                  '        raise SystemExit("canonical tooltip owner missing from candidate diff")\n'
                  '    tooltip_blob = output("git", "hash-object", TOOLTIP_PATH.as_posix())\n'
                  '    if tooltip_blob != TOOLTIP_BLOB:\n'
                  '        raise SystemExit(f"tooltip owner content drifted: expected {TOOLTIP_BLOB}, got {tooltip_blob}")\n'
                  '    if CSS_PATH.as_posix() not in permanent:\n'
                  '        raise SystemExit("canonical CSS owner missing from candidate diff")\n',
              ),
              (
                  '        if path == CSS_PATH.as_posix():\n'
                  '            continue\n',
                  '        if path in {CSS_PATH.as_posix(), TOOLTIP_PATH.as_posix()}:\n'
                  '            continue\n',
              ),
              (
                  '        "rootFix": "box-sizing:border-box on body.home-page .home-content",\n',
                  '        "rootFixes": [\n'
                  '            "box-sizing:border-box on body.home-page .home-content",\n'
                  '            "article tooltip hover transit begins on marker leave",\n'
                  '        ],\n',
              ),
              (
                  '    run("git", "commit", "-m", "fix(home): correct mobile content box geometry")\n',
                  '    run("git", "commit", "-m", "fix(runtime): correct Home box model and tooltip transit")\n',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"helper adaptation match count {count} for {old!r}")
              source = source.replace(old, new, 1)
          path.write_text(source, encoding="utf-8")

      - name: Apply bounded canonical fixes
        run: python3 .github/tmp/home_webkit_box_model.py apply

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Run Home Chromium and WebKit contracts
        run: node scripts/home-browser-contract.mjs

      - name: Run full interactive runtime audit
        run: npm run interactive-audit

      - name: Run full static publication barrier
        run: npm run validate:static-publication

      - name: Recheck read-only revision contract
        run: node scripts/cache-bust.js

      - name: Self-clean and publish permanent tree
        run: python3 .github/tmp/home_webkit_box_model.py finalize
