name: Complete Home WebKit box model

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: home-webkit-box-model-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/home-webkit-content-box-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 40

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit

      - name: Apply bounded canonical fix
        run: python3 .github/tmp/home_webkit_box_model.py apply

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Run Home Chromium and WebKit contracts
        run: node scripts/home-browser-contract.mjs

      - name: Trace source-to-dist WebKit cascade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/home-webkit-runtime
          sha256sum css/home.css dist/css/home.css > reports/home-webkit-runtime/home-css-sha256.txt
          grep -n -B2 -A6 'body.home-page .home-content{' css/home.css \
            > reports/home-webkit-runtime/source-home-content.txt
          grep -n -B2 -A6 'body.home-page .home-content{' dist/css/home.css \
            > reports/home-webkit-runtime/dist-home-content.txt
          python3 -m http.server 8079 --bind 127.0.0.1 -d dist \
            > reports/home-webkit-runtime/cascade-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { webkit } from 'playwright';

          const browser = await webkit.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 320, height: 568 } });
          await page.goto('http://127.0.0.1:8079/', { waitUntil: 'networkidle' });
          const report = await page.evaluate(() => {
            const node = document.querySelector('.home-content');
            if (!node) return { missing: true };
            const computed = getComputedStyle(node);
            const rect = node.getBoundingClientRect();
            const matched = [];
            const visit = (rules, owner) => {
              for (const rule of Array.from(rules || [])) {
                if ('cssRules' in rule && rule.cssRules) {
                  visit(rule.cssRules, owner);
                  continue;
                }
                if (!rule.selectorText || !rule.style) continue;
                let applies = false;
                try { applies = node.matches(rule.selectorText); } catch {}
                if (!applies) continue;
                const picked = {};
                for (const property of ['box-sizing', 'width', 'max-width', 'padding-left', 'padding-right', 'margin-left', 'margin-right']) {
                  const value = rule.style.getPropertyValue(property);
                  if (value) picked[property] = {
                    value,
                    priority: rule.style.getPropertyPriority(property),
                  };
                }
                if (Object.keys(picked).length) matched.push({ owner, selector: rule.selectorText, declarations: picked });
              }
            };
            for (const sheet of Array.from(document.styleSheets)) {
              let rules;
              try { rules = sheet.cssRules; } catch { continue; }
              visit(rules, sheet.href || 'inline');
            }
            return {
              rect: { left: rect.left, right: rect.right, width: rect.width },
              computed: {
                boxSizing: computed.boxSizing,
                width: computed.width,
                maxWidth: computed.maxWidth,
                paddingLeft: computed.paddingLeft,
                paddingRight: computed.paddingRight,
                marginLeft: computed.marginLeft,
                marginRight: computed.marginRight,
              },
              matched,
            };
          });
          fs.writeFileSync('reports/home-webkit-runtime/cascade.json', JSON.stringify(report, null, 2) + '\n');
          await browser.close();
          NODE

      - name: Run full interactive runtime audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/home-webkit-runtime
          python3 -m http.server 8080 --bind 127.0.0.1 -d dist > reports/home-webkit-runtime/http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          status=0
          AUDIT_BASE=http://127.0.0.1:8080 npm run interactive-audit 2>&1 \
            | tee reports/home-webkit-runtime/interactive-audit.log || status=$?
          printf '{"exitCode":%s,"sha":"%s"}\n' "$status" "$GITHUB_SHA" \
            > reports/home-webkit-runtime/result.json
          exit "$status"

      - name: Upload downstream runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-webkit-runtime-${{ github.run_id }}
          path: reports/home-webkit-runtime/
          if-no-files-found: warn
          retention-days: 14

      - name: Run full static publication barrier
        run: npm run validate:static-publication

      - name: Recheck read-only revision contract
        run: node scripts/cache-bust.js

      - name: Self-clean and publish permanent tree
        run: python3 .github/tmp/home_webkit_box_model.py finalize
