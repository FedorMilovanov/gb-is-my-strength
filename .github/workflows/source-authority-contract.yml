name: Source Authority Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_apply-tma-dateline-parity.py'
      - '.github/workflows/source-authority-contract.yml'

permissions:
  contents: write

concurrency:
  group: source-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-tma-dateline-parity:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/heart-post-merge-cleanup-2026-07-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/heart-post-merge-cleanup-2026-07-30
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed dateline migration
        run: python3 scripts/_apply-tma-dateline-parity.py

      - name: Validate durable contracts
        run: |
          python3 -m py_compile scripts/_apply-tma-dateline-parity.py
          node --check scripts/hard-texts-visual-parity-audit.js
          node scripts/hard-texts-visual-parity-audit.js
          grep -F '<span>Обн. 30 июля 2026</span>' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          test "$(grep -F -o '2026-07-30T00:00:00+03:00' src/components/article-pilots/tma-na-serdce/TmaNaSerdcePageHead.astro | wc -l)" -eq 2
          grep -F "modified: '2026-07-30'" src/components/article-pilots/tma-na-serdce/TmaNaSerdcePageHead.astro
          ! grep -F '2026-07-29T00:00:00+03:00' src/components/article-pilots/tma-na-serdce/TmaNaSerdcePageHead.astro
          git diff --check

      - name: Restore canonical workflow and remove migration tool
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-authority-contract.yml
          git rm scripts/_apply-tma-dateline-parity.py

      - name: Commit only durable project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-authority-contract.yml
          git add src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          git add src/components/article-pilots/tma-na-serdce/TmaNaSerdcePageHead.astro
          git add scripts/hard-texts-visual-parity-audit.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(heart): synchronize tma modified dateline"
          git push origin HEAD:agent/heart-post-merge-cleanup-2026-07-30
