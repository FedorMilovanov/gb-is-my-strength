name: Source Authority Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_apply-home-search-focus-contract.py'
      - '.github/workflows/source-authority-contract.yml'

permissions:
  contents: write

concurrency:
  group: source-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-home-search-focus-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/heart-post-merge-cleanup-2026-07-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/heart-post-merge-cleanup-2026-07-30
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed browser contract migration
        run: python3 scripts/_apply-home-search-focus-contract.py

      - name: Validate condition-based readiness
        run: |
          python3 -m py_compile scripts/_apply-home-search-focus-contract.py
          node --check scripts/home-browser-contract.mjs
          grep -F "const input = document.querySelector('.cp-input');" scripts/home-browser-contract.mjs
          grep -F "return input !== null && input === document.activeElement;" scripts/home-browser-contract.mjs
          git diff --check

      - name: Restore canonical workflow and remove migration tool
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-authority-contract.yml
          git rm scripts/_apply-home-search-focus-contract.py

      - name: Commit only durable project change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-authority-contract.yml
          git add scripts/home-browser-contract.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "test(home): wait for canonical search focus readiness"
          git push origin HEAD:agent/heart-post-merge-cleanup-2026-07-30
