name: Source Authority Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/lib/legacy-source-authority.js'
      - 'scripts/lib/route-source-contract.js'
      - 'scripts/content-coverage-audit.js'
      - 'scripts/check-data-consistency.js'
      - 'scripts/gill-context-visual-parity-audit.js'
      - 'scripts/gill-spravochnik-visual-parity-audit.js'
      - 'scripts/gill-reading-time-canonical-audit.js'
      - 'scripts/gill-pagefind-body-audit.js'
      - 'scripts/legacy-source-authority-regression-test.js'
      - 'data/route-profiles/**'
      - 'src/pages/articles/dzhon-gill-*/**'
      - 'src/components/article-pilots/gill-context/**'
      - 'src/components/article-pilots/gill-series/**'
      - 'src/components/article-pilots/gill-spravochnik/**'
      - '.github/workflows/source-authority-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/lib/legacy-source-authority.js'
      - 'scripts/lib/route-source-contract.js'
      - 'scripts/content-coverage-audit.js'
      - 'scripts/check-data-consistency.js'
      - 'scripts/gill-context-visual-parity-audit.js'
      - 'scripts/gill-spravochnik-visual-parity-audit.js'
      - 'scripts/gill-reading-time-canonical-audit.js'
      - 'scripts/gill-pagefind-body-audit.js'
      - 'scripts/legacy-source-authority-regression-test.js'
      - 'data/route-profiles/**'
      - 'src/pages/articles/dzhon-gill-*/**'
      - 'src/components/article-pilots/gill-context/**'
      - 'src/components/article-pilots/gill-series/**'
      - 'src/components/article-pilots/gill-spravochnik/**'
      - '.github/workflows/source-authority-contract.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: source-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-like-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Source authority regression
        run: node scripts/legacy-source-authority-regression-test.js

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Gill strict-native dist audits
        shell: bash
        run: |
          set -uo pipefail
          set +e
          mkdir -p reports/source-authority
          : > reports/source-authority/summary.log
          status=0

          run_audit() {
            local name="$1"
            shift
            printf '\n===== %s =====\n' "$name"
            "$@" 2>&1 | tee "reports/source-authority/${name}.log"
            local code=${PIPESTATUS[0]}
            if [ "$code" -ne 0 ]; then
              status=1
              printf 'FAILED %s (exit %s)\n' "$name" "$code" \
                | tee -a reports/source-authority/summary.log
            else
              printf 'PASSED %s\n' "$name" \
                | tee -a reports/source-authority/summary.log
            fi
          }

          run_audit gill-context \
            node scripts/gill-context-visual-parity-audit.js --require-dist
          run_audit gill-spravochnik \
            node scripts/gill-spravochnik-visual-parity-audit.js --require-dist
          run_audit gill-reading-time \
            node scripts/gill-reading-time-canonical-audit.js
          run_audit gill-pagefind-body \
            node scripts/gill-pagefind-body-audit.js
          run_audit data-consistency \
            node scripts/check-data-consistency.js

          exit "$status"

      - name: Full static publication gate
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          npm run validate:static-publication:light 2>&1 \
            | tee reports/source-authority-publication.log

      - name: Upload source authority diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-authority-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/source-authority
            reports/source-authority-publication.log
          if-no-files-found: error
          retention-days: 14

      - name: Ensure proof is read-only
        run: git diff --exit-code

  rogers-scan-provenance-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/heart-post-merge-cleanup-2026-07-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Fetch official Google Books metadata and scan evidence
        env:
          VOLUME_ID: yMRjAAAAcAAJ
        run: |
          set -euo pipefail
          mkdir -p reports/rogers-1691/pages
          curl --fail --location --retry 3 --retry-all-errors \
            "https://www.googleapis.com/books/v1/volumes/${VOLUME_ID}" \
            --output reports/rogers-1691/volume.json

          python3 - <<'PY'
          import json, os, pathlib, urllib.parse, urllib.request

          root = pathlib.Path('reports/rogers-1691')
          data = json.loads((root / 'volume.json').read_text())
          access = data.get('accessInfo', {})
          summary = {
              'id': data.get('id'),
              'title': data.get('volumeInfo', {}).get('title'),
              'publishedDate': data.get('volumeInfo', {}).get('publishedDate'),
              'viewability': access.get('viewability'),
              'publicDomain': access.get('publicDomain'),
              'pdf': access.get('pdf'),
              'epub': access.get('epub'),
              'webReaderLink': access.get('webReaderLink'),
          }
          (root / 'volume-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')

          queries = {
              'advice-1': 'Melancholly seizes on the Brain and Spirits',
              'advice-5': 'Do not urge your Friends under the Disease of Melancholly',
              'advice-6': 'Do not attribute the effects of mere Disease to the Devil',
          }
          for name, query in queries.items():
              url = 'https://books.google.com/books?' + urllib.parse.urlencode({
                  'jscmd': 'SearchWithinVolume2',
                  'q': query,
                  'vid': os.environ['VOLUME_ID'],
              })
              try:
                  with urllib.request.urlopen(url, timeout=45) as response:
                      payload = response.read()
                  (root / f'{name}-search.json').write_bytes(payload)
              except Exception as exc:
                  (root / f'{name}-search.error.txt').write_text(repr(exc), encoding='utf-8')

          pdf = access.get('pdf') or {}
          link = pdf.get('downloadLink')
          if link:
              (root / 'pdf-download-url.txt').write_text(link, encoding='utf-8')
          PY

          if [[ -s reports/rogers-1691/pdf-download-url.txt ]]; then
            PDF_URL="$(cat reports/rogers-1691/pdf-download-url.txt)"
            curl --fail --location --retry 3 --retry-all-errors "$PDF_URL" \
              --output reports/rogers-1691/rogers-1691.pdf || true
          fi

          if [[ -s reports/rogers-1691/rogers-1691.pdf ]] && head -c 5 reports/rogers-1691/rogers-1691.pdf | grep -q '%PDF'; then
            pdfinfo reports/rogers-1691/rogers-1691.pdf > reports/rogers-1691/pdfinfo.txt
            pdftotext -layout reports/rogers-1691/rogers-1691.pdf reports/rogers-1691/rogers-1691.txt
            python3 - <<'PY'
            import json, pathlib, re, subprocess

            root = pathlib.Path('reports/rogers-1691')
            pages = (root / 'rogers-1691.txt').read_text(errors='replace').split('\f')
            needles = {
                'advice-1': [r'Melancholly\s+seizes\s+on\s+the\s+Brain', r'incapacitates\s+them\s+for\s+Thought'],
                'advice-5': [r'Do\s+not\s+urge\s+your\s+Friends', r'bones\s+are\s+broken'],
                'advice-6': [r'Do\s+not\s+attribute\s+the\s+effects', r'mere\s+Disease.*Devil'],
            }
            found = {}
            for label, patterns in needles.items():
                hits = []
                for index, text in enumerate(pages, start=1):
                    normalized = re.sub(r'\s+', ' ', text)
                    if any(re.search(pattern, normalized, flags=re.I) for pattern in patterns):
                        hits.append(index)
                found[label] = hits
                for page in hits:
                    prefix = root / 'pages' / f'{label}-pdf-{page:04d}'
                    subprocess.run([
                        'pdftoppm', '-f', str(page), '-singlefile', '-png', '-r', '180',
                        str(root / 'rogers-1691.pdf'), str(prefix)
                    ], check=True)
            (root / 'page-locators.json').write_text(json.dumps(found, indent=2), encoding='utf-8')
            PY
          else
            printf 'Google Books did not return a PDF payload.\n' > reports/rogers-1691/pdf-download-status.txt
            rm -f reports/rogers-1691/rogers-1691.pdf
          fi

          find reports/rogers-1691 -maxdepth 2 -type f -printf '%P\t%s bytes\n' | sort \
            > reports/rogers-1691/inventory.txt

      - name: Upload Rogers provenance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rogers-1691-scan-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/rogers-1691
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      - name: Record self-identifying evidence on issue 513
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '<!-- rogers-scan-probe -->'
            echo '## Automated Rogers 1691 provenance probe'
            echo
            echo "- run: \`${GITHUB_RUN_ID}\`"
            echo "- attempt: \`${GITHUB_RUN_ATTEMPT}\`"
            echo "- exact PR SHA: \`${{ github.event.pull_request.head.sha }}\`"
            echo "- artifact: \`rogers-1691-scan-provenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}\`"
            echo
            echo '### Google Books volume summary'
            echo '```json'
            cat reports/rogers-1691/volume-summary.json
            echo '```'
            echo
            if [[ -s reports/rogers-1691/page-locators.json ]]; then
              echo '### PDF page locators'
              echo '```json'
              cat reports/rogers-1691/page-locators.json
              echo '```'
            else
              echo '### PDF status'
              cat reports/rogers-1691/pdf-download-status.txt 2>/dev/null || true
            fi
            echo
            echo '### Artifact inventory'
            echo '```text'
            cat reports/rogers-1691/inventory.txt
            echo '```'
          } > reports/rogers-1691/issue-comment.md
          gh issue comment 513 --repo FedorMilovanov/gb-is-my-strength --body-file reports/rogers-1691/issue-comment.md

      - name: Ensure provenance probe is read-only
        run: git diff --exit-code
