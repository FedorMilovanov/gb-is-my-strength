name: Source Authority Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_apply-rogers-scan-first.py'
      - '.github/workflows/source-authority-contract.yml'

permissions:
  contents: write

concurrency:
  group: source-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply-rogers-scan-first:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/heart-post-merge-cleanup-2026-07-30'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/heart-post-merge-cleanup-2026-07-30
          fetch-depth: 0
          persist-credentials: true

      - name: Apply fail-closed scan-first migration
        run: python3 scripts/_apply-rogers-scan-first.py

      - name: Validate durable contracts
        run: |
          python3 -m py_compile scripts/_apply-rogers-scan-first.py
          node --check scripts/hard-texts-visual-parity-audit.js
          node scripts/hard-texts-visual-parity-audit.js
          grep -F 'совет 1, печ. с. ii, PDF с. 17' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          grep -F 'совет 5, печ. с. xii, PDF с. 27' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          grep -F 'совет 6, печ. с. xiv, PDF с. 29' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          grep -F 'горячкой или плевритом' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          ! grep -F 'горячкой или чахоткой' src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          git diff --check

      - name: Restore canonical workflow and remove migration tool
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/source-authority-contract.yml
          git rm scripts/_apply-rogers-scan-first.py

      - name: Commit only durable project changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/source-authority-contract.yml
          git add src/components/article-pilots/tma-na-serdce/TmaNaSerdceBody.astro
          git add scripts/hard-texts-visual-parity-audit.js
          git add docs/ROGERS-1691-SCAN-PROVENANCE.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(heart): bind Rogers translations to 1691 scan"
          git push origin HEAD:agent/heart-post-merge-cleanup-2026-07-30
