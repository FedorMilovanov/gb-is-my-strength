name: Temporary Atlas Format Helper

on:
  push:
    branches:
      - agent/atlas-focus-format-helper-20260907

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Normalize Atlas patch indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('scripts/atlas-focus-state-browser-test.mjs'): (
                  """    await page.evaluate(() => {\n      const target = document.querySelector('#atlasSidebar [data-atlas-group]');\n      if (!(target instanceof HTMLElement)) throw new Error('desktop sidebar focus target missing');\n      const nativeFocus = target.focus.bind(target);\n      let attempts = 0;\n      target.focus = function faultInjectedFocus(options) {\n        attempts += 1;\n        if (attempts >= 3) nativeFocus(options);\n      };\n    });\n    await page.setViewportSize({ width: 981, height: HEIGHT });""",
                  """      await page.evaluate(() => {\n        const target = document.querySelector('#atlasSidebar [data-atlas-group]');\n        if (!(target instanceof HTMLElement)) throw new Error('desktop sidebar focus target missing');\n        const nativeFocus = target.focus.bind(target);\n        let attempts = 0;\n        target.focus = function faultInjectedFocus(options) {\n          attempts += 1;\n          if (attempts >= 3) nativeFocus(options);\n        };\n      });\n      await page.setViewportSize({ width: 981, height: HEIGHT });""",
              ),
              Path('src/runtime/atlas-runtime.js'): (
                  """        var remainingObservedLayoutFrames = 2;\n    var retryAfterLayout = function () {\n      frame = 0;\n      attempt();\n      if (settled) return;\n      if (!observer || remainingObservedLayoutFrames > 1) {\n        if (observer) remainingObservedLayoutFrames -= 1;\n        frame = window.requestAnimationFrame(retryAfterLayout);\n      }\n    };\n    frame = window.requestAnimationFrame(retryAfterLayout);""",
                  """        var remainingObservedLayoutFrames = 2;\n        var retryAfterLayout = function () {\n          frame = 0;\n          attempt();\n          if (settled) return;\n          if (!observer || remainingObservedLayoutFrames > 1) {\n            if (observer) remainingObservedLayoutFrames -= 1;\n            frame = window.requestAnimationFrame(retryAfterLayout);\n          }\n        };\n        frame = window.requestAnimationFrame(retryAfterLayout);""",
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one formatting block, found {count}')
              path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify syntax and whitespace
        run: |
          git diff --check
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-focus-state-browser-test.mjs
      - name: Commit normalized product blobs
        shell: bash
        run: |
          if git diff --quiet -- src/runtime/atlas-runtime.js scripts/atlas-focus-state-browser-test.mjs; then
            echo 'No formatting changes produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/runtime/atlas-runtime.js scripts/atlas-focus-state-browser-test.mjs
          git commit -m 'chore(atlas): normalize focus repair formatting'
          git push
