name: Temporary Atlas Focus Witness Helper

on:
  push:
    branches:
      - agent/atlas-focus-format-helper-20260907

permissions:
  contents: write

jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Make observer-miss witness deterministic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/atlas-focus-state-browser-test.mjs')
          old = """      await page.evaluate(() => {\n        const target = document.querySelector('#atlasSidebar [data-atlas-group]');\n        if (!(target instanceof HTMLElement)) throw new Error('desktop sidebar focus target missing');\n        const nativeFocus = target.focus.bind(target);\n        let attempts = 0;\n        target.focus = function faultInjectedFocus(options) {\n          attempts += 1;\n          if (attempts >= 3) nativeFocus(options);\n        };\n      });\n      await page.setViewportSize({ width: 981, height: HEIGHT });\n      await waitForResponsiveState(page, 981);\n      await waitForFocusState(page, 'desktop-theme');"""
          new = """      await page.evaluate(() => {\n        const target = document.querySelector('#atlasSidebar [data-atlas-group]');\n        if (!(target instanceof HTMLElement)) throw new Error('desktop sidebar focus target missing');\n        const nativeFocus = target.focus.bind(target);\n        let attempts = 0;\n        target.focus = function faultInjectedFocus(options) {\n          attempts += 1;\n          if (attempts >= 3) nativeFocus(options);\n        };\n        if (typeof window.ResizeObserver === 'function') {\n          window.__atlasNativeResizeObserverForTest = window.ResizeObserver;\n          window.ResizeObserver = class SilentResizeObserver {\n            observe() {}\n            disconnect() {}\n          };\n        }\n      });\n      await page.setViewportSize({ width: 981, height: HEIGHT });\n      await waitForResponsiveState(page, 981);\n      await waitForFocusState(page, 'desktop-theme');\n      await page.evaluate(() => {\n        const nativeResizeObserver = window.__atlasNativeResizeObserverForTest;\n        if (typeof nativeResizeObserver === 'function') window.ResizeObserver = nativeResizeObserver;\n        delete window.__atlasNativeResizeObserverForTest;\n      });"""
          text = path.read_text()
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one formatted focus witness block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Verify syntax and whitespace
        run: |
          git diff --check
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-focus-state-browser-test.mjs
      - name: Commit deterministic witness
        shell: bash
        run: |
          if git diff --quiet -- scripts/atlas-focus-state-browser-test.mjs; then
            echo 'No witness change produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/atlas-focus-state-browser-test.mjs
          git commit -m 'test(atlas): model silent ResizeObserver focus recovery'
          git push
