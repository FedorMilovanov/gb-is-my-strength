name: Temporary sync main into Gill deploy lane

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-sync-main-into-gill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-sync-main-gill-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'lane/system-gill-readerstate-deploy-unblock-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Gill lane
        uses: actions/checkout@v4
        with:
          ref: lane/system-gill-readerstate-deploy-unblock-2026-07-25
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Merge current main with fail-closed revision reconciliation
        env:
          TARGET_BRANCH: lane/system-gill-readerstate-deploy-unblock-2026-07-25
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "Merging current main ${MAIN_SHA}"

          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          if (( merge_rc != 0 && ${#conflicts[@]} == 0 )); then
            echo 'Merge failed without resolvable content conflicts' >&2
            exit "$merge_rc"
          fi

          for file in "${conflicts[@]}"; do
            case "$file" in
              src/lib/asset-version.js|*.html|*.astro)
                git checkout --ours -- "$file"
                git add -- "$file"
                ;;
              *)
                echo "Unexpected product conflict: $file" >&2
                exit 1
                ;;
            esac
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unresolved merge paths remain' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          node scripts/cache-bust.js --write
          git add -A

          grep -Fq "'css/site.css': '4e58ac4d'" src/lib/asset-version.js
          grep -Fq "'js/floating-cluster-controller.js': '4bf2a7fd'" src/lib/asset-version.js
          node scripts/cache-bust.js
          node --check js/floating-cluster-controller.js
          node scripts/run-actionlint.mjs -no-color .github/workflows/gill-pre-v16-submenu.yml
          node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-sync-main-into-gill.yml
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore(sync): merge main ${MAIN_SHA:0:8} into Gill deploy lane"
          git push origin "HEAD:${TARGET_BRANCH}"
