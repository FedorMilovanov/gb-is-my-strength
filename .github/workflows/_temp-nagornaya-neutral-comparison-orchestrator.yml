name: Temp Nagornaya neutral comparison orchestrator

on:
  workflow_run:
    workflows: ["Shared Files Guard"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: temp-nagornaya-neutral-comparison-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  transaction:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch == 'agent/nagornaya-neutral-comparison-ui-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check transaction state
        id: gate
        run: |
          if test -f reports/nagornaya-neutral-comparison/transaction-status.txt; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transaction start marker
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p reports/nagornaya-neutral-comparison
          printf 'running %s\n' "$RUN_ID" > reports/nagornaya-neutral-comparison/transaction-status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/nagornaya-neutral-comparison/transaction-status.txt
          git commit -m 'chore(ci): mark Nagornaya proof running'
          git push origin HEAD:refs/heads/agent/nagornaya-neutral-comparison-ui-2026-07-22

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Capture exact live baseline
        if: steps.gate.outputs.run == 'true'
        env:
          BASE_URL: https://gospod-bog.ru
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: node scripts/_temp-nagornaya-neutral-baseline-witness.mjs

      - name: Apply isolated exact patch
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/_temp-nagornaya-neutral-comparison-patcher.py

      - name: Build production-like output
        if: steps.gate.outputs.run == 'true'
        run: npm run strangler:build:production-like

      - name: Synchronize canonical shadow pages
        if: steps.gate.outputs.run == 'true'
        run: cp dist/nagornaya/chast-4/index.html nagornaya/chast-4/index.html && cp dist/nagornaya/chast-5/index.html nagornaya/chast-5/index.html

      - name: Run permanent source contracts
        if: steps.gate.outputs.run == 'true'
        run: npm run nagornaya:neutral-comparison:test && npm run engine:contracts && node scripts/cache-bust.js

      - name: Run browser witness and capture after state
        if: steps.gate.outputs.run == 'true'
        env:
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: npm run nagornaya:neutral-comparison:browser:test

      - name: Run static publication barrier
        if: steps.gate.outputs.run == 'true'
        run: npm run validate:static-publication:light

      - name: Commit verified permanent diff to PR branch
        if: steps.gate.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          printf 'success %s\n' "$RUN_ID" > reports/nagornaya-neutral-comparison/transaction-status.txt
          git add package.json src/lib/nagornaya-claim-projection.ts src/components/nagornaya/shared/NagornayaClaimComparison.astro src/components/nagornaya/chast-4/NagornayaChast4MainShell.astro src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro nagornaya/chast-4/index.html nagornaya/chast-5/index.html scripts/nagornaya-neutral-comparison-regression-test.js scripts/nagornaya-neutral-comparison-browser-test.mjs reports/nagornaya-neutral-comparison
          git diff --cached --check
          git commit -m 'feat(nagornaya): add neutral comparison UI'
          git push origin HEAD:refs/heads/agent/nagornaya-neutral-comparison-ui-2026-07-22

      - name: Publish transaction failure marker
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git reset --hard
          mkdir -p reports/nagornaya-neutral-comparison
          printf 'failure %s\n' "$RUN_ID" > reports/nagornaya-neutral-comparison/transaction-status.txt
          git add reports/nagornaya-neutral-comparison/transaction-status.txt
          git commit -m 'chore(ci): mark Nagornaya proof failed'
          git push origin HEAD:refs/heads/agent/nagornaya-neutral-comparison-ui-2026-07-22

      - name: Upload visual evidence
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nagornaya-neutral-comparison-evidence-${{ github.run_id }}
          path: reports/nagornaya-neutral-comparison
          if-no-files-found: warn
