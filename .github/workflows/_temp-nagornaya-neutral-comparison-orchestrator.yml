name: Temp Nagornaya neutral comparison orchestrator

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/_temp-nagornaya-neutral-comparison-orchestrator.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nagornaya-neutral-comparison-ui-2026-07-22
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture exact live baseline
        env:
          BASE_URL: https://gospod-bog.ru
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: node scripts/_temp-nagornaya-neutral-baseline-witness.mjs

      - name: Apply isolated exact patch
        run: python3 scripts/_temp-nagornaya-neutral-comparison-patcher.py

      - name: Build production-like output
        run: npm run strangler:build:production-like

      - name: Synchronize canonical shadow pages
        run: |
          cp dist/nagornaya/chast-4/index.html nagornaya/chast-4/index.html
          cp dist/nagornaya/chast-5/index.html nagornaya/chast-5/index.html

      - name: Run permanent source contracts
        run: |
          npm run nagornaya:neutral-comparison:test
          npm run engine:contracts
          node scripts/cache-bust.js

      - name: Run browser witness and capture after state
        env:
          EVIDENCE_DIR: reports/nagornaya-neutral-comparison
        run: npm run nagornaya:neutral-comparison:browser:test

      - name: Run static publication barrier
        run: npm run validate:static-publication:light

      - name: Record evidence manifest
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '%s\n' \
            '# Nagornaya neutral comparison evidence' \
            '' \
            '- Baseline source: live production from exact verified main `6c4106aecd35a3c95b09b041332d653f581ceb92`.' \
            "- Transaction run: \`${RUN_ID}\`." \
            '- Viewports: 390×844 and 1440×900.' \
            '- Blocks: Part IV / Green, Part IV / Thomas, Part V / pastoral discernment.' \
            '- Before and after images are viewport witnesses centred on each changed block.' \
            '- Browser contract additionally covers 320×760, reduced motion, Sepia, ARIA labelling, alternative-before-position DOM order and horizontal overflow.' \
            > reports/nagornaya-neutral-comparison/README.md

      - name: Commit verified permanent diff to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            package.json \
            src/lib/nagornaya-claim-projection.ts \
            src/components/nagornaya/shared/NagornayaClaimComparison.astro \
            src/components/nagornaya/chast-4/NagornayaChast4MainShell.astro \
            src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro \
            nagornaya/chast-4/index.html \
            nagornaya/chast-5/index.html \
            scripts/nagornaya-neutral-comparison-regression-test.js \
            scripts/nagornaya-neutral-comparison-browser-test.mjs \
            reports/nagornaya-neutral-comparison
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No permanent changes to commit'
            exit 0
          fi
          git commit -m 'feat(nagornaya): add neutral comparison UI'
          git push origin HEAD:refs/heads/agent/nagornaya-neutral-comparison-ui-2026-07-22

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagornaya-neutral-comparison-evidence-${{ github.run_id }}
          path: reports/nagornaya-neutral-comparison
          if-no-files-found: warn

