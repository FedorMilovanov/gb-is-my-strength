name: Vosk Loader Failure State

on:
  pull_request:
    paths:
      - "src/runtime/reader-tts.js"
      - "js/floating-cluster-controller.js"
      - "scripts/vosk-loader-retry-contract-test.js"
      - ".github/workflows/vosk-loader-failure-state.yml"
      - ".github/workflows/tts-reader-polish.yml"
      - "src/lib/asset-version.js"
      - "src/components/article-pilots/_shared/StandaloneArticleFooter.astro"
      - "src/components/article-pilots/gill-series/GillSeriesChrome.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaBody.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiBody.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiSpravochnikBody.astro"
      - "src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro"
  push:
    branches: [main]
    paths:
      - "src/runtime/reader-tts.js"
      - "js/floating-cluster-controller.js"
      - "scripts/vosk-loader-retry-contract-test.js"
      - ".github/workflows/vosk-loader-failure-state.yml"
      - ".github/workflows/tts-reader-polish.yml"
      - "src/lib/asset-version.js"
      - "src/components/article-pilots/_shared/StandaloneArticleFooter.astro"
      - "src/components/article-pilots/gill-series/GillSeriesChrome.astro"
      - "src/components/article-pilots/hermenevtika/HermenevtikaBody.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiBody.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro"
      - "src/components/baptisty-rossii/BaptistyRossiiSpravochnikBody.astro"
      - "src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro"

permissions:
  contents: read

concurrency:
  group: vosk-loader-failure-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retry-contract:
    name: Vosk loader retry contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Check syntax
        run: |
          node --check src/runtime/reader-tts.js
          node --check js/floating-cluster-controller.js
          node --check scripts/vosk-loader-retry-contract-test.js

      - name: Run Vosk loader retry contract
        run: node scripts/vosk-loader-retry-contract-test.js

      - name: Verify cache-bust drift
        run: node scripts/cache-bust.js
