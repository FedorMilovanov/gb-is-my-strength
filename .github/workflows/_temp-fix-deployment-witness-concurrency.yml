name: TEMP Fix Deployment Witness Concurrency

on:
  push:
    branches:
      - fix/deployment-witness-concurrency-20260725
    paths:
      - scripts/_temp_fix_deployment_witness_concurrency.py
      - .github/workflows/_temp-fix-deployment-witness-concurrency.yml

permissions:
  contents: write

concurrency:
  group: temp-fix-deployment-witness-concurrency
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repair lane
        uses: actions/checkout@v4
        with:
          ref: fix/deployment-witness-concurrency-20260725
          fetch-depth: 0
      - name: Apply exact-run concurrency repair
        run: python3 scripts/_temp_fix_deployment_witness_concurrency.py
      - name: Validate focused ledger contracts
        run: |
          node --check scripts/deployment-witness-ledger-source-contract-test.cjs
          node scripts/deployment-witness-ledger-source-contract-test.cjs
          node scripts/run-actionlint.mjs -no-color .github/workflows/deployment-witness-ledger.yml
          git diff --check
          test ! -e scripts/_temp_fix_deployment_witness_concurrency.py
      - name: Publish tested source repair
        run: |
          git config user.name "deployment-witness-repair-bot"
          git config user.email "deployment-witness-repair-bot@users.noreply.github.com"
          git add .github/workflows/deployment-witness-ledger.yml scripts/deployment-witness-ledger-source-contract-test.cjs scripts/_temp_fix_deployment_witness_concurrency.py
          git diff --cached --check
          git commit -m "fix(ci): serialize deployment witness projection by deploy run"
          git push origin HEAD:fix/deployment-witness-concurrency-20260725
