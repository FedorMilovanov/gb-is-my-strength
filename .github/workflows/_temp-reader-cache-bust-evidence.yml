name: TEMP reader cache-bust evidence

on:
  push:
    paths:
      - '.github/workflows/_temp-reader-cache-bust-evidence.yml'
  pull_request:
    paths:
      - '.github/workflows/_temp-reader-cache-bust-evidence.yml'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Materialize deterministic asset revisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          mkdir -p reports/cache-bust-evidence
          git diff --binary -- . ':(exclude).github/workflows/_temp-reader-cache-bust-evidence.yml' > reports/cache-bust-evidence/cache-bust.patch
          git diff --name-only -- . ':(exclude).github/workflows/_temp-reader-cache-bust-evidence.yml' > reports/cache-bust-evidence/changed-files.txt
          test -s reports/cache-bust-evidence/cache-bust.patch
          test -s reports/cache-bust-evidence/changed-files.txt

      - name: Upload deterministic patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reader-cache-bust-${{ github.sha }}
          path: reports/cache-bust-evidence
          if-no-files-found: error
          retention-days: 1
