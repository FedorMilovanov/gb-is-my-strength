name: Temporary Genesis 6 Phase C read-only acceptance

on:
  push:
    branches: [agent/genesis6-phaseC-materializer-20260727]
    paths:
      - '.github/workflows/temp-genesis6-phaseC-materializer.yml'
      - '.tmp/genesis6-phaseC/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-genesis6-phaseC-materializer.yml'
      - '.tmp/genesis6-phaseC/**'

permissions:
  contents: read

concurrency:
  group: genesis6-phaseC-readonly-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'agent/genesis6-phaseC-materializer-20260727')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARRIER_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      BASE_SHA: 9ff36fab1e7776ce3de60daacdfd9d29066ae6c0
      TARGET_BRANCH: lane/genesis6-route-source-prep-2026-07-27
      CAPSULE_B64_SHA256: 962f47fe056b469508172f9178891d59e7999557b927fc9596af12b0d28b4139
      CAPSULE_TGZ_SHA256: 224581af3d057f4ce69a76e23c74ca8be9c03688c58c27b0e33814b6bb96012c
      MANIFEST_SHA256: 743153757d3117bb03a824b13481c2cc525814b2cb7b3d5c4593dcacdacddbe4
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore verified acceptance runner
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/genesis6-phaseC/runner/*.part > /tmp/genesis6-phaseC-runner.sh
          test "$(sha256sum /tmp/genesis6-phaseC-runner.sh | cut -d' ' -f1)" = '7ccadea12893ad97a4ec5b9ae862ab206549e73b766b4feb5816c145dcbfe360'
          bash -n /tmp/genesis6-phaseC-runner.sh
          chmod 700 /tmp/genesis6-phaseC-runner.sh

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Validate and seal exact product
        run: /tmp/genesis6-phaseC-runner.sh

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis6-phaseC-acceptance-${{ github.run_id }}
          path: |
            /tmp/genesis6-phaseC/evidence
            /tmp/genesis6-phaseC/tested-product.tgz
          if-no-files-found: error
          retention-days: 14
