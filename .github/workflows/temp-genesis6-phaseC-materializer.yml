name: Temporary Genesis 6 Phase C read-only acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-genesis6-phaseC-materializer.yml'
      - '.tmp/genesis6-phaseC/**'

permissions:
  contents: read

concurrency:
  group: genesis6-phaseC-readonly-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/genesis6-phaseC-materializer-20260727'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARRIER_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: 9ff36fab1e7776ce3de60daacdfd9d29066ae6c0
      TARGET_BRANCH: lane/genesis6-route-source-prep-2026-07-27
      CAPSULE_PART_COUNT: "29"
      CAPSULE_B64_SHA256: a78628cdbfa5e379135a36f4810605184dddc6ac08a40f81250c84f5c9d65153
      CAPSULE_TGZ_SHA256: ea5e1a984ddcd8c0ff092d88cda80a9eef2bed83f692c9715cc2a36a3c0b2fa1
      MANIFEST_SHA256: aad69e0bbda5c0ca7c0d9d2625e4ed2b82e99f5769c4a51062364897aaad8a86
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CARRIER_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Restore verified acceptance runner
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp/genesis6-phaseC/runner/*.part > /tmp/genesis6-phaseC-runner.sh
          test "$(sha256sum /tmp/genesis6-phaseC-runner.sh | cut -d' ' -f1)" = "d85168e481f4d17f202de4b2734f2f6b6dfaff18b2d64dd10e30e397cb9e36d6"
          bash -n /tmp/genesis6-phaseC-runner.sh
          chmod 700 /tmp/genesis6-phaseC-runner.sh
      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Validate and seal exact product
        run: /tmp/genesis6-phaseC-runner.sh
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genesis6-phaseC-acceptance-${{ github.run_id }}
          path: |
            /tmp/genesis6-phaseC/evidence
            /tmp/genesis6-phaseC/tested-product.tgz
          if-no-files-found: error
          retention-days: 14
