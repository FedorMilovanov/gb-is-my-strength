name: Temporary #1254 Scripture index projection

on:
  push:
    branches:
      - agent/search-manifest-existing-row-reconciliation-20260808
    paths:
      - .github/workflows/tmp-search1254-scripture-index-projection.yml

permissions:
  contents: write

concurrency:
  group: tmp-search1254-scripture-index-projection
  cancel-in-progress: false

jobs:
  project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/search-manifest-existing-row-reconciliation-20260808
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Project canonical Scripture occurrence index
        run: |
          set -euo pipefail
          node scripts/build-scripture-occurrence-index.mjs --write
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs

      - name: Enforce one-file generated closure
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "data/scripture-search-index.json"
          git diff --check

      - name: Commit generated index only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture-search-index.json
          git commit -m "fix(search): refresh Scripture occurrence index"
          git push origin HEAD:agent/search-manifest-existing-row-reconciliation-20260808
