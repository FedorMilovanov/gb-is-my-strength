name: Reader R5 Finalize

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

concurrency:
  group: reader-r5-finalize-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'lane/reader-r5-overlay-runtime-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Prepare permanent R5 files
        id: prepare
        shell: bash
        run: |
          set +e
          mkdir -p reports
          status=0
          {
            set -euo pipefail
            python3 scripts/_temp-r5-finalize.py
            python3 scripts/_temp-r5-browser-fix.py
            python3 scripts/_temp-r5-browser-fixture.py
          } > reports/reader-r5-prepare.log 2>&1 || status=$?
          cat reports/reader-r5-prepare.log
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload prepare diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r5-prepare-diagnostic
          path: |
            reports/reader-r5-prepare.log
            scripts/overlay-runtime-browser-test.js
            js/site-utils.js
          if-no-files-found: error
          retention-days: 1

      - name: Fail on prepare error
        if: steps.prepare.outputs.status != '0'
        run: exit 1

      - name: Install dependencies
        if: steps.prepare.outputs.status == '0'
        run: npm ci

      - name: Install Chromium
        if: steps.prepare.outputs.status == '0'
        run: npx playwright install --with-deps chromium

      - name: Validate browser ownership matrix
        if: steps.prepare.outputs.status == '0'
        shell: bash
        env:
          PW_BROWSER: chromium
        run: |
          set -o pipefail
          mkdir -p reports
          npm run overlay:browser:test 2>&1 | tee reports/reader-r5-browser.log

      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r5-browser-diagnostic
          path: reports/reader-r5-browser.log
          if-no-files-found: warn
          retention-days: 1

      - name: Validate static and runtime contracts
        if: steps.prepare.outputs.status == '0'
        run: |
          set -euo pipefail
          node --check js/site-utils.js
          node --check js/site.js
          node --check js/floating-cluster-controller.js
          node --check scripts/overlay-runtime-browser-test.js
          npm run overlay:runtime:test
          npm run astro:check
          git diff --check

      - name: Lint permanent workflows
        if: steps.prepare.outputs.status == '0'
        run: |
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/shared-files-guard.yml .github/workflows/overlay-runtime-browser.yml

      - name: Remove transaction-only evidence and commit
        if: steps.prepare.outputs.status == '0'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch \
            docs/refactor-2026/reader-platform/reader-r5-overlay-runtime-inventory.json \
            scripts/_temp-r5-overlay-runtime.inc.js \
            scripts/_temp-r5-patch-floating-cluster.py \
            scripts/_temp-r5-patch-hermenevtika.py \
            scripts/_temp-r5-patch-lock.py \
            scripts/_temp-r5-patch-reader-settings.py \
            scripts/_temp-r5-patch-runtime-hardening.py \
            scripts/_temp-r5-patch-runtime.py \
            scripts/_temp-r5-patch-sitejs.py \
            scripts/_temp-r5-patch-test-cases.py \
            scripts/_temp-r5-patch-test-harness.py \
            scripts/_temp-reader-r5-inventory.js \
            scripts/_temp-r5-browser-fix.py \
            scripts/_temp-r5-browser-fixture.py \
            scripts/_temp-r5-finalize.py
          git add -- \
            .github/workflows/shared-files-guard.yml \
            .github/workflows/overlay-runtime-browser.yml \
            docs/READER-R5-OVERLAY-RUNTIME-INVENTORY-2026-07-21.md \
            js/site-utils.js \
            package.json \
            scripts/overlay-runtime-browser-test.js \
            scripts/overlay-runtime-contract-test.js \
            scripts/runtime-integrity-test.js \
            src/components/article-pilots/_shared/ReaderSettings.astro
          test -z "$(git diff --cached --name-only | grep -E '(^|/)_temp-|reader-r5-overlay-runtime-inventory\.json$' || true)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(reader): lock unified overlay runtime contract"
          git push origin "HEAD:${HEAD_REF}"
