name: Temporary font assets inventory

on:
  push:
    branches: ["temp/font-assets-inventory-20260725"]
    paths:
      - "fonts/**"
      - "scripts/_temp-font-assets-inventory.mjs"
      - ".github/workflows/_temp-font-assets-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Inventory tracked WOFF2 assets
        run: node scripts/_temp-font-assets-inventory.mjs

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: font-assets-inventory-${{ github.run_id }}
          path: reports/font-assets-inventory.json
          if-no-files-found: error
          retention-days: 3
