name: Temporary Diotrophes direct image boundary

on:
  push:
    branches:
      - lane/diotrophes-segmented-screenshots-current-20260803
    paths:
      - '.github/workflows/_tmp-diotrophes-direct-image-boundary.yml'

permissions:
  contents: read

concurrency:
  group: tmp-diotrophes-direct-image-boundary
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exact owner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: lane/diotrophes-segmented-screenshots-current-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Verify transport parent
        env:
          EXPECTED_PARENT: dced0576eb2779a45b2555db8da3affde2b80ff8
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test -f scripts/_tmp_diotrophes_direct_image_boundary.py
          test -f .github/workflows/_tmp-diotrophes-direct-image-boundary.yml

      - name: Materialize direct markup boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_tmp_diotrophes_direct_image_boundary.py
          test ! -e scripts/_tmp_diotrophes_direct_image_boundary.py
          test ! -e .github/workflows/_tmp-diotrophes-direct-image-boundary.yml
          test ! -e public/css/diotrophes-wave12.css
          grep -F 'picture style="display:block;width:100%;max-width:100%;"' src/components/article-pilots/diotrophes/DiotrophesDraft.astro
          grep -F 'style="display:block;width:100%;max-width:100%;height:auto;"' src/components/article-pilots/diotrophes/DiotrophesDraft.astro
          ! grep -F 'diotrophes-wave12.css' src/pages/articles/diotrefy-nashego-vremeni/index.astro
          ! grep -F 'wave12-publication-boundary .article-img.wide' src/components/article-pilots/diotrophes/DiotrophesPageHead.astro

      - name: Verify final permanent scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only origin/main...HEAD | sort)
          mapfile -t working < <(git diff --name-only | sort)
          expected_final=(
            'scripts/diotrophes-wave12-browser-contract.mjs'
            'src/components/article-pilots/diotrophes/DiotrophesDraft.astro'
          )
          printf '%s\n' "${changed[@]}" > /tmp/current-committed.txt
          printf '%s\n' "${working[@]}" >> /tmp/current-committed.txt
          sort -u /tmp/current-committed.txt > /tmp/final.txt
          printf '%s\n' "${expected_final[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/final.txt

      - name: Commit only permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(diotrophes): constrain lead image at markup owner'
          git push origin HEAD:lane/diotrophes-segmented-screenshots-current-20260803
