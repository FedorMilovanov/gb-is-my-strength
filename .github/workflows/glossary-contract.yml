name: Glossary Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "data/glossary.json"
      - "data/glossary-policy.json"
      - "css/site.css"
      - "js/glossary.js"
      - "js/site.js"
      - "js/site-utils.js"
      - "scripts/glossary-contract-audit.js"
      - "scripts/glossary-placement-normalizer.js"
      - "scripts/glossary-placement-normalizer-test.js"
      - "scripts/glossary-runtime-browser-test.js"
      - "scripts/reference-system-inventory.js"
      - "scripts/tooltip-icon-audit.js"
      - "scripts/tooltip-marker-browser-test.js"
      - "scripts/tooltip-trigger-normalizer.js"
      - "scripts/tooltip-trigger-normalizer-test.js"
      - "src/**"
      - "articles/**"
      - "biografii/**"
      - "hard-texts/**"
      - "konfessii/**"
      - "pastor-series/**"
      - "baptisty-rossii/**"
      - ".github/workflows/glossary-contract.yml"
  push:
    branches:
      - main
    paths:
      - "data/glossary.json"
      - "data/glossary-policy.json"
      - "css/site.css"
      - "js/glossary.js"
      - "js/site.js"
      - "js/site-utils.js"
      - "scripts/glossary-contract-audit.js"
      - "scripts/glossary-placement-normalizer.js"
      - "scripts/glossary-placement-normalizer-test.js"
      - "scripts/glossary-runtime-browser-test.js"
      - "scripts/reference-system-inventory.js"
      - "scripts/tooltip-icon-audit.js"
      - "scripts/tooltip-marker-browser-test.js"
      - "scripts/tooltip-trigger-normalizer.js"
      - "scripts/tooltip-trigger-normalizer-test.js"
      - "src/**"
      - "articles/**"
      - "biografii/**"
      - "hard-texts/**"
      - "konfessii/**"
      - "pastor-series/**"
      - "baptisty-rossii/**"
      - ".github/workflows/glossary-contract.yml"

permissions:
  contents: read

concurrency:
  group: glossary-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placement-autofix:
    name: Placement and asset autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate normalizer syntax
        run: |
          node --check scripts/glossary-placement-normalizer.js
          node --check scripts/glossary-placement-normalizer-test.js
          node --check scripts/tooltip-trigger-normalizer.js
          node --check scripts/tooltip-trigger-normalizer-test.js

      - name: Test universal normalizers
        run: |
          node scripts/glossary-placement-normalizer-test.js
          node scripts/tooltip-trigger-normalizer-test.js

      - name: Normalize glossary placement and tooltip triggers
        run: |
          node scripts/glossary-placement-normalizer.js --write
          node scripts/tooltip-trigger-normalizer.js --write

      - name: Synchronize standard asset revisions
        run: node scripts/cache-bust.js --write

      - name: Validate normalized source and asset revisions
        run: |
          node scripts/glossary-contract-audit.js
          node scripts/tooltip-trigger-normalizer.js
          node scripts/tooltip-icon-audit.js
          node scripts/cache-bust.js

      - name: Commit normalized sources and revisions
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No normalization or asset revision changes are required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(content): normalize glossary and tooltip triggers"
          git push origin "HEAD:${HEAD_REF}"

  source-contract:
    name: Source contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check runtime syntax
        run: node --check js/glossary.js

      - name: Check contract, inventory and normalizer syntax
        run: |
          node --check scripts/glossary-contract-audit.js
          node --check scripts/glossary-placement-normalizer.js
          node --check scripts/glossary-placement-normalizer-test.js
          node --check scripts/reference-system-inventory.js
          node --check scripts/tooltip-icon-audit.js
          node --check scripts/tooltip-trigger-normalizer.js
          node --check scripts/tooltip-trigger-normalizer-test.js

      - name: Test universal normalizers
        id: normalizer-tests
        shell: bash
        run: |
          mkdir -p reports
          set +e
          {
            node scripts/glossary-placement-normalizer-test.js
            node scripts/tooltip-trigger-normalizer-test.js
          } > reports/normalizer-tests.log 2>&1
          status=$?
          cat reports/normalizer-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate dictionary, placement and shared runtime
        id: glossary-audit
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node scripts/glossary-contract-audit.js > reports/glossary-contract.log 2>&1
          status=$?
          cat reports/glossary-contract.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build repository-wide reference inventory
        run: node scripts/reference-system-inventory.js

      - name: Audit tooltip trigger icons
        id: tooltip-audit
        shell: bash
        run: |
          set +e
          node scripts/tooltip-icon-audit.js > reports/tooltip-icon-audit.log 2>&1
          status=$?
          cat reports/tooltip-icon-audit.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lint glossary workflow
        id: glossary-actionlint
        shell: bash
        run: |
          mkdir -p reports /tmp/actionlint
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp/actionlint actionlint
          set +e
          /tmp/actionlint/actionlint -no-color .github/workflows/glossary-contract.yml \
            > reports/glossary-actionlint.log 2>&1
          status=$?
          cat reports/glossary-actionlint.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Collect violating source files
        if: always()
        shell: bash
        run: |
          mkdir -p reports/glossary-violation-sources
          grep '^ERROR: ' reports/glossary-contract.log \
            | sed -E 's/^ERROR: ([^:]+):[0-9]+:.*/\1/' \
            | sort -u \
            > reports/glossary-violation-files.txt || true

          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "reports/glossary-violation-sources/$(dirname "$file")"
            cp "$file" "reports/glossary-violation-sources/$file"
          done < reports/glossary-violation-files.txt

      - name: Upload complete glossary diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-contract-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce glossary contract result
        if: always()
        shell: bash
        run: |
          test "${{ steps.normalizer-tests.outputs.status }}" = "0"
          test "${{ steps.glossary-audit.outputs.status }}" = "0"
          test "${{ steps.tooltip-audit.outputs.status }}" = "0"
          test "${{ steps.glossary-actionlint.outputs.status }}" = "0"

  browser-contract:
    name: Browser contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check browser test syntax
        run: |
          node --check scripts/glossary-runtime-browser-test.js
          node --check scripts/tooltip-marker-browser-test.js

      - name: Run route-independent glossary fixture
        run: node scripts/glossary-runtime-browser-test.js

      - name: Click and hover tooltip markers on desktop and mobile
        id: tooltip-browser
        shell: bash
        run: |
          mkdir -p reports
          set +e
          node scripts/tooltip-marker-browser-test.js > reports/tooltip-marker-browser.log 2>&1
          status=$?
          cat reports/tooltip-marker-browser.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload tooltip browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooltip-marker-browser-report
          path: reports/tooltip-marker-browser.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce tooltip browser result
        if: always()
        run: test "${{ steps.tooltip-browser.outputs.status }}" = "0"
