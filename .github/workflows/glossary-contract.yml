name: Glossary Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "data/glossary*.json"
      - "css/site.css"
      - "js/glossary.js"
      - "js/site*.js"
      - "scripts/glossary-*.js"
      - "scripts/reference-system-inventory.js"
      - "scripts/tooltip-*.js"
      - "src/**"
      - "articles/**"
      - "biografii/**"
      - "hard-texts/**"
      - "konfessii/**"
      - "pastor-series/**"
      - "baptisty-rossii/**"
      - ".github/workflows/glossary-contract.yml"
  push:
    branches: [main]
    paths:
      - "data/glossary*.json"
      - "css/site.css"
      - "js/glossary.js"
      - "js/site*.js"
      - "scripts/glossary-*.js"
      - "scripts/reference-system-inventory.js"
      - "scripts/tooltip-*.js"
      - "src/**"
      - "articles/**"
      - "biografii/**"
      - "hard-texts/**"
      - "konfessii/**"
      - "pastor-series/**"
      - "baptisty-rossii/**"
      - ".github/workflows/glossary-contract.yml"

permissions:
  contents: read

concurrency:
  group: glossary-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  placement-autofix:
    name: Placement and asset autofix
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and test normalizers
        run: |
          node --check scripts/glossary-placement-normalizer.js
          node --check scripts/tooltip-trigger-normalizer.js
          node --check scripts/tooltip-style-normalizer.js
          node scripts/glossary-placement-normalizer-test.js
          node scripts/tooltip-trigger-normalizer-test.js

      - name: Normalize source and shared marker styles
        run: |
          node scripts/glossary-placement-normalizer.js --write
          node scripts/tooltip-trigger-normalizer.js --write
          node scripts/cache-bust.js --write

      - name: Validate normalized tree
        run: |
          node scripts/glossary-contract-audit.js
          node scripts/tooltip-trigger-normalizer.js
          node scripts/tooltip-icon-audit.js
          node scripts/cache-bust.js

      - name: Commit normalization
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "fix(content): normalize glossary and tooltip contracts"
          git push origin "HEAD:${HEAD_REF}"

  source-contract:
    name: Source contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate syntax and fixtures
        run: |
          mkdir -p reports
          node --check js/glossary.js
          node --check scripts/glossary-contract-audit.js
          node --check scripts/glossary-placement-normalizer.js
          node --check scripts/reference-system-inventory.js
          node --check scripts/tooltip-icon-audit.js
          node --check scripts/tooltip-trigger-normalizer.js
          node --check scripts/tooltip-style-normalizer.js
          node scripts/glossary-placement-normalizer-test.js
          node scripts/tooltip-trigger-normalizer-test.js

      - name: Audit glossary, references and tooltip markers
        run: |
          node scripts/glossary-contract-audit.js | tee reports/glossary-contract.log
          node scripts/reference-system-inventory.js
          node scripts/tooltip-icon-audit.js | tee reports/tooltip-icon-audit.log
          node scripts/tooltip-style-normalizer.js | tee reports/tooltip-style.log

      - name: Lint workflow
        run: |
          mkdir -p /tmp/actionlint
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" \
            | tar xz -C /tmp/actionlint actionlint
          /tmp/actionlint/actionlint -no-color .github/workflows/glossary-contract.yml \
            | tee reports/glossary-actionlint.log

      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glossary-contract-report
          path: reports/
          if-no-files-found: error
          retention-days: 14

  browser-contract:
    name: Browser contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run glossary and marker interactions
        run: |
          mkdir -p reports
          node --check scripts/glossary-runtime-browser-test.js
          node --check scripts/tooltip-marker-browser-test.js
          node scripts/glossary-runtime-browser-test.js
          node scripts/tooltip-marker-browser-test.js \
            | tee reports/tooltip-marker-browser.log

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tooltip-marker-browser-report
          path: |
            reports/tooltip-marker-browser.log
            reports/tooltip-marker-desktop.png
            reports/tooltip-marker-mobile.png
          if-no-files-found: warn
          retention-days: 14
