name: TEMP Diagnose Dist Publication Gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: temp-dist-publication-diagnosis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.number == 271
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f92794b4f11ef9dae55d284a106a9bd0f69133c9
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: node scripts/download-fonts.js || true
      - name: Rebuild exact production dist
        run: |
          npm run strangler:build:production-like
          npm run pagefind:build:dist
          touch dist/.nojekyll
          npm run visual:parity:production
      - name: Capture failing publication gate
        shell: bash
        run: |
          set +e
          mkdir -p reports/dist-publication-diagnosis
          node scripts/dist-publication-audit.js --require-pagefind --forbid-dev \
            > >(tee reports/dist-publication-diagnosis/stdout.log) \
            2> >(tee reports/dist-publication-diagnosis/stderr.log >&2)
          code=$?
          printf '%s\n' "$code" > reports/dist-publication-diagnosis/exit-code.txt
          find dist -maxdepth 3 -type f | sort > reports/dist-publication-diagnosis/dist-files.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: dist-publication-diagnosis-${{ github.sha }}
          path: reports/dist-publication-diagnosis
          if-no-files-found: error
          retention-days: 7
