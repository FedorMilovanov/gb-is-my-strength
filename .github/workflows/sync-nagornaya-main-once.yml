# one-shot synchronize trigger
name: Sync Nagornaya candidate to latest main once

on:
  pull_request:
    branches: [main]
    types: [synchronize]
    paths:
      - '.github/workflows/sync-nagornaya-main-once.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: sync-nagornaya-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.event.pull_request.number == 1197 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/nagornaya-library-theme-series-20260808'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge current main, validate and self-clean
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || { echo "stale head: $actual != $EXPECTED_HEAD"; exit 1; }

          git fetch origin main "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD" || { echo "remote head moved before sync"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-commit --no-ff origin/main
          git diff --cached --check origin/main

          node scripts/nagornaya-visual-parity-audit.js
          node scripts/cache-bust.js

          git rm .github/workflows/sync-nagornaya-main-once.yml
          git add -A
          git diff --cached --check origin/main

          git fetch origin "$HEAD_REF"
          test "$(git rev-parse "origin/$HEAD_REF")" = "$EXPECTED_HEAD" || { echo "remote head moved during sync"; exit 1; }

          git commit -m "merge(main): refresh Nagornaya candidate after FAQ security closure"
          git push origin HEAD:"$HEAD_REF"
