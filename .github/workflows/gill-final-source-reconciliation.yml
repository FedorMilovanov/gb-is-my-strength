name: Gill Final Source Reconciliation

on:
  pull_request:
    paths:
      - src/components/article-pilots/gill-*/**
      - data/series.json
      - scripts/gill-final-source-reconciliation-audit.mjs
      - .github/workflows/gill-final-source-reconciliation.yml
  push:
    branches:
      - main
    paths:
      - src/components/article-pilots/gill-*/**
      - data/series.json
      - scripts/gill-final-source-reconciliation-audit.mjs
      - .github/workflows/gill-final-source-reconciliation.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert route-wide Gill source closure
        run: node scripts/gill-final-source-reconciliation-audit.mjs
