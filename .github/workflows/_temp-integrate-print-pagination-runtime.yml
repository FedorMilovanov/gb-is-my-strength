name: TEMP Integrate Print Pagination Runtime

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/_temp-integrate-print-pagination-runtime.mjs'
      - '.github/workflows/_temp-integrate-print-pagination-runtime.yml'

permissions:
  contents: write

concurrency:
  group: temp-integrate-print-pagination-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  integrate-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/universal-print-pagination-marathon-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Integrate pagination into shared reader head runtime
        run: node scripts/_temp-integrate-print-pagination-runtime.mjs
      - name: Validate complete professional audit
        run: node scripts/audit-pro.js
      - name: Build production-like site
        run: npm run strangler:build:production-like
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - name: Run full reader engine sweep
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/runtime-integration/canonical
        run: node scripts/engine-sweep.mjs
      - name: Audit canonical PDF
        run: python3 scripts/print-paper-pdf-audit.py reports/runtime-integration/canonical/reader-print-a4.pdf --out reports/runtime-integration/canonical
      - name: Prove multi-route pagination contract
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/runtime-integration/matrix
        run: node scripts/print-pagination-contract.mjs
      - name: Raster-audit route matrix
        run: python3 scripts/print-pagination-raster-audit.py reports/runtime-integration/matrix --out reports/runtime-integration/matrix-raster
      - name: Commit product integration only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- . ':(exclude)scripts/_temp-integrate-print-pagination-runtime.mjs' ':(exclude).github/workflows/_temp-integrate-print-pagination-runtime.yml'
          git diff --cached --quiet && { echo 'No product integration staged'; exit 1; }
          git commit -m "refactor(print): integrate pagination into shared reader bootstrap"
          git push origin HEAD:fix/universal-print-pagination-marathon-2026-07-25
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-runtime-integration-${{ github.sha }}
          path: reports/runtime-integration
          if-no-files-found: warn
          retention-days: 7
