name: TEMP Extract Pages Witness Summary

on:
  push:
    branches:
      - cleanup/pages-deploy-witness-2026-07-22
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-extract-pages-witness-summary
  cancel-in-progress: true

jobs:
  extract:
    if: github.head_ref == 'cleanup/pages-deploy-witness-2026-07-22' || github.ref_name == 'cleanup/pages-deploy-witness-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SHA: c702f06edb9b36fc171532c7b9bc0bea41b896dc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/pages-deploy-witness-2026-07-22
          fetch-depth: 0

      - name: Extract exact successful deploy witness
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" > /tmp/comments.json
          jq --arg sha "$EXPECTED_SHA" '
            [ .[]
              | select(.body | contains("Workflow: **Deploy to GitHub Pages**"))
              | select(.body | contains("Conclusion: **success**"))
              | select(.body | contains($sha))
              | select(.body | contains("Production blob witness: **PASS**"))
            ] | last
          ' /tmp/comments.json > /tmp/witness.json

          test "$(jq -r '.id // empty' /tmp/witness.json)" != ""
          body=$(jq -r '.body' /tmp/witness.json)
          for asset in \
            js/site-utils.js \
            js/site.js \
            js/floating-cluster-controller.js \
            karty/_engine/map-engine.js \
            konfessii/russkij-baptizm/_app/index.html; do
            grep -F -- "- ${asset}: PASS" <<< "$body"
          done

          run_id=$(sed -n 's/^- Run: \([0-9][0-9]*\).*/\1/p' <<< "$body" | head -1)
          run_number=$(sed -n 's/^- Run: [0-9][0-9]* (#\([0-9][0-9]*\)).*/\1/p' <<< "$body" | head -1)
          run_url=$(sed -n 's/^- Run URL: //p' <<< "$body" | head -1)
          test -n "$run_id"
          test -n "$run_url"

          jq -n \
            --arg workflow "Deploy to GitHub Pages" \
            --arg conclusion "success" \
            --arg run_id "$run_id" \
            --arg run_number "$run_number" \
            --arg head_sha "$EXPECTED_SHA" \
            --arg run_url "$run_url" \
            --arg witness "PASS" \
            --argjson comment_id "$(jq '.id' /tmp/witness.json)" \
            '{workflow:$workflow,conclusion:$conclusion,run_id:$run_id,run_number:$run_number,head_sha:$head_sha,run_url:$run_url,production_blob_witness:$witness,comment_id:$comment_id,assets:["js/site-utils.js","js/site.js","js/floating-cluster-controller.js","karty/_engine/map-engine.js","konfessii/russkij-baptizm/_app/index.html"]}' \
            > .github/_temp-pages-witness-summary.json

      - name: Remove extractor and publish summary
        run: |
          rm -f .github/workflows/_temp-extract-pages-witness.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: capture compact Pages witness summary'
          git push origin HEAD:cleanup/pages-deploy-witness-2026-07-22
