name: TEMP Extract Pages Witness Summary

on:
  push:
    branches:
      - cleanup/pages-deploy-witness-2026-07-22
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  issues: read

concurrency:
  group: temp-extract-pages-witness-summary
  cancel-in-progress: true

jobs:
  extract:
    if: github.head_ref == 'cleanup/pages-deploy-witness-2026-07-22' || github.ref_name == 'cleanup/pages-deploy-witness-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/pages-deploy-witness-2026-07-22
          fetch-depth: 0

      - name: Capture raw latest deploy comment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" > /tmp/comments.json
          jq '[ .[] | select(.body | contains("Deploy to GitHub Pages")) ] | last | {id,created_at,updated_at,body,html_url}' \
            /tmp/comments.json > .github/_temp-pages-witness-summary.json
          test "$(jq -r '.id // empty' .github/_temp-pages-witness-summary.json)" != ""

      - name: Remove extractor and publish summary
        run: |
          rm -f .github/workflows/_temp-extract-pages-witness.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: capture raw Pages witness summary'
          git push origin HEAD:cleanup/pages-deploy-witness-2026-07-22
