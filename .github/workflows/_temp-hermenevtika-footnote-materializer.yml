name: TEMP Hermenevtika footnote materializer

on:
  pull_request:
    paths:
      - '.github/workflows/_temp-hermenevtika-footnote-materializer.yml'
      - '.github/tmp/hermenevtika-materialize.js'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/hermenevtika-static-footnotes-20260727
          fetch-depth: 0

      - name: Materialize and commit exact permanent files once
        shell: bash
        run: |
          set -euo pipefail
          if git log -1 --pretty=%s | grep -q '^fix(hermenevtika): keep footnote Scripture references static$'; then
            echo 'Permanent materialization already committed.'
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/tmp/hermenevtika-materialize.js')
          source = path.read_text(encoding='utf-8')
          replacements = [
              ('const helperCode = `${helperAnchor}\n', 'const helperCode = String.raw`${helperAnchor}\n'),
              ('const browserHelper = `async function checkHermenevtikaFootnotes(browser) {', 'const browserHelper = String.raw`async function checkHermenevtikaFootnotes(browser) {'),
              ('if (!byNumber.has(number)) bad(`${label}: footnote ${number} missing from native contract`);', "if (!byNumber.has(number)) bad(label + ': footnote ' + number + ' missing from native contract');"),
              ('if (interactive.length) bad(`${label}: interactive descendants inside footnotes ${interactive.join(\', \')}`);', "if (interactive.length) bad(label + ': interactive descendants inside footnotes ' + interactive.join(', '));"),
              ('else ok(`${label}: footnote tooltip descendants are static`);', "else ok(label + ': footnote tooltip descendants are static');"),
              ('if (ordinaryScripture < 20) bad(`${label}: ordinary Scripture controls unexpectedly missing (${ordinaryScripture})`);', "if (ordinaryScripture < 20) bad(label + ': ordinary Scripture controls unexpectedly missing (' + ordinaryScripture + ')');"),
              ('else ok(`${label}: ordinary Scripture controls remain active (${ordinaryScripture})`);', "else ok(label + ': ordinary Scripture controls remain active (' + ordinaryScripture + ')');"),
              ('if (!fs.existsSync(sourcePath)) { bad(`Hermenevtika source missing: ${HERMENEUTIKA_SOURCE_REL}`); return; }', "if (!fs.existsSync(sourcePath)) { bad('Hermenevtika source missing: ' + HERMENEUTIKA_SOURCE_REL); return; }"),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one materializer patch anchor, got {count}: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY

          node --check .github/tmp/hermenevtika-materialize.js
          node .github/tmp/hermenevtika-materialize.js
          git restore -- .github/tmp/hermenevtika-materialize.js
          node --check scripts/article-native-contract-audit.js
          node --check scripts/interactive-audit.js
          git diff --check

          cat > /tmp/expected.txt <<'FILES'
          scripts/article-native-contract-audit.js
          scripts/interactive-audit.js
          src/components/article-pilots/hermenevtika/HermenevtikaBody.astro
          FILES
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $(cat /tmp/expected.txt)
          git commit -m 'fix(hermenevtika): keep footnote Scripture references static'
          git push origin HEAD:agent/hermenevtika-static-footnotes-20260727
