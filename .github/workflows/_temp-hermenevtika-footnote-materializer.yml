name: TEMP Hermenevtika footnote materializer

on:
  pull_request:
    paths:
      - '.github/workflows/_temp-hermenevtika-footnote-materializer.yml'
      - '.github/tmp/hermenevtika-materialize.js'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/hermenevtika-static-footnotes-20260727
          fetch-depth: 1
          show-progress: false

      - name: Stop after permanent commit
        id: permanent
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q '^fix(hermenevtika): keep footnote Scripture references static$'; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
            echo 'Permanent materialization already committed.'
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Patch temporary materializer safely
        if: steps.permanent.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/tmp/hermenevtika-materialize.js')
          source = path.read_text(encoding='utf-8')

          old_numbers = "['40', '72', '75', '82', '83', '107']"
          new_numbers = "['40', '72', '75', '77', '82', '83', '107']"
          count = source.count(old_numbers)
          if count != 3:
              raise SystemExit(f'expected three stale footnote lists, got {count}')
          source = source.replace(old_numbers, new_numbers)

          replacements = [
              ('const helperCode = `${helperAnchor}\n', 'const helperCode = String.raw`${helperAnchor}\n'),
              ('const browserHelper = `async function checkHermenevtikaFootnotes(browser) {', 'const browserHelper = String.raw`async function checkHermenevtikaFootnotes(browser) {'),
              ('if (!byNumber.has(number)) bad(`${label}: footnote ${number} missing from native contract`);', "if (!byNumber.has(number)) bad(label + ': footnote ' + number + ' missing from native contract');"),
              ('if (interactive.length) bad(`${label}: interactive descendants inside footnotes ${interactive.join(\', \')}`);', "if (interactive.length) bad(label + ': interactive descendants inside footnotes ' + interactive.join(', '));"),
              ('else ok(`${label}: footnote tooltip descendants are static`);', "else ok(label + ': footnote tooltip descendants are static');"),
              ('if (ordinaryScripture < 20) bad(`${label}: ordinary Scripture controls unexpectedly missing (${ordinaryScripture})`);', "if (ordinaryScripture < 20) bad(label + ': ordinary Scripture controls unexpectedly missing (' + ordinaryScripture + ')');"),
              ('else ok(`${label}: ordinary Scripture controls remain active (${ordinaryScripture})`);', "else ok(label + ': ordinary Scripture controls remain active (' + ordinaryScripture + ')');"),
              ('if (!fs.existsSync(sourcePath)) { bad(`Hermenevtika source missing: ${HERMENEUTIKA_SOURCE_REL}`); return; }', "if (!fs.existsSync(sourcePath)) { bad('Hermenevtika source missing: ' + HERMENEUTIKA_SOURCE_REL); return; }"),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one materializer patch anchor, got {count}: {old}')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY

      - name: Check temporary materializer syntax
        if: steps.permanent.outputs.done != 'true'
        run: node --check .github/tmp/hermenevtika-materialize.js

      - name: Execute temporary materializer
        if: steps.permanent.outputs.done != 'true'
        id: execute
        shell: bash
        run: |
          set +e
          node .github/tmp/hermenevtika-materialize.js > /tmp/materializer.log 2>&1
          status=$?
          cat /tmp/materializer.log
          MATERIALIZER_STATUS="$status" python - <<'PY'
          import os
          import re
          from pathlib import Path

          text = Path('/tmp/materializer.log').read_text(encoding='utf-8', errors='replace')
          text = re.sub(r'\x1b\[[0-9;]*m', '', text)
          lines = text.splitlines()
          start = next((i for i, line in enumerate(lines) if 'AssertionError' in line or 'SyntaxError' in line), None)
          if start is not None:
              block = []
              for line in lines[start:start + 18]:
                  stripped = line.strip()
                  if stripped.startswith('at ') or stripped.startswith('Node.js'):
                      break
                  if stripped and not stripped.startswith(('generatedMessage:', 'code:', 'operator:')):
                      block.append(stripped)
              summary = ' | '.join(block)
          else:
              candidates = [
                  line.strip()
                  for line in lines
                  if any(token in line for token in (
                      'expected ', 'footnote ', 'anchor', 'missing', 'survived',
                      'unexpected', 'ordinary Scripture', 'interactive footnotes', 'unclosed',
                  ))
              ]
              summary = candidates[0] if candidates else (lines[-1].strip() if lines else 'no output')
          summary = re.sub(r'[^0-9A-Za-zА-Яа-яЁё _.,:;()\[\]{}<>/+=!?|\-]+', ' ', summary)
          summary = re.sub(r'\s+', ' ', summary).strip()[:240]
          output = Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as handle:
              handle.write(f"status={os.environ['MATERIALIZER_STATUS']}\n")
              handle.write(f"summary={summary}\n")
          PY
          exit 0

      - name: "Materializer failed — ${{ steps.execute.outputs.summary }}"
        if: steps.permanent.outputs.done != 'true' && steps.execute.outputs.status != '0'
        run: exit 1

      - name: Restore temporary materializer
        if: always() && steps.permanent.outputs.done != 'true'
        run: git restore -- .github/tmp/hermenevtika-materialize.js

      - name: Validate generated JavaScript contracts
        if: steps.permanent.outputs.done != 'true' && steps.execute.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/article-native-contract-audit.js
          node --check scripts/interactive-audit.js
          git diff --check

      - name: Enforce exact three-file scope
        if: steps.permanent.outputs.done != 'true' && steps.execute.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected.txt <<'FILES'
          scripts/article-native-contract-audit.js
          scripts/interactive-audit.js
          src/components/article-pilots/hermenevtika/HermenevtikaBody.astro
          FILES
          git diff --name-only | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Commit exact permanent files
        if: steps.permanent.outputs.done != 'true' && steps.execute.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/article-native-contract-audit.js scripts/interactive-audit.js src/components/article-pilots/hermenevtika/HermenevtikaBody.astro
          git commit -m 'fix(hermenevtika): keep footnote Scripture references static'
          git push origin HEAD:agent/hermenevtika-static-footnotes-20260727
