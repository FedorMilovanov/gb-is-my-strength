name: TEMP Materialize Universal Print Pagination

on:
  pull_request:
    branches:
      - main
    paths:
      - 'css/**'
      - 'js/**'
      - 'scripts/**print-pagination**'
      - 'scripts/engine-sweep.mjs'
      - 'src/components/reader-platform/**'
      - '.github/workflows/_temp-materialize-universal-print-pagination.yml'

permissions:
  contents: write

concurrency:
  group: temp-materialize-universal-print-pagination-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/universal-print-pagination-marathon-2026-07-25
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Materialize shared pagination runtime and remove route-specific CSS
        run: node scripts/_temp-materialize-universal-print-pagination.mjs
      - name: Materialize terminal-tail and follower semantics
        run: |
          mkdir -p reports/universal-print-pagination/diagnostics
          set -o pipefail
          node scripts/_temp-patch-print-terminal-followers.mjs 2>&1 | tee reports/universal-print-pagination/diagnostics/terminal-materializer.log
      - name: Verify asset revisions
        run: npm run cache-bust
      - run: npx playwright install --with-deps chromium
      - run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil
      - name: Build production-like site
        run: npm run strangler:build:production-like
      - name: Run full reader engine sweep and canonical PDF
        env:
          GB_READER_UI_ARTIFACT_DIR: reports/universal-print-pagination/canonical
        run: |
          mkdir -p reports/universal-print-pagination/diagnostics
          set +e
          set -o pipefail
          node scripts/engine-sweep.mjs 2>&1 | tee reports/universal-print-pagination/diagnostics/engine-sweep.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/universal-print-pagination/diagnostics/engine-sweep.exit
          exit 0
      - name: Audit canonical PDF raster, palette and pagination
        run: |
          set +e
          set -o pipefail
          python3 scripts/print-paper-pdf-audit.py reports/universal-print-pagination/canonical/reader-print-a4.pdf --out reports/universal-print-pagination/canonical 2>&1 | tee reports/universal-print-pagination/diagnostics/canonical-audit.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/universal-print-pagination/diagnostics/canonical-audit.exit
          exit 0
      - name: Audit atomic and keep-with-next components across route families
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/universal-print-pagination/matrix
        run: |
          set +e
          set -o pipefail
          node scripts/print-pagination-contract.mjs 2>&1 | tee reports/universal-print-pagination/diagnostics/pagination-matrix.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/universal-print-pagination/diagnostics/pagination-matrix.exit
          exit 0
      - name: Raster-audit every route PDF and build contact sheets
        run: |
          set +e
          set -o pipefail
          python3 scripts/print-pagination-raster-audit.py reports/universal-print-pagination/matrix --out reports/universal-print-pagination/matrix-raster 2>&1 | tee reports/universal-print-pagination/diagnostics/matrix-raster.log
          code=${PIPESTATUS[0]}
          echo "$code" > reports/universal-print-pagination/diagnostics/matrix-raster.exit
          exit 0
      - name: Assert all universal print gates
        run: |
          engine=$(cat reports/universal-print-pagination/diagnostics/engine-sweep.exit)
          canonical=$(cat reports/universal-print-pagination/diagnostics/canonical-audit.exit)
          matrix=$(cat reports/universal-print-pagination/diagnostics/pagination-matrix.exit)
          raster=$(cat reports/universal-print-pagination/diagnostics/matrix-raster.exit)
          echo "engine=$engine canonical=$canonical matrix=$matrix raster=$raster"
          test "$engine" = 0
          test "$canonical" = 0
          test "$matrix" = 0
          test "$raster" = 0
      - name: Publish product patch without workflow mutation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A -- . ':(exclude)scripts/_temp-*' ':(exclude).github/workflows/_temp-*'
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m "fix(print): introduce universal semantic pagination"
          git push origin HEAD:fix/universal-print-pagination-marathon-2026-07-25
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universal-print-pagination-proof-${{ github.sha }}
          path: reports/universal-print-pagination
          if-no-files-found: warn
          retention-days: 7
