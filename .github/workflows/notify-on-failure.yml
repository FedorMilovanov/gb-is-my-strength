name: CI State Notifier

on:
  workflow_run:
    workflows:
      - "Metadata & IndexNow Readiness"
      - "Deploy to GitHub Pages"
      - "Deployment Witness Ledger"
      - "IndexNow — Notify Search Engines"
      - "TTS Download Consent"
      - "Source Link Audit"
      - "Runtime Interactive Audit"
      - "Visual Parity Guard — pixel-diff"
      - "Dist Strangler Dry Run"
      - "Shared Files Guard"
    types: [completed]

permissions:
  actions: read       # factual run/job/artifact evidence and stale-event suppression
  contents: read      # checkout trusted recorder from the default branch
  issues: write       # open/update/reopen/close stable CI state issues

concurrency:
  group: ci-state-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_branch || 'unknown' }}
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile workflow state issue
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted notifier from default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Record factual workflow state transition
        uses: actions/github-script@v7
        with:
          script: |
            const recordState = require('./scripts/record-ci-workflow-state.cjs');
            await recordState({
              github,
              context,
              core,
              workflowRun: context.payload.workflow_run,
            });
