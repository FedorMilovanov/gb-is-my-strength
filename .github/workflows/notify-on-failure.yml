name: Notify on Workflow Failure

# Stateful lifecycle for owner-visible CI alerts.
# The workflow opens/updates one issue per workflow + same-repository branch/PR
# identity, records exact job/step/artifact evidence, and closes only after a
# newer successful run. Cancelled/superseded runs never create false failures.

on:
  workflow_run:
    workflows:
      - "Native Source Contract"
      - "Route Registry Validators"
      - "Metadata & IndexNow Readiness"
      - "Search Manifest Policy"
      - "Deploy Candidate Contract"
      - "Deploy to GitHub Pages"
      - "Deployment Witness Ledger"
      - "Source Link Audit"
      - "Runtime Interactive Audit"
      - "Visual Parity Guard — pixel-diff"
      - "Dist Strangler Dry Run"
      - "Shared Files Guard"
      - "Product to Research release witness"
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-failure-lifecycle-${{ github.event.workflow_run.name }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile failure lifecycle from trusted default-branch code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const defaultBranch = context.payload.repository.default_branch;
            const path = 'scripts/ci-failure-lifecycle.cjs';

            // workflow_run carries a write-capable token. Never checkout or
            // execute the triggering branch. Fetch the notifier module from the
            // trusted default branch through the Contents API instead.
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: defaultBranch,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              throw new Error(`${path} is not a readable default-branch file`);
            }

            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const loaded = { exports: {} };
            const evaluate = new Function('module', 'exports', 'require', source);
            evaluate(loaded, loaded.exports, require);
            if (typeof loaded.exports !== 'function') {
              throw new Error(`${path} must export one notifier function`);
            }

            await loaded.exports({ github, context, core, workflowRun });

      - name: Publish durable Product to Research success receipt
        if: >-
          github.event.workflow_run.name == 'Product to Research release witness' &&
          github.event.workflow_run.conclusion == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- product-research-release-witness:v1 -->';
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });
            const visible = artifacts
              .filter((artifact) => artifact && !artifact.expired)
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));
            const artifactLines = visible.length
              ? visible.map((artifact) => `- **${artifact.name}** — ID ${artifact.id}, ${artifact.size_in_bytes} bytes`)
              : ['- No unexpired artifact was returned.'];
            const body = [
              marker,
              '# Product → Research release witness',
              '',
              '- **Conclusion:** `success`',
              `- **Tested SHA:** \`${run.head_sha}\``,
              `- **Run:** [${run.id} attempt ${run.run_attempt || 1}](${run.html_url})`,
              `- **Branch:** \`${run.head_branch}\``,
              `- **Event:** \`${run.event}\``,
              `- **Created:** ${run.created_at}`,
              `- **Updated:** ${run.updated_at}`,
              '',
              '## Passed boundaries',
              '',
              '- immutable Diotrophes Wave 12 release transaction;',
              '- current Wave 10–12 authority, RSS, sitemap, Pagefind and links-graph contracts;',
              '- current pastor-series native publication contract;',
              '- Pihahiroth three-corridor static, desktop, mobile and no-JS contracts;',
              '- current metadata, ownership, public-surface, Astro and map contracts;',
              '- Wave 12 Chromium, WebKit, no-JS and print contract;',
              '- clean tracked source tree after validation.',
              '',
              '## Evidence artifacts',
              '',
              ...artifactLines,
              '',
              'This receipt does not grant quotation, rights, or publication authority beyond the validated Product contracts.',
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && String(issue.body || '').includes(marker));
            const title = `✅ Product release witness ${String(run.head_sha).slice(0, 12)}`;
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Updated Product release witness issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: created.data.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Created Product release witness issue #${created.data.number}`);
            }
