name: CI Failure Diagnostics

# Read-only diagnostics for failed workflow runs.
#
# Owner policy: CI failures must not create/update GitHub issues or comments.
# GitHub issue mutations caused an unbounded notification/email lifecycle and are
# intentionally forbidden by the source contract. The actual validation workflows
# remain unchanged; this observer only surfaces factual job/step/artifact evidence
# in its own Actions log when a monitored run fails.

on:
  workflow_run:
    workflows:
      - "Native Source Contract"
      - "Route Registry Validators"
      - "Metadata & IndexNow Readiness"
      - "Search Manifest Policy"
      - "Deploy Candidate Contract"
      - "Deploy to GitHub Pages"
      - "Deployment Witness Ledger"
      - "Source Link Audit"
      - "Runtime Interactive Audit"
      - "Visual Parity Guard — pixel-diff"
      - "Dist Strangler Dry Run"
      - "Shared Files Guard"
      - "Product to Research release witness"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  diagnostics:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report factual failure evidence from trusted default-branch code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const defaultBranch = context.payload.repository.default_branch;
            const path = 'scripts/ci-failure-lifecycle.cjs';

            // workflow_run can be security-sensitive. Never checkout or execute
            // the triggering branch. Read the diagnostic module from the trusted
            // default branch through the Contents API.
            const { data: file } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: defaultBranch,
            });
            if (Array.isArray(file) || file.type !== 'file' || !file.content) {
              throw new Error(`${path} is not a readable default-branch file`);
            }

            const source = Buffer.from(file.content, 'base64').toString('utf8');
            const loaded = { exports: {} };
            const evaluate = new Function('module', 'exports', 'require', source);
            evaluate(loaded, loaded.exports, require);
            if (typeof loaded.exports !== 'function') {
              throw new Error(`${path} must export one diagnostic function`);
            }

            await loaded.exports({ github, context, core, workflowRun });
