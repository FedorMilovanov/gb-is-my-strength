name: Notify on Workflow Failure

on:
  workflow_run:
    workflows:
      - "Metadata & IndexNow Readiness"
      - "Deploy to GitHub Pages"
      - "Deployment Witness Ledger"
      - "Source Link Audit"
      - "Runtime Interactive Audit"
      - "Visual Parity Guard — pixel-diff"
      - "Dist Strangler Dry Run"
      - "Shared Files Guard"
    types: [completed]

  pull_request:
    paths:
      - '.github/workflows/notify-on-failure.yml'
      - 'scripts/ci-failure-lifecycle.cjs'
      - 'scripts/ci-failure-lifecycle-contract-test.cjs'
      - 'scripts/ci-failure-lifecycle-source-contract-test.cjs'

permissions:
  contents: read

concurrency:
  group: >-
    notify-lifecycle-${{ github.event.workflow_run.name || github.run_id }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Check lifecycle module syntax
        run: |
          node --check scripts/ci-failure-lifecycle.cjs
          node --check scripts/ci-failure-lifecycle-contract-test.cjs
          node --check scripts/ci-failure-lifecycle-source-contract-test.cjs
      - name: Run lifecycle state-machine fixture
        run: node scripts/ci-failure-lifecycle-contract-test.cjs
      - name: Run notifier source contract
        run: node scripts/ci-failure-lifecycle-source-contract-test.cjs

  lifecycle:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted notifier implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Apply factual CI lifecycle transition
        uses: actions/github-script@v7
        with:
          script: |
            const lifecycle = require('./scripts/ci-failure-lifecycle.cjs');
            await lifecycle.handleWorkflowLifecycle({
              github,
              context,
              core,
              workflowRun: context.payload.workflow_run,
            });
