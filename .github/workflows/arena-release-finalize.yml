name: Arena Release Finalize

on:
  push:
    branches:
      - arena/019fd7ff-gb-is-my-strength

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[arena-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019fd7ff-gb-is-my-strength
          fetch-depth: 0

      - name: Apply approved final visual adjustments
        shell: python
        run: |
          from pathlib import Path

          ref = Path('src/components/home/HomeSections/Refutations.astro')
          s = ref.read_text(encoding='utf-8')
          replacements = {
              'transform: translate3d(14px, -7px, 0);': 'transform: translate3d(18px, -7px, 0);',
              'transform: translate3d(-14px, -7px, 0);': 'transform: translate3d(-18px, -7px, 0);',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Refutations expected token missing: {old}')
              s = s.replace(old, new, 1)
          ref.write_text(s, encoding='utf-8')

          directions = Path('src/components/home/HomeSections/Directions.astro')
          s = directions.read_text(encoding='utf-8')

          exact = [
              (
                  '''    body.home-page #main-content .h-home-routes {\n      min-height: 0;\n      border-radius: 18px;\n      padding: 6px;\n    }''',
                  '''    body.home-page #main-content .h-home-routes {\n      min-height: 0;\n      border-radius: 18px;\n      padding: 8px;\n      gap: 12px;\n      scroll-padding-inline: 8px;\n    }\n\n    body.home-page #main-content .h-home-route__divider {\n      display: none;\n    }'''
              ),
              (
                  '''    body.home-page #main-content .h-home-route {\n      flex-basis: min(82vw, 300px);\n      min-height: 0;\n      grid-template-rows: auto auto auto auto;\n      align-content: start;\n      padding: 18px 20px 18px;\n      border-radius: 14px;\n    }''',
                  '''    body.home-page #main-content .h-home-route {\n      flex: 0 0 calc(100% - 18px);\n      min-height: 236px;\n      grid-template-columns: minmax(0, 1fr);\n      grid-template-rows: auto 124px auto auto;\n      align-content: start;\n      padding: 14px 18px 16px;\n      border-radius: 14px;\n      scroll-snap-align: start;\n      scroll-snap-stop: always;\n    }'''
              ),
              (
                  '''    body.home-page #main-content .h-home-route__glyph {\n      min-height: 110px;\n      margin: 4px 0 12px;\n    }''',
                  '''    body.home-page #main-content .h-home-route__glyph {\n      width: 178px;\n      min-height: 124px;\n      height: 124px;\n      justify-self: center;\n      margin: 0 auto 8px;\n    }'''
              ),
              (
                  '''    body.home-page #main-content .h-route-object {\n      width: min(82%, 156px);\n      max-height: 116px;\n    }''',
                  '''    body.home-page #main-content .h-route-object {\n      width: 178px;\n      max-width: 178px;\n      max-height: 124px;\n    }\n\n    /* Mobile-only optical compensation for transparent PNG margins. */\n    body.home-page #main-content .h-home-route[data-home-route="articles"] {\n      --route-object-scale: 1.30;\n      --route-object-hover-scale: 1.306;\n      --route-object-y: 0px;\n    }\n\n    body.home-page #main-content .h-home-route[data-home-route="series"] {\n      --route-object-scale: .96;\n      --route-object-hover-scale: .966;\n      --route-object-y: 0px;\n    }\n\n    body.home-page #main-content .h-home-route[data-home-route="biographies"] {\n      --route-object-scale: .98;\n      --route-object-hover-scale: .986;\n      --route-object-y: 0px;\n    }\n\n    body.home-page #main-content .h-home-route[data-home-route="maps"] {\n      --route-object-scale: 1.05;\n      --route-object-hover-scale: 1.056;\n      --route-object-y: 0px;\n    }\n\n    body.home-page #main-content .h-home-route[data-home-route="confessions"] {\n      --route-object-scale: .94;\n      --route-object-hover-scale: .946;\n      --route-object-y: 0px;\n    }'''
              ),
              (
                  '''    body.home-page #main-content .h-home-route__copy strong {\n      font-size: 1.14rem;\n      line-height: 1.1;\n    }''',
                  '''    body.home-page #main-content .h-home-route__copy strong {\n      margin-bottom: 6px;\n      font-size: 1rem;\n      line-height: 1.12;\n    }'''
              ),
              (
                  '''    body.home-page #main-content .h-home-route__arrow {\n      margin-top: 10px;\n      font-size: 16px;\n    }''',
                  '''    body.home-page #main-content .h-home-route__arrow {\n      margin-top: 8px;\n      font-size: 16px;\n    }'''
              ),
              (
                  '''      flex-basis: min(86vw, 280px);''',
                  '''      flex-basis: calc(100% - 16px);'''
              ),
          ]

          for old, new in exact:
              if old not in s:
                  raise SystemExit('Directions expected block missing:\n' + old)
              s = s.replace(old, new, 1)

          directions.write_text(s, encoding='utf-8')

      - name: Refresh deterministic scripture occurrence index
        run: node scripts/build-scripture-occurrence-index.mjs --write

      - name: Verify focused changes and commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/home/HomeSections/Refutations.astro \
            src/components/home/HomeSections/Directions.astro \
            data/scripture-search-index.json
          if git diff --cached --quiet; then
            echo "Nothing to finalize"
            exit 0
          fi
          git commit -m "fix(home): finalize approved motion and mobile shelf [arena-finalized]"
          git push origin HEAD:arena/019fd7ff-gb-is-my-strength
