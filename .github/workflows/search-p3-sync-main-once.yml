name: Search P3 sync latest main once

on:
  pull_request:
    types: [synchronize]
    branches: [main]
    paths:
      - '.github/workflows/search-p3-sync-main-once.yml'

permissions:
  contents: write

concurrency:
  group: search-p3-sync-main-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-and-self-clean:
    if: github.event.pull_request.head.ref == 'fix/search-truthful-continuation-20260808-r1'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Search P3 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/search-truthful-continuation-20260808-r1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge current main fail-closed
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_HEAD" || { echo "stale Search P3 head: $actual != $EXPECTED_HEAD"; exit 1; }
          git fetch origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-edit origin/main; then
            echo "Search P3 latest-main merge conflicts:" >&2
            git status --short >&2
            git merge --abort || true
            exit 1
          fi
          node scripts/cache-bust.js
          git diff --check

      - name: Self-clean sync transport
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/search-p3-sync-main-once.yml
          git add -A
          git diff --cached --check
          git commit -m "merge(main): refresh Search P3 candidate on latest main"
          git push origin "HEAD:${HEAD_REF}"
