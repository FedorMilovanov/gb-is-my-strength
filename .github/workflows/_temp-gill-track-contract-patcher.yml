name: TEMP Gill Track Contract Patcher

on:
  push:
    branches:
      - fix/reader-control-residuals-20260810
    paths:
      - scripts/_temp-gill-track-contract-patcher.mjs
      - .github/workflows/_temp-gill-track-contract-patcher.yml

permissions:
  contents: write

concurrency:
  group: temp-gill-track-contract-patcher
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/reader-control-residuals-20260810
          fetch-depth: 0

      - name: Calibrate fail-closed Gill track assertion
        run: node scripts/_temp-gill-track-contract-patcher.mjs

      - name: Remove one-shot applicator
        run: rm scripts/_temp-gill-track-contract-patcher.mjs .github/workflows/_temp-gill-track-contract-patcher.yml

      - name: Commit bounded contract result
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo 'No contract calibration produced'; exit 1; } || true
          git commit -m "test(gill): require semantic track carrier"
          git push origin HEAD:fix/reader-control-residuals-20260810
