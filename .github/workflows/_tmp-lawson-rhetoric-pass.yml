name: Temporary Lawson rhetoric pass

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/lawson-theme-rhetoric-final
          fetch-depth: 0

      - name: Apply exact rhetoric edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              '<li><strong>Это не доказывает, что прежние проповеди были сознательной ложью, и не даёт права объявлять Лоусона необращённым.</strong> Но делает центральной проблему самообмана: человек может правильно формулировать истину и всё же не позволять ей управлять собственной жизнью.</li>',
              '<li><strong>Главная проблема здесь — самообман, а не попытка объявить прежние проповеди сознательной ложью или вынести приговор об обращении Лоусона.</strong> Человек может правильно формулировать истину и всё же не позволять ей управлять собственной жизнью.</li>',
              1,
            ),
            (
              'Это не означает, что автобиографию следует заранее подозревать во лжи. Но её жанр требует',
              'Автобиография ценна как первичное свидетельство автора о себе; её жанр при этом требует',
              1,
            ),
            (
              'Это не приговор и не пророчество, а свидетельство о состоянии человека в первые месяцы после падения, переданное расположенным к нему автором.',
              'Это свидетельство о состоянии человека в первые месяцы после падения, переданное расположенным к нему автором.',
              1,
            ),
            (
              'Опора на факты не означает наивности.',
              'Фактическая строгость не требует наивности.',
              1,
            ),
            (
              'Статья приводит её как описание позиции 2025 года, а не как обязательство, данное навсегда: обстоятельства меняются, и пересмотр намерения не является грехом. Но честность требует заметить, что книга 2026 года и публичные комментарии октября 2026 года <LawsonSourceRef id="LAW-39" /> от этого намерения отступают. Само по себе это ничего не доказывает. Доказательным было бы обратное — если бы статья цитировала обещание молчать и делала вид, что последующие события его не касаются.',
              'Фраза описывает позицию 2025 года, а не пожизненное обещание. Книга 2026 года и публичные комментарии октября 2026 года <LawsonSourceRef id="LAW-39" /> показывают, что эта позиция изменилась. В этом нет самостоятельного обвинения; важно лишь не читать старое заявление так, будто последующих событий не было.',
              1,
            ),
            (
              'Статья не делает из этого вывода о нечестности: взгляды пересматривать законно, и пересмотр не обязательно лицемерен. Фиксируется другое —',
              'Само по себе расхождение не доказывает нечестность: взгляды можно пересматривать. Важнее другое —',
              1,
            ),
            (
              'Статья не требует публичного раскрытия и не называет имён — но отсутствие в исповедании слова о том, кому именно был причинён вред, остаётся самой заметной незаполненной строкой всей этой истории.',
              'Имена здесь не нужны; проблема в другом: отсутствие в исповедании слова о том, кому именно был причинён вред, остаётся самой заметной незаполненной строкой всей этой истории.',
              1,
            ),
            (
              'Статья не делает из этого вывода о чьей-либо вине и не знает, знал ли кто-либо в этом учебном заведении о происходившем. Но она фиксирует, что институциональная связь существовала — и что публичная запись несколько месяцев опиралась на утверждение, которое позже было исправлено тем, кто его сделал.',
              'Институциональная связь сама по себе не устанавливает чью-либо вину и не показывает, знал ли кто-либо в учебном заведении о происходившем. Но связь существовала, а публичная запись несколько месяцев опиралась на утверждение, которое позже исправил сам его автор.',
              1,
            ),
            (
              'Статья не присоединяется к слову «богохульный», но считает сам вопрос законным — и отмечает, что это единственный из публичных разборов, который разбирает не решение издать книгу, а её богословие.',
              'Слово «богохульный» принадлежит Джонсу; предметный вопрос при этом законен. Это единственный из публичных разборов, который разбирает не решение издать книгу, а её богословие.',
              1,
            ),
            (
              'Статья не объясняет движение рейтинга: за десять дней к нему могли добавиться и читатели, пришедшие позже первых рецензентов, и что-то ещё — данных для выбора между объяснениями нет.',
              'Причина движения рейтинга неизвестна: за десять дней к нему могли добавиться и читатели, пришедшие позже первых рецензентов, и что-то ещё — данных для выбора между объяснениями нет.',
              1,
            ),
            (
              'Статья не утверждает, что комментатор — Лоусон. Она не утверждает и обратного. Всё, что здесь можно утверждать, — что такой комментарий был, что он был отредактирован и что он распространялся одинаково на нескольких каналах.',
              'Авторство комментария не установлено. По доступному носителю можно установить лишь, что такой комментарий был, что его отредактировали и что одинаковый текст распространялся на нескольких каналах.',
              1,
            ),
            (
              'Что из этого следует и чего не следует.\n\nНе следует, что Лоусон «рвётся в служение». В комментарии нет ни слова о кафедре, о возвращении к проповеди или о должности. Он говорит о книге и о её возможной пользе для других.',
              'Что действительно видно из комментария.\n\nО возвращении к кафедре, проповеди или должности он не говорит. Речь идёт о книге и о её возможной пользе для других.',
              1,
            ),
            (
              'Статья не утверждает, что книгу не следовало писать. Не утверждает, что Лоусон необращён. Не утверждает, что он обязан молчать всю оставшуюся жизнь. Не утверждает, что его прежние проповеди следует удалить.\n\nОна утверждает одно: **книга не может логически удостоверить восстановленную достоверность своего автора**.',
              'Тезис статьи уже всех этих возражений: она не выносит приговора о самой допустимости книги, обращении Лоусона, пожизненном молчании или судьбе прежних проповедей. **Книга не может логически удостоверить восстановленную достоверность своего автора**.',
              1,
            ),
            (
              'Недоказанные версии: что говорят и чего это не доказывает',
              'Недоказанные версии: что выдерживает проверку',
              2,
            ),
            (
              'Статья не считает их мусором: часть из них может оказаться верной, и выбросить их — значит потерять информацию. Но и повышать их до факта нельзя.',
              'Их нельзя просто выбросить: часть может оказаться верной и указывать на реальные пробелы. Но до факта они не дотягивают.',
              1,
            ),
            (
              'Статья этот вопрос не решает и не использует.',
              'Для аргумента статьи этот вопрос не нужен.',
              1,
            ),
            (
              'Статья не оценивает, верен ли новый взгляд богословски; она фиксирует, что спор о возрождённости теперь идёт не только вокруг внешних признаков, но и вокруг пересмотренного определения.',
              'Здесь важен не приговор новому взгляду, а сам факт: спор о возрождённости теперь идёт не только вокруг внешних признаков, но и вокруг пересмотренного определения.',
              1,
            ),
            (
              'Прямого заявления нет ни от одного из супругов. Статья не описывает состояние брака ни как завершённое примирение, ни как состоявшийся развод.',
              'Прямого заявления нет ни от одного из супругов, поэтому публично установленного ответа о примирении или разводе нет.',
              1,
            ),
            (
              'Статья не выбирает между этими чтениями.',
              'Данных, позволяющих выбрать между этими чтениями, нет.',
              1,
            ),
            (
              'Статья не переносит объяснение с отдельного человека на движение и не называет имён других павших служителей, которые в этом контексте упоминаются.',
              'Одного такого свидетельства недостаточно, чтобы переносить объяснение с отдельного человека на целое движение или делать выводы о других служителях, упомянутых в этом контексте.',
              1,
            ),
            (
              'Статья не выбирает между этими вариантами.',
              'Данных, позволяющих выбрать между этими вариантами, нет.',
              1,
            ),
            (
              'Статья не утверждает, что книга провалилась, — только что значок не означает того, что он, кажется, означает.',
              'Точных цифр продаж нет; значок «первое место» сам по себе не доказывает коммерческий успех.',
              1,
            ),
            (
              'Это не доказывает, что интервью было записано и затем кем-то остановлено. Условные формулировки Арчера этого не позволяют. Источник доказывает другое: на раннем этапе даже сравнительно небольшой публичный выход Лоусона мыслился как действие, которое не должен единолично разрешать сам Лоусон.',
              'Условные формулировки Арчера не позволяют сказать, было ли интервью записано или затем остановлено. Зато источник показывает: на раннем этапе даже сравнительно небольшой публичный выход Лоусона мыслился как действие, которое не должен единолично разрешать сам Лоусон.',
              1,
            ),
            (
              'Это не доказывает ничего дурного — самостоятельная публикация полностью согласуется с тем, что прежние контракты были расторгнуты, <LawsonSourceRef id="LAW-04" /> — но объясняет, почему версия о подделке вообще возникла.',
              'Эта деталь сама по себе не указывает на нарушение: самостоятельная публикация полностью согласуется с тем, что прежние контракты были расторгнуты. <LawsonSourceRef id="LAW-04" /> Но она объясняет, почему версия о подделке вообще возникла.',
              1,
            ),
            (
              '<strong>Редакционная граница.</strong> Статья не объявляет Стивена Лоусона необращённым, не идентифицирует женщину, с которой были связаны его греховные отношения, не утверждает развод или завершённое примирение без прямого источника, не выдаёт непрозрачность процесса за доказательство отсутствия процесса и не превращает пастырские рекомендации о длительной тихой верности в новый библейский числовой закон. Эпизод октября 2026 года передан по единственному носителю, и статья не утверждает, что автор комментария — Лоусон. Пересказ удалённых публикаций Фила Джонсона используется для подтверждения факта его заявления, а не для установления обстоятельств отношений. Читательские оценки книги приводятся как оценки, а не как сведения о её содержании. Разделы о недоказанных версиях и о закономерностях существуют именно для того, чтобы не потерять публично звучащие утверждения и странные действия, — и каждый такой пункт несёт собственную границу: версия не повышена до факта, а замеченная закономерность не превращена в утверждение о намерении.',
              '<strong>Редакционная граница.</strong> Неизвестное остаётся неизвестным. Без прямых источников статья не устанавливает состояние брака, личность женщины, авторство октябрьского комментария или скрытые мотивы участников. Пастырские рекомендации не выдаются за библейский числовой закон, а читательские оценки — за факты.',
              1,
            ),
          ]

          for old, new, expected in replacements:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'expected {expected} match(es), found {count}: {old[:100]!r}')
              text = text.replace(old, new)

          # The article should no longer rely on repetitive self-referential caveats.
          if text.count('Статья не') > 10:
              raise SystemExit(f'too many remaining self-referential caveats: {text.count("Статья не")}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Prove scoped diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx | sed -n '1,260p'

      - name: Commit rhetoric pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx
          git commit -m 'edit(lawson): tighten evidentiary rhetoric'
          git push origin HEAD:audit/lawson-theme-rhetoric-final
