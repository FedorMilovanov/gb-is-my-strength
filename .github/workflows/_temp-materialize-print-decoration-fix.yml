name: TEMP Materialize Print Decoration Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-materialize-print-decoration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Apply product patch
        run: python3 scripts/_temp-apply-print-decoration-fix.py
      - name: Synchronize cache-busted asset consumers
        run: node scripts/cache-bust.js --write
      - name: Static validation
        run: |
          node --check js/reader-preferences-head.js
          node --check scripts/print-pagination-contract.mjs
          python3 -m py_compile scripts/print-pagination-raster-audit.py
          node scripts/cache-bust.js
          git diff --check
          ! grep -RInE 'html body::before[[:space:]]*\{' css/floating-cluster.css
          grep -F 'GB PRINT CONTRACT v2.8' css/site.css
          grep -F "'.flip-card-back'" js/reader-preferences-head.js
      - name: Commit product patch only
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add css/floating-cluster.css css/site.css js/reader-preferences-head.js scripts/print-pagination-contract.mjs scripts/print-pagination-raster-audit.py src/lib/asset-version.js
          git add -u -- '*.html' '*.astro'
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m 'fix(print): remove gold bars and keep card faces intact'
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
