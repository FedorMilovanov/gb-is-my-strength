name: TEMP Finalize Print Decoration Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-print-decoration-finalize.yml'

permissions:
  contents: read

concurrency:
  group: temp-finalize-print-decoration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Retired duplicate finalizer; canonical materializer owns this transaction.'
