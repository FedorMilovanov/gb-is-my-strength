name: TEMP Finalize Print Decoration Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-print-decoration-finalize.yml'
      - 'scripts/_temp-materialize-print-decoration-pagination.mjs'

permissions:
  contents: write

concurrency:
  group: temp-finalize-print-decoration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.head_ref == 'fix/print-decoration-pagination-2026-07-25'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout product lane
        uses: actions/checkout@v4
        with:
          ref: fix/print-decoration-pagination-2026-07-25
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconstruct product from exact merged base
        run: node scripts/_temp-materialize-print-decoration-pagination.mjs

      - name: Canonicalize generated files and synchronize revisions last
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('css/site.css', 'scripts/print-pagination-raster-audit.py'):
              path = Path(name)
              path.write_text(path.read_text('utf-8').rstrip() + '\n', 'utf-8')
          PY
          node scripts/cache-bust.js --write

      - name: Validate source and workflow contracts
        run: |
          mkdir -p reports
          set +e
          set -o pipefail
          (
            set -euo pipefail
            check() {
              label="$1"
              shift
              printf '\n===== %s =====\n' "$label"
              "$@"
              printf 'PASS: %s\n' "$label"
            }
            check 'reader runtime syntax' node --check js/reader-preferences-head.js
            check 'pagination contract syntax' node --check scripts/print-pagination-contract.mjs
            check 'raster audit syntax' python3 -m py_compile scripts/print-pagination-raster-audit.py
            check 'cache-bust read-only clean' node scripts/cache-bust.js
            check 'diff whitespace clean' git diff --check
            check 'runtime marker present' grep -Fq 'GB_PRINT_REVERSIBLE_CARD_ROOTS_V1' js/reader-preferences-head.js
            check 'print v2.9 present' grep -Fq 'GB PRINT CONTRACT v2.9' css/site.css
            check 'paper branding preserved' grep -Fq 'ГОСПОДЬ БОГ — СИЛА МОЯ' css/site.css
            check 'progress controls targeted' grep -Fq '#reading-progress, .h-reading-progress' css/site.css
            check 'paper-aware raster helper present' grep -Fq 'paper_ratio_around' scripts/print-pagination-raster-audit.py
            printf '\n===== obsolete v2.8 absent =====\n'
            if grep -Fq 'GB PRINT CONTRACT v2.8' css/site.css; then
              echo 'obsolete v2.8 remains' >&2
              exit 1
            fi
            echo 'PASS: obsolete v2.8 absent'
            printf '\n===== duplicate body progress absent =====\n'
            if grep -Fq 'transform: scaleX(var(--gb-read-pct, 0))' css/floating-cluster.css; then
              echo 'duplicate body progress remains' >&2
              exit 1
            fi
            echo 'PASS: duplicate body progress absent'
            check 'workflow actionlint' node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-print-decoration-finalize.yml
          ) 2>&1 | tee reports/print-decoration-validation.log
          code=${PIPESTATUS[0]}
          exit "${code}"

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install browser and PDF dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Run universal multi-route pagination proof
        env:
          GB_PRINT_PAGINATION_ARTIFACT_DIR: reports/print-decoration-final
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/print-pagination-contract.mjs 2>&1 | tee reports/print-decoration-final.log

      - name: Raster-audit every generated PDF
        run: |
          python3 scripts/print-pagination-raster-audit.py \
            reports/print-decoration-final \
            --out reports/print-decoration-final-raster

      - name: Commit tested product only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            css/floating-cluster.css \
            css/site.css \
            js/reader-preferences-head.js \
            scripts/print-pagination-contract.mjs \
            scripts/print-pagination-raster-audit.py \
            src/lib/asset-version.js
          git add -u -- '*.html' '*.astro'
          git diff --cached --check
          git diff --cached --quiet && { echo 'No product changes staged' >&2; exit 1; }
          git commit -m 'fix(print): remove gold progress and keep card face atomic'
          git push origin HEAD:fix/print-decoration-pagination-2026-07-25

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-decoration-final-${{ github.run_id }}
          path: |
            reports/print-decoration-validation.log
            reports/print-decoration-final.log
            reports/print-decoration-final/
            reports/print-decoration-final-raster/
          if-no-files-found: warn
          retention-days: 14
