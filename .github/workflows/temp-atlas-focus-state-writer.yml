name: TEMP Atlas Focus State Writer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-atlas-focus-state-writer.yml'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-atlas-focus-state-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply bounded runtime patch
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          node scripts/temp-atlas-focus-state-patch.mjs
          rm scripts/temp-atlas-focus-state-patch.mjs
          rm .github/workflows/temp-atlas-focus-state-writer.yml
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-focus-state-browser-test.mjs
          git diff --check
      - name: Commit final repair surface
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/atlas-runtime.js scripts/temp-atlas-focus-state-patch.mjs .github/workflows/temp-atlas-focus-state-writer.yml
          git commit -m "fix(atlas): make hidden-state focus ownership deterministic"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git push origin "HEAD:${BRANCH}"
