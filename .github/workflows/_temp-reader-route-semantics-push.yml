name: Temp Reader route semantics push executor

on:
  push:
    branches:
      - agent/reader-route-semantics-146

permissions:
  contents: write

concurrency:
  group: temp-reader-route-semantics-push
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract and run canonical patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/_temp-reader-route-semantics-inventory.yml').read_text(encoding='utf-8')
          marker = "cat > /tmp/route-semantics-patcher.py <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          patcher = textwrap.dedent(workflow[start:end]) + '\n'
          Path('/tmp/route-semantics-patcher.py').write_text(patcher, encoding='utf-8')
          PY
          python /tmp/route-semantics-patcher.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate route semantics
        run: |
          node --check scripts/lib/public-surface-registry.js
          node --check scripts/public-surface-registry-regression-test.js
          node --check scripts/public-surface-browser-matrix.mjs
          node --check scripts/lib/route-source-contract.js
          npm run surface:registry:check
          npm run surface:registry:test
          node scripts/route-profile-contract-audit.js --strict

      - name: Commit permanent contract changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {
            'scripts/lib/public-surface-registry.js',
            'scripts/lib/route-source-contract.js',
            'scripts/public-surface-browser-matrix.mjs',
            'scripts/public-surface-registry-regression-test.js',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          unexpected = changed - allowed
          if unexpected:
            raise SystemExit('unexpected changed files: ' + ', '.join(sorted(unexpected)))
          print('Permanent changed files:', ', '.join(sorted(changed)) or '<none>')
          PY
          if git diff --quiet; then
            echo 'Permanent contracts already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            scripts/lib/public-surface-registry.js \
            scripts/lib/route-source-contract.js \
            scripts/public-surface-browser-matrix.mjs \
            scripts/public-surface-registry-regression-test.js
          git commit -m 'refactor(reader): enforce route semantic roles'
          git push origin HEAD:agent/reader-route-semantics-146
