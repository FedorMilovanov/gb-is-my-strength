name: Temporary RSS Normalization After TMA Sync

on:
  push:
    branches:
      - agent/tma-editorial-projection-sync-2026-07-30

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize deterministic RSS
        run: node scripts/rss-feed-normalizer.js --write

      - name: Remove temporary workflow and validate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_temp-normalize-rss-after-tma-sync.yml
          node scripts/rss-feed-normalizer.js --check
          git diff --check

      - name: Commit generated feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'fix(editorial): normalize RSS after tma projection sync'
          git push origin "HEAD:${GITHUB_REF_NAME}"
