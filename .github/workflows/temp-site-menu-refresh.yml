name: TEMP Site Menu Same-Branch Refresh

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-site-menu-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event.pull_request.number == 1558 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/system-site-menu-owner-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Refresh same branch with overlap and CAS guards
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_SHA"
          git fetch --no-tags origin main "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$EVENT_SHA"

          base="$(git merge-base HEAD origin/main)"
          git diff --name-only "$base"..HEAD | grep -v '^\.github/workflows/temp-site-menu-refresh\.yml$' | sort -u > /tmp/lane.txt
          git diff --name-only "$base"..origin/main | sort -u > /tmp/main.txt
          if comm -12 /tmp/lane.txt /tmp/main.txt | grep -q .; then
            echo 'Refusing refresh: Product lane/main path overlap detected' >&2
            comm -12 /tmp/lane.txt /tmp/main.txt >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          rm .github/workflows/temp-site-menu-refresh.yml

          git merge-base --is-ancestor origin/main HEAD || true
          git diff --check
          node scripts/check-workflows.js
          git add -A
          git commit -m 'chore(site-menu): refresh same branch onto current main'
          git merge-base --is-ancestor origin/main HEAD
          test ! -e .github/workflows/temp-site-menu-refresh.yml
          grep -F 'contents: read' .github/workflows/site-sections-menu.yml >/dev/null
          ! grep -F 'contents: write' .github/workflows/site-sections-menu.yml >/dev/null

          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$EVENT_SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$EVENT_SHA" origin HEAD:"refs/heads/$BRANCH"
