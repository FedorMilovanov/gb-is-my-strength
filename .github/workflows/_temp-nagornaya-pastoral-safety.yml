name: TEMP Publish Nagornaya Pastoral Safety via API

on:
  push:
    branches:
      - fix/nagornaya-pastoral-safety-2026-07-22

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[pastoral-api]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BRANCH: fix/nagornaya-pastoral-safety-2026-07-22
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nagornaya-pastoral-safety-2026-07-22

      - name: Materialize verified permanent files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old = '<div class="flex items-start gap-2 text-emerald-900 font-semibold"><span class="text-emerald-600">✓</span><span><strong>Учит: Полное отсутствие плодов — смертный приговор вере</strong> — если за годы «христианства» в жизни человека нет ни покаяния, ни борьбы с грехом, ни плодов Духа — библейский пастырь обязан предупредить его: Мф 7:21 относится к нему.</span></div>'
          new = '<div class="flex items-start gap-2 text-emerald-900 font-semibold"><span class="text-emerald-600">✓</span><span><strong>Учит: Упорное бесплодие требует серьёзного самоиспытания</strong> — если на протяжении долгого времени человек не видит ни покаяния, ни борьбы с грехом, ни направления к послушанию, пастырь обязан серьёзно предупредить его о возможности самообмана в свете Мф 7:21–23, призвать к покаянию и помочь обратиться за пастырской поддержкой. Окончательный суд о сердце принадлежит Христу; это предупреждение нельзя механически применять к сокрушённому верующему, который борется с грехом.</span></div>'
          changed = []
          for root in (Path('src'), Path('nagornaya')):
              for path in root.rglob('*'):
                  if path.suffix not in {'.astro', '.html', '.mdx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  if old in text:
                      path.write_text(text.replace(old, new), encoding='utf-8')
                      changed.append(str(path))
          if sorted(changed) != sorted([
              'src/components/nagornaya/chast-5/NagornayaChast5SectionVII.astro',
              'src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro',
              'nagornaya/chast-5/index.html',
          ]):
              raise SystemExit(f'unexpected canonical files: {changed}')
          PY

          cat > scripts/nagornaya-pastoral-safety-regression-test.js <<'EOF'
          #!/usr/bin/env node
          'use strict';
          const assert = require('assert/strict');
          const fs = require('fs');
          const path = require('path');
          const ROOT = path.resolve(__dirname, '..');
          const ROOTS = ['src', 'nagornaya'];
          const EXTENSIONS = new Set(['.astro', '.html', '.mdx']);
          const banned = ['Полное отсутствие плодов — смертный приговор вере', 'Мф 7:21 относится к нему'];
          const required = ['Упорное бесплодие требует серьёзного самоиспытания', 'Окончательный суд о сердце принадлежит Христу', 'нельзя механически применять к сокрушённому верующему'];
          function collect(dir, files = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) collect(full, files);
              else if (EXTENSIONS.has(path.extname(entry.name))) files.push(full);
            }
            return files;
          }
          const corpus = ROOTS.flatMap((rel) => collect(path.join(ROOT, rel))).map((file) => fs.readFileSync(file, 'utf8')).join('\n');
          for (const phrase of banned) assert(!corpus.includes(phrase), `banned pastoral verdict returned: ${phrase}`);
          for (const phrase of required) assert(corpus.includes(phrase), `pastoral safeguard missing: ${phrase}`);
          for (const rel of ['src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro', 'src/components/nagornaya/chast-5/NagornayaChast5SectionVII.astro', 'nagornaya/chast-5/index.html']) {
            const source = fs.readFileSync(path.join(ROOT, rel), 'utf8');
            for (const phrase of required) assert(source.includes(phrase), `${rel}: safeguard missing: ${phrase}`);
          }
          console.log('✅ Nagornaya pastoral safety contract passed');
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/shared-files-guard.yml')
          text = p.read_text(encoding='utf-8')
          anchor = "      - name: Reader preferences regressions\n        run: node scripts/reader-preferences-regression-test.js\n"
          addition = "\n      - name: Nagornaya pastoral safety regressions\n        run: node scripts/nagornaya-pastoral-safety-regression-test.js\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'shared-files guard anchor count: {text.count(anchor)}')
          p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

          node scripts/nagornaya-pastoral-safety-regression-test.js
          git diff --check

      - name: Write permanent files through GitHub Contents API
        shell: bash
        run: |
          set -euo pipefail
          put_file() {
            local path="$1"
            local message="$2"
            local sha
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${BRANCH}" --jq .sha 2>/dev/null || true)
            local content
            content=$(base64 -w0 "$path")
            if [ -n "$sha" ]; then
              jq -n --arg message "$message" --arg content "$content" --arg sha "$sha" --arg branch "$BRANCH" \
                '{message:$message,content:$content,sha:$sha,branch:$branch}' > /tmp/payload.json
            else
              jq -n --arg message "$message" --arg content "$content" --arg branch "$BRANCH" \
                '{message:$message,content:$content,branch:$branch}' > /tmp/payload.json
            fi
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/payload.json >/dev/null
          }

          put_file 'src/components/nagornaya/chast-5/NagornayaChast5MainShell.astro' '[pastoral-api] update active Nagornaya text'
          put_file 'src/components/nagornaya/chast-5/NagornayaChast5SectionVII.astro' '[pastoral-api] update Nagornaya Section VII text'
          put_file 'nagornaya/chast-5/index.html' '[pastoral-api] update Nagornaya legacy shadow'
          put_file 'scripts/nagornaya-pastoral-safety-regression-test.js' '[pastoral-api] add pastoral safety regression'
          put_file '.github/workflows/shared-files-guard.yml' '[pastoral-api] wire pastoral safety regression'

      - name: Delete temporary publisher through Contents API
        shell: bash
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/_temp-nagornaya-pastoral-safety.yml?ref=${BRANCH}" --jq .sha)
          jq -n --arg message '[pastoral-api] remove temporary pastoral publisher' --arg sha "$sha" --arg branch "$BRANCH" \
            '{message:$message,sha:$sha,branch:$branch}' > /tmp/delete.json
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/_temp-nagornaya-pastoral-safety.yml" --input /tmp/delete.json >/dev/null
