name: TEMP Special Overlay Source Locator

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  locate:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Locate source and build pipeline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          {
            echo '## Tracked konfessii build files'
            git ls-files '_build-tools/konfessii-baptizm/**' | sort
            echo
            echo '## Exact launcher and lock source matches'
            git grep -n -I -E 'Интерактивная 3D-карта|document\.body\.style\.overflow|document\.documentElement\.style\.overflow|setTimeout\([^,]+, ?1800\)|isFullscreen|MindMap3D' -- '_build-tools/konfessii-baptizm/**' 'konfessii/russkij-baptizm/**' || true
            echo
            echo '## Build references and scripts'
            git grep -n -I -E 'konfessii-baptizm|russkij-baptizm/_app|vite build|npm run build|MindMap3D' -- package.json '_build-tools/**/package.json' '_build-tools/**/*.json' '_build-tools/**/*.js' '_build-tools/**/*.ts' '.github/workflows/**' || true
            echo
            echo '## Relevant package files'
            for file in package.json _build-tools/konfessii-baptizm/package.json _build-tools/konfessii-baptizm/vite.config.*; do
              for resolved in $file; do
                if [ -f "$resolved" ]; then
                  echo "### $resolved"
                  sed -n '1,240p' "$resolved"
                fi
              done
            done
          } > reports/special-overlay-source-locator.txt
          cat reports/special-overlay-source-locator.txt

      - uses: actions/upload-artifact@v4
        with:
          name: special-overlay-source-locator
          path: reports/special-overlay-source-locator.txt
          retention-days: 1
