name: TEMP Final Special Overlay Transaction

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: final-special-overlay-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'lane/special-overlay-adapters-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize and validate static contracts
        id: materialize
        shell: bash
        run: |
          set +e
          mkdir -p reports
          {
            set -euo pipefail
            python3 scripts/_temp-special-overlay-final-patch.py
            python3 scripts/_temp-special-overlay-final-fix.py
            python3 scripts/_temp-special-overlay-fallback-idempotency.py
            node --check js/site.js
            node --check karty/_engine/map-engine.js
            node --check scripts/special-overlay-writer-regression-test.js
            node --check scripts/special-overlay-runtime-browser-test.js
            npm run overlay:runtime:test
            npm run overlay:special:writers:test
            git diff --check
          } > reports/final-special-overlay-static.log 2>&1
          status=$?
          cat reports/final-special-overlay-static.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload static diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-special-overlay-static
          path: |
            reports/final-special-overlay-static.log
            scripts/special-overlay-writer-regression-test.js
            scripts/special-overlay-runtime-browser-test.js
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on static error
        if: steps.materialize.outputs.status != '0'
        run: exit 1

      - name: Install Chromium
        if: steps.materialize.outputs.status == '0'
        run: npx playwright install --with-deps chromium

      - name: Validate map and built launcher lifecycle
        if: steps.materialize.outputs.status == '0'
        id: browser
        env:
          PW_BROWSER: chromium
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            npm run overlay:map:browser:test
            npm run overlay:special:browser:test
          } > reports/final-special-overlay-browser.log 2>&1
          status=$?
          cat reports/final-special-overlay-browser.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload browser diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-special-overlay-browser
          path: reports/final-special-overlay-browser.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on browser error
        if: steps.materialize.outputs.status == '0' && steps.browser.outputs.status != '0'
        run: exit 1

      - name: Validate Astro templates
        if: steps.materialize.outputs.status == '0' && steps.browser.outputs.status == '0'
        run: npm run astro:check

      - name: Publish clean final transaction
        if: steps.materialize.outputs.status == '0' && steps.browser.outputs.status == '0'
        id: publish
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            git rm -f scripts/_temp-special-overlay-final-patch.py scripts/_temp-special-overlay-final-fix.py scripts/_temp-special-overlay-fallback-idempotency.py
            git add js/site.js \
                    karty/_engine/map-engine.js \
                    konfessii/russkij-baptizm/_app/index.html \
                    scripts/overlay-runtime-contract-test.js \
                    scripts/special-overlay-writer-regression-test.js \
                    scripts/special-overlay-runtime-browser-test.js \
                    package.json
            echo '--- staged files ---'
            git status --short
            forbidden="$(git diff --cached --diff-filter=ACMR --name-only | grep -E '(^|/)_temp-|^\.github/workflows/' || true)"
            test -z "$forbidden" || { echo 'Forbidden staged files:'; echo "$forbidden"; exit 1; }
            npm run overlay:special:writers:test
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'refactor(special): finish canonical overlay adapters'
            git push origin "HEAD:${HEAD_REF}"
          } > reports/final-special-overlay-publish.log 2>&1
          status=$?
          cat reports/final-special-overlay-publish.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload publish diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-special-overlay-publish
          path: reports/final-special-overlay-publish.log
          if-no-files-found: warn
          retention-days: 1

      - name: Fail on publish error
        if: steps.materialize.outputs.status == '0' && steps.browser.outputs.status == '0' && steps.publish.outputs.status != '0'
        run: exit 1
