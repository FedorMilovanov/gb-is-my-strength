name: TEMP A0C9 Final Pipeline Snapshot

on:
  push:
    branches:
      - diagnostic/final-pages-witness-2026-07-22

permissions:
  actions: read
  contents: write
  issues: read

concurrency:
  group: temp-a0c9-final-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[a0c9-final]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: a0c9c025b05eccfce0ab4818da250d05d1b65da0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/final-pages-witness-2026-07-22
          fetch-depth: 0
      - name: Capture exact runs and observer comments
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&per_page=100" --slurp \
            | jq 'map(.workflow_runs) | add | sort_by(.created_at) | map({id,name,event,status,conclusion,run_number,head_sha,head_branch,created_at,updated_at,html_url})' \
            > .github/_temp-a0c9-final-actions.json
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/58/comments?per_page=100" --slurp \
            | jq --arg sha "$EXPECTED_SHA" 'add | map(select(.body | contains($sha))) | map({id,created_at,updated_at,body,html_url,user:.user.login})' \
            > .github/_temp-a0c9-final-comments.json
      - name: Remove extractor and publish snapshot
        shell: bash
        run: |
          rm -f .github/workflows/_temp-a0c9-final-snapshot.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '[a0c9-final] capture exact pipeline snapshot'
          git push origin HEAD:diagnostic/final-pages-witness-2026-07-22
