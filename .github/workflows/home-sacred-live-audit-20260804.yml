name: Home Sacred Live Audit 20260804

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-sacred-live-audit-20260804.yml'

permissions:
  contents: read

jobs:
  live-audit:
    name: Physical Home sacred interaction audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audit lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Audit current published Home with physical input
        env:
          LIVE_BASE_URL: https://gospod-bog.ru/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/home-sacred-live-audit
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, webkit } = require('playwright');
          const out = 'reports/home-sacred-live-audit';
          const baseUrl = process.env.LIVE_BASE_URL;
          const report = { schemaVersion: 4, kind: 'home-sacred-live-audit', liveBaseUrl: baseUrl,
            startedAt: new Date().toISOString(), deploymentPointer: null, desktop: {}, touch: null,
            reducedMotion: null, result: 'FAIL' };
          const save = () => fs.writeFileSync(`${out}/report.json`, `${JSON.stringify(report, null, 2)}\n`);
          const assert = (ok, message, details = {}) => { if (!ok) throw new Error(`${message}\n${JSON.stringify(details, null, 2)}`); };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const urlFor = (label) => { const u = new URL(baseUrl); u.searchParams.set('home-sacred-audit', `${label}-${Date.now()}-${Math.random()}`); return u.toString(); };

          async function readState(locator) {
            return locator.evaluate((el) => {
              const front = el.querySelector(':scope > .hb-front');
              const back = el.querySelector(':scope > .h-tetra-back, :scope > .hb-back');
              const label = el.querySelector(':scope > .h-tetra-label');
              const name = el.querySelector('.h-tetra-name') || back;
              const probe = document.createElement('span');
              probe.style.cssText = 'position:fixed;visibility:hidden;color:var(--h-ink)';
              document.body.append(probe);
              const inkColor = getComputedStyle(probe).color;
              probe.remove();
              const fs = getComputedStyle(front), bs = getComputedStyle(back), ns = getComputedStyle(name);
              const ls = label ? getComputedStyle(label) : null;
              const lr = label?.getBoundingClientRect() || null, nr = name?.getBoundingClientRect() || null;
              return {
                matchesHover: el.matches(':hover'), ownerInstalled: el.dataset.sacredPointerPreview === '1',
                pointerPreview: el.hasAttribute('data-pointer-preview'), toggled: el.hasAttribute('data-toggled'),
                pressed: el.getAttribute('aria-pressed'),
                front: { text: front.textContent.trim(), visibility: fs.visibility, opacity: Number(fs.opacity) },
                back: { text: back.textContent.trim(), visibility: bs.visibility, opacity: Number(bs.opacity) },
                nameColor: ns.color, inkColor,
                label: ls && lr ? { text: label.textContent.trim(), visibility: ls.visibility,
                  opacity: Number(ls.opacity), filter: ls.filter, transform: ls.transform,
                  transitionDuration: ls.transitionDuration, top: lr.top, bottom: lr.bottom,
                  gapToTranslation: nr ? nr.top - lr.bottom : null } : null,
              };
            });
          }
          const openState = (s) => s.front.visibility === 'hidden' && s.front.opacity <= .05 && s.back.visibility === 'visible' && s.back.opacity >= .95;
          const closedState = (s) => s.front.visibility === 'visible' && s.front.opacity >= .9 && s.back.visibility === 'hidden' && s.back.opacity <= .05;
          const reducedOpenState = (s) => s.front.visibility === 'hidden' && s.back.visibility === 'visible';
          const reducedClosedState = (s) => s.front.visibility === 'visible' && s.back.visibility === 'hidden';
          const settledFilter = (value) => {
            const normalized = String(value || '').trim();
            return normalized === 'none' || /^blur\(\s*0(?:\.0+)?(?:px)?\s*\)$/.test(normalized);
          };

          async function openPage(engine, label, options = {}) {
            const browser = await engine.launch();
            const context = await browser.newContext({ viewport: options.viewport || { width: 1440, height: 900 },
              hasTouch: !!options.hasTouch, isMobile: !!options.isMobile,
              reducedMotion: options.reducedMotion || 'no-preference', serviceWorkers: 'block',
              extraHTTPHeaders: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' } });
            const page = await context.newPage();
            const response = await page.goto(urlFor(label), { waitUntil: 'domcontentloaded', timeout: 90000 });
            assert(response?.ok(), `${label}: Home HTTP failure`, { status: response?.status() });
            const tetra = page.locator('.h-sacred-block--hero button.h-tetra');
            await tetra.waitFor({ state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => { const el = document.querySelector('.h-sacred-block--hero button.h-tetra'); return el && !el.disabled && el.dataset.sacredPointerPreview === '1'; }, { timeout: 30000 });
            await tetra.scrollIntoViewIfNeeded();
            return { browser, context, page, tetra, response };
          }

          async function desktopAudit(name, engine) {
            const { browser, context, page, tetra, response } = await openPage(engine, `${name}-desktop`);
            const ordinary = page.locator('.h-sacred-block--hero button.hb-w').first();
            const r = { status: response.status(), etag: response.headers().etag || null };
            try {
              await sleep(500); r.initial = await readState(tetra);
              assert(r.initial.ownerInstalled && closedState(r.initial), `${name}: initial Hebrew contract failed`, r.initial);
              assert(r.initial.label?.visibility === 'hidden' && r.initial.label.opacity <= .05, `${name}: label leaks initially`, r.initial);
              await page.screenshot({ path: `${out}/${name}-initial.png` });

              await tetra.hover(); await sleep(2400); r.hover = await readState(tetra);
              await page.screenshot({ path: `${out}/${name}-hover.png` });
              assert(r.hover.matchesHover && r.hover.pointerPreview, `${name}: physical hover owner inactive`, r.hover);
              assert(openState(r.hover) && r.hover.back.text.includes('Яхве'), `${name}: hover translation failed`, r.hover);
              assert(r.hover.nameColor === r.hover.inkColor, `${name}: Яхве is not theme ink`, r.hover);
              assert(r.hover.label?.visibility === 'visible' && r.hover.label.opacity >= .95 && settledFilter(r.hover.label.filter),
                `${name}: label did not settle visibly`, r.hover);
              assert(r.hover.label.gapToTranslation >= 4 && r.hover.label.gapToTranslation <= 55,
                `${name}: label is overlapping or too high above Яхве`, r.hover);

              await page.mouse.move(2, 2); await sleep(800); r.leave = await readState(tetra);
              assert(closedState(r.leave), `${name}: mouse leave did not restore Hebrew`, r.leave);

              await ordinary.hover(); await sleep(800); r.ordinaryHover = await readState(ordinary);
              assert(openState(r.ordinaryHover), `${name}: ordinary-word hover failed`, r.ordinaryHover);
              await page.mouse.move(2, 2); await sleep(600);

              await tetra.click(); await page.mouse.move(2, 2); await sleep(800); r.clickOpen = await readState(tetra);
              assert(r.clickOpen.toggled && r.clickOpen.pressed === 'true' && openState(r.clickOpen), `${name}: first click failed`, r.clickOpen);
              await page.screenshot({ path: `${out}/${name}-click-open.png` });
              await tetra.click(); await page.mouse.move(2, 2); await sleep(800); r.clickClose = await readState(tetra);
              assert(!r.clickClose.toggled && r.clickClose.pressed === 'false' && closedState(r.clickClose), `${name}: second click failed`, r.clickClose);

              await tetra.focus(); await page.keyboard.press('Enter'); await tetra.evaluate((el) => el.blur()); await page.mouse.move(2, 2); await sleep(800); r.enter = await readState(tetra);
              assert(r.enter.toggled && r.enter.pressed === 'true' && openState(r.enter), `${name}: Enter failed`, r.enter);
              await tetra.focus(); await page.keyboard.press('Space'); await tetra.evaluate((el) => el.blur()); await page.mouse.move(2, 2); await sleep(800); r.space = await readState(tetra);
              assert(!r.space.toggled && r.space.pressed === 'false' && closedState(r.space), `${name}: Space failed`, r.space);
              return r;
            } finally { await context.close(); await browser.close(); }
          }

          async function touchAudit() {
            const { browser, context, page, tetra } = await openPage(chromium, 'touch', { viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            try {
              await sleep(500); const initial = await readState(tetra); assert(closedState(initial), 'touch initial failed', initial);
              await tetra.tap(); await sleep(900); const opened = await readState(tetra);
              assert(opened.toggled && opened.pressed === 'true' && openState(opened), 'touch first tap failed', opened);
              await page.screenshot({ path: `${out}/touch-open.png` });
              await tetra.tap(); await sleep(900); const closed = await readState(tetra);
              assert(!closed.toggled && closed.pressed === 'false' && closedState(closed), 'touch second tap failed', closed);
              return { initial, opened, closed };
            } finally { await context.close(); await browser.close(); }
          }

          async function reducedMotionAudit() {
            const { browser, context, page, tetra } = await openPage(chromium, 'reduced-motion', { reducedMotion: 'reduce' });
            try {
              const initial = await readState(tetra); await tetra.hover(); await sleep(100); const hover = await readState(tetra);
              const transitions = await tetra.evaluate((el) => [getComputedStyle(el.querySelector(':scope > .hb-front')).transitionDuration,
                getComputedStyle(el.querySelector(':scope > .h-tetra-back')).transitionDuration,
                getComputedStyle(el.querySelector(':scope > .h-tetra-label')).transitionDuration]);
              assert(reducedClosedState(initial) && reducedOpenState(hover), 'reduced-motion visibility swap failed', { initial, hover });
              assert(hover.back.text.includes('Яхве') && hover.label?.visibility === 'visible' && hover.nameColor === hover.inkColor,
                'reduced-motion translated face is incomplete', { initial, hover });
              assert(transitions.every((v) => v.split(',').every((x) => Number.parseFloat(x) === 0)), 'reduced-motion transitions active', transitions);
              return { initial, hover, transitions };
            } finally { await context.close(); await browser.close(); }
          }

          (async () => {
            try {
              const p = await fetch(new URL('/deployments/current.json', baseUrl), { headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' } });
              assert(p.ok, 'deployment pointer unavailable', { status: p.status }); report.deploymentPointer = await p.json(); save();
              report.desktop.chromium = await desktopAudit('chromium', chromium); save();
              report.desktop.webkit = await desktopAudit('webkit', webkit); save();
              report.touch = await touchAudit(); save();
              report.reducedMotion = await reducedMotionAudit(); report.result = 'PASS'; report.completedAt = new Date().toISOString(); save();
              console.log(JSON.stringify({ result: report.result, releaseSha: report.deploymentPointer.releaseSha }, null, 2));
            } catch (error) { report.error = String(error?.stack || error); report.completedAt = new Date().toISOString(); save(); console.error(report.error); process.exitCode = 1; }
          })();
          NODE
      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-sacred-live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/home-sacred-live-audit
          if-no-files-found: error
          retention-days: 30
