name: Home Sacred Live Audit 20260804

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/home-sacred-live-audit-20260804.yml'

permissions:
  contents: read

jobs:
  live-audit:
    name: Physical Home sacred interaction audit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout audit lane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx --no-install playwright install --with-deps chromium webkit

      - name: Audit current published Home with physical input
        env:
          LIVE_BASE_URL: https://gospod-bog.ru/
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/home-sacred-live-audit
          node <<'NODE'
          const fs = require('node:fs');
          const { chromium, webkit } = require('playwright');

          const out = 'reports/home-sacred-live-audit';
          const baseUrl = process.env.LIVE_BASE_URL;
          const report = {
            schemaVersion: 3,
            kind: 'home-sacred-live-audit',
            liveBaseUrl: baseUrl,
            startedAt: new Date().toISOString(),
            deploymentPointer: null,
            desktop: {},
            touch: null,
            reducedMotion: null,
            result: 'FAIL',
          };
          const save = () => fs.writeFileSync(`${out}/report.json`, `${JSON.stringify(report, null, 2)}\n`);
          const assert = (condition, message, details = {}) => {
            if (!condition) throw new Error(`${message}\n${JSON.stringify(details, null, 2)}`);
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const urlFor = (label) => {
            const url = new URL(baseUrl);
            url.searchParams.set('home-sacred-audit', `${label}-${Date.now()}-${Math.random()}`);
            return url.toString();
          };

          async function state(locator) {
            return locator.evaluate((el) => {
              const front = el.querySelector(':scope > .hb-front');
              const back = el.querySelector(':scope > .h-tetra-back, :scope > .hb-back');
              const label = el.querySelector(':scope > .h-tetra-label');
              const name = el.querySelector('.h-tetra-name') || back;
              const line = el.closest('.h-sacred-line');
              const block = el.closest('.h-sacred-block--hero');
              const probe = document.createElement('span');
              probe.style.cssText = 'position:fixed;visibility:hidden;color:var(--h-ink)';
              document.body.append(probe);
              const ink = getComputedStyle(probe).color;
              probe.remove();
              const fs = getComputedStyle(front);
              const bs = getComputedStyle(back);
              const ls = label ? getComputedStyle(label) : null;
              const lr = label?.getBoundingClientRect() || null;
              const lineRect = line?.getBoundingClientRect() || null;
              const blockRect = block?.getBoundingClientRect() || null;
              return {
                matchesHover: el.matches(':hover'),
                ownerInstalled: el.dataset.sacredPointerPreview === '1',
                pointerPreview: el.hasAttribute('data-pointer-preview'),
                toggled: el.hasAttribute('data-toggled'),
                pressed: el.getAttribute('aria-pressed'),
                front: { text: front.textContent.trim(), visibility: fs.visibility, opacity: Number(fs.opacity) },
                back: { text: back.textContent.trim(), visibility: bs.visibility, opacity: Number(bs.opacity) },
                nameColor: getComputedStyle(name).color,
                inkColor: ink,
                label: ls && lr ? {
                  text: label.textContent.trim(),
                  visibility: ls.visibility,
                  opacity: Number(ls.opacity),
                  transform: ls.transform,
                  top: lr.top,
                  bottom: lr.bottom,
                  gapToHebrewLine: lineRect ? lineRect.top - lr.bottom : null,
                  offsetFromBlockTop: blockRect ? lr.top - blockRect.top : null,
                } : null,
              };
            });
          }
          const isOpen = (s) => s.front.visibility === 'hidden'
            && s.front.opacity <= 0.05
            && s.back.visibility === 'visible'
            && s.back.opacity >= 0.95;
          const isClosed = (s) => s.front.visibility === 'visible'
            && s.front.opacity >= 0.9
            && s.back.visibility === 'hidden'
            && s.back.opacity <= 0.05;

          async function open(engine, label, options = {}) {
            const browser = await engine.launch();
            const context = await browser.newContext({
              viewport: options.viewport || { width: 1440, height: 900 },
              hasTouch: Boolean(options.hasTouch),
              isMobile: Boolean(options.isMobile),
              reducedMotion: options.reducedMotion || 'no-preference',
              serviceWorkers: 'block',
              extraHTTPHeaders: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
            });
            const page = await context.newPage();
            const response = await page.goto(urlFor(label), { waitUntil: 'domcontentloaded', timeout: 90_000 });
            assert(response?.ok(), `${label}: Home HTTP failure`, { status: response?.status() });
            const tetra = page.locator('.h-sacred-block--hero button.h-tetra');
            await tetra.waitFor({ state: 'visible', timeout: 30_000 });
            await page.waitForFunction(() => {
              const el = document.querySelector('.h-sacred-block--hero button.h-tetra');
              return el && !el.disabled && el.dataset.sacredPointerPreview === '1';
            }, { timeout: 30_000 });
            await tetra.scrollIntoViewIfNeeded();
            return { browser, context, page, tetra, response };
          }

          async function desktopAudit(name, engine) {
            const { browser, context, page, tetra, response } = await open(engine, `${name}-desktop`);
            const ordinary = page.locator('.h-sacred-block--hero button.hb-w').first();
            const result = { status: response.status(), etag: response.headers().etag || null };
            try {
              await sleep(500);
              result.initial = await state(tetra);
              assert(result.initial.ownerInstalled, `${name}: pointer owner missing`, result.initial);
              assert(isClosed(result.initial), `${name}: initial face is not Hebrew-only`, result.initial);
              assert(result.initial.label?.visibility === 'hidden' && result.initial.label.opacity <= 0.05,
                `${name}: label leaks before interaction`, result.initial);
              await page.screenshot({ path: `${out}/${name}-initial.png`, fullPage: false });

              await tetra.hover();
              await sleep(900);
              result.hover = await state(tetra);
              await page.screenshot({ path: `${out}/${name}-hover.png`, fullPage: false });
              assert(result.hover.matchesHover && result.hover.pointerPreview,
                `${name}: physical hover owner did not remain active`, result.hover);
              assert(isOpen(result.hover), `${name}: physical hover did not reveal translation`, result.hover);
              assert(result.hover.back.text.includes('Яхве'), `${name}: Яхве translation missing`, result.hover);
              assert(result.hover.nameColor === result.hover.inkColor, `${name}: Яхве is not theme ink`, result.hover);
              assert(result.hover.label?.visibility === 'visible' && result.hover.label.opacity >= 0.95,
                `${name}: sacred-name label is not visible after hover settles`, result.hover);
              assert(result.hover.label.gapToHebrewLine >= -2 && result.hover.label.gapToHebrewLine <= 45,
                `${name}: sacred-name label is overlapping or still too high`, result.hover);

              await page.mouse.move(2, 2);
              await sleep(650);
              result.leave = await state(tetra);
              assert(isClosed(result.leave), `${name}: pointer leave did not restore Hebrew`, result.leave);

              await ordinary.hover();
              await sleep(650);
              result.ordinaryHover = await state(ordinary);
              assert(isOpen(result.ordinaryHover), `${name}: ordinary-word hover failed`, result.ordinaryHover);
              await page.mouse.move(2, 2);
              await sleep(500);

              await tetra.click();
              await page.mouse.move(2, 2);
              await sleep(650);
              result.clickOpen = await state(tetra);
              assert(result.clickOpen.toggled && result.clickOpen.pressed === 'true' && isOpen(result.clickOpen),
                `${name}: first click did not persist open`, result.clickOpen);
              await page.screenshot({ path: `${out}/${name}-click-open.png`, fullPage: false });

              await tetra.click();
              await page.mouse.move(2, 2);
              await sleep(650);
              result.clickClose = await state(tetra);
              assert(!result.clickClose.toggled && result.clickClose.pressed === 'false' && isClosed(result.clickClose),
                `${name}: second click did not close`, result.clickClose);

              await tetra.focus();
              await page.keyboard.press('Enter');
              await tetra.evaluate((el) => el.blur());
              await page.mouse.move(2, 2);
              await sleep(650);
              result.enter = await state(tetra);
              assert(result.enter.toggled && result.enter.pressed === 'true' && isOpen(result.enter),
                `${name}: Enter did not persist open`, result.enter);

              await tetra.focus();
              await page.keyboard.press('Space');
              await tetra.evaluate((el) => el.blur());
              await page.mouse.move(2, 2);
              await sleep(650);
              result.space = await state(tetra);
              assert(!result.space.toggled && result.space.pressed === 'false' && isClosed(result.space),
                `${name}: Space did not close`, result.space);
              return result;
            } finally {
              await context.close();
              await browser.close();
            }
          }

          async function touchAudit() {
            const { browser, context, page, tetra } = await open(chromium, 'touch', {
              viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true,
            });
            try {
              await sleep(400);
              const initial = await state(tetra);
              assert(isClosed(initial), 'touch: initial state is not closed', initial);
              await tetra.tap();
              await sleep(650);
              const opened = await state(tetra);
              assert(opened.toggled && opened.pressed === 'true' && isOpen(opened),
                'touch: first tap did not reveal Яхве', opened);
              await page.screenshot({ path: `${out}/touch-open.png`, fullPage: false });
              await tetra.tap();
              await sleep(650);
              const closed = await state(tetra);
              assert(!closed.toggled && closed.pressed === 'false' && isClosed(closed),
                'touch: second tap did not close', closed);
              return { initial, opened, closed };
            } finally {
              await context.close();
              await browser.close();
            }
          }

          async function reducedMotionAudit() {
            const { browser, context, page, tetra } = await open(chromium, 'reduced-motion', {
              reducedMotion: 'reduce',
            });
            try {
              const initial = await state(tetra);
              await tetra.hover();
              await sleep(100);
              const hover = await state(tetra);
              const transitions = await tetra.evaluate((el) => [
                getComputedStyle(el.querySelector(':scope > .hb-front')).transitionDuration,
                getComputedStyle(el.querySelector(':scope > .h-tetra-back')).transitionDuration,
                getComputedStyle(el.querySelector(':scope > .h-tetra-label')).transitionDuration,
              ]);
              assert(isClosed(initial) && isOpen(hover), 'reduced motion: semantic swap failed', { initial, hover });
              assert(transitions.every((value) => value.split(',').every((part) => Number.parseFloat(part) === 0)),
                'reduced motion: transitions remain active', transitions);
              return { initial, hover, transitions };
            } finally {
              await context.close();
              await browser.close();
            }
          }

          (async () => {
            try {
              const pointerResponse = await fetch(new URL('/deployments/current.json', baseUrl), {
                headers: { 'Cache-Control': 'no-cache', Pragma: 'no-cache' },
              });
              assert(pointerResponse.ok, 'deployment pointer unavailable', { status: pointerResponse.status });
              report.deploymentPointer = await pointerResponse.json();
              save();
              report.desktop.chromium = await desktopAudit('chromium', chromium); save();
              report.desktop.webkit = await desktopAudit('webkit', webkit); save();
              report.touch = await touchAudit(); save();
              report.reducedMotion = await reducedMotionAudit();
              report.result = 'PASS';
              report.completedAt = new Date().toISOString();
              save();
              console.log(JSON.stringify({ result: report.result, releaseSha: report.deploymentPointer.releaseSha }, null, 2));
            } catch (error) {
              report.error = String(error?.stack || error);
              report.completedAt = new Date().toISOString();
              save();
              console.error(report.error);
              process.exitCode = 1;
            }
          })();
          NODE

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: home-sacred-live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/home-sacred-live-audit
          if-no-files-found: error
          retention-days: 30
