name: PR1551 Scripture Index Generator

on:
  pull_request:
    paths:
      - '.github/workflows/pr1551-scripture-index-generator.yml'
      - 'src/components/hard-texts/HardTextsSeriesMapSection.astro'

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Generate canonical scripture occurrence index
        run: node scripts/build-scripture-occurrence-index.mjs --write

      - name: Commit generated index when changed
        run: |
          if git diff --quiet -- data/scripture-search-index.json; then
            echo "Generated scripture index already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture-search-index.json
          git commit -m "chore(scripture): regenerate occurrence index"
          git push origin HEAD:${{ github.head_ref }}
