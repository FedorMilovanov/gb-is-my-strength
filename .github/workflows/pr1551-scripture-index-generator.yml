name: PR1551 Scripture Index Generator

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/pr1551-scripture-index-generator.yml'
      - 'src/components/hard-texts/HardTextsSeriesMapSection.astro'

permissions:
  contents: read

jobs:
  generate:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Snapshot machine writer lease
        run: node scripts/writer-lease.mjs snapshot

      - name: Reject stale writer before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Generate canonical scripture occurrence index
        run: node scripts/build-scripture-occurrence-index.mjs --write

      - name: Validate generated index
        run: |
          node scripts/build-scripture-occurrence-index.mjs --check
          git diff --check

      - name: Commit generated index
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- data/scripture-search-index.json; then
            echo "Generated scripture index already current"
            exit 0
          fi
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          EXPECTED_HEAD="$(node scripts/writer-lease.mjs field expectedHead)"
          LEASE_TRAILER="$(node scripts/writer-lease.mjs trailer)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture-search-index.json
          git commit -m "chore(scripture): regenerate occurrence index" -m "${LEASE_TRAILER}"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          git push --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_HEAD}" origin "HEAD:${HEAD_REF}"
