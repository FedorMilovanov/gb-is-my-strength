name: TEMP reader theme bootstrap inventory

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    if: github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Inventory route-owned theme bootstraps
        run: python3 scripts/_temp_inventory_legacy_theme_bootstraps.py

      - name: Upload exact inventory
        uses: actions/upload-artifact@v4
        with:
          name: legacy-theme-bootstrap-inventory
          path: legacy-theme-bootstrap-inventory.json
          if-no-files-found: error
          retention-days: 1
