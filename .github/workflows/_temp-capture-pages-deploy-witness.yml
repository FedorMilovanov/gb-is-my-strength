name: TEMP Capture Pages Pipeline Witness

on:
  workflow_run:
    workflows:
      - "Metadata & IndexNow Readiness"
      - "Deploy to GitHub Pages"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact workflow head for production comparison
        if: github.event.workflow_run.name == 'Deploy to GitHub Pages' && github.event.workflow_run.conclusion == 'success'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Compare critical production blobs with source head
        id: blobs
        if: github.event.workflow_run.name == 'Deploy to GitHub Pages' && github.event.workflow_run.conclusion == 'success'
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -u
          assets=(
            "js/site-utils.js"
            "js/site.js"
            "js/floating-cluster-controller.js"
            "karty/_engine/map-engine.js"
            "konfessii/russkij-baptizm/_app/index.html"
          )
          status="pass"
          report=""
          mkdir -p /tmp/gb-pages-witness

          for rel in "${assets[@]}"; do
            expected=$(sha256sum "$rel" | awk '{print $1}')
            actual="download-error"
            matched=0

            for attempt in $(seq 1 12); do
              live="/tmp/gb-pages-witness/live-${attempt}"
              if curl -fsSL --compressed --retry 2 --retry-delay 2 \
                "https://gospod-bog.ru/${rel}?gb-witness=${RUN_ID}-${attempt}" \
                -o "$live"; then
                actual=$(sha256sum "$live" | awk '{print $1}')
                if [ "$actual" = "$expected" ]; then
                  matched=1
                  break
                fi
              else
                actual="download-error"
              fi
              sleep 10
            done

            if [ "$matched" -eq 1 ]; then
              verdict="PASS"
            else
              verdict="FAIL"
              status="fail"
            fi

            expected_short=${expected:0:12}
            actual_short=${actual:0:12}
            report+="- ${rel}: ${verdict} (source ${expected_short}, live ${actual_short})"$'\n'
          done

          {
            echo "status=${status}"
            echo "report<<EOF"
            printf '%s' "$report"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Record immutable pipeline witness on issue 58
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BLOB_STATUS: ${{ steps.blobs.outputs.status }}
          BLOB_REPORT: ${{ steps.blobs.outputs.report }}
        shell: bash
        run: |
          blob_status=${BLOB_STATUS:-not-applicable}
          {
            printf '%s\n' '## Automated CI/CD pipeline witness'
            printf '\n'
            printf -- '- Workflow: **%s**\n' "$WORKFLOW_NAME"
            printf -- '- Conclusion: **%s**\n' "$CONCLUSION"
            printf -- '- Run: %s (#%s)\n' "$RUN_ID" "$RUN_NUMBER"
            printf -- '- Head SHA: %s\n' "$HEAD_SHA"
            printf -- '- Head branch: %s\n' "$HEAD_BRANCH"
            printf -- '- Run URL: %s\n' "$RUN_URL"
            if [ "$blob_status" != 'not-applicable' ]; then
              printf -- '- Production blob witness: **%s**\n' "${blob_status^^}"
              printf '\n%s' "$BLOB_REPORT"
            fi
            printf '\n%s\n' 'This comment is generated from the immutable workflow_run payload. Production closure requires a successful Deploy to GitHub Pages run and PASS for every critical source/production blob comparison.'
          } > /tmp/issue-58-witness.md
          gh issue comment 58 --repo "$GITHUB_REPOSITORY" --body-file /tmp/issue-58-witness.md

      - name: Fail on production blob mismatch
        if: github.event.workflow_run.name == 'Deploy to GitHub Pages' && github.event.workflow_run.conclusion == 'success' && steps.blobs.outputs.status == 'fail'
        run: exit 1
