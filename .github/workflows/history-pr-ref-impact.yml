name: Historical Image PR-Ref Retention Impact

on:
  pull_request:
    paths:
      - '.github/workflows/history-pr-ref-impact.yml'

permissions:
  contents: read

jobs:
  analyze:
    name: Quantify image blobs retained by read-only pull refs
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Clone GitHub mirror including advertised pull refs
        shell: bash
        env:
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git clone --mirror "$REPO_URL" mirror.git

      - name: Compute owner-managed purge set and pull-ref overlap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          cd mirror.git

          git rev-list --objects --glob='refs/heads/*' --glob='refs/tags/*' > ../reports/managed-objects.txt
          git cat-file --batch-check='%(objectname) %(objecttype) %(objectsize) %(rest)' \
            < ../reports/managed-objects.txt > ../reports/managed-object-metadata.txt
          git ls-tree -r --long refs/heads/main > ../reports/main-tip-tree.txt

          git for-each-ref --format='%(refname)' refs/pull | sort > ../reports/pull-refs.txt
          if test -s ../reports/pull-refs.txt; then
            git rev-list --objects --glob='refs/pull/*' > ../reports/pull-objects.txt
          else
            : > ../reports/pull-objects.txt
          fi

          python3 - <<'PY'
          import csv, json, re
          from collections import defaultdict
          from pathlib import Path

          IMAGE_EXTS = {
              '.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.avif',
              '.bmp', '.tif', '.tiff', '.heic', '.heif', '.ico'
          }

          current_oids = set()
          with open('../reports/main-tip-tree.txt', encoding='utf-8', errors='replace') as f:
              for line in f:
                  left = line.split('\t', 1)[0].split()
                  if len(left) >= 3:
                      current_oids.add(left[2])

          purge = {}
          with open('../reports/managed-object-metadata.txt', encoding='utf-8', errors='replace') as f:
              for line in f:
                  parts = line.rstrip('\n').split(' ', 3)
                  if len(parts) < 3 or parts[1] != 'blob':
                      continue
                  oid, _, size_s = parts[:3]
                  path = parts[3] if len(parts) == 4 else ''
                  ext = Path(path).suffix.lower()
                  if ext in IMAGE_EXTS and oid not in current_oids:
                      purge[oid] = {'oid': oid, 'bytes': int(size_s), 'path': path, 'ext': ext}

          if len(purge) != 510 or sum(v['bytes'] for v in purge.values()) != 522386373:
              raise SystemExit('Managed purge set drifted; refuse PR-ref analysis')

          pull_oids = set()
          with open('../reports/pull-objects.txt', encoding='utf-8', errors='replace') as f:
              for line in f:
                  oid = line.split(' ', 1)[0].strip()
                  if oid:
                      pull_oids.add(oid)

          overlap = [v for oid, v in purge.items() if oid in pull_oids]
          overlap.sort(key=lambda r: r['bytes'], reverse=True)

          # Map each overlapping blob to affected PR numbers by checking each pull head/merge ref.
          pull_refs = [x.strip() for x in Path('../reports/pull-refs.txt').read_text().splitlines() if x.strip()]
          affected = defaultdict(set)
          import subprocess
          for ref in pull_refs:
              m = re.match(r'refs/pull/(\d+)/(?:head|merge)$', ref)
              if not m:
                  continue
              pr = int(m.group(1))
              out = subprocess.check_output(['git','rev-list','--objects',ref], text=True, errors='replace')
              ref_oids = {line.split(' ',1)[0] for line in out.splitlines() if line}
              for oid in purge.keys() & ref_oids:
                  affected[oid].add(pr)

          for row in overlap:
              row['pr_numbers'] = sorted(affected.get(row['oid'], set()))

          with open('../reports/pull-ref-overlap.csv','w',newline='',encoding='utf-8') as f:
              fields=['oid','bytes','path','ext','pr_numbers']
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              for row in overlap:
                  out=dict(row)
                  out['pr_numbers']=';'.join(map(str,row['pr_numbers']))
                  w.writerow(out)

          report = {
              'managed_purge_blobs': len(purge),
              'managed_purge_mib': round(sum(v['bytes'] for v in purge.values())/1024/1024,3),
              'advertised_pull_refs': len(pull_refs),
              'purge_blobs_reachable_from_pull_refs': len(overlap),
              'purge_mib_reachable_from_pull_refs': round(sum(v['bytes'] for v in overlap)/1024/1024,3),
              'purge_blobs_not_reachable_from_pull_refs': len(purge)-len(overlap),
              'purge_mib_not_reachable_from_pull_refs': round((sum(v['bytes'] for v in purge.values())-sum(v['bytes'] for v in overlap))/1024/1024,3),
              'affected_pr_numbers': sorted({p for row in overlap for p in row['pr_numbers']}),
          }
          Path('../reports/summary.json').write_text(json.dumps(report, indent=2)+'\n',encoding='utf-8')
          lines=[
              '# Pull-ref retention impact','',
              f"- Managed purge set: **{report['managed_purge_blobs']} blobs / {report['managed_purge_mib']:.1f} MiB**",
              f"- Advertised GitHub pull refs: **{report['advertised_pull_refs']}**",
              f"- Purge blobs still reachable from refs/pull: **{report['purge_blobs_reachable_from_pull_refs']} / {report['purge_mib_reachable_from_pull_refs']:.1f} MiB**",
              f"- Purge blobs NOT reachable from refs/pull: **{report['purge_blobs_not_reachable_from_pull_refs']} / {report['purge_mib_not_reachable_from_pull_refs']:.1f} MiB**",
              f"- Affected PR numbers: **{len(report['affected_pr_numbers'])}**",
              '',
              'GitHub pull refs are read-only to repository owners; this workflow is diagnostic only.'
          ]
          Path('../reports/summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('\n'.join(lines))
          PY

          cd ..
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PR-ref impact evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: history-pr-ref-impact-${{ github.run_id }}
          path: reports
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
