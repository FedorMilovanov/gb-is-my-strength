name: Temporary Reader R6 Cache Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-cache-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Regenerate revisions from current sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          node scripts/reader-state-regression-test.js
          node scripts/reader-preferences-regression-test.js
          node scripts/gill-final-source-reconciliation-audit.mjs
          git diff --check

      - name: Commit synchronized revisions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/_temp-reader-r6-cache-refresh.yml
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] chore(reader): refresh revisions from latest main"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
