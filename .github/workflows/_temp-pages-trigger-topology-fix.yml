name: TEMP Pages Trigger Topology Fix

on:
  push:
    branches:
      - fix/pages-trigger-topology-2026-07-22
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-pages-trigger-topology-fix
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.head_ref == 'fix/pages-trigger-topology-2026-07-22' || github.ref_name == 'fix/pages-trigger-topology-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pages-trigger-topology-2026-07-22
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Separate readiness-owned and direct-deploy paths
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          deploy = Path('.github/workflows/deploy.yml')
          text = deploy.read_text(encoding='utf-8')
          old = """      - 'hard-texts/**'
                - 'baptisty-rossii/**'
                # Astro migration: public pages now live in src/ — deploy must fire on
                # any change to Astro pages, MDX content, layouts, or the strangler manifest.
                - 'src/**'
                - 'astro.config.mjs'
                - 'tsconfig.json'
                - 'migration/**'
                - 'scripts/**'
                - 'package.json'
                - 'package-lock.json'
                - '.nojekyll'
          """
          new = """      - 'hard-texts/**'
                # Source/build paths are intentionally absent here. They enter Pages
                # only through workflow_run after Metadata & IndexNow Readiness passes.
                # Exact push-path disjointness is protected by a permanent regression.
                - '.nojekyll'
          """
          if text.count(old) != 1:
              raise SystemExit(f'deploy overlap block count: {text.count(old)}')
          deploy.write_text(text.replace(old, new, 1), encoding='utf-8')

          readiness = Path('.github/workflows/indexnow.yml')
          text = readiness.read_text(encoding='utf-8')
          old = """      - 'astro.config.mjs'
                - 'package.json'
          """
          new = """      - 'astro.config.mjs'
                - 'tsconfig.json'
                - 'migration/**'
                - 'package.json'
          """
          if text.count(old) != 1:
              raise SystemExit(f'readiness build-path anchor count: {text.count(old)}')
          readiness.write_text(text.replace(old, new, 1), encoding='utf-8')

          policy = Path('scripts/check-workflows.js')
          text = policy.read_text(encoding='utf-8')
          helper_old = """function must(file, text, rx, msg) {
            if (!rx.test(text)) issues.push(`${file}: ${msg}`);
          }
          """
          helper_new = helper_old + """function mustNot(file, text, rx, msg) {
            if (rx.test(text)) issues.push(`${file}: ${msg}`);
          }
          function pushPathRx(glob) {
            const escaped = glob.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');
            return new RegExp(`-\\\\s*[\"']${escaped}[\"']`);
          }
          """
          if text.count(helper_old) != 1:
              raise SystemExit(f'workflow policy helper anchor count: {text.count(helper_old)}')
          text = text.replace(helper_old, helper_new, 1)

          old_block = """// Astro migration safety: after the root→dist deploy switch, public pages live
          // in src/** (Astro pages, MDX content, layouts). If a workflow drops src/** from
          // its paths filter, src-only commits silently stop deploying/indexing — exactly
          // the regression that left the live site stuck on a stale commit (2026-06-18).
          must('.github/workflows/deploy.yml', deploy, /-\\s*['\"]src\\/\\*\\*['\"]/, 'deploy paths must include src/** so Astro page/content changes deploy (migration: pages now live in src/)');
          must('.github/workflows/indexnow.yml', indexnow, /-\\s*['\"]src\\/\\*\\*['\"]/, 'indexnow paths must include src/** so Astro page/content changes notify search engines');

          // Legacy HTML content sections must remain covered by BOTH deploy and indexnow
          // path filters. If a workflow drops a legacy section (e.g. baptisty-rossii),
          // edits to those articles silently stop deploying AND indexing. This guard closes
          // that gap and prevents future regressions (2026-07-05 audit).
          ['deploy.yml', 'indexnow.yml'].forEach(f => {
            must('.github/workflows/' + f, read('.github/workflows/' + f), /-\\s*['\"]baptisty-rossii\\/\\*\\*['\"]/, f + ' paths must include baptisty-rossii/** (legacy content section)');
          });
          """
          new_block = """// Source/build changes have exactly one trigger owner: readiness. Deploy then
          // follows through workflow_run. Keeping the same path in deploy.push creates two
          // concurrent Pages runs; one cancels the other and the workflow_run job may skip.
          const readinessOnlyPushPaths = [
            'src/**',
            'data/**',
            'baptisty-rossii/**',
            'scripts/**',
            'css/**',
            'js/**',
            'sitemap.xml',
            'feed.xml',
            'astro.config.mjs',
            'tsconfig.json',
            'migration/**',
            'package.json',
            'package-lock.json',
          ];
          for (const glob of readinessOnlyPushPaths) {
            must('.github/workflows/indexnow.yml', indexnow, pushPathRx(glob), `readiness paths must include ${glob}`);
            mustNot('.github/workflows/deploy.yml', deploy, pushPathRx(glob), `direct deploy paths must exclude readiness-owned ${glob}`);
          }
          """
          if text.count(old_block) != 1:
              raise SystemExit(f'workflow policy topology block count: {text.count(old_block)}')
          policy.write_text(text.replace(old_block, new_block, 1), encoding='utf-8')
          PY

      - name: Install permanent trigger topology regression
        shell: bash
        run: |
          cat > scripts/workflow-linkage-regression-test.js <<'EOF'
          #!/usr/bin/env node
          'use strict';

          const fs = require('fs');
          const path = require('path');
          const assert = require('assert/strict');

          const ROOT = path.resolve(__dirname, '..');
          const READINESS_PATH = '.github/workflows/indexnow.yml';
          const DEPLOY_PATH = '.github/workflows/deploy.yml';

          function read(rel) {
            return fs.readFileSync(path.join(ROOT, rel), 'utf8');
          }

          function workflowName(text, rel) {
            const match = text.match(/^name:\s*(?:"([^"]+)"|'([^']+)'|(.+?))\s*$/m);
            assert.ok(match, `${rel}: top-level workflow name is missing`);
            return (match[1] || match[2] || match[3] || '').trim();
          }

          function eventBlock(text, rel, eventName) {
            const escaped = eventName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const pattern = new RegExp(`^\\s{2}${escaped}:\\s*$([\\s\\S]*?)(?=^\\s{2}[A-Za-z_][\\w-]*:\\s*$|^permissions:\\s*$)`, 'm');
            const match = text.match(pattern);
            assert.ok(match, `${rel}: on.${eventName} block is missing`);
            return match[1];
          }

          function workflowRunDependencies(text) {
            const block = eventBlock(text, DEPLOY_PATH, 'workflow_run');
            const workflows = block.match(/^\s{4}workflows:\s*\[(.*)\]\s*$/m);
            assert.ok(workflows, `${DEPLOY_PATH}: on.workflow_run.workflows must be an explicit inline list`);
            return Array.from(workflows[1].matchAll(/["']([^"']+)["']/g), (match) => match[1].trim());
          }

          function pushPaths(text, rel) {
            const block = eventBlock(text, rel, 'push');
            const paths = Array.from(block.matchAll(/^\s{6}-\s*["']([^"']+)["']\s*$/gm), (match) => match[1]);
            assert.ok(paths.length > 0, `${rel}: on.push.paths is empty or unparsable`);
            assert.equal(new Set(paths).size, paths.length, `${rel}: on.push.paths contains duplicates`);
            return paths;
          }

          const readiness = read(READINESS_PATH);
          const deploy = read(DEPLOY_PATH);
          const readinessName = workflowName(readiness, READINESS_PATH);
          const dependencies = workflowRunDependencies(deploy);
          const readinessPaths = pushPaths(readiness, READINESS_PATH);
          const deployPaths = pushPaths(deploy, DEPLOY_PATH);

          assert.ok(
            dependencies.includes(readinessName),
            `${DEPLOY_PATH}: workflow_run listens to ${JSON.stringify(dependencies)}, but readiness workflow is named ${JSON.stringify(readinessName)}`,
          );
          assert.equal(
            dependencies.filter((name) => name === readinessName).length,
            1,
            `${DEPLOY_PATH}: readiness workflow dependency must be declared exactly once`,
          );

          const requiredReadinessPaths = [
            'src/**', 'data/**', 'baptisty-rossii/**', 'scripts/**', 'css/**', 'js/**',
            'sitemap.xml', 'feed.xml', 'astro.config.mjs', 'tsconfig.json', 'migration/**',
            'package.json', 'package-lock.json',
          ];
          for (const glob of requiredReadinessPaths) {
            assert.ok(readinessPaths.includes(glob), `${READINESS_PATH}: push.paths must include ${glob}`);
          }

          const requiredDirectDeployPaths = [
            'images/**', 'fonts/**', 'icons/**', 'konfessii/**', 'karty/**', 'map/**',
            'biografii/**', 'hard-texts/**', '.nojekyll', 'favicon*',
            'apple-touch-icon.png', 'CNAME', '.github/workflows/deploy.yml',
          ];
          for (const glob of requiredDirectDeployPaths) {
            assert.ok(deployPaths.includes(glob), `${DEPLOY_PATH}: asset/infrastructure push.paths must include ${glob}`);
          }

          const overlap = deployPaths.filter((glob) => readinessPaths.includes(glob));
          assert.deepEqual(
            overlap,
            [],
            `readiness and direct deploy push.paths must be disjoint; overlap: ${JSON.stringify(overlap)}`,
          );

          console.log(`✅ workflow linkage: ${JSON.stringify(readinessName)} → Deploy to GitHub Pages`);
          console.log(`✅ readiness-owned paths: ${readinessPaths.length}; direct asset paths: ${deployPaths.length}; overlap: 0`);
          EOF
          chmod +x scripts/workflow-linkage-regression-test.js

      - name: Remove transaction workflow
        run: |
          rm -f .github/workflows/_temp-pages-trigger-topology-fix.yml
          git add -A

      - name: Validate workflow topology and policy
        run: |
          node scripts/workflow-linkage-regression-test.js
          npm run workflows:check
          curl -sL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz" | tar xz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/deploy.yml .github/workflows/indexnow.yml .github/workflows/shared-files-guard.yml
          git diff --check
          test ! -e .github/workflows/_temp-pages-trigger-topology-fix.yml

      - name: Static publication light barrier
        run: npm run validate:static-publication:light

      - name: Commit clean permanent topology
        shell: bash
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ci): make readiness the single owner of source deploy triggers'
          git push origin HEAD:fix/pages-trigger-topology-2026-07-22
