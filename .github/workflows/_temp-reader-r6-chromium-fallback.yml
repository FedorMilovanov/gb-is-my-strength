name: Temporary Reader R6 Chromium Fallback

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-chromium-fallback.yml"
      - "scripts/_temp_apply_r6_chromium.py"
      - "scripts/_temp_reader_r6_chromium.patch"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Apply exact Chromium fallback replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_apply_r6_chromium.py
          rm scripts/_temp_apply_r6_chromium.py scripts/_temp_reader_r6_chromium.patch
          node --check scripts/engine-sweep.mjs
          grep -F "existsSync(pinnedChromium) ? { executablePath: pinnedChromium } : {}" scripts/engine-sweep.mjs
          git diff --check

      - name: Commit permanent compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A scripts/engine-sweep.mjs scripts/_temp_apply_r6_chromium.py scripts/_temp_reader_r6_chromium.patch
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] fix(ci): launch installed Chromium in engine sweep"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
