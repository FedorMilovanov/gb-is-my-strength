name: Map Archaeology Source Registry

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'karty/_data/archaeology-source-registry.json'
      - 'scripts/map-archaeology-source-registry-audit.js'
      - 'scripts/map-archaeology-registry-expansion-materialize.mjs'
      - '.github/workflows/map-archaeology-source-registry.yml'
  push:
    branches: [main]
    paths:
      - 'karty/_data/archaeology-source-registry.json'
      - 'scripts/map-archaeology-source-registry-audit.js'
      - '.github/workflows/map-archaeology-source-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: map-archaeology-source-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize-category-expansion:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/map-archaeology-registry-expansion'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact expansion branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Apply guarded category expansion
        run: node scripts/map-archaeology-registry-expansion-materialize.mjs --write
      - name: Verify registry-only mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/map-archaeology-registry-expansion-materialize.mjs
          node --check scripts/map-archaeology-source-registry-audit.js
          node scripts/map-archaeology-source-registry-audit.js
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'changed[%s]=%s\n' "${#changed[@]}" "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "karty/_data/archaeology-source-registry.json"
      - name: Commit exact registry expansion
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add karty/_data/archaeology-source-registry.json
          git diff --cached --check
          git commit -m "research(karty): cover all archaeology runtime categories"
          git push origin "HEAD:${HEAD_REF}"

  registry-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate source syntax
        run: |
          node --check scripts/map-archaeology-source-registry-audit.js
          node --check scripts/map-archaeology-registry-expansion-materialize.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('karty/_data/archaeology-source-registry.json','utf8'))"

      - name: Enforce evidence hierarchy, YEC separation and category coverage
        run: node scripts/map-archaeology-source-registry-audit.js

      - name: Lint workflow
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/map-archaeology-source-registry.yml

      - name: Upload registry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-archaeology-source-registry-${{ github.run_id }}
          path: reports/map-archaeology-source-registry.json
          if-no-files-found: error
          retention-days: 30

      - name: Ensure proof is read-only
        run: git diff --exit-code
