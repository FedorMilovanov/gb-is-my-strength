name: TEMP Cache-Bust Reconciliation

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cache-bust-reconcile-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.head_ref == 'fix/deploy-cache-bust-reconcile-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile revisions and validate publication
        id: reconcile
        shell: bash
        run: |
          set +e
          mkdir -p reports
          {
            set -euo pipefail
            merge_sha='39f6c3ac5851b6ded164f4de42b4e9dba1ca72e7'

            git merge-base --is-ancestor "$merge_sha" HEAD
            test "$(git rev-parse HEAD:js/site.js)" = "$(git rev-parse ${merge_sha}:js/site.js)"
            test "$(git rev-parse HEAD:karty/_engine/map-engine.js)" = "$(git rev-parse ${merge_sha}:karty/_engine/map-engine.js)"

            git show "${merge_sha}:konfessii/russkij-baptizm/_app/index.html" > /tmp/mindmap-before.html
            node scripts/cache-bust.js --write

            python3 - <<'PY'
          import re, subprocess
          from pathlib import Path

          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode('utf-8').split('\0')
          changed = [path for path in changed if path]
          if not changed:
              raise SystemExit('cache-bust --write produced no changes')

          invalid = [
              path for path in changed
              if path != 'src/lib/asset-version.js'
              and not path.endswith('.html')
              and not path.endswith('.astro')
          ]
          if invalid:
              raise SystemExit('unexpected cache-bust paths: ' + ', '.join(invalid))

          before = Path('/tmp/mindmap-before.html').read_text(encoding='utf-8')
          after = Path('konfessii/russkij-baptizm/_app/index.html').read_text(encoding='utf-8')
          normalize = lambda text: re.sub(r'\?v=[a-f0-9]{8}', '', text)
          if normalize(before) != normalize(after):
              raise SystemExit('MindMap app changed beyond asset revision query strings')

          print(f'✅ generated revision paths only: {len(changed)} files')
          for path in changed:
              print(path)
          PY

            git diff --check
            node scripts/cache-bust.js
            npm run validate:static-publication
            npm run strangler:build:production-like
            npm run page-ownership:dist:production-like
            npm run contract:extract:dist
            npm run contract:compare:dist
            npm run dist:jsonld:audit
            npm run overlay:special:writers:test

            test "$(git hash-object js/site.js)" = "$(git rev-parse ${merge_sha}:js/site.js)"
            test "$(git hash-object karty/_engine/map-engine.js)" = "$(git rev-parse ${merge_sha}:karty/_engine/map-engine.js)"
          } > reports/cache-bust-reconcile.log 2>&1
          status=$?
          cat reports/cache-bust-reconcile.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload reconciliation diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-bust-reconcile-diagnostic
          path: reports/cache-bust-reconcile.log
          retention-days: 7

      - name: Fail on reconciliation error
        if: steps.reconcile.outputs.status != '0'
        run: exit 1

      - name: Publish generated revision transaction
        if: steps.reconcile.outputs.status == '0'
        id: publish
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set +e
          {
            set -euo pipefail
            git add -u
            echo '--- staged files ---'
            git diff --cached --name-only
            forbidden="$(git diff --cached --name-only | python3 -c 'import sys; bad=[p.strip() for p in sys.stdin if p.strip() and p.strip() != "src/lib/asset-version.js" and not p.strip().endswith((".html", ".astro"))]; print("\n".join(bad))')"
            test -z "$forbidden" || { echo 'Unexpected staged files:'; echo "$forbidden"; exit 1; }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(deploy): reconcile generated asset revisions'
            git push origin "HEAD:${HEAD_REF}"
          } > reports/cache-bust-publish.log 2>&1
          status=$?
          cat reports/cache-bust-publish.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload publish diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-bust-publish-diagnostic
          path: reports/cache-bust-publish.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail on publish error
        if: steps.reconcile.outputs.status == '0' && steps.publish.outputs.status != '0'
        run: exit 1
