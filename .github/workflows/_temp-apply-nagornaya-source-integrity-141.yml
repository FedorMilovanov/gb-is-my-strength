name: TEMP Apply Nagornaya Source Integrity 141

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temp-apply-nagornaya-source-integrity-141
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.number == 141 && github.event.pull_request.head.ref == 'fix/nagornaya-source-integrity-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nagornaya-source-integrity-2026-07-22
          fetch-depth: 0

      - name: Check one-shot trigger
        id: guard
        shell: bash
        run: |
          if [ -f .github/_temp-nagornaya-source-integrity-trigger ]; then
            echo 'apply=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apply=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.guard.outputs.apply == 'true'
        run: npm ci

      - name: Apply exact source-integrity patch
        id: patch
        if: steps.guard.outputs.apply == 'true'
        shell: bash
        run: |
          set +e
          python3 scripts/_temp_apply_nagornaya_source_integrity.py > /tmp/source-integrity-patch.log 2>&1
          rc=$?
          cat /tmp/source-integrity-patch.log
          exit "$rc"

      - name: Post exact patch diagnostic
        if: always() && steps.guard.outputs.apply == 'true' && steps.patch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 141 --repo "$GITHUB_REPOSITORY" --body-file /tmp/source-integrity-patch.log

      - name: Verify source-integrity regression
        if: steps.guard.outputs.apply == 'true' && steps.patch.outcome == 'success'
        run: node scripts/nagornaya-source-integrity-regression-test.js

      - name: Verify full publication barrier
        if: steps.guard.outputs.apply == 'true' && steps.patch.outcome == 'success'
        run: npm run validate:static-publication:light

      - name: Verify clean scoped diff
        if: steps.guard.outputs.apply == 'true' && steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/_temp_apply_nagornaya_source_integrity.py
          rm .github/_temp-nagornaya-source-integrity-trigger
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'src/components/nagornaya/istochniki/NagornayaIstochnikiMainShell.astro',
              'nagornaya/istochniki/index.html',
              'src/components/nagornaya/chast-4/NagornayaChast4MainShell.astro',
              'nagornaya/chast-4/index.html',
              'scripts/nagornaya-source-integrity-regression-test.js',
              'scripts/_temp_apply_nagornaya_source_integrity.py',
              '.github/_temp-nagornaya-source-integrity-trigger',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          paths = {line[3:] for line in lines if line.strip()}
          unexpected = sorted(paths - allowed)
          if unexpected:
              raise SystemExit(f'unexpected transaction paths: {unexpected}')
          required = allowed - {'scripts/_temp_apply_nagornaya_source_integrity.py', '.github/_temp-nagornaya-source-integrity-trigger'}
          missing = sorted(required - paths)
          if missing:
              raise SystemExit(f'missing permanent paths: {missing}')
          PY

      - name: Publish validated source-integrity files
        if: steps.guard.outputs.apply == 'true' && steps.patch.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add \
            src/components/nagornaya/istochniki/NagornayaIstochnikiMainShell.astro \
            nagornaya/istochniki/index.html \
            src/components/nagornaya/chast-4/NagornayaChast4MainShell.astro \
            nagornaya/chast-4/index.html \
            scripts/nagornaya-source-integrity-regression-test.js \
            scripts/_temp_apply_nagornaya_source_integrity.py \
            .github/_temp-nagornaya-source-integrity-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(nagornaya): correct TMSJ objects and attribution [source-integrity]'
          git push origin HEAD:fix/nagornaya-source-integrity-2026-07-22
