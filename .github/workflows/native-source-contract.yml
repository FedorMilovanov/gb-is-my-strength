name: Native Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "src/pages/**"
      - "src/components/**"
      - "src/content/**"
      - "data/route-profiles/**"
      - "data/public-content-baseline.json"
      - "migration/page-ownership.json"
      - "migration/route-migration-matrix.json"
      - "scripts/article-native-contract-audit.js"
      - "scripts/article-native-effective-contract-audit.js"
      - "scripts/article-mdx-pilot-audit.js"
      - "scripts/baptisty-series-shadow-audit.js"
      - "scripts/check-mdx-html-parity.js"
      - "scripts/html-surface-contract-audit.js"
      - "scripts/html-surface-contract-test.js"
      - "scripts/route-source-contract-audit.js"
      - "scripts/sync-route-migration-matrix.js"
      - "scripts/lib/html-surface-contract.js"
      - "scripts/lib/public-surface-registry.js"
      - "scripts/lib/route-source-contract.js"
      - "scripts/lib/route-matrix-normalizer.js"
      - "scripts/lib/effective-route-registry.js"
      - ".github/workflows/native-source-contract.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
    paths:
      - "src/pages/**"
      - "src/components/**"
      - "src/content/**"
      - "data/route-profiles/**"
      - "data/public-content-baseline.json"
      - "migration/page-ownership.json"
      - "migration/route-migration-matrix.json"
      - "scripts/article-native-contract-audit.js"
      - "scripts/article-native-effective-contract-audit.js"
      - "scripts/article-mdx-pilot-audit.js"
      - "scripts/baptisty-series-shadow-audit.js"
      - "scripts/check-mdx-html-parity.js"
      - "scripts/html-surface-contract-audit.js"
      - "scripts/html-surface-contract-test.js"
      - "scripts/route-source-contract-audit.js"
      - "scripts/sync-route-migration-matrix.js"
      - "scripts/lib/html-surface-contract.js"
      - "scripts/lib/public-surface-registry.js"
      - "scripts/lib/route-source-contract.js"
      - "scripts/lib/route-matrix-normalizer.js"
      - "scripts/lib/effective-route-registry.js"
      - ".github/workflows/native-source-contract.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: native-source-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Validate effective matrix contract without writing
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/sync-route-migration-matrix.js --check 2>&1 \
            | tee reports/native-source-contract-matrix.log

      - name: Validate declared sources against actual import graphs
        shell: bash
        run: |
          set -o pipefail
          node scripts/route-source-contract-audit.js --strict 2>&1 \
            | tee reports/native-source-contract-source.log

      - name: Validate HTML surface mutation contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/html-surface-contract-test.js 2>&1 \
            | tee reports/native-source-contract-html-test.log

      - name: Install dependencies
        run: npm ci

      - name: Astro type and template check
        shell: bash
        run: |
          set -o pipefail
          npm run astro:check 2>&1 | tee reports/native-source-contract-astro.log

      - name: Build production-like dist
        shell: bash
        run: |
          set -o pipefail
          npm run strangler:build:production-like 2>&1 \
            | tee reports/native-source-contract-build.log

      - name: Validate native article and series output
        shell: bash
        run: |
          set -o pipefail
          node scripts/article-native-effective-contract-audit.js --no-build --require-content-parity 2>&1 \
            | tee reports/native-source-contract-dist.log

      - name: Validate every production HTML surface
        shell: bash
        run: |
          set -o pipefail
          node scripts/html-surface-contract-audit.js \
            --root dist \
            --strict \
            --report reports/html-surface-contract.json 2>&1 \
            | tee reports/native-source-contract-html.log

      - name: Validate migration metadata coherence
        shell: bash
        run: |
          set -o pipefail
          npm run migration:metadata:check:strict 2>&1 \
            | tee reports/native-source-contract-metadata.log

      - name: Validate workflow policy
        shell: bash
        run: |
          set -o pipefail
          npm run workflows:check 2>&1 \
            | tee reports/native-source-contract-workflows.log

      - name: Ensure validation did not mutate tracked sources
        run: git diff --exit-code

      - name: Upload native source contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-source-contract-${{ github.run_id }}
          path: |
            reports/native-source-contract-*.log
            reports/html-surface-contract.json
            migration/route-migration-matrix.json
            src/components/baptisty-rossii/BaptistyRossiiBody.astro
          if-no-files-found: error
          retention-days: 7
