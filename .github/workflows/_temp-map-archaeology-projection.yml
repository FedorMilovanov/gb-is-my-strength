name: TEMP Map Archaeology Projection Materializer

on:
  push:
    branches:
      - agent/map-archaeology-projection-p0
    paths:
      - scripts/materialize-map-archaeology-projection.mjs
      - .github/workflows/_temp-map-archaeology-projection.yml

permissions:
  contents: write

concurrency:
  group: temp-map-archaeology-projection-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == 'FedorMilovanov/gb-is-my-strength'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/map-archaeology-projection-p0
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize exact projection patch
        run: node scripts/materialize-map-archaeology-projection.mjs

      - name: Validate permanent contract
        run: |
          node --check karty/_engine/map-engine.js
          node --check src/lib/karty/map-archaeology-projection.mjs
          node --check scripts/map-archaeology-projection-contract-test.mjs
          node scripts/map-archaeology-source-registry-audit.js
          node scripts/map-archaeology-projection-contract-test.mjs
          node scripts/run-actionlint.mjs .github/workflows/map-archaeology-projection.yml

      - name: Enforce exact materialized scope
        shell: bash
        run: |
          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//' | sort)
          expected=(
            '.github/workflows/_temp-map-archaeology-projection.yml'
            '.github/workflows/map-archaeology-projection.yml'
            'karty/_engine/map-engine.js'
            'scripts/map-archaeology-projection-contract-test.mjs'
            'scripts/materialize-map-archaeology-projection.mjs'
            'src/components/karty/avraam/AvraamMap.astro'
            'src/lib/karty/map-archaeology-projection.mjs'
          )
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${changed[@]}")
          test ! -e scripts/materialize-map-archaeology-projection.mjs
          test ! -e .github/workflows/_temp-map-archaeology-projection.yml

      - name: Commit permanent files and remove transaction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(karty): add provenance-backed archaeology projection'
          git push origin HEAD:agent/map-archaeology-projection-p0
