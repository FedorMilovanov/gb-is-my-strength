name: Home Resume Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "js/home-resume.js"
      - "src/components/home/HomeSections/ResumeMobile.astro"
      - "src/lib/asset-version.js"
      - "scripts/home-resume-contract-test.js"
      - "scripts/home-resume-browser-test.mjs"
      - ".github/workflows/home-resume-contract.yml"
  workflow_dispatch:

concurrency:
  group: home-resume-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test canonical ReaderState homepage projection
        run: node scripts/home-resume-contract-test.js

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test homepage resume in Chromium
        run: node scripts/home-resume-browser-test.mjs
