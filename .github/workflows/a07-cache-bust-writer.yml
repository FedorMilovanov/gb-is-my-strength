name: A07 cache-bust writer

on:
  pull_request:
    types: [synchronize]
    branches: [main]

concurrency:
  group: a07-cache-bust-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  write:
    if: >-
      github.event.pull_request.number == 787 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/offline-pwa-current-20260803'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout canonical A07 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Materialize canonical asset revisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Remove transaction-only writer
        run: git rm .github/workflows/a07-cache-bust-writer.yml

      - name: Enforce projection-only writer scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/a07-writer-paths.txt
          unexpected="$(grep -Ev '^(src/lib/asset-version\.js|.+\.html|.+\.astro|\.github/workflows/a07-cache-bust-writer\.yml)$' /tmp/a07-writer-paths.txt || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected cache-bust writer paths:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          test -s /tmp/a07-writer-paths.txt
          git diff --check

      - name: Commit canonical projections and self-removal
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(offline): project sw-register asset revision'
          git push origin "HEAD:${HEAD_REF}"
