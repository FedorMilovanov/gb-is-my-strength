name: TEMP reader R1 import

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'lane/system-reader-preferences-r1-final-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/system-reader-preferences-r1-final-2026-07-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Import permanent R1 diff onto current main
        shell: bash
        run: |
          set -euo pipefail
          source_branch='origin/lane/system-reader-preferences-foundation-2026-07-21'
          git fetch origin main lane/system-reader-preferences-foundation-2026-07-21
          base="$(git merge-base origin/main "$source_branch")"
          git diff --binary "$base" "$source_branch" -- . \
            ':(exclude).github/workflows/_temp-*' \
            ':(exclude)scripts/_temp_*' \
            ':(exclude).github/workflows/shared-files-guard.yml' \
            > /tmp/reader-r1.patch
          test -s /tmp/reader-r1.patch
          git apply --3way --index /tmp/reader-r1.patch

          git show "$source_branch":.github/workflows/_temp-reader-preferences-full-gate.yml \
            > .github/workflows/_temp-reader-preferences-full-gate.yml
          git add .github/workflows/_temp-reader-preferences-full-gate.yml

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/shared-files-guard.yml')
          text = path.read_text(encoding='utf-8')
          needle = "      - name: Map layers and palette regressions\n        run: node scripts/map-layers-theme-regression-test.js\n"
          addition = needle + "\n      - name: Reader preferences regressions\n        run: node scripts/reader-preferences-regression-test.js\n"
          if text.count(needle) != 1:
              raise SystemExit(f'expected one permanent guard insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, addition, 1), encoding='utf-8')
          PY
          git add .github/workflows/shared-files-guard.yml

          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          check = subprocess.run(['git', 'diff', '--cached', '--check'], text=True, capture_output=True)
          touched = {}
          eof_files = set()
          for raw in check.stdout.splitlines():
              match = re.match(r'^(.*):(\d+): trailing whitespace\.$', raw)
              if match:
                  touched.setdefault(match.group(1), set()).add(int(match.group(2)))
                  continue
              match = re.match(r'^(.*):(\d+): new blank line at EOF\.$', raw)
              if match:
                  eof_files.add(match.group(1))
          for filename, line_numbers in touched.items():
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              for number in line_numbers:
                  index = number - 1
                  if not (0 <= index < len(lines)):
                      raise SystemExit(f'{filename}:{number}: diff-check line out of range')
                  ending = '\n' if lines[index].endswith('\n') else ''
                  body = lines[index][:-1] if ending else lines[index]
                  if body.endswith('\r'):
                      body = body[:-1]
                      ending = '\r\n' if ending else '\r'
                  lines[index] = body.rstrip(' \t') + ending
              path.write_text(''.join(lines), encoding='utf-8')
          for filename in eof_files:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip('\r\n') + '\n', encoding='utf-8')
          print(f'cleaned diff-check whitespace: files={len(set(touched) | eof_files)}')
          PY
          git add -u

          git rm .github/workflows/_temp-reader-r1-import.yml
          git diff --cached --check

      - name: Verify imported contracts
        shell: bash
        run: |
          set +e
          {
            set -x
            node --check js/reader-preferences-head.js
            node --check js/reader-preferences.js
            node --check scripts/reader-preferences-browser-smoke.js
            node scripts/reader-preferences-regression-test.js
            node scripts/audit-pro.js
            npm run engine:contracts
          } > /tmp/reader-r1-verify.log 2>&1
          status=$?
          cat /tmp/reader-r1-verify.log
          exit "$status"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r1-verify-log
          path: /tmp/reader-r1-verify.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit clean R1 transfer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "[LANE lane/system-reader-preferences-r1-final-2026-07-21] feat(reader): transfer universal preference foundation"
          git push origin HEAD:lane/system-reader-preferences-r1-final-2026-07-21
