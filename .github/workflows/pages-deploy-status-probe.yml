name: Pages Deploy Status Probe

on:
  pull_request:
    paths:
      - '.github/workflows/pages-deploy-status-probe.yml'

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  probe:
    name: Read canonical Pages deployment state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query deploy workflow and Pages deployments
        uses: actions/github-script@v7
        env:
          REQUIRED_FIX_SHA: 220a41318c762a828c608e41cadc156053702509
        with:
          script: |
            const fs = require('node:fs');
            const { owner, repo } = context.repo;
            const requiredFixSha = process.env.REQUIRED_FIX_SHA;
            const { data: workflowRuns } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              event: 'push',
              per_page: 10,
            });

            const runs = [];
            for (const run of workflowRuns.workflow_runs) {
              let containsRequiredFix = null;
              let compareStatus = null;
              try {
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: requiredFixSha,
                  head: run.head_sha,
                });
                compareStatus = comparison.status;
                containsRequiredFix = comparison.status === 'ahead' || comparison.status === 'identical';
              } catch (error) {
                compareStatus = `error: ${error.message}`;
              }

              const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
                owner,
                repo,
                run_id: run.id,
                filter: 'latest',
                per_page: 100,
              });

              runs.push({
                id: run.id,
                runNumber: run.run_number,
                runAttempt: run.run_attempt,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                headSha: run.head_sha,
                headBranch: run.head_branch,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                runStartedAt: run.run_started_at,
                htmlUrl: run.html_url,
                compareStatus,
                containsRequiredFix,
                jobs: jobs.jobs.map((job) => ({
                  id: job.id,
                  name: job.name,
                  status: job.status,
                  conclusion: job.conclusion,
                  startedAt: job.started_at,
                  completedAt: job.completed_at,
                  htmlUrl: job.html_url,
                  currentOrFailedSteps: job.steps
                    .filter((step) => step.status !== 'completed' || step.conclusion !== 'success')
                    .map((step) => ({
                      name: step.name,
                      status: step.status,
                      conclusion: step.conclusion,
                      number: step.number,
                    })),
                })),
              });
            }

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: 'github-pages',
              per_page: 10,
            });
            const pageDeployments = [];
            for (const deployment of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 10,
              });
              pageDeployments.push({
                id: deployment.id,
                sha: deployment.sha,
                ref: deployment.ref,
                environment: deployment.environment,
                createdAt: deployment.created_at,
                updatedAt: deployment.updated_at,
                latestStatuses: statuses.slice(0, 3).map((status) => ({
                  state: status.state,
                  description: status.description,
                  environmentUrl: status.environment_url,
                  createdAt: status.created_at,
                  updatedAt: status.updated_at,
                })),
              });
            }

            const report = {
              generatedAt: new Date().toISOString(),
              requiredFixSha,
              runs,
              pageDeployments,
            };
            fs.mkdirSync('reports/pages-deploy-status', { recursive: true });
            fs.writeFileSync('reports/pages-deploy-status/report.json', JSON.stringify(report, null, 2));
            core.info(JSON.stringify(report, null, 2));

      - name: Upload deployment status report
        uses: actions/upload-artifact@v4
        with:
          name: pages-deploy-status-${{ github.run_id }}
          path: reports/pages-deploy-status/report.json
          if-no-files-found: error
          retention-days: 7
