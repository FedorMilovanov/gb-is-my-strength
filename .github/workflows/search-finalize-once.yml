name: Search Finalize Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/search-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Refuse stale branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${HEAD_BRANCH}"
          test "$(git rev-parse "origin/${HEAD_BRANCH}")" = "${EXPECTED_HEAD}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_HEAD}"

      - name: Apply exact Search finalization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          search = Path('js/search.js')
          text = search.read_text(encoding='utf-8')
          old = 'we(),ie(function(){E.value.trim()&&xe(E.value.trim())}))'
          new = 'we(),ie())'
          assert text.count(old) == 1, f'expected one Search open/query owner, got {text.count(old)}'
          search.write_text(text.replace(old, new), encoding='utf-8')

          audit = Path('scripts/audit-pro.js')
          text = audit.read_text(encoding='utf-8')
          old = "const htmlFiles = sourceCorpus.sourcePages.map((item) => item.file).sort();\nconst htmlPages = htmlFiles;"
          new = "const htmlFiles = sourceCorpus.sourcePages.map((item) => item.file).sort();\nconst htmlPages = htmlFiles;\nconst currentRuntimeHtmlPages = sourceCorpus.currentRuntimePages.map((item) => item.file).sort();"
          assert text.count(old) == 1, f'expected one audit corpus declaration, got {text.count(old)}'
          text = text.replace(old, new)

          cache_marker = '// 5. Cache-bust hash integrity'
          cache_at = text.index(cache_marker)
          cache_loop = 'for (const p of htmlPages) {'
          cache_loop_at = text.index(cache_loop, cache_at)
          text = text[:cache_loop_at] + 'for (const p of currentRuntimeHtmlPages) {' + text[cache_loop_at + len(cache_loop):]

          shortcut_marker = '// G112. Search keyboard ownership contract.'
          shortcut_at = text.index(shortcut_marker)
          html_candidate = '    ...htmlPages,\n'
          candidate_at = text.index(html_candidate, shortcut_at)
          text = text[:candidate_at] + '    ...currentRuntimeHtmlPages,\n' + text[candidate_at + len(html_candidate):]

          audit.write_text(text, encoding='utf-8')
          PY

          node --check js/search.js
          node --check scripts/audit-pro.js
          node scripts/audit-pro-source-corpus-test.js

      - name: Commit exact patch and retire finalizer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/search-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/search.js scripts/audit-pro.js .github/workflows/search-finalize-once.yml
          git diff --cached --check
          git commit -m 'fix(search): separate runtime authority and query ownership'
          git push origin "HEAD:${HEAD_BRANCH}"
