name: TEMP Sync Map Archaeology Main

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-sync-map-archaeology-main.yml'

permissions:
  contents: write

concurrency:
  group: temp-sync-map-archaeology-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'FedorMilovanov/gb-is-my-strength' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/map-archaeology-engine-p0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-archaeology-engine-p0
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch current main
        run: git fetch --no-tags origin main
      - name: Prove independent main delta
        run: |
          echo 'Main-only files:'
          git diff --name-only HEAD...origin/main
          test "$(git merge-base HEAD origin/main)" = "e7f07567171fe9d689f40a0229191c1af6eb84c1"
          test "$(git rev-parse origin/main)" = "47cc977433aa0dddfd8a55c94983c0a7342025db"
          test -z "$(comm -12 <(git diff --name-only e7f07567171fe9d689f40a0229191c1af6eb84c1..HEAD | sort) <(git diff --name-only e7f07567171fe9d689f40a0229191c1af6eb84c1..origin/main | sort))"
      - name: Merge current main without rewriting history
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff --no-edit origin/main
          git push origin HEAD:agent/map-archaeology-engine-p0
