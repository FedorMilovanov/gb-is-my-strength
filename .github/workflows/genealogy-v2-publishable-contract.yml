name: Genealogy v2 Publishable Projection

on:
  pull_request:
    paths:
      - '.github/workflows/genealogy-v2-publishable-contract.yml'
      - 'data/genealogy/genealogy.json'
      - 'data/genealogy/gospel-sequences.json'
      - 'data/genealogy/v2/**'
      - 'scripts/genealogy-build/**'
      - 'scripts/genealogy-v2-publication-audit.mjs'
      - 'scripts/genealogy-v2-publishable-audit.mjs'
      - 'scripts/genealogy-runtime-data-boundary.mjs'
      - 'src/pages/rodosloviye/**'
      - 'src/components/rodosloviye/**'
      - 'src/components/genealogy/**'
      - 'rodosloviye/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projection:
    name: Build and audit curated projection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check projection pipeline syntax
        run: |
          node --check scripts/genealogy-build/lib/publishable-projection.mjs
          node --check scripts/genealogy-build/lib/textual-assertions.mjs
          node --check scripts/genealogy-build/build-publishable-projection.mjs
          node --check scripts/genealogy-v2-publishable-audit.mjs
          node --check scripts/genealogy-runtime-data-boundary.mjs

      - name: Guard genealogy runtime data authority
        run: node scripts/genealogy-runtime-data-boundary.mjs

      - name: Build curated publishable projection
        run: node scripts/genealogy-build/build-publishable-projection.mjs

      - name: Audit curated publishable projection
        run: node scripts/genealogy-v2-publishable-audit.mjs

      - name: Require byte-identical committed projection
        shell: bash
        run: |
          set -euo pipefail
          drift="$(git status --porcelain -- data/genealogy/v2/publishable)"
          if [ -n "$drift" ]; then
            echo "Curated projection drifted from committed bytes:" >&2
            printf '%s\n' "$drift" >&2
            git diff --stat -- data/genealogy/v2/publishable >&2
            exit 1
          fi

      - name: Upload exact projection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: genealogy-v2-publishable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/genealogy/v2/publishable/
          if-no-files-found: error
          retention-days: 30
