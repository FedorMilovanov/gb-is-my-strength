name: TEMP Highlights Runtime Hardening

on:
  push:
    branches: ["lane/highlights-runtime-hardening-2026-07-21"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'chore(highlights): trigger exact hardening patch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/highlights-runtime-hardening-2026-07-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact runtime patch
        run: python3 scripts/_temp-highlights-runtime-hardening-patch.py

      - name: Run permanent runtime regression
        run: |
          node --check js/highlights.js
          node scripts/highlights-runtime-regression-test.js

      - name: Reconcile generated asset revisions
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Restrict transaction paths and remove temporary inputs
        run: python3 scripts/_temp-highlights-runtime-hardening-patch.py --verify-diff-and-cleanup

      - name: Full static publication barrier
        run: npm run validate:static-publication:light

      - name: Commit verified permanent diff
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(reader): deduplicate highlights and synchronize dialog state'
          git push origin HEAD:lane/highlights-runtime-hardening-2026-07-21
