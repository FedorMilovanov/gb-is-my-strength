name: TEMP Highlights Runtime Hardening

on:
  push:
    branches: ["lane/highlights-runtime-hardening-2026-07-21"]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane/highlights-runtime-hardening-2026-07-21
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run idempotent exact transaction
        run: python3 scripts/_temp-run-highlights-hardening.py
