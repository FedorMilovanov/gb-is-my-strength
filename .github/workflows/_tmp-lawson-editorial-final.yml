name: Temporary Lawson editorial final

on:
  push:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: audit/lawson-theme-rhetoric-final
          fetch-depth: 0
      - name: Apply final editorial voice edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx')
          text = path.read_text(encoding='utf-8')
          reps = [
            ('<li><strong>Октябрь 2026 года добавил эпизод, который статья передаёт с максимально жёсткой границей.</strong>', '<li><strong>Октябрь 2026 года добавил эпизод с жёсткой доказательной границей.</strong>', 1),
            ('Ни один из двух текстов не является независимым расследованием, и статья не выбирает между ними сторону.', 'Ни один из двух текстов не является независимым расследованием, поэтому доказательного основания выбрать между ними нет.', 1),
            ('В-третьих, **Джонсон сознательно не назвал женщину** — и это решение статья полностью разделяет. Мы это имя не воспроизводим: ни церковные заявления, ни Лоусон его не раскрывали, а публичная идентификация пострадавшей стороны не нужна ни для одного вывода этой статьи.', 'В-третьих, **Джонсон сознательно не назвал женщину**. Мы тоже не воспроизводим её имя: ни церковные заявления, ни Лоусон его не раскрывали, а публичная идентификация пострадавшей стороны не нужна для анализа.', 1),
            ('Поправка эту опору ослабляет — и статья не делает вид, что её нет. Из-за разницы в положении комментаторы предполагали, что случившееся может квалифицироваться как духовное сексуальное насилие; статья приводит это как оценку комментаторов, а не как правовое заключение.', 'Поправка эту опору ослабляет. Из-за разницы в положении комментаторы предполагали, что случившееся может квалифицироваться как духовное сексуальное насилие; это остаётся их оценкой, а не правовым заключением.', 1),
            ('Но из неё следуют две вещи, которые статья обязана назвать.', 'Из неё следуют две вещи.', 1),
            ('Это не аргумент против Лоусона. Пётр действительно был послан вновь, и Писание это утверждает. Но это объясняет, почему вопрос о возвращении к служению возникает в его истории так настойчиво:', 'Пётр действительно был послан вновь, и Писание это утверждает. Именно поэтому вопрос о возвращении к служению возникает в истории Лоусона так настойчиво:', 1),
            ('Это не обвинение в обмане. Ни один источник не утверждает, что Лоусон выбрал такую конфигурацию намеренно. Переезд объясняется просьбой жены, членство брата — естественная причина выбрать именно эту общину. Всё это могло сложиться само.', 'Намерение здесь не установлено. Переезд объясняется просьбой жены, членство брата — естественная причина выбрать именно эту общину. Такая конфигурация могла сложиться без сознательного замысла.', 1),
            ('Отсюда практический вывод, к которому статья придёт в следующем разделе: поскольку материал доступен и останется доступным, церквям и читателям нужен не механизм изъятия, а способ чтения.', 'Практический вывод прост: поскольку материал доступен и останется доступным, церквям и читателям нужен не механизм изъятия, а способ чтения.', 1),
            ('Это не обязательно чья-то злая воля; у агрегаторов свои правила, и они не обязаны синхронизироваться с решениями служений.', 'У агрегаторов свои правила, и они не обязаны синхронизироваться с решениями служений; злой умысел для объяснения этого не требуется.', 1),
            ('Но статья обязана назвать это расхождение, потому что прежде приводила ту цитату как описание позиции, а не как исторический документ.', 'Расхождение существенно именно потому, что прежняя цитата описывала публичную позицию, а не просто исторический документ.', 1),
            ('Это сильный аргумент, и статья не считает его пустым. Но он отвечает на вопрос «полезна ли книга кому-то?», а не на вопрос «восстановлена ли достоверность автора?».', 'Это сильный аргумент, но он отвечает на вопрос «полезна ли книга кому-то?», а не на вопрос «восстановлена ли достоверность автора?».', 1),
            ('Никакого обвинения не предъявлялось, и статья не утверждает, что Лоусон совершил преступление. Это оценка комментаторов и экспертов, а не правовое заключение.', 'Никакого обвинения Лоусону не предъявлялось. Квалификация «духовное сексуальное насилие» здесь принадлежит комментаторам и экспертам, а не суду или следствию.', 1),
            ('Совпадение формулы — факт, который можно зафиксировать. Вывод о готовящемся запуске — догадка одного наблюдателя, и статья её не разделяет.', 'Совпадение формулы — проверяемый факт. Вывод о готовящемся запуске остаётся догадкой одного наблюдателя без независимого подтверждения.', 1),
            ('Поэтому ниже каждая закономерность разложена на три части: что произошло, что из этого видно и где проходит граница, за которую эта статья не заходит.', 'Поэтому ниже каждая закономерность разложена на три части: что произошло, что из этого видно и где заканчивается доступное доказательство.', 1),
            ('Это не признание в грехе и не пророчество, а собственное описание образа жизни, записанное за восемь лет до падения.', 'Это собственное описание образа жизни, записанное за восемь лет до падения, а не признание конкретного греха.', 1),
            ('Это не обязательно неправильно. Но это уже форма <LawsonTerm label="публичной платформы"', 'Публичный духовный голос через книгу допустим в принципе. Но это уже форма <LawsonTerm label="публичной платформы"', 1),
          ]
          for old, new, n in reps:
              c = text.count(old)
              if c != n:
                  raise SystemExit(f'expected {n}, found {c}: {old[:140]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify scoped diff
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
      - name: Commit final voice pass
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles/steven-lawson-samoobman-i-publichnyy-golos.mdx
          git commit -m 'edit(lawson): make evidence boundaries direct'
          git push origin HEAD:audit/lawson-theme-rhetoric-final
