name: Deployment Witness Ledger

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  actions: read        # читаем exact-run artifact metadata and bytes
  contents: read       # checkout trusted recorder from the deployed main SHA
  issues: write        # comment/close only a full-SHA machine-marked issue
  pull-requests: read  # locate the PR whose merge SHA exactly matches deployment

concurrency:
  group: deployment-witness-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  record:
    name: Record verified deployment capability witness
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact deployed main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download exact-run TTS witness artifact
        uses: actions/download-artifact@v4
        with:
          name: tts-live-deployment-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/deployment-witness
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate artifact metadata/report and record witness
        uses: actions/github-script@v7
        env:
          WITNESS_DIRECTORY: ${{ runner.temp }}/deployment-witness
        with:
          script: |
            const recordWitness = require('./scripts/record-deployment-witness.cjs');
            await recordWitness({
              github,
              context,
              core,
              workflowRun: context.payload.workflow_run,
              witnessDirectory: process.env.WITNESS_DIRECTORY,
            });
