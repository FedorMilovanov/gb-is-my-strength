name: Search Cold Bootstrap Contract

on:
  pull_request:
    paths:
      - '.github/workflows/search-cold-bootstrap.yml'
      - 'scripts/search-cold-bootstrap-browser-test.mjs'
      - 'src/components/reader-platform/ReaderPreferencesHead.astro'
      - 'src/components/articles/**'
      - 'src/components/biografii/**'
      - 'src/components/pastor-series/**'
      - 'src/pages/articles/index.astro'
      - 'src/pages/biografii/index.astro'
      - 'src/pages/pastor-series/index.astro'
      - 'js/search.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-cold-bootstrap.yml'
      - 'scripts/search-cold-bootstrap-browser-test.mjs'
      - 'src/components/reader-platform/ReaderPreferencesHead.astro'
      - 'src/components/articles/**'
      - 'src/components/biografii/**'
      - 'src/components/pastor-series/**'
      - 'src/pages/articles/index.astro'
      - 'src/pages/biografii/index.astro'
      - 'src/pages/pastor-series/index.astro'
      - 'js/search.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: search-cold-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium WebKit cold bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Build Pagefind index
        run: npm run pagefind:build:dist
      - name: Run cold-bootstrap browser contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/search-cold-bootstrap-browser-test.mjs
      - name: Upload cold-bootstrap evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-cold-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/search-cold-bootstrap
          if-no-files-found: error
          retention-days: 14
