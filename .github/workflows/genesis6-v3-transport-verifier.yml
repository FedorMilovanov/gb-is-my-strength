name: Genesis 6 V3 transport verifier

on:
  pull_request:
    paths:
      - '.github/workflows/genesis6-v3-transport-verifier.yml'
      - 'tmp-genesis6-v3-transport-verifier.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  verify-loaded-chunks:
    runs-on: ubuntu-latest
    steps:
      - name: Verify issue payload chunks 000-005
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const expected = [
              ['000', 8000, '8350c272e69d863b4b5c384eb5b3748f3a8a68c65c8e11db7448d8a5ccb1aa5f', '1774843c7321e63770103e56cdc66bd646611dbe'],
              ['001', 8000, '94f90c2f52162005302070dcbc8649d7fb33b2f35c823055dd4ea5869db1e124', 'b21c38e87f4c7bb87662933a19cb5040d2c1633b'],
              ['002', 8000, '2d304a9b1a46a2f8818295889ea38b2ecfcbd64f7eeb0351a9594fc3f6801a7b', 'e0e37927890ec02ef05773f3f8941ccb287c0a9b'],
              ['003', 8000, '853528bea56dddd12faa7f06d18e09fe963cb3dd22cdb6283a0dcf23103f4e9a', '81db18c3f1e0b6d9c49c0a67dbbd60cf557f2c48'],
              ['004', 8000, '7334fb212ce125df8bd34c9f642fa25f6b759292ff4001f7289c1166f43f1515', '2e6933829be99627e9bda3b1a8b44d067f5b2a31'],
              ['005', 8000, '7081cb192f3eb0d6ff041ac9809f0b5122e973a9f68cdcfd9437402ba83b9610', '2818a68822554244dd3ae0083f44efdb82bb5c6c'],
            ];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 287,
              per_page: 100,
            });
            for (const [index, chars, wantedSha256, wantedGitSha] of expected) {
              const marker = `GENESIS6_V3_CHUNK ${index}/026`;
              const matches = comments.filter(({ body = '' }) => body.startsWith(marker));
              if (matches.length !== 1) {
                core.setFailed(`${marker}: expected one comment, found ${matches.length}`);
                continue;
              }
              const lines = matches[0].body.split('\n');
              const begin = lines.indexOf('BEGIN');
              const end = lines.lastIndexOf('END');
              if (begin < 0 || end <= begin) {
                core.setFailed(`${marker}: malformed BEGIN/END envelope`);
                continue;
              }
              const data = lines.slice(begin + 1, end).join('\n');
              const sha256 = crypto.createHash('sha256').update(data, 'utf8').digest('hex');
              const header = Buffer.from(`blob ${Buffer.byteLength(data, 'utf8')}\0`);
              const gitSha = crypto.createHash('sha1').update(Buffer.concat([header, Buffer.from(data)])).digest('hex');
              core.info(JSON.stringify({ index, chars: data.length, sha256, gitSha }));
              if (data.length !== chars) core.setFailed(`${marker}: character count ${data.length}`);
              if (sha256 !== wantedSha256) core.setFailed(`${marker}: SHA-256 ${sha256}`);
              if (gitSha !== wantedGitSha) core.setFailed(`${marker}: Git blob SHA ${gitSha}`);
            }
