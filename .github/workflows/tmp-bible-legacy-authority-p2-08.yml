name: Complete Bible legacy authority P2-08

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: bible-legacy-authority-p2-08-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/scripture-legacy-authority-p2-08-20260804'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 20
      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Install immutable dependencies
        run: npm ci
      - name: Refine minified CSS boundary in temporary writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/tmp/apply_bible_legacy_authority_p2_08.py')
          source = path.read_text(encoding='utf-8')
          old = """    if css.count(start_marker) != 1 or css.count(end_marker) != 1:
                  raise SystemExit('site.css legacy style markers drifted')
              start = css.index(start_marker)
              end = css.index(end_marker, start)
          """
          new = """    start = css.find(start_marker)
              if start < 0:
                  raise SystemExit('site.css legacy start marker drifted')
              end = css.find('\\n' + end_marker, start)
              if end < 0:
                  raise SystemExit('site.css legacy end marker drifted')
              end += 1
          """
          if source.count(old) != 1:
              raise SystemExit(f'temporary writer CSS anchor drifted: {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Execute self-clean atomic removal
        shell: bash
        run: bash .github/tmp/run_bible_legacy_authority_p2_08.sh
