name: TEMP Terminal Final Proof

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: temp-terminal-final-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prove:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'terminal/frozen-final-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prove exact head and bounded final surface
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          printf '%s\n' \
            .github/workflows/temp-terminal-postmerge-proof.yml \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-pr.txt
          git diff --name-only refs/remotes/origin/main...HEAD | sort > /tmp/pr-files.txt
          while read -r file; do
            test -z "$file" || grep -Fx "$file" /tmp/allowed-pr.txt >/dev/null || { echo "Unexpected terminal PR file: $file" >&2; exit 1; }
          done < /tmp/pr-files.txt
          git diff --check refs/remotes/origin/main...HEAD

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Synchronize governed asset revisions
        run: |
          set -euo pipefail
          node --check js/glossary.js
          node --check scripts/reader-linear-text-projection-browser-test.mjs
          node --check scripts/atlas-focus-state-browser-test.mjs
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          git diff --check
          printf '%s\n' \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-generated.txt
          git diff --name-only | sort > /tmp/generated-files.txt
          while read -r file; do
            test -z "$file" || grep -Fx "$file" /tmp/allowed-generated.txt >/dev/null || { echo "Unexpected generated file: $file" >&2; exit 1; }
          done < /tmp/generated-files.txt

      - name: Permanent source and control-plane gates
        run: |
          git diff --check
          node scripts/check-workflows.js
          node scripts/node-toolchain-pin-contract-test.mjs
          npm run validate:static-publication

      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit

      - name: Production-like build and Pagefind
        run: |
          npm run strangler:build:production-like
          node scripts/project-reader-linear-text-to-dist.mjs --root dist --dry-run
          npm run pagefind:build:dist

      - name: Chromium and WebKit frozen-root proofs
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/reader-linear-text-projection-browser-test.mjs
          node scripts/atlas-focus-state-browser-test.mjs

      - name: Materialize deterministic generated refs after full PASS
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: terminal/frozen-final-20260810
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'Final terminal head is deterministic; no writer commit required.'
            exit 0
          fi
          printf '%s\n' \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-final.txt
          git diff --name-only | sort > /tmp/final-files.txt
          while read -r file; do
            test -z "$file" || grep -Fx "$file" /tmp/allowed-final.txt >/dev/null || { echo "Unexpected writer file: $file" >&2; exit 1; }
          done < /tmp/final-files.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(terminal): materialize final governed asset refs'
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
          test "$(git rev-parse refs/remotes/origin/$BRANCH)" = "$EXPECTED_SHA"
          git push --force-with-lease="refs/heads/$BRANCH:$EXPECTED_SHA" origin HEAD:"refs/heads/$BRANCH"
