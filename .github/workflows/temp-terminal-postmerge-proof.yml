name: TEMP Terminal Post-Merge Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-terminal-postmerge-proof.yml'

permissions:
  contents: write

concurrency:
  group: temp-terminal-postmerge-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact terminal trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prove frozen scope
        env:
          MERGED_ROOT_SHA: 63dc417d3b5f385544eeea381684182ed95f9c7d
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          printf '%s\n' \
            .github/workflows/temp-terminal-postmerge-proof.yml \
            js/glossary.js \
            scripts/reader-linear-text-projection-browser-test.mjs \
            | sort > /tmp/allowed-frozen.txt
          git diff --name-only "$MERGED_ROOT_SHA"..HEAD | sort > /tmp/actual-frozen.txt
          diff -u /tmp/allowed-frozen.txt /tmp/actual-frozen.txt
          git diff --check "$MERGED_ROOT_SHA"..HEAD

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Calibrate Atlas witness to responsive controls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/atlas-focus-state-browser-test.mjs';
          const lines = fs.readFileSync(file, 'utf8').split('\n');
          const start = lines.findIndex((line) => line.includes("await page.locator('[data-atlas-view=\"list\"]')") && line.includes('.click()'));
          const end = lines.findIndex((line, index) => index >= start && line.includes('result.steps.listToGraph = await assertSafeFocus'));
          if (start < 0 || end < start) throw new Error('Atlas List→Graph block not found');
          const indent = (lines[start].match(/^\s*/) || [''])[0];
          const original = lines.slice(start, end + 1).map((line) => `${indent}  ${line.trimStart()}`);
          const replacement = [
            `${indent}const listSwitch = page.locator('[data-atlas-view="list"]');`,
            `${indent}if (await listSwitch.isVisible()) {`,
            ...original,
            `${indent}} else {`,
            `${indent}  const geometry = await listSwitch.evaluate((button) => button.getClientRects().length);`,
            `${indent}  assert.equal(geometry, 0, browserName + '/' + width + ': hidden view switch unexpectedly has geometry');`,
            `${indent}  result.steps.listToGraph = { skipped: true, reason: 'responsive view switch is not rendered at this width' };`,
            `${indent}}`,
          ];
          lines.splice(start, end - start + 1, ...replacement);
          fs.writeFileSync(file, lines.join('\n'));
          NODE
          node --check scripts/atlas-focus-state-browser-test.mjs

      - name: Synchronize governed asset revisions
        run: |
          set -euo pipefail
          node --check js/glossary.js
          node --check scripts/reader-linear-text-projection-browser-test.mjs
          node scripts/cache-bust.js --write
          printf '%s\n' \
            scripts/atlas-focus-state-browser-test.mjs \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-generated.txt
          git diff --name-only | sort > /tmp/actual-generated.txt
          diff -u /tmp/allowed-generated.txt /tmp/actual-generated.txt
          node scripts/cache-bust.js
          git diff --check

      - name: Remove verifier from final-tree checks
        run: git rm .github/workflows/temp-terminal-postmerge-proof.yml

      - name: Permanent source and control-plane gates
        run: |
          git diff --check
          node scripts/check-workflows.js
          node scripts/node-toolchain-pin-contract-test.mjs
          npm run validate:static-publication

      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit

      - name: Production-like build and Pagefind
        run: |
          npm run strangler:build:production-like
          node scripts/project-reader-linear-text-to-dist.mjs --root dist --dry-run
          npm run pagefind:build:dist

      - name: Chromium and WebKit frozen-root proofs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/reader-linear-text-projection-browser-test.mjs
          node scripts/atlas-focus-state-browser-test.mjs

      - name: Commit exact final tree after full PASS
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            .github/workflows/temp-terminal-postmerge-proof.yml \
            scripts/atlas-focus-state-browser-test.mjs \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-final.txt
          git diff --name-only | sort > /tmp/actual-final.txt
          diff -u /tmp/allowed-final.txt /tmp/actual-final.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(terminal): final V07 V12 proof passed'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$TRIGGER_SHA"
          git push --force-with-lease="refs/heads/main:$TRIGGER_SHA" origin HEAD:refs/heads/main
