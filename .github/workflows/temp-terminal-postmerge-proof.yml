name: TEMP Terminal Post-Merge Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-terminal-postmerge-proof.yml'

permissions:
  contents: write

concurrency:
  group: temp-terminal-postmerge-proof
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact terminal trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Prove frozen scope before generated sync
        env:
          MERGED_ROOT_SHA: 63dc417d3b5f385544eeea381684182ed95f9c7d
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          printf '%s\n' \
            .github/workflows/temp-terminal-postmerge-proof.yml \
            js/glossary.js \
            scripts/reader-linear-text-projection-browser-test.mjs \
            | sort > /tmp/allowed-frozen.txt
          git diff --name-only "$MERGED_ROOT_SHA"..HEAD | sort > /tmp/actual-frozen.txt
          diff -u /tmp/allowed-frozen.txt /tmp/actual-frozen.txt
          git diff --check "$MERGED_ROOT_SHA"..HEAD

      - name: Setup Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Calibrate Atlas witness to rendered responsive controls
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'scripts/atlas-focus-state-browser-test.mjs';
          const source = fs.readFileSync(file, 'utf8');
          const before = `    await page.locator('[data-atlas-view="list"]').click();
              await page.waitForFunction(() => !document.getElementById('atlasListView')?.hidden);
              const listFocus = page.locator('[data-list-focus]:visible').first();
              await listFocus.focus();
              await listFocus.click();
              await page.waitForFunction(() => !document.getElementById('atlasGraphView')?.hidden);
              result.steps.listToGraph = await assertSafeFocus(page, \`${'${browserName}'}/${'${width}'}/list-to-graph\`, (state) => String(state.className).includes('atlas-node'));
          `;
          const after = `    const listSwitch = page.locator('[data-atlas-view="list"]');
              if (await listSwitch.isVisible()) {
                await listSwitch.click();
                await page.waitForFunction(() => !document.getElementById('atlasListView')?.hidden);
                const listFocus = page.locator('[data-list-focus]:visible').first();
                await listFocus.focus();
                await listFocus.click();
                await page.waitForFunction(() => !document.getElementById('atlasGraphView')?.hidden);
                result.steps.listToGraph = await assertSafeFocus(page, \`${'${browserName}'}/${'${width}'}/list-to-graph\`, (state) => String(state.className).includes('atlas-node'));
              } else {
                const geometry = await listSwitch.evaluate((button) => button.getClientRects().length);
                assert.equal(geometry, 0, \`${'${browserName}'}/${'${width}'}: hidden view switch unexpectedly has geometry\`);
                result.steps.listToGraph = { skipped: true, reason: 'responsive view switch is not rendered at this width' };
              }
          `;
          if (!source.includes(before)) throw new Error('Atlas List→Graph witness block not found exactly once');
          const next = source.replace(before, after);
          if (next === source || next.includes(before)) throw new Error('Atlas witness replacement failed');
          fs.writeFileSync(file, next);
          NODE
          node --check scripts/atlas-focus-state-browser-test.mjs

      - name: Synchronize only governed asset revisions
        run: |
          set -euo pipefail
          node --check js/glossary.js
          node --check scripts/reader-linear-text-projection-browser-test.mjs
          node scripts/cache-bust.js --write
          printf '%s\n' \
            scripts/atlas-focus-state-browser-test.mjs \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-generated.txt
          git diff --name-only | sort > /tmp/actual-generated.txt
          diff -u /tmp/allowed-generated.txt /tmp/actual-generated.txt
          node scripts/cache-bust.js
          git diff --check

      - name: Remove verifier from final-tree validation surface
        run: |
          git rm .github/workflows/temp-terminal-postmerge-proof.yml
          git diff --check

      - name: Permanent source and control-plane gates
        run: |
          node scripts/check-workflows.js
          node scripts/node-toolchain-pin-contract-test.mjs
          npm run validate:static-publication

      - name: Install Chromium and WebKit
        run: timeout 12m npx playwright install --with-deps chromium webkit

      - name: Production-like build
        run: npm run strangler:build:production-like

      - name: Reader projection idempotence and Pagefind
        run: |
          node scripts/project-reader-linear-text-to-dist.mjs --root dist --dry-run
          npm run pagefind:build:dist

      - name: Chromium and WebKit frozen-root proofs
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node scripts/reader-linear-text-projection-browser-test.mjs
          node scripts/atlas-focus-state-browser-test.mjs

      - name: Commit final tree only after full PASS
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            .github/workflows/temp-terminal-postmerge-proof.yml \
            scripts/atlas-focus-state-browser-test.mjs \
            src/lib/asset-version.js \
            src/components/article-pilots/_shared/StandaloneArticleFooter.astro \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBody.astro \
            src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro \
            src/components/nagornaya/_shared/NagornayaPageFooterRuntime.astro \
            src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro \
            src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro \
            | sort > /tmp/allowed-final-worktree.txt
          git diff --name-only | sort > /tmp/actual-final-worktree.txt
          diff -u /tmp/allowed-final-worktree.txt /tmp/actual-final-worktree.txt
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(terminal): final V07 V12 proof passed'
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse refs/remotes/origin/main)" = "$TRIGGER_SHA"
          git push --force-with-lease="refs/heads/main:$TRIGGER_SHA" origin HEAD:refs/heads/main
