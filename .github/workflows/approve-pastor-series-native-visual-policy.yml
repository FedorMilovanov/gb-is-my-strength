name: Approve pastor-series native visual policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/approve-pastor-series-native-visual-policy.yml'
      - 'data/visual-parity-baseline.json'
      - 'scripts/pastor-series-native-visual-policy-normalizer.js'
      - 'scripts/pastor-series-visual-parity-audit.js'
      - 'scripts/diotrophes-wave12-browser-contract.mjs'
      - 'scripts/public-surface-browser-matrix.mjs'

permissions:
  contents: read

concurrency:
  group: approve-pastor-series-native-visual-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check visual policy writer syntax
        run: node --check scripts/pastor-series-native-visual-policy-normalizer.js

      - name: Apply exact owner-approved route policy
        run: node scripts/pastor-series-native-visual-policy-normalizer.js --write

      - name: Validate native visual policy and guard paths
        run: |
          node scripts/pastor-series-native-visual-policy-normalizer.js --check
          git diff --check

      - name: Commit policy transaction
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git diff --name-only -- . \
            ':(exclude)data/visual-parity-baseline.json' > /tmp/unexpected-policy-paths
          if [[ -s /tmp/unexpected-policy-paths ]]; then
            echo 'Unexpected policy paths:' >&2
            cat /tmp/unexpected-policy-paths >&2
            exit 1
          fi
          if git diff --quiet -- data/visual-parity-baseline.json; then
            echo 'Pastor-series visual policy already approved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/visual-parity-baseline.json
          git commit -m 'fix(visual): approve pastor-series native contract'
          git push origin "HEAD:${HEAD_REF}"
