name: Approve pastor-series native visual policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/approve-pastor-series-native-visual-policy.yml'

permissions:
  contents: write

concurrency:
  group: approve-pastor-series-native-visual-policy
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout complete main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply exact owner-approved route policy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/visual-parity-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (baseline.tolerancePct !== 0.5) throw new Error('global visual tolerance drift');
          baseline.updatedAt = '2026-08-02';
          baseline.routeModes = baseline.routeModes || {};
          baseline.routeModes['/pastor-series/'] = {
            mode: 'native-contract',
            reason: 'The strict-native pastor-series landing now publishes two current parts, current 102-minute series metadata and the Wave 12 authority; the root legacy landing remains historical evidence of the superseded one-part plan and is no longer the approved render owner.',
            requiredGuards: [
              'scripts/pastor-series-visual-parity-audit.js',
              'scripts/diotrophes-wave12-browser-contract.mjs',
              'scripts/public-surface-browser-matrix.mjs'
            ],
            reviewedAt: '2026-08-02',
            reviewedSourceSha: 'fcfd20c54d276b2f8ed848b942e4ff43d27d051b'
          };
          fs.writeFileSync(path, JSON.stringify(baseline, null, 2) + '\n');
          NODE

      - name: Validate native visual policy and guard paths
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const baseline = JSON.parse(fs.readFileSync('data/visual-parity-baseline.json', 'utf8'));
          const policy = baseline.routeModes?.['/pastor-series/'];
          if (baseline.tolerancePct !== 0.5) throw new Error('global tolerance was changed');
          if (policy?.mode !== 'native-contract') throw new Error('pastor-series is not native-contract');
          if (!Array.isArray(policy.requiredGuards) || policy.requiredGuards.length !== 3) throw new Error('exactly three guards required');
          for (const guard of policy.requiredGuards) {
            if (!fs.existsSync(guard) || !fs.statSync(guard).isFile()) throw new Error(`missing guard: ${guard}`);
          }
          if (policy.reviewedSourceSha !== 'fcfd20c54d276b2f8ed848b942e4ff43d27d051b') throw new Error('reviewed source drift');
          console.log('pastor-series native visual policy validated');
          NODE
          git diff --check

      - name: Commit policy transaction
        shell: bash
        run: |
          git diff --name-only -- . \
            ':(exclude)data/visual-parity-baseline.json' > /tmp/unexpected-policy-paths
          if [[ -s /tmp/unexpected-policy-paths ]]; then
            echo 'Unexpected policy paths:' >&2
            cat /tmp/unexpected-policy-paths >&2
            exit 1
          fi
          if git diff --quiet -- data/visual-parity-baseline.json; then
            echo 'Pastor-series visual policy already approved.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/visual-parity-baseline.json
          git commit -m 'fix(visual): approve pastor-series native contract'
          git push origin HEAD:main
