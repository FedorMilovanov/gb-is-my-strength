name: Editorial Dateline Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/editorial-dateline-contract.yml'
      - 'css/site.css'
      - 'js/reader-preferences-head.js'
      - 'scripts/editorial-dateline-*.js'
      - 'scripts/editorial-dateline-*.mjs'
      - 'src/components/**'
      - 'src/lib/asset-version.js'
      - 'articles/**'
      - 'baptisty-rossii/**'
      - 'nagornaya/**'
      - 'karty/**'
      - 'about/**'
      - 'biografii/**'
      - 'hard-texts/**'
      - 'pastor-series/**'
      - '*.html'
  push:
    branches: [main]
    paths:
      - '.github/workflows/editorial-dateline-contract.yml'
      - 'css/site.css'
      - 'js/reader-preferences-head.js'
      - 'scripts/editorial-dateline-*.js'
      - 'scripts/editorial-dateline-*.mjs'
      - 'src/components/**'
      - 'src/lib/asset-version.js'
      - 'articles/**'
      - 'baptisty-rossii/**'
      - 'nagornaya/**'
      - 'karty/**'
      - 'about/**'
      - 'biografii/**'
      - 'hard-texts/**'
      - 'pastor-series/**'
      - '*.html'

permissions:
  contents: read

concurrency:
  group: editorial-dateline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Semantic and architecture contract
        run: |
          node scripts/editorial-dateline-contract-test.js
          node --check scripts/editorial-dateline-contract-test.js
          node --check scripts/editorial-dateline-visual-test.mjs
          node --check js/reader-preferences-head.js
          git diff --check

      - name: Verify cache revisions remain read-only clean
        run: node scripts/cache-bust.js

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop, mobile, dark and print contract
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory dist > /tmp/editorial-dateline-server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/articles/dzhon-gill-chast-1-chelovek/ >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/articles/dzhon-gill-chast-1-chelovek/ >/dev/null
          DATELINE_BASE_URL=http://127.0.0.1:4173 node scripts/editorial-dateline-visual-test.mjs

      - name: Install PDF audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-pil

      - name: Raster-audit every dateline PDF
        run: |
          python3 scripts/print-pagination-raster-audit.py \
            reports/editorial-dateline \
            --out reports/editorial-dateline/raster-audit

      - name: Lint workflow
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/editorial-dateline-contract.yml

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-dateline-${{ github.run_id }}
          path: reports/editorial-dateline
          if-no-files-found: warn
          retention-days: 14
