name: Temporary TTS Lazy Cache Policy Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_temp-materialize-tts-lazy-cache-policy.mjs'
      - '.github/workflows/_temp-materialize-tts-lazy-cache-policy.yml'
      - 'scripts/cache-bust-assets.js'
      - 'scripts/audit-pro.js'
      - 'scripts/tts-engine-status-contract-test.js'

permissions:
  contents: write

concurrency:
  group: temp-tts-lazy-cache-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact product lane
        uses: actions/checkout@v4
        with:
          ref: fix/tts-mobile-notice-viewport-2026-07-25
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Materialize canonical lazy-cache policy
        run: |
          mkdir -p reports/tts-lazy-cache-policy
          set -o pipefail
          node scripts/_temp-materialize-tts-lazy-cache-policy.mjs 2>&1 | tee reports/tts-lazy-cache-policy/materializer.log

      - name: Re-run registry and workflow contracts
        run: |
          set -o pipefail
          {
            npm run surface:registry:check
            npm run surface:registry:test
            node scripts/tts-engine-status-contract-test.js
            node scripts/cache-bust.js
            node scripts/audit-pro.js
            node scripts/run-actionlint.mjs -no-color .github/workflows/tts-download-consent.yml .github/workflows/_temp-materialize-tts-lazy-cache-policy.yml
          } 2>&1 | tee reports/tts-lazy-cache-policy/contracts.log

      - name: Publish product patch without temporary infrastructure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/cache-bust-assets.js scripts/audit-pro.js scripts/tts-engine-status-contract-test.js
          git diff --cached --quiet && { echo 'No product changes staged'; exit 1; }
          git commit -m "fix(cache): model lazy versioned assets explicitly"
          git push origin HEAD:fix/tts-mobile-notice-viewport-2026-07-25

      - name: Upload lazy-cache diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-lazy-cache-policy-${{ github.run_id }}
          path: reports/tts-lazy-cache-policy
          if-no-files-found: warn
          retention-days: 7
