name: TEMP Rebase Current Main

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/temp-rebase-current-main.yml'

permissions:
  contents: read

concurrency:
  group: temp-rebase-current-main-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebase:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Rebase exactly onto current main and self-delete
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          rm .github/workflows/temp-rebase-current-main.yml
          git add .github/workflows/temp-rebase-current-main.yml
          git commit -m "chore(atlas): remove temporary rebase workflow"
          git diff --check origin/main...HEAD
          CHANGED="$(git diff --name-only origin/main...HEAD | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/atlas-focus-state.yml' 'scripts/atlas-focus-state-browser-test.mjs' 'src/runtime/atlas-runtime.js' | sort)"
          test "${CHANGED}" = "${EXPECTED}"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${REMOTE_HEAD}" = "${EXPECTED_HEAD}"
          git push --force-with-lease="refs/heads/${BRANCH}:${EXPECTED_HEAD}" origin "HEAD:${BRANCH}"
