name: Temporary Antisovetov Wave 8 Polish

on:
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  group: antisovetov-wave8-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  polish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'antisovetov-wave8-polish') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Apply Russian terminology polish
        run: node scripts/_temp-antisovetov-wave8-polish.mjs

      - name: Validate one-file boundary
        run: |
          node scripts/antisovetov-wave8-contract.mjs
          test "$(git diff --name-only)" = "src/components/article-pilots/antisovetov/AntisovetovBody.astro"
          git diff --check

      - name: Commit only authored source
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/article-pilots/antisovetov/AntisovetovBody.astro
          git commit -m "fix(content): polish Antisovetov safeguarding terminology"
          git push origin "HEAD:${HEAD_REF}"
