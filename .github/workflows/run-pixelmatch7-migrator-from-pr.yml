name: Run Pixelmatch 7 migrator from helper PR

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/run-pixelmatch7-migrator-from-pr.yml
      - scripts/ci/apply-pixelmatch7-target.mjs

permissions:
  contents: write

concurrency:
  group: run-pixelmatch7-migrator-from-pr
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'agent/pixelmatch7-bootstrap-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: dependabot/npm_and_yarn/pixelmatch-7.2.0
      EXPECTED_TARGET_HEAD: ca31f7104be1a5b319ed2cdd6371d522a0fcbfe9

    steps:
      - name: Checkout trusted helper source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Stage helper outside the target checkout
        run: cp scripts/ci/apply-pixelmatch7-target.mjs /tmp/apply-pixelmatch7-target.mjs

      - name: Checkout exact Pixelmatch target branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reject target branch drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Set up repository Node toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install exact lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Write ESM adaptation and alpha-semantics guard
        run: node /tmp/apply-pixelmatch7-target.mjs

      - name: Verify migration contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/visual-parity-screenshots.js
          npm run visual:pixelmatch:contract

      - name: Commit and push only to visual lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/visual-parity-screenshots.js scripts/pixelmatch7-contract.mjs docs/dependency-migrations/PIXELMATCH_7.md
          git diff --cached --check
          git commit -m "build(visual): adapt screenshot diff to Pixelmatch 7"
          git push origin HEAD:"$TARGET_BRANCH"
