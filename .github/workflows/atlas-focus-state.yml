# Temporary CAS patcher for the existing #1569 Atlas lane. It restores this
# permanent workflow from main before committing, so final PR scope remains
# runtime + permanent witness only.
name: Atlas Focus State Contract

on:
  pull_request:
    paths:
      - 'src/runtime/atlas-runtime.js'
      - 'scripts/atlas-focus-state-browser-test.mjs'
      - '.github/workflows/atlas-focus-state.yml'

permissions:
  contents: write

concurrency:
  group: atlas-focus-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-repair:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply bounded runtime and witness repair
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python - <<'PY'
          from pathlib import Path
          import re

          runtime = Path('src/runtime/atlas-runtime.js')
          s = runtime.read_text()
          pattern = re.compile(r"    function syncDrawerForViewport\(\) \{\n\s+var activeWasSidebar = sidebar\.contains\(document\.activeElement\);\n\s+syncSidebarSurface\(false, \{ restoreFocus: activeWasSidebar \}\);\n\s+\}")
          replacement = (
              "    function syncDrawerForViewport() {\n"
              "      var activeWasSidebar = sidebar.contains(document.activeElement);\n"
              "      var enteringDrawer = drawerMedia.matches;\n"
              "      syncSidebarSurface(false, { restoreFocus: activeWasSidebar });\n"
              "      if (activeWasSidebar && !enteringDrawer) {\n"
              "        var desktopSidebarTarget = sidebar.querySelector('[data-atlas-group],.atlas-relation-filter input,a[href],button:not(#atlasFilterClose)');\n"
              "        if (!safeFocus(desktopSidebarTarget)) focusActiveView(activeFocus);\n"
              "      }\n"
              "    }"
          )
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'runtime breakpoint structural target count={count}; expected 1')
          runtime.write_text(s)

          test = Path('scripts/atlas-focus-state-browser-test.mjs')
          t = test.read_text()
          anchor = "    const historyNode = page.locator('.atlas-node:not(.is-filtered-out)[tabindex=\"0\"]').first();\n"
          insertion = (
              "    if (width === 980) {\n"
              "      const trigger = page.locator('#atlasFilterTrigger');\n"
              "      await trigger.click();\n"
              "      await page.waitForFunction(() => document.getElementById('atlasSidebar')?.classList.contains('is-open'));\n"
              "      await page.locator('#atlasFilterClose').focus();\n"
              "      await page.setViewportSize({ width: 981, height: HEIGHT });\n"
              "      await page.waitForTimeout(180);\n"
              "      result.steps.openDrawerToDesktop = await assertSafeFocus(page, `${browserName}/${width}/open-drawer-to-desktop`, (state) =>\n"
              "        String(state.className).includes('atlas-theme'));\n"
              "      result.steps.openDrawerToDesktopSurfaces = await assertClosedSurfaceState(page, false);\n"
              "      await page.setViewportSize({ width: 980, height: HEIGHT });\n"
              "      await page.waitForTimeout(180);\n"
              "      result.steps.desktopSidebarToDrawer = await assertSafeFocus(page, `${browserName}/${width}/desktop-sidebar-to-drawer`, (state) =>\n"
              "        state.id === 'atlasFilterTrigger');\n"
              "      result.steps.desktopSidebarToDrawerSurfaces = await assertClosedSurfaceState(page, true);\n"
              "    }\n\n"
              + anchor
          )
          if t.count(anchor) != 1:
              raise SystemExit(f'witness breakpoint anchor count={t.count(anchor)}; expected 1')
          test.write_text(t.replace(anchor, insertion))
          PY
          git diff --check
          git diff -- src/runtime/atlas-runtime.js scripts/atlas-focus-state-browser-test.mjs
      - name: Restore permanent workflow and publish two-file repair
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main' "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_SHA"
          git checkout refs/remotes/origin/main -- .github/workflows/atlas-focus-state.yml
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = '.github/workflows/atlas-focus-state.yml scripts/atlas-focus-state-browser-test.mjs src/runtime/atlas-runtime.js '
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/atlas-focus-state.yml scripts/atlas-focus-state-browser-test.mjs src/runtime/atlas-runtime.js
          git commit -m 'fix(atlas): preserve focus across drawer breakpoint'
          git push --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_SHA" origin HEAD:refs/heads/$HEAD_REF
