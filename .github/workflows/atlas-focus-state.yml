name: TEMP Frozen Cache Revision Base Writer

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/atlas-focus-state.yml'
      - 'src/runtime/atlas-runtime.js'
      - 'scripts/atlas-focus-state-browser-test.mjs'
      - 'src/lib/asset-version.js'
      - 'src/components/article-pilots/**'
      - 'src/components/baptisty-rossii/**'
      - 'src/components/nagornaya/**'

permissions:
  contents: write

concurrency:
  group: temp-frozen-cache-writer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  write:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'terminal/frozen-final-20260810'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Prove exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Materialize canonical generated revisions
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          git show 8757bec60730c714d1b96dcf0a3bc7741c937212:.github/workflows/atlas-focus-state.yml > .github/workflows/atlas-focus-state.yml
          git diff --check
      - name: Publish generated refs and restore permanent workflow
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(cache): materialize frozen glossary revisions'
          git fetch --no-tags origin "+refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          test "$(git rev-parse refs/remotes/origin/$HEAD_REF)" = "$EXPECTED_SHA"
          git push --force-with-lease="refs/heads/$HEAD_REF:$EXPECTED_SHA" origin HEAD:"refs/heads/$HEAD_REF"
