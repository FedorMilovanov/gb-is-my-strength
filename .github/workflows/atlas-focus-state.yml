# Permanent browser proof for V07-ATLAS-FOCUS-STATE.
name: Atlas Focus State Contract

on:
  pull_request:
    paths:
      - 'src/runtime/atlas-runtime.js'
      - 'src/components/map/**'
      - 'scripts/atlas-focus-state-browser-test.mjs'
      - '.github/workflows/atlas-focus-state.yml'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - 'src/runtime/atlas-runtime.js'
      - 'src/components/map/**'
      - 'scripts/atlas-focus-state-browser-test.mjs'
      - '.github/workflows/atlas-focus-state.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-focus-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Chromium WebKit Atlas focus lifecycle
    # Version-matched upstream image avoids Ubuntu 26.04 apt mirror stalls.
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    timeout-minutes: 35
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Trust only this checkout in the pinned browser container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
      - name: Prove commit identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm ci
      - name: Verify exact Playwright and preinstalled Chromium/WebKit
        run: |
          node -e "const fs=require('node:fs');const pw=require('playwright');const v=require('playwright/package.json').version;if(v!=='1.62.1')throw Error('Playwright version mismatch: '+v);for(const [name,b] of [['chromium',pw.chromium],['webkit',pw.webkit]]){const p=b.executablePath();if(!fs.existsSync(p))throw Error('Missing preinstalled '+name+' browser: '+p);console.log('Verified '+name+' '+p)}"
      - name: Build production-like dist
        run: npm run strangler:build:production-like
      - name: Run Atlas focus-state contract
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/atlas-focus-state-browser-test.mjs
      - name: Upload Atlas focus evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: atlas-focus-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/atlas-focus-state
          if-no-files-found: error
          retention-days: 14
