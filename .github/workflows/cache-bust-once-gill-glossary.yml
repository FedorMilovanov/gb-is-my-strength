name: One-shot glossary asset revisions

on:
  push:
    branches:
      - feat/universal-glossary-final-v2-2026-07-24

permissions:
  contents: write

concurrency:
  group: one-shot-glossary-asset-revisions
  cancel-in-progress: true

jobs:
  rewrite-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-glossary-final-v2-2026-07-24
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate deterministic asset revisions
        run: node scripts/cache-bust.js --write
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/cache-bust-once-gill-glossary.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(assets): refresh glossary content revisions'
          git push origin HEAD:feat/universal-glossary-final-v2-2026-07-24
