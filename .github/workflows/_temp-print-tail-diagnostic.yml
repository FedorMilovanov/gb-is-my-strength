name: TEMP Print Tail Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Materialize current candidate in working tree
        run: |
          node scripts/_temp-print-paper-comment-fix.mjs
          node scripts/_temp-print-paper-contract.mjs
          node scripts/_temp-print-paper-followup.mjs
          node scripts/_temp-print-overflow-contract.mjs
          node scripts/cache-bust.js --write
      - run: npm run strangler:build:production-like
      - run: npx playwright install --with-deps chromium
      - name: Inspect final print-layout tail
        run: node scripts/_temp-print-tail-diagnostic.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: print-tail-diagnostic-${{ github.sha }}
          path: reports/print-tail
          if-no-files-found: error
          retention-days: 7
