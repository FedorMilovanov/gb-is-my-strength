name: Apply Actions control-plane migration

on:
  push:
    branches:
      - agent/astro7-bootstrap-20260731
    paths:
      - .github/workflows/apply-astro7-migration.yml

permissions:
  contents: write

concurrency:
  group: apply-actions-control-plane-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: agent/github-actions-vnext-validation-20260731
      EXPECTED_TARGET_HEAD: 5b1562a55de7c481c7675a5d4b02f9f589a824b6

    steps:
      - name: Checkout exact Actions target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reject target branch drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Set up exact release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Migrate immutable identities in policy and contracts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const mappings = [
            ['actions/checkout', '11d5960a326750d5838078e36cf38b85af677262', '3d3c42e5aac5ba805825da76410c181273ba90b1', '7.0.1'],
            ['actions/setup-node', '49933ea5288caeca8642d1e84afbd3f7d6820020', '820762786026740c76f36085b0efc47a31fe5020', '7.0.0'],
            ['actions/upload-artifact', 'ea165f8d65b6e75b540449e92b4886f43607fa02', '043fb46d1a93c77aae656e7c1c64a875d1fc6a0a', '7.0.1'],
            ['actions/download-artifact', 'd3f86a106a0bac45b974a628896c90dbdf5c8093', '3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c', '8.0.1'],
            ['actions/upload-pages-artifact', '56afc609e74202658d3ffba0e8f6dda462b719fa', 'fc324d3547104276b827a68afc52ff2a11cc49c9', '5.0.0'],
            ['actions/deploy-pages', 'd6db90164ac5ed86f2b6aed7e0febac5b3c0c03e', 'cd2ce8fcbc39b97be8ca5fce6e763baed58fa128', '5.0.0'],
            ['actions/github-script', 'f28e40c7f34bde8b3046d885e986cb6290c5673b', '3a2844b7e9c422d3c10d287c895573f7108da1b3', '9.0.0'],
          ];
          const roots = ['scripts', 'docs', '.github/workflows'];
          const extensions = new Set(['.js', '.cjs', '.mjs', '.md', '.yml', '.yaml', '.json']);
          const changed = [];
          const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          function migrateFile(file) {
            let source = fs.readFileSync(file, 'utf8');
            const original = source;
            for (const [action, oldSha, newSha, version] of mappings) {
              source = source.replace(
                new RegExp(`${escapeRegExp(action)}@${oldSha}(?:\\s+#\\s+v[^\\s'\"]+)?`, 'g'),
                `${action}@${newSha} # v${version}`,
              );
            }
            if (file === path.normalize('scripts/check-workflows.js')) {
              const oldDryRun = '/actions\\/upload-artifact@v4/';
              const newDryRun = '/actions\\/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a/';
              const occurrences = source.split(oldDryRun).length - 1;
              if (occurrences !== 1) throw new Error(`Expected one dist-dry-run v4 policy, found ${occurrences}`);
              source = source.replace(oldDryRun, newDryRun);
            }
            if (source !== original) {
              fs.writeFileSync(file, source);
              changed.push(file);
            }
          }
          function walk(directory) {
            if (!fs.existsSync(directory)) return;
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const absolute = path.join(directory, entry.name);
              if (entry.isDirectory()) walk(absolute);
              else if (extensions.has(path.extname(entry.name))) migrateFile(absolute);
            }
          }
          for (const root of roots) walk(root);
          for (const required of [
            path.normalize('scripts/check-workflows.js'),
            path.normalize('scripts/release-pipeline-contract-test.mjs'),
            path.normalize('scripts/source-link-audit-source-contract-test.cjs'),
          ]) {
            if (!changed.includes(required)) throw new Error(`Required policy file was not migrated: ${required}`);
          }
          fs.mkdirSync('docs/dependency-migrations', { recursive: true });
          fs.writeFileSync('docs/dependency-migrations/GITHUB_ACTIONS_VNEXT.md', `# GitHub Actions immutable major migration

The control plane now targets checkout 7.0.1, setup-node 7.0.0,
upload-artifact 7.0.1, download-artifact 8.0.1, upload-pages-artifact
5.0.0, deploy-pages 5.0.0 and github-script 9.0.0 through immutable
40-character SHA pins.

Workflow policy, source-link, release, deployment and TTS witnesses are updated
as one transaction. Build-once ordering, exact candidate identity, provenance,
artifact immutability, Pages ordering, dist-dry-run and trusted-default-branch
execution remain fail closed.

The Gill print pagination witness remains a separate visual/print issue.
`);
          console.log(`Migrated ${changed.length} files.`);
          for (const file of changed.sort()) console.log(file);
          NODE

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove workflow, source-link, release and TTS contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-workflows.js
          node scripts/source-link-audit-contract-test.cjs
          node scripts/source-link-audit-source-contract-test.cjs
          node scripts/release-pipeline-contract-test.mjs
          node scripts/deployment-provenance-contract-test.mjs
          node scripts/tts-download-consent-contract-test.js
          node scripts/record-deployment-witness-contract-test.cjs
          node scripts/deployment-witness-ledger-source-contract-test.cjs

      - name: Lint release workflows
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-actionlint.mjs -no-color \
            .github/workflows/deploy.yml \
            .github/workflows/dist-dry-run.yml \
            .github/workflows/source-links.yml \
            .github/workflows/tts-download-consent.yml \
            .github/workflows/notify-on-failure.yml

      - name: Remove superseded target one-shot workflow
        run: git rm -f .github/workflows/fix-actions-control-plane.yml

      - name: Commit and push only to Actions validation lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts docs/dependency-migrations .github/workflows
          git diff --cached --check
          git commit -m "ci(actions): synchronize immutable pins and contracts"
          git push origin HEAD:"$TARGET_BRANCH"
