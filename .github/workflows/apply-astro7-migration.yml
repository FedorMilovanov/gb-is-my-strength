name: Apply Actions control-plane migration

on:
  push:
    branches:
      - agent/astro7-bootstrap-20260731
    paths:
      - .github/workflows/apply-astro7-migration.yml
      - scripts/ci/apply-actions-control-plane-target.mjs

permissions:
  contents: write

concurrency:
  group: apply-actions-control-plane-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: agent/github-actions-vnext-validation-20260731
      EXPECTED_TARGET_HEAD: 5b1562a55de7c481c7675a5d4b02f9f589a824b6

    steps:
      - name: Checkout trusted helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/astro7-bootstrap-20260731
          persist-credentials: false

      - name: Stage trusted migrator outside target checkout
        run: cp scripts/ci/apply-actions-control-plane-target.mjs /tmp/apply-actions-control-plane-target.mjs

      - name: Checkout exact Actions target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true

      - name: Reject target branch drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_TARGET_HEAD"

      - name: Set up exact release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply immutable identity migration
        run: node /tmp/apply-actions-control-plane-target.mjs

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove workflow, source-link, release and TTS contracts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-workflows.js
          node scripts/source-link-audit-contract-test.cjs
          node scripts/source-link-audit-source-contract-test.cjs
          node scripts/release-pipeline-contract-test.mjs
          node scripts/deployment-provenance-contract-test.mjs
          node scripts/tts-download-consent-contract-test.js
          node scripts/record-deployment-witness-contract-test.cjs
          node scripts/deployment-witness-ledger-source-contract-test.cjs

      - name: Lint release workflows
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-actionlint.mjs -no-color \
            .github/workflows/deploy.yml \
            .github/workflows/dist-dry-run.yml \
            .github/workflows/source-links.yml \
            .github/workflows/tts-download-consent.yml \
            .github/workflows/notify-on-failure.yml

      - name: Remove superseded target one-shot workflow
        run: git rm -f .github/workflows/fix-actions-control-plane.yml

      - name: Commit and push only to Actions validation lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts docs/dependency-migrations .github/workflows
          git diff --cached --check
          git commit -m "ci(actions): synchronize immutable pins and contracts"
          git push origin HEAD:"$TARGET_BRANCH"
