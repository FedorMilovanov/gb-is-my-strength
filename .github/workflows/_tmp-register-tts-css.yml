name: Temporary TTS CSS Registration

on:
  push:
    branches:
      - "agent/tts-download-cancel-notice"
    paths:
      - ".github/workflows/_tmp-register-tts-css.yml"
  pull_request:
    paths:
      - ".github/workflows/_tmp-register-tts-css.yml"
      - "scripts/_tmp-register-tts-css.js"

permissions:
  contents: write

concurrency:
  group: tmp-register-tts-css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/tts-download-cancel-notice
          fetch-depth: 0

      - name: Detect patch payload
        id: patch
        shell: bash
        run: |
          if test -f scripts/_tmp-register-tts-css.js; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Patch payload is already removed; no action is needed."
          fi

      - name: Set up Node 22.12
        if: steps.patch.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"

      - name: Apply audit-pro registration
        if: steps.patch.outputs.present == 'true'
        run: node scripts/_tmp-register-tts-css.js

      - name: Verify audit-pro syntax and baseline
        if: steps.patch.outputs.present == 'true'
        run: |
          node --check scripts/audit-pro.js
          node scripts/audit-pro.js
          git diff --check

      - name: Commit audit integration and remove patch payload
        if: steps.patch.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): register TTS notice stylesheet"
          git push origin HEAD:agent/tts-download-cancel-notice
