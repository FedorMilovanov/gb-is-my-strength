name: Reader R5 Commit

on:
  pull_request:
    types: [reopened, synchronize]
    branches: [main]

concurrency:
  group: reader-r5-commit-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  commit:
    if: github.head_ref == 'lane/reader-r5-overlay-runtime-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Materialize verified permanent files
        run: |
          set -euo pipefail
          python3 scripts/_temp-r5-finalize.py
          python3 scripts/_temp-r5-browser-fix.py
          python3 scripts/_temp-r5-browser-fixture.py

      - name: Commit clean non-workflow R5 transaction
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          # GitHub Actions tokens cannot safely publish workflow changes here.
          # Keep those two files on the verified branch version; the connector
          # applies their already-linted permanent contents after this commit.
          git restore -- .github/workflows/shared-files-guard.yml
          rm -f .github/workflows/overlay-runtime-browser.yml

          git rm -f --ignore-unmatch \
            docs/refactor-2026/reader-platform/reader-r5-overlay-runtime-inventory.json \
            scripts/_temp-r5-overlay-runtime.inc.js \
            scripts/_temp-r5-patch-floating-cluster.py \
            scripts/_temp-r5-patch-hermenevtika.py \
            scripts/_temp-r5-patch-lock.py \
            scripts/_temp-r5-patch-reader-settings.py \
            scripts/_temp-r5-patch-runtime-hardening.py \
            scripts/_temp-r5-patch-runtime.py \
            scripts/_temp-r5-patch-sitejs.py \
            scripts/_temp-r5-patch-test-cases.py \
            scripts/_temp-r5-patch-test-harness.py \
            scripts/_temp-reader-r5-inventory.js \
            scripts/_temp-r5-browser-fix.py \
            scripts/_temp-r5-browser-fixture.py \
            scripts/_temp-r5-finalize.py
          git add -A
          echo '--- staged files ---'
          git status --short
          forbidden="$(git diff --cached --diff-filter=ACMR --name-only | grep -E '(^|/)_temp-|reader-r5-overlay-runtime-inventory\.json$|^\.github/workflows/' || true)"
          test -z "$forbidden" || { echo "Forbidden staged files:"; echo "$forbidden"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(reader): lock unified overlay runtime contract"
          git push origin "HEAD:${HEAD_REF}"
