name: Teen Series Release

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "src/content/articles/podrostok-za-kadrom-*.mdx"
      - "src/content/articles/vzroslyy-rebenok-*.mdx"
      - "src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx"
      - "src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx"
      - "src/pages/podrostok-za-kadrom/**"
      - "src/pages/articles/podrostok-za-kadrom-*/**"
      - "src/pages/articles/vzroslyy-rebenok-*/**"
      - "src/pages/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya/**"
      - "src/pages/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti/**"
      - "src/components/article-pilots/teen-series/**"
      - "src/components/article-pilots/_shared/series/teenSeriesConfig.ts"
      - "public/images/teen-series/**"
      - "docs/TEEN-SERIES-*.md"
      - "data/series.json"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "migration/page-ownership.json"
      - "feed.xml"
      - "sitemap.xml"
      - "scripts/teen-series-release-contract.mjs"
      - ".github/workflows/teen-series-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teen-series-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripture-index-fast-forward:
    name: One-shot Scripture index fast-forward
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1950 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/teen-series-live-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Snapshot writer lease
        run: node scripts/writer-lease.mjs snapshot

      - name: Reject stale or foreign writer before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/writer-lease.mjs assert-live --phase=pre-mutation

      - name: Regenerate deterministic Scripture index
        run: |
          node scripts/build-scripture-occurrence-index.mjs --write
          node scripts/build-scripture-occurrence-index.mjs --check
          node scripts/scripture-occurrence-index-contract.mjs

      - name: Validate focused diff
        shell: bash
        run: |
          git diff --check
          git diff --name-only -- . ':(exclude)data/scripture-search-index.json' > /tmp/unexpected-teen-scripture-paths
          if [[ -s /tmp/unexpected-teen-scripture-paths ]]; then
            echo "Unexpected writer paths:" >&2
            cat /tmp/unexpected-teen-scripture-paths >&2
            exit 1
          fi

      - name: Commit and fast-forward exact branch
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/scripture-search-index.json; then
            echo "No Scripture occurrence normalization required."
            exit 0
          fi
          node scripts/writer-lease.mjs assert-live --phase=pre-commit
          LEASE_TRAILER="$(node scripts/writer-lease.mjs trailer)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scripture-search-index.json
          git commit -m "fix(scripture): regenerate post-tooltip occurrence index" -m "${LEASE_TRAILER}"
          node scripts/writer-lease.mjs assert-live --phase=pre-push
          git push origin "HEAD:refs/heads/${HEAD_REF}"

  publication-contract:
    name: Atomic teen publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Check static release contract
        run: node scripts/teen-series-release-contract.mjs

      - name: Validate route registry and source provenance
        run: npm run migration:metadata:check:strict

      - name: Build production-like candidate
        run: npm run strangler:build:production-like

      - name: Check rendered release contract
        run: node scripts/teen-series-release-contract.mjs

      - name: Verify canonical discovery projections
        run: |
          node scripts/search-manifest-policy-normalizer.js --dist=dist --promote-rss-articles
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Audit production publication
        run: |
          npm run page-ownership:dist:production-like
          node scripts/dist-publication-audit.js --require-pagefind --forbid-dev
          npm run dist:jsonld:audit
          npm run schema:rich-results:audit:dist
