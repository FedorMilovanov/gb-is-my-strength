name: Teen Series Release

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - "src/content/articles/podrostok-za-kadrom-*.mdx"
      - "src/content/articles/vzroslyy-rebenok-*.mdx"
      - "src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx"
      - "src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx"
      - "src/pages/podrostok-za-kadrom/**"
      - "src/pages/articles/podrostok-za-kadrom-*/**"
      - "src/pages/articles/vzroslyy-rebenok-*/**"
      - "src/pages/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya/**"
      - "src/pages/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti/**"
      - "src/components/article-pilots/teen-series/**"
      - "src/components/article-pilots/_shared/series/teenSeriesConfig.ts"
      - "public/images/teen-series/**"
      - "docs/TEEN-SERIES-*.md"
      - "data/series.json"
      - "data/route-profiles/**"
      - "data/route-search-policy.json"
      - "data/search-manifest.json"
      - "migration/page-ownership.json"
      - "feed.xml"
      - "sitemap.xml"
      - "scripts/teen-series-release-contract.mjs"
      - "scripts/teen-series-source-promotion.mjs"
      - ".github/workflows/teen-series-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teen-series-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader-surface-cleanup:
    name: One-shot reader-surface normalization
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1950 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/teen-series-live-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Normalize seven publication sources transactionally
        run: node scripts/teen-series-source-promotion.mjs --write

      - name: Prove bounded MDX delta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          if (( ${#changed[@]} == 0 )); then
            echo "Reader surfaces already canonical; no write required."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              src/content/articles/podrostok-za-kadrom-dvoynaya-zhizn.mdx|\
              src/content/articles/podrostok-za-kadrom-roditelyam-posle-razoblacheniya.mdx|\
              src/content/articles/podrostok-za-kadrom-chto-delat-tserkvi.mdx|\
              src/content/articles/vzroslyy-rebenok-ushel-kontakt-pokayanie-vozvrashchenie.mdx|\
              src/content/articles/vzroslyy-rebenok-doma-dengi-pomoshch-posledstviya.mdx|\
              src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx|\
              src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx) ;;
              *) echo "Unexpected writer delta: $file" >&2; exit 1 ;;
            esac
          done
          git diff --check
          node scripts/teen-series-source-promotion.mjs

      - name: Commit and ordinary fast-forward push
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          branch='release/teen-series-live-20260910'
          expected='${{ github.event.pull_request.head.sha }}'
          remote="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          if [[ "$remote" != "$expected" ]]; then
            echo "Race barrier failed: remote=$remote expected=$expected" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/content/articles/podrostok-za-kadrom-dvoynaya-zhizn.mdx \
            src/content/articles/podrostok-za-kadrom-roditelyam-posle-razoblacheniya.mdx \
            src/content/articles/podrostok-za-kadrom-chto-delat-tserkvi.mdx \
            src/content/articles/vzroslyy-rebenok-ushel-kontakt-pokayanie-vozvrashchenie.mdx \
            src/content/articles/vzroslyy-rebenok-doma-dengi-pomoshch-posledstviya.mdx \
            src/content/articles/sovershennoletie-roditelskaya-vlast-chto-menyaetsya.mdx \
            src/content/articles/vzroslaya-doch-otets-brak-soglasie-granitsy-vlasti.mdx
          git commit -m 'content(teen): normalize reader-facing publication language'
          git push origin "HEAD:refs/heads/$branch"

  publication-contract:
    name: Atomic teen publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Install immutable dependencies
        run: npm ci

      - name: Check static release contract
        run: node scripts/teen-series-release-contract.mjs

      - name: Validate route registry and source provenance
        run: npm run migration:metadata:check:strict

      - name: Build production-like candidate
        run: npm run strangler:build:production-like

      - name: Check rendered release contract
        run: node scripts/teen-series-release-contract.mjs

      - name: Verify canonical discovery projections
        run: |
          node scripts/search-manifest-policy-normalizer.js --dist=dist --promote-rss-articles
          node scripts/rss-feed-normalizer.js --check
          node scripts/sitemap-policy-normalizer.js --check
          node scripts/search-index-policy-inventory.js --dist=dist --strict

      - name: Build Pagefind index
        run: npm run pagefind:build:dist

      - name: Audit production publication
        run: |
          npm run page-ownership:dist:production-like
          node scripts/dist-publication-audit.js --require-pagefind --forbid-dev
          npm run dist:jsonld:audit
          npm run schema:rich-results:audit:dist
