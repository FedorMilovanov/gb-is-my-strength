name: Search continuation stale-race transaction once

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - 'scripts/search-continuation-race-applicator.mjs'
      - '.github/workflows/search-continuation-race-once.yml'

permissions:
  contents: write

jobs:
  apply-and-self-clean:
    if: github.event.pull_request.head.ref == 'fix/search-truthful-continuation-20260808-tx'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact transaction branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/search-truthful-continuation-20260808-tx
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Check applicator syntax
        run: node --check scripts/search-continuation-race-applicator.mjs

      - name: Apply exact stale-continuation race repair
        run: node scripts/search-continuation-race-applicator.mjs --write

      - name: Validate source and browser contract syntax
        run: |
          node --check js/search.js
          node --check scripts/search-modal-browser-contract.mjs

      - name: Project Search asset revision
        run: node scripts/cache-bust.js --write

      - name: Validate final race and cache contracts read-only
        run: |
          node scripts/search-continuation-race-applicator.mjs
          node scripts/cache-bust.js
          git diff --check

      - name: Self-clean transaction transport and push final tree
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          rm .github/workflows/search-continuation-race-once.yml
          rm scripts/search-continuation-race-applicator.mjs
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(search): clear stale continuation before Scripture load"
          git push origin "HEAD:${HEAD_REF}"
