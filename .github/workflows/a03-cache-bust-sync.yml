name: A03 one-shot cache-bust sync

on:
  push:
    branches:
      - agent/note-registry-20260801
    paths:
      - '.github/workflows/a03-cache-bust-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    if: github.ref == 'refs/heads/agent/note-registry-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/note-registry-20260801
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node 22.23.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.1'

      - name: Regenerate canonical asset revisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cache-bust.js --write
          git rm .github/workflows/a03-cache-bust-sync.yml

          cat > /tmp/expected-files.txt <<'EOF'
          .github/workflows/a03-cache-bust-sync.yml
          src/components/baptisty-rossii/BaptistyRossiiBody.astro
          src/components/baptisty-rossii/BaptistyRossiiBookLanding.astro
          src/components/biografii/BiografiiPageFooter.astro
          src/components/home/HomePageChrome.astro
          src/components/nagornaya/index/NagornayaIndexPageFooter.astro
          src/components/nagornaya/istochniki/NagornayaIstochnikiPageFooter.astro
          src/components/nagornaya/nakhodki/NagornayaNakhodkiPageFooter.astro
          src/components/nagornaya/seriya/NagornayaSeriyaBody.astro
          src/components/nagornaya/seriya/NagornayaSeriyaPageFooter.astro
          src/components/pastor-series/PastorSeriesPageChrome.astro
          src/components/rodosloviye/RodosloviyeBody.astro
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          git diff --name-only | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          grep -R --fixed-strings 'js/site.js?v=762dda14' src/components/baptisty-rossii src/components/biografii src/components/home src/components/nagornaya src/components/pastor-series src/components/rodosloviye >/dev/null
          node scripts/cache-bust.js

      - name: Commit exact regeneration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(assets): regenerate NoteRegistry site revisions'
          git push origin HEAD:agent/note-registry-20260801
