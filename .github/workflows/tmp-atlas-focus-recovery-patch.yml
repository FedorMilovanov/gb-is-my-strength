# Temporary helper. It is never part of the product PR.
name: Temporary Atlas focus recovery patch

on:
  push:
    branches:
      - agent/atlas-focus-recovery-helper-20260907

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/atlas-focus-recovery-helper-20260907
          persist-credentials: true
          fetch-depth: 0

      - name: Apply bounded Atlas focus recovery repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          runtime_path = Path('src/runtime/atlas-runtime.js')
          runtime = runtime_path.read_text()
          runtime_pattern = re.compile(
              r"var retryWithoutObserver = function \(\) \{\s*"
              r"frame = 0;\s*"
              r"attempt\(\);\s*"
              r"if \(!settled && !observer\) frame = window\.requestAnimationFrame\(retryWithoutObserver\);\s*"
              r"\};\s*"
              r"frame = window\.requestAnimationFrame\(retryWithoutObserver\);"
          )
          runtime_replacement = """var remainingObservedLayoutFrames = 2;
              var retryAfterLayout = function () {
                frame = 0;
                attempt();
                if (settled) return;
                if (!observer || remainingObservedLayoutFrames > 1) {
                  if (observer) remainingObservedLayoutFrames -= 1;
                  frame = window.requestAnimationFrame(retryAfterLayout);
                }
              };
              frame = window.requestAnimationFrame(retryAfterLayout);"""
          runtime, runtime_count = runtime_pattern.subn(runtime_replacement, runtime, count=1)
          if runtime_count != 1:
              raise SystemExit(f'expected one retryWithoutObserver semantic block, found {runtime_count}')
          runtime_path.write_text(runtime)

          test_path = Path('scripts/atlas-focus-state-browser-test.mjs')
          test = test_path.read_text()
          test_pattern = re.compile(
              r"await page\.locator\('#atlasFilterClose'\)\.focus\(\);\s*"
              r"await page\.setViewportSize\(\{ width: 981, height: HEIGHT \}\);"
          )
          test_replacement = """await page.locator('#atlasFilterClose').focus();
              await page.evaluate(() => {
                const target = document.querySelector('#atlasSidebar [data-atlas-group]');
                if (!(target instanceof HTMLElement)) throw new Error('desktop sidebar focus target missing');
                const nativeFocus = target.focus.bind(target);
                let attempts = 0;
                target.focus = function faultInjectedFocus(options) {
                  attempts += 1;
                  if (attempts >= 3) nativeFocus(options);
                };
              });
              await page.setViewportSize({ width: 981, height: HEIGHT });"""
          test, test_count = test_pattern.subn(test_replacement, test, count=1)
          if test_count != 1:
              raise SystemExit(f'expected one 980->981 focus witness block, found {test_count}')
          test_path.write_text(test)
          PY

      - name: Prove surgical source diff
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'scripts/atlas-focus-state-browser-test.mjs\nsrc/runtime/atlas-runtime.js'
          node --check src/runtime/atlas-runtime.js
          node --check scripts/atlas-focus-state-browser-test.mjs

      - name: Commit helper result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/runtime/atlas-runtime.js scripts/atlas-focus-state-browser-test.mjs
          git commit -m "fix(atlas): make breakpoint focus recovery deterministic"
          git push origin HEAD:agent/atlas-focus-recovery-helper-20260907
