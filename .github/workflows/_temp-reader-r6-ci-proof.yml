name: Temporary Reader R6 CI Proof

on:
  pull_request:
    paths:
      - ".github/workflows/_temp-reader-r6-ci-proof.yml"
      - "scripts/_temp_reader_r6_ci-proof.patch"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Detect payload
        id: payload
        shell: bash
        run: |
          if test -f scripts/_temp_reader_r6_ci-proof.patch; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify and apply exact patch
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '919c60a48f62472ff6b4fbb348ee6c04d8db51b604ad6620b7ab177605341ba1' \
            'scripts/_temp_reader_r6_ci-proof.patch' \
            | sha256sum -c -
          patch -p1 --batch --forward < scripts/_temp_reader_r6_ci-proof.patch
          rm scripts/_temp_reader_r6_ci-proof.patch
          node --check scripts/engine-sweep.mjs
          grep -F "['r6-page', '/about/', null]" scripts/engine-sweep.mjs
          grep -F "midpoint is shared by state, chrome and canonical storage" scripts/engine-sweep.mjs
          git diff --check

      - name: Commit permanent browser proof
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/engine-sweep.mjs scripts/_temp_reader_r6_ci-proof.patch
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] test(reader): cover ordinary page in R6 sweep"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
