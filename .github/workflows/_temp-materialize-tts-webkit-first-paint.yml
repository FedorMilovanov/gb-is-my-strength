name: TEMP Materialize TTS WebKit First Paint

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-materialize-tts-webkit-first-paint.yml'
      - 'scripts/_temp-materialize-tts-webkit-first-paint.mjs'
      - 'js/floating-cluster-controller.js'
      - 'js/vosk-tts-engine.js'
      - 'scripts/tts-engine-status-contract-test.js'
      - 'scripts/tts-engine-lifecycle-browser-test.js'
      - 'scripts/cache-bust.js'
      - 'scripts/cache-bust-assets.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temp-materialize-tts-webkit-first-paint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact product branch
        uses: actions/checkout@v4
        with:
          ref: fix/tts-webkit-first-paint-2026-07-25
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Materialize synchronous first paint and contracts
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/_temp-materialize-tts-webkit-first-paint.mjs 2>&1 \
            | tee reports/tts-webkit-first-paint-materializer.log

      - name: Run engine lifecycle including delayed RAF
        run: node scripts/tts-engine-lifecycle-browser-test.js

      - name: Build production-like routes
        run: npm run strangler:build:production-like

      - name: Run real-route status matrix
        run: node scripts/tts-status-route-browser-test.js

      - name: Run mobile notice viewport geometry
        run: node scripts/tts-mobile-notice-geometry-browser-test.js

      - name: Verify source contracts and cache revisions
        run: |
          node scripts/tts-engine-status-contract-test.js
          node scripts/cache-bust.js
          git diff --exit-code

      - name: Lint temporary workflow
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/_temp-materialize-tts-webkit-first-paint.yml

      - name: Publish permanent product changes only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          if git diff --cached --name-only | grep -E '(^|/)_temp-|^reports/'; then
            echo 'Temporary or report file entered the product commit' >&2
            exit 1
          fi
          git diff --cached --quiet && { echo 'No product changes staged' >&2; exit 1; }
          git commit -m "fix(tts): reveal first status without waiting for RAF"
          git push origin HEAD:fix/tts-webkit-first-paint-2026-07-25

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-webkit-first-paint-${{ github.run_id }}
          path: |
            reports/tts-webkit-first-paint-materializer.log
            reports/tts-lifecycle-*.png
            reports/tts-status-route-*.png
            reports/tts-mobile-notice-geometry-*.png
          if-no-files-found: warn
          retention-days: 14
