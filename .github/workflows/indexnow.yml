name: Metadata & IndexNow Readiness

# Lightweight read-only diagnostics only. Production readiness, the single
# production-like build, candidate provenance and Pages promotion are owned by
# deploy.yml. This workflow keeps an independent source metadata/revision signal
# without duplicating npm installation or dist generation.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**'

permissions:
  contents: read

concurrency:
  group: metadata-indexnow-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostics:
    name: Validate source metadata without building dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node 22.12
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'

      - name: Validate registry structure
        run: node scripts/editorial-metadata-registry.js --check

      - name: Check source asset revisions without writing
        run: node scripts/cache-bust.js

      - name: Ensure diagnostics left tracked sources clean
        run: git diff --exit-code
