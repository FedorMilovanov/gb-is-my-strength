name: Metadata & IndexNow Readiness

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      # Legacy content and every source/build input have one trigger owner:
      # readiness. Deploy follows only through workflow_run after these gates pass.
      - 'baptisty-rossii/**'
      - 'scripts/**'
      - 'css/**'
      - 'js/**'
      - 'sitemap.xml'
      - 'feed.xml'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'migration/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: metadata-indexnow-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate registry structure
        run: node scripts/editorial-metadata-registry.js --check

      - name: Check source asset revisions without writing
        run: node scripts/cache-bust.js

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Verify frozen editorial projections
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.log

      - name: Static publication gates
        run: npm run validate:static-publication:light

      - name: Ensure validation left tracked sources clean
        run: git diff --exit-code

      - name: Upload metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-metadata-${{ github.run_id }}
          path: reports/editorial-metadata-*.log
          if-no-files-found: ignore
          retention-days: 7

      # IndexNow submission itself remains in deploy.yml and runs only after a
      # successful GitHub Pages deploy. This workflow validates readiness only.
