name: IndexNow — Notify Search Engines

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'nagornaya/**'
      - 'about/**'
      - 'pastor-series/**'
      - 'konfessii/**'
      - 'karty/**'
      - 'map/**'
      - 'biografii/**'
      - 'hard-texts/**'
      - 'baptisty-rossii/**'
      - 'index.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'sw.js'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'
      # Astro migration: source pages/content/layouts must also trigger indexing.
      - 'src/**'
      - 'astro.config.mjs'

permissions:
  contents: write

concurrency:
  group: indexnow-meta-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARENA_AGENT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0          # нужна полная история для gitDate()

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update metadata
        run: node scripts/update-meta.js
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}

      - name: Cache bust assets
        run: node scripts/cache-bust.js

      - name: Static publication gates
        run: npm run validate:static-publication:light

      - name: Commit updated metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add -A
            git commit -m "chore: auto-update meta, cache-bust [skip ci]"
          fi
          _pushed=false
          for _attempt in 1 2 3; do
            if git push; then
              _pushed=true
              break
            fi
            sleep 5
          done
          if [ "$_pushed" = false ]; then
            echo "::error::git push failed after 3 attempts"
            exit 1
          fi
      # Note (NEW-53 fix): IndexNow submission to Bing and Yandex has been moved to
      # .github/workflows/deploy.yml to execute AFTER successful GitHub Pages deploy.
