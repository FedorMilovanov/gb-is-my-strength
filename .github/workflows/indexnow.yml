name: IndexNow — Notify Search Engines

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'nagornaya/**'
      - 'about/**'
      - 'pastor-series/**'
      - 'index.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'sw.js'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужна полная история для gitDate()

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Update metadata
        run: node scripts/update-meta.js
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}

      - name: Cache bust assets
        run: node scripts/cache-bust.js

      - name: Static publication gates
        run: npm run validate:static-publication

      - name: Commit updated metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || \
            (git add -A && git commit -m "chore: auto-update meta, cache-bust [skip ci]")
          git push

      - name: Build IndexNow payload
        id: payload
        run: |
          BASE="https://gospod-bog.ru"
          KEY="${{ secrets.INDEXNOW_KEY }}"

          if [ -z "$KEY" ]; then
            echo "::warning::INDEXNOW_KEY secret is not set; skipping IndexNow submit, but keeping deploy pipeline green."
            echo "urls=[]"              >> $GITHUB_OUTPUT
            echo "key="                 >> $GITHUB_OUTPUT
            echo "host=gospod-bog.ru"   >> $GITHUB_OUTPUT
            exit 0
          fi

          # Collect changed URLs from pushed commits — includes catalog pages.
          # GitHub runs bash with -o pipefail; grep with no matches must not fail deploy.
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} 2>/dev/null || true)
          URLS=$(printf '%s\n' "$CHANGED" \
            | grep -E '^(index\.html|about/index\.html|articles/index\.html|pastor-series/index\.html|nagornaya/index\.html|(articles|nagornaya)/[^/]+/index\.html)$' || true)
          URLS=$(printf '%s\n' "$URLS" \
            | sed 's|^index\.html$||' \
            | sed 's|/index\.html$|/|' \
            | sed "/^\$/!s|^|${BASE}/|" \
            | jq -R 'select(length > 0)' | jq -sc .)

          # Always include homepage so IndexNow gets at least one canonical URL.
          URLS=$(echo "$URLS" | jq -c --arg home "${BASE}/" '. + [$home] | unique')

          echo "urls=$URLS"             >> $GITHUB_OUTPUT
          echo "key=$KEY"               >> $GITHUB_OUTPUT
          echo "host=gospod-bog.ru"     >> $GITHUB_OUTPUT

      - name: Submit to IndexNow (Bing / Yandex)
        if: steps.payload.outputs.urls != '[]' && steps.payload.outputs.urls != ''
        continue-on-error: true
        run: |
          KEY="${{ steps.payload.outputs.key }}"
          HOST="${{ steps.payload.outputs.host }}"
          URLS='${{ steps.payload.outputs.urls }}'

          BODY=$(jq -n \
            --arg host "$HOST" \
            --arg key  "$KEY"  \
            --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://"+$host+"/"+$key+".txt"), urlList: $urls}')

          echo "Payload: $BODY"

          BING_STATUS=$(curl -s -o /tmp/indexnow-bing.out -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")

          case "$BING_STATUS" in
            2*) echo "✅ Bing IndexNow OK: $BING_STATUS" ;;
            *) echo "::warning::Bing IndexNow failed: $BING_STATUS"; cat /tmp/indexnow-bing.out ;;
          esac

          YANDEX_STATUS=$(curl -s -o /tmp/indexnow-yandex.out -w "%{http_code}" \
            -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")

          case "$YANDEX_STATUS" in
            2*) echo "✅ Yandex IndexNow OK: $YANDEX_STATUS" ;;
            *) echo "::warning::Yandex IndexNow failed: $YANDEX_STATUS"; cat /tmp/indexnow-yandex.out ;;
          esac
