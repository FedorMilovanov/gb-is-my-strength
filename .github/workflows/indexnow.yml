name: IndexNow — Notify Search Engines

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - 'articles/**'
      - 'nagornaya/**'
      - 'about/**'
      - 'pastor-series/**'
      - 'konfessii/**'
      - 'karty/**'
      - 'map/**'
      - 'biografii/**'
      - 'hard-texts/**'
      - 'index.html'
      - '404.html'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'sw.js'
      - 'manifest.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'feed.xml'
      # Astro migration: source pages/content/layouts must also trigger indexing.
      - 'src/**'
      - 'astro.config.mjs'

permissions:
  contents: write

concurrency:
  group: indexnow-meta-push
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ARENA_AGENT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0          # нужна полная история для gitDate()

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Update metadata
        run: node scripts/update-meta.js
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA:  ${{ github.event.after }}

      - name: Cache bust assets
        run: node scripts/cache-bust.js

      - name: Static publication gates
        run: npm run validate:static-publication:light

      - name: Commit updated metadata
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git add -A
            git commit -m "chore: auto-update meta, cache-bust [skip ci]"
          fi
          for _attempt in 1 2 3; do
            if git push; then
              break
            fi
            sleep 5
          done

      - name: Build IndexNow payload
        id: payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          INDEXNOW_KEY_VALUE: ${{ secrets.INDEXNOW_KEY }}
        run: |
          BASE="https://gospod-bog.ru"
          KEY="$INDEXNOW_KEY_VALUE"

          if [ -z "$KEY" ]; then
            echo "::warning::INDEXNOW_KEY secret is not set; skipping IndexNow submit, but keeping deploy pipeline green."
            {
              echo "urls=[]"
              echo "key="
              echo "host=gospod-bog.ru"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Collect changed files from the pushed commits and map them to public URLs.
          # Important after the Astro/dist switch: public pages may change through
          # src/pages/**/*.astro or src/content/**/*.mdx, not just legacy HTML files.
          CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || true)
          URLS=$(printf '%s\n' "$CHANGED" | node scripts/build-indexnow-urls.js --base "$BASE")

          {
            echo "urls=$URLS"
            echo "key=$KEY"
            echo "host=gospod-bog.ru"
          } >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow (Bing / Yandex)
        if: steps.payload.outputs.urls != '[]' && steps.payload.outputs.urls != ''
        continue-on-error: true
        run: |
          KEY="${{ steps.payload.outputs.key }}"
          HOST="${{ steps.payload.outputs.host }}"
          URLS='${{ steps.payload.outputs.urls }}'

          BODY=$(jq -n \
            --arg host "$HOST" \
            --arg key  "$KEY"  \
            --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://"+$host+"/"+$key+".txt"), urlList: $urls}')

          echo "Payload: $BODY"

          BING_STATUS=$(curl -s -o /tmp/indexnow-bing.out -w "%{http_code}" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")

          case "$BING_STATUS" in
            2*) echo "✅ Bing IndexNow OK: $BING_STATUS" ;;
            *) echo "::warning::Bing IndexNow failed: $BING_STATUS"; cat /tmp/indexnow-bing.out ;;
          esac

          YANDEX_STATUS=$(curl -s -o /tmp/indexnow-yandex.out -w "%{http_code}" \
            -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY")

          case "$YANDEX_STATUS" in
            2*) echo "✅ Yandex IndexNow OK: $YANDEX_STATUS" ;;
            *) echo "::warning::Yandex IndexNow failed: $YANDEX_STATUS"; cat /tmp/indexnow-yandex.out ;;
          esac
