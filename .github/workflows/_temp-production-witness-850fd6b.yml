name: Temporary Gill Source Diagnostic Pack

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: read

jobs:
  collect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          ref: 83a13a0755b37296ccec053987654ceefbca349e
          fetch-depth: 1

      - name: Locate Gill controller, TOC and heading sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports diagnostic-pack
          grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            'initGbs2Controls|gbs2-active|gbs2Count|aria-current|Самообразование вне университетской траектории|sec-academies|sec-from-puritans-to-baptists' \
            . > reports/gill-source-locations.txt || true
          cat reports/gill-source-locations.txt

          for path in \
            js/site.js \
            js/reader-preferences.js \
            js/reader-preferences-head.js \
            data/gill-pre-v16-submenu-reference.json \
            data/gill-submenu-anchor-reconciliation.json \
            scripts/gill-pre-v16-submenu-regression-audit.js \
            src/components/article-pilots/gill-series/GillSeriesChrome.astro \
            src/components/article-pilots/gill-context/GillContextPageHead.astro \
            src/components/article-pilots/gill-part1/GillPart1PageHead.astro \
            src/components/article-pilots/gill-part2/GillPart2PageHead.astro \
            src/components/article-pilots/gill-part3/GillPart3PageHead.astro \
            articles/dzhon-gill-istoricheskiy-kontekst/index.html \
            articles/dzhon-gill-chast-1-chelovek/index.html \
            articles/dzhon-gill-chast-2-uchenyi/index.html \
            articles/dzhon-gill-chast-3-nasledie/index.html; do
            if [[ -f "$path" ]]; then
              mkdir -p "diagnostic-pack/$(dirname "$path")"
              cp "$path" "diagnostic-pack/$path"
            fi
          done

          while IFS=: read -r path line rest; do
            [[ -f "$path" ]] || continue
            clean="${path#./}"
            mkdir -p "diagnostic-pack/$(dirname "$clean")"
            cp "$clean" "diagnostic-pack/$clean"
          done < reports/gill-source-locations.txt

          find diagnostic-pack -type f -print | sort > reports/gill-diagnostic-file-list.txt
          tar -czf reports/gill-source-diagnostic-pack.tar.gz -C diagnostic-pack .

      - name: Upload source diagnostic pack
        uses: actions/upload-artifact@v4
        with:
          name: gill-source-diagnostic-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 14
