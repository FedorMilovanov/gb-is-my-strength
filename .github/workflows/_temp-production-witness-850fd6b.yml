name: Temporary Gill Manifest-Matched Publisher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVEN_ARTIFACT_ID: '8608502179'
      PROVEN_BASE: 'cb378b1d086156d46d89769d73050dc6f54e2bd3'
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Recreate manifest-matched transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main fix/gill-readerstate-submenu-release-2026-07-24
          test "$(git rev-parse origin/main)" = "$PROVEN_BASE"
          git merge --no-edit origin/main
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:src/components/article-pilots/gill-series/gillSeriesData.ts \
            > src/components/article-pilots/gill-series/gillSeriesData.ts
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:scripts/_temp-gill-release-materialize.py \
            > /tmp/gill-release-materialize.py
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:scripts/_temp-gill-visibility-materialize.py \
            > /tmp/gill-visibility-materialize.py
          python /tmp/gill-release-materialize.py
          python /tmp/gill-visibility-materialize.py
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          git diff --check

      - name: Verify every tracked file against proven SHA-256 manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/proven
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PROVEN_ARTIFACT_ID}/zip" > /tmp/proven.zip
          unzip -q /tmp/proven.zip -d /tmp/proven
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, subprocess

          manifest=json.loads(Path('/tmp/proven/manifest.json').read_text(encoding='utf-8'))
          if manifest['base'] != os.environ['PROVEN_BASE']:
              raise SystemExit(f"manifest base {manifest['base']} != {os.environ['PROVEN_BASE']}")
          expected={row['path']:row for row in manifest['files']}
          actual=subprocess.check_output(
              ['git','diff','--name-only','--diff-filter=ACMRT','origin/main'], text=True
          ).splitlines()
          if set(actual) != set(expected):
              raise SystemExit('tracked scope mismatch\nactual='+repr(sorted(actual))+'\nexpected='+repr(sorted(expected)))
          for path,row in expected.items():
              data=Path(path).read_bytes()
              digest=hashlib.sha256(data).hexdigest()
              if digest != row['sha256'] or len(data) != row['bytes']:
                  raise SystemExit(f"{path}: {digest}/{len(data)} != {row['sha256']}/{row['bytes']}")
          print(f"manifest matched: {len(expected)} tracked files")
          PY

      - name: Commit and push tracked files only
        shell: bash
        run: |
          set -euo pipefail
          # Deliberately exclude both workflow paths. The GitHub connector will
          # replace the temporary workflow with the permanent read-only contract.
          rm -f .github/workflows/gill-pre-v16-submenu.yml
          git add -u
          git diff --cached --check
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "fix(gill): restore ReaderState submenu traversal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
