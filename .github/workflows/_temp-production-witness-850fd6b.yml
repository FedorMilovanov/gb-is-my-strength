name: Temporary Gill Materializer Failure Extract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAILED_JOB_ID: '89577052661'
    steps:
      - name: Download failed job log and extract patch precondition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > failed.log
          python - <<'PY'
          from pathlib import Path
          import re
          lines=Path('failed.log').read_text(encoding='utf-8-sig',errors='replace').splitlines()
          clean=[re.sub(r'^\d{4}-\d{2}-\d{2}T[^ ]+Z\s+','',x) for x in lines]
          keys=('controller active block count','controller counter block count','controller part block count','SystemExit','Traceback','##[error]')
          hits=[i for i,x in enumerate(clean) if any(k.lower() in x.lower() for k in keys)]
          selected=set()
          for i in hits:selected.update(range(max(0,i-3),min(len(clean),i+4)))
          text='\n'.join(f'{i+1}: {clean[i]}' for i in sorted(selected))+'\n'
          Path('failure.txt').write_text(text,encoding='utf-8')
          print(text)
          if not hits: raise SystemExit('no patch failure markers found')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gill-materializer-failure-${{ github.run_id }}
          path: failure.txt
          if-no-files-found: error
          retention-days: 7
