name: Temporary Gill Tree Metadata Packager

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: read

jobs:
  metadata:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Capture exact main tree and permanent workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main fix/gill-readerstate-submenu-release-2026-07-24
          mkdir -p reports/meta/.github/workflows
          printf 'base_commit=%s\nbase_tree=%s\n' \
            "$(git rev-parse origin/main)" \
            "$(git rev-parse 'origin/main^{tree}')" \
            | tee reports/meta/base.env
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:scripts/_temp-gill-release-materialize.py > /tmp/materialize.py
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/materialize.py').read_text(encoding='utf-8')
          start=text.index("workflow = '''") + len("workflow = '''")
          end=text.index("'''\nPath('.github/workflows/gill-pre-v16-submenu.yml')", start)
          Path('reports/meta/.github/workflows/gill-pre-v16-submenu.yml').write_text(text[start:end],encoding='utf-8')
          PY
          sha256sum reports/meta/.github/workflows/gill-pre-v16-submenu.yml | tee reports/meta/workflow.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: gill-tree-metadata-${{ github.run_id }}
          path: reports/meta/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
