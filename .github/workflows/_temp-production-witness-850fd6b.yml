name: Temporary Gill Deploy Failure Extract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: read
  actions: read

jobs:
  extract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAILED_JOB_ID: '89565412548'
    steps:
      - name: Download exact failed Pages job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p reports
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > reports/pages-deploy.log
          test -s reports/pages-deploy.log

      - name: Extract Gill failure context
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('reports/pages-deploy.log')
          lines = source.read_text(encoding='utf-8-sig', errors='replace').splitlines()
          cleaned = [re.sub(r'^\d{4}-\d{2}-\d{2}T[^ ]+Z\s+', '', line) for line in lines]
          patterns = [
              re.compile(r'\bFAIL\b', re.I),
              re.compile(r'browser audit error', re.I),
              re.compile(r'scrollspy', re.I),
              re.compile(r'Gill pre-v16 submenu audit:', re.I),
              re.compile(r'Process completed with exit code', re.I),
          ]
          hits = []
          for index, line in enumerate(cleaned):
              if any(pattern.search(line) for pattern in patterns):
                  hits.append(index)
          selected = set()
          for index in hits:
              selected.update(range(max(0, index - 3), min(len(cleaned), index + 4)))
          output = []
          previous = None
          for index in sorted(selected):
              if previous is not None and index > previous + 1:
                  output.append('---')
              output.append(f'{index + 1}: {cleaned[index]}')
              previous = index
          Path('reports/gill-failure-context.txt').write_text('\n'.join(output) + '\n', encoding='utf-8')
          print('\n'.join(output))
          if not hits:
              raise SystemExit('No Gill failure markers found in job log')
          PY

      - name: Upload extracted diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gill-pages-failure-${{ github.run_id }}
          path: |
            reports/gill-failure-context.txt
            reports/pages-deploy.log
          if-no-files-found: error
          retention-days: 14
