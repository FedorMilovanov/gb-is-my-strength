name: Temporary Gill Release Materializer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/_temp-production-witness-850fd6b.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Reconcile current main and apply reviewed source transaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main fix/gill-readerstate-submenu-release-2026-07-24
          git merge --no-edit origin/main
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:src/components/article-pilots/gill-series/gillSeriesData.ts \
            > src/components/article-pilots/gill-series/gillSeriesData.ts
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:scripts/_temp-gill-release-materialize.py \
            > /tmp/gill-release-materialize.py
          git show origin/fix/gill-readerstate-submenu-release-2026-07-24:scripts/_temp-gill-visibility-materialize.py \
            > /tmp/gill-visibility-materialize.py
          python /tmp/gill-release-materialize.py
          python /tmp/gill-visibility-materialize.py

      - name: Install dependencies
        run: npm ci

      - name: Validate, synchronize revisions and require exact live traversal
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: |
          node --check js/floating-cluster-controller.js
          node -e "JSON.parse(require('fs').readFileSync('data/gill-submenu-anchor-reconciliation.json','utf8'))"
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js
          git diff --check
          npm run strangler:build:production-like
          npx playwright install --with-deps chromium
          npm run gill:pre-v16-submenu:audit

      - name: Verify complete final scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          allowed_exact={
            'js/floating-cluster-controller.js',
            'data/gill-submenu-anchor-reconciliation.json',
            'src/components/article-pilots/gill-series/gillSeriesData.ts',
            '.github/workflows/gill-pre-v16-submenu.yml',
            'src/lib/asset-version.js',
          }
          paths=subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines()
          bad=[]
          for path in paths:
            if path == '.github/workflows/_temp-production-witness-850fd6b.yml':
              continue
            if not (path in allowed_exact or path.endswith('.html') or (path.startswith('src/') and path.endswith('.astro'))):
              bad.append(path)
          if bad:
            raise SystemExit('unexpected final-scope files: '+', '.join(bad))
          print('final scope files:', len(paths)-1)
          PY

      - name: Commit proven self-cleaning transaction
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_temp-production-witness-850fd6b.yml
          git add -A
          git diff --cached --check
          git commit -m "fix(gill): restore ReaderState submenu traversal"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gill-release-materializer-${{ github.run_id }}
          path: reports/gill-pre-v16-submenu-audit/
          if-no-files-found: warn
          retention-days: 14
