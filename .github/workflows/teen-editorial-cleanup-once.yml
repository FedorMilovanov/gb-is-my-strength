name: Teen Editorial Cleanup Once

on:
  push:
    branches:
      - release/teen-series-live-20260910

permissions:
  contents: read

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore(teen): stage one-shot editorial cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
