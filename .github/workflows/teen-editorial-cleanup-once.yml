          old_guard = '''### Evidence-class guard\n\n- пожизненное почитание и семейная забота: **DIRECT_SCRIPTURE + CANONICAL_SYNTHESIS**;\n- изменение формы родительского управления со взрослением: **CANONICAL_SYNTHESIS + CLASSICAL_EXEGESIS_STRONG**;\n- точный объём приказного послушания независимого взрослого: **status-sensitive / disputed in degree; do not overstate as one explicit NT age rule**;\n- особый вес родительского совета: **CANONICAL_SYNTHESIS + CLASSICAL_EXEGESIS_STRONG**;\n- практическая зрелость как рост способности нести обязанности: **DIRECT_SCRIPTURE themes + CANONICAL_SYNTHESIS**;\n- конкретные house-rule и ресурсные применения: **PRUDENTIAL_APPLICATION**, принадлежат Companion B;\n- гражданские операции: **CIVIL_OR_SAFEGUARDING_DEPENDENT**;\n- daughter/father/marriage veto claims: отдельный Companion D с собственным evidence ladder.\n'''
          new_guard = '''### О степени уверенности в выводах\n\n- пожизненное почитание и семейная забота прямо укоренены в Писании и подтверждаются общей канонической картиной;\n- изменение формы родительского управления со взрослением следует из канонического синтеза и сильной классической экзегезы;\n- точный объём приказного послушания независимого взрослого зависит от статуса и в деталях остаётся спорным: его нельзя выдавать за одно прямое новозаветное возрастное правило;\n- особый вес родительского совета имеет сильную каноническую и классическую поддержку;\n- практическая зрелость как рост способности нести обязанности опирается на прямые библейские темы и их синтез;\n- конкретные правила дома и применение ресурсов требуют благоразумия и подробно разбираются в статье B;\n- гражданские процедуры зависят от конкретной юрисдикции и вопросов защиты;\n- спорные вопросы власти отца, согласия взрослой дочери и брака подробно разбираются в статье D с отдельной оценкой оснований.\n'''
          text = must_replace(text, old_guard, new_guard, 'C')
          p.write_text(text, encoding='utf-8')

          # Companion D: remove the stale prepublication frontmatter marker only.
          p = files['D']; text = p.read_text(encoding='utf-8')
          text = must_replace(text, '# Явный черновик для проверки тезисов и источников; снять только после publication release.\n', '', 'D')
          p.write_text(text, encoding='utf-8')

          def reader_body(text):
              text = re.sub(r'^---\n[\s\S]*?\n---\n', '', text, count=1)
              text = re.sub(r'\{/\*[\s\S]*?\*/\}', '', text)
              return text

          banned = {
              'II': ['Этот draft'],
              'A': ['Этот draft', 'no-contact', 'Companion B', 'Companion C', 'Companion D'],
              'B': ['Companion A', 'Companion B', 'Companion C', 'Companion D', 'stewardship', 'house rules', 'adult parental authority', 'prudence', 'co-residence', 're-entrustment', 'rescue cycle', 'cash transfer', 'doctrinal/status', 'Evidence-class guard', 'DIRECT_SCRIPTURE', 'CANONICAL_SYNTHESIS', 'PRUDENTIAL_APPLICATION', 'CIVIL_OR_SAFEGUARDING_DEPENDENT'],
              'C': ['Companion A', 'Companion B', 'Companion C', 'Companion D', 'stewardship', 'doctrinal/status companion', 'Evidence-class guard', 'DIRECT_SCRIPTURE', 'CANONICAL_SYNTHESIS', 'CLASSICAL_EXEGESIS_STRONG', 'PRUDENTIAL_APPLICATION', 'CIVIL_OR_SAFEGUARDING_DEPENDENT', 'evidence ladder'],
              'D': ['# Явный черновик для проверки тезисов и источников; снять только после publication release.'],
          }
          for label, p in files.items():
              body = reader_body(p.read_text(encoding='utf-8'))
              for token in banned.get(label, []):
                  if token in body:
                      raise SystemExit(f'{label}: reader-facing backstage token remains: {token}')
              # Catch missed bold/code slogans that are still essentially all-English uppercase.
              for line in body.splitlines():
                  stripped = line.strip().strip('`*').strip()
                  letters = [c for c in stripped if c.isalpha()]
                  if len(letters) >= 12:
                      ascii_letters = [c for c in letters if 'A' <= c <= 'Z' or 'a' <= c <= 'z']
                      upper_ascii = [c for c in letters if 'A' <= c <= 'Z']
                      if len(ascii_letters) / len(letters) > 0.85 and len(upper_ascii) / max(1, len(ascii_letters)) > 0.8:
                          raise SystemExit(f'{label}: English slogan remains: {line}')

          print('teen editorial cleanup validated')
          PY
          git diff --check
