name: Deploy to GitHub Pages

# One trusted control-plane workflow builds one exact release candidate and
# promotes those same bytes. Automatic releases use one SHA for both roles;
# manual recovery may select an older release SHA, but only when it is already
# an ancestor of the current main control plane.
#
# HTTP publication is intentionally direct GitHub Pages. Cloudflare may remain
# the authoritative DNS provider, but it is not part of the release control
# plane and no release credential/purge dependency is permitted here.
on:
  push:
    branches: [main]
    paths:
      - '**'
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact historical main SHA to promote; blank means current main
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel the release already being promoted. A newer main push may
  # wait/coalesce as pending, but the running immutable candidate must finish.
  cancel-in-progress: false

env:
  RELEASE_NODE_VERSION: '22.23.1'
  RELEASE_NPM_VERSION: '10.9.8'
  CONTROL_PLANE_SHA: ${{ github.sha }}
  RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.release_sha || github.sha }}
  RELEASE_ARTIFACT_NAME: pages-release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
  PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  readiness:
    name: Build and validate immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    outputs:
      release_sha: ${{ steps.provenance.outputs.release_sha }}
      control_plane_sha: ${{ steps.provenance.outputs.control_plane_sha }}
      candidate_id: ${{ steps.provenance.outputs.candidate_id }}
      candidate_digest: ${{ steps.provenance.outputs.candidate_digest }}
      candidate_bytes: ${{ steps.provenance.outputs.candidate_bytes }}
      candidate_files: ${{ steps.provenance.outputs.candidate_files }}
      immutable_path: ${{ steps.provenance.outputs.immutable_path }}
      transport_artifact_id: ${{ steps.candidate_upload.outputs.artifact-id }}
      transport_artifact_digest: ${{ steps.candidate_upload.outputs.artifact-digest }}

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove release and control-plane Git boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$CONTROL_PLANE_SHA" =~ ^[a-f0-9]{40}$ ]]
          git fetch --no-tags origin "+main:refs/remotes/origin/main"
          test "$(git rev-parse --verify 'HEAD^{commit}')" = "$RELEASE_SHA"
          test "$(git rev-parse --verify 'refs/remotes/origin/main^{commit}')" = "$CONTROL_PLANE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" "$CONTROL_PLANE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test "$RELEASE_SHA" = "$CONTROL_PLANE_SHA"
          fi

      - name: Set up pinned Node toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          cache: npm

      - name: Assert pinned npm toolchain
        run: test "$(npm --version)" = "$RELEASE_NPM_VERSION"

      - name: Install dependencies once
        run: npm ci

      - name: Verify deterministic local fonts
        run: |
          node --check scripts/font-assets-lib.mjs
          node --check scripts/verify-font-assets.mjs
          node --check scripts/generate-font-assets.mjs
          node --check scripts/font-assets-contract-test.mjs
          node scripts/font-assets-contract-test.mjs
          node scripts/verify-font-assets.mjs

      - name: Validate registry structure
        run: node scripts/editorial-metadata-registry.js --check

      - name: Check source asset revisions without writing
        run: node scripts/cache-bust.js

      - name: Static publication source gates
        run: npm run validate:static-publication

      - name: Build production-like dist once
        run: npm run strangler:build:production-like

      - name: Verify page ownership in candidate dist
        run: npm run page-ownership:dist:production-like

      - name: Build Pagefind index in candidate dist
        run: npm run pagefind:build:dist

      - name: Publish IndexNow key file into candidate dist
        env:
          INDEXNOW_KEY_VALUE: ${{ secrets.INDEXNOW_KEY }}
        run: |
          KEY="$INDEXNOW_KEY_VALUE"
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "dist/${KEY}.txt"
          else
            echo "INDEXNOW_KEY secret is empty — key file was not generated"
          fi

      - name: Verify Pagefind and disable Jekyll filtering
        run: |
          test -f dist/pagefind/pagefind.js
          touch dist/.nojekyll

      - name: Route-specific visual parity contract
        run: npm run visual:parity:production

      - name: Production-like dist publication audit
        run: node scripts/dist-publication-audit.js --require-pagefind --forbid-dev

      - name: Public URL contract compare on candidate dist
        run: npm run contract:extract:dist && npm run contract:compare:dist

      - name: Dist JSON-LD parse audit
        run: npm run dist:jsonld:audit

      - name: Semantic rich-results schema audit
        run: npm run schema:rich-results:audit:dist

      - name: PremiumControls rollout contract
        run: npm run audit:premium-controls

      - name: Gill v16 dist strict audits
        run: node scripts/gill-context-visual-parity-audit.js --require-dist && node scripts/gill-spravochnik-visual-parity-audit.js --require-dist

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Home Refutations computed box model
        run: node scripts/visual-parity-home-refutations-box-model-browser-test.js

      - name: Gill pre-v16 submenu regression audit
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: npm run gill:pre-v16-submenu:audit

      - name: Gill mobile TOC and PlayEmber smoke
        run: npm run gill:mobile-play:smoke

      - name: Gill mobile reference layout audit
        id: gill_mobile_layout
        run: npm run gill:mobile-layout:audit

      - name: Upload Gill mobile layout readiness evidence
        if: ${{ always() && (steps.gill_mobile_layout.outcome == 'success' || steps.gill_mobile_layout.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gill-mobile-layout-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/gill-mobile-layout-audit-2026-06-29/summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Broad production-like dist runtime smoke
        run: node scripts/dist-smoke-audit.js --no-build --production-like

      - name: Content word-coverage audit
        run: npm run content:coverage:audit

      - name: Service Worker deploy-switch readiness
        run: npm run sw:dist:audit:deploy-switch

      - name: Verify frozen editorial projections
        shell: bash
        run: |
          mkdir -p reports
          set -o pipefail
          node scripts/editorial-metadata-freeze-audit.js 2>&1 \
            | tee reports/editorial-metadata-freeze.log

      - name: Prepare IndexNow URL list from last published release
        env:
          AFTER_SHA: ${{ env.RELEASE_SHA }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports release-tools

          # Recovery may checkout an older release source. Use the current
          # control-plane mapper while resolving routes against release bytes.
          git show "${CONTROL_PLANE_SHA}:scripts/build-indexnow-urls.js" > release-tools/build-indexnow-urls.js
          node --check release-tools/build-indexnow-urls.js

          LIVE_SHA="$(
            curl --fail --silent --show-error --retry 2 --max-time 10 \
              "https://gospod-bog.ru/deployments/current.json?indexnow_baseline=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              | jq -r '.releaseSha // empty' 2>/dev/null || true
          )"

          if [[ "$LIVE_SHA" =~ ^[a-f0-9]{40}$ ]] && git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null; then
            echo "IndexNow delta: published ${LIVE_SHA} -> candidate ${AFTER_SHA}"
            git diff --name-only "$LIVE_SHA" "$AFTER_SHA" \
              | node release-tools/build-indexnow-urls.js --base "https://gospod-bog.ru" --previous-ref "$LIVE_SHA" \
              > reports/indexnow-urls.json
          else
            echo "IndexNow published baseline unavailable; notifying full public indexable corpus"
            node release-tools/build-indexnow-urls.js --base "https://gospod-bog.ru" --all-public \
              > reports/indexnow-urls.json
          fi

          node -e "const x=require('./reports/indexnow-urls.json'); if(!Array.isArray(x)||x.length===0) process.exit(1)"

      - name: Ensure release-source validation left tracked files clean
        run: git diff --exit-code

      - name: Stage immutable verification tools from trusted control plane
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-tools
          mkdir release-tools
          for file in \
            release-candidate-lib.mjs \
            write-deployment-provenance.mjs \
            verify-release-candidate.mjs \
            live-release-contract.mjs \
            tts-live-deployment-contract.mjs
          do
            git show "${CONTROL_PLANE_SHA}:scripts/${file}" > "release-tools/${file}"
          done
          node --check release-tools/release-candidate-lib.mjs
          node --check release-tools/write-deployment-provenance.mjs
          node --check release-tools/verify-release-candidate.mjs
          node --check release-tools/live-release-contract.mjs
          node --check release-tools/tts-live-deployment-contract.mjs

      - name: Write generic immutable release provenance
        id: provenance
        env:
          RELEASE_ROOT: ${{ github.workspace }}
        run: node release-tools/write-deployment-provenance.mjs

      - name: Verify prepared release candidate
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ env.CONTROL_PLANE_SHA }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_CANDIDATE_DIGEST: ${{ steps.provenance.outputs.candidate_digest }}
        run: node release-tools/verify-release-candidate.mjs

      - name: Upload immutable release candidate
        id: candidate_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.RELEASE_ARTIFACT_NAME }}
          path: |
            dist
            release-tools
            reports/indexnow-urls.json
            reports/release-candidate.json
            reports/release-candidate-verification.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 30

  deploy:
    name: Promote exact readiness candidate
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}

    steps:
      - name: Download exact readiness candidate by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.readiness.outputs.transport_artifact_id }}
          merge-multiple: true
          path: .

      - name: Set up pinned Node verifier
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Verify downloaded candidate identity
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          EXPECTED_CONTROL_PLANE_SHA: ${{ needs.readiness.outputs.control_plane_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.readiness.outputs.candidate_digest }}
        run: node release-tools/verify-release-candidate.mjs

      - name: Upload exact candidate as Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist

      - name: Deploy exact candidate to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}

      - name: Verify generic live release contract
        id: live_release
        env:
          LIVE_BASE_URL: https://gospod-bog.ru
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          CONTROL_PLANE_SHA: ${{ needs.readiness.outputs.control_plane_sha }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.readiness.outputs.candidate_digest }}
          RELEASE_ARTIFACT_ID: ${{ needs.readiness.outputs.transport_artifact_id }}
          RELEASE_ARTIFACT_DIGEST: ${{ needs.readiness.outputs.transport_artifact_digest }}
        run: node release-tools/live-release-contract.mjs

      - name: Upload generic live release evidence
        if: ${{ always() && steps.deploy_pages.outcome == 'success' && (steps.live_release.outcome == 'success' || steps.live_release.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-live-deployment-${{ github.run_id }}
          path: reports/release-live-deployment-contract.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Verify live TTS capability extension
        id: tts_live
        if: ${{ always() && steps.deploy_pages.outcome == 'success' && steps.live_release.outcome == 'success' }}
        env:
          LIVE_BASE_URL: https://gospod-bog.ru
          RELEASE_SHA: ${{ needs.readiness.outputs.release_sha }}
          CONTROL_PLANE_SHA: ${{ needs.readiness.outputs.control_plane_sha }}
          EXPECTED_CANDIDATE_DIGEST: ${{ needs.readiness.outputs.candidate_digest }}
        run: node release-tools/tts-live-deployment-contract.mjs

      - name: Upload live TTS capability evidence
        if: ${{ always() && steps.deploy_pages.outcome == 'success' && (steps.tts_live.outcome == 'success' || steps.tts_live.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tts-live-deployment-${{ github.run_id }}
          path: reports/tts-live-deployment-contract.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Submit precomputed URLs to IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY_VALUE: ${{ secrets.INDEXNOW_KEY }}
        run: |
          if [ -z "$INDEXNOW_KEY_VALUE" ]; then
            echo "INDEXNOW_KEY secret is empty — submission skipped"
            exit 0
          fi
          URLS=$(cat reports/indexnow-urls.json)
          BODY=$(jq -n \
            --arg host "gospod-bog.ru" \
            --arg key "$INDEXNOW_KEY_VALUE" \
            --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://"+$host+"/"+$key+".txt"), urlList: $urls}')
          curl --fail-with-body --retry 3 -sS -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
          curl --fail-with-body --retry 3 -sS -X POST "https://yandex.com/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
