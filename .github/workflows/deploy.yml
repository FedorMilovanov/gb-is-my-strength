name: Deploy to GitHub Pages

# Production has one automatic entry point: a successful read-only
# Metadata & IndexNow Readiness run. Every production-impacting path belongs to
# readiness, so mixed source/asset commits cannot create competing Pages runs.
# workflow_dispatch remains for explicit operator recovery. This workflow never
# rewrites source revisions.
on:
  workflow_run:
    workflows: ["Metadata & IndexNow Readiness"]
    types: [completed]
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read   # читаем репозиторий
  pages:    write  # заливаем артефакт на Pages
  id-token: write  # OIDC-токен для actions/deploy-pages

# Если в очереди несколько деплоев — оставляем только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Automatic deploy is allowed only after readiness succeeds. A failed or
    # cancelled readiness must never ship production. Manual runs remain
    # available for explicit operator recovery.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout exact readiness-verified commit
        uses: actions/checkout@v4
        with:
          # Never replace the verified workflow_run SHA with a newer moving main.
          # Manual operator recovery deliberately uses current main.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Note: P1-CI-DUPE — when triggered by workflow_run, readiness already
        # ran npm ci. Setup-node cache keeps this cheap and preserves build isolation.
        run: npm ci

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Check asset revisions for manual deploys
        # workflow_run already follows a successful read-only readiness check.
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/cache-bust.js

      - name: Static publication gates
        run: npm run validate:static-publication

      # РЕФАКТОРИНГ 5.0 (AGENTS-r245, 2026-06-20):
      # Dist deploy enabled. Full-document shadow-wrap restores 100% visual parity
      # for all landing/series pages. Build-time strangler produces complete dist.
      # See docs/refactor-2026/REFACTORING_5_0_PLAN.md.
      - name: Build Astro + copy legacy into dist
        run: npm run strangler:build:production-like

      - name: Verify page ownership in production-like dist
        run: npm run page-ownership:dist:production-like

      - name: Build Pagefind index in dist
        run: npm run pagefind:build:dist

      - name: Publish IndexNow key file from secret into dist
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "dist/${KEY}.txt"
          else
            echo "INDEXNOW_KEY secret is empty — key file was not generated"
          fi

      - name: Verify Pagefind index and disable Jekyll filtering in dist
        run: |
          test -f dist/pagefind/pagefind.js
          touch dist/.nojekyll

      - name: Route-specific visual parity contract
        run: npm run visual:parity:production

      - name: Production-like dist publication audit
        run: node scripts/dist-publication-audit.js --require-pagefind --forbid-dev

      - name: Public URL contract compare on dist
        run: npm run contract:extract:dist && npm run contract:compare:dist

      - name: Dist JSON-LD parse audit
        run: npm run dist:jsonld:audit

      - name: Semantic rich-results schema audit
        run: npm run schema:rich-results:audit:dist

      - name: PremiumControls rollout contract
        run: npm run audit:premium-controls

      - name: Gill v16 dist strict audits
        run: node scripts/gill-context-visual-parity-audit.js --require-dist && node scripts/gill-spravochnik-visual-parity-audit.js --require-dist

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Gill pre-v16 submenu regression audit
        # --require-live: the full per-row scrollspy traversal must actually
        # execute; the soft "not exercisable headlessly" path once masked a
        # dead initGbs2Controls gate that froze the submenu on every Gill page.
        env:
          GILL_SUBMENU_REQUIRE_LIVE: '1'
        run: npm run gill:pre-v16-submenu:audit

      - name: Gill mobile TOC and PlayEmber smoke
        run: npm run gill:mobile-play:smoke

      - name: Gill mobile reference layout audit
        run: npm run gill:mobile-layout:audit

      - name: Broad production-like dist runtime smoke
        run: node scripts/dist-smoke-audit.js --no-build --production-like

      - name: Content word-coverage audit (legacy shadow vs dist)
        # GATE-GAP-NATIVE-TEXT-PARITY: catches content silently lost between
        # the legacy shadow and the built Astro page (CONTENT-PARITY-LOSS-01
        # regression class).
        run: npm run content:coverage:audit

      - name: Service Worker deploy-switch readiness
        run: npm run sw:dist:audit:deploy-switch

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Verify live TTS deployment contract
        env:
          LIVE_BASE_URL: https://gospod-bog.ru
          DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/tts-live-deployment-contract.mjs

      - name: Upload live TTS deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tts-live-deployment-${{ github.run_id }}
          path: reports/tts-live-deployment-contract.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build IndexNow payload
        id: payload
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          INDEXNOW_KEY_VALUE: ${{ secrets.INDEXNOW_KEY }}
        run: |
          BASE="https://gospod-bog.ru"
          KEY="$INDEXNOW_KEY_VALUE"

          if [ -z "$KEY" ]; then
            echo "::warning::INDEXNOW_KEY secret is not set; skipping IndexNow submit."
            {
              echo "urls=[]"
              echo "key="
              echo "host=gospod-bog.ru"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "${BEFORE_SHA:-HEAD~1}" "${AFTER_SHA:-HEAD}" 2>/dev/null || git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          URLS=$(printf '%s\n' "$CHANGED" | node scripts/build-indexnow-urls.js --base "$BASE")

          {
            echo "urls=$URLS"
            echo "key=$KEY"
            echo "host=gospod-bog.ru"
          } >> "$GITHUB_OUTPUT"

      - name: Submit to IndexNow (Bing / Yandex)
        if: steps.payload.outputs.urls != '[]' && steps.payload.outputs.urls != ''
        continue-on-error: true
        run: |
          KEY="${{ steps.payload.outputs.key }}"
          HOST="${{ steps.payload.outputs.host }}"
          URLS='${{ steps.payload.outputs.urls }}'

          BODY=$(jq -n \
            --arg host "$HOST" \
            --arg key  "$KEY" \
            --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: ("https://"+$host+"/"+$key+".txt"), urlList: $urls}')

          echo "Payload: $BODY"

          curl -s -o /tmp/indexnow-bing.out -w "%{http_code}\n" \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" || true

          curl -s -o /tmp/indexnow-yandex.out -w "%{http_code}\n" \
            -X POST "https://yandex.com/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" || true
