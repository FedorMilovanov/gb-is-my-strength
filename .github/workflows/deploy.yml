name: Deploy to GitHub Pages

# Запускается ПОСЛЕ того, как indexnow.yml завершил работу —
# то есть уже после cache-bust-коммита — чтобы деплоить
# актуальную версию, а не ту, что была до автообновления мета.
on:
  # Asset-only / infrastructure pushes that do not trigger indexnow.yml.
  # Content/CSS/JS pushes deploy via workflow_run after metadata/cache-bust.
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'fonts/**'
      - 'icons/**'
      - 'favicon*'
      - 'apple-touch-icon.png'
      - 'CNAME'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

  workflow_run:
    workflows: ["IndexNow — Notify Search Engines"]
    types: [completed]
    branches: [main]

  # Ручной запуск (например, после изменений, не затрагивающих контент)
  workflow_dispatch:

permissions:
  contents: read   # читаем репозиторий
  pages:    write  # заливаем артефакт на Pages
  id-token: write  # OIDC-токен для actions/deploy-pages

# Если в очереди несколько деплоев — оставляем только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Deploy after manual run, asset-only push, or successful IndexNow metadata workflow.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout (последний коммит в main, включая cache-bust)
        uses: actions/checkout@v4
        with:
          # Берём самый свежий коммит (в т.ч. авто-коммит indexnow.yml)
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Cache bust assets
        run: node scripts/cache-bust.js || echo "Cache bust skipped"

      - name: Publish IndexNow key file from secret
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "${KEY}.txt"
          else
            echo "INDEXNOW_KEY secret is empty — key file was not generated"
          fi

      - name: Build Pagefind index
        # npx скачает pagefind только если его нет в кеше.
        # --site . — корень репозитория = корень сайта.
        # --output-path pagefind — стандартная папка, ожидаемая search.js.
        run: npx -y pagefind@1.5.2 --site . --output-path pagefind

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Загружаем весь корень; папка pagefind/ уже есть внутри
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
