name: Deploy to GitHub Pages

# Запускается ПОСЛЕ того, как indexnow.yml завершил работу —
# то есть уже после cache-bust-коммита — чтобы деплоить
# актуальную версию, а не ту, что была до автообновления мета.
on:
  # Asset-only / infrastructure pushes that do not trigger indexnow.yml.
  # Content/CSS/JS pushes deploy via workflow_run after metadata/cache-bust.
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'fonts/**'
      - 'icons/**'
      - 'konfessii/**'
      - 'karty/**'
      - 'map/**'
      - 'biografii/**'
      - 'hard-texts/**'
      # Astro migration: public pages now live in src/ — deploy must fire on
      # any change to Astro pages, MDX content, layouts, or the strangler manifest.
      - 'src/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'migration/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nojekyll'
      - 'favicon*'
      - 'apple-touch-icon.png'
      - 'CNAME'
      - '.github/workflows/deploy.yml'

  workflow_run:
    workflows: ["IndexNow — Notify Search Engines"]
    types: [completed]
    branches: [main]

  # Ручной запуск (например, после изменений, не затрагивающих контент)
  workflow_dispatch:

permissions:
  contents: read   # читаем репозиторий
  pages:    write  # заливаем артефакт на Pages
  id-token: write  # OIDC-токен для actions/deploy-pages

# Если в очереди несколько деплоев — оставляем только последний
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Deploy after manual run, asset-only push, or after IndexNow completes (success or failure).
    # IndexNow failure must NOT block production deploy — the deploy gate validates independently.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout (последний коммит в main, включая cache-bust)
        uses: actions/checkout@v4
        uses: actions/checkout@v4  with:
        uses: actions/checkout@v4    token: ${{ secrets.ARENA_AGENT || secrets.GITHUB_TOKEN }}
          # Берём самый свежий коммит (в т.ч. авто-коммит indexnow.yml)
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Cache bust assets
        run: node scripts/cache-bust.js || echo "Cache bust skipped"

      - name: Static publication gates
        run: npm run validate:static-publication

      # РЕФАКТОРИНГ 5.0 (AGENTS-r245, 2026-06-20):
      # Dist deploy enabled. Full-document shadow-wrap restores 100% visual parity
      # for all landing/series pages. Build-time strangler produces complete dist.
      # See docs/refactor-2026/REFACTORING_5_0_PLAN.md.
      - name: Build Astro + copy legacy into dist
        run: npm run strangler:build:production-like

      - name: Verify page ownership in production-like dist
        run: npm run page-ownership:dist:production-like

      - name: Build Pagefind index in dist
        run: npm run pagefind:build:dist

      - name: Publish IndexNow key file from secret into dist
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          if [ -n "$KEY" ]; then
            printf '%s' "$KEY" > "dist/${KEY}.txt"
          else
            echo "INDEXNOW_KEY secret is empty — key file was not generated"
          fi

      - name: Verify Pagefind index and disable Jekyll filtering in dist
        run: |
          test -f dist/pagefind/pagefind.js
          touch dist/.nojekyll

      - name: Route-specific visual parity contract
        run: npm run visual:parity:production

      - name: Production-like dist publication audit
        run: node scripts/dist-publication-audit.js --require-pagefind --forbid-dev

      - name: Public URL contract compare on dist
        run: npm run contract:extract:dist && npm run contract:compare:dist

      - name: Dist JSON-LD parse audit
        run: npm run dist:jsonld:audit

      - name: Service Worker deploy-switch readiness
        run: npm run sw:dist:audit:deploy-switch

      # ───────────────────────────────────────────────────────────────
      # Dist JSON-LD parse audit (closes BUG-A2/PFV-002/LHV-003).
      # dist-publication-audit раньше был слеп к невалидному JSON-LD;
      # это поймало бы крах /karty/ishod/ ещё до деплоя.
      - name: Dist JSON-LD parse audit
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function walk(p) {
              return fs.statSync(p).isDirectory()
                ? fs.readdirSync(p).flatMap(n => walk(path.join(p, n)))
                : [p];
            }
            let errors = 0;
            for (const f of walk('dist').filter(p => p.endsWith('.html'))) {
              const html = fs.readFileSync(f, 'utf8');
              const re = /<script[^>]+application\\/ld\\+json[^>]*>([\\s\\S]*?)<\\/script>/g;
              let m;
              while ((m = re.exec(html)) !== null) {
                try { JSON.parse(m[1]); }
                catch (e) {
                  console.error(f + ': ' + e.message);
                  errors++;
                }
              }
            }
            if (errors) {
              console.error('JSON-LD parse errors: ' + errors);
              process.exit(1);
            } else {
              console.log('✅ All JSON-LD blocks parse cleanly');
            }
          "

      # Production-like URL contract compare (closes BUG-A9/PFV-001/LHV-002).
      - name: Dist URL contract compare
        run: npm run contract:compare:dist
      # ───────────────────────────────────────────────────────────────

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
