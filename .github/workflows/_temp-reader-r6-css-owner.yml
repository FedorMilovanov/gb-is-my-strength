name: Temporary Reader R6 CSS Owner

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-css-owner.yml"
      - "scripts/_temp_apply_r6_css_owner.py"

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact R6 branch
        uses: actions/checkout@v4
        with:
          ref: lane/reader-r6-state-platform-2026-07-24
          fetch-depth: 0

      - name: Apply canonical CSS ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/_temp_apply_r6_css_owner.py
          rm scripts/_temp_apply_r6_css_owner.py
          node --check js/reader-state.js
          node --check js/floating-cluster-controller.js
          node scripts/reader-state-regression-test.js
          node scripts/reader-preferences-regression-test.js
          git diff --check

      - name: Commit permanent ReaderState fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A js/reader-state.js js/floating-cluster-controller.js scripts/reader-state-regression-test.js scripts/_temp_apply_r6_css_owner.py
          git diff --cached --check
          git commit -m "[LANE lane/reader-r6-state-platform-2026-07-24][ALLOW_SHARED] fix(reader): publish canonical CSS progress contract"
          git push origin HEAD:lane/reader-r6-state-platform-2026-07-24
