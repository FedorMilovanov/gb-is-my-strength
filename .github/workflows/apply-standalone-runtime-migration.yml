name: Apply standalone runtime migration

on:
  push:
    branches:
      - feat/relationship-atlas-marathon-20260727
    paths:
      - .github/workflows/apply-standalone-runtime-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/relationship-atlas-marathon-20260727
          fetch-depth: 0

      - name: Replace legacy standalone action ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          mobile = Path('src/components/article-pilots/hermenevtika/HermenevtikaMobileBar.astro')
          replace_once(
              mobile,
              "import MobileChromeShell from '../_shared/MobileChromeShell.astro';\n",
              "import MobileChromeShell from '../_shared/MobileChromeShell.astro';\nimport ReaderActionsRuntime from '@/components/reader-platform/ReaderActionsRuntime.astro';\n",
          )
          replace_once(mobile, "---\n<MobileChromeShell\n", "---\n<ReaderActionsRuntime />\n<MobileChromeShell\n")
          replace_once(
              mobile,
              '<button class="hmbar-btn" id="hmShareBtn" type="button" aria-label="Поделиться">',
              '<button class="hmbar-btn" id="hmShareBtn" data-action="share" type="button" aria-label="Поделиться">',
          )
          replace_once(
              mobile,
              '<button class="hmsheet-action-btn" id="hmSheetShareBtn" type="button">',
              '<button class="hmsheet-action-btn" id="hmSheetShareBtn" data-action="share" type="button">',
          )
          replace_once(
              mobile,
              '<button class="hmsheet-action-btn" type="button" onclick="window.print()">',
              '<button class="hmsheet-action-btn" data-action="print" type="button">',
          )
          replace_once(
              mobile,
              "    const backBtn = document.getElementById('hmBackBtn');\n    if (backBtn) backBtn.addEventListener('click', () => {\n      const href = (backBtn as HTMLElement).dataset.homeHref;\n      if (href) window.location.href = href;\n    });\n\n",
              "",
          )
          replace_once(
              mobile,
              "    // share (both top-bar-adjacent bottom bar button and sheet footer button)\n    async function share() {\n      const url = location.href;\n      const title = document.title;\n      try {\n        if (navigator.share) { await navigator.share({ title, url }); return; }\n      } catch (_) {}\n      try { await navigator.clipboard.writeText(url); } catch (_) {}\n    }\n    document.getElementById('hmShareBtn')?.addEventListener('click', share);\n    document.getElementById('hmSheetShareBtn')?.addEventListener('click', share);\n\n",
              "    // Share and print are owned by ReaderActionsRuntime through data-action.\n\n",
          )

          rail = Path('src/components/article-pilots/_shared/ReaderRail.astro')
          replace_once(
              rail,
              "\n    const backBtn = document.querySelector('.hrail-back') as HTMLElement | null;\n    if(backBtn){\n      const href = backBtn.dataset.homeHref;\n      if(href) backBtn.addEventListener('click', () => { window.location.href = href; });\n    }\n",
              "\n    // Back, share and print are owned by ReaderActionsRuntime.\n",
          )

          herm = Path('src/components/article-pilots/hermenevtika/HermenevtikaBody.astro')
          replace_once(
              herm,
              '<script is:inline defer="" src="../../js/site.js?v=38b94307"></script>\n',
              '',
          )
          replace_once(
              herm,
              '     site.js при этом спокойно выходит из несуществующих элементов через null-safe querySelector. -->',
              '     действия рельса и мобильной панели принадлежат ReaderActionsRuntime; legacy site.js удалён. -->',
          )

          kdv = Path('src/components/article-pilots/kod-da-vinchi/KodDaVinchiPageFooter.astro')
          replace_once(
              kdv,
              '<script is:inline defer src="../../js/site.js?v=38b94307"></script>\n',
              '',
          )
          replace_once(
              kdv,
              ' *           legacy script tags, back-to-top button.\n',
              ' *           explicit runtime tags and reader action ownership.\n',
          )
          replace_once(
              kdv,
              ' * DOM/classes/IDs are byte-identical to the legacy HTML so site.js\n * selectors, CSS rules, and all legacy JS modules continue to match.\n',
              ' * DOM/classes/IDs remain stable while actions are delegated to the native\n * ReaderActionsRuntime rendered by the shared standalone mobile chrome.\n',
          )
          replace_once(
              kdv,
              '<!-- btocShareBtn is wired by site.js Share Dialog module -->\n',
              '<!-- Reader-level share/print/back actions are owned by ReaderActionsRuntime. -->\n',
          )
          replace_once(
              kdv,
              '<!-- Legacy runtime scripts (loaded verbatim; site.js is the monolith that drives\n     bottom-bar, TOC overlay, bookmark toast, share dialog, TTS, etc.).\n     Phase 6 JS decomposition will extract these modules one by one.\n     is:inline prevents Astro from resolving/bundling these paths. -->\n',
              '<!-- Explicit residual runtimes. Reader actions and standalone chrome no longer\n     depend on the legacy site.js monolith. is:inline preserves root asset URLs. -->\n',
          )
          PY

      - name: Commit source migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/article-pilots/hermenevtika/HermenevtikaMobileBar.astro \
                  src/components/article-pilots/hermenevtika/HermenevtikaBody.astro \
                  src/components/article-pilots/_shared/ReaderRail.astro \
                  src/components/article-pilots/kod-da-vinchi/KodDaVinchiPageFooter.astro
          git diff --cached --check
          git commit -m "refactor(reader): retire site.js from standalone articles"
          git push origin HEAD:feat/relationship-atlas-marathon-20260727
