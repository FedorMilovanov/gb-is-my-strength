name: Atlas Light SVG Filter Autofix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - '.github/workflows/atlas-light-svg-filter-autofix.yml'
      - 'scripts/atlas-light-svg-filter-autofix.py'
      - 'karty/_engine/map-engine.js'

concurrency:
  group: atlas-light-svg-filter-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.gate.outputs.approved }}
    steps:
      - name: Fail-closed approval decision
        id: gate
        shell: bash
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'autofix-approved') }}
          SYSTEM_LANE: ${{ contains(github.event.pull_request.labels.*.name, 'system') }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$APPROVED" != "true" || "$SYSTEM_LANE" != "true" ]]; then
            echo '::error::Autofix requires both autofix-approved and system labels.'
            exit 1
          fi
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo '::error::Autofix is restricted to same-repository pull requests.'
            exit 1
          fi
          echo 'approved=true' >> "$GITHUB_OUTPUT"

  write:
    needs: decision
    if: needs.decision.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Materialize exact light SVG palette fix
        run: python3 scripts/atlas-light-svg-filter-autofix.py

      - name: Validate bounded mutation
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          git diff --check
          changed="$(git diff --name-only)"
          [[ "$changed" == 'karty/_engine/map-engine.js' ]]
          grep -Fq "svgFilter:'brightness(1.015) saturate(1.035) contrast(1.01)'" karty/_engine/map-engine.js
          [[ "$(grep -Fc '.me-map[data-map-theme="light"] .me-canvas svg{filter:var(--me-svg-filter)}' karty/_engine/map-engine.js)" == '2' ]]

      - name: Commit bounded autofix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Exact light SVG filter state already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add karty/_engine/map-engine.js
          git commit -m 'fix(atlas): keep light SVG palette materially distinct'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
