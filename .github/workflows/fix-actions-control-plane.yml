name: Fix Actions control-plane contracts

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-actions-control-plane.yml

permissions:
  contents: write

concurrency:
  group: fix-actions-control-plane
  cancel-in-progress: false

jobs:
  migrate:
    if: github.head_ref == 'agent/github-actions-vnext-validation-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up exact release Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Apply deterministic policy migration
        run: node scripts/ci/migrate-actions-control-plane.mjs

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove workflow and source-link policy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-workflows.js
          node scripts/source-link-audit-contract-test.cjs
          node scripts/source-link-audit-source-contract-test.cjs

      - name: Prove release, provenance and TTS control plane
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-pipeline-contract-test.mjs
          node scripts/deployment-provenance-contract-test.mjs
          node scripts/tts-download-consent-contract-test.js
          node scripts/record-deployment-witness-contract-test.cjs
          node scripts/deployment-witness-ledger-source-contract-test.cjs

      - name: Lint release workflows
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-actionlint.mjs -no-color \
            .github/workflows/deploy.yml \
            .github/workflows/dist-dry-run.yml \
            .github/workflows/source-links.yml \
            .github/workflows/tts-download-consent.yml \
            .github/workflows/notify-on-failure.yml

      - name: Remove temporary migration machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/fix-actions-control-plane.yml \
            scripts/ci/migrate-actions-control-plane.mjs

      - name: Commit validated control-plane migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts docs/dependency-migrations .github/workflows
          git diff --cached --check
          git commit -m "ci(actions): synchronize immutable pins and contracts"
          git push origin HEAD:agent/github-actions-vnext-validation-20260731
