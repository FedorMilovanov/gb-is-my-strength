name: Map Keyboard Contract

on:
  pull_request:
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - scripts/map-panel-viewport-browser-test.js
      - scripts/map-authored-paths-browser-test.js
      - .github/workflows/map-keyboard-contract.yml
  push:
    branches:
      - main
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - scripts/map-panel-viewport-browser-test.js
      - scripts/map-authored-paths-browser-test.js
      - .github/workflows/map-keyboard-contract.yml

permissions:
  contents: read

concurrency:
  group: map-keyboard-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
      - name: Verify source keyboard policy
        run: node scripts/map-keyboard-contract-test.js
      - name: Verify viewport and authored-path sources
        run: |
          node --check scripts/map-panel-viewport-browser-test.js
          node --check scripts/map-authored-paths-browser-test.js
          node - <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('karty/_engine/map-engine.js', 'utf8');
          const required = [
            'map-engine.js v0.56',
            "version:'0.56.0',buildDate:'2026-07-25'",
            'cfg.archaeologyProjection',
            'max-height:calc(100% - max(8px,env(safe-area-inset-top)))',
            '.me-panel__head,.me-tabs,.me-nav{flex:0 0 auto}',
            'min-height:0;overflow-y:auto;overscroll-behavior:contain',
            'width:420px;max-height:calc(100% - 24px)',
            'const ROUTE_PATH_COLORS=Object.freeze',
            'const fallback=STAGE_COLORS[stageIndex]||STAGE_COLORS[0]',
            ":'me-arrow-'+(STAGE_COLORS[stageIndex]?stageIndex:0)",
            "source:'authored'",
            "source:'generated'",
            'data-route-source',
            'data-route-dash',
            "common(under,'underlay','me-route-underlay')",
            "common(path,'main','me-route-main')",
            'me-arrow-authored-'
          ];
          const missing = required.filter((needle) => !source.includes(needle));
          const staleLegacyArchaeology = /ARCHAEOLOGY_REFERENCES|_classifySource|_renderArchaeologyFooter/.test(source);
          if (missing.length || source.includes('stageIndex%STAGE_COLORS.length') || staleLegacyArchaeology) {
            console.error('Missing or stale map source contract:', {missing, staleModulo: source.includes('stageIndex%STAGE_COLORS.length'), staleLegacyArchaeology});
            process.exit(1);
          }
          console.log('PASS source map viewport, authored-path and v0.56 projection contracts');
          NODE
      - name: Lint workflow
        run: node scripts/run-actionlint.mjs -no-color .github/workflows/map-keyboard-contract.yml

  chromium-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/map-keyboard-http.log 2>&1 &
          echo $! > /tmp/map-keyboard-http.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/map-keyboard-http.log
          exit 1
      - name: Verify live map keyboard behavior
        shell: bash
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          MAP_SMOKE_ROUTES: ishod
        run: |
          set -o pipefail
          node scripts/map-browser-smoke.js 2>&1 | tee /tmp/map-keyboard-smoke.log
      - name: Upload keyboard smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-keyboard-smoke-${{ github.run_id }}
          path: /tmp/map-keyboard-smoke.log
          retention-days: 14
          if-no-files-found: warn
      - name: Stop source server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/map-keyboard-http.pid ]]; then
            kill "$(cat /tmp/map-keyboard-http.pid)" 2>/dev/null || true
          fi

  panel-viewport-contract:
    name: Panel viewport contract (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/map-panel-http.log 2>&1 &
          echo $! > /tmp/map-panel-http.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/map-panel-http.log
          exit 1
      - name: Verify mobile panel geometry
        shell: bash
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          MAP_PANEL_BROWSER: ${{ matrix.browser }}
          MAP_PANEL_EVIDENCE: /tmp/map-panel-evidence
        run: |
          set -o pipefail
          node scripts/map-panel-viewport-browser-test.js 2>&1 | tee /tmp/map-panel-${{ matrix.browser }}.log
      - name: Upload panel evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-panel-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            /tmp/map-panel-evidence/**
            /tmp/map-panel-${{ matrix.browser }}.log
          retention-days: 14
          if-no-files-found: warn
      - name: Stop source server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/map-panel-http.pid ]]; then
            kill "$(cat /tmp/map-panel-http.pid)" 2>/dev/null || true
          fi

  authored-path-contract:
    name: Authored route geometry (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/map-authored-http.log 2>&1 &
          echo $! > /tmp/map-authored-http.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/map-authored-http.log
          exit 1
      - name: Verify authored and fallback route geometry
        shell: bash
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          MAP_AUTHORED_BROWSER: ${{ matrix.browser }}
          MAP_AUTHORED_EVIDENCE: /tmp/map-authored-evidence
        run: |
          set -o pipefail
          node scripts/map-authored-paths-browser-test.js 2>&1 | tee /tmp/map-authored-${{ matrix.browser }}.log
      - name: Upload authored-path evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: map-authored-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            /tmp/map-authored-evidence/**
            /tmp/map-authored-${{ matrix.browser }}.log
          retention-days: 14
          if-no-files-found: warn
      - name: Stop source server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/map-authored-http.pid ]]; then
            kill "$(cat /tmp/map-authored-http.pid)" 2>/dev/null || true
          fi
