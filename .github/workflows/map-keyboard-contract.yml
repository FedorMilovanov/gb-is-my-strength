name: Map Keyboard Contract

on:
  pull_request:
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - .github/workflows/map-keyboard-contract.yml
  push:
    branches:
      - main
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - .github/workflows/map-keyboard-contract.yml

permissions:
  contents: write

jobs:
  apply-contract-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-keyboard-contract
          fetch-depth: 0
      - name: Apply deterministic engine patch
        run: python3 -c "import base64;exec(base64.b64decode(''))"
      - name: Verify, commit and push clean result
        shell: bash
        run: |
          set -euo pipefail
          node --check karty/_engine/map-engine.js
          node --check scripts/map-browser-smoke.js
          node scripts/map-keyboard-contract-test.js
          git config user.name "map-contract[bot]"
          git config user.email "map-contract[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(maps): isolate typing from keyboard shortcuts"
          git push origin HEAD:agent/map-keyboard-contract

  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source keyboard policy
        run: node scripts/map-keyboard-contract-test.js

  chromium-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/map-keyboard-http.log 2>&1 &
          echo $! > /tmp/map-keyboard-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/map-keyboard-http.log
          exit 1
      - name: Verify live map keyboard behavior
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          MAP_SMOKE_ROUTES: ishod,avraam
        run: node scripts/map-browser-smoke.js
      - name: Stop source server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/map-keyboard-http.pid ]]; then
            kill "$(cat /tmp/map-keyboard-http.pid)" 2>/dev/null || true
          fi
