name: Map Keyboard Contract

on:
  pull_request:
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - scripts/tmp-classify-map-smoke.py
      - .github/workflows/map-keyboard-contract.yml
  push:
    branches:
      - main
    paths:
      - karty/_engine/map-engine.js
      - scripts/map-keyboard-contract-test.js
      - scripts/map-browser-smoke.js
      - .github/workflows/map-keyboard-contract.yml

permissions:
  contents: write

jobs:
  apply-route-classification-once:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/map-keyboard-contract
          fetch-depth: 0
      - name: Classify shared-engine and legacy maps
        run: python3 scripts/tmp-classify-map-smoke.py
      - name: Commit smoke script only
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/map-browser-smoke.js
          git config user.name "map-contract[bot]"
          git config user.email "map-contract[bot]@users.noreply.github.com"
          git add scripts/map-browser-smoke.js
          git diff --cached --check
          git commit -m "test(maps): classify legacy map outside MapEngine smoke"
          git push origin HEAD:agent/map-keyboard-contract

  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify source keyboard policy
        run: node scripts/map-keyboard-contract-test.js

  chromium-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start source server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8090 --bind 127.0.0.1 >/tmp/map-keyboard-http.log 2>&1 &
          echo $! > /tmp/map-keyboard-http.pid
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/karty/ishod/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/map-keyboard-http.log
          exit 1
      - name: Verify live map keyboard behavior
        shell: bash
        env:
          AUDIT_BASE: http://127.0.0.1:8090
          MAP_SMOKE_ROUTES: ishod
        run: |
          set -o pipefail
          node scripts/map-browser-smoke.js 2>&1 | tee /tmp/map-keyboard-smoke.log
      - name: Upload keyboard smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: map-keyboard-smoke-${{ github.run_id }}
          path: /tmp/map-keyboard-smoke.log
          retention-days: 14
          if-no-files-found: warn
      - name: Stop source server
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/map-keyboard-http.pid ]]; then
            kill "$(cat /tmp/map-keyboard-http.pid)" 2>/dev/null || true
          fi
