name: TEMP Gill Mobile Layout Diagnostic

on:
  push:
    branches:
      - diagnostic/gill-mobile-layout-2026-07-22
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: temp-gill-mobile-layout-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'diagnostic/gill-mobile-layout-2026-07-22' || github.ref_name == 'diagnostic/gill-mobile-layout-2026-07-22'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostic/gill-mobile-layout-2026-07-22
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production-like build
        run: npm run strangler:build:production-like

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture layout audit summary
        shell: bash
        run: |
          set +e
          node scripts/gill-mobile-layout-audit.js
          code=$?
          set -e
          test -f reports/gill-mobile-layout-audit-2026-06-29/summary.json
          cp reports/gill-mobile-layout-audit-2026-06-29/summary.json .github/_temp-gill-mobile-layout-summary.json
          printf '%s\n' "$code" > .github/_temp-gill-mobile-layout-exit-code.txt

      - name: Remove diagnostic workflow and publish evidence
        run: |
          rm -f .github/workflows/_temp-gill-mobile-layout-diagnostic.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: capture Gill mobile layout failure summary'
          git push origin HEAD:diagnostic/gill-mobile-layout-2026-07-22
