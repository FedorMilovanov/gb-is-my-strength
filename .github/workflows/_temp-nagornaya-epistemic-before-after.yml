name: Temp Nagornaya epistemic before-after proof

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: temp-nagornaya-epistemic-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build exact PR head
        run: |
          npm run strangler:build:production-like
          cp -a dist /tmp/nagornaya-head-dist

      - name: Build exact main baseline
        run: |
          git worktree add --detach /tmp/nagornaya-base origin/main
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/nagornaya-base/node_modules
          cd /tmp/nagornaya-base
          npm run strangler:build:production-like
          cp -a dist /tmp/nagornaya-base-dist

      - name: Capture five before-after blocks
        shell: bash
        run: |
          mkdir -p reports/nagornaya-epistemic-before-after
          cat > /tmp/nagornaya-proof.mjs <<'JS'
          import { createServer } from 'node:http';
          import { readFile, stat, mkdir, writeFile } from 'node:fs/promises';
          import { join, extname } from 'node:path';
          import { chromium } from 'playwright';
          const roots={before:'/tmp/nagornaya-base-dist',after:'/tmp/nagornaya-head-dist'};
          const mime={'.html':'text/html; charset=utf-8','.css':'text/css; charset=utf-8','.js':'text/javascript; charset=utf-8','.json':'application/json; charset=utf-8','.svg':'image/svg+xml','.png':'image/png','.jpg':'image/jpeg','.webp':'image/webp','.woff2':'font/woff2'};
          function routeFile(root,pathname){const clean=decodeURIComponent(pathname.split('?')[0]).replace(/^\/+/, '');return join(root,clean,clean.endsWith('.html')?'':'index.html');}
          async function serve(root){const server=createServer(async(req,res)=>{try{const pathname=new URL(req.url||'/','http://127.0.0.1').pathname;let file=pathname.includes('.')&&!pathname.endsWith('/')?join(root,pathname.replace(/^\/+/,'')):routeFile(root,pathname);try{if((await stat(file)).isDirectory())file=join(file,'index.html');}catch{}const body=await readFile(file);res.writeHead(200,{'content-type':mime[extname(file).toLowerCase()]||'application/octet-stream','cache-control':'no-store'});res.end(body);}catch{res.writeHead(404);res.end('not found');}});await new Promise(r=>server.listen(0,'127.0.0.1',r));return{server,base:`http://127.0.0.1:${server.address().port}`};}
          const cases=[
            {id:'part1-observation',route:'/nagornaya/chast-1/',heading:'#ii-параметры-сравнения-матфей-и-лука',target:'#nagornaya-matthew-luke-observation-matrix'},
            {id:'part2-ipsissima',route:'/nagornaya/chast-2/',heading:'#vi-точность-передачи-слова-или-смысл',target:'#nagornaya-ipsissima-vox-models'},
            {id:'part2-sermon-models',route:'/nagornaya/chast-2/',heading:'#viii-одна-проповедь-две-проповеди-или-антология',target:'#nagornaya-sermon-identity-models'},
            {id:'part4-green',route:'/nagornaya/chast-4/',heading:'#v-ipsissima-verba-и-ipsissima-vox-жёсткая-граница-семинарии-',target:'#nagornaya-part4-green-model'},
            {id:'part4-thomas',route:'/nagornaya/chast-4/',heading:'#x-современные-угрозы-редакционная-критика-иисус-семинар-и-ск',target:'#nagornaya-part4-thomas-model'},
          ];
          const viewports=[{id:'mobile-390',width:390,height:844},{id:'desktop-1440',width:1440,height:900}];
          const before=await serve(roots.before),after=await serve(roots.after),browser=await chromium.launch({headless:true});const manifest=[];const out='reports/nagornaya-epistemic-before-after';await mkdir(out,{recursive:true});
          try{for(const item of cases){await mkdir(join(out,item.id),{recursive:true});for(const viewport of viewports){const context=await browser.newContext({viewport:{width:viewport.width,height:viewport.height}});const page=await context.newPage();
            const rb=await page.goto(before.base+item.route,{waitUntil:'load'});if(rb?.status()!==200)throw new Error(`${item.id} before HTTP ${rb?.status()}`);if(await page.locator(item.target).count())throw new Error(`${item.id} target unexpectedly exists in baseline`);const bh=page.locator(item.heading);await bh.waitFor({state:'attached',timeout:5000}).catch(()=>{});if(await bh.count()!==1)throw new Error(`${item.id} baseline heading count=${await bh.count()}`);await bh.scrollIntoViewIfNeeded();await page.waitForTimeout(150);const beforePath=join(out,item.id,`${viewport.id}-before.png`);await page.screenshot({path:beforePath,fullPage:false});
            const ra=await page.goto(after.base+item.route,{waitUntil:'load'});if(ra?.status()!==200)throw new Error(`${item.id} after HTTP ${ra?.status()}`);const target=page.locator(item.target);await target.waitFor({state:'attached',timeout:5000}).catch(()=>{});if(await target.count()!==1)throw new Error(`${item.id} target count=${await target.count()}`);await target.scrollIntoViewIfNeeded();await page.waitForTimeout(150);const afterPath=join(out,item.id,`${viewport.id}-after.png`);await page.screenshot({path:afterPath,fullPage:false});const box=await target.boundingBox();manifest.push({...item,viewport:viewport.id,beforePath,afterPath,targetBox:box});await context.close();}}
          }finally{await browser.close();await new Promise(r=>before.server.close(r));await new Promise(r=>after.server.close(r));}
          await writeFile(join(out,'manifest.json'),JSON.stringify({baseSha:process.env.BASE_SHA,headSha:process.env.HEAD_SHA,generatedAt:new Date().toISOString(),screenshots:manifest},null,2));console.log(`Captured ${manifest.length*2} screenshots for ${cases.length} blocks.`);
          JS
          set +e
          BASE_SHA="${{ github.event.pull_request.base.sha }}" HEAD_SHA="${{ github.event.pull_request.head.sha }}" node /tmp/nagornaya-proof.mjs 2>&1 | tee reports/nagornaya-epistemic-before-after/proof.log
          status=${PIPESTATUS[0]}
          echo "$status" > reports/nagornaya-epistemic-before-after/proof.exit-code
          exit "$status"

      - name: Upload before-after proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nagornaya-epistemic-before-after-${{ github.run_id }}
          path: reports/nagornaya-epistemic-before-after/**
          if-no-files-found: error
          retention-days: 14
