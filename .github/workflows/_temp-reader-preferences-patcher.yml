name: TEMP reader preferences patcher

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'lane/system-reader-preferences-foundation-2026-07-21'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize exact patcher
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/reader-preferences-patch.py
          echo 'd3ade8e3ec066101f363772c2c929bc0e4c9100c19d182560dac7f9166f9d3bd  /tmp/reader-preferences-patch.py' | sha256sum -c -
          python3 -m py_compile /tmp/reader-preferences-patch.py

      - name: Apply exact site-wide preference patch
        run: python3 /tmp/reader-preferences-patch.py

      - name: Synchronize canonical asset revisions
        run: |
          node scripts/cache-bust.js --write
          node scripts/cache-bust.js

      - name: Verify preference foundation
        run: |
          node --check js/reader-preferences-head.js
          node --check js/reader-preferences.js
          node scripts/reader-preferences-regression-test.js

      - name: Commit permanent source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "[LANE lane/system-reader-preferences-foundation-2026-07-21] feat(reader): connect global preferences site-wide"
          git push origin HEAD:lane/system-reader-preferences-foundation-2026-07-21
