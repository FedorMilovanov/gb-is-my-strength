name: TTS Download Consent

on:
  pull_request:
    paths:
      - "data/release-toolchain.json"
      - "js/vosk-tts-engine.js"
      - "js/floating-cluster-controller.js"
      - "css/tts-download-notice.css"
      - "scripts/cache-bust-assets.js"
      - "scripts/cache-bust.js"
      - "scripts/lib/cache-bust-workflow-policy.js"
      - "scripts/check-workflows.js"
      - "scripts/dist-publication-audit.js"
      - "src/lib/asset-version.js"
      - "scripts/release-candidate-lib.mjs"
      - "scripts/release-pipeline-contract-test.mjs"
      - "scripts/deployment-provenance-contract-test.mjs"
      - "scripts/write-deployment-provenance.mjs"
      - "scripts/verify-release-candidate.mjs"
      - "scripts/live-release-contract.mjs"
      - "scripts/tts-live-deployment-contract.mjs"
      - "scripts/record-deployment-witness.cjs"
      - "scripts/record-deployment-witness-contract-test.cjs"
      - "scripts/deployment-witness-ledger-source-contract-test.cjs"
      - "scripts/tts-download-consent-contract-test.js"
      - "scripts/tts-download-notice-browser-test.js"
      - "scripts/tts-engine-status-contract-test.js"
      - "scripts/tts-engine-lifecycle-browser-test.js"
      - "scripts/tts-status-route-browser-test.js"
      - "scripts/tts-mobile-notice-geometry-browser-test.js"
      - "scripts/workflow-linkage-regression-test.js"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/indexnow.yml"
      - ".github/workflows/deployment-witness-ledger.yml"
      - ".github/workflows/tts-download-consent.yml"
  push:
    branches: [main]
    paths:
      - "data/release-toolchain.json"
      - "js/vosk-tts-engine.js"
      - "js/floating-cluster-controller.js"
      - "css/tts-download-notice.css"
      - "scripts/cache-bust-assets.js"
      - "scripts/cache-bust.js"
      - "scripts/lib/cache-bust-workflow-policy.js"
      - "scripts/check-workflows.js"
      - "scripts/dist-publication-audit.js"
      - "src/lib/asset-version.js"
      - "scripts/release-candidate-lib.mjs"
      - "scripts/release-pipeline-contract-test.mjs"
      - "scripts/deployment-provenance-contract-test.mjs"
      - "scripts/write-deployment-provenance.mjs"
      - "scripts/verify-release-candidate.mjs"
      - "scripts/live-release-contract.mjs"
      - "scripts/tts-live-deployment-contract.mjs"
      - "scripts/record-deployment-witness.cjs"
      - "scripts/record-deployment-witness-contract-test.cjs"
      - "scripts/deployment-witness-ledger-source-contract-test.cjs"
      - "scripts/tts-download-consent-contract-test.js"
      - "scripts/tts-download-notice-browser-test.js"
      - "scripts/tts-engine-status-contract-test.js"
      - "scripts/tts-engine-lifecycle-browser-test.js"
      - "scripts/tts-status-route-browser-test.js"
      - "scripts/tts-mobile-notice-geometry-browser-test.js"
      - "scripts/workflow-linkage-regression-test.js"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/indexnow.yml"
      - ".github/workflows/deployment-witness-ledger.yml"
      - ".github/workflows/tts-download-consent.yml"

permissions:
  contents: read

concurrency:
  group: tts-download-consent-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Source and mutation contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.12
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Verify exact release toolchain
        run: |
          node -e "const assert=require('node:assert/strict'); const t=require('./data/release-toolchain.json'); assert.equal(process.version, 'v'+t.node)"
          test "$(npm --version)" = "$(node -p "require('./data/release-toolchain.json').npm")"

      - name: Check syntax with named diagnostics
        shell: bash
        run: |
          set -o pipefail
          mkdir -p reports
          {
            for file in \
              js/vosk-tts-engine.js \
              js/floating-cluster-controller.js \
              scripts/release-candidate-lib.mjs \
              scripts/release-pipeline-contract-test.mjs \
              scripts/deployment-provenance-contract-test.mjs \
              scripts/write-deployment-provenance.mjs \
              scripts/verify-release-candidate.mjs \
              scripts/live-release-contract.mjs \
              scripts/tts-live-deployment-contract.mjs \
              scripts/record-deployment-witness.cjs \
              scripts/record-deployment-witness-contract-test.cjs \
              scripts/deployment-witness-ledger-source-contract-test.cjs \
              scripts/tts-download-consent-contract-test.js \
              scripts/tts-download-notice-browser-test.js \
              scripts/tts-engine-status-contract-test.js \
              scripts/tts-engine-lifecycle-browser-test.js \
              scripts/tts-status-route-browser-test.js \
              scripts/tts-mobile-notice-geometry-browser-test.js \
              scripts/workflow-linkage-regression-test.js
            do
              echo "CHECK $file"
              node --check "$file"
            done
          } 2>&1 | tee reports/release-source-syntax.log

      - name: Download consent source contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/tts-download-consent-contract-test.js 2>&1 | tee reports/tts-source-download-consent.log

      - name: Engine status source contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/tts-engine-status-contract-test.js 2>&1 | tee reports/tts-source-engine-status.log

      - name: Deployment provenance schema contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/deployment-provenance-contract-test.mjs 2>&1 | tee reports/deployment-provenance-source.log

      - name: Build-once release pipeline contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/release-pipeline-contract-test.mjs 2>&1 | tee reports/release-pipeline-source.log

      - name: Deployment witness ledger unit contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/record-deployment-witness-contract-test.cjs 2>&1 | tee reports/deployment-witness-ledger-unit.log

      - name: Deployment witness ledger source contract
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/deployment-witness-ledger-source-contract-test.cjs 2>&1 | tee reports/deployment-witness-ledger-source.log

      - name: Verify existing asset revisions remain read-only clean
        run: node scripts/cache-bust.js

      - name: Verify workflow policy migration
        run: node scripts/check-workflows.js

      - name: Lint workflows
        run: |
          node scripts/run-actionlint.mjs -no-color .github/workflows/tts-download-consent.yml
          node scripts/run-actionlint.mjs -no-color .github/workflows/deploy.yml
          node scripts/run-actionlint.mjs -no-color .github/workflows/indexnow.yml
          node scripts/run-actionlint.mjs -no-color .github/workflows/deployment-witness-ledger.yml

      - name: Upload source contract diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tts-source-contract-${{ github.run_id }}
          path: |
            reports/release-source-syntax.log
            reports/tts-source-download-consent.log
            reports/tts-source-engine-status.log
            reports/deployment-provenance-source.log
            reports/release-pipeline-source.log
            reports/deployment-witness-ledger-unit.log
            reports/deployment-witness-ledger-source.log
          if-no-files-found: warn
          retention-days: 14

  browser-contract:
    name: Engine and real-route browser contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 22.12
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit

      - name: Run engine lifecycle fixtures
        run: |
          set -o pipefail
          {
            node scripts/tts-download-notice-browser-test.js
            node scripts/tts-engine-lifecycle-browser-test.js
          } 2>&1 | tee reports/tts-engine-lifecycle.log

      - name: Build production-like routes
        run: |
          set -o pipefail
          npm run strangler:build:production-like 2>&1 | tee reports/tts-production-build.log

      - name: Run real-route status matrix
        run: |
          set -o pipefail
          node scripts/tts-status-route-browser-test.js 2>&1 | tee reports/tts-route-status.log

      - name: Run mobile notice viewport geometry
        run: |
          set -o pipefail
          node scripts/tts-mobile-notice-geometry-browser-test.js 2>&1 | tee reports/tts-mobile-notice-geometry.log

      - name: Upload interaction evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tts-engine-status-browser-${{ github.run_id }}
          path: |
            reports/tts-download-notice-desktop.png
            reports/tts-download-notice-mobile-dark.png
            reports/tts-lifecycle-*.png
            reports/tts-route-*.png
            reports/tts-engine-lifecycle.log
            reports/tts-production-build.log
            reports/tts-route-status.log
            reports/tts-mobile-notice-geometry.log
          if-no-files-found: warn
          retention-days: 14
