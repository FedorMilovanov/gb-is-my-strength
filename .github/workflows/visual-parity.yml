name: Visual Parity Guard — pixel-diff

# Pixel-level visual parity check for Astro/strangler dist vs legacy root.
# Source-only DOM-marker checks are already in `validate:static-publication` chain
# (see scripts/visual-parity-contract.js). THIS workflow is the heavier pixel-level
# check that catches CSS/legacy micro-regressions invisible to DOM contracts.
#
# Schedule: weekly Monday 06:00 UTC — catches gradual visual drift.
# Trigger: workflow_dispatch — for manual visual review before deploy.
#
# Closes the AGENTS-r248 "TODO after Playwright stabilizes in Actions runner".
# Playwright system libs are installed via `npx playwright install --with-deps`.
# Failures do NOT block deploy.yml (which uses visual:parity:production, the
# DOM-marker gate). They create a GitHub Issue via notify-on-failure.yml.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "articles/**"
      - "nagornaya/**"
      - "baptisty-rossii/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "karty/**"
      - "data/**"
  schedule:
    # Weekly Monday morning — catches slow visual drift from CSS/legacy edits.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated routes (default: all landing routes).'
        required: false
        type: string
        default: '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/hard-texts/,/konfessii/,/pastor-series/,/map/'
      threshold:
        description: 'Pixel-diff threshold percent (default: 1.0).'
        required: false
        type: string
        default: '1.0'
      updateBaseline:
        description: 'If true, overwrite data/visual-parity-baseline.json with current measurements. Owner-approved only.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-parity-guard
  cancel-in-progress: true

jobs:
  pixel-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Build production-like dist
        # Reuses the existing build pipeline so screenshots compare the SAME artifact
        # that would ship to GitHub Pages.
        run: npm run strangler:build:production-like

      - name: Run pixel-diff screenshots
        id: screenshots
        env:
          ROUTES: ${{ github.event.inputs.routes || '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/nagornaya/chast-1/,/hard-texts/,/konfessii/,/pastor-series/,/map/' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '1.0' }}
        run: |
          echo "Routes: $ROUTES"
          echo "Threshold: ${THRESHOLD}%"
          node scripts/visual-parity-screenshots.js \
            --routes "$ROUTES" \
            --threshold "$THRESHOLD"
        continue-on-error: false

      - name: Verify against owner-approved baseline
        id: baseline
        # Allow the baseline check to fail the job so we see CI status correctly.
        run: node scripts/visual-parity-baseline.js
        continue-on-error: false

      - name: Optionally update baseline (manual owner-approved runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.updateBaseline == 'true'
        run: node scripts/visual-parity-baseline.js --update
        env:
          # Require an explicit acknowledgement so AI agents cannot silently
          # raise the allowed diff%.
          OWNER_APPROVED: 'true'

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-reports
          path: reports/visual-parity/
          retention-days: 14

      - name: Summarise outcome
        if: always()
        run: |
          echo "## Pixel-diff summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/visual-parity/summary.json ]; then
            echo "| Route | Desktop diff | Mobile diff |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---:|---:|" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const fs = require('fs');
              const s = JSON.parse(fs.readFileSync('reports/visual-parity/summary.json', 'utf8'));
              s.routes.forEach(r => {
                const d = r.viewports.desktop;
                const m = r.viewports.mobile;
                const pct = (n) => n === 0 ? '0.000' : n.toFixed(3);
                console.log(\`| \${r.route} | \${pct(d?.diffPct ?? 0)}% | \${pct(m?.diffPct ?? 0)}% |\`);
              });
            " >> "$GITHUB_STEP_SUMMARY"
          else
            echo "(no summary.json produced — check logs above)" >> "$GITHUB_STEP_SUMMARY"
          fi
