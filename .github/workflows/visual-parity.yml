name: Visual Parity Guard — pixel-diff

# Pixel-level visual parity diagnostics for Astro/strangler dist vs retained root HTML.
# Blocking render authority is derived from migration/page-ownership.json through
# data/visual-parity-authority.json. Root-vs-dist screenshots remain useful
# historical diagnostics, but they no longer define production ownership for
# Astro or explicitly retained built-app routes.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "articles/**"
      - "nagornaya/**"
      - "baptisty-rossii/**"
      - "konfessii/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "karty/**"
      - "data/**"
      - "migration/page-ownership.json"
      - "scripts/visual-parity-*.js"
      - "scripts/visual-parity-*.mjs"
      - "scripts/lib/visual-parity-authority.cjs"
      - "scripts/baptists-built-app-*.mjs"
      - "scripts/home-progressive-enhancement-browser-test.js"
      - ".github/workflows/visual-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "articles/**"
      - "nagornaya/**"
      - "baptisty-rossii/**"
      - "konfessii/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "karty/**"
      - "data/**"
      - "migration/page-ownership.json"
      - "scripts/visual-parity-*.js"
      - "scripts/visual-parity-*.mjs"
      - "scripts/lib/visual-parity-authority.cjs"
      - "scripts/baptists-built-app-*.mjs"
      - "scripts/home-progressive-enhancement-browser-test.js"
      - ".github/workflows/visual-parity.yml"
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated diagnostic root-vs-dist routes.'
        required: false
        type: string
        default: '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/nagornaya/istochniki/,/hard-texts/,/konfessii/,/pastor-series/,/map/'
      threshold:
        description: 'Diagnostic raw pixel-diff threshold percent (default: 1.0).'
        required: false
        type: string
        default: '1.0'
      updateBaseline:
        description: 'If true, overwrite diagnostic measurements after explicit owner review.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-parity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'

      - name: Verify screenshot settle ordering
        run: node scripts/visual-parity-screenshot-settle-contract-test.js

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Verify home progressive enhancement
        run: node scripts/home-progressive-enhancement-browser-test.js

      - name: Verify Home Refutations computed box model
        run: node scripts/visual-parity-home-refutations-box-model-browser-test.js

      - name: Capture legacy-vs-dist pixel diagnostics
        id: screenshots
        env:
          ROUTES: ${{ github.event.inputs.routes || '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/nagornaya/istochniki/,/hard-texts/,/konfessii/,/pastor-series/,/map/' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '1.0' }}
        run: |
          echo "Routes: $ROUTES"
          echo "Diagnostic threshold: ${THRESHOLD}%"
          node scripts/visual-parity-screenshots.js \
            --routes "$ROUTES" \
            --threshold "$THRESHOLD" \
            --warn-only

      - name: Measure Baptists built app
        run: |
          node scripts/baptists-built-app-measure.mjs \
            --out-json reports/baptists-built-app-measure.json \
            --out-md reports/baptists-built-app-measure.md
          node scripts/baptists-built-app-browser-measure.mjs \
            --runs 3 \
            --out reports/baptists-built-app-browser-measure.json

      - name: Verify transferred render authority
        id: authority
        run: |
          node scripts/visual-parity-authority-audit.mjs \
            --out-json reports/visual-parity-authority.json \
            --out-md reports/visual-parity-authority.md

      - name: Review retained legacy pixel baseline diagnostically
        id: baseline
        continue-on-error: true
        run: node scripts/visual-parity-baseline.js

      - name: Optionally update diagnostic measurements (manual owner-approved runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.updateBaseline == 'true'
        run: node scripts/visual-parity-baseline.js --update
        env:
          OWNER_APPROVED: 'true'

      - name: Upload screenshot and measurement artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-parity-reports
          path: |
            reports/visual-parity/
            reports/visual-parity-authority.json
            reports/visual-parity-authority.md
            reports/baptists-built-app-measure.json
            reports/baptists-built-app-measure.md
            reports/baptists-built-app-browser-measure.json
          retention-days: 14

      - name: Summarise outcome
        if: always()
        run: |
          {
            echo "## Pixel-diff and ownership summary"
            echo ""
            if [ -f reports/visual-parity/summary.json ]; then
              echo "| Route | Desktop diff | Mobile diff |"
              echo "|---|---:|---:|"
              node -e "
                const fs = require('fs');
                const s = JSON.parse(fs.readFileSync('reports/visual-parity/summary.json', 'utf8'));
                s.routes.forEach(r => {
                  const d = r.viewports.desktop;
                  const m = r.viewports.mobile;
                  const pct = (n) => n === 0 ? '0.000' : n.toFixed(3);
                  console.log(\`| \${r.route} | \${pct(d?.diffPct ?? 0)}% | \${pct(m?.diffPct ?? 0)}% |\`);
                });
              "
            else
              echo "(no visual summary produced — check logs above)"
            fi
            echo ""
            if [ -f reports/baptists-built-app-browser-measure.json ]; then
              node -e "
                const fs = require('fs');
                const r = JSON.parse(fs.readFileSync('reports/baptists-built-app-browser-measure.json', 'utf8'));
                console.log('### Baptists built app');
                console.log('');
                console.log('- Recommendation: **' + r.summary.recommendation + '**');
                console.log('- Median FCP: **' + r.summary.medianFcpMs + ' ms**');
                console.log('- Median load: **' + r.summary.medianLoadMs + ' ms**');
                console.log('- Median longest task: **' + r.summary.medianLongestTaskMs + ' ms**');
              "
            fi
          } >> "$GITHUB_STEP_SUMMARY"
