name: Visual Parity Guard — pixel-diff

# Pixel-level visual parity check for Astro/strangler dist vs legacy root.
# Source-only DOM-marker checks are already in `validate:static-publication` chain
# (see scripts/visual-parity-contract.js). THIS workflow is the heavier pixel-level
# witness for routes whose current owner still declares legacy-diff parity.
#
# Screenshot generation is diagnostic and must always reach the policy-aware
# owner-approved baseline step. Explicit native-contract routes are guarded by
# route-specific source/dist audits plus the all-route browser matrix instead of
# being forced to resemble retired legacy HTML.
#
# Failures do NOT block deploy.yml (which uses visual:parity:production, the
# DOM-marker gate). They create a GitHub Issue via notify-on-failure.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "articles/**"
      - "nagornaya/**"
      - "baptisty-rossii/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "karty/**"
      - "data/**"
      - "scripts/visual-parity-*.js"
      - ".github/workflows/visual-parity.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "articles/**"
      - "nagornaya/**"
      - "baptisty-rossii/**"
      - "css/**"
      - "js/**"
      - "images/**"
      - "karty/**"
      - "data/**"
      - "scripts/visual-parity-*.js"
      - ".github/workflows/visual-parity.yml"
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      routes:
        description: 'Comma-separated routes (default: landing routes plus the Nagornaya sources baseline).'
        required: false
        type: string
        default: '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/nagornaya/istochniki/,/hard-texts/,/konfessii/,/pastor-series/,/map/'
      threshold:
        description: 'Diagnostic raw pixel-diff threshold percent (default: 1.0).'
        required: false
        type: string
        default: '1.0'
      updateBaseline:
        description: 'If true, overwrite current measurements after explicit owner review.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: visual-parity-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixel-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Download fonts (if not in repo)
        run: node scripts/download-fonts.js || echo "Fonts download skipped"

      - name: Build production-like dist
        run: npm run strangler:build:production-like

      - name: Capture legacy-vs-dist pixel diagnostics
        id: screenshots
        env:
          ROUTES: ${{ github.event.inputs.routes || '/,/about/,/articles/,/biografii/,/karty/,/baptisty-rossii/,/nagornaya/,/nagornaya/istochniki/,/hard-texts/,/konfessii/,/pastor-series/,/map/' }}
          THRESHOLD: ${{ github.event.inputs.threshold || '1.0' }}
        run: |
          echo "Routes: $ROUTES"
          echo "Diagnostic threshold: ${THRESHOLD}%"
          node scripts/visual-parity-screenshots.js \
            --routes "$ROUTES" \
            --threshold "$THRESHOLD" \
            --warn-only

      - name: Verify against owner-approved route policy
        id: baseline
        run: node scripts/visual-parity-baseline.js

      - name: Optionally update measurements (manual owner-approved runs only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.updateBaseline == 'true'
        run: node scripts/visual-parity-baseline.js --update
        env:
          OWNER_APPROVED: 'true'

      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-parity-reports
          path: reports/visual-parity/
          retention-days: 14

      - name: Summarise outcome
        if: always()
        run: |
          {
            echo "## Pixel-diff summary"
            echo ""
            if [ -f reports/visual-parity/summary.json ]; then
              echo "| Route | Desktop diff | Mobile diff |"
              echo "|---|---:|---:|"
              node -e "
                const fs = require('fs');
                const s = JSON.parse(fs.readFileSync('reports/visual-parity/summary.json', 'utf8'));
                s.routes.forEach(r => {
                  const d = r.viewports.desktop;
                  const m = r.viewports.mobile;
                  const pct = (n) => n === 0 ? '0.000' : n.toFixed(3);
                  console.log(\`| \${r.route} | \${pct(d?.diffPct ?? 0)}% | \${pct(m?.diffPct ?? 0)}% |\`);
                });
              "
            else
              echo "(no summary.json produced — check logs above)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
