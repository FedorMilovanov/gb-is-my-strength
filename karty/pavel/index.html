<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="canonical" href="https://gospod-bog.ru/karty/pavel/">
<title>Путешествия Павла — интерактивная карта | Господь Бог — Сила Моя</title>
<meta name="description" content="3 миссионерских путешествия апостола Павла: 12 городов, 15 лет служения. Археология I века.">
<link rel="stylesheet" href="../_engine/map-engine.css">
<style>
  body { margin:0; background:#070a10; color:#e9e4d6; font-family:system-ui; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  #timeline { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:100; }
  .back { position:fixed; top:18px; left:18px; color:#9aa2ae; text-decoration:none; font-size:13px; z-index:120; }
  .back:hover { color:#e8c879; }
</style>
</head>
<body>
<h1 class="sr-only">Карта</h1>
<a href="../" class="back">← Назад к картам</a>
<div id="stage"></div>
<div id="timeline"></div>

<script src="../_engine/map-engine.js"></script>
<script src="../_engine/modules/timeline.js"></script>
<script>
(async () => {
  const route = await MapEngine.loadRoute('./route.json');
  const container = document.getElementById('stage');

  const map = MapEngine.createMap(container, route, {
    baseGeoUrl: '../_engine/base-geo.svg',
    onPlaceOpen: (place) => {
      alert(`Открыто: ${place.name}\n${place.arch || ''}`);
    }
  });

  // Timeline
  const timelineContainer = document.getElementById('timeline');
  const timeline = MapTimeline.createTimeline(timelineContainer, route.stages, {
    onStageClick: (stage, index) => {
      const place = route.places.find(p => p.stage === index);
      if (place) {
        map.flyTo(place.x, place.y, 0.9, 600);
        map.highlightPlace(place.id);
      }
    }
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') map.resetView();
    if (e.key === 'r' || e.key === 'R') map.resetView();
  });

  // Начальный зум
  setTimeout(() => {
    map.flyTo(620, 540, 0.85, 800);
  }, 400);
})();
</script>
</body>
</html>
