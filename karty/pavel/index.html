<style>
  body { margin:0; background:#070a10; color:#e9e4d6; font-family:system-ui; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .back { position:fixed; top:24px; left:24px; color:#9aa2ae; text-decoration:none; font-size:13px; z-index:300; }
  .back:hover { color:#e8c879; }
  .map-timeline-integrated button {
    background: none;
    border: 1px solid rgba(232,200,121,0.28);
    color: #c9b8a0;
    padding: 9px 18px;
    border-radius: 9999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    display: flex;
    align-items: center;
    gap: 9px;
    white-space: nowrap;
  }
  .map-timeline-integrated button:hover {
    border-color: #e8c879;
    color: #e8c879;
    transform: translateY(-1px);
  }
  .map-timeline-integrated button.active {
    background: #e8c879;
    color: #111;
    border-color: #e8c879;

<body>
<h1 class="sr-only">Карта</h1>
<a href="../" class="back">← Назад к картам</a>
<div id="stage"></div>

<script src="../_engine/map-engine.js"></script>
<script src="../_engine/modules/timeline-integrated.js"></script>
<script>
(async () => {
  const route = await MapEngine.loadRoute('./route.json');
  const container = document.getElementById('stage');

  const map = MapEngine.createMap(container, route, {
    baseGeoUrl: '../_engine/base-geo-premium.svg',
    onPlaceOpen: (place) => {
      const msg = document.createElement('div');
      msg.style.cssText = 'position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:rgba(13,17,26,0.96);padding:18px 26px;border-radius:14px;border:1px solid #e8c879;max-width:460px;text-align:center;z-index:400;box-shadow:0 10px 40px rgba(0,0,0,0.5)';
      msg.innerHTML = `<strong style="font-size:15px">${place.name}</strong><br><span style="font-size:13.5px;opacity:0.82;line-height:1.4">${place.arch || ''}</span>`;
      document.body.appendChild(msg);
      setTimeout(() => msg.remove(), 4800);
    }
  });

  const timeline = MapTimelineIntegrated.createIntegratedTimeline(container, route.stages, {
    route: route,
    map: map
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') map.resetView();
    if (e.key.toLowerCase() === 'r') map.resetView();
    if (e.key === 'ArrowRight') {
      const active = document.querySelector('.timeline-chip-premium.active');
      if (active && active.nextSibling) active.nextSibling.click();
    }
  });

  setTimeout(() => {
    map.flyTo(620, 540, 0.72, 1400);
  }, 700);
})();
</script>
