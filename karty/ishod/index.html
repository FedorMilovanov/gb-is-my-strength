<body>
<h1 class="sr-only">Исход из Египта</h1>
<div class="ishod-map" id="ishodApp">
  <div class="map-bar">
    <a href="../" class="map-bar__back">← Карты</a>
    <div class="map-bar__title">Исход из Египта <span>· 40 лет</span></div>
    <div class="map-bar__he">יְצִיאַת מִצְרַיִם</div>
    <div class="map-bar__stage" id="stageLabel">ВЫБЕРИТЕ МЕСТО НА КАРТЕ</div>
  </div>
  <div class="map-canvas" id="mapCanvas">
    <svg viewBox="0 0 1900 1430" id="mapSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="markerGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <radialGradient id="markerGrad0"><stop offset="0%" stop-color="var(--clr-stage-0)"/><stop offset="100%" stop-color="var(--clr-stage-0)" stop-opacity=".2"/></radialGradient>
        <radialGradient id="markerGrad1"><stop offset="0%" stop-color="var(--clr-stage-1)"/><stop offset="100%" stop-color="var(--clr-stage-1)" stop-opacity=".2"/></radialGradient>
        <radialGradient id="markerGrad2"><stop offset="0%" stop-color="var(--clr-stage-2)"/><stop offset="100%" stop-color="var(--clr-stage-2)" stop-opacity=".2"/></radialGradient>
        <radialGradient id="markerGrad3"><stop offset="0%" stop-color="var(--clr-stage-3)"/><stop offset="100%" stop-color="var(--clr-stage-3)" stop-opacity=".2"/></radialGradient>
        <radialGradient id="markerGrad4"><stop offset="0%" stop-color="var(--clr-stage-4)"/><stop offset="100%" stop-color="var(--clr-stage-4)" stop-opacity=".2"/></radialGradient>
        <radialGradient id="markerGrad5"><stop offset="0%" stop-color="var(--clr-stage-5)"/><stop offset="100%" stop-color="var(--clr-stage-5)" stop-opacity=".2"/></radialGradient>
      </defs>

      <!-- BASE GEO -->
      <g id="baseGeo"></g>

      <!-- STAGE PATHS -->
      <g id="stagePaths">
        <!-- Stage 0: Rameses → Succoth -->
        <path d="M210,880 Q245,900 280,920" class="stage-path stage-path--0"/>
        <!-- Stage 1: Succoth → Etham → Pi-Hahiroth -->
        <path d="M280,920 Q305,930 330,940 Q345,955 360,970" class="stage-path stage-path--1"/>
        <!-- Stage 2: Crossing → Marah → Elim -->
        <path d="M390,990 Q420,1000 450,1010 Q468,1025 485,1040" class="stage-path stage-path--2"/>
        <!-- Stage 3: Elim → Rephidim → Sinai -->
        <path d="M485,1040 Q510,1100 520,1150 Q540,1220 560,1280" class="stage-path stage-path--3"/>
        <!-- Stage 4: Sinai → Kadesh -->
        <path d="M560,1280 Q555,1150 552,1050 Q548,980 542,934" class="stage-path stage-path--4"/>
        <!-- Stage 5: Kadesh → Aaron → Plains Moab -->
        <path d="M542,934 Q580,950 622,972 Q655,850 690,800" class="stage-path stage-path--5"/>
      </g>

      <!-- PLACE MARKERS -->
      <g id="placeMarkers"></g>

      <!-- WAYPOINT MARKERS -->
      <g id="waypointMarkers"></g>

      <!-- PLACE LABELS -->
      <g id="placeLabels"></g>
    </svg>
  </div>

  <!-- Stories -->
  <div class="stories-bar" id="storiesBar"></div>

  <!-- Tour controls -->
  <div class="tour-bar" id="tourBar"></div>

  <!-- Detail panel -->
  <div class="ishod-panel" id="ishodPanel">
    <button class="ishod-panel__close" id="panelClose" aria-label="Закрыть">×</button>
    <div class="panel-tabs" id="panelTabs"></div>
    <div class="ishod-panel__scroll" id="panelContent"></div>
    <div class="panel-nav" id="panelNav"></div>
  </div>
</div>

<script>
'use strict';
(async function() {
  // --- LOAD ROUTE DATA ---
  const routeResp = await fetch('./route.json');
  const ROUTE = await routeResp.json();

  const PLACES = ROUTE.places;
  const STAGES = ROUTE.stages;
  const STORIES = ROUTE.stories;
  const WAYPOINTS = ROUTE.verified_waypoints || [];

  const STAGE_COLORS = ['#b8944b','#c9703e','#4a7c59','#b5453a','#8b5e3c','#2e5a7f'];

  // --- STATE ---
  let activeStory = 'main';
  let activePlace = null;
  let activeTab = 'story';
  let touring = false;
  let tourIdx = 0;

  // --- DOM ---
  const svg = document.getElementById('mapSvg');
  const canvas = document.getElementById('mapCanvas');
  const panel = document.getElementById('ishodPanel');
  const panelContent = document.getElementById('panelContent');
  const panelTabs = document.getElementById('panelTabs');
  const panelNav = document.getElementById('panelNav');
  const panelClose = document.getElementById('panelClose');
  const stageLabel = document.getElementById('stageLabel');
  const storiesBar = document.getElementById('storiesBar');
  const tourBar = document.getElementById('tourBar');
  const markersG = document.getElementById('placeMarkers');
  const waypointsG = document.getElementById('waypointMarkers');
  const labelsG = document.getElementById('placeLabels');
  const baseGeoG = document.getElementById('baseGeo');

  // --- LOAD BASE GEO ---
  try {
    const geoResp = await fetch('../_engine/base-geo.svg');
    const geoSvg = await geoResp.text();
    const parser = new DOMParser();
    const geoDoc = parser.parseFromString(geoSvg, 'image/svg+xml');
    const geoRoot = geoDoc.querySelector('svg');
    if (geoRoot) {
      // Copy all children of base-geo into our baseGeo group
      while (geoRoot.firstChild) {
        baseGeoG.appendChild(geoRoot.firstChild);
      }
    }
  } catch(e) { console.warn('Base geo load failed:', e); }

  // --- VIEWPORT ---
  let view = {x:0, y:600, w:1900, h:830};
  function applyView() { svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
  function flyTo(cx, cy, w, dur=800) {
    const from = {...view};
    const h = w * 1430/1900;
    const to = {x:cx-w/2, y:cy-h/2, w, h};
    const t0 = performance.now();
    function step(t) {
      let p = Math.min(1, (t - t0)/dur);
      p = 1 - Math.pow(1-p, 3);
      view.x = from.x + (to.x - from.x)*p;
      view.y = from.y + (to.y - from.y)*p;
      view.w = from.w + (to.w - from.w)*p;
      view.h = from.h + (to.h - from.h)*p;
      applyView();
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // --- PAN/ZOOM ---
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    if (e.target.closest('.ishod-marker')) return;
    canvas.setPointerCapture(e.pointerId);
    drag = {sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y};
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = canvas.getBoundingClientRect();
    const sc = r.width / view.w;
    view.x = drag.vx - (e.clientX - drag.sx)/sc;
    view.y = drag.vy - (e.clientY - drag.sy)/sc;
    applyView();
  });
  canvas.addEventListener('pointerup', () => { drag = null; });
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const sc = r.width / view.w;
    const mx = view.x + (e.clientX - r.left)/sc;
    const my = view.y + (e.clientY - r.top)/sc;
    const f = Math.exp(e.deltaY * 0.0014);
    const nw = Math.max(300, Math.min(2600, view.w * f));
    const k = nw / view.w;
    view.x = mx - (mx - view.x)*k;
    view.y = my - (my - view.y)*k;
    view.w = nw;
    view.h = nw * 1430/1900;
    applyView();
  }, {passive:false});

  // --- RENDER MARKERS ---
  function visiblePlaces() {
    const st = STORIES.find(s => s.id === activeStory);
    if (!st || !st.place_ids) return PLACES;
    const ids = new Set(st.place_ids);
    return PLACES.filter(p => ids.has(p.id));
  }

  function renderMarkers() {
    markersG.innerHTML = '';
    labelsG.innerHTML = '';
    const vis = visiblePlaces();
    const visIds = new Set(vis.map(p => p.id));

    PLACES.forEach(p => {
      const isVis = visIds.has(p.id);
      const stageClr = STAGE_COLORS[p.stage] || STAGE_COLORS[0];
      const isActive = activePlace === p.id;
      const opacity = isVis ? 1 : 0.2;

      // Marker circle
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class','ishod-marker' + (isActive ? ' ishod-marker--active' : ''));
      g.setAttribute('data-place-id', p.id);
      g.style.opacity = opacity;
      g.style.cursor = isVis ? 'pointer' : 'default';
      g.addEventListener('click', () => { if (isVis) openPlace(p); });

      const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circle.setAttribute('cx', p.x);
      circle.setAttribute('cy', p.y);
      circle.setAttribute('r', isActive ? 10 : 7);
      circle.setAttribute('fill', stageClr);
      circle.setAttribute('stroke','#fff');
      circle.setAttribute('stroke-width', isActive ? 3 : 1.5);
      circle.setAttribute('filter', isActive ? 'url(#markerGlow)' : '');
      g.appendChild(circle);

      // Stage number
      const num = document.createElementNS('http://www.w3.org/2000/svg','text');
      num.setAttribute('x', p.x);
      num.setAttribute('y', p.y + 1);
      num.setAttribute('text-anchor','middle');
      num.setAttribute('dominant-baseline','central');
      num.setAttribute('fill','#fff');
      num.setAttribute('font-size','7');
      num.setAttribute('font-weight','700');
      num.textContent = p.stage + 1;
      g.appendChild(num);

      markersG.appendChild(g);

      // Label
      const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
      const lx = p.side === 'l' ? p.x - 14 : p.x + 14;
      const anchor = p.side === 'l' ? 'end' : 'start';
      lbl.setAttribute('x', lx);
      lbl.setAttribute('y', p.y + 3);
      lbl.setAttribute('text-anchor', anchor);
      lbl.setAttribute('dominant-baseline','central');
      lbl.setAttribute('fill', isVis ? 'var(--clr-text)' : 'var(--clr-muted)');
      lbl.setAttribute('font-size','9');
      lbl.setAttribute('font-family','Georgia,serif');
      lbl.setAttribute('opacity', isVis ? 1 : 0.2);
      lbl.textContent = p.name;
      labelsG.appendChild(lbl);
    });

    // Waypoints
    waypointsG.innerHTML = '';
    WAYPOINTS.forEach(wp => {
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('opacity','0.5');
      const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx', wp.x); c.setAttribute('cy', wp.y);
      c.setAttribute('r', 3); c.setAttribute('fill','var(--clr-gold)');
      c.setAttribute('stroke','var(--clr-gold)'); c.setAttribute('stroke-width',1);
      g.appendChild(c);
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', wp.x+8); t.setAttribute('y', wp.y+3);
      t.setAttribute('fill','var(--clr-muted)'); t.setAttribute('font-size','7');
      t.textContent = wp.name;
      g.appendChild(t);
      waypointsG.appendChild(g);
    });
  }

  // --- PANEL ---
  function getPlaceIdx() {
    const vis = visiblePlaces();
    return vis.findIndex(p => p.id === activePlace);
  }

  function openPlace(place) {
    activePlace = place.id;
    activeTab = 'story';
    panel.classList.add('ishod-panel--open');
    stageLabel.textContent = STAGES[place.stage]?.t?.toUpperCase() || '';
    renderMarkers();
    renderPanel();
    flyTo(place.x, place.y, 800, 700);
  }

  function closePanel() {
    panel.classList.remove('ishod-panel--open');
    activePlace = null;
    stageLabel.textContent = 'ВЫБЕРИТЕ МЕСТО НА КАРТЕ';
    renderMarkers();
  }

  panelClose.addEventListener('click', closePanel);

  function renderPanel() {
    if (!activePlace) return;
    const place = PLACES.find(p => p.id === activePlace);
    if (!place) return;

    // Tabs
    const tabKeys = ['story'];
    if (place.bible) tabKeys.push('bible');
    if (place.arch) tabKeys.push('arch');
    if (place.he_deep) tabKeys.push('he');
    if (place.dispute) tabKeys.push('dispute');
    if (place.photos && place.photos.length) tabKeys.push('photos');
    if (place.bible_extra) tabKeys.push('extra');
    const tabLabels = {story:'Сюжет',bible:'Писание',arch:'Археология',he:'Иврит',dispute:'Дискуссия',photos:'Фото',extra:'Библ.контекст'};

    panelTabs.innerHTML = tabKeys.map(k =>
      `<button class="panel-tab${k===activeTab?' panel-tab--active':''}" data-tab="${k}">${tabLabels[k]}</button>`
    ).join('');

    panelTabs.querySelectorAll('.panel-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        renderPanel();
      });
    });

    // Content
    let html = `<h2>${place.name}</h2>`;
    if (place.he) html += `<div class="ishod-panel__he">${place.he}</div>`;
    html += `<div class="ishod-panel__kick">${place.kick}</div>`;
    html += `<div class="ishod-panel__meta"><span>${place.id1||''}</span><span>${place.id2||''}</span><span>${place.ep1||''}</span></div>`;

    if (activeTab === 'story' && place.story) html += `<div class="ishod-panel__story">${place.story}</div>`;
    if (activeTab === 'bible' && place.bible) html += place.bible;
    if (activeTab === 'arch' && place.arch) html += place.arch;
    if (activeTab === 'he' && place.he_deep) html += place.he_deep;
    if (activeTab === 'dispute' && place.dispute) html += place.dispute;
    if (activeTab === 'extra' && place.bible_extra) html += place.bible_extra;
    if (activeTab === 'photos' && place.photos) {
      html += '<div style="display:flex;flex-direction:column;gap:.75rem">';
      place.photos.forEach(ph => {
        html += `<div><img src="${ph.thumb||ph.src}" alt="${ph.label||''}" loading="lazy" style="width:100%;border-radius:6px;display:block"><div style="font-size:.7rem;color:var(--clr-muted);margin-top:.2rem">${ph.label||''} · ${ph.credit||''}</div></div>`;
      });
      html += '</div>';
    }

    panelContent.innerHTML = html;

    // Nav
    const vis = visiblePlaces();
    const idx = getPlaceIdx();
    panelNav.innerHTML = `
      <button ${idx<=0?'disabled':''} id="btnPrev">← ${idx>0 ? vis[idx-1].name : ''}</button>
      <div class="place-counter">${idx+1} из ${vis.length}</div>
      <button ${idx>=vis.length-1?'disabled':''} id="btnNext">${idx<vis.length-1 ? vis[idx+1].name : ''} →</button>
    `;
    document.getElementById('btnPrev')?.addEventListener('click', () => { if (idx>0) openPlace(vis[idx-1]); });
    document.getElementById('btnNext')?.addEventListener('click', () => { if (idx<vis.length-1) openPlace(vis[idx+1]); });
  }

  // --- STORIES ---
  function renderStories() {
    storiesBar.innerHTML = STORIES.map(s =>
      `<button class="story-chip${s.id===activeStory?' story-chip--active':''}" data-story="${s.id}">${s.label}</button>`
    ).join('');
    storiesBar.querySelectorAll('.story-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeStory = chip.dataset.story;
        activePlace = null;
        closePanel();
        renderStories();
        renderMarkers();
        renderTour();
        const st = STORIES.find(s => s.id === activeStory);
        if (st?.viewport) flyTo(st.viewport[0], st.viewport[1], st.viewport[2], 800);
      });
    });
  }

  // --- TOUR ---
  function renderTour() {
    const st = STORIES.find(s => s.id === activeStory);
    const stageIds = st?.stage_ids || [0,1,2,3,4,5];
    tourBar.innerHTML = `
      <button class="tour-btn${touring?' tour-btn--active':''}" id="tourToggle">${touring ? '⏸ Стоп' : '▶ Тур'}</button>
      ${STAGES.filter((_,i) => stageIds.includes(i)).map((stg,i) =>
        `<span class="tour-stage${touring&&i===tourIdx?' tour-stage--current':''}${touring&&i<tourIdx?' tour-stage--past':''}" data-idx="${i}">${stg.n}</span>`
      ).join('')}
    `;

    document.getElementById('tourToggle')?.addEventListener('click', () => {
      touring = !touring;
      if (touring) { tourIdx = 0; runTourStep(); }
      else { stageLabel.textContent = 'ТУР ОСТАНОВЛЕН'; }
      renderTour();
    });

    tourBar.querySelectorAll('.tour-stage').forEach(el => {
      el.addEventListener('click', () => {
        tourIdx = parseInt(el.dataset.idx);
        const stage = STAGES[stageIds[tourIdx]];
        const place = PLACES.find(p => p.stage === stageIds[tourIdx] && visiblePlaces().some(v => v.id === p.id));
        if (place) openPlace(place);
      });
    });
  }

  let tourTimer;
  function runTourStep() {
    if (!touring) return;
    const st = STORIES.find(s => s.id === activeStory);
    const stageIds = st?.stage_ids || [0,1,2,3,4,5];
    if (tourIdx >= stageIds.length) { touring = false; renderTour(); return; }
    const sid = stageIds[tourIdx];
    const place = PLACES.find(p => p.stage === sid && visiblePlaces().some(v => v.id === p.id));
    if (place) { openPlace(place); stageLabel.textContent = STAGES[sid]?.t?.toUpperCase() || ''; }
    renderTour();
    tourTimer = setTimeout(() => { tourIdx++; runTourStep(); }, 2500);
  }

  // --- INIT ---
  applyView();
  renderMarkers();
  renderStories();
  renderTour();

  // Open first place on load
  setTimeout(() => {
    const first = visiblePlaces()[0];
    if (first) flyTo(first.x, first.y, 800, 0);
  }, 300);

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closePanel();
    if (e.key === 'ArrowRight' && activePlace) { const vis=visiblePlaces(); const i=getPlaceIdx(); if(i<vis.length-1) openPlace(vis[i+1]); }
    if (e.key === 'ArrowLeft' && activePlace) { const vis=visiblePlaces(); const i=getPlaceIdx(); if(i>0) openPlace(vis[i-1]); }
  });

  // Hash navigation
  window.addEventListener('hashchange', () => {
    const h = location.hash.replace('#','');
    const [cmd, val] = h.split('=');
    if (cmd === 'place') { const p = PLACES.find(p=>p.id===val); if (p) openPlace(p); }
    if (cmd === 'story') { activeStory = val; renderStories(); renderMarkers(); renderTour(); }
  });

  // Init hash
  if (location.hash) {
    const h = location.hash.replace('#','');
    const [cmd, val] = h.split('=');
    if (cmd === 'story') { activeStory = val; renderStories(); renderMarkers(); renderTour(); }
    if (cmd === 'place') { const p = PLACES.find(p=>p.id===val); if (p) setTimeout(()=>openPlace(p),500); }
  }
})();
</script>
</body>
</html>
