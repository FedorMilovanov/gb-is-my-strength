<style>
  :root{
    --gold:#e8c879; --gold-soft:rgba(232,200,121,.55); --gold-dim:rgba(232,200,121,.22);
    --panel:rgba(13,17,26,.92); --panel-line:rgba(232,200,121,.28);
    --txt:#e9e4d6; --txt-dim:#9aa2ae; --lot:#e0813f; --war:#cf5b6b; --cand:#9b8cf0;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    --serif:Georgia,"Times New Roman",serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#070a10;color:var(--txt);font-family:var(--sans);-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #stage{position:fixed;inset:0}
  svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  svg.dragging{cursor:grabbing}
  svg.dragging .pulse{animation-play-state:paused}
  text{user-select:none;pointer-events:none}
  .sea-label{font-family:var(--serif);fill:#7fa7c4;opacity:.55;letter-spacing:.55em;font-style:italic;transition:opacity .5s}
  .region-label{font-family:var(--serif);fill:#cdbd95;opacity:.4;letter-spacing:.5em;transition:opacity .5s}
  .region-he{fill:#cdbd95;opacity:.3;letter-spacing:.08em;transition:opacity .5s}
  svg.z2 .region-label,svg.z2 .region-he{opacity:.07}
  svg.z2 .sea-label{opacity:.2}
  .mk-label{font-family:var(--serif);fill:#f5f0e4;paint-order:stroke;stroke:rgba(5,8,14,.9);stroke-width:3.5px;font-size:15px;letter-spacing:.04em}
  .mk-he{fill:var(--gold);opacity:.85;font-size:11px;paint-order:stroke;stroke:rgba(7,10,16,.85);stroke-width:2.5px}
  .mk-sub{fill:#9aa2ae;font-size:9.5px;letter-spacing:.12em;paint-order:stroke;stroke:rgba(7,10,16,.8);stroke-width:2px}
  .marker{cursor:pointer;pointer-events:all;will-change:transform;-webkit-tap-highlight-color:transparent}
  .marker:hover{filter:drop-shadow(0 0 12px rgba(232,200,121,.75)) drop-shadow(0 0 4px rgba(232,200,121,.4));transform:scale(1.08);transition:filter .15s ease,transform .15s cubic-bezier(.22,1,.36,1)}
  .marker{transform-origin:center center;transform-box:fill-box;transition:filter .2s ease,transform .2s ease}
  .marker.active{filter:drop-shadow(0 0 16px rgba(232,200,121,.9)) drop-shadow(0 0 6px rgba(232,200,121,.5));transform:scale(1.15)}
  @keyframes markerRipple{0%{r:8;opacity:.6}100%{r:28;opacity:0}}
  .marker-ripple{animation:markerRipple .6s cubic-bezier(.2,.8,.2,1) forwards;pointer-events:none}
  @media(max-width:760px){.marker .halo{r:18}}
  .marker .halo{opacity:0;transition:opacity .2s}
  .marker:hover .halo,.marker.active .halo{opacity:1;transition:opacity .15s}
  .marker.active .core{fill:#fff}
  .marker.active .halo{opacity:1;animation:pulse 1.8s ease-out infinite}
  .marker.active{filter:drop-shadow(0 0 8px rgba(232,200,121,.55))}
  .pulse{animation:pulse 2.6s ease-out infinite;transform-origin:center;transform-box:fill-box;will-change:transform,opacity}
  @keyframes pulseLot{0%{opacity:.65;transform:scale(.4)}65%{opacity:0;transform:scale(1.5)}100%{opacity:0;transform:scale(1.5)}}
  .marker.lot-type .pulse{animation-name:pulseLot;animation-duration:2s}
  @keyframes pulse{0%{opacity:.75;transform:scale(.35)}60%{opacity:.25;transform:scale(1.4)}100%{opacity:0;transform:scale(1.65)}}
  .lbl-z1,.lbl-z2{opacity:0;transition:opacity .35s}
  svg.z1 .lbl-z1{opacity:1} svg.z2 .lbl-z2{opacity:1}
  .ctx-dot{cursor:pointer;pointer-events:all}
  .route{fill:none;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:opacity .4s,stroke-width .3s;pointer-events:none}
  .route.gsap-animating{animation:none}
  .route.dim{opacity:.13}
  .route.hot{filter:url(#glow);stroke-width:3px!important}
  #panel{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:92vw;background:var(--panel);border-left:1px solid var(--panel-line);transform:translateX(100%);transition:transform .42s cubic-bezier(.22,1,.36,1);z-index:100;display:flex;flex-direction:column}
  #panel.open{transform:translateX(0)}
  .panel-header{padding:18px 20px 14px;border-bottom:1px solid var(--panel-line);display:flex;align-items:center;justify-content:space-between}
  .panel-header h2{font-family:var(--serif);font-size:19px;color:#f4eedd;margin:0}
  .panel-header .he{font-size:13px;color:var(--gold);margin-left:8px}
  .panel-close{background:none;border:none;color:var(--txt-dim);font-size:22px;cursor:pointer;padding:8px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
  .panel-body{flex:1;overflow-y:auto;padding:18px 20px 24px;font-size:14px;line-height:1.6}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(232,200,121,.25);border-radius:3px}
  .panel-meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 16px}
  .panel-meta span{font-size:11px;padding:3px 9px;border:1px solid var(--panel-line);border-radius:999px;color:var(--gold-soft)}
  .panel-section{margin-top:18px}
  .panel-section h4{font-size:12px;letter-spacing:.14em;color:var(--gold-soft);margin-bottom:8px;text-transform:uppercase}
  .panel-arch{background:rgba(232,200,121,.06);padding:12px 14px;border-radius:8px;font-size:13px;line-height:1.55}
  .timeline{display:flex;gap:4px;margin:14px 0;flex-wrap:wrap}
  .timeline-stage{padding:6px 12px;border:1px solid var(--panel-line);border-radius:999px;font-size:12px;color:var(--txt-dim);cursor:pointer;transition:all .2s}
  .timeline-stage.active{background:var(--gold);color:#111;border-color:var(--gold)}
  .timeline-stage:hover{border-color:var(--gold)}
  .stories{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .story-chip{padding:5px 11px;border:1px solid var(--panel-line);border-radius:999px;font-size:12px;color:var(--txt-dim);cursor:pointer;transition:all .2s}
  .story-chip.active{background:rgba(232,200,121,.12);border-color:var(--gold);color:var(--gold)}
  .story-chip:hover{border-color:var(--gold)}
  #controls{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:110;background:rgba(13,17,26,.92);padding:6px;border-radius:999px;border:1px solid var(--panel-line)}
  #controls button{background:none;border:1px solid var(--panel-line);color:var(--txt);padding:8px 16px;border-radius:999px;font-size:13px;cursor:pointer;transition:all .2s}
  #controls button:hover{border-color:var(--gold);color:var(--gold)}
  #controls button.active{background:var(--gold);color:#111;border-color:var(--gold)}
  .back-link{position:fixed;top:18px;left:18px;z-index:120;color:var(--txt-dim);text-decoration:none;font-size:13px;display:flex;align-items:center;gap:6px}
  .back-link:hover{color:var(--gold)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
  @media(max-width:860px){
    #panel{width:100%;max-width:100%;border-left:none;border-top:1px solid var(--panel-line)}
    #controls{bottom:12px}
  }
</style>

<body>
<a href="../" class="back-link">← Назад к картам</a>
<h1 class="sr-only">Исход из Египта — интерактивная карта</h1>
<div id="stage"></div>

<div id="panel">
  <div class="panel-header">
    <div>
      <h2 id="panel-title"></h2>
      <span class="he" id="panel-he"></span>
    </div>
    <button class="panel-close" data-action="close-panel" aria-label="Закрыть">×</button>
  </div>
  <div class="panel-body">
    <div class="panel-meta" id="panel-meta"></div>
    
    <div class="panel-section">
      <h4>Описание</h4>
      <p id="panel-desc"></p>
    </div>

    <div class="panel-section" id="panel-arch-section" style="display:none">
      <h4>Археологический контекст</h4>
      <div class="panel-arch" id="panel-arch"></div>
    </div>

    <div class="panel-section">
      <h4>Этап маршрута</h4>
      <div class="timeline" id="panel-timeline"></div>
    </div>

    <div class="panel-section">
      <h4>Сюжеты</h4>
      <div class="stories" id="panel-stories"></div>
    </div>
  </div>
</div>

<div id="controls">
  <button data-action="start-tour">▶ Тур по этапам</button>
  <button data-action="reset-view">Сбросить вид</button>
  <button data-action="next-story">Следующий сюжет</button>
</div>

<script src="../_engine/map-engine.js"></script>
<script>
(async function() {
  const route = await (await fetch('./route.json')).json();
  const map = MapEngine.createMap(document.getElementById('stage'), route, {
    backUrl: '../',
    baseGeoUrl: '../_engine/base-geo.svg',
    tourDelay: 2600,
    onPlaceOpen: (place) => {
      document.getElementById('panel-title').textContent = place.name;
      document.getElementById('panel-he').textContent = place.he || '';
      document.getElementById('panel-desc').textContent = place.desc || 'Ключевой пункт маршрута Исхода.';
      
      const meta = document.getElementById('panel-meta');
      meta.innerHTML = `
        <span>Этап ${place.stage + 1}</span>
        ${place.arch ? `<span>Археология</span>` : ''}
        ${place.he ? `<span>Иврит</span>` : ''}
      `;
      
      const archSection = document.getElementById('panel-arch-section');
      if (place.arch) {
        document.getElementById('panel-arch').textContent = place.arch;
        archSection.style.display = 'block';
      } else {
        archSection.style.display = 'none';
      }
      
      document.getElementById('panel').classList.add('open');
    }
  });
  
  window._ishodMap = map;
  
  // Keyboard support
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePanel();
    if (e.key.toLowerCase() === 't') startTour();
  });
})();

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

function startTour() {
  if (window._ishodMap && window._ishodMap.startTour) {
    window._ishodMap.startTour();
  }
}

function resetView() {
  if (window._ishodMap && window._ishodMap.resetView) {
    window._ishodMap.resetView();
  }
}

function nextStory() {
  if (window._ishodMap && window._ishodMap.nextStory) {
    window._ishodMap.nextStory();
  }
}
</script>
</body>
</html>
<script>
document.addEventListener('click', function(e) {
  const action = e.target.closest('[data-action]')?.dataset.action;
  if (!action) return;
  
  if (action === 'close-panel') closePanel();
  if (action === 'start-tour') startTour();
  if (action === 'reset-view') resetView();
  if (action === 'next-story') nextStory();
});
</script>
