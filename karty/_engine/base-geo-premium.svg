<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1430" viewBox="0 0 1900 1430">
  <defs>
    <!-- Более богатые градиенты -->
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1629"/>
      <stop offset="50%" stop-color="#0f2138"/>
      <stop offset="100%" stop-color="#08141f"/>
    </linearGradient>
    
    <linearGradient id="desertGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2418"/>
      <stop offset="100%" stop-color="#1f1a12"/>
    </linearGradient>
    
    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c261b"/>
      <stop offset="100%" stop-color="#221d15"/>
    </linearGradient>
    
    <!-- Текстура пустыни -->
    <pattern id="desertTexture" patternUnits="userSpaceOnUse" width="80" height="80">
      <rect width="80" height="80" fill="#2a2418"/>
      <circle cx="20" cy="25" r="0.8" fill="#3a3224" opacity="0.4"/>
      <circle cx="55" cy="60" r="1.1" fill="#3a3224" opacity="0.35"/>
      <circle cx="38" cy="12" r="0.7" fill="#3a3224" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Фон моря (Средиземное + Красное + Персидский залив) -->
  <rect width="1900" height="1430" fill="#0a1629"/>
  
  <!-- Средиземное море -->
  <path d="M0,0 Q480,180 920,120 Q1380,90 1900,210 L1900,0 Z" fill="url(#seaGrad)"/>
  
  <!-- Красное море + Акаба -->
  <path d="M820,620 Q920,780 1020,920 Q1080,1050 980,1180 Q860,1280 720,1190 Q680,980 820,620" fill="#0f2138"/>
  
  <!-- Основная суша -->
  <path d="M200,180 Q480,220 820,280 Q1120,320 1380,260 Q1620,310 1900,240 L1900,1430 L0,1430 L0,180 Z" fill="url(#landGrad)"/>
  
  <!-- Пустыня Синай + Негев -->
  <path d="M820,620 Q920,780 1020,920 Q980,1180 720,1190 Q680,980 820,620" fill="url(#desertTexture)"/>
  
  <!-- Горы (более детализированные) -->
  <!-- Синайские горы -->
  <path d="M920,820 L980,740 L1040,810 L1080,760 L1120,830" fill="none" stroke="#3a3224" stroke-width="18" stroke-opacity="0.6"/>
  <path d="M920,820 L980,740 L1040,810 L1080,760 L1120,830" fill="none" stroke="#2a2418" stroke-width="8"/>
  
  <!-- Горы Иудеи -->
  <path d="M680,680 L720,620 L760,690 L800,640 L840,710" fill="none" stroke="#3a3224" stroke-width="14" stroke-opacity="0.5"/>
  
  <!-- Горы Заиорданья -->
  <path d="M1180,580 L1240,520 L1300,590 L1360,530 L1420,600" fill="none" stroke="#3a3224" stroke-width="16" stroke-opacity="0.55"/>
  
  <!-- Реки (более тонкие и естественные) -->
  <!-- Нил -->
  <path d="M280,1430 Q320,1180 340,920 Q360,720 380,480" fill="none" stroke="#0f2138" stroke-width="22" stroke-opacity="0.7"/>
  <path d="M280,1430 Q320,1180 340,920 Q360,720 380,480" fill="none" stroke="#162a44" stroke-width="9"/>
  
  <!-- Евфрат -->
  <path d="M1420,280 Q1520,420 1620,580 Q1680,780 1720,980" fill="none" stroke="#0f2138" stroke-width="18" stroke-opacity="0.6"/>
  
  <!-- Иордан -->
  <path d="M780,620 Q820,720 860,860 Q880,1020 840,1180" fill="none" stroke="#0f2138" stroke-width="7" stroke-opacity="0.8"/>
  
  <!-- Береговая линия (более детальная) -->
  <path d="M200,180 Q480,220 820,280 Q1120,320 1380,260 Q1620,310 1900,240" 
        fill="none" stroke="#1a2a3f" stroke-width="3" stroke-opacity="0.6"/>
  
  <!-- Тонкие линии берега -->
  <path d="M200,180 Q480,220 820,280 Q1120,320 1380,260 Q1620,310 1900,240" 
        fill="none" stroke="#0a1629" stroke-width="1" stroke-opacity="0.9"/>

  <!-- Дополнительные детали для телевизора -->
  <!-- Лёгкая текстура суши -->
  <g opacity="0.08">
    <circle cx="420" cy="480" r="180" fill="#3a3224"/>
    <circle cx="980" cy="620" r="240" fill="#3a3224"/>
    <circle cx="1340" cy="440" r="160" fill="#3a3224"/>
  </g>
</svg>
