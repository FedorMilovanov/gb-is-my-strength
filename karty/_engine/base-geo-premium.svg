<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1430" viewBox="0 0 1900 1430">
  <defs>
    <!-- Богатые градиенты -->
    <linearGradient id="seaDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08141f"/>
      <stop offset="40%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#0f2138"/>
    </linearGradient>
    
    <linearGradient id="landBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c261b"/>
      <stop offset="100%" stop-color="#1f1a12"/>
    </linearGradient>
    
    <!-- Текстура пустыни (более детальная) -->
    <pattern id="sandTexture" patternUnits="userSpaceOnUse" width="120" height="120">
      <rect width="120" height="120" fill="#2a2418"/>
      <circle cx="18" cy="22" r="1.2" fill="#3a3224" opacity="0.5"/>
      <circle cx="72" cy="45" r="0.9" fill="#3a3224" opacity="0.45"/>
      <circle cx="38" cy="88" r="1.4" fill="#3a3224" opacity="0.55"/>
      <circle cx="95" cy="65" r="0.8" fill="#3a3224" opacity="0.4"/>
    </pattern>
    
    <!-- Лёгкий рельеф -->
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#322b20"/>
      <stop offset="100%" stop-color="#252016"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="1900" height="1430" fill="#070a10"/>

  <!-- Средиземное море -->
  <path d="M0,0 Q520,140 980,95 Q1480,70 1900,185 L1900,0 Z" fill="url(#seaDeep)"/>
  
  <!-- Красное море (включая Акабу) -->
  <path d="M780,580 Q920,750 1040,920 Q1100,1100 960,1240 Q820,1320 700,1210 Q660,980 780,580" fill="#0a1a2e"/>
  
  <!-- Основная суша -->
  <path d="M180,160 Q520,210 880,270 Q1200,310 1480,245 Q1720,295 1900,220 L1900,1430 L0,1430 L0,160 Z" fill="url(#landBase)"/>
  
  <!-- Пустыня Синай + Негев (с текстурой) -->
  <path d="M780,580 Q920,750 1040,920 Q960,1240 700,1210 Q660,980 780,580" fill="url(#sandTexture)"/>
  
  <!-- Горы Синай (детализированные хребты) -->
  <g opacity="0.7">
    <path d="M920,780 L960,710 L1000,770 L1040,720 L1080,790" fill="none" stroke="#3a3224" stroke-width="22"/>
    <path d="M920,780 L960,710 L1000,770 L1040,720 L1080,790" fill="none" stroke="#2a2418" stroke-width="9"/>
    <path d="M980,820 L1020,760 L1060,810 L1100,750" fill="none" stroke="#3a3224" stroke-width="16"/>
  </g>
  
  <!-- Горы Иудеи -->
  <g opacity="0.6">
    <path d="M640,640 L680,580 L720,650 L760,590 L800,660" fill="none" stroke="#3a3224" stroke-width="18"/>
    <path d="M640,640 L680,580 L720,650 L760,590 L800,660" fill="none" stroke="#2a2418" stroke-width="7"/>
  </g>
  
  <!-- Горы Заиорданья (более высокие) -->
  <g opacity="0.65">
    <path d="M1160,520 L1220,450 L1280,530 L1340,470 L1400,550" fill="none" stroke="#3a3224" stroke-width="24"/>
    <path d="M1160,520 L1220,450 L1280,530 L1340,470 L1400,550" fill="none" stroke="#2a2418" stroke-width="10"/>
  </g>
  
  <!-- Нил -->
  <path d="M260,1430 Q310,1120 340,880 Q370,620 400,380" fill="none" stroke="#0a1a2e" stroke-width="26" opacity="0.75"/>
  <path d="M260,1430 Q310,1120 340,880 Q370,620 400,380" fill="none" stroke="#162a44" stroke-width="11"/>
  
  <!-- Евфрат -->
  <path d="M1380,240 Q1500,400 1620,580 Q1700,820 1740,1020" fill="none" stroke="#0a1a2e" stroke-width="22" opacity="0.65"/>
  
  <!-- Иордан -->
  <path d="M760,580 Q800,720 840,880 Q860,1040 820,1200" fill="none" stroke="#0a1a2e" stroke-width="8" opacity="0.85"/>
  
  <!-- Береговая линия (более живая) -->
  <path d="M180,160 Q520,210 880,270 Q1200,310 1480,245 Q1720,295 1900,220" 
        fill="none" stroke="#1a2a3f" stroke-width="4" opacity="0.5"/>
  <path d="M180,160 Q520,210 880,270 Q1200,310 1480,245 Q1720,295 1900,220" 
        fill="none" stroke="#0a1629" stroke-width="1.5" opacity="0.9"/>

  <!-- Лёгкая атмосферная дымка на горизонте -->
  <rect x="0" y="0" width="1900" height="280" fill="#0a1629" opacity="0.25"/>
  
  <!-- Тонкие детали рельефа -->
  <g opacity="0.12">
    <circle cx="480" cy="520" r="220" fill="#3a3224"/>
    <circle cx="1120" cy="680" r="280" fill="#3a3224"/>
    <circle cx="1480" cy="420" r="190" fill="#3a3224"/>
  </g>
</svg>
