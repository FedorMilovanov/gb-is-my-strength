<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1430" viewBox="0 0 1900 1430">
  <defs>
    <linearGradient id="seaDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08141f"/>
      <stop offset="35%" stop-color="#0a1a2e"/>
      <stop offset="100%" stop-color="#0f2138"/>
    </linearGradient>
    
    <linearGradient id="landBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c261b"/>
      <stop offset="100%" stop-color="#1f1a12"/>
    </linearGradient>
    
    <pattern id="sandTexture" patternUnits="userSpaceOnUse" width="140" height="140">
      <rect width="140" height="140" fill="#2a2418"/>
      <circle cx="22" cy="28" r="1.3" fill="#3a3224" opacity="0.5"/>
      <circle cx="85" cy="52" r="1.0" fill="#3a3224" opacity="0.45"/>
      <circle cx="45" cy="102" r="1.5" fill="#3a3224" opacity="0.55"/>
      <circle cx="118" cy="78" r="0.9" fill="#3a3224" opacity="0.4"/>
      <circle cx="65" cy="18" r="1.1" fill="#3a3224" opacity="0.48"/>
    </pattern>
    
    <!-- Рельефные горы -->
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3a3224"/>
      <stop offset="100%" stop-color="#252016"/>
    </linearGradient>
  </defs>

  <rect width="1900" height="1430" fill="#070a10"/>

  <!-- Средиземное море -->
  <path d="M0,0 Q520,140 980,95 Q1480,70 1900,185 L1900,0 Z" fill="url(#seaDeep)"/>
  
  <!-- Красное море + залив Акаба -->
  <path d="M760,560 Q920,740 1060,920 Q1120,1120 940,1260 Q800,1340 680,1220 Q640,960 760,560" fill="#0a1a2e"/>
  
  <!-- Основная суша -->
  <path d="M160,150 Q520,200 900,260 Q1220,300 1500,235 Q1740,285 1900,210 L1900,1430 L0,1430 L0,150 Z" fill="url(#landBase)"/>
  
  <!-- Пустыня Синай -->
  <path d="M760,560 Q920,740 1060,920 Q940,1260 680,1220 Q640,960 760,560" fill="url(#sandTexture)"/>
  
  <!-- Горы Синай (много хребтов) -->
  <g opacity="0.72">
    <!-- Основной хребет -->
    <path d="M900,760 L950,680 L1000,750 L1050,700 L1100,780" fill="none" stroke="#3a3224" stroke-width="26"/>
    <path d="M900,760 L950,680 L1000,750 L1050,700 L1100,780" fill="none" stroke="#252016" stroke-width="11"/>
    
    <!-- Второй хребет -->
    <path d="M960,810 L1010,740 L1060,800 L1110,750" fill="none" stroke="#3a3224" stroke-width="18"/>
    <path d="M960,810 L1010,740 L1060,800 L1110,750" fill="none" stroke="#252016" stroke-width="7"/>
    
    <!-- Третий хребет -->
    <path d="M1020,850 L1070,790 L1120,840" fill="none" stroke="#3a3224" stroke-width="14"/>
  </g>
  
  <!-- Горы Иудеи -->
  <g opacity="0.65">
    <path d="M620,620 L670,550 L720,630 L770,570 L820,650" fill="none" stroke="#3a3224" stroke-width="20"/>
    <path d="M620,620 L670,550 L720,630 L770,570 L820,650" fill="none" stroke="#252016" stroke-width="8"/>
  </g>
  
  <!-- Горы Заиорданья (мощные) -->
  <g opacity="0.68">
    <path d="M1140,500 L1210,420 L1280,510 L1350,430 L1420,520" fill="none" stroke="#3a3224" stroke-width="28"/>
    <path d="M1140,500 L1210,420 L1280,510 L1350,430 L1420,520" fill="none" stroke="#252016" stroke-width="12"/>
    <path d="M1200,560 L1260,490 L1320,560" fill="none" stroke="#3a3224" stroke-width="16"/>
  </g>
  
  <!-- Нил -->
  <path d="M240,1430 Q300,1100 340,860 Q380,600 420,360" fill="none" stroke="#0a1a2e" stroke-width="28" opacity="0.75"/>
  <path d="M240,1430 Q300,1100 340,860 Q380,600 420,360" fill="none" stroke="#162a44" stroke-width="12"/>
  
  <!-- Евфрат -->
  <path d="M1360,220 Q1500,390 1640,580 Q1720,840 1760,1040" fill="none" stroke="#0a1a2e" stroke-width="24" opacity="0.65"/>
  
  <!-- Иордан -->
  <path d="M740,560 Q790,720 840,900 Q870,1080 810,1220" fill="none" stroke="#0a1a2e" stroke-width="9" opacity="0.85"/>
  
  <!-- Береговая линия -->
  <path d="M160,150 Q520,200 900,260 Q1220,300 1500,235 Q1740,285 1900,210" 
        fill="none" stroke="#1a2a3f" stroke-width="5" opacity="0.45"/>
  <path d="M160,150 Q520,200 900,260 Q1220,300 1500,235 Q1740,285 1900,210" 
        fill="none" stroke="#0a1629" stroke-width="2" opacity="0.85"/>

  <!-- Атмосферная дымка сверху -->
  <rect x="0" y="0" width="1900" height="240" fill="#0a1629" opacity="0.22"/>
  
  <!-- Тонкий рельефный шум -->
  <g opacity="0.1">
    <circle cx="460" cy="540" r="240" fill="#3a3224"/>
    <circle cx="1080" cy="720" r="300" fill="#3a3224"/>
    <circle cx="1520" cy="440" r="210" fill="#3a3224"/>
  </g>
</svg>
